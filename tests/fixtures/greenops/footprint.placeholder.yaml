methodology:
- title: Compute
  body: Read from cloud vendor billing exports, split by service tag (hosting, ingestion,
    search, model inference).
- title: Electricity
  body: vCPU- and GPU-hours converted with vendor power-draw specs, then apportioned
    by EPA eGRID subregion carbon-intensity factors for where each workload runs.
- title: Water
  body: Modeled from the electricity figure using published Water Usage Effectiveness
    (WUE) benchmarks — our provider's facility cooling, attributed to us by billed
    IT load, plus the water consumed upstream to generate the power delivered. We
    operate no data center.
sources:
- cloud billing export FY26
- EPA eGRID subregion SRVC factors 2025
- EPRI / Uptime Institute WUE benchmarks 2024
basis: illustrative
