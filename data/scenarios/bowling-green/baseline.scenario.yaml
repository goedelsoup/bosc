  - node:
      id: bowling-green-wpc
      name: Bowling Green Water Pollution Control
      role: wwtp
      receiving_water: Poe Ditch (Bowling Green WPC outfall, RM 2.5)
      lat: 41.385022
      lon: -83.611078
    inflow: null
    consumptive_use: null
    return_flow:
      value: 15.472287516513326
      unit: cfs
      source: document
      citation: 'bowling-green-wpc (10.0 MGD design) — Ohio EPA "Fact Sheet for NPDES
        Permit" 2PD00009*TD for the City of Bowling Green Water Pollution Control,
        901 N. Dunbridge Rd, Wood County (application OH0024139) — outfall 2PD00009001
        to Poe Ditch at River Mile 2.5 (Ohio EPA river code 16-108, HUC 04100010-03-01),
        which a short distance downstream enters the North Branch Portage River at
        River Mile 8.56 (river code 16-007) → Portage River → Lake Erie. Facility
        description (pp. 6-7) gives the average design flow as 10 MGD with a 30 MGD
        peak hydraulic capacity, a 4.0 MG equalization basin and 0.5 MGD of infiltration/inflow,
        serving ~32,000 people across Bowling Green and the Villages of Portage and
        Rudolph. Table 12 "Instream Conditions and Discharger Flow" (p. 30 of 35)
        gives the discharger flow as 15.47 cfs (10 MGD, basis NPDES Application Form
        2A) against an annual 7Q10 of 0.364 cfs, 1Q10 0.285, summer 30Q10 0.626, winter
        30Q10 1.48, 90Q10 0.865 and harmonic mean 3.233 — all drainage-area-adjusted
        from USGS gage 04195500 (Portage River at Woodville) over 1951-97, with average
        and maximum mixing assumptions of 25% and 100%. The resulting dilution ratio
        is 0.024:1 — about 42x effluent dominance. Poe Ditch is designated a Limited
        Resource Water, but the criteria applied to this discharge are the NORTH BRANCH
        PORTAGE RIVER''s (Warmwater Habitat, Primary Contact Recreation): "Water quality
        criteria associated with these uses are applied to Bowling Green WPC to be
        protective of this higher quality stream." Poe Ditch itself is not monitored
        under this permit. Source data/documents/oepa/bowling-green/2PD00009.fs.pdf;
        structured read data/extracted/oepa/bowling-green/2PD00009.fs.npdes.yaml.
        [verified]'
      confidence: high
      asof: null
      low: null
      high: null
    stormwater: null
  tier: tier0
  warnings:
