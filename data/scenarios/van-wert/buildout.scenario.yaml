        Carried central at the announced 500 MW ceiling per #1402 (like the Bowling
        Green disclosed-peak precedent, #1435): 500 is an ''up to''/campus-draw ceiling,
        so treating it as the IT load makes downstream figures (facility_draw = IT
        x PUE, then x load factor) run conservative-high. The low bound reads the
        same ''up to 500 MW'' as the ALL-IN campus/grid-interconnection draw and divides
        out the cooling-dominated PUE ceiling (the announced-ceiling screen, watermark.facility.screening
        — #1629): 500 / 1.43 ~= 349.7 MW implied IT load — the bracket (349.7-500
        MW) thus spans the campus-total-vs-IT-only interpretive ambiguity. No floor-area
        screen is possible (gross floor area is not disclosed, unlike Urbana #1327
        / Troy-Piqua #1482 / Bowling Green #1435). Replace with the disclosed load
        when an OEPA air PTI, a PJM interconnection filing, or the AEP Ohio load contract
        (PUCO tariff 24-508-EL-ATA) surfaces it; the AEP Ohio Transco Van Wert-Haviland
        138 kV LON (OPSB 25-0697-EL-BLN, $45M, in-service Dec 2026) is a [reference]
        transmission signal whose stated need is generic (#1401). TWO COMMITTED INSTRUMENTS
        NOW DATE THE ABSENCE rather than merely failing to find a source. (1) The
        air PTI does not exist yet ON THE APPLICANT''S OWN CERTIFICATION: the campus''s
        construction-stormwater NOI, signed under penalty of law 2026-07-21, answers
        the Ohio EPA permit-status field ''PTI: YET_TO_APPLY'' (data/extracted/oepa/van-wert/2GC08872.noi.npdes.yaml).
        That converts ''no PTI found'' from an unsuccessful search into a dated, instrument-grade
        negative — it does NOT promise a filing, and it does not establish that one
        is required. (2) AEP Ohio addressed Council on the record with ''>30,000 MW''
        of early interest against 5,342 MW under signed agreements and stated NO megawatt
        figure for this campus (#1401). Neither instrument discloses a load, which
        is exactly why this stays a [reference] bracket.'
