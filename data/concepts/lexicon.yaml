# data/concepts/lexicon.yaml — the wiki term-harvest lexicon (#1565 / epic #1560, A1+A2)
#
# The curated seed of *undefined* domain terms the platform's prose leans on. `watermark
# term-backlog` scans each site's investigative prose (plus the shared docs/skills/method layer)
# for these terms and reports the ones NOT yet defined under data/concepts/ — a per-site,
# density-ranked backlog that drove A2 (#1566, batch-author concepts).
#
# **A term lives in exactly one place.** While it is undefined it sits here and drives the
# backlog; the moment its concept lands under data/concepts/ the entry moves *out* of this file
# into that concept's frontmatter (title/aliases). The `terms` list and the glossary are kept
# disjoint by a guard test (test_term_backlog.test_committed_lexicon_parses_and_avoids_defined_terms),
# so re-adding a defined term here is a build error, not a harmless duplicate. A2 authored the 68
# terms that appeared in prose; what remains below is the seed vocabulary not yet seen in the
# corpus — grow it as new terms surface.
#
# This is a *seed* list, not a closed one: the harvest also runs a mechanical acronym-discovery
# pass over the same prose and emits anything uppercase-and-undefined into each backlog's
# `candidates:` bucket. Promote the good candidates into `terms:` here (then author them as
# concepts, which moves them back out); drop the noise into `stopwords:` below.
#
# Keep `note:` factual and non-fabricated — it is an authoring hint, not a published definition.
# Expansions are the public, well-known ones; cite specifics in the concept body, not here.
# `kind:` is concept | term | method (mirrors the concept frontmatter).

terms:
  # --- land use / local finance ---------------------------------------------------------------
  - term: special assessment
    kind: concept
    tags: [land-use, finance]
    note: A charge levied on benefited parcels to fund a public improvement, distinct from general taxes.

# Uppercase tokens the acronym-discovery pass must never surface as candidates: units, file
# formats, geography/direction, transcript boilerplate, and project scaffolding. Compared
