# ==============================================================================================
# INTERNAL DEFECTS — things the instrument does not reconcile with itself. The dates and text are
# [verified]; reading them as a tension is [inference], and neither is a finding about compliance.
# ==============================================================================================
document_defects:
- id: appendix-a-milestone-j
  tag: verified
  what: >-
    Appendix "A" fixes the interim-limits period as lasting "until the date that the improved
    wastewater treatment works are to attain operational level as specified in milestone (j),
    Article V of this Consent Order". Article V is lettered (a) through (g). There is no
    milestone (j).
  effect: >-
    Appendix "A" has no working terminus of its own. Art. IV.B independently ends the interim
    period on 1994-10-03, which is the date recorded in `interim_limits.applies_until` — but the
    two provisions arrive at it by different mechanisms and only one of them functions. Most
    likely a lettering carry-over from a template with a longer schedule.
- id: final-standards-before-the-schedule-requires-them
  tag: inference
  what: >-
    Art. IV.C enjoins the Village to "meet the final effluent standards set forth in its NPDES
    permit" AFTER 1994-10-03, while Art. V(g) does not require it to "attain compliance with final
    effluent limitations" until 1995-05-01, and Art. V(f) allows construction of the treatment
    facilities needed to get there to run to 1995-04-03.
  effect: >-
    On the face of the instrument there is a roughly seven-month window (1994-10-03 to 1995-05-01)
    in which the injunction demands the final standards while the construction schedule still
    permits the plant that would achieve them to be unbuilt. Art. XI.B prices failure at the V(g)
    milestone 2.5x to 5x higher than the construction milestones, which is consistent with V(g)
    being the operative deadline. This is a reading of the text, not a finding that the Village
    was out of compliance in that window — the corpus holds no DMR or docket evidence either way.
- id: stipulated-penalty-tier-overlap
  tag: verified
  what: >-
    In Art. XI.A the second tier runs "from thirty-one (31) to sixty days (60)" at $200/day and the
    third runs "from sixty (60) to ninety (90) days" at $300/day. Day 60 falls in both tiers.
  effect: >-
    A one-day ambiguity in the construction-milestone penalty schedule. Art. XI.B, the compliance
    schedule, is drafted cleanly ("over sixty (60) days") and has no overlap.

# ==============================================================================================
open_targets:
- >-
  The 1989 Complaint in Adams County C.P. 89-CIV-228 — the only place the alleged violations are
  itemized. Not in corpus.
- >-
  NPDES permit 0PC00019*CD as it stood in 1993, and its final effluent limitations. The order
  binds the Village to limits it does not reproduce, so the Appendix "A" interim table cannot be
  compared to the final standards from these bytes alone.
- >-
  The Facilities Plan submitted to Ohio EPA on 1992-05-26 — the engineering scope Art. V orders
  built. Not in corpus.
- >-
  ALL post-1993 docket activity in 89-CIV-228: milestone reports under Art. VII, any stipulated-
  penalty demand, any motion to terminate, any modification. The AG publishes the entered order
  only. The Adams County Clerk of Courts is the route.
- >-
  Whether the 1995-04-03 construction and 1995-05-01 compliance milestones were met, and whether
  the sanitary-sewer overflows and bypasses Art. V ordered eliminated were in fact eliminated.
  A current-day answer would come from the plant's NPDES record (0PC00019 / US EPA OH0028088)
  and EPA ECHO, neither of which is pulled for this site yet.
- >-
  The rest of the Ohio AG Environmental Enforcement Section's published consent-order library.
  It is served as flat files under a Consent-Orders path with no index or listing endpoint, so
  enumeration needs a discovery step; several registered sites likely have instruments there.

relevance:
  tags: [verified, enforcement, consent-order, wastewater, npdes, sso, bypass, west-union,
    adams-county, ohio-ag, rc-6111, record-domain]
  note: >-
    The FIRST record in the West Union corpus — the site stood at `backdrop` tier with zero
    extractions (epic 1278). What it establishes, on a judge-signed instrument: the Village's WWTP
    and sewer system (NPDES 0PC00019*CD, Ohio EPA Southeast District) were under a state
    water-pollution injunction from 1993-06-29, carrying interim effluent limits, a $5,000 penalty,
    a court-ordered obligation to ELIMINATE all sanitary-sewer overflows and bypasses, and a
    plant-improvement schedule running to 1995-05-01 — with jurisdiction retained and no
    termination provision. That is a documented capacity-and-enforcement history for the only
    municipal POTW on record at this watershed point.
    NOT established, and deliberately not asserted: any receiving water (the order never names
    one — the profile's Beasley Fork attribution comes from the Ohio EPA NPDES service, not from
    here); any link to data-center development (West Union has NO identified development site, and
    the profile is explicit that it stays [open] until one is); and any statement about whether
    the order was ever satisfied.
  reconciliation: >-
    The Appendix "A" loading basis of 0.6 MGD (1993) sits below the 0.7 MGD design flow the
    SiteProfile carries for the West Union WWTP from the Ohio EPA NPDES service. These are
    different quantities measured 30+ years apart — a 1993 interim average-loading basis versus a
    present-day design flow — and the gap is NOT evidence of an expansion. The Art. V improvements
    are described only by reference to the 1992 Facilities Plan, which is [open]; nothing in these
    bytes states a before-or-after plant capacity. Do not present 0.6 -> 0.7 as a capacity change.
  cross_refs:
  - data/extracted/regulatory/wastewater-enforcement-history.yaml   # the Allen County peer: 1996 federal CWA consent decree + 2005 SSO-elimination agreement, same genre, different watershed point
  - data/documents/regulatory/allen-co-cwa-consent-decree-1996.pdf  # the corpus's other consent instrument — a useful contrast: $100,000 penalty and an explicit 12-consecutive-compliant-months termination test
  - data/extracted/west-union/ONBOARDING.md                          # the site's review gate; the record domain was unchecked before this
