# ==============================================================================================
# WHAT THE STATE ALLEGED — [reference]. Recited in Art. III.A and resolved, not adjudicated.
# ==============================================================================================
alleged_violations:
  as_pleaded: >-
    That the Village "has operated its wastewater treatment plant and sewer system in such a manner
    as to result in numerous violations of the discharge limitations and monitoring requirements of
    its National Pollutant Discharge Elimination System ('NPDES') permit issued by the Director of
    Environmental Protection ... and in violation of the water pollution control laws of the State
    of Ohio, i.e., RC Chapter 6111. and the rules adopted thereunder." (Art. III.A)
  tag: reference
  note: >-
    No violation is itemized, dated or quantified anywhere in the instrument — no outfall
    exceedance table, no overflow count, no monitoring-lapse list. The 1989 Complaint would carry
    them and is [open]. What the order DOES establish independently of the allegation is the remedy
    it imposes: Art. V orders the Village "to eliminate discharges from overflows and bypasses from
    its sanitary sewer system", which is relief the court entered, not a pleading.

# ==============================================================================================
