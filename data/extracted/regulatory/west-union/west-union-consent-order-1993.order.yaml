# Outfall 0PC00019001. Blank cells in the source are recorded as null: the parameter is MONITORED
# with no numeric limit, which is not the same as a limit of zero and must not be read as one.
# ==============================================================================================
interim_limits:
  outfall: 0PC00019001
  applies_from: '1993-06-29'
  applies_until: '1994-10-03'   # from Art. IV.B; Appendix A's own terminus is defective — see document_defects
  status_disclaimer: >-
    "The interim effluent limits contained in Appendix 'A' do not constitute an NPDES permit for a
    modification of any existing permit." (Art. IV.B, as printed)
  loading_basis_mgd: 0.6        # footnote: "The average effluent loading limitations are established using the following flow value: 0.6 MGD."
  document_control: 0280E
  parameters:
  - {code: '00010', parameter: Temperature, units: deg C, limit_30day: null, limit_7day: null,
     measurement_frequency: Daily, sample_type: '(Max.) Ind. Therm.'}
  - {code: '00530', parameter: Suspended Solids, units: mg/l, limit_30day: 30, limit_7day: 45,
