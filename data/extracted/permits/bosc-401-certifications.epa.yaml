withdrawal:
  source: data/documents/permits/bistrozzi-permits/4011312.pdf
  date: '2026-02-18'
  from: Melissa Queen Darby, EMH&T
  to: Joseph Loucek, Ohio EPA
  copied:
    ohio_epa: [Rachel Secrest, EPA DSW Permits Processing, EPA eBusiness Center]
    applicant_side: [EMH&T (Jeremy Eisele, Allison Ansari)]
    other: >-
      A google.com address and a vorys.com address are on the cc line. Recorded as ORGANISATIONS —
      Google and Vorys, Sater, Seymour and Pease — because who is copied on a filing is the fact
      that matters here; naming the individuals is a #274/#281 publication decision, not an ingest
      side effect, and no person record is created by this extraction.
  quote: >-
    "At this time, Bistrozzi LLC wishes to withdraw the Level 2 Isolated Wetland Permit application
    for Project Bosc. After additional coordination with AEP, it was ultimately determined that the
    alignment of the high voltage corridor to the onsite substation could be revised so as to fully
    avoid impacts to Wetland A. Therefore, this permit is no longer necessary for the project."
  what_it_establishes:
  - '[verified] The disposition of DSW401252260W: withdrawn 2026-02-18, by the applicant.'
  - '[verified] An ON-SITE SUBSTATION is part of the project, and a HIGH VOLTAGE CORRIDOR runs to
    it. The applicant states this to a regulator, in writing, on a dated public record.'
  - '[verified] AEP coordination drove a route change on the campus. This is the first
    primary-source, dated statement in this corpus that ties AEP to the campus''s own layout — the
    Lyka transmission attribution has stood at [inference] since #1476.'
  what_it_does_not_establish:
  - The revised alignment itself — no route drawing, easement or AEP filing is in the corpus.
  - The substation's capacity, ownership, or interconnection status.
  - That Ohio EPA processed the withdrawal; no acknowledgement is held.
  - Any connection to the OPSB case docket, which as of the corpus's last check had not been filed.

geography:
  source: data/documents/permits/bistrozzi-permits/3702680.pdf
  finding: >-
    [verified] The campus's own FEMA flood-insurance exhibit is titled "AMERICAN AND SUGAR CREEK
    TOWNSHIPS, ALLEN COUNTY, OHIO" and spans N Cole St, W Bluelick Rd, Irvin Rd, Beery Rd,
    Hopewell St and Thorndyke Dr.
  why_it_matters: >-
    The corpus's zoning and comprehensive-plan work reads American Township's instruments for this
    site. If the footprint reaches into Sugar Creek Township, a second jurisdiction's zoning
    resolution may bind part of it. [open] — this exhibit shows the MAP EXTENT, which is not the
    same as the parcel footprint, and settling it needs the parcel geometry rather than a
    title block.

