  key_features:
  - 'Revision (Rev. 1) to DSWPTI-260294: design daily flow reduced from 0.333 to 0.10
    MGD; force main and temporary lift station downsized accordingly'
  - Addition of a 6-inch service (1A-SSWR-0050 sheet 1A-C-5110)
  - System includes 7,819 LF gravity sewer (6"–24" PVC), 4,034 LF sanitary force main
    (6" PVCO AWWA C900), 35 manholes, 1 Flow Split Junction structure, and 2 ten-foot-diameter
    wet wells
  - 'Receiving facility: American/Bath WWTP (present ADF 0.953 MGD; design ADF 1.500
    MGD – adequate capacity confirmed)'
  - 'Sewer types: conventional gravity and force main (with pump station)'
  - No stream crossings; no parallel stream runs; no wetlands disturbed; not within
    1,000 ft of designated scenic river
  - Plans prepared by EMH&T; PE stamp required per OAC 3745-42-03(A)(1)
  - 'Testing: air leakage test for sewer, flexible pipe deflection testing per GLUMRB
    33.85, manhole testing ASTM C1244 – all referenced to plan sheet 1A-C-5000'
  - 'Manhole design: Precast Reinforced Concrete per ASTM C-478, joints ASTM C-443'
  summary: This record documents the Ohio EPA Surface Water Permit-to-Install (PTI)
    application package for the BOSC-1A Private Sanitary Sewer Improvement Plan –
    Revision 1, submitted on behalf of Bistrozzi LLC (facility) in Allen County, Ohio
    (Project DSW-7312, Secondary ID DSWPTI-260597). The project installs approximately
    7,819 LF of PVC gravity sanitary sewer (6\"–24\"), 4,034 LF of 6-inch PVCO force
    main, 35 precast concrete manholes, one flow-split junction structure, and two
    10-ft-diameter wet wells with an associated temporary lift station, all discharging
    to the American/Bath WWTP. Rev. 1 reduces the design daily flow from 0.333 MGD
    to 0.10 MGD, downsizing the force main and lift station accordingly, and adds
    a 6-inch service connection.
  note: null
