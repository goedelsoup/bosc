    Register notice ("Not Original Document"), not the original Federal Register page image.
    All figures below are transcribed verbatim from that transcription.
  - >-
    The petition designated the ENTIRE Buried Valley Aquifer System (BVAS) across nine
    counties; "Great Miami North" in the source filename is the Ohio-EPA source-water map
    segment label, not a separate designation. WPAFB (Greene + Montgomery) sits within the
    designated area.
