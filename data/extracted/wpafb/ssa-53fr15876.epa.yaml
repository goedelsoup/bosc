source_text_excerpt: >-
  [FRL-3369-5] Buried Valley Aquifer System, Ohio, Sole Source Aquifer Petition; Final
  Determination. AGENCY: U.S. Environmental Protection Agency. ACTION: Notice of final
  determination. SUMMARY: Notice is hereby given that, pursuant to section 1424(e) of the
  Safe Drinking Water Act, the U.S. Environmental Protection Agency (EPA) Region V
  Administrator has determined that the Buried Valley Aquifer System of the Great
  Miami/Little Miami River Basins of Southwestern Ohio ... is the sole or principal source
  of drinking water in the petitioned area ... The BVAS currently serves as the "sole
  source" of drinking water for approximately 920,600 residents of Preble, Dark, Champaign,
  Miami, Montgomery, Logan, Clark, Greene and Shelby Counties. ... Dated: April 14, 1988.
  Valdas V. Adamkus. Regional Administrator. [FR Doc. 88-9103 Filed 5-3-88; 8:45 am]
