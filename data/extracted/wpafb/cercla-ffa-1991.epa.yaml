source_text_excerpt: >-
  FEDERAL FACILITY AGREEMENT UNDER CERCLA SECTION 120 — UNITED STATES ENVIRONMENTAL PROTECTION
  AGENCY REGION V AND THE UNITED STATES DEPARTMENT OF THE AIR FORCE ... In the Matter of: The
  U.S. Department of the Air Force, Wright-Patterson Air Force Base, Ohio. ... (a) WPAFB is
  located in the Miami River Valley Basin northeast of the City of Dayton, Ohio and covers
  approximately 8,200 acres divided between "Areas A and C" and "Area B" ... (b) WPAFB overlies
  a portion of the Miami Buried Valley Aquifer which is the source of potable water for WPAFB
  and the Cities of Dayton and Fairborn ... (e) ... at least 58 waste disposal sites ... (g)
  Three WPAFB well fields, which contain seventeen (17) drinking water-supply wells ... (h) The
  17 WPAFB drinking water supply wells contain ... volatile organic compounds (VOCs):
  tetrachloroethylene; trichloroethylene; carbon tetrachloride; 1,1,1-trichloroethane;
  chloroform; 1,2-dichloroethylene and toluene ... This Agreement is based upon the placement of
  the Wright Patterson Air Force Base (WPAFB), Greene and Montgomery County, on the National
  Priorities List (NPL) by the Environmental Protection Agency on October 4, 1989, 54 Federal
  Register 191 at page 41021.
