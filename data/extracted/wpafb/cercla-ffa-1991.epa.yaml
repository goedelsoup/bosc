    directly to the Miami Buried Valley Aquifer — the SAME sole-source aquifer designated at 53
    FR 15876 (see ssa-53fr15876.epa.yaml). This is the [verified] primary instrument behind the
    WPAFB profile's TCE/PFAS-plume receiving-water dimension.

