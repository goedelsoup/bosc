# Reviewed transcription of Ohio EPA's application-completeness letter for the Apollo
# Power Generation Facility air permit, read from the captured PDF's own text layer.
#
# A two-page administrative letter that turns out to date two things the public
# record later argued about: when the application was filed, and when lawful site
# preparation could begin.
