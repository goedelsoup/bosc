source_text_excerpt: >-
  "December 8, 2025 / Transmitted Electronically / Andy Woerner / Will-Power OH LLC -
  Apollo / 2000 Commerce Dr. / Pittsburgh, Pennsylvania 15275 ... Re: Wood County /
  Will-Power OH LLC - Apollo / Facility ID # 0387022027 / P0139272 received on
  12/05/2025 ... the Northwest District Office (NWDO) received your application for a
  Permit-to-Install or Permit-to-Install and Operate (PTI/PTIO) for air pollution
  sources and has determined that the application is preliminarily and
  administratively complete. This determination does not imply that the application
  is approvable ... Clinton Reed, Ohio EPA - DAPC"

