write_up_defects:
  tag: '[verified]'
  note: >-
    Two errors in the Permit Strategy Write-Up bound into the draft. One was raised
    by a commenter and conceded by the agency; the other was not raised by anyone and
    is recorded here for the first time. Neither appears to change a permitted limit,
    and neither is presented as though it does.
  line_heater_count:
    raised_by: a commenter
    statement: >-
      Comment 23 asked: "The narrative paragraph in the Permit Strategy Write-Up
      specifies 21 sources and Table 1 specifies 22 – which is it?" Response 23: "Ohio
      EPA agrees that there was a typographical error in the Permit Strategy Write Up
      (PSWU). This document was issued with the draft PTI and has been corrected
      internally. There are 22 line heater sources." Note "corrected internally" — the
      corrected write-up was not re-noticed, and the draft as published to the public
      still carries the error.
  facility_id_mismatch:
    raised_by: nobody in the captured record
    statement: >-
      THE WRITE-UP'S PAGE HEADER CARRIES A DIFFERENT FACILITY'S ID. On both Permit
      Strategy Write-Up pages (PDF pages 3 and 4) the header block reads "Permit
      Number: P0139272 / Facility Name: Will-Power OH LLC - Apollo / Facility ID:
      0145000615". Apollo's facility ID is 0387022027, which appears correctly on 81
      other pages of this same draft and on every page of the final. 0145000615 is
      the Ohio EPA facility ID of WILL-POWER OH LLC - PLATO NORTH in Licking County —
      a sibling facility of the same applicant, independently identified from the
      agency's own eDocument index. Two of the three identifiers in the header are
      Apollo's; only the ID is wrong.
    verification: >-
      Confirmed by rendering PDF page 3 at 170 dpi and reading the header visually,
      because this file's text layer is OCR and a digit-level claim cannot rest on it.
      The rendered header reads exactly as quoted.
    what_it_is_and_is_not:
      tag: '[inference]'
      statement: >-
        This looks like a template header carried over from the Plato North write-up
        — the same author, the same document type, an adjacent project. It is a
        transcription defect on the analysis memorandum, not on the permit: the
        authorization, the emissions-unit list and every enforceable term in both the
        draft and the final carry Apollo's own ID. It does not follow that the
        write-up's ANALYSIS came from Plato North, and that is not claimed. What it
        does establish is that these behind-the-meter permits are being produced from
        one another as a series, which is the same thing the sibling-facility record
        in P0139272.pti.yaml shows from the other direction. Lead
        APOLLO-PSWU-FACILITY-ID.

