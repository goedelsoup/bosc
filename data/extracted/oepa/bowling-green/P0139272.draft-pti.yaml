    - >-
      THIS PDF IS SCANNED, NOT DIGITALLY GENERATED, AND ITS TEXT LAYER IS OCR. It
      renders "Yes" as "Ycs", "CH2O" as "CHZO", "SO2" as "S02" and "PM2.5" as
