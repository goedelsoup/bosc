# Reviewed transcription of the DRAFT Ohio EPA air Permit-to-Install for the Apollo
# Power Generation Facility, and of the Permit Strategy Write-Up bound into it.
#
# Kept as its own record because the draft is where the facility's controlled
# potential-to-emit is actually tabulated — the final permit does not reprint the
# table — and because two defects in the write-up are only visible here.
