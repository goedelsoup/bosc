  corroborating_siting_cases:
    tag: '[verified]'
    statement: >-
      OPSB's gas-fleet case table (produced 2026-07-22) independently lists an "STY
      Power Generation Facility" at 250 MW in Licking County, case 26-0169-EL-BLN,
      approved 2026-06-25 — the same accelerated letter-of-notification track as
      Apollo. The same table carries three further Licking County behind-the-meter
      projects by other developers (PowerConneX I 120 MW, Socrates North 200 MW,
      PowerConneX II 216 MW) and Bluegrass at 800 MW in Fayette County.
  why_it_is_recorded_here:
    tag: '[inference]'
    statement: >-
      Apollo is not a one-off, and the single-source determination at Response 22 is
      the reusable part. A developer standing up dedicated behind-the-meter
      generation beside a hyperscale customer, permitted separately from that
      customer, on an accelerated siting track, in more than one Ohio county at once,
      is a pattern rather than a project — and the Plato South sequence (approved
      2025-11-13, a DENIAL OR REVOCATION action on 2026-06-08, re-approved under a new
