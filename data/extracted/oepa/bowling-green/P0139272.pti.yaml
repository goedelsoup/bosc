major_source_status:
  tag: '[verified]'
  title_v: >-
    MAJOR. Standard Term 12 requires the permittee "to apply for a Title V permit
    pursuant to OAC Chapter 3745-77" and to "submit a complete Title V permit
    application ... within twelve months after commencing operation of the emissions
    units covered by this permit." Emissions-unit Term (4) states plainly: "This
    permit is for an emissions unit located at a Title V facility." The OPSB Staff
    Report says the same: "The proposed project would be classified as a major
    emission source under the Ohio EPA Title V Operating Permit program."
  psd: >-
    NOT MAJOR. Response 21: "For this facility to be subject to PSD, the potential to
    emit must be over 250 tpy of a single criteria pollutant. The facility has the
    potential to emit 234.62 tons of CO, the highest among all criteria pollutants."
    Wood County is in attainment or unclassifiable for all regulated pollutants, so
    NSR applies through PSD rather than nonattainment NSR.
  mact: >-
    NOT MAJOR. Response 15: "Apollo is a stationary source that does not meet the
    definition of a major stationary source for PSD or Maximum Available Control
    Technology (MACT)." The controlled PTE for total HAPs is 24.40 tpy, against the
    25 tpy total-HAP major threshold recited in the OPSB Staff Report's footnote 17.
  margins:
    tag: '[inference]'
    statement: >-
      The arithmetic, which no source states: the facility's highest criteria-
      pollutant PTE clears the 250 tpy PSD threshold by 15.38 tpy — 6.2% of the
      threshold — and its total-HAP PTE clears the 25 tpy MACT-major threshold by
      0.60 tpy, or 2.4%. Both margins are the applicant's own controlled-PTE
      calculations, accepted by the agency. Being under a threshold is lawful and
      ordinary; being under it by 2.4% is worth stating precisely rather than
      rounding away, because the enforceable limits are what hold it there.
  psd_avoidance_tension:
    tag: '[verified]'
    statement: >-
      THE DRAFT'S PERMIT STRATEGY WRITE-UP AND THE FINAL'S RESPONSE TO COMMENTS
      DESCRIBE THE SAME LIMITS DIFFERENTLY, AND BOTH ARE QUOTED HERE RATHER THAN
      RECONCILED. The write-up bound into the draft says: "Will-Power requested
      short-term and long-term BAT limits for NOX, CO and VOC to ensure their
      controlled PTE is legally and practicably enforceable for PSD avoidance."
      Response 21 to the comments says: "Will-Power is not taking synthetic minor
      restrictions, nor is the draft PTI a synthetic minor permit." These are
      reconcilable as a matter of art — a synthetic minor is a restriction that pulls
      an otherwise-major PTE below a threshold, whereas here the controlled PTE is
      said to be below 250 tpy already and the limits make that enforceable — and the
      permit cover's own checklist marks "SYNTHETIC MINOR TO AVOID MAJOR NSR: No."
      But the applicant's stated purpose for requesting the limits was, in the
      agency's own write-up, PSD avoidance. Both sentences are the agency's. Report
      both.

# --- What it is permitted to emit ---------------------------------------------
controlled_pte_tpy:
  tag: '[verified]'
  source: >-
    Table 1 "Controlled PTE (TPY)" in the Permit Strategy Write-Up bound into the
    DRAFT permit (data/documents/oepa/bowling-green/air/edoc-4032135.pdf, p. 3). The
    final permit does not reprint the table, but Response 21 confirms the CO total
    (234.62) unchanged, and Ohio EPA's own hearing deck of 2026-04-08 reprints the
    NOx / CO / PM10-2.5 / VOC / SO2 / HAP row identically. The figures are stated as
    "taking into account the SCR and oxidation catalyst systems on the 27 permitted
    emissions units, 40 startups and 40 shutdowns per year per permitted emissions
    unit, and 500 hours per year of operation of the emergency generators."
  by_pollutant:
    nox: 192.09
    co: 234.62
    voc: 140.57
    pm10_pm25: 139.72
    so2: 197.71
    total_haps: 24.40
    formaldehyde: 13.47
    ammonia: 340.63
  by_unit_group:   # tpy, in the write-up's column order NOx / CO / VOC / PM / SO2 / HAP / CH2O / NH3
    6 Caterpillar G3520 engines:  [19.92, 19.86, 14.70,  5.76,  5.52, 11.46, 4.7400,   5.40]
    10 Solar Titan 130 turbines:  [55.80, 81.00, 45.70, 49.70, 71.90,  3.10, 1.6000, 130.90]
    3 Siemens SGT-A35 turbines:   [30.96, 44.07, 22.11, 24.78, 35.85,  1.53, 0.8100,  63.81]
    6 Siemens SGT-400 turbines:   [28.26, 43.02, 24.54, 25.44, 36.84,  3.54, 2.7600,  64.98]
    2 Siemens SGT-800 turbines:   [31.68, 33.28, 32.62, 32.80, 47.44,  4.48, 3.5400,  75.54]
    22 de minimis line heaters:   [15.37, 12.91,  0.85,  1.17,  0.09,  0.28, 0.0200,   null]
    3 PBR emergency engines:      [10.10,  0.48,  0.05,  0.07,  0.07, 0.009, 0.0007,   null]
  ammonia_is_the_largest_number:
    tag: '[inference]'
    statement: >-
      The single largest mass emission the facility is permitted for is 340.63 tpy of
      AMMONIA — 45% more than the highest criteria pollutant, and it is the slip from
      the selective catalytic reduction systems installed to control NOx. Ammonia is
      not a criteria pollutant and does not count toward any of the three major-source
      tests, so it appears in none of the "major source" arithmetic above. Ohio EPA
      addressed it only as an air toxic (Response 12, Response 30): its predicted
      one-hour maximum ground-level concentration is 30.43 µg/m3 against a maximum
      acceptable ground-level concentration of 414.60 µg/m3, and the agency calls its
      PTE "a very conservative estimate." The observation that the control technology
      is the dominant mass emitter is ours; every figure is the record's.
  emergency_engine_count_discrepancy:
    tag: '[open]'
    statement: >-
      The write-up's PTE table has a row for "3 PBR Emergency Engines" (permit-by-
      rule). The OPSB Staff Report describes TWO emergency units — "two Caterpillar
      C32 diesel generators rated each at up to 1,000 kilowatts" — and Ohio EPA's own
      hearing deck likewise lists "Diesel fired emergency engines (2)". Three sources,
      two counts. The third PBR unit is not identified in anything captured (a fire
      pump engine would be the ordinary candidate, but nothing says so). The
      permit-by-rule units are outside this PTI's emissions-unit list — the permit
      covers P003-P029, the 6 engines and 21 turbines — which is consistent with the
      count differing, but does not explain it. Do not assert either count as the
      facility's emergency-engine total. Lead APOLLO-PBR-ENGINE-COUNT.

controls_and_limits:
  tag: '[verified]'
  controls: >-
    Every generator engine and turbine carries selective catalytic reduction for NOx
    and an oxidation catalyst for CO, VOC and formaldehyde. Response 26 confirms the
    SCR obligation is a permit term: "the requirement to use an SCR on all generator
    engines and turbines."
  startup_shutdown:
    statement: >-
      "Startup and shutdown events shall each be limited to 40 events per rolling,
      12-month period" per emissions-unit group, with separate rolling 12-month
      tonnage caps on the startup/shutdown emissions themselves — e.g. NOx 3.32 t,
      CO 3.31 t, VOC 2.45 t for the Caterpillar engine group; NOx 4.71 t, CO 7.17 t,
      VOC 4.09 t for the SGT-400 group; NOx 15.84 t, CO 16.64 t, VOC 16.30 t plus an
      SO2 cap for the larger group. The permittee must record the rolling 12-month
      startup and shutdown counts and the rolling 12-month NOx, CO and VOC tonnages,
      and report all exceedances.
  cems:
    statement: >-
      Response 25: "NOx CEMs will be installed on multiple groups of turbines, as
      required by 40 CFR Part 60, Subpart KKKKa. The facility is required to conduct
      quarterly calibrations and an annual relative accuracy test audit (RATA). The
      RATA is performed by a third-party contractor, and Ohio EPA will be onsite to
      witness the test." CEMS is NOx-only; compliance for other pollutants is by
      stack test. CEMS results "will be available via public records request" — not
      published, and not real time (Response 9).
  testing:
    statement: >-
      Response 27: the permit "requires emissions testing for NOx, CO, and volatile
      organic compounds (VOCs) for all power-generating engines and turbines."
      Response 14: each engine is tested "every 8,760 hours of operation or every
      three years, whichever comes first," with per-unit runtime monitoring under
      40 CFR 60.4243(b)(2)(iii).
  federal_standards:
    statement: >-
      40 CFR Part 60 Subpart KKKKa (stationary combustion turbines) and Subpart JJJJ
      (spark-ignition internal combustion engines) both apply. Response 13 notes
      Subpart JJJJ Table 1 lets the facility elect between a 1.0 g NOx/HP-hr standard
      and an 82 ppmvd at 15% O2 standard: "There is no direct conversion between the
      two standards, so neither is more stringent than the other." Which one Apollo
      elected is not stated in what was read. The write-up records that Ohio NOx RACT
      under OAC 3745-110-03(E) and (F) does not apply, being "either less stringent
      than or equivalent to" the federal subparts, and that the units are exempt from
      the OAC 3745-18-06(G) SO2 limit under 3745-18-06(A) because they burn only
      natural gas.
  line_heaters:
    statement: >-
      Response 18: the 22 natural-gas line heaters "are considered de minimis because
      each unit emits less than 10 pounds of each criteria pollutant per day, and the
      combined emissions from all line heaters are less than 25 tons of each criteria
      pollutant per year. The highest NOx emissions rate is 14.68 tpy from all line
      heaters combined" (OAC 3745-15-05). Note the de minimis heaters' emissions ARE
      carried into the facility-wide PTE table and into the dispersion modeling.
    nox_total_conflict:
      tag: '[open]'
      statement: >-
        THE TWO OHIO EPA DOCUMENTS GIVE DIFFERENT LINE-HEATER NOx TOTALS. Response 18
        of the final permit says "The highest NOx emissions rate is 14.68 tpy from all
        line heaters combined." Table 1 of the Permit Strategy Write-Up bound into the
        draft gives the "22 De Minimis Heaters" row a NOx figure of 15.37 tpy, and it
        is that 15.37 which is summed into the facility-wide 192.09 tpy NOx total
        recorded under controlled_pte_tpy. The gap is 0.69 tpy. Nothing captured
        reconciles them, and it is not established whether the final response reflects
        a revision the table was not re-run against, or a different basis. Both are
        recorded at their own citations; neither is corrected against the other, and
        no third figure is derived. Note that the conflict does not move any threshold
        — either way the heaters stay under the 10 lb/day and 25 tpy de minimis limits
        that Response 18 applies. Lead APOLLO-LINE-HEATER-NOX.

air_toxics_modeling:
