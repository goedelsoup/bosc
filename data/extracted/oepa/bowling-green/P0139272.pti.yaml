  formaldehyde_margin:
    tag: '[inference]'
    statement: >-
      Formaldehyde is the tightest of the three by a wide margin: the predicted annual
      concentration of 0.129 µg/m3 sits at 16% of its 0.8 µg/m3 alternative acceptable
      concentration, and its predicted one-hour maximum of 12.22 µg/m3 at 25% of 49.
      Ammonia is at 7% of its MAGLC and acetaldehyde at 0.2%. All three pass; the
      ranking is arithmetic on the record's own numbers and is not stated by the
      agency.

# --- The public record the OPSB docket could not supply ------------------------
response_to_comments:
  tag: '[verified]'
  what_it_is: >-
    A 42-comment, 10-topic response block bound into the front of the final permit.
    It is the fullest account available of public opposition to this facility,
    because the siting docket that holds the OPSB comments is access-blocked (see
    data/extracted/grid/bowling-green/apollo-power-generation-facility.yaml). It is
    Ohio EPA's summary of the comments, not the comments themselves — "PDF copies of
    the original comments in the format submitted are available upon request."
  process:
    public_notice_of_draft: '2026-03-05'   # published in the Ohio EPA Weekly Review
    hearing_held: '2026-04-08'
    comment_period_closed: '2026-05-01'
    comment_period_days: 58
    extension: >-
      Response 36: "The comment period was extended from April 15 to May 1." Ohio
      EPA's own hearing deck, printed for the 2026-04-08 session, still says comments
      close April 15 — it predates the extension and is stale on this point. Response
      38: the 58 days were "four additional weeks beyond what is typically required,"
      and a second extension and further hearings were declined.
    attendance:
      tag: '[reference]'
      statement: >-
        Press accounts of the 2026-04-08 hearing give attendance as 58 people in one
        report and approximately 100 in another. No captured primary source states an
        attendance figure. Both numbers are secondary and they disagree.
  the_determinations_that_matter:
    - topic: single-source determination
      tag: '[verified]'
      statement: >-
        Response 22, answering commenters who argued Apollo and the data center
        should be permitted as one source: Ohio EPA applied the 2019 U.S. EPA
        memorandum "Interpreting 'Adjacent' for New Source Review and Title V Source
        Determinations in All Industries Other Than Oil and Gas," whose three
        criteria are same industrial grouping (SIC code), common control or
        ownership, and contiguous or adjacent properties. "Will-Power and the
        adjacent facility do not meet all three criteria for a single-source
        determination and, as such, cannot be considered a single source for
        permitting and compliance purposes." The agency does not say WHICH criteria
        fail. This is the determination that keeps a 350 MW plant built to serve one
        customer, on land beside that customer, from being aggregated with it — and
        it is the mechanism worth following across the network, since the same
        posture is being replicated (see the sibling Will-Power cases below).
    - topic: cumulative impact analysis
      tag: '[verified]'
      statement: >-
        Response 33: "The projected emissions from this project did not exceed the
        regulatory levels that would trigger PSD/NSR modeling, which includes a
        cumulative impact analysis. Because the project remained below these
        thresholds, the broader modeling analyses requested by commenters are not
        required under Ohio's permitting framework." Read together with the 15.38 tpy
        PSD margin, that is the practical consequence of the margin.
    - topic: the data center's waste heat was not modeled
      tag: '[verified]'
      statement: >-
        Response 32, answering whether the modeling accounted for a potential ambient
        temperature increase from the neighboring data center: "The U.S. EPA-approved
        models do not currently have the capability to incorporate forecasted
        temperature changes into the modeling results. If needed, modeling can be
        rerun at a future date." An acknowledged, unquantified gap — and a direct
        cousin of the thermal-load questions this repo tracks on the water side.
    - topic: construction before permit issuance
      tag: '[verified]'
      statement: >-
        Response 37, answering commenters who "referred to the project being pushed
        forward in secret and that construction began before a permit was issued":
        "Ohio EPA does not sign NDAs ... The facility can begin pre-construction
        activities once an application is received and deemed complete, as outlined
        in Ohio Administrative Code (OAC) Rule 3745-31-33." The completeness letter
        of 2025-12-08 captured alongside this permit says the same thing to the
        applicant directly. So site preparation from December 2025 onward was
        lawful under the cited rule. The comment is recorded as a comment; the rule
        citation is the agency's answer, and neither is a finding about what was
        actually built when.
    - topic: air monitoring
      tag: '[verified]'
      statement: >-
        Response 8: "While the Will-Power facility does not currently have a
        dedicated SLAMS monitor, the surrounding regional monitors, including the
        Bowling Green air monitoring site at 347 N. Dunbridge Road (AQS ID
        39-173-0003), are part of a network designed to evaluate compliance with
        NAAQS." Fenceline or real-time monitoring is "not required under current
        federal or state regulations unless specific risk-based criteria are met."
        Note the monitor's address is Ohio EPA's own Northwest District Office —
        the nearest regulatory monitor to the plant sits at the agency's field
        office in the city, not near the source.
    - topic: pipelines are outside this permit
      tag: '[verified]'
      statement: >-
        Response 2: "The natural gas pipelines that serve Williams are not owned by
        Williams. The companies that own each pipeline have been appropriately
        permitted by Ohio EPA, Division of Air Pollution Control. A leak detection
        program for a natural gas-fired power plant is not required, since natural
        gas is used only as a fuel source." This is the only captured statement
        bearing on who owns the gas supply, and it is a negative — not Williams — not
        an identification. The supplier remains open.
    - topic: CO2
      tag: '[verified]'
      statement: >-
        Response 35: "Ohio EPA has limited authority for regulating CO2 emissions
        under the Clean Air Act. Projects subject to CO2 permitting regulations are
        those considered major sources under PSD." The permit therefore contains no
        CO2 limit, and no captured primary source states the facility's CO2 or CO2e
        emissions. The 2.5 million tons per year CO2e figure that appears in press
        coverage of the hearing is a commenter's estimate reported secondhand and is
        NOT in the permit, the write-up's PTE table, or the hearing deck. Do not cite
        it as a permitted or agency figure. Lead APOLLO-CO2E-BASIS.
    - topic: construction stormwater
      tag: '[verified]'
      statement: >-
        Responses 34 and 41: "Ohio EPA's Division of Surface Water issued a
        Construction Stormwater Permit (2GC08564*AG) to the Will-Power site on
        Jan. 4, 2026." This is an Ohio-format coverage number. The ECHO sweep already
        recorded in data/extracted/bowling-green/water-watch.yaml carries an ICIS-
        format construction-stormwater coverage OHGC17963 under the name APOLLO POWER
        GEN. Whether 2GC08564*AG and OHGC17963 are the same coverage under two
        agencies' numbering is NOT established by anything captured, and they are not
        asserted to be the same. Lead APOLLO-CGP-NUMBER-RECONCILIATION.
  what_the_agency_put_out_of_scope:
    tag: '[verified]'
    statement: >-
      Response 42 lists the concerns Ohio EPA declined as outside its permitting
      authority: "zoning issues, property values, data centers, tax abatements,
      utility costs, water usage, noise pollution, light pollution, and a lack of
      trust in officials and the permitting process," adding that "Overall, these
      submissions reflect significant apprehension with the proposed facility." The
      hearing deck put the same list on a slide before any testimony was taken.
      Recording this is not a criticism of the agency — an air permit is an air
      permit — but it is the record of where the objections went: OPSB's accelerated
      track took no testimony at all, and Ohio EPA's process took testimony and
      routed most of its subject matter elsewhere.

