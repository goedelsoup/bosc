  # ── Receiving-water impairment (pp. 8-9) — carried in full, exculpatory passages included ──
  receiving_water_assessment:
    citation: 'Fact Sheet 2PD00009, Pages 8-9 of 35, "ASSESSMENT OF IMPACT ON RECEIVING WATERS"'
    tag: '[verified]'
    section_303d_listing: >-
      "The North Branch Portage River watershed assessment unit, which includes Poe Ditch in the
      vicinity of Bowling Green WPC, is listed as impaired for aquatic life, recreation, and
      human health (fish tissue) use on Ohio's 303(d) list."
    tmdl:
      approved: '2011-09'
      basin: Portage River
      underlying_data: >-
        2008, reported in the TSD "Biological and Water Quality Survey of the Portage River
        Basin, Select Maumee River Tributaries, and Select Lake Erie Tributaries, 2006 - 2008"
    aquatic_life_impairment: >-
      "The North Branch Portage River is impaired for aquatic life use due to nutrient
      enrichment downstream of Bowling Green WPC. The TSD identified Bowling Green WPC as a
      source, showing significant spikes in nutrient concentrations downstream of the facility
      (Figure 4)."
    aquatic_life_second_cause: >-
      "The aquatic life use in North Branch Portage River is also impaired due to siltation
      caused by channelization." — a cause this discharger is not named for.
    recreation_impairment: >-
      "Impairments of the primary contact recreation use due to high E. coli levels were
      identified in Poe Ditch and on the North Branch Portage River up-and downstream of Poe
      Ditch. Home sewage treatment systems (HSTS), agriculture, and Bowling Green WPC were
      identified as sources of the impairment."
    recreation_exculpatory: >-
      Carried at equal weight, per the discipline: "To reduce bacteria loads to the receiving
      stream, the City has implemented its Long Term Control Plan to reduce untreated CSO
      discharges and has had only two violations of the E. coli effluent limits at the treatment
      facility in the last five years." The E. coli impairment is identified both UPSTREAM and
      downstream of Poe Ditch, which is not a pattern this outfall alone can produce.
    human_health_impairment: >-
      "The human health use in North Branch Portage River is impaired due to high
      polychlorinated biphenyl (PCB) levels found in the tissue of sport fish." No PCB limit or
      PCB source attribution to this plant appears anywhere in the fact sheet.
    phosphorus_management: >-
      "The TMDL report assessed multiple scenarios for assigning phosphorus reductions but none
      resulted in reaching the in-stream target. As a result, the TMDL recommended an
      implementation strategy to address the identified nutrient impairment with a target
      effluent concentration of 0.5 mg/L for Bowling Green WPC but no formal wasteload
      allocation was approved. Based on best technical judgement and using the TMDL as guidance,
      the monthly average limit for total phosphorus was reduced from 1.0 to 0.7 mg/L in permit
      2PD00009*SD." The *TD renewal continues those limits pending an Ohio EPA resurvey that,
      as of this fact sheet, had not happened.

