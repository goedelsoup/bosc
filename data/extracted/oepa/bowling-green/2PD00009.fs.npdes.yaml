    ambient:
      hardness_mg_l: 331          # Station 901, 2016-21, n=63, median
      ph_summer: 7.8              # Station 901, 2016-21, n=20, 75th percentile
      ph_winter: 7.93             # Station 901, 2016-21, n=14, 75th percentile
      temperature_c_summer: 22.72
      temperature_c_winter: 3.77
      nitrate_nitrite_mg_l: 4.41  # eDMR Station 801, 2016-21, n=56, 8<MDL, median
      total_filterable_residue_mg_l: 734.5
    background_no_data:
      note: >-
        Recorded because an absence of data is not an absence of the pollutant. Table 12 gives
        a background of ZERO for antimony, dissolved hexavalent chromium, free cyanide, MBAS and
        molybdenum on the stated basis "No representative data available." For MBAS in
        particular — the parameter that later drove this plant into Category-I noncompliance —
        the wasteload allocation was computed against an assumed background of zero that Ohio
        EPA had no ambient datum to support.
      parameters:
      - Antimony
      - Dissolved Hexavalent Chromium
      - Free Cyanide
      - MBAS (foaming agents)
      - Molybdenum

