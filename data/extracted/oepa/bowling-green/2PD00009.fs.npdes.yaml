source_text_excerpt: >-
  "National Pollutant Discharge Elimination System (NPDES) Permit Program / FACT SHEET /
  Regarding an NPDES Permit to Discharge to Waters of the State of Ohio for Bowling Green Water
  Pollution Control (WPC) / Public Notice No.: 22-02-025 / Ohio EPA Permit No.: 2PD00009*TD /
  Public Notice Date: February 22, 2022 / Application No.: OH0024139 / Comment Period Ends:
  March 25, 2022 / Name and Address of Applicant: City of Bowling Green, 304 North Church
  Street, Bowling Green, OH 43402 / Name and Address of Facility Where Discharge Occurs:
  Bowling Green WPC, 901 North Dunbridge Road, Bowling Green, OH 43402, Wood County /
  Receiving Water: Poe Ditch / Subsequent Stream Network: North Branch Portage River to
  Portage River to Lake Erie"

# Method note (important, and different from the OCR-scan rule in CLAUDE.md): this is a
# DIGITALLY GENERATED Ohio EPA PDF, not a scan. Its text layer is the document's own embedded
# text, not an OCR guess, so every figure below is read from it verbatim rather than re-keyed
# from a render. This is a REVIEWED TRANSCRIPTION, not a `watermark extract --kind npdes` run:
# no vision pass was made, `pages_read` is therefore empty, and each block cites the 1-based
# printed sheet ("Page N of 35") it was transcribed from.
#
# CONFLATION TRAP, stated once and load-bearing throughout: the subject of this document is the
# WATER POLLUTION CONTROL plant (wastewater, 10 MGD average design, to Poe Ditch, Portage
# basin). The City of Bowling Green also runs a WATER TREATMENT PLANT (drinking, ~10 MGD,
# from the Maumee at Waterville, PWS OH8700311). Two plants, two rivers, near-identical
# capacity numbers. Nothing in this file describes the drinking-water side.

permit:
  confidence: high
  warnings:
  - >-
    Table 12's low flows are NOT measured on Poe Ditch, and not measured anywhere near Bowling
    Green. They are drainage-area-adjusted from USGS gauge 04195500 (Portage River at
    Woodville) over 1951-97 — a record that closed before the network's own derived 7Q10 window
    (1980-2024) opens. The footnote is explicit: "Flow data from Low-Flow Characteristics of
    Stream in Ohio through Water Year 1997 and adjusted for drainage area." Treat the 0.364 cfs
    as the REGULATORY denominator that this permit's limits were actually computed against, not
    as a measurement of the ditch, and do not reconcile it against a derived value by preferring
    one — they are different arithmetic over different records. Same posture as Ottawa
    (data/extracted/oepa/ottawa/2PD00028.fs.npdes.yaml).
  - >-
    The plant is far larger than the water it discharges into. Table 12 states the discharger
    flow as 15.47 cfs (10 MGD) against an annual 7Q10 of 0.364 cfs in the same table — a ratio
    of about 42 to 1. Under design-flow low-flow conditions Poe Ditch below this outfall is
    effluent, not diluted effluent. This is a [verified] reading of two numbers printed in one
    table; the ratio itself is arithmetic and is tagged [inference] where it is asserted
    downstream.
  - >-
    The water quality criteria applied to this discharge are NOT Poe Ditch's own. Poe Ditch is
    designated Limited Resource Water; the fact sheet states on p. 6 that the criteria
    associated with the North Branch Portage River's higher uses (Warmwater Habitat, Primary
    Contact Recreation) "are applied to Bowling Green WPC to be protective of this higher
    quality stream." A screen that reads Poe Ditch's LRW designation and stops there will apply
    the wrong criteria.
  - >-
    The total phosphorus limit was NOT tightened by this permit. The reduction from 1.0 to 0.7
    mg/L happened in the PRIOR action, permit 2PD00009*SD (p. 9: "the monthly average limit for
    total phosphorus was reduced from 1.0 to 0.7 mg/L in permit 2PD00009*SD"). This *TD renewal
    CONTINUES it — "this permit proposes that the same phosphorus limits be continued under the
    adaptive management approach." Any claim that the 2022 renewal cut the phosphorus limit is
    wrong; the 2022 renewal declined to cut it further while Ohio EPA waited to resurvey.
  - >-
    The TMDL's own target for this plant is 0.5 mg/L total phosphorus and it was never adopted
    as a limit. Page 9: the TMDL "assessed multiple scenarios for assigning phosphorus
    reductions but none resulted in reaching the in-stream target," and it "recommended an
    implementation strategy ... with a target effluent concentration of 0.5 mg/L for Bowling
    Green WPC but no formal wasteload allocation was approved." The operative 0.7 mg/L limit
    rests on best technical judgement, not on an approved WLA.

