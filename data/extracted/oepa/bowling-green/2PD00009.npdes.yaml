# Reviewed transcription from this digitally generated PDF's embedded text layer. Page citations
# are the permit's own printed sheet numbers. The Fact Sheet is NOT bound into this PDF (unlike
# Ottawa's 2PD00028); it is a separate 35-page document held as 2PD00009.fs.pdf and transcribed
# in data/extracted/oepa/bowling-green/2PD00009.fs.npdes.yaml. Fact-sheet content is cited there,
# not re-cited here.

permit:
  confidence: high
  warnings:
  - >-
    THE LIMIT TABLE YOU WANT DEPENDS ON THE DATE. Part I.A carries TWO complete limit tables for
    the same outfall. Item 1 governs "the period beginning on the effective date of this permit
    and lasting through the 36th month"; Item 2 governs "the period beginning on 37th month
    after the effective date of this permit and lasting until the expiration date." The interim
    table has NO MBAS limit and NO B2EHP limit, and its ammonia limits are looser (winter
    7.3/4.8 mg/L, summer 2.7/1.8 mg/L). Reading the final table against a 2023 DMR, or the
    interim table against a 2026 DMR, produces a wrong answer in both directions.
  - >-
    The permit itself never prints a calendar date for the interim/final changeover — it is
    expressed only as "the 36th month" and "37th month after the effective date." With an
    effective date of 2022-05-01 that resolves to on or about 2025-05-01. ICIS-NPDES
    independently carries the interim limit set as ending 30-APR-25, which agrees. Both are
    recorded; the arithmetic is [inference] and the ICIS date is [verified] as what the federal
    system holds. See data/extracted/bowling-green/water-watch.yaml, which turns on this date.
  - >-
    Ambient stations 801 and 902 monitor the NORTH BRANCH PORTAGE RIVER, not Poe Ditch. The
    permit's own upstream/downstream biology and chemistry are therefore measured a stream
    removed from the outfall's immediate receptor. Poe Ditch itself is not monitored under this
    permit at all.

