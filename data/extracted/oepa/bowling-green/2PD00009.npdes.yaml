  # ── CSO (Part II, Items D & E, pp. 26-27) ──
  combined_sewer_overflow:
    citation: 'Permit 2PD00009*TD, Pages 26-27, Part II Items D and E'
    tag: '[verified]'
    authorization: >-
      "The permittee is authorized to discharge from the following combined sewer overflows
      (CSOs) only during wet weather periods when the flow in the sewer system exceeds the
      capacity of the sewer system."
    outfalls:
    - station: '2PD00009002'
      location: Mercer Road Diversion Chamber
      receiving_stream: Poe Ditch
    level_of_control: >-
      "The permittee shall discharge no more than four untreated combined sewer overflow (CSO)
      events per typical year. This level of control is based on the City of Bowling Green's
      Combined Sewer Overflow Long Term Control Plan (LTCP), which was approved by Ohio EPA in
      March 2008. The City completed the LTCP and submitted the Wet Weather Characterization
      Report on January 1, 2015, which concluded that the City had met the goals of the LTCP.
      The City must maintain compliance with the LTCP level of control."
    lake_erie_basin_public_notification: >-
      Part II, Item G imposes signage, local-health-department notification, public notification
      and an annual report specifically because these CSOs discharge to the Lake Erie Basin.

