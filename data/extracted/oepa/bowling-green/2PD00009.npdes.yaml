  # ── Part I.C — Schedule of Compliance (pp. 20-21) ──
  schedule_of_compliance:
    citation: 'Permit 2PD00009*TD, Pages 20-21, Part I.C'
    tag: '[verified]'
    subject: Final Effluent Limits for Ammonia, B2EHP, and MBAS
    preamble: >-
      "New final effluent limits are proposed for bis(2-ethylhexyl) phthalate (B2EHP), and
      methyl blue activated substances (MBAS). Also, lower final effluent limits are proposed
      for ammonia (summer and winter). The permittee shall attain compliance with the effluent
      limits for ammonia, B2EHP, and MBAS as expeditiously as possible but no later than the
      dates in the following schedule."
    milestones:
    - month: 12
      due: '2023-05-01'
      event_code: '07099'
      requirement: >-
        Progress report to Ohio EPA Northwest District Office (NWDO) including five years of
        influent/effluent/sludge data for ammonia, B2EHP and MBAS; a list of significant and
        non-significant industrial users; actions taken in the previous 12 months; actions
        planned for the next 12.
    - month: 24
      due: '2024-05-01'
      event_code: '07099'
      requirement: Second progress report, same contents.
    - month: 36
      due: '2025-05-01'
      event_code: '05699'
      requirement: >-
        "As soon as possible but no later than 36 months after the effective date of this
        permit, the permittee shall attain compliance with the new effluent limits for ammonia,
        B2EHP, and MBAS. The permittee shall notify Ohio EPA NWDO within seven days of attaining
        compliance."
    due_date_note: >-
      The calendar dates in `due` are [inference] — computed from the 2022-05-01 effective date;
      the permit states only the month offsets. Whether the two progress reports and the
      compliance notification were actually submitted is NOT established by any captured source.
      [open] — a records request to Ohio EPA NWDO for the 07099 and 05699 submittals would
      settle it, and would speak directly to what the plant knew about its MBAS position before
      the limit took effect.
    other_schedules:
      phosphorus_optimization: >-
        Part I.C.B — the permittee must complete and submit the "Evaluation for Reducing
        Discharge of Phosphorus" form with its next NPDES renewal application.
      municipal_pretreatment: >-
        Part I.C.C — evaluate the adequacy of local industrial user limitations, submit a
        revised local limit technical justification report, and implement revisions if needed.
        Relevant to any new significant industrial user in the service area.

