  warnings:
  - The applicant's own form prints the project ZIP as 43103 for 'Millcreek Road, Sidney, OH'. 43103 is
    Ashville, Pickaway County; Sidney is 45365. Recorded as printed — it is the applicant's error, not
    a transcription error.
  - Project acreage here (236.7 ac converted) is the applicant's project figure and differs from the 230.7
    ac land disturbance on its own stormwater NOI and the 243.0924 ac of the deeded parcel — three measures
    of one site, none of them a building footprint.
  - The form carries two contact columns. contact_name/contact_firm hold the CONSULTANT/AGENT pair (Chris
    Klein of Smart Services, Inc), because those fields drive the applicant's representation edges. The
    applicant-side contacts (Robert Truedinger, Director Enviro, robbtrue@amazon.com; technical contact
    Seth Bell) are Amazon's own staff and are recorded in `note` so the graph does not present them as
    outside representation.
