  note: 'The state-side counterpart of the Developer Sewer Improvements the City''s Development Agreement
    (Res. 27-26 §3.8) requires to reach final completion by 2026-09-30. Condition WW restates that a PTI
    is not an authorization to discharge and that an NPDES permit must be applied for 180 days before
    any discharge to waters of the state; condition AB places operation and maintenance of the relocated
    sewer on the City of Sidney — which the Development Agreement independently provides for at §3.7.2
    on dedication and acceptance. Appealable to the Environmental Review Appeals Commission within 30
    days under R.C. 3745.04. The 20 MB approved plan set (eDoc 4158406) and the application package (eDoc
    4158414) are on the same permit and are deliberately not in the corpus. Ohio EPA staff of record:
    Brandon Oyer (transmittal) and Tony Nosko, P.E., PTI Unit. The permit names no applicant-side contact.'
