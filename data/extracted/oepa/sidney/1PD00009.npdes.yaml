  wet_wla:
    acute_tua: 0.84
    chronic_tuc: 3.22
  public_water_supply:
    statement: >-
      PWS criteria apply in the Great Miami River Study Area at RM 130.2 and RM
      118.5. The Sidney WTP intake is at RM 130.2, UPSTREAM of all three effluent
      discharges in the segment. The Piqua WTP intake at RM 118.5 is downstream of
      the Sidney WWTP discharge at RM 128.7. Troy and Tipp City well fields lie
      within 1000 yards of the river at RMs 107 and 99. None is within 500 yards of
      any of the three interactive discharges, so PWS criteria do not apply; the
      human-health WLAs are calculated to non-drinking criteria.

source_discrepancies:
  - tag: '[verified]'
    what: Outfall 001 longitude
    detail: >-
      The public notice page states the outfall as "40N 16' 12'' 84W 19' 10''"; the
      permit's own sampling-station table states "40 N 16' 12"; 84 W 09' 10"". Sidney
      sits at roughly 84°09'W, so the permit body is right and the public notice
      digit-transposes 09 to 19. Recorded, not corrected — the source bytes stand as
      received.
  - tag: '[verified]'
    what: Facility address spelling
    detail: >-
      "Children's Home Road" on the public notice, "Childrens-Home Road" in the
      permit's authorization paragraph. Same road.

reconciliation:
  tag: '[inference]'
  note: >-
    The BOSC-derived low-flow table (data/reference/hydrology/low-flow-7q10.derived.yaml)
    computes a 7Q10 of 30.95 cfs at gage 03261500 over 1980-2024, against this fact
    sheet's regulatory 24.0 cfs over 1927-2021. The gap is a period-of-record
    difference, not an error in either — the regulator's window spans the 1930s and
    1950s drought decades that the 1980-2024 window does not, which is the obvious
    candidate for the direction of the difference. The REGULATORY number
    governs the profile's passby, because it is the number the wasteload allocations
    and the permit limits are actually built on. The derived Loramie 7Q10 of 3.55 cfs
    against the fact sheet's 3.43 cfs corroborates the method within 3.5%.
