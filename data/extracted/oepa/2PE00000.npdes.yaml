  note: '2023 NPDES permit renewal for the City of Lima WWTP (the municipal receiving
    plant). Ohio EPA permit 2PE00000*OD, application OH0026069; action date June 2,
    2023, effective July 1, 2023, expiration June 30, 2028. Final outfall 2PE00000001
    discharges to the Ottawa River at River Mile 37.6. Average daily design flow 18.5
    MGD (p3 footnote and fact-sheet p83: "the average design flow is 18.5 million
    [gallons per day]"); the plant is designed for peak wet-weather flows up to 70
    MGD, with full secondary treatment sustained to 18.5 MGD and flow splitting at
    the 30/40/70 MGD thresholds (p39, p84). Final effluent WQBELs (outfall 001): TSS
    20 mg/l wkly / 14 mg/l monthly (1402 / 982 kg/day); ammonia-N summer 2.4 / 1.6
    mg/l, winter 2.6 / 1.7 mg/l; total phosphorus 1.5 / 1.0 mg/l (105 / 70 kg/day);
    dissolved oxygen 5.0 mg/l minimum. The permit renews the general mercury variance
    (Part I; pp. 32-35, 92) — mercury is a monitored parameter, and ECHO DMRs show
    a 2023-08 mercury exceedance (see lima-wwtp-OH0026069.dmr.yaml). The permittee
    operates a State-Approved Pretreatment Program initially approved January 14,
    1992 (p36), with categorical users discharging 0.71 MGD and 4 significant
    non-categorical users discharging 0.412 MGD (p84). Plant constructed 1930, last
    upgraded 2016 (p83); CSOs reduced to five events per year (p84). Signed by
    Director Anne M. Vogel. Total permit-body pages 79 (119-page PDF including the
    fact sheet). Source document is the un-requested City-of-Lima municipal custodian
    record (issue #1536); obtained from Ohio EPA DAM (public record, no PRR).'
