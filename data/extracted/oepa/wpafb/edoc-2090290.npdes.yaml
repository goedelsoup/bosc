permit:
  tag: '[verified]'
  confidence: high
  warnings:
  - >-
    THIS DOCUMENT IS A ONE-PAGE REVOCATION-REQUEST LETTER, NOT A PERMIT. It is Wright-Patterson
    AFB's 2006-08-09 letter to Ohio EPA asking that NPDES permit 1IN00274*AD be revoked. The
    corpus holds NO copy of permit 1IN00274 itself — no permit face sheet, no fact sheet, no
    effluent-limit tables, nothing from Ohio EPA's side of the correspondence. Every field below
    describes what THIS LETTER SAYS about permit 1IN00274 (its number, its stated expiration
    date, the reason the base wants it gone) — it is not read off the permit and must not be
    cited as if it were. Anyone wanting the permit's actual terms (outfall, limits, receiving
    water, issuance history) has to find that instrument separately; this artifact cannot supply
    it.
  - >-
    PERMIT 1IN00274 WAS AN INDUSTRIAL PERMIT FOR A BIOSLURPER, NOT A POTW/SEWAGE PERMIT. The
    letter's second paragraph identifies the regulated unit: "the Bioslurper unit has not be in
    use for a couple of years" (verbatim, including the document's own grammar — "has not be"
    rather than "has not been"). A bioslurper is a soil/groundwater vapor-extraction remediation
    technology, not a wastewater treatment plant. This document is therefore NOT evidence of a
    municipal sewage-plant permit for Wright-Patterson AFB, and nothing here should be read into
    a WWTP/POTW context.
  - >-
    WHETHER OHIO EPA ACTUALLY REVOKED THE PERMIT IS [open]. The letter only requests revocation
    "at the earliest possible date" — it is one half of a correspondence. No response, order,
    or revocation notice from Ohio EPA is captured in this corpus. Do not write that the permit
    "was revoked"; the correct statement is that the base asked for revocation on 2006-08-09 and
    the agency's response is not established by anything held here.
  - >-
    A FEDERAL ENCLAVE HAS NO CITY SEWAGE-PLANT NPDES PERMIT, AND THIS DOCUMENT DOES NOT SUPPLY
    ONE. Wright-Patterson AFB does not appear in this OEPA batch with a POTW/municipal-sewage
    permit because it is not a municipality — its land is a federal enclave, not incorporated
    territory served by a city plant. Do NOT substitute a nearby Dayton-area municipal WWTP
    permit for WPAFB's own sanitary-sewage disposal, and do not assert that any specific plant
    treats the base's sewage. Whether and where WPAFB's sanitary flow is treated (on-base
    package plant, connection to a municipal system, or something else) is `[open]` — no
    captured source in this corpus answers it. This letter concerns an unrelated industrial
    remediation permit only.
  - >-
    THE STATED EXPIRATION DATE IS ~20 YEARS IN THE PAST. The letter gives the permit's
    expiration as 31 December 2006. As of this extraction (2026-08-26), that is roughly twenty
    years ago. Regardless of whether Ohio EPA ever acted on the revocation request, permit
    1IN00274*AD is long expired on its own stated terms.

