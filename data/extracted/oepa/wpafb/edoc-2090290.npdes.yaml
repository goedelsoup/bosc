    body_paragraph_1_verbatim: >-
      "Per our recent correspondence regarding the National Pollution Discharge Elimination
      System (NPDES) permit # 1IN00274*AD which is due to expire 31 December 2006, we are
      requesting that this permit be revoked at the earliest possible date."
    body_paragraph_1_note: >-
      The document itself prints "National Pollution Discharge Elimination System" — "Pollution"
      rather than the standard statutory "Pollutant". Verified at 600 DPI; this is the
      document's own wording, not an artifact of this transcription, and is transcribed
      verbatim rather than silently corrected to the standard term.
    body_paragraph_2_verbatim: >-
      "As you've observed on the Form 4500 Monthly Reports, the Bioslurper unit has not be in
      use for a couple of years. We have no future plans to reuse this piece of equipment and
      would like to cease further monthly reporting. If you have any questions regarding this
      issue, please contact Mr. Sherm Siegal, of this office, at (937) 257-8591 or myself at
      (937) 257-5537."
    body_paragraph_2_note: >-
      "has not be in use" is printed exactly that way (missing "en") — the document's own
      grammar, verified at 600 DPI and transcribed as printed rather than corrected to "has not
      been in use".
    stated_reason_for_revocation: >-
      The Bioslurper unit has been unused "for a couple of years" as of 2006-08-09, with no
      future plans to reuse it; the base wants to stop filing the associated Form 4500 monthly
      reports.
    referenced_prior_correspondence: >-
      The letter opens "Per our recent correspondence regarding..." — it references an earlier,
      uncaptured exchange between the base and Ohio EPA about this permit. That prior
      correspondence is not in this corpus.
