# City of Springfield WWTP — NPDES permit 1PE00007*VD (application OH0027481), issued
# 2025-01-17, effective 2025-03-01, expiring 2030-02-28. Renewal action per the bound Fact
# Sheet's own title.
#
# Hand-read from the committed PDF's embedded text layer, not machine-extracted. This
# document is digitally generated (producer "Microsoft: Print To PDF", no scan, no OCR), so
# the text layer is the instrument's own bytes; every figure below is transcribed with its
# printed sheet/page cited on the block. Nothing is derived, rounded or inferred unless the
# block says so.
#
# ONE page was additionally rendered at 300 DPI and read visually — PDF page index 29
# (printed sheet 30), to verify that CSO station 022's printed latitude really reads
# "93.9293N" on the face of the permit and is not a text-extraction artifact (see
# permit.warnings — cso_stations.transcription_note). That is a VERIFICATION of one
# transcribed line, not the extraction method: no page was rasterized and sent to a vision
# model, so this file carries no render receipt (no doc_id / dpi / pages_read). See
# watermark.models.TranscribedExtraction — a receipt is all-or-nothing.
#
# The record -> document join (watermark.site.records._source_ref) reads a TOP-LEVEL
# `source_path`, so the primary instrument is named there as well as in meta.sources.
