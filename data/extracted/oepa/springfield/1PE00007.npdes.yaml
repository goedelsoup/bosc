        updated Operator of Record Notification form; a backup operator one classification
        lower may serve up to 30 consecutive days without notice (longer with Director
        authorization on written request, e.g. military leave or long-term illness).
      minimum_staffing: 'Per OAC 3745-7-04(C)(1) (treatment works) and (C)(2) (collection system), or an approved staffing-hour reduction plan; loss of the plan''s underlying conditions forces an immediate return to the baseline requirement.'
    cso_conditions:
      item: 'D. CSO Conditions (sheets 32-33)'
      nine_minimum_controls: >-
        Standard NMC list: O&M of collection system and CSOs; maximize in-system storage
        prior to CSO; review/modify pretreatment to minimize CSO impact of nondomestic
        discharges; maximize POTW treatment of wet weather flow; prohibit dry-weather
        overflows; control solids/floatables in CSO discharge; inspect/monitor/report CSOs;
        pollution-prevention programs; public notification for affected areas.
      cso_annual_report:
        due: 'January 31 each year, to Ohio EPA Southwest District Office'
        contents: 'Frequency/volume of CSO discharges per station (meter or hydraulic-model data); parameter monitoring data; a summary of nine-minimum-control actions; a summary of LTCP implementation and coming-year activities.'
      cso_permit_reopener: 'Modification/revocation-reissuance triggers: new/revised CSO or SSO law; new information showing CSO controls have failed to attain WQS; new information from LTCP development/implementation; or any 40 CFR 122.62 / OAC 3745-33-04 reason.'
    cso_related_bypass:
      item: 'E. CSO-Related Bypass (sheet 33)'
      design_basis: '"The average daily design flow of the facility''s secondary treatment processes is 25 MGD, with a peak hydraulic capacity of 40 MGD. The facility also has a high rate treatment facility which provides an additional 100 MGD of partial treatment capacity."'
      numeric_trigger: >-
        "A CSO-related bypass, monitored at Bypass Station 1PE00007602, is approved when the
        flow rate to the treatment plant exceeds 40 MGD as a result of a precipitation event.
        Bypasses that occur when the flow rate at the time of the bypass is under the
        specified flow rate are not approved under this condition and are subject to the
        bypass provision at 40 CFR 122.41(m)."
      minimum_treatment: 'Solids & floatables removal, primary clarification, and disinfection (in summer).'
      significance: >-
        The enforceable form of the fact sheet's HRT/bypass background — testable against the
        plant's own flow record: "was 40 MGD exceeded at the plant before the bypass?"
    sso_reporting:
      item: 'F. Sanitary Sewer Overflow (SSO) Reporting Requirements (sheets 33-35)'
      imminent_endangerment: '24-hour phone notice to Ohio EPA (1-800-282-9378) and the local Board of Health, plus a 5-day written follow-up report (8 required elements).'
      all_ssos: 'System-wide occurrence count on the monthly DMR at station 300; a public annual report (due March 31) with an SSO ID/location/receiving-water table (numbered from 301), a date/volume table, and a water-in-basements (WIB) summary with narrative analysis by location/frequency/cause.'
    bypass_trigger: 'see cso_related_bypass above'
    biomonitoring_program:
      item: 'X. Biomonitoring Program Requirements (sheets 37-39)'
      text: '"The permittee shall continue to implement an effluent biomonitoring program to determine the toxicity of the effluent from outfall 1PE00007001."'
      sop_due: '2025-06-01 [inference] — "no later than three months after the effective date" (2025-03-01 + 3 months); the permit prints no calendar date.'
      testing: >-
        Chronic and definitive acute toxicity tests for the duration of the permit, on both
        Ceriodaphnia dubia and Pimephales promelas, per Ohio EPA's "Reporting and Testing
        Guidance for Biomonitoring," July 1998 (or current revision); ambient/upstream
        control water from station 800.
      significance: '"Continue to implement" means the biomonitoring program predates this permit renewal — consistent with the Fact Sheet''s Category 4 (no toxicity) finding, see fact_sheet below.'
    pretreatment_program_requirements:
      item: 'Y. Pretreatment Program Requirements (sheets 39-43)'
      approved: 'March 1, 1985, and all subsequent modifications approved before this permit''s effective date.'
      elements_indexed: >-
        Legal authority and interjurisdictional agreements; adequate funding/staffing;
        industrial user inventory and Significant Industrial User notification within 30
        days; slug-load control plan evaluation (existing SIUs within 1 year if never
        evaluated, new SIUs within 1 year of designation); technically based local limits;
        control mechanisms meeting OAC 3745-3-03(C)(1)(c); compliance monitoring/inspection
        (SIUs at least annually); annual POTW priority-pollutant monitoring of influent,
        effluent and sludge (results on Ohio EPA Form 4221 with the annual report);
        enforcement and a February 15 published Significant-Noncompliance list; quarterly
        (Feb/May/Aug/Nov 15) industrial-user violation reports and a March 15 annual
        pretreatment report; 3-year record retention (extended during unresolved litigation);
        program-modification review (45-day effective date unless deemed substantial).
      local_limits_wla_table_ug_per_l: {arsenic: 680, cadmium: 33, chromium_hexavalent: 31, chromium_total: 1234, copper: 89, cyanide_free: 62, lead: 158, mercury_ng_l: 12, molybdenum: 102860, nickel: 770, selenium: 23, silver: 6.7, zinc: 680}
    stormwater_no_exposure_certification:
      item: 'W. Stormwater No Exposure Certification (sheet 37)'
      text: >-
        Certification number 1GRN00745*BG, signed 2022-10-06. Must be re-affirmed every five
        years; a new form (or other compliance provision) is due no later than 2027-10-06.
    limits_below_quantification:
      item: 'M. Limits Below Quantification (sheets 35-36)'
      table: {parameter: Chlorine, Total Residual, pql_mg_l: 0.050}
      rule: >-
        For maximum limits, any value reported below the QL is in compliance; for average
        limits, compliance uses the arithmetic mean with zero substituted for sub-QL values.
        All results, even sub-QL, must be reported (above-QL: report as-is; above-MDL/below-QL:
        report as-is; below-MDL: report "AA" - below detection).
    other_items_present:
      note: >-
        Transcribed as an index of what Part II contains, so a later reader knows what is in
        the instrument without re-walking it. Not summarized in detail here.
      items: >-
        B. Sampling station locations (see sampling_stations above) · C. CSO station list
        (see cso_stations above) · G. Maintain treatment/sewerage works per ORC 6111.01 · H.
        Non-flow parameters need not be monitored on unstaffed days (report "AN") · I.
        Composite sample method · J. Grab sample method · K. Multiple grab sample method
        (≥3 grabs, ≥3 hours apart; critical value reported) · L. 85 percent removal
        requirement (CBOD5 and TSS) · N. WQBELs may be revised per updated WLAs/TMDLs · O.
        Sludge/biosolids handling per ORC 6111/OAC 3745-40 · P. Annual sludge report due
        March 1 · Q. Pathogen/vector-attraction-reduction SOPs (OAC 3745-40-09) · R. Sampling
        Plan maintenance (locations, frequency, procedures, storage/preservation; ≥6 grabs
        for biosolids composites) · S. Free cyanide (low-level) method · T. Mercury
        (low-level) method · U. Dissolved orthophosphate method (0.45 micron filter within 15
        minutes, analyzed within 48 hours) · V. Outfall signage (name/permit number/outfall
        number/phone, ≥2in letters, ≥2ft x 2ft sign, ≥3ft above ground, CSO warning language
        where applicable).

  # ── The bound Fact Sheet — a distinct sub-document, PDF pages 55-90 (its own p.1-36) ────
  fact_sheet:
    tag: '[verified]'
    note: >-
      Everything in this block is read off the bound "Fact Sheet for NPDES Permit Renewal,
      Springfield WWTP, 2024" (PDF index 54-89) — the Director's supporting technical
      rationale, NOT an operative permit term. See permit.warnings for its internal date
      disagreement and its mismatched draft permit-number header.
    header:
      public_notice_no: '208345'
      permit_no_as_printed: 1PE00007*TD
      public_notice_date: '2024-12-16'
      comment_period_ends: '2025-01-15'
      applicant: {name: City of Springfield, address: '76 East High Street, Springfield, OH 45502'}
      facility: {name: Springfield WWTP, address: '965 Dayton Avenue, Springfield, OH 45503, Clark County'}
      receiving_water: Mad River
      subsequent_stream_network: Great Miami River, Ohio River
      contact: David Brumbaugh, (614) 644-2138, david.brumbaugh@epa.ohio.gov
    receiving_water_classification:
      citation: 'Fact Sheet p.6'
      ohio_epa_river_code: 14-100
      hydrologic_unit_code: 05080001-18-05
      county: Clark
      ecoregion: Eastern Corn Belt Plain
      use_designations: Warmwater Habitat, Agricultural Water Supply, Industrial Water Supply, Primary Contact Recreation
      impairment: >-
        "The Rock Run-Mad River watershed assessment unit, which includes the Mad River in the
        vicinity of Springfield WWTP, is listed as impaired for aquatic life, recreation, and
        human health uses on Ohio's 303(d) list." A TMDL report for the Mad River was approved
        January 2010, addressing nitrate, sedimentation, fecal coliform and habitat, based on a
        2003 biological survey; it "did not make any specific recommendations for Springfield
        WWTP." A 2023 Rock Run-Mad River survey was conducted but its data was not yet
        available as of this Fact Sheet.
    facility_description:
      citation: 'Fact Sheet p.6'
      constructed: 1935
      last_upgraded: 2014
      average_design_flow_mgd: 25
      peak_hydraulic_capacity_mgd: 40
      hrt_partial_treatment_capacity_mgd: 100
      population_served: approximately 59,000
      collection_system: 78% separate sewers, 22% combined sewers
      treatment_processes: Bar screening, grit removal, primary sedimentation, trickling filter, activated sludge, secondary clarification, chlorination/dechlorination, post-aeration
      sludge_processes: Anaerobic digestion, polymer addition, dewatering (belt filter press); land applied (station 581), with landfill (586) and NPDES-transfer (588) provisions.
      ltcp_background: >-
        A 2016 programmatic review found continued implementation of the original LTCP no
        longer feasible (geotechnical data since the 2012 approval). Since then the City ran a
        collection-system flow study, recalibrated its hydraulic model, and developed an LTCP
        Update (submitted for review February 2024) targeting the SAME 85% wet-weather-capture
        interim level over a 20-year schedule, via: storage maximization in the existing
        Fountain Avenue Tunnel, a 72" sewer from CSO 008 to the WWTP, and a 34 MGD satellite
        high-rate treatment facility at CSO 041. Cost: $92M LTCP + $88M asset-management plan,
        "projected to place a high burden on the City." Even after completion, the collection
        system is still projected to discharge ~50 CSO events/year — Ohio EPA "does not
        support the presumption that this discharge frequency would meet water quality
        standards" but approved the LTCP Update as an interim phase "due to the financial
        condition of the City," with re-evaluation to follow.
      pretreatment_program: '17 significant industrial users — 9 categorical users discharging 0.337 MGD, 8 non-categorical users discharging 0.833 MGD.'
    description_of_existing_discharge:
      citation: 'Fact Sheet pp.7-9'
      violation_history: 'A single reported effluent violation in the previous five years — E. coli, 2019.'
      infiltration_inflow: '2.14 MGD estimated I/I rate; addressed via a sewer-lining program and downspout-disconnection requirements.'
      cso_elimination_note: >-
        "Springfield WWTP has 54 combined sewer overflows (CSOs). CSO 003 was eliminated in
        2023 via separation and is proposed to be removed from the permit" — but Table 5's own
        footnote says CSO 003 "was eliminated in 2020 via sewer separation" (see
        permit.warnings). CSO 018 "was physically eliminated in 2024" (Table 5 footnote b).
        Both are absent from the issued permit's Item C roster.
      annual_flow_rates_mgd_50th_95th_max:
        '2019': {p50: 16.39, p95: 32.77, max: 39.75, note: 'data begins 5/1/19'}
        '2020': {p50: 16.23, p95: 31.19, max: 49.55}
        '2021': {p50: 14.60, p95: 23.89, max: 37.38}
        '2022': {p50: 16.29, p95: 27.44, max: 37.33}
        '2023': {p50: 14.34, p95: 18.45, max: 32.48}
        '2024': {p50: 15.46, p95: 29.26, max: 36.05, note: 'data ends 4/31/24'}
      sso_occurrences_by_year: {'2019': 3, '2020': 6, '2021': 5, '2022': 6, '2023': 2}
      bypass_discharges:
        station_602: {'2019': {occurrences: 8, volume_mg: 343.8}, '2020': {occurrences: 9, volume_mg: 174.2}, '2021': {occurrences: 10, volume_mg: 64.5}, '2022': {occurrences: 11, volume_mg: 321.1}, '2023': {occurrences: 10, volume_mg: 247.8}}
        station_066: {'2020': {occurrences: 1, volume_mg: 4.44}, '2023': {occurrences: 3, volume_mg: 20}, note: 'no discharges reported in 2019, 2021, or 2022'}
      seasonal_total_phosphorus_loading:
        '2019': {median_p_mg_l: 1.71, median_flow_mgd: 17.52, median_loading_kg_day: 109}
        '2020': {median_p_mg_l: 1.76, median_flow_mgd: 15.50, median_loading_kg_day: 102}
        '2021': {median_p_mg_l: 2.04, median_flow_mgd: 13.97, median_loading_kg_day: 110}
        '2022': {median_p_mg_l: 1.87, median_flow_mgd: 16.29, median_loading_kg_day: 115}
        '2023': {median_p_mg_l: 2.28, median_flow_mgd: 13.84, median_loading_kg_day: 116}
    wla_and_reasonable_potential_basis:
      citation: 'Fact Sheet pp.9-14'
      stream_design_flows: {'1q10_cfs': 92, '7q10_cfs': 100, '30q10_summer_cfs': 112, '30q10_winter_cfs': 145, harmonic_mean_cfs: 285, source: 'USGS gage 03269500, adjusted for plant flow'}
      plant_flow_cfs: 24.137
      acute_dilution_ratio: '4.2 to 1 — (1Q10 78 cfs? printed as 78 cfs + 24.1 cfs) / 24.1 cfs; the Fact Sheet''s own arithmetic line reads "78 cfs + 24.1 cfs = 4.2" over "24.1 cfs", differing from the 92 cfs 1Q10 given in Table 14 two pages later — transcribed as printed, not reconciled here.'
      wet_wqc: {acute_tua: 0.3, chronic_tuc: 1.0, citation: 'OAC 3745-1-44'}
      outfall_001_wla: {acute_tua: 1.0, chronic_tuc: 5.1}
      reasonable_potential_result: >-
        Whole Effluent Toxicity: Category 4 ("no toxicity") for both species/both endpoints —
        Table A shows all Ceriodaphnia results non-detect and Pimephales acute at a maximum of
        0.3 TUa against a 1.0 WLA (0% of tests exceeding). Carcinogen additivity (BEHP +
        bromodichloromethane): sum of fractions 0.17 (< 1.0), so no additivity limit proposed.
      parameter_groupings: >-
        Group 1 (no criteria, unevaluated): chlorides, manganese. Group 2 (PEQ < 25% of WQS,
        no WLA/limit needed): antimony, arsenic, barium, cadmium, chloroform, chromium, free
        cyanide, dibromochloromethane, iron, lead, molybdenum, nickel, nitrate+nitrite,
        selenium, strontium, zinc. Group 3 (PEQ < 50% of PEL, no limit needed): BEHP,
        bromodichloromethane, total residual chlorine, dissolved hexavalent chromium, copper,
        total filterable residue, mercury, silver. Groups 4 and 5 (limit warranted): NO
        parameter placed in either group.
      basis_summary_001: >-
        TSS/CBOD5/ammonia limits are plant-design-based (more stringent than 40 CFR 133
        secondary treatment standards for TSS/CBOD5); ammonia additionally WLA-protective.
        Chlorine is plant-design, WLA-protective, and below the 0.050 mg/L QL (special
        Part II Item M language applies). Oil & grease and pH are WQS-based. Metals/cyanide/
        mercury/filterable residue are monitor-only per the group-2/3 findings. Nitrate+nitrite
        and TKN are monitored on best technical judgment for nutrient datasets; nitrate+nitrite
        separately WLA-confirmed protective. Orthophosphate/total phosphorus monitoring is
        required by ORC 6111.03.
      basis_summary_602: >-
        TSS and chlorine limits at bypass 602 are plant-design values from Permit-to-Install
        837393 (TSS as a calculated quarterly maximum average); ammonia/CBOD5/phosphorus
        monitoring removed at this renewal "as these parameters are not necessary to
        demonstrate compliance with the CSO Control Policy."
      basis_summary_099: >-
        Station 099 is new at this renewal — a calculated (not physically sampled) blended
        end-of-pipe station for 001+602 — with E. coli limits from the primary-contact
        recreation standard (OAC 3745-1-37).
    changes_from_prior_permit:
      citation: 'Fact Sheet p.2, SUMMARY OF PERMIT CONDITIONS'
      summary: >-
        New fictitious blended station 099 for E. coli. Barium/silver monitoring dropped at
        001/601 (no reasonable potential). Annual chronic toxicity testing (with acute
        endpoints derived) continues for permit life. CSO stations 003 and 018 removed
        (eliminated outfalls). Upstream (800)/downstream (901) E. coli monitoring frequency
        increased to 1/2 weeks, June-August (from monthly). Bypass 602 approved as a
        CSO-related bypass; its phosphorus/CBOD5/ammonia monitoring removed. Bypass 067
        removed (no discharge through the station). Temperature/pH/DO monitoring removed at
        upstream stations 800/801 and DO at downstream 901. A CSO LTCP schedule of compliance
        is added.
    use_attainment:
      citation: 'Fact Sheet p.27, Table 12 — data from the 2003 Biological and Water Quality Study of the Mad River Basin'
      locations:
      - {location: Mad River upstream of Springfield, river_mile: 25.8, use: WWH, status: Partial, cause: 'Habitat alterations — channelization, agriculture'}
      - {location: 'Mad River west of Springfield at Lower Valley Pike', river_mile: 24.1, use: WWH, status: Full}
      - {location: 'Buck Creek at Springfield, adjacent to Old Reid Park', river_mile: 6.4, use: WWH, status: Partial, cause: 'Flow regime alteration, habitat alteration — dam or impoundment'}
      - {location: 'Buck Creek at Springfield, adjacent to Snyder Park', river_mile: 0.6, use: WWH, status: Full}
    acronyms_note: >-
      Attachment 3 (Fact Sheet p.36) defines the standard Ohio EPA acronym set used throughout
      this file's fact_sheet block (ABS, BPJ, CMOM, CONSWLA, CSO, CWA, DMR, DMT, IMZM, LTCP,
      MDL, MGD, NPDES, OAC, ORC, ORSANCO, PEL, PEQ, PMP, PPE, SSO, TMDL, TRE, TU, WET, WLA,
      WPCF, WQBEL, WQS) — not re-expanded per-use below.
