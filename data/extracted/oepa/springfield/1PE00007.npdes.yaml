permit:
  tag: '[verified]'
  confidence: high
  warnings:
  - >-
    THE PDF HAS 90 PAGES; THE PERMIT'S OWN "TOTAL PAGES" LINE ON SHEET 1 READS 54. This is
    NOT a mismatch to paper over — it resolves cleanly. PDF page index 0 through 53 (54
    pages) is the issued permit itself (Parts I, II and III, sheets 1-54, each printed
    "Page N / 1PE00007*VD"). PDF page index 54 through 89 (36 pages) is a SEPARATE document —
    "Fact Sheet for NPDES Permit Renewal, Springfield WWTP, 2024" — bound into the same PDF
    immediately after the permit, with its own independent pagination ("Page 1 of 36" through
    "Page 36 of 36"). 54 + 36 = 90, exactly the PDF's page count. Unlike the mansfield
    precedent (2PE00001*PD), where the Fact Sheet was NOT bound in at all, here it IS — see
    the fact_sheet block below. The Fact Sheet is a distinct sub-document: it explains and
    supports the Director's decisions but is not itself an operative permit term, and it is
    cited separately from `permit.*` throughout this file.
  - >-
    PART I,B ITEM 3'S OWN CSO COUNT DISAGREES WITH ITSELF, AND WITH THE FACT SHEET. Sheet 9's
    heading reads "***The monitoring tables for the 46 CSO stations other than those listed
    in Part I,B, Items 1 and 2 are identical to this monitoring table.***" and its very next
    sentence reads "the permittee shall monitor at Station Number 1PE00007013 and the other
    48 CSO stations" (i.e. 49 total under Item 3). Neither number is right: counting Part II
    Item C's own 54-station roster (see cso_stations below) and subtracting the 5 stations
    named in Item 1 and the 5 named in Item 2 leaves 44 — which is exactly what the bound
    Fact Sheet says in its own words ("Overflow occurrences and volume for the remaining 44
    CSOs are estimated by the City's hydraulic model of the collection system"). So the
    permit's own operative text is wrong twice (46, then 48) in the same paragraph, and only
    the non-operative Fact Sheet states the figure that the station roster actually supports.
  - >-
    CSO STATION 022'S PRINTED LATITUDE IS "93.9293N" — GEOGRAPHICALLY IMPOSSIBLE (there is no
    93rd parallel), almost certainly a transposed-digit typo for "39.9293N" given every
    neighboring station on Buck Creek reads ~39.92-39.94 N. This was checked against a 300 DPI
    render of the page (PDF index 29) — the source PDF itself prints "93.9293N", not a
    text-extraction artifact. Transcribed as printed in cso_stations below, not corrected.
    Two further stations (041, 083) print a doubled decimal point in their longitude
    ("83.83.7951 W", "83.83.7993 W") — also transcribed as printed, not corrected. Three CSO
    entries (014, 026) are also missing their opening coordinate parenthesis on the face of
    the document (confirmed on the same 300 DPI render for 014) — a minor, harmless
    formatting defect, noted but not treated as a data error.
  - >-
    BYPASS STATION 066 HAS NO LOCATION DESCRIPTION ANYWHERE IN THIS PERMIT. Part II Item B's
    sampling-station location table (sheet 29) lists every other numbered station used in
    this permit — 001, 002-083 (CSOs, by reference to Item C), 099, 300, 581, 586, 588, 601,
    602, 800, 801, 901 — but has no row for 066, even though Part I,B Item 4 (sheet 10)
    requires monitoring at it. Station 066's own notes header additionally prints
    "1PE0007066" — seven digits, one short, the ONLY such typo among the 60+ station-ID
    references checked in this document (see the grep in the self-check). Where 066
    physically is, and why it alone has no Item B entry, is `[open]` — nothing else in this
    corpus establishes it.
  - >-
    THE DOWNSTREAM-FARFIELD STATION HAS TWO DIFFERENT NUMBERS ON DIFFERENT PAGES. Part I,B
    Item 13 (sheet 23) is titled "Table - Downstream-Farfield Monitoring - 900 - Final" for
    "Station Number 1PE00007900" and its own notes are headed "Notes for Station Number
    1PE00007900" — the number 900 appears three times on that one sheet. Part II Item B's
    location table (sheet 29) instead lists "1PE00007901 Downstream monitoring in Mad River
    at Old Mill Road" — no 900 appears anywhere in Item B. Both plainly describe the same
    single downstream station (there is only one downstream-farfield monitoring requirement
    in this permit); the document simply never reconciles which digit is correct. Recorded
    as 900/901 throughout this file rather than silently picking one.
  - >-
    BYPASS 602'S OWN NOTE LETTERING SKIPS BACKWARDS. Sheet 20's notes for station
    1PE00007602 run a, b, c, d, e (sheet 19) then f, g, h (sheet 20) — but the note AFTER
    "h. Chlorine - see Part II, Item M." is again lettered "g.", not "i." ("g. Discharge
    through this station under any condition except those specified in Part II, Item E is
    prohibited..."). Two different notes on the same station share the letter "g." Both are
    transcribed under bypass_602.notes_602 below, in print order, with their printed letters
    preserved as printed.
  - >-
    THE SCHEDULE-OF-COMPLIANCE MILESTONE TABLE IS NOT A COMPLETE INDEX OF THE SCHEDULE, AND
    ITS EVENT CODES DISAGREE WITH THE NARRATIVE THAT FOLLOWS IT. The one-page "Milestone
    Summary Report" (sheet 24) stops at February 1, 2030 / April 1, 2030. The narrative in
    Part I,C.2 (sheets 26-27) runs the CSO LTCP through TWO MORE named projects the table
    never mentions at all — "Sunset Avenue Separation and Detention" (four milestones,
    2032-2035) and "Programmatic Review" (due 2036-01-01) — neither with an event code
    printed anywhere. Within what the table DOES cover: (1) event codes are zero-padded in
    the narrative but not in the table for the same milestone, exactly the mansfield pattern
    (table `4599` / narrative `(Event Code 04599)`; table `1499` / narrative `(Event Code
    01499)`; table `3099` / narrative `(Event Code 03099)`); (2) the Weir Optimization
    narrative's step iii (due 2028-02-01) is printed with "(Event Code 30199)" — IDENTICAL to
    step ii's code for a different date (2027-02-01) — while the table gives step iii its own
    distinct code, `30299`; (3) the Fountain Avenue Tunnel narrative reuses "(Event Code
    30399)" for BOTH its step iii (2030-02-01, which the table also shows as `30399`, so
    that one agrees) AND its step iv (2031-02-01, which is not in the table at all) — the
    same code covering two different due dates; (4) "Initiate Design" is coded `1499`/`01499`
    for the Fountain Avenue Tunnel project (2028-02-01) and coded IDENTICALLY for the John
    Street Enhancement project's own, unrelated, "Initiate Design" milestone (2030-04-01) —
    which may simply mean these are generic milestone-TYPE codes rather than per-project
    codes, but the document never says so, and it means an event code alone cannot identify
    which project's design-initiation report was filed. See schedule_of_compliance below for
    the full narrative, transcribed with every code as printed.
  - >-
    THE BOUND FACT SHEET CONTRADICTS ITSELF ON WHEN CSO 003 WAS ELIMINATED. Its own
    "DESCRIPTION OF EXISTING DISCHARGE" narrative (Fact Sheet p.7) states "CSO 003 was
    eliminated in 2023 via separation," while Table 5's own footnote on the very data table
    it is introducing (Fact Sheet p.20) reads "CSO 003 was eliminated in 2020 via sewer
    separation." Two different years for the same fact, within the same 36-page sub-document.
    Neither is corrected against the other here.
  - >-
    THE FACT SHEET COVER PRINTS A DIFFERENT PERMIT NUMBER THAN THE ISSUED PERMIT. The bound
    Fact Sheet's own header reads "Ohio EPA Permit No.: 1PE00007*TD" — the draft/proposed
    action code — while the issued permit that precedes it in this same PDF is "1PE00007*VD"
    throughout. The Fact Sheet was evidently written for the proposed action (Public Notice
    No. 208345, noticed 2024-12-16, comment period ending 2025-01-15) and bound in unchanged
    after the permit was finalized two days after that comment period closed
    (action_date 2025-01-17) with a different action-code suffix. Both are transcribed as
    printed; no claim is made about what, if anything, changed in the interim.
  - >-
    THE E. COLI BLENDING EQUATION FOR STATION 099 IS STATED TWICE WITH DIFFERENT VARIABLE
    NAMES. The operative permit (sheet 5, Part I,A.2, Note a) defines it with Q = "flow rate
    (MGD)": "Combined Result = [(Q001 x C001) + (Q602 x C602)] / (Q001 + Q602)". The Fact
    Sheet's own restatement of "the same" equation (p.14) instead uses V = "volume (MG)":
    "Combined Result = [(V001 x C001) + (V602 x C602)] / (V001 + V602)". A rate and a volume
    are not the same quantity; the permit's own version (Q, MGD) is the operative one.
    Transcribed both ways, in place, below.

