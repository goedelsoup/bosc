      - {section: CSO LTCP, report_event: Submit LTCP, event_code: '15099', due: '2028-03-01'}
    cso_long_term_control_plan:
      preamble: >-
        "The permittee shall submit for review and approval a Long Term Control Plan (LTCP)
        consistent with the Combined Sewer Overflow Control Policy (Federal Register, Volume
        59, Number 75, April 19, 1994)."
      steps:
      - step: 1
        due: '2026-12-01'
        event_code: '11099'
        requirement: >-
          Submit a report on the development of a collection system hydraulic model,
          including calibration/validation and an assessment of modeled versus observed CSO
          occurrence and volume.
      - step: 2
        due: '2027-09-01'
        event_code: '21599'
        requirement: >-
          Submit a report presenting control alternatives to be reviewed for LTCP
          development, including technologies/operations to be evaluated and preliminary
          cost estimates.
      - step: 3
