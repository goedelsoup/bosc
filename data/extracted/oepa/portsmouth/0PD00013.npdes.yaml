      dilution_ratio_basis: >-
        The general formula printed just above the worked figure: "Chronic Dilution Ratio =
        ([7Q10 * % as applicable per OAC 3745-2-05] + [ADDF]) / [ADDF]". The worked figure
        itself, transcribed exactly as printed rather than normalized — the source's own
        expression is unbalanced (no closing parenthesis before the division, and the "="
        appears mid-expression rather than at the end), a document typo, not corrected here:
        "Chronic Dilution Ratio = ([10600 cfs * 10%] + 10.0 cfs / 10.0cfs = 107".
      monitoring_basis: >-
        "Lawson Run WWTP is not required to monitor for TUc because the available
        downstream dilution is more than twenty to one" per OAC 3745-33-07(B)(11)(c) — the
        computed ratio here is ~107:1.
      hazard_category: >-
        Attachment 1 (page 25 of 26): both Ceriodaphnia dubia and Pimephales promelas placed
        in Hazard Category 4 ("No toxicity"); 5 acute tests each, all non-detect except one
        Pimephales promelas result of 0.4 TUa on 2024-05-15 (Table 10, page 20 of 26). Table
        10's five dated rows are 5/6/2020, 5/5/2021, 5/5/2022, 5/18/2023 and 5/15/2024 — the
        0.4 result is the last (most recent) row; the table prints no 2025 row at all.
