permit:
  tag: '[verified]'
  confidence: high
  warnings:
  - >-
    FIVE OF THE TEN CSO OUTFALLS DISCHARGE TO THE SCIOTO RIVER, NOT THE OHIO RIVER — the
    authorization sentence on sheet 1 names only "Ohio River at Mile Point 353.9" as the
    receiving water, and that is correct for outfall 001 (final effluent) and CSOs
    002/003/004/010/011. But Part II Item C.1 (sheet 18-19) prints CSOs 005, 006, 007, 008
    and 009 as discharging to "Scioto River", not the Ohio River — see
    cso_outfalls below. A reader who takes the sheet-1 sentence as the whole
    story misses that half this permit's overflow points are on a different named
    waterbody. Portsmouth sits at the Scioto/Ohio confluence and the permit's own station
    table is where that geography actually surfaces.
  - >-
    THE PERMIT'S OWN E. COLI SUMMER LIMIT DISAGREES WITH THE FACT SHEET'S SUMMARY OF IT.
    Part I.A.1 (sheet 3) prints reporting code 31648 (E. coli, summer) with a WEEKLY limit
    of 284 #/100 mL and a MONTHLY limit of 126 #/100 mL — confirmed by re-extracting sheet 3
    in layout mode to rule out a column-alignment artifact; the digits are unambiguous.
    The bound Fact Sheet's Table 15 ("Final Effluent Limits for Outfall 001", page 24 of 26)
    prints E. coli (summer) with a "Daily Maximum" of 240 (footnoted "d = 7 day average
    limit") and a "30 Day Average" of 126. The monthly/30-day figure agrees (126); the
    weekly/"daily-maximum" figure does not (284 vs 240). Every other parameter's Table 15
    figures I checked against the operative Part I.A.1 table agree, once Table 15's load
    column is read as a ROUNDED restatement of Part I.A.1's own more precise figure: TSS
    concentration 45/30 vs Table 15's 45d/30, and TSS load 1107.1/738.1 vs Table 15's
    1107d/738; CBOD5 concentration 40/25 vs Table 15's 40d/25, and CBOD5 load 984.1/615.1 vs
    Table 15's 984d/615; fecal coliform winter 2000/1000 vs Table 15's 2000d/1000 (neither
    table prints a fecal-coliform load). Table 15 prints its loads truncated to whole kg/day
    (1107/738/984/615) against Part I.A.1's 1107.1/738.1/984.1/615.1 — the two tables differ
    only by rounding, not by disagreement. The Fact Sheet is Ohio EPA's own explanatory
    document, not the enforceable instrument — the
    OPERATIVE limit is the one printed in Part I.A.1: 284 weekly / 126 monthly. This is the
    document disagreeing with itself, transcribed as printed rather than silently reconciled.
  - >-
    THIS PERMIT HAS NO PHASE-IN AND NO SPLIT OUTFALL, UNLIKE THE MANSFIELD PRECEDENT. There
    is exactly one outfall (001) and exactly one effluent-limit table, titled "Table - Final
    Outfall - 001 – Final", covering the whole term 2026-01-01 through 2030-12-31 with no
    Initial/Final split. There is also no bypass station (602-style) at all — the Fact
    Sheet states plainly "Lawson Run WWTP has no wet weather bypass, though CSO 002 is near
    the headworks of the facility" (page 7 of 26). Wet-weather relief here is handled
    entirely through the ten numbered CSOs, not a permitted bypass.
  - >-
    ONLY SEVEN PARAMETERS AT OUTFALL 001 CARRY A NUMERIC LIMIT; EVERYTHING ELSE IS MONITOR
    ONLY. TSS, oil & grease, total residual chlorine, fecal coliform (winter), E. coli
    (summer), pH (max/min) and CBOD5 are the only limited parameters in Part I.A.1 (sheet
    2-3). Ammonia, TKN, nitrite+nitrate, total phosphorus, dissolved orthophosphate,
    nickel, silver, zinc, cadmium, lead, total chromium, copper, dissolved hexavalent
    chromium, low-level mercury, total filterable residue, flow rate, water temperature,
    dissolved oxygen, and BOTH whole-effluent-toxicity species carry monitoring frequencies
    and NO numeric limit. Mercury's limit was specifically REMOVED by this action (Fact
    Sheet, page 2 of 26: "Limits for mercury are proposed to be removed due to lack of
    reasonable potential") and silver's monitoring is NEW (same page). Do not assume this
    plant carries Mansfield-style seasonal ammonia/phosphorus WQBELs — the Ohio River's
    assimilative capacity at this point (Table 12: 7Q10 10,600 cfs vs. the plant's 10.057
    cfs design flow — a ~1000:1 ratio) is why almost nothing here is numerically limited.
  - >-
    STATION 001 AND CSO 002 SHARE THE IDENTICAL PRINTED COORDINATE, WITH INCONSISTENT SIGN
    NOTATION. Part II Item B (sheet 18) gives station 0PD00013001 as "38.7308 N, 82.9744 W"
    (no minus sign on the W value). Part II Item C.1 (sheet 18) gives CSO 0PD00013002 as
    "38.7308 N, -82.9744 W" (same digits, but with a minus sign in addition to the W
    letter). Same physical point — consistent with the Fact Sheet's statement that CSO 002
    sits near the plant headworks — printed two different ways in the same document.
  - >-
    NONE OF THE CSO LTCP SCHEDULE DATES HAVE PASSED AS OF 2026-08-26 (unlike the mansfield
    precedent, where 3 of 5 milestones had already lapsed). The three Part I.C milestones
    below are due 2026-12-01, 2027-09-01 and 2028-03-01 — all still in the future. This is a
    genuine finding, not an omission: this permit's compliance clock has not yet produced a
    single overdue deliverable to chase with a records request.
  - >-
    THE FACT SHEET SAYS PART III, ITEM 2 IS PROPOSED FOR REMOVAL; THE ISSUED PERMIT STILL HAS
    IT. The bound Fact Sheet's "SUMMARY OF PERMIT CONDITIONS" states plainly (page 2 of 26):
    "Part III, Item 2 ('General Effluent Limitations') is proposed to be removed" — and this
    file's fact_sheet.summary_of_changes_from_current_permit records that stated intent
    faithfully. But the issued instrument still prints "2. GENERAL EFFLUENT LIMITATION" in
    full, unchanged, at sheet 28 (see part_iii_general_conditions above) — and Part I.B's own
    CSO monitoring notes for station 002 (sheet 5) and stations 003-011 (sheet 7)
    affirmatively INVOKE it: "Subject to the terms and conditions of this permit, including
    the General Effluent Limitations in Part III, Item 2, the permittee is authorized to
    discharge from this station..." This file's own monitoring_stations.cso_002 and
    .cso_003_through_011 notes paraphrase that authorization without that clause — an
    omission on this file's part, not the permit's. Whatever Ohio EPA intended when drafting
    the Fact Sheet, the permit it actually issued neither removed Item 2 nor stopped relying
    on it.

