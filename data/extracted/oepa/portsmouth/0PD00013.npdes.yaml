        September 28, 2022." A Long Term Control Plan is required to continue progress
        toward Clean Water Act compliance (see schedule_of_compliance above).
    assessment_of_impact_on_receiving_waters:
      page: 8 of 26
      basis: ORSANCO's 2024 biennial "Assessment of Ohio River Water Quality Conditions (305b) Report" and pool reports; Lawson Run discharges in the Meldahl dam pool.
      attainment: >-
        "...in full attainment for the aquatic life and public water supply uses, as well as
        human health (fish consumption) use for mercury." 2017 biological surveys: fish
        communities "good", macroinvertebrate communities "fair".
      impairment: >-
        "Only partially supporting the human health (fish consumption) use due to
        polychlorinated biphenyls (PCBs) and dioxin, and only partially supporting
        recreation use due to high bacteria levels. Lawson Run WWTP is likely contributing
        to the recreation use impairment due to the high frequency and volume of CSO
        discharges from the City's collection system." This is Ohio EPA's own attribution,
        printed in the document that also sets this permit's CSO LTCP schedule.
