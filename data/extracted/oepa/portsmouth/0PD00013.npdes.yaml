      comment_period_ends: '2025-12-10'
      applicant: City of Portsmouth (728 Second Street, Portsmouth, OH 45662)
      facility: Lawson Run WWTP (2040 Charles Street, Portsmouth, OH 45662, Scioto County)
      receiving_water_as_printed_here: Ohio River
      contact: David Brumbaugh, (614) 644-2138 (page 4 of 26)
    location_and_use_classification:
      page: 6 of 26
      ohio_epa_river_code: '25-250'
      county: Scioto
      ecoregion: Western Allegheny Plateau
      designated_uses: Warmwater Habitat, Agricultural Water Supply, Industrial Water Supply, Bathing Waters, Public Water Supply
    facility_description:
      page: 6 of 26
      constructed: 1956
      last_upgraded: 2011
      average_daily_design_flow_mgd: 6.5
      peak_hydraulic_capacity_mgd: 10
      population_served_approx: 24000
      service_area: City of Portsmouth, Village of New Boston, Eden Park & North Moreland, Clay Township
      treatment_processes: [Screening, Grit and scum removal, Primary sedimentation, Trickling filters, Secondary clarification, Chlorination/dechlorination]
      sludge_processes: [Aerobic digestion, 'Mechanical dewatering – filter press']
