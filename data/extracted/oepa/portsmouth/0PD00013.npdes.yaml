      collection_system: '49% separate sewers and 51% combined sewers; ten CSOs; no wet weather bypass at the plant (CSO 002 sits near the headworks).'
      infiltration_inflow_rate_mgd:
        page: 7 of 26
        value: 2.4
        note: >-
          "Lawson Run WWTP estimates there is an infiltration/inflow (I/I) rate to the
          collection system of 2.4 MGD. The City is implementing I/I removal projects with
          New Boston and has implemented an extensive sewer lining program."
      enforcement_history: >-
        "The City was subject to an U.S. EPA Administrative Order on Consent due to wet
