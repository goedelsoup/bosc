  # ── Part II — other requirements of note (sheets 17-25) ──────────────────────────────────
  other_requirements_of_note:
    citation: 'Permit 0PD00013*PD, Part II, sheets 17-25'
    tag: '[verified]'
    limits_below_quantification:
      item: 'K. Limits Below Quantification (sheet 22)'
      qls_table: {chlorine_total_residual: {pql_mg_l: 0.05}}
      text: >-
        "For maximum effluent limits, any value reported below the QL shall be considered in
        compliance with the effluent limit. For average effluent limits, compliance shall be
        determined by taking the arithmetic mean ... using zero (0) for any value reported at
        a concentration less than the QL." Chlorine's printed permit limit (0.038 mg/l) is
        itself below this 0.050 mg/l quantification level.
    stormwater_no_exposure_certification:
      item: 'U. Stormwater No Exposure Certification (sheet 24)'
      certification_number: 0GRN00379*BG
      certified_date: '2024-12-26'
      recertification_due: '2029-12-25'
      text: >-
        "No later than December 25, 2029, the permittee must submit a new form for 'No
        Exposure Certification' or make other provisions to comply with the industrial
        stormwater regulations."
    biomonitoring_program:
      item: 'V. Biomonitoring Program Requirements (sheets 24-25)'
      text: >-
        "The permittee shall continue to implement an effluent biomonitoring program to
        determine the toxicity of the effluent from outfall 0PD00013001."
      testing: >-
        Definitive acute toxicity tests on Ceriodaphnia dubia and Pimephales promelas, per
        Ohio EPA's "Reporting and Testing Guidance for Biomonitoring", July 1998 (or current
        revision). SOP or verification of SOP submittal due no later than three months after
        the effective date — on or about 2026-04-01 [inference]. "Acute toxicity tests need
        not be performed for months in which chronic toxicity tests are conducted."
      definition: 'TUa = Acute Toxicity Units = 100/LC50 (sheet 25)'
    other_items_present:
      note: >-
        Transcribed as an index of what Part II contains, so a later reader knows what is in
        the instrument without re-walking it. Not summarized in detail here.
      items: >-
        A. Operator Certification, Professional Operator of Record, Minimum Staffing and
