# City of Urbana Water Reclamation Facility — NPDES permit 1PD00011*PD (application
# OH0027880), issued 2020-10-26 and effective 2020-12-01, expiring 2025-11-30.
#
# Hand-read from the committed PDF's embedded text layer, not machine-extracted. This
# document is digitally generated (producer "Acrobat Distiller 15.0", no scan, no OCR),
# so the text layer is the instrument's own bytes; every figure below is transcribed with
# its printed sheet cited on the block. Nothing is derived, rounded or inferred unless the
# block says so.
#
# No page was rasterized or sent to a vision model — every table in this permit's text
# layer resolved cleanly (verified against `extraction_mode="layout"` on the Part I.A
# table, and by grepping the raw text for every numeric figure transcribed below), so
# there was no ambiguous line requiring a 300 DPI check. This file carries no render
# receipt (no doc_id / dpi / pages_read). See watermark.models.TranscribedExtraction — a
# receipt is all-or-nothing and none was produced.
#
# The record -> document join (watermark.site.records._source_ref) reads a TOP-LEVEL
# `source_path`, so the primary instrument is named there as well as in meta.sources.
source_path: data/documents/oepa/urbana/1PD00011.pdf
