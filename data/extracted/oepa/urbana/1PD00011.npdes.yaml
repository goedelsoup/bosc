permit:
  tag: '[verified]'
  confidence: high
  warnings:
  - >-
    THIS PERMIT ESTABLISHES NO NUMERIC WHOLE-EFFLUENT-TOXICITY (WET) LIMIT ANYWHERE. All
    four toxicity parameters at the outfall (61425/61426 Ceriodaphnia dubia acute/chronic,
    61427/61428 Pimephales promelas acute/chronic — sheet 3, Part I.A) are MONITOR ONLY,
    1/Year in September, with no maximum or loading value printed. The four parallel
    ambient tests at the upstream station (61432/61435/61438/61441 — sheet 11, Part I.B.6)
    are likewise monitor-only, reported as "% Affected". Consistent with that, Part I.C
    (Schedule of Compliance, sheets 13-15) contains NO Toxicity Reduction Evaluation —
    only a pretreatment local-limits schedule and a phosphorus-optimization schedule. The
    permit does name the mechanism by which a WET limit could arrive: Part II Item X.4.a
    (sheet 28) states "Based on Ohio EPA's evaluation of the results, this permit may be
    modified to require additional biomonitoring, require a toxicity reduction evaluation,
    and/or contain whole effluent toxicity limits." This is a materially simpler permit
    than the Mansfield precedent on this axis: nothing here is currently driving toward a
    WET limit, but the permit itself preserves the path to one.
  - >-
    THIS PERMIT ESTABLISHES NO NUMERIC PHOSPHORUS LIMIT. 00665 Phosphorus, Total (P) is
    monitor-only (1/Week 24hr Composite, sheet 2) — no maximum, no weekly/monthly
    concentration or loading value. The only phosphorus-related obligation is Part
    I.C.B's "Evaluation for Reducing Discharge of Phosphorus" (sheet 15), a planning
    submittal, not an effluent limit.
  - >-
    PART I.B'S OWN SECTION NUMBERING SKIPS "3.": 1. SSO Monitoring (station 300, sheet 4),
    2. Sludge Monitoring (station 581, sheet 5), then the next section is numbered "4.
    Sludge Monitoring" (station 586, sheet 8), followed by 5. Influent (601, sheet 9), 6.
    Upstream (801, sheet 11), 7. Downstream-Nearfield (901, sheet 12). No section "3."
    exists anywhere in the 42 pages (confirmed by a full-text search). Part II Item B's
    station table (sheet 17) independently corroborates the same absence: it lists exactly
    seven stations — 001, 300, 581, 586, 601, 801, 901 — with NO 588 (sludge transfer to
    another NPDES permit holder), and NO 602/603 (equalization-basin bypass / stormwater)
    station of any kind. A full-text search of the extracted PDF for "588", "1PD00011602"
    and "1PD00011603" returns zero hits. The numbering gap is consistent with a permit
    template that drops an unused station (588 would have been item "3.") without
    renumbering what follows — that explanation is [inference]; the gap and the absence of
    those station IDs are [verified] directly from the document.
  - >-
    NOTE "a" UNDER THE OUTFALL 001 TABLE (sheet 3) PRINTS "LEAD" TWICE: "Cadmium, copper,
    lead, total chromium, lead, nickel, and zinc- See Part II, Item L." Transcribed
    verbatim; this is the document's own typo, not normalized away.
  - >-
    THE PRINTED DMS COORDINATE FOR STATION 1PD00011001 (sheet 17: Lat 40°N 05' 46", Long
    83°W 47' 50" → converted here to 40.096111, -83.797222, [inference], see
    sampling_stations.'1PD00011001'.coordinate_note) differs slightly from the coordinate
    this repo's data/documents/oepa/urbana/README.md and filename-map.yaml record for the
    same outfall (40.095278, -83.797222), which is sourced from the 2025 renewal
    application (eDoc 3832476) — a different, out-of-scope document, not transcribed here.
    Both name the same physical outfall to the Mad River. The two figures are not
    reconciled by this extraction; doing so would require reading eDoc 3832476 itself.
  - >-
    THE PERMIT NEVER CALLS ITSELF A "MODIFICATION" OR A "RENEWAL" ANYWHERE IN ITS OWN TEXT
    — the sheet 1 header carries only "Issue Date / Effective Date / Expiration Date"
    labels with no qualifying word, and the word "renewal" appears three times elsewhere
    in the document but never in reference to this permit's own issuance (once about the
    NEXT renewal application, twice in unrelated definitions). `permit_action` below is
    therefore [reference], drawn from this corpus's filename-map.yaml annotation (which
    calls it "Issued NPDES permit ... 2020 renewal cycle"), NOT [verified] from the face of
    the permit.
  - >-
    ALL "NORTHWEST"/"NORTHEAST"/"CENTRAL" DISTRICT-OFFICE MENTIONS IN THIS PERMIT (4 each)
    are the generic six-office contact list, which is printed FOUR times, not once — under
    both Part III Item 12.A (Exceedance of a Daily Maximum Discharge Limit) and Item 12.B
    (Other Permit Violations), each giving the list once by e-mail and once by phone
    (sheets 36-37) — that Ohio EPA prints in every NPDES permit regardless of which office
    actually holds the file. "Southwest" appears 10 times total in this document — a
    correct raw count, but only 6 of those are a SUBSTANTIVE routing instruction specific
    to this facility; the other 4 sit inside that generic list. The 6 substantive mentions
    are: the pretreatment local-limits schedule (Part I.C.A, sheet 13); the phosphorus
    optimization plan (Part I.C.B, sheet 15 — named twice, once for the plan copy and once
    for the follow-on PTI application); the operator-of-record backup-request provision
    (Part II.A.2.d, sheet 16); the 5-day written follow-up report for an SSO that may
    imminently and substantially endanger human health (sheet 18); and the annual SSO
    report hardcopy (sheet 20). All 6 name the SOUTHWEST District Office, consistently.
    Unlike the Mansfield precedent, this permit does not disagree with itself about which
    office to address.
  - >-
    THE AUTHORIZATION SENTENCE NAMES THE RECEIVING WATER DIRECTLY: sheet 1 reads "...
    wastewater treatment works located at 1263 Muzzy Road, Urbana, Ohio, Champaign County
    and discharging to Mad River in accordance with the conditions specified in Parts I,
    II, and III of this permit." No river mile is printed anywhere in this permit (a
    full-text search for "River Mile" and "RM " returns zero hits) — unlike the Mansfield
    precedent, which named a river mile but omitted the water's name. Recorded here because
    the mansfield precedent's structure expects this line to be checked, not because this
    document has a defect on it.
  - >-
    THIS PERMIT LISTS ONLY THREE PARTS ("Parts I, II, and III") IN ITS OWN AUTHORIZATION
    SENTENCE, not six. There is no Part IV/V/VI (SWPPP/stormwater) content anywhere in this
    document — consistent with the facility having no bypass (602) or stormwater (603)
    outfall station and the industrial stormwater "No Exposure Certification" (Part II
    Item Y) being handled as a single paragraph rather than a dedicated set of parts.
    [reference] Per data/documents/oepa/urbana/README.md, the City's separate MS4
    stormwater program is regulated under permits OHQ000003 / 1GQ00062 — neither permit
    number appears anywhere in this document (0 occurrences, verified); these are
    different documents outside this task's scope.
  - >-
    THE STORM WATER "NO EXPOSURE CERTIFICATION" RECERTIFICATION DEADLINE HAS PASSED. Part
    II Item Y (sheet 28) states the permittee's "No Exposure Certification" (number
    1GRN00960*AG) was signed 2020-06-30 and "must be re-affirmed every five years... No
    later than June 30, 2025, the permittee must submit a new form." As of 2026-08-26 that
    date is over a year past. Nothing in this single document establishes whether a new
    certification was filed — that is `[open]`, not a finding of noncompliance.

