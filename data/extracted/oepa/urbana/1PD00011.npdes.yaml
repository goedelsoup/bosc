        while 61441 on the same sheet prints "promelas". Silently normalized to "promelas"
        above (ambient_toxicity); the document's own inconsistency, recorded here rather
        than transcribed literally in the parameter list.
    downstream_nearfield_901:
      section: '7'
      description: Receiving stream BELOW the discharge, at the Old Troy Pike bridge
      parameters: >-
        Water temperature, pH, ammonia, total Kjeldahl nitrogen, nitrite+nitrate, total
        phosphorus, total hardness (as CaCO3) — 1/Month Grab, all months; E. coli 1/2 Weeks
        Grab, June - Aug.
      note: 'Sampling for the respective/common parameters shall occur on the same day as Outfall 1PD00011001.'
      significance: >-
        801 + 901 together are a committed monthly upstream/downstream nutrient record on
        the Mad River, arriving through DMRs for the life of the permit (to 2025-11-30). It
        is an ambient dataset the City is obliged to produce, not one anybody has to go
        collect.

  # ── Part I.C — SCHEDULE OF COMPLIANCE (sheets 13-15) ─────────────────────────────────────
  schedule_of_compliance:
    citation: 'Permit 1PD00011*PD, sheets 13-15, Part I.C'
    tag: '[verified]'
    structure_note: >-
      Only TWO items — A (Municipal Pretreatment Schedule) and B (Evaluation for Reducing
      Discharge of Phosphorus). No Toxicity Reduction Evaluation schedule — consistent with
      there being no numeric WET limit in this permit; see warnings[0].
    municipal_pretreatment_schedule:
      part: I.C.A
      due: '2021-12-01'
      due_basis: >-
        [inference] — the permit says "no later than twelve (12) months from the effective
        date of this permit"; 2020-12-01 + 12 months.
      event_code: '52599'
      submit_to: 'Ohio EPA, Central Office Pretreatment Unit and to Ohio EPA, Southwest District Office'
      requirement: >-
        Evaluate the adequacy of local industrial user limitations to prevent pollutants
        entering the POTW that would interfere with its operation, pass through in amounts
        exceeding water quality standard-based limits, be incompatible with the POTW, or
        limit wastewater/sludge use options. Submit either a technical justification for
        REVISING local limits (with a pretreatment program modification request) or a
        technical justification for RETAINING the existing ones, following Ohio
        EPA's/USEPA's local limits guidance.
      pollutants_requiring_justification: >-
        Arsenic, cadmium, total chromium, dissolved hexavalent chromium, copper, free
        cyanide, lead, mercury, molybdenum, nickel, selenium, silver and zinc — "unless
        screening of wastewater and sludge indicate these pollutants are not present in
        significant amounts" — plus any other pollutant where a local limit may be
        necessary to protect against pass through, interference or sludge disposal.
      report_contents_index: >-
        a. pollutants of concern and justification; b. plant/industrial flows (incl. hauled
        waste data if applicable); c. domestic/background concentrations (min. 3 locations
        x 5 days, or 2 locations x 7 days); d. plant removal efficiencies; e. maximum
        allowable headworks loadings comparison; f. pollutant-load allocation method (if
        revising limits); g. narrative/BMP local limits implementation (if proposed); h.
        supporting data/assumptions/methodologies; i. PE stamp and signature (if new or
        revised limits proposed).
      engineering_requirement: >-
        If new or revised industrial user discharge limits are proposed, the report
        requires "the stamp and signature of a licensed Ohio professional engineer."
      sampling_methods: >-
        a. Mercury — if EPA Method 245.1/245.2 shows below-detection domestic background
        concentrations, the permittee shall use EPA Method 1631 or 245.7 to quantify
        domestic background mercury contributions. b. Free Cyanide — the permittee shall
        use ASTM D7237, OIA-1677-09, or ASTM D4282-02 (the latter requiring supporting
        "sufficiently sensitive" documentation under 40 CFR 122.44(i)(1)(iv)).
      revisions: >-
        A revised report is due within 90 days of Ohio EPA notifying the permittee of
        deficiencies; revised limits must be incorporated into all industrial user control
        documents no later than 4 months after Ohio EPA's approval.
    phosphorus_optimization:
      part: I.C.B
      due: '2021-12-01'
      due_basis: >-
        [inference] — the permit says "no later than 12 months from the effective date of
        this permit"; 2020-12-01 + 12 months. Same computed due date as the pretreatment
        schedule item above, though the permit states each independently rather than
        cross-referencing the other.
      event_code: '01299'
      submit_to: >-
        "One copy to the Ohio EPA Southwest District Office and one copy to: Ohio EPA,
        Division of Surface Water, NPDES Permit Unit, P.O. Box 1049, Columbus, OH,
        43216-1049."
      requirement: >-
        Prepare and submit for acceptance a Phosphorus Discharge Optimization Evaluation
        plan — an evaluation of collected effluent data, possible source reduction
        measures, operational improvements and minor facility modifications that will
        optimize reductions in phosphorus discharges from the WWTP, including a proposed
        schedule for implementing any recommended measures. Upon Ohio EPA's acceptance, the
        permittee shall implement the plan; a complete PTI application may be required.
        Also requires completing the "Evaluation for Reducing Discharge of Phosphorus Form"
        alongside a future permit renewal application.
    status_of_these_milestones:
      tag: '[open]'
      as_of: '2026-08-26'
      lapsed: >-
        Both milestone dates (2021-12-01, pretreatment local-limits justification and
        phosphorus optimization plan) are nearly five years in the past.
      what_is_not_established: >-
        WHETHER EITHER WAS FILED. Nothing in this document establishes that — no
        submittal, no acknowledgment, no violation notice, and no ECHO/ICIS extract is
        transcribed here. "Past due" means the date has passed, NOT that the City missed
        it. This is not to be written as a missed deadline.
      how_to_close_it: >-
        A public-records request to Ohio EPA for the 52599 and 01299 submittals under
        permit 1PD00011 / OH0027880 would settle both.

  # ── Part II — other requirements of note (sheets 16-29) ─────────────────────────────────
  other_requirements_of_note:
    citation: 'Permit 1PD00011*PD, Part II, sheets 16-29'
    tag: '[verified]'
    bypass_trigger: >-
      NONE. This permit has no equalization-basin bypass station and Part II contains no
      bypass-trigger item comparable to the Mansfield precedent's Item V. See warnings[2]
      and warnings[8] (only Item Y, industrial storm water, addresses a related but
      distinct topic).
    biomonitoring_program:
      item: 'X. Biomonitoring Program Requirements (sheet 27)'
      text: >-
        "The permittee shall continue to implement an effluent biomonitoring program to
        determine the toxicity of the effluent from outfall 1PD00011001." Single outfall,
        so — unlike the Mansfield precedent's 001/002 station disagreement — there is no
        ambiguity about which stream this program tests.
      testing: >-
        Annual chronic bioassays (Ceriodaphnia dubia and Pimephales promelas) and annual
        definitive acute bioassays (same species) for the life of the permit, per Ohio
        EPA's "Reporting and Testing Guidance for Biomonitoring", July 1998 (or current
        revision). "Acute toxicity tests need not be performed for months in which chronic
        toxicity tests are conducted" — acute endpoints are then derived from the chronic
        test. Ambient (upstream, station 801) testing runs alongside. The SOP (or
        verification of SOP submittal) was due no later than three months after the
        effective date — on or about 2021-03-01 [inference].
      definitions: 'TUa = Acute Toxicity Units = 100/LC50. TUc = Chronic Toxicity Units = 100/IC25 (or, for Ceriodaphnia dubia outside the mixing zone when more restrictive, 100/sqrt(NOEC x LOEC)).'
    storm_water_no_exposure_certification:
      item: 'Y. Storm Water (sheet 28)'
      text: >-
        "To comply with industrial storm water regulations, the permittee submitted a form
        for 'No Exposure Certification' which was signed on June 30, 2020. The
        certification number is 1GRN00960*AG." Recertification is due every five years —
        see warnings[9] for the lapsed 2025-06-30 deadline.
    pretreatment_program:
      item: 'W. Pretreatment Program Requirements (sheets 23-27)'
      initially_approved: February 1987
      waste_load_allocation_values_ug_per_l_unless_noted:
        arsenic: 904
        cadmium: 41
        chromium_hexavalent: 31
        chromium_total: 1467
        copper: 98
        free_cyanide: 19
        lead: 211
        mercury_ng_per_l: 12
        molybdenum: 120539
        nickel: 964
        selenium: 30
        silver: 0.36
        zinc: 740
      wla_note: >-
        "The permittee shall use the following waste load allocation values when
        evaluating local limits for the following pollutants for which a final effluent
        limit has not been established" — these are planning inputs for the Part I.C.A
        local-limits report, not permit limits themselves.
      enforcement: >-
        On or before January 15 each year, the permittee must publish, in a newspaper of
        general circulation, a list of industrial users in Significant Noncompliance (SNC)
        over the previous 12 months.
      reporting: >-
        Quarterly Industrial User Violation Report due Jan/Apr/Jul/Oct 15. Annual
        Pretreatment Report due January 15, covering program effectiveness, industrial user
        inventory, monitoring program description, pass-through/interference incidents, the
        SNC publication copy, and priority-pollutant monitoring results.
      record_keeping: Minimum 3 years, extended during unresolved litigation.
      program_modifications: >-
        Substantial modifications require prior Ohio EPA approval; otherwise effective 45
        days after application.
      transcription_note: >-
        Sheet 25, Item 6 (Control Mechanisms) reads: "the permittee shall issue control
        mechanisms to all industries determined to be Significant Industrial Users as
        define in OAC 3745-3-01" and cites "OAC-3745-3-03(C)(1)(c)" with that hyphenation.
        Both transcribed verbatim; the document's own typo/hyphenation, not normalized
        away.
    other_items_present:
      note: >-
        Transcribed as an index of what Part II contains, so a later reader knows what is
        in the instrument without re-walking it. Not summarized in detail here.
      items: >-
        A. Operator Certification Requirements (Class III treatment works / Class II
        collection systems, OAC 3745-7-04) · C. Sanitary Sewer Overflow (SSO) Reporting
        Requirements · D-J. General facility-operation/reporting/sampling-method
        definitions (85% removal requirement at I; J. Reserved) · K. RCRA "permit-by-rule"
        for POTWs accepting hazardous waste by truck/rail/pipeline · L/M/N. Same-day and
        one-detention-time sampling coordination between stations 001 and 601 · O-R. Sewage
        sludge disposal, composite-sampling, and annual-report requirements, incl. the
        gallons-to-dry-tons conversion formula · S. Monitoring for Dissolved
        Orthophosphate (0.45-micron filtered grab, analyzed within 48 hours) · T.
        Monitoring for Mercury (low-level, EPA Method 1631 or 245.7) · U. Monitoring for
        Free Cyanide (low-level, ASTM D7237-10 / OIA-1677-09 / ASTM D4282-02) · V. Outfall
        Signage · Z. Reservation of right to revise water-quality-based limits on updated
        wasteload allocations, use designations, or an approved TMDL.

