# Method note (important, and different from the OCR-scan rule in CLAUDE.md): this is a
# DIGITALLY GENERATED Ohio EPA PDF, not a scan. Its text layer is the document's own embedded
# text, not an OCR guess, so every figure below is read from it verbatim rather than re-keyed
# from a render. This is a REVIEWED TRANSCRIPTION, not a `watermark extract --kind npdes` run:
# no vision pass was made, `pages_read` is therefore empty, and each block cites the 1-based
# printed sheet ("Page N of 35") it was transcribed from.
permit:
  confidence: high
  warnings:
  - >-
    Table 12's low flows are NOT measured at Ottawa. They are drainage-adjusted from USGS gauge
    04189500 (Blanchard River at Glandorf) over 1921-1951 — a record that ended before the
    network's own derived 7Q10 window (1980-2024) begins. The 7.78 cfs here and the 8.67 cfs in
    data/reference/hydrology/low-flow-7q10.derived.yaml are two different rivers-worth of
    arithmetic, not a disagreement to be resolved by preferring one. See
    data/reference/network/findlay-ottawa-comparison.yaml.
  - >-
    The background in-stream mercury concentration used in the wasteload allocation is ZERO,
    stated in Table 12 as "No representative data available." Nothing here establishes that the
    Blanchard carries no mercury above Ottawa; it establishes that Ohio EPA had no ambient datum
    to put in the equation.
  - >-
    The aquatic-life finding quoted below ("No impact attributed to the Ottawa WWTP discharge was
    apparent...") is quoted BY this 2024 fact sheet FROM the July 2009 Blanchard River TMDL. The
    biological sampling behind it predates the 2025-26 mercury exceedances by more than fifteen
    years. It is carried because the discipline requires it, not because it speaks to them.
