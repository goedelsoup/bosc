  page: 10
  applicable_uses_and_design_flows:
    aquatic_life_warmwater_habitat_toxics_average: Annual 7Q10
    aquatic_life_warmwater_habitat_toxics_maximum: Annual 1Q10
    ammonia_average: Summer 30Q10 / Winter 30Q10
    wildlife: Annual 90Q10
    agricultural_water_supply: Harmonic mean flow
    human_health_nondrinking: Harmonic mean flow
  general_equation: Discharger WLA = (Downstream Flow x WQS) - (Upstream Flow x Background Concentration)
