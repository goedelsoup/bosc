review:
  issue: 1422
  reviewed_on: '2026-07-31'
  method: >-
    Verbatim transcription from the PDF's embedded text layer (pypdf), page by page. No figure is
    derived, rounded or carried over from another document except where a block says so
    explicitly and names the other instrument. Where a value is computed here rather than printed,
    the block says `derived: true` and shows the arithmetic.

