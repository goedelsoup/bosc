facility_description:
  pages: [6, 7]
  constructed: 1998
  last_upgraded: 2019
  average_design_flow_mgd: 3.0
  serves:
  - Village of Ottawa
  - Village of Glandorf
  - Sewer District #1
  - Sewer District #2
  - Pohle Road District
  treatment_processes:
  - Fine Screen
  - Grit Removal
  - Flow Equalization
  - Oxidation Ditch
  - Addition of Alum
  - Secondary Clarifiers
  - Ultraviolet Disinfection
  disinfection_is_uv_not_chlorine:
    tag: '[verified]'
    note: >-
      The WWTP disinfects with ULTRAVIOLET light, not chlorine. It therefore adds no chlorine to
      the Blanchard. Any account of the Village's trihalomethane problem that runs through the
      sewage plant is wrong: TTHM is formed at the WATER plant, where chlorine meets the river's
      natural organic carbon. The two sides of this river share a river, not a chemical pathway.
  sewers: 100% separated
  csos: none
  bypass:
    outfall: '002'
    description: >-
      Flows exceeding the WWTP's hydraulic capacity are diverted to a 3.0 MG equalization basin
      whose overflow is outfall 002; overflows are disinfected before discharge and may discharge
      only under the Part III bypass conditions.
  pretreatment_program: none approved
  industrial_users: 2
  industrial_user_flow_mgd: 0.014
  sludge:
    treatment: [Aerobic Digestion, 'Polymer/Lime/Ferric Chloride/Alum Addition', Sand Bed Dewatering]
    disposal: land applied
  icis_discrepancy:
    tag: '[verified]'
    note: >-
      EPA's ICIS-NPDES record for OH0026921 lists the facility's areas as "Biosolids, CSO, POTW,
      Pretreatment". The permit and fact sheet state the Village has 100% separated sewers (no
      CSOs) and no approved pretreatment program. Both records are stated as they stand. The
      instrument is the better authority on what the plant is; the discrepancy is recorded so a
      later reader does not mistake an ICIS flag for a combined sewer.

receiving_water_assessment:
  pages: [7, 8]
  assessment_unit: Pike Run-Blanchard River
  section_303d_status: impaired for aquatic life and recreation
  impairment_causes_named:
  - point sources such as CSOs
  - failing home sewage treatment systems (HSTS)
  - manure from livestock operations
  reach_below_the_outfall: full attainment for aquatic life
  ohio_epa_conclusion: >-
    "The river section downstream of the WWTP is in full attainment for aquatic life. Ottawa WWTP
    is not likely contributing to the impairments in the Blanchard River."
  tmdl_quoted: Blanchard River TMDL, approved July 2009
  tmdl_quote: >-
    "No impact attributed to the Ottawa WWTP discharge was apparent in the performance of the fish
    and macroinvertebrate assemblages. Siltation and generally slow current velocity appeared to be
    the principle determinants of macroinvertebrate and fish community structure in the Blanchard
    River Large River Assessment Unit (LRAU)."
  both_statements_stand:
    tag: '[verified]'
    note: >-
      The assessment UNIT is impaired for aquatic life and the reach BELOW THE OUTFALL is in full
      attainment. Both sentences are in this one document, four paragraphs apart, and neither
      cancels the other. Quoting either alone misrepresents the record.
  vintage_caveat:
    tag: '[verified]'
    note: >-
      The exculpatory quote is from the JULY 2009 TMDL. Whatever it establishes, it establishes
      about biological sampling conducted before 2009 — not about a discharge that exceeded its
      mercury limit by 716% in December 2025. None of the impairment causes named is mercury.

