    Blanchard River is described by Ohio EPA River Code: 04-160 Hydrologic Unit Code:
    04100008-06-02, County: Putnam, Ecoregion: Huron-Erie Lake Plains."
  same_river_as_findlay:
    finding: >-
      Findlay WPCC's outfall is at River Mile 56.42 of the same river under the same Ohio EPA
      river code 04-160 (data/extracted/oepa/findlay/2PD00008.fs.npdes.yaml). The two outfalls
      are therefore 34.32 river miles apart, read off the two fact sheets' own river miles.
