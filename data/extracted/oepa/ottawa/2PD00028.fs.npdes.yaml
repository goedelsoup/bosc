acute_dilution:
  page: 11
  formula: (1Q10 + WWTP flow rate) / WWTP flow rate
  computed_as: (5.42 cfs + 4.64 cfs) / 4.64 cfs
  ratio: 2.2
  acute_wla: 40 percent mortality in 100 percent effluent
  note: >-
    At 2.2-to-1 Ottawa sits inside the band the fact sheet flags: "If the acute dilution ratio is
    less than 3.3 to 1.0, and there is evidence that effluent values between 0.3 TUa and 1.0 TUa
    cause or contribute to violations of WQS, the permittee may be required to investigate and
    remediate toxicity in this range." Its upstream sibling Findlay is at 1.0-to-1.

