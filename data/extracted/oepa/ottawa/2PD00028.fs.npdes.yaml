use_designations:
  page: 6
  rule: OAC 3745-1-11
  designated_uses:
  - Warmwater Habitat
  - Agricultural Water Supply
  - Industrial Water Supply
  - Primary Contact Recreation
  public_water_supply_designation: absent
  quote: >-
    "The Blanchard River is designated for the following uses under Ohio's WQS (OAC 3745-1-11):
    Warmwater Habitat, Agricultural Water Supply, Industrial Water Supply, and Primary Contact
    Recreation."
  the_reach_below_the_village_is_not_a_drinking_water_reach:
    tag: '[verified]'
    finding: >-
      The reach Ottawa discharges to at RM 22.1 carries NO Public Water Supply use designation,
      and the fact sheet states the rule that explains why: "Public Water Supply designations
      apply near existing water intakes so that waters are safe to drink with standard treatment.
      Most other waters are designated for agricultural water supply and industrial water supply"
      (p. 6). The Village's own intake is upstream of this outfall, so the reach below it reverts
      to agricultural/industrial water supply.
    consequence: >-
      It follows from the fact sheet's own wasteload-allocation table (p. 10) that the human-health
      criterion applied to this discharge is the NONDRINKING one — the list of applicable uses
      reads "Human Health (nondrinking) ... Harmonic mean flow". The mercury human-health criterion
      used is accordingly 3.1 ng/L (Table 11), and the binding criterion overall is the WILDLIFE
      value of 1.3 ng/L, not any drinking-water number.
    discipline: >-
      This is ordinary and correct regulatory practice, not a finding of wrongdoing. It is
      recorded because it is the precise structural fact behind this site's "one river, both
      sides" framing: the same river is a public drinking-water source above the village and a
      non-drinking reach below it, and the permit is written against the second.

