mercury_variance:
  pages: [13, 14]
  authority: OAC 3745-1-38(H)
  authority_discrepancy: >-
    The fact sheet's own basis-code key (p. 33) expands VAR as "Variance from a WQS (Mercury
    variance (OAC 3745-1-38(J)))" — subsection (J), where the narrative text on p. 13 and the
    permit's Part II Item X both cite subsection (H). Both citations are recorded as printed;
    neither is corrected against the other.
  wqbel_monthly_average_ng_l: 1.3
  variance_limit_monthly_average_ng_l: 4.5
  variance_limit_daily_maximum_ng_l: 1250
  daily_maximum_basis: >-
    antibacksliding — "The current daily max value in the existing permit is lower than the WQC of
    1700 ng/L Due to antibacksliding provisions the existing limit of 1250 ng/L will be kept."
  annual_average_condition_ng_l: 12
  prior_permit_history:
    renewed: '2014-04-01'
    note: The 2014 renewal already carried the general mercury variance and variance-based limits.
  how_the_4_5_was_set:
    tag: '[verified]'
    quote: >-
      "The calculation of the PEQavg value from 2019 to 2024 compared to the PEQavg calculated at
      the time the original variance was issued shows a reduction from 7.1 to 4.5 ng/L."
    peq_table_page: 24
    peq_table: Table 8, "Projected Effluent Quality for Outfall 001"
    peq_table_columns: [Parameter, Units, Samples, 'of > MDL', PEQ Average, PEQ Maximum]
    peq_table_row: 'Mercury | ng/L | 63 | 63 | 4.5 | 7.1'
    finding: >-
      The monthly-average limit is not a treatment standard and is not derived from the water
      quality criterion. It is the plant's own projected effluent quality over 63 samples,
      2019-2024 — every one of them above the method detection limit — adopted as the limit. Ohio
      EPA set the limit AT the plant's demonstrated average performance, which is exactly why an
      ordinary bad month becomes a permit violation.
    what_the_two_numbers_are:
      tag: '[verified]'
      note: >-
        In Table 8 the 4.5 and the 7.1 are the PEQ AVERAGE and the PEQ MAXIMUM of the SAME 63-sample
        2019-2024 dataset. They are not a before-and-after pair.
    narrative_table_tension:
      tag: '[open]'
      statement: >-
        The p. 14 narrative describes 7.1 and 4.5 as a time series — "the PEQavg value from 2019 to
        2024 compared to the PEQavg calculated at the time the original variance was issued shows a
        reduction from 7.1 to 4.5 ng/L" — i.e. it calls 7.1 the ORIGINAL variance's PEQ average.
        Table 8 four pages later prints 7.1 as the CURRENT dataset's PEQ maximum. Both readings
        cannot be got from Table 8 alone, and the original variance's PEQavg is not reproduced in
        this document.
      why_it_matters: >-
        The narrative's reading is the one that supports the variance renewal, because a fall from
        7.1 to 4.5 is the "reasonable progress" the rule requires. If 7.1 is instead just this
        dataset's maximum, the document contains no figure demonstrating progress at all.
      resolution: >-
        Not resolvable from the committed bytes. The 2014 permit and its variance application would
        settle it. Lead OTTAWA-PEQ-2014-BASELINE.
  demonstration_accepted:
    quote: >-
      "the Ottawa WWTP has determined that the facility will not be able to meet a 30-day average
      permit limit of 1.3 ng/l based on complying with the water quality criteria. However, the
      effluent data shows that the permittee can meet the mercury annual average value of 12 ng/l.
      The permittee's application has also demonstrated to the satisfaction of Ohio EPA that there
      is no readily apparent means of complying with the WQBEL without constructing prohibitively
      expensive end-of-pipe controls for mercury."
  minimization_actions_credited:
    quote: >-
      "The permittee performed monitoring, contacting dentists, performed wastewater line
      flushing, eliminated infiltration, and monitored industrial users to reduce the amount of
      mercury coming being discharged."
    note: Transcribed verbatim, including the "coming being" typo in the source.
  modified_allowable_ambient_concentration_ng_l: 2.08
  maac_source: >-
    Ohio EPA, "January 2026 List of Variances" (data/documents/oepa/Jan_2026_List_of_Variances.pdf),
    row "Ottawa WWTP | 2PD00028*PD | 001 | 3/1/2025 | 2/28/2030 | Blanchard River | Mercury | 2.08".
  maac_derivation:
    tag: '[inference]'
    formula: MAAC = (monthly variance limit x discharger flow) / (discharger flow + 0.25 x annual 90Q10)
    arithmetic: (4.5 x 4.6417) / (4.6417 + 0.25 x 21.66) = 20.8877 / 10.0567 = 2.077
    printed_value: 2.08
    why_the_90q10: >-
      Mercury's binding criterion is the WILDLIFE value (Table 11), and the fact sheet's own list
      of applicable uses (p. 10) assigns wildlife the annual 90Q10 design flow. The 25% factor is
      Table 12's average mixing assumption.
    cross_check:
      site: findlay
      arithmetic: (3.3 x 23.208) / (23.208 + 0.25 x 0.32) = 76.5864 / 23.288 = 3.2887
      printed_value: 3.29
      source: >-
        Findlay's own variance-list row and its committed fact-sheet extraction
        (data/extracted/oepa/findlay/2PD00008.fs.npdes.yaml — monthly limit 3.3 ng/L, discharger
        flow 23.208 cfs, annual 90Q10 0.32 cfs).
      note: >-
        The formula reproduces BOTH sites' published MAACs to the printed precision from values
        each site's own fact sheet prints. That is what promotes this from a guess to a recorded
        [inference]; it is still not a statement of Ohio EPA's method.
    what_it_means:
      tag: '[inference]'
      statement: >-
        The variance's effect in the river, stated in the river's own units: the allowable ambient
        mercury concentration below this outfall is raised from the 1.3 ng/L wildlife water quality
        standard to 2.08 ng/L — a factor of 1.6. Against a background the same fact sheet records
        as unmeasured.

