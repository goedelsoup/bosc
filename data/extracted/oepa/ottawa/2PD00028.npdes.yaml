permit:
  confidence: high
  warnings:
  - >-
    The permit spells its own outfall three ways. Part II Item X.1.a writes "outfall 2DP00028001",
    X.2.c writes "outfall 2DP00028", and Part II Item AA.1 writes "outfall 2PD00028001". The
    permit number is 2PD00028; the "2DP" spellings are transpositions in the source. Preserved as
    printed. A records search keyed on "2DP00028" will hit this document; one keyed only on
    "2PD00028" will still find it, because the cover page and limit tables use the correct form.
  - >-
    ICIS-NPDES codes the mercury limit set for this permit as running 2025-03-01 to 2028-02-29,
    two years short of the permit's own 2030-02-28 expiration. The permit itself carries the
    4.5 ng/L monthly average in BOTH of its Part I.A limit tables, and both tables state the
    period "beginning March 1, 2025, and lasting until February 28, 2030." The instrument governs;
    the ICIS end date appears to be a coding artifact. Both are recorded, neither corrected.
