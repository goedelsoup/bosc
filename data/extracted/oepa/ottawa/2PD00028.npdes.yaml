mercury_variance_conditions:   # Part II, Item X — "General Mercury Variance"
  pages: [26, 27, 28]
  authority: Rule 3745-01-38(H) of the Ohio Administrative Code
  wqbel_monthly_average_ng_l: 1.3
  annual_average_ceiling_ng_l: 12
  annual_average_definition:
    quote: >-
      "For general mercury variance purposes, the annual average mercury effluent concentration is
      defined as the average of the most recent 12 months of effluent data."
    note: >-
      A ROLLING twelve-month mean, not a calendar-year one. This is the permit's own definition and
      it is what data/extracted/ottawa/water-watch.yaml computes the annual-average series against.
  variance_application_submitted: '2024-05-07'
  analytical_method: EPA Method 1631
  pmp_activities_required:
  - Continued monitoring for mercury throughout the community
  - Continued research into better techniques to remove mercury from the system
  - Continued involvement with the local dental community
  - Continued wastewater line flushing
  - Continued infiltration elimination
  - Additional monitoring of industrial users
  annual_pmp_report_due: on or prior to March 1 of each year, to Ohio EPA Division of Surface Water
  consequences_of_exceeding_the_annual_ceiling:
    page: 28
    trigger: annual average mercury effluent concentration exceeds 12 ng/L
    required_steps:
    - Notify Ohio EPA's Northwest District Office not later than 30 days from the date of the exceedance
    - Submit an individual variance application, if a variance is desired, not later than 6 months from the date of the exceedance
    - or Request a permit modification not later than 6 months from the date of the exceedance for a compliance schedule
    failure_clause_quote: >-
      "If the permittee does not comply with either 2.a.ii or 2.a.iii, above, a monthly water-quality
      based effluent limit for mercury of 4.5 ng/L shall apply at outfall 2DP00028 beginning 6
      months from the date of the exceedance."
    apparent_drafting_artifact:
      tag: '[inference]'
      statement: >-
        As written, the consequence of blowing the annual ceiling and then failing to respond is
        that a 4.5 ng/L monthly limit "shall apply" — which is the limit the plant already has. The
        clause imposes nothing. The water-quality-based effluent limit this permit is a variance
        FROM is 1.3 ng/L (Part II X, first paragraph), so the number the clause reads as intending
        is 1.3.
      discipline: >-
        Recorded as an [inference] about the drafting, not as a statement of Ohio EPA's intent, and
        the clause is quoted verbatim above so a reader can judge it. Nothing in this record treats
        the plant as subject to a 1.3 ng/L limit.
  the_intake_water_clause:
    page: 28
    tag: '[verified]'
    quote: >-
      "The requirements of Part II, Item AA.2 shall not apply if the permittee demonstrates to the
      satisfaction of the Director that the mercury concentration in the permittee's effluent
      exceeds 12 ng/L due primarily to the presence of mercury in the permittee's intake water."
    finding: >-
      The permit itself contemplates that the mercury leaving this plant may have arrived in the
      water the Village took in — and provides an off-ramp on exactly that basis. That is the
      "one river, both sides" loop written into the controlling instrument: Blanchard River ->
      the Village's own water treatment plant intake -> the distribution system -> the sanitary
      sewers -> this outfall -> the Blanchard River, about a mile and a half downstream of where
      it started.
    what_it_does_not_establish:
      tag: '[open]'
      note: >-
        The clause is a conditional. Nothing in the committed record shows the Village has ever
        invoked it, and nothing here establishes that intake-water mercury is in fact a source.
        The Village's own 2025 Consumer Confidence Report publishes no mercury result for finished
        water at all. Whether the Village samples its raw or finished water for mercury is [open];
        the plant's INFLUENT is sampled for mercury monthly under this permit (station 601), and
        that series is in the water-watch record.

