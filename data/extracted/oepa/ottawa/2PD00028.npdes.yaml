final_effluent_limits_outfall_001:
  pages: [3, 6]
  term: >-
    Both Part I.A limit tables state "During the period beginning March 1, 2025, and lasting until
    February 28, 2030". Table 1 is headed "Final Outfall - 001 - Initial" and Table 2 "Final
    Outfall - 001 - Final"; their stated periods are identical, and the only difference between
    them relevant to this watch is that the "Final" table adds pentachlorophenol limits (46 ug/L
    daily maximum, 6.4 ug/L monthly) where the "Initial" table has none. Mercury is 4.5 ng/L in
    both.
