      phosphorus: 9
      total_suspended_solids: 1
    note: >-
      Ammonia is 49 of 92 — over half the five-year violation count, all at internal station 602.
      Table 2's 2018 column is July-December only and its 2023 column is January-June only.
      The `e_coli: 9` above is Table 2's own row total and CONFLICTS with the 12 this same fact
      sheet states on printed p. 11 — see `instream_attainment.recreation.e_coli_count_discrepancy`.
  sanitary_sewer_overflows_table_4:
    page: 22
    by_year: {2018: 5, 2019: 0, 2020: 9, 2021: 0, 2022: 0, 2023: 0}
    note: 2018 is July-December only; 2023 is January-June only.
  combined_sewer_overflows_table_5:
    page: 23
    outfall_count: 27
    max_occurrences_at_one_outfall_by_year: {2018: 43, 2019: 55, 2020: 36, 2021: 28, 2022: 30}
    total_volume_mg_by_year: {2018: 68.3, 2019: 120.9, 2020: 60.4, 2021: 40.1, 2022: 46.4}
    note: CSO 040 was eliminated in 2022.
  bypass_table_6:
    page: 24
    days_by_year: {2018: 23, 2019: 65, 2020: 44, 2021: 50, 2022: 40, 2023: 20}
    volume_mg_by_year: {2018: 21.9, 2019: 61.6, 2020: 85.9, 2021: 28.4, 2022: 24.6, 2023: 13.2}
  effluent_flow_table_3:
    page: 22
    median_mgd_by_year: {2018: 2.49, 2019: 2.98, 2020: 2.36, 2021: 2.75, 2022: 2.64, 2023: 2.87}
    p95_mgd_by_year: {2018: 5.96, 2019: 8.91, 2020: 7.71, 2021: 7.23, 2022: 6.94, 2023: 8.81}
    max_mgd_by_year: {2018: 12.11, 2019: 13.30, 2020: 13.02, 2021: 11.67, 2022: 12.01, 2023: 12.53}
