shared_wasteload_allocation:
  page: 12
  quote: >-
    "The WLA for this segment divided loads between the General Motors (GM) Casting Operations
    (2IN00004), GM's remediation discharge (2IN00202001), and the Defiance WWTP discharge."
  co_dischargers:
  - permit: 2IN00004
    name: General Motors Casting Operations (GM Global Propulsion Systems, Defiance)
  - permit: 2IN00202001
    name: GM remediation discharge
  design_flow_basis: >-
    Toxics average = annual 7Q10; toxics maximum = annual 1Q10; ammonia average = summer/winter
    30Q10; wildlife = annual 90Q10; agricultural water supply and human health (nondrinking) =
    harmonic mean flow (printed p. 12).
  note: >-
    This is a THREE-WAY segment. Any assimilative statement that treats 94.1 cfs as the WWTP's
    own headroom is overstating it: the regulator allocates that flow across the POTW and two
    General Motors discharges, and the segment's total permitted discharger flow is 11.225 cfs,
    not the WWTP's 9.2834.

# ── Our arithmetic, kept separate from the transcription above ────────────────────────────────
dilution:
  tag: '[inference]'
  method: >-
    Plain division of transcribed figures; no modelling. Shown because the corpus's standing
    Defiance number (~6.2:1) was computed from a DIFFERENT numerator and a DIFFERENT denominator
    than the permit uses, and the size of the correction is the point of #392.
  at_outfall_permit_cited: 10.14   # 94.1 / 9.2834 — fact-sheet 7Q10 vs fact-sheet design flow
  at_outfall_all_dischargers: 8.38 # 94.1 / 11.225 — the segment's three permitted discharges
  chronic_available_at_25pct_mixing: 2.10  # (0.25 x 94.1) / 11.225 — the mixing assumption applied
  note: >-
    `chronic_available_at_25pct_mixing` is NOT a dilution ratio in the basin screen's sense and is
    not comparable to one. It is what the fact sheet's own 25% average mixing assumption leaves
    for the chronic WLA, and it is recorded because a reader who takes 10.14:1 as "headroom" will
    be off by ~5x against the number the regulator actually allocates on.

