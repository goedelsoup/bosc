  quote: "Defiance WPC discharges to Maumee River at River Mile 62.05."
  receiving_water: Maumee River
  river_mile: 62.05
  ohio_epa_river_code: '04-001'
  hydrologic_unit_code: 04100009-02-01
  county: Defiance
