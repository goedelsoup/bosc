consent_order:
  page: 8
  quote: >-
    "Defiance WPC is subject to a State of Ohio Second Amended Consent Order (SACO) Case No.
    10-CB-40433. The SACO, filed February 28, 2020, required the development of an Integrated
    Watershed Improvement Plan (IWIP), including a Long-Term Control Plan and a No Feasible
    Alternatives (NFA) analysis."
  case_no: 10-CB-40433
  instrument: State of Ohio Second Amended Consent Order (SACO)
  filed: '2020-02-28'
  iwip_submitted: '2022-07-29'
  iwip_revised: '2023-03-16'
  cso_control_target: six overflow events per typical year
  cost: $40.7M
  completion_year: 2043
  collection_system: 65% separated sewers, 35% combined
  nfa_outcome: >-
    Raise the secondary-treatment bypass threshold from 6.53 MGD to 8.0 MGD, build a 5.0-million-
    gallon equalization basin, and increase Kingsbury pump station capacity. The IWIP's own
    Financial Capability Analysis says the projects "will place a high financial burden on the
    City."
  note: >-
    This is a STATE judicial consent order and is separate from the federal administrative order
    ECHO counts as the formal action (EPA R5 AOC 05-2024-0328, 2024-07-26). Both are on the same
    plant at the same time; neither is the other. The eDoc portal also holds three older Judicial
    Order filings on 2PD00013 (2010-03-02, 2010-12-29, 2012-12-20, docids 51767 / 3862641 /
    3944039) which are `[open]` — not retrieved under this issue.

phosphorus_regime:
  page: 11
  tmdl_report: Maumee Watershed Nutrient TMDL, approved by U.S. EPA September 2023
  individual_wasteload_allocation_kg: 1470
  wla_season: critical season (March through July)
  regulated_through: >-
    Maumee Watershed Total Phosphorus NPDES General Permit (OHP000001), under which Defiance WPC
    has been granted coverage — the corpus already holds that general permit at
    data/documents/oepa/OHP000001.pdf.
  quote: >-
    "Preliminary modeling of the middle Maumee River shows that Defiance WPC, among several other
    point sources, contributes to the impairment below the Grand Rapids Dam. Further development
    of this modeling work may lead to a more restrictive total phosphorus limit for Defiance WPC
    than is proposed in this permit."
  note: >-
    A named, dated, on-the-record statement by the regulator that this plant contributes to a
    downstream impairment, plus a stated intention to revisit its phosphorus limit. Table 7
    (printed p. 24) gives the plant's median TP loading by year (3.50-8.08 kg/day). Comparing that
    to the 1,470 kg seasonal WLA would require a season LOAD, which the fact sheet does not print
    — the comparison is deliberately not made here.

instream_attainment:
  page: 10
  quote: >-
    "Maumee River is in full attainment of its aquatic life use designations in the vicinity of
    Defiance WPC, both up- and downstream."
  impairment_downstream:
    river_mile: 31.64
    distance: approximately 30 miles downstream of Defiance WPC
    cause: nutrients/eutrophication and flow-regime alterations; Grand Rapids Dam impoundment named in the TSD
    survey: Biological and Water Quality Study of the Maumee and Auglaize River, 2012-13
  recreation:
    page: 11
    quote: >-
      "Upstream of Defiance WPC, the river is in non-attainment of the primary contact recreation
      use designation ... While Maumee River is indicated to be in attainment of the recreational
      use downstream of the facility, Defiance WPC has had 12 E. coli effluent violations in the
      last five years, as well as persistent CSO discharges."
    e_coli_count_discrepancy: >-
      This fact sheet states TWO different E. coli violation counts for the same five-year window
      and neither is corrected against the other. Printed p. 11 (the quote above) says 12; Table 2
      on printed p. 22 tabulates the outfall-001 E. coli row as 0 + 6 + 0 + 1 + 2 + 0 = 9, and
      prints that 9 as its own row total. Both are transcribed as printed —
      `compliance_history_as_stated.effluent_violations_table_2.by_parameter.e_coli` carries the 9.
      The likeliest reconciliation is Table 2's own footnotes: its 2018 column is July-December
      only and its 2023 column is January-June only, so the table covers five years minus two half
      years, and a true five-year count could pick up the three missing violations in 2018 H1 or
      2023 H2. That is an `[inference]` about the regulator's arithmetic, not a fact the document
      states, so the discrepancy is recorded rather than resolved. Cite whichever figure the
      document you are citing prints, and never present 9 and 12 as measuring the same window.

