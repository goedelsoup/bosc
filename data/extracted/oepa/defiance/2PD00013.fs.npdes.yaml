    "Defiance WPC was constructed in 1956. The average design flow is 6.0 million gallons per day
    (MGD), the peak hydraulic capacity of the secondary treatment system is 8.0 MGD, and the peak
    hydraulic capacity of the primary treatment and disinfection systems is 14.0 MGD."
  average_design_flow_mgd: 6.0
  peak_secondary_mgd: 8.0
  peak_primary_and_disinfection_mgd: 14.0
  population_served: ~19900
  serves: City of Defiance, Village of Ayersville, and portions of Defiance County
  corroboration:
    page: 30
    document: data/documents/oepa/defiance/2PD00013.pdf
    quote: >-
      "The average daily designed flow of the facility's secondary treatment processes is 6.0
      MGD, with a peak hydraulic capacity of 8.0 MGD." — the ISSUED permit (2PD00013*VD),
      Part II.H (CSO-Related Bypass), printed p. 30. Table 15 of this fact sheet states the same
      6.0 MGD a third time, sourced to "NPDES Application Form 2A", converted to 9.2834 cfs.

