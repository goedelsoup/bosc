  use_designations:
  - Modified Warmwater Habitat
  - Agricultural Water Supply
  - Industrial Water Supply
  - Primary Contact Recreation
  - Outstanding State Water (OSW)
  note: >-
    The use designation matters to any later comparison with the network's other cited reaches:
    this segment is MODIFIED Warmwater Habitat (and Outstanding State Water), where Findlay's
    Blanchard reach is Warmwater Habitat. Different use, different criteria — the two at-outfall
    statistics are not interchangeable.

