  permit_no: 2PD00013*VD
  application_no: OH0024899
  action_date: '2024-01-17'
  effective: '2024-03-01'
  expires: '2029-02-28'
  citation: >-
    Printed on p. 1 of the issued permit, data/documents/oepa/defiance/2PD00013.pdf ("Action Date:
