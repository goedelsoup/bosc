# CLAUDE.md): this is a DIGITALLY GENERATED Ohio EPA PDF, not a scan. Its text layer is the
# document's own embedded text, not an OCR guess, so the figures below are read from it verbatim
# rather than re-keyed from a render. Table 15's numerals were spot-checked against the rendered
# page image.
