# --- reviewed augmentation (issue 392) --------------------------------------------------------
# Fields the six-page text-primary read does not reach. Every value is transcribed from the page
# named in its own `page` key (1-based printed sheet, matching the "Page N of 40" running head).

review:
  issue: 392
  reviewed_on: '2026-08-05'
  method: >-
    Verbatim transcription from the PDF's embedded text layer (pypdf), page by page. No figure is
    derived, rounded or carried over from any other document except where a block says so
    explicitly and names the other instrument. Arithmetic that IS ours is confined to the
    `dilution:` block and is labelled there.
  pipeline_block_corrections: >-
    Two readings in the `permit:` block above are the model's paraphrase, not the document's
    printed words, and are corrected here rather than edited there (the block is the pipeline's
    own read of record). (1) `stream_network` prints on the cover page as exactly "Lake Erie"
    under the heading "Subsequent Stream Network"; the block renders it "Maumee River to Lake
    Erie". (2) `outfalls` lists 001/050/051/602/801/901, which mixes the one discharge outfall
    (001) with a bypass station (050), a discontinued bypass station (051), an internal
    monitoring station (602) and the two instream stations (801 upstream, 901 downstream). The
    permitted discharge outfall is 001 alone; the facility also holds 27 CSO outfalls listed
    individually in Table 5 (printed p. 23), of which CSO 040 was eliminated in 2022.

# ── The answer to #392's question 2(a) and 2(b) ───────────────────────────────────────────────
