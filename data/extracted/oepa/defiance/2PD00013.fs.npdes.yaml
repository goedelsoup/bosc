open_questions:
- >-
  The three Judicial Order documents on 2PD00013 in the eDoc portal (2010-03-02, 2010-12-29,
  2012-12-20) are the SACO's own docket and are not retrieved here. They would date the original
  and first-amended consent orders behind Case No. 10-CB-40433.
- >-
  The fact sheet does not print a season total-phosphorus LOAD, so the plant's performance against
  its 1,470 kg critical-season TMDL wasteload allocation cannot be stated from this document
  alone. The Maumee Watershed TP general permit (OHP000001) annual reports would answer it.
- >-
  ECHO's ICIS-NPDES total design flow for OH0024899 is 12 MGD and matches none of the three
  capacities this permit prints (6.0 average / 8.0 peak secondary / 14.0 peak primary). See
  data/extracted/defiance/ONBOARDING.md — the correction is documented, NOT hand-applied to the
  regenerated ECHO inventory.
