public_comment_record:
  who_commented: >-
    U.S. EPA Region 5 only. The Response to Comments states it outright: "Comments were only
    received from USEPA Region 5 during the public notice."
    (data/documents/oepa/defiance/2PD00013.rtc.pdf, p. 1)
  usepa_position: >-
    "Based on our review to date, EPA would not object to issuance of this permit" — U.S. EPA
    Region 5 Permits Branch to Ohio EPA, 2023-12-01
    (data/documents/oepa/defiance/2PD00013.usepa-r5-draft-review.pdf, p. 1), with Enclosure A
    recommendations. Region 5 reviewed the PROPOSED permit again on 2024-01-12
    (…usepa-r5-proposed-review.pdf).
  disputed_point: >-
    On Region 5's recommendation that the fact sheet state the intent to have POTWs set a
    phosphorus MAHL from a 0.5 mg/L target, Ohio EPA answered: "While we disagree that the GLWQA
    is an appropriate basis for setting the target concentration at 0.5 mg/L, we agree that
    expanded discussion in the fact sheet is warranted."
    (data/documents/oepa/defiance/2PD00013.rtc.pdf, p. 2) — a recorded state/federal disagreement
    on the basis for the Maumee phosphorus target, not on this permit's limits.

