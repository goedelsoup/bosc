      due_basis: '[inference] — the permit says "no later than 12 months after the permit effective date"; 2024-03-01 + 12 months.'
      event_code: '52599'
      submit_to: 'Ohio EPA, Central Office Pretreatment Unit and to Ohio EPA, Southeast District Office'
      requirement: >-
        Evaluate the adequacy of local industrial user limitations to prevent the introduction
        of pollutants into the POTW that would interfere with its operation, pass through in
        amounts exceeding water quality standard-based limits, be incompatible with the POTW,
        or limit wastewater/sludge use options. Submit either a technical justification for
        REVISING local limits (with a pretreatment program modification request) or a technical
        justification for RETAINING the existing ones.
      pollutants_requiring_justification: >-
        Arsenic, cadmium, total chromium, dissolved hexavalent chromium, copper, free cyanide,
        lead, mercury, molybdenum, nickel, selenium, silver and zinc — "unless screening of
        wastewater and sludge indicate these pollutants are not present in significant
        amounts" — plus any other pollutant where a local limit may be necessary.
      engineering_requirement: >-
        If new or revised industrial user discharge limits are proposed, the report requires
        "the stamp and signature of a licensed Ohio professional engineer."
      revisions: >-
        A revised report is due within 90 days of Ohio EPA notifying the permittee of
        deficiencies; revised limits must be incorporated into all industrial user control
        documents no later than 4 months after Ohio EPA's approval.
    status:
      tag: '[open]'
      as_of: '2026-08-26'
      lapsed: >-
        The one milestone date (2025-03-01) is roughly 17 months in the past as of this
        writing.
      what_is_not_established: >-
        WHETHER IT WAS FILED. Nothing in this corpus establishes that — no submittal, no
        acknowledgment, no violation notice, and no ECHO/ICIS extract for this facility is
        committed. "Past due" here means the date has passed, NOT that the City missed it.
      how_to_close_it: >-
        A public-records request to Ohio EPA Southeast District Office and the Central Office
        Pretreatment Unit for the 52599 submittal under permit 0PD00004 would settle it.

  # ── Part II — other requirements of note (sheets 15-24) ──────────────────────────────────
  other_requirements_of_note:
    citation: 'Permit 0PD00004*MD, Part II, sheets 15-24'
    tag: '[verified]'
    local_limits_wla:
      item: 'W.5 — Local Limits'
      values_ug_per_l: {arsenic: 680, cadmium: 27, chromium_hexavalent: 31, chromium_total: 8000, copper: 70, free_cyanide: 92, lead: 840, nickel: 2100, selenium: 120, silver: 17, zinc: 550}
      mercury_ng_per_l: 12
      significance: >-
        These are the wasteload-allocation values the permittee must use when evaluating local
        industrial-user limits for pollutants with no final table limit of their own — i.e. the
        headworks ceiling this permit implicitly assumes. See fact_sheet.local_limits_cross_reference
        for how these numbers trace back to the Fact Sheet's own technical-basis tables.
    biomonitoring_program:
      item: 'X. Biomonitoring Program Requirements'
      text: '"The permittee shall continue to implement an effluent biomonitoring program to determine the toxicity of the effluent from outfall 001."'
      testing: >-
        Definitive acute toxicity tests on Ceriodaphnia dubia (water fleas) and Pimephales
        promelas (fathead minnows) at outfall 001, for the duration of the permit, plus ambient
        testing at upstream station 801, all per Ohio EPA's "Reporting and Testing Guidance for
        Biomonitoring," July 1998 (or current revision). SOP or verification of SOP submittal
        due no later than three months after the effective date — on or about 2024-06-01
        `[inference]`.
      definition: 'TUa = Acute Toxicity Units = 100/LC50 (as printed).'
    storm_water:
      item: V
      text: >-
        "To comply with industrial storm water regulations, the permittee submitted a form for
        'No Exposure Certification' which was signed on September 13, 2022. Compliance with the
        industrial storm water regulations must be re-affirmed every five years. No later than
        September 13, 2027, the permittee must submit a new form..."
      certification_number: 0GRN00138*EG
      certification_number_source: 'Fact Sheet, "Storm Water Compliance", p.13 of 33 — the permit body itself does not print the certification number, only the date.'
    pretreatment_program:
      item: W
      approved_date: '1985-03-29'
      text: >-
        "The permittee's pretreatment program initially approved on March 29, 1985 and all
        subsequent modifications approved before the effective date of this permit, shall be
        an enforceable term and condition of this permit."
      reporting_deadlines:
        quarterly_industrial_user_violation_report: 'On or prior to the 15th day of January, April, July, and October.'
        annual_pretreatment_report: 'On or prior to October 15th of each year.'
      record_retention: 'A minimum of three years, extended during unresolved litigation.'
    emergency_landfill_disposal:
      item: Q
      station: '0PD00004586'
      text: >-
        "The permittee is authorized to dispose of sewage sludge in a sanitary landfill in an
        emergency. Station 586 for disposal in a sanitary landfill is included in the
        authorized list of station(s) in Part II, Item B of this permit, however, effluent
        tables are not included in Part 1.B." Reported on the Annual Sludge Report instead.
    free_cyanide_and_mercury_methods:
      items: R and S
      free_cyanide: 'ASTM D7237-10, OIA-1677-09, or ASTM D4282-02 (the last requiring documentation it meets the "sufficiently sensitive" test-procedure standard, 40 CFR 122.44(i)(1)(iv)).'
      mercury: 'EPA Method 1631 or EPA Method 245.7, 40 CFR 136.'
    dissolved_orthophosphate_method:
      item: T
      text: >-
        Grab sample, filtered within 15 minutes of collection using a 0.45-micron filter,
        analyzed within 48 hours.
    outfall_signage:
      item: U
      text: >-
        Permanent stream-bank marker at each regulated outfall, minimum 2 ft by 2 ft, minimum 3
        ft above ground, lettering not less than 2 inches, unobstructed from river users' view.
    other_items_present:
      note: >-
        Transcribed as an index of what Part II contains, so a later reader knows what is in
        the instrument without re-walking it. Not summarized in detail here.
      items: >-
        A. Operator Certification Requirements · B. Sampling Station Locations · C.
        Weekend/Holiday Monitoring Exemption · D. Sanitary Sewer Overflow (SSO) Reporting
        Requirements · E. Treatment Works Maintenance · F. Composite Sample Definition · G.
        Grab Sample Definition · H. Multiple Grab Sample Definition · I. 85 Percent Removal
        Requirement · J. Chlorine Use for Disinfection · K. RCRA "Permit-by-Rule" for POTWs
        Accepting Hazardous Waste · L. Water-Quality-Based Limit Revisions · M. Sewage Sludge
        ORC/OAC Compliance · N. Sewage Sludge Composite Sample Definition · O. Annual Sewage
        Sludge Disposal Report (due March 1) · P. Daily Percent-Solids Sampling for Sludge
        Weight Calculation · Q. Emergency Landfill Disposal (station 586) · R. Free Cyanide
        Monitoring Methods · S. Mercury Monitoring Methods · T. Dissolved Orthophosphate
        Monitoring · U. Outfall Signage · V. Storm Water No Exposure Certification · W.
        Pretreatment Program Requirements (12 subsections) · X. Biomonitoring Program
        Requirements.

  # ── Fact Sheet (bound into this same PDF — PDF pages 37-69, printed "Page N of 33") ──────
  # See warnings[0] for why this is transcribed at all: it is part of the committed instrument,
  # not an outside document. Tables are indexed rather than fully re-typed except where a
  # figure is genuinely load-bearing for understanding the permit body above.
  fact_sheet:
    citation: 'Fact Sheet for NPDES Permit Renewal, Coshocton Wastewater Treatment Plant, 2023 (bound at PDF pages 37-69 of this file)'
    tag: '[verified]'
    cover:
      public_notice_no: '193167'
      public_notice_date: '2023-12-14'
      comment_period_ends: '2024-01-13'
      contact: Aaron Pennington, 740-380-5272, aaron.pennington@epa.ohio.gov

    facility_description:
      constructed: 1954
      last_upgraded: 2018
      average_design_flow_mgd: 4.4
      peak_hydraulic_capacity_mgd: 10.6
      infiltration_inflow_estimate_mgd: 0.2
      infiltration_inflow_basis: >-
        Fact Sheet p.7 of 33: "Coshocton Wastewater Treatment Plant has an estimated
        infiltration/inflow (I/I) rate of 0.2 MGD that does not cause known problems in the
        collection system. The estimation for infiltration/inflow was made by subtracting the
        median daily flow value from the average daily flow value."
      serves: City of Coshocton and adjacent areas served by the Coshocton County Sewer collection system.
      collection_system: 100% separate sewers — no combined sewer overflows. See warnings[6].
      treatment_processes: >-
        Influent pumping, mechanical screening, grit removal, scum removal, primary
        clarification, trickling filter, secondary clarification, ultraviolet light
        disinfection (Figure 2).
      sludge_treatment_processes: Anaerobic digestion, mechanical dewatering belt filter press (Figure 3); treated sludge is land-applied.
      pretreatment_users: 'One categorical user discharging 0.033 MGD; seven significant non-categorical users discharging 0.422 MGD combined.'
      biothane_unit: >-
        "The City has a Biothane anaerobic digestor that was intended to serve as a
        pretreatment unit for wastewaters to be received from an ethanol facility." Never used
        during the previous permit cycle; not anticipated to be used soon. See effluent_limits_602.
      potable_water_source: Groundwater.
      plant_bypass: >-
        "Coshocton Wastewater Treatment Plant has a plant bypass at the headworks of the
        facility that is constructed with a sluice gate that can be manually opened in the
        event of catastrophic plant failure. The piping for the bypass connects to the effluent
        sewer upon leaving the 001 monitoring station. The bypass has not been operated within
        the previous permit cycle and not anticipated to operate in the proposed permit cycle."
        See warnings[6] — no numeric MGD precondition is stated anywhere.

    interactive_dischargers:
      note: >-
        Wasteload allocations for the Muskingum River in this stretch are computed jointly for
        two currently-operating dischargers, plus two that have since ceased operations.
      current: [Coshocton WWTP, 'Cleveland Cliffs – Coshocton Works (RM 105.88)']
      formerly_included_now_ceased: ['Columbus Southern Power - Conesville Power Plant (coal-fired steam electric)', 'WestRock Coshocton Mill (pulp and paper)']
      model: CONSWLA (conservative substance wasteload allocation), Fact Sheet p.9-10 of 33.

    design_flow_criteria_basis:
      aquatic_life_toxics_average: Annual 7Q10
      aquatic_life_toxics_maximum: Annual 1Q10
      ammonia_average_summer: Summer 30Q10
      ammonia_average_winter: Winter 30Q10
      agricultural_water_supply: Harmonic mean flow
      human_health_nondrinking: Harmonic mean flow

    instream_flows_table_12:
      citation: 'Fact Sheet Table 12, p.26 of 33'
      '7q10_cfs': 544
      '1q10_cfs': 385
      '30q10_summer_cfs': 630
      '30q10_winter_cfs': 1093
      harmonic_mean_cfs: 2033
      basis: Combined USGS gages 03129000 and 03138500, 1921-2023 data.
      coshocton_wwtp_design_flow_cfs: 6.81 (4.4 MGD)
      cleveland_cliffs_flow_cfs: 3.71 (2.4 MGD, 95th percentile of average monthly flow, May 2018-April 2023)

    whole_effluent_toxicity_wla:
      outfall_001_wla: {acute_TUa: 1.0, chronic_TUc: 81.73}
      category: 4 (no toxicity)
      annual_acute_monitoring: >-
        "Annual acute toxicity monitoring is proposed for the life of the permit." Chronic
        (TUc) monitoring is not required because "the available downstream dilution is more
        than twenty to one" (OAC 3745-33-07(B)(11)(c)).
      rule_citation_typo: >-
        The Fact Sheet prints "OAC 3754-33-07(B)(11)" — transposed digits — twice, both times in
        this same WET discussion (Summary of Permit Conditions, p.2 of 33; Whole Effluent
        Toxicity Reasonable Potential, p.12 of 33), where the same document prints the correct
        "3745-33-07" seven other times across five pages (FS pp.5, 10 (×2), 11, 12, 30). The
        document's own typo, not corrected here.

    local_limits_cross_reference:
      tag: '[inference]'
      note: >-
        Part II Item W.5's local-limits WLA values (transcribed above under
        other_requirements_of_note.local_limits_wla) match the Fact Sheet's own Table 11/13
        "Inside Mixing Zone Maximum" column for every listed pollutant EXCEPT mercury: arsenic
        680, cadmium 27, hexavalent chromium 31, total chromium 8000, copper 70, free cyanide
        92, lead 840, nickel 2100, selenium 120, silver 17, and zinc 550 (all ug/L) are each
        identical to that column in Table 11/13. Mercury instead uses the Human Health average
        value (12 ng/L) rather than Table 13's Inside Mixing Zone Maximum for mercury (3400
        ng/L) — consistent with the Fact Sheet's own stated rule: "By rule, mixing zones are
        not authorized for pollutants, such as mercury, which have been designated as
        bioaccumulative chemicals of concern (BCCs). For BCCs, the WLA is set equal to the
        respective WQS value." The document nowhere states this cross-reference explicitly; it
        is assembled here from two separately-printed tables.

    parameter_screening_table_14:
      citation: 'Fact Sheet Table 14, p.29 of 33'
      groups: >-
        Group 1 (no numeric criteria, not evaluated): aluminum, chlorides, manganese-TR. Group
        2 (PEQ < 25% of WQS, no limit): antimony, arsenic, barium, beryllium, cadmium,
        chromium-TR, dissolved hexavalent chromium, free cyanide, iron-TR, lead-TR, nickel-TR,
        nitrate+nitrite, silver, strontium, thallium. Group 3 (PEQ < 50% of PEL, no limit):
        ammonia (summer & winter), B2EHP, butyl benzyl phthalate, copper-TR, selenium-TR, total
        filterable residue, zinc-TR. Group 4 (monitoring appropriate): mercury-TR. Group 5
        (limit recommended): "No parameters meet the criteria of this group." See warnings[3].

    tables_index:
      note: >-
        Fifteen numbered tables, one attachment, AND one addendum — the Fact Sheet's own Table
        of Contents (FS p.3 of 33) lists all four (4 figures, 15 tables, 1 attachment, 1
        addendum) under separate headings ("List of Tables" / "List of Attachments" / "List of
        Addendums"). The highest-value figures are pulled forward into blocks above (Table 4
        into monitoring_stations.sso_300.history; Tables 11-14 into local_limits_cross_reference
        and parameter_screening_table_14). The rest are indexed here rather than fully re-typed.
      table_1_sewage_sludge_removal_dry_tons: {'2018': 213, '2019': 231, '2020': 238, '2021': 188, '2022': 150}
      table_2_effluent_violations_outfall_001_2018_2023: >-
        4 total violations in the five-year window, ALL in 2018: E. coli x3, pH-minimum x1.
        Zero violations in 2019, 2020, 2021, 2022, or 2023 (partial year to April).
      table_3_annual_effluent_flow_rates: >-
        50th/95th percentile/maximum MGD by year, 2018-2023 — maximum ranged from 3.20 MGD
        (2021) to 8.50 MGD (2022), against the 4.4 MGD design flow and 10.6 MGD peak capacity.
      table_5_7_effluent_characterization: >-
        Chemical-specific data from pretreatment reports (2018-2022), Ohio EPA compliance
        sampling (2022-12-07), and self-monitoring DMR data (May 2018-April 2023), compared
        against current permit limits.
      table_8_projected_effluent_quality: >-
        PEQavg/PEQmax for outfall 001 across ~28 parameters, computed per Ohio EPA Modeling
        Guidance #1.
      table_9_acute_toxicity_results: >-
        Five annual tests (Aug 2018-Aug 2022): Ceriodaphnia dubia non-detect every year;
        Pimephales promelas non-detect in 2018/2019/2022, 0.5 TUa in 2020 and 2021.
      table_10_use_attainment: >-
        Full attainment of the Warmwater Habitat designated use at four Muskingum River
        locations (RM 110.7, 107.6, 105.0, 101.8) in the 2006 biological survey.
      table_15_final_limits_basis: >-
        Cross-checked in full against effluent_limits_001 above; Basis codes are BPT/PD
        (technology + plant design, TSS & CBOD5), WQS (oil & grease, E. coli, pH), M
        (monitor-only per Division of Surface Water Guidance 1), PMR (phosphorus monitoring,
        ORC 6111.03), and WET (minimum toxicity testing, OAC 3745-33-07(B)(11)).
      attachment_1_wet_reasonable_potential: >-
        Both species placed in Hazard Category 4 ("No Toxicity") for acute; chronic (TUc) is N/A
        for both. The document's own stated reason (Fact Sheet p.12 of 33, "Whole Effluent
        Toxicity Reasonable Potential"): "In accordance with OAC 3745-33-07(B)(11)(c), TUc
        criteria are generally applied when the available mixing zone dilution is less than
        twenty to one. Coshocton Wastewater Treatment Plant is not required to monitor for TUc
        because the available downstream dilution is more than twenty to one."
      addendum_1_acronyms: >-
        FS p.33 of 33 — a standard acronym glossary (ABS, BPJ, CFR, CMOM, CONSWLA, CSO, CWA,
        DMR, DMT, IMZM, LTCP, MDL, MGD, NPDES, OAC, Ohio EPA, ORC, ORSANCO, PEL, PEQ, PMP, PPE,
        SSO, TMDL, TRE, TU, U.S. EPA, WET, WLA, WPCF, WQBEL, WQS, WWTP). Indexed here for
        completeness, not re-typed in full.

    figures:
      citation: 'Fact Sheet Figures 1-4, PDF pages 50-53 (Fact Sheet pages 14-17 of 33). All four rendered at 300 DPI (pypdfium2) to read — see the header note.'
      figure_1:
        title: Location of Coshocton Wastewater Treatment Plant
        pdf_page: 50
        text_layer_coverage: >-
          NONE beyond the caption and page footer. The entire map is a raster image.
        content: >-
          A street/road map (South 2nd Street, Cherry Street, South 6th, South Lawn, South 7th
          and South 8th Streets, Buckeye Street, County Road 271, State Route 83) with the
          Muskingum River running along the
          plant's west side. Two station icons are plotted: "Station: 0PD00004-801" (a blue
          square, upstream/north of the plant) and "Station: 0PD00004-001" (a yellow diamond,
          the final outfall). The plant itself is marked with a purple dot and the label
          "Coshocton WWTP / OEPA#: 0PD00004 / USEPA#: OH0024775." A legend distinguishes
          NPDES-Permit-Location, Downstream-Nearfield Monitoring, Upstream Monitoring, and
          Final Outfall icon types (the legend is a shared map template — this permit has no
          downstream-nearfield station, so that legend entry is unused on this particular map).
          An inset locates Coshocton County within Ohio.
      figure_2:
        title: Diagram of Wastewater Treatment System
        pdf_page: 51
        text_layer_coverage: >-
          NONE beyond the caption and page footer. See warnings[2] for the flow-figure
          discrepancy this figure raises against the Fact Sheet's own prose.
        content: >-
          "COSHOCTON WASTEWATER TREATMENT PLANT FLOW SCHEMATIC" — a labeled process-flow
          diagram. Influent enters a Bar Screen/Grit Channel in the Main Building (labeled Peak
          Flow 6.6 MGD, Average Flow 1.3 MGD, Minimum Flow 0.30 MGD — see warnings[2]) via three
          raw water pumps from the Raw Water Wet Well. Flow splits to four identical Primary
          Clarifiers (36.5 x 14 x 15.5 ft, 59,242 gallons each) plus one larger Primary
          Clarifier (60 x 15.5 x 24.15 ft, 168,000 gallons). From the clarifiers, flow goes to a
          Transfer Building serving three trickling filters (#1 TF and #2 TF, 100' diameter
          each; #3 TF, 140' diameter), then to a Splitter Box dividing into two Final
          Clarifiers, then UV Disinfection, then Outfall 001. None of the dimensions, gallon
          capacities, or diameters in this diagram appear anywhere in the text layer of this
          document.
      figure_3:
        title: Diagram of Sludge Treatment System
        pdf_page: 52
        text_layer_coverage: >-
          NONE beyond the caption and page footer.
        content: >-
          "Sludge Flow Schematic Coshocton WWTP" — an aerial/satellite photo of the plant
          overlaid with a process narrative and site labels. Narrative (verbatim from the
          image): "Solids accumulate from two locations. Primary settling and Secondary
          settling. Solids from Secondary settling are pumped to the Primary sedimentation
          tanks and are resettled before being pumped to the North or South Anaerobic
          digesters. After solids stabilization the solids are pumped to the Secondary
          anaerobic digester for further stabilization. From the Secondary digester the solids
          are pumped to the Dewatering building where they are belt pressed and removed for
          land application." Labeled site features: Primary Sedimentation, two circular
          Secondary Clarifiers, North Digester, South Digester, a Secondary [anaerobic] Digester,
          a Belt Press / Dewatering Building. This entire narrative and site layout is absent
          from the text layer.
      figure_4:
        title: Muskingum River Study Area
        pdf_page: 53
        text_layer_coverage: >-
          COMPLETE — the extracted text ("Direction of Flow", "RM = River mile", "WWTP =
          wastewater treatment plant", "Muskingum River", "Cleveland Cliffs RM 105.88",
          "Coshocton WWTP RM 108.56", "Tuscarawas River", "Walhonding River") matches the
          rendered image exactly. Rendered for symmetry with the other three figures, not
          because of any gap.
        content: >-
          A simple schematic: the Walhonding River and Tuscarawas River converge to form the
          Muskingum River; downstream, arrows mark Coshocton WWTP at RM 108.56 and Cleveland
          Cliffs at RM 105.88, with a "Direction of Flow" arrow and an RM/WWTP legend.
