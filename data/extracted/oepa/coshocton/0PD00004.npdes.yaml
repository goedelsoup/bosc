    impairment for recreation is shown due to elevated concentrations of Escherichia Coli (E.
    coli). The Coshocton WWTP has not been identified as a source of the PCBs and limits have
    been applied to address E. coli." Fact Sheet p.8 of 33 — a negative finding on the face of
