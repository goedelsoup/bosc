permit:
  tag: '[verified]'
  confidence: high
  warnings:
  - >-
    THIS SOURCE PDF BUNDLES THE FACT SHEET INTO THE SAME FILE AS THE PERMIT — unlike this
    corpus's mansfield precedent (2PE00001.npdes.yaml), where the Fact Sheet is explicitly not
    committed. The operative permit is PDF pages 0-36 (37 pages, matching the "Total Pages: 37"
    printed on sheet 1), and the 2023 Fact Sheet for the same permit action follows immediately
    at PDF pages 37-69 with its own restarted "Page N of 33" numbering. 37 + 33 = 70, the PDF's
    actual page count — so there is NO discrepancy in total page coverage, but the permit's own
    "Total Pages: 37" field describes only the permit portion, not the whole file. Anyone
    citing "the permit is N pages" from sheet 1 alone will undercount this file by 33 pages.
    Because the Fact Sheet is part of THIS instrument, its content is transcribed below (see
    `fact_sheet`) with the same `[verified]` tag as the permit body — it is read off the face
    of the committed document, not an outside source.
  - >-
    THREE OF THE FACT SHEET'S FOUR FIGURES ARE IMAGE-ONLY — their entire substance is
    unreachable from the text layer and would be invisible to any text-layer-only read. This is
    the coverage gap the task brief asked to be reported explicitly, not silently omitted. See
    `fact_sheet.figures` for what each one shows (established by rendering all four at 300 DPI):
    Figure 1 (PDF p.50, a street/aerial location map with the plant's two sampling-station
    icons and an Ohio county locator inset), Figure 2 (PDF p.51, the plant's flow schematic,
    carrying clarifier dimensions, tank capacities in gallons, and trickling-filter diameters
    found NOWHERE else in this document), and Figure 3 (PDF p.52, an aerial photo of the plant
    overlaid with the sludge-handling process narrative and site labels) all extract to
    essentially nothing but their caption line — `pypdf` returns only "Figure N. <title>" and
    the page footer for each. Figure 4 (PDF p.53, the Muskingum River study-area schematic) is
    the ONE exception: its labels (river names, river miles, "Direction of Flow", the RM/WWTP
    legend) DO extract cleanly and match the rendered image exactly — confirmed by rendering it
    too, for symmetry with the other three, not because it needed rescue.
  - >-
    FIGURE 2's FLOW NUMBERS DO NOT MATCH THE FACT SHEET'S OWN PROSE, and this document does not
    reconcile the two. Two pages earlier, "FACILITY DESCRIPTION" states plainly: "The average
    design flow is 4.4 million gallons per day (MGD) and the peak hydraulic capacity is 10.6
    MGD" (Fact Sheet p.6 of 33) — the same 4.4 MGD design flow the permit itself cites as the
    effluent-loading basis at both outfall 001 and station 602 (Part I.A notes). Figure 2's flow
    schematic, however, labels the headworks Bar Screen/Grit Channel building "Peak Flow 6.6
    MGD, Average Flow 1.3 MGD, Minimum Flow 0.30 MGD" — none of which is 4.4 or 10.6. Nothing on
    the page or elsewhere explains whether the schematic's numbers describe a different flow
    point (e.g. a single train, or a superseded design year) than the plant-wide figures in the
    prose. Both are transcribed as printed; which one (if either) describes current whole-plant
    capacity is `[open]`.
  - >-
    AMMONIA CARRIES NO NUMERIC LIMIT ANYWHERE IN THIS PERMIT — monitor-only at both outfall 001
    (3/Week 24hr Composite) and internal station 602 (2/Week 24hr Composite), for the whole
    permit term, with no phase-in and no seasonal split. This is a real finding, not an
    omission on this file's part: Fact Sheet Table 13 computes ammonia wasteload allocations of
    38.5 mg/L (summer) and 229 mg/L (winter) — so far above anything the plant could plausibly
    discharge that no limit was warranted — and Table 14's Group 5 (the only group that carries
    a recommended numeric limit) states outright: "No parameters meet the criteria of this
    group." Every numeric limit that DOES appear at outfall 001 (TSS, CBOD5, oil & grease, pH,
    E. coli) is technology-based or narrative-WQS-based per Table 15's own "Basis" column
    (`BPT, PD` or `WQS`), not wasteload-allocation-derived. Coshocton's outfall 001 has, in
    other words, no water-quality-based effluent limit of any kind in this permit term.
  - >-
    THERE IS NO DOWNSTREAM/FARFIELD AMBIENT STATION IN THIS PERMIT AT ALL — Part II Item B's
    station list runs 001, 300, 581, 586, 601, 602, 801 and stops; there is no "9xx"-series
    station. The one ambient station this permit has (801, upstream) carries ONLY the
    whole-effluent-toxicity battery (48-hr acute Ceriodaphnia dubia and 96-hr acute Pimephales
    promelas, both %Affected, 1/Year Grab in August) — no nutrient or bacteria chemistry monitoring
    of any kind, unlike this corpus's mansfield precedent, whose upstream/downstream pair ran a
    full nutrient suite monthly. Recorded as an absence, not a defect: nothing here says Ohio
    EPA requires more.
  - >-
    THE SCHEDULE OF COMPLIANCE HAS EXACTLY ONE ITEM, and its due date has already passed. Part
    I.C carries only the Municipal Pretreatment Schedule (no TRE, no phosphorus-optimization
    schedule, unlike mansfield's three-track schedule) — a local-limits technical-justification
    report due "no later than 12 months after the permit effective date (Event Code 52599)." No
    calendar date is printed; resolved against the 2024-03-01 effective date that is
    2025-03-01, `[inference]`. As of 2026-08-26 that date is roughly 17 months in the past.
    NOTHING IN THIS CORPUS ESTABLISHES WHETHER THE CITY FILED IT — no submittal, no
    acknowledgment, no violation notice, and no ECHO/ICIS extract for this facility is
    committed. "Past due" here means the date has passed, NOT that the City missed it.
  - >-
    NO CSO AND NO NUMERIC BYPASS TRIGGER. The Fact Sheet states the City "has 100% separate
    sewers in the collection system" — so this permit carries no combined-sewer-overflow parts.
    Separately, its plant bypass (a manually-operated sluice gate at the headworks, "for
    catastrophic plant failure," "has not been operated within the previous permit cycle and
    not anticipated to operate in the proposed permit cycle" — Fact Sheet, Description of
    Existing Discharge) has NO stated MGD precondition anywhere in the permit or Fact Sheet,
    unlike mansfield's explicit 19 MGD sustained-flow trigger. Recorded as printed; there is no
    numeric threshold to transcribe.
  - >-
    AN UNANNOUNCED LIMIT CHANGE: THE pH-MINIMUM AT OUTFALL 001 TIGHTENS FROM 6.0 TO 6.5 S.U., AND
    THE FACT SHEET'S OWN "SAME AS THE CURRENT PERMIT" SUMMARY DOES NOT FLAG IT. Table 7 (Fact
    Sheet p.22 of 33, "Current Permit Limits" column) prints the existing permit's daily
    pH-minimum as 6.0; this renewal's own Part I.A.1 table (sheet 3) and Table 15 (Fact Sheet
    p.30 of 33, Basis "WQS") both set it at 6.5 — see effluent_limits_001.limits.ph_minimum. The
    Fact Sheet's "Summary of Permit Conditions" (p.2 of 33) states "the effluent limits and/or
    monitoring requirements proposed for all parameters are the same as in the current permit,
    except those listed below," then lists mercury (limit removed), several parameters'
    monitoring removed or reduced at outfall 001 and station 601, free cyanide and oil & grease
    monitoring frequency reductions, and the Municipal Pretreatment Schedule — pH is not among
    them. It is the only tightened numeric limit in this renewal. It also bears on Table 2 (Fact
    Sheet p.18 of 33): the sole pH-minimum violation in the five-year DMR window (2018, x1) was
    scored against the CURRENT 6.0 limit, not the tighter 6.5 the plant will be held to going
    forward.

