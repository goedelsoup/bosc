# City of Coshocton WWTP — NPDES permit 0PD00004*MD (application OH0024775), the renewal
# issued 2024-01-16 and effective 2024-03-01.
#
# Hand-read from the committed PDF's embedded text layer, not machine-extracted. This
# document is digitally generated (producer "Microsoft: Print To PDF", no scan, no OCR),
# so the text layer is the instrument's own bytes; every figure below is transcribed with
# its printed sheet cited on the block. Nothing is derived, rounded or inferred unless the
# block says so.
#
# FOUR pages were additionally rendered at 300 DPI (pypdfium2) and read visually: PDF pages
# 50-53, the Fact Sheet's Figures 1-4 (sheets 14-17 of the bound-in 33-page Fact Sheet). This
# was necessary, not merely a spot-check: three of the four figures carry NO extractable text
# at all — their entire substance (a station-location street map, a flow-schematic with
# clarifier dimensions and capacities, an aerial sludge-process diagram) exists only as a
# raster image. See permit.warnings for what each figure shows and which ones the text layer
# could not reach. No page of the OPERATIVE PERMIT (PDF pages 0-36) required rendering — its
# text layer was complete on its own. The four Fact Sheet pages above were rendered and read
# visually as part of this HAND transcription; they were never run through the forced-tool-use
# vision-model pipeline (watermark.agent.extractor.StructuredExtractor) that produces a render
# receipt, so this file carries no render receipt regardless of that visual read (no doc_id /
# dpi / pages_read). See watermark.models.TranscribedExtraction — a receipt is all-or-nothing.
#
# The record -> document join (watermark.site.records._source_ref) reads a TOP-LEVEL
# `source_path`, so the primary instrument is named there as well as in meta.sources.
source_path: data/documents/oepa/coshocton/0PD00004.pdf
