# WHAT THIS FILE IS.
#
# The DRAFT of the 2PD00006*WD modification, from the DAM's `permits/DraftPN/` slot. 59 pages:
# a three-page PUBLIC NOTICE, then the same 47-page permit and 8-page fact sheet that the final
# `permits/doc/` package carries (2PD00006.f8aaad0a.npdes.yaml) — with the effective date still
# printed "PROPOSED". Held for what only the notice pages carry: the public notice number as the
# agency itself prints it, the comment window, and the outfall's coordinate and design flow.
#
# The FINAL instrument is 2PD00006.f8aaad0a.pdf. Cite this file for the notice, never for what
# the permit requires — the draft's "PROPOSED" effective date is not the term in force.
