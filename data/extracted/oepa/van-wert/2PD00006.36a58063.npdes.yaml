public_notice_number_discrepancy:
  as_printed_on_notice: '221593'
  as_printed_on_fact_sheet: '2215932'
  resolution: >-
    The three public-notice pages print "Public Notice No.: 221593" four times, in the page
    headers and in the body. The attached fact sheet's two-column header extracts as "Public
    Notice No.: 2215932 Ohio EPA Permit No.: 2PD00006*WD" in both this copy and the final
    package's. Ohio EPA public notice numbers in this corpus are six digits (210566, 216133,
    205259), so 221593 is recorded as the number and the trailing digit is read as a
    column-merge artifact of the text layer. Recorded because the artifact is identical in both
    copies and will reappear in any text search.

