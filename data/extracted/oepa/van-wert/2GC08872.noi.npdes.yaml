    and expires 2028-04-22. It states NOTHING about the campus's operating water use, cooling
    system, process discharge, or electrical load, and it must not be cited for any of them. It
    does not ground the facility's IT load, which remains the [reference] 500 MW press bracket
    (see src/watermark/sites/_profiles.py and data/extracted/van-wert/data-centers.md).
  - The NOI declares Ohio EPA PTI status 'YET_TO_APPLY' and USACE nationwide permit 'YET_TO_APPLY',
    certified under penalty of law on 2026-07-21. This is the corpus's ONLY instrument-grade
    statement that no air permit-to-install had been applied for; before it, the absence of a PTI
    was an unsuccessful-search negative. It dates the negative — it does not promise a future
    filing, and it says nothing about whether one is required.
  - Two townships are printed in the NOI's location block (Pleasant AND Ridge, on two County/Township
    lines) but Ohio EPA's approval letter for the same coverage names Pleasant only. Both are
    recorded as printed; the discrepancy is not resolved here. Recorded in `facility_address` as the
    NOI prints it, since the NOI is the applicant's own description of the site.
  - The NOI carries the FULL facility permit number 2GC08872*AG in its 'Existing NPDES Facility
    Permit Number' field even though it is the application, submitted 2026-07-21, nine days before
    the 2026-07-30 approval letter that grants the coverage. Recorded as printed — the same pattern
    as Sidney's 1GC10596 NOI.
