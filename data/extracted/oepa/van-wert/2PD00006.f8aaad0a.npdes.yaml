  action: NPDES permit modification under OAC 3745-33-04(D)
  letter_date: '2026-05-18'
  signed_by: John Logue, Director, Ohio Environmental Protection Agency
  action_date: '2026-05-18'          # "Modification Action Date", composite sheet 2
  public_notice_no: '221593'
  public_notice_date: '2026-05-25'
  comment_period_end: '2026-06-24'
  entered_directors_journal: '2026-06-30'   # printed under the Director's signature, composite sheet 2
  effective: '2026-07-01'
  expires: '2030-05-31'              # unchanged by the modification
  permit_no_before: 2PD00006*VD
  permit_no_after: 2PD00006*WD
  application_no: OH0027910          # unchanged by the modification
  permit_page_count: 47              # "Total Pages: 47", composite sheet 2
  revisions:
  - >-
    "1. Modification of the Part I.C - Schedule of Compliance to remove the completed milestones
    for the submitted Combined Sewer Overflow Long Term Control Plan Compliance Assistance plan
    and include the new milestones proposed in the submitted plan."
  scope_statement: >-
    "All terms and conditions of the existing permit not recommended for modification by this
    document will remain in effect. Any modified term or condition contained in this modification
    shall supersede, on the date this modification is effective, the existing respective term or
    condition of the permit."
  fact_sheet_adds: >-
    The attached fact sheet (composite sheet 53) states one further change the transmittal letter
    does not enumerate: "a revised Part III is proposed to be included. References to Part III in
    other parts have been updated." Part III is the boilerplate general conditions.
  finding: >-
    The substance of this modification is a CONSTRUCTION SCHEDULE. It puts dated, event-coded
    milestones for four physical CSO control projects into the enforceable part of the permit —
    the first of them, "begin construction", falling 2026-08-01. Effluent limits, the mercury
    variance, the design flow and the TMDL condition are untouched.

