  page: 32
  item: Part II, Y — General Mercury Variance
  action: renewal, granted under OAC 3745-1-38(J)
  wqbel_monthly_average_ng_l: 1.3
  achievable_annual_average_ng_l: 12
  as_printed: >-
    "The City of Van Wert has demonstrated that the facility is currently unable to comply with the
    monthly average water quality based effluent limit of 1.3 ng/L without construction of
    expensive end-of-pipe controls more stringent than those required by sections 301(b) and 306
    of the Clean Water Act. The City of Van Wert is currently able to achieve an annual average
    mercury concentration of 12 ng/L."
  conditions: >-
    Continue a pollutant minimization program (PMP) for mercury — control strategy, periodic
    source and treatment-system monitoring, annual reporting. The plan of study dates to the
    permittee's 2007 application for coverage under the general variance.

tmdl_wasteload_allocation:
  page: 35
  item: Part II, AE
  tmdl: Maumee Watershed Nutrient Total Maximum Daily Load Report, approved September 2023
  individual_wla_kg_total_phosphorus: 1000
  critical_season: March through July
  regulated_through: Maumee Watershed Total Phosphorus NPDES General Permit
  general_permit_id: null
  coverage_status_as_printed: has been granted coverage
  reopener: >-
    "In the event the permittee is no longer covered by the general permit, this individual permit
    may be modified, or revoked and reissued, to incorporate effluent limits consistent with the
    wasteload allocation."
  as_printed: >-
    "AE. The Maumee Watershed Nutrient Total Maximum Daily Load (TMDL) Report was approved in
    September 2023. The TMDL assigned an individual wasteload allocation to Van Wert WWTP of 1,000
    kg of total phosphorus for the critical season (March through July). Compliance with this
    individual wasteload allocation will be regulated through the Maumee Watershed Total
    Phosphorus NPDES General Permit, under which Defiance Van Wert WWTP has been granted
    coverage."
  text_defect: >-
    "under which **Defiance** Van Wert WWTP has been granted coverage" — printed verbatim in the
    issued permit. There is no facility named "Defiance Van Wert WWTP"; Defiance is a different
    city, 40 miles downstream, with its own WWTP and its own permit. The boilerplate was carried
    over unedited from another permittee's condition. Transcribed as found; the sentence still
    grants coverage to this permittee, but the instrument's own naming of the covered facility is
    wrong on its face.
  general_permit_not_named: >-
    The permit does NOT print a general-permit number anywhere — it names the general permit only
    by title. OHP000001 is the Maumee Watershed Total Phosphorus general permit held in this corpus
    (data/documents/oepa/OHP000001.pdf); binding the two is a corpus-side identification, NOT
    something this instrument states. Do not quote this permit as the source for "OHP000001".
  headroom_check:
    tag: '[inference]'
    arithmetic: 15 kg/day (permit monthly-average TP loading limit) x 153 days (Mar 1 - Jul 31) = 2,295 kg
    wla_kg: 1000
    ratio: 2.30
    reading: >-
      Held at its own monthly-average loading limit for the whole critical season, this permit
      allows 2.30x the total phosphorus the Maumee TMDL individually allocated to this plant for
      the same window. That is not a violation of anything — it is why Part II.AE hands compliance
      to the general permit rather than to a number in Part I.A, and why the individual permit
      carries a reopener. The arithmetic is a ceiling comparison, not a measured load; what the
      plant actually discharged in a critical season is `[open]` pending an ECHO effluent-chart
      pull for parameter 00665 (see data/extracted/van-wert/water-watch.yaml).

