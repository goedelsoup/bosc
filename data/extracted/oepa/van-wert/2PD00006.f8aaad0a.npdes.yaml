# WHAT THIS FILE IS — read this before quoting the permit number.
#
# The Ohio EPA DAM slot `permits/doc/2PD00006.pdf` no longer serves the 2025 *VD renewal. Since
# 2026-07-02 it serves the LATER modification package, which is this file's source: a 2026-05-18
# transmittal letter from Director John Logue, the modified permit as issued (2PD00006*WD, 47 pp.,
# entered the Director's Journal 2026-06-30, effective 2026-07-01), and — from 0-based page 48 —
# the modification's own 8-page fact sheet (Public Notice 221593). 56 pages total. The *VD bytes
# are still held alongside (`2PD00006.pdf`); see the filename-map.
#
# TWO PAGE NUMBERINGS. Citations below use the COMPOSITE's 1-based printed sheet. The permit's own
# header numbering runs one behind it (permit "Page 2" is composite sheet 3), and the attached fact
# sheet restarts at "Page 1 of 8" on composite sheet 49. Name which one you mean.
#
# The `permit:` block is the pipeline's read of the first six pages. `permit_no` was CORRECTED on
# review to *WD: the six-page window opens on the transmittal letter, whose header cites *VD as
# "the above referenced NPDES Permit" being modified, and the extractor recorded that. Every one of
# the 47 permit pages that follows is headed 2PD00006*WD, and the letter itself states the number
# changes on the effective date. This document IS the *WD instrument. The extractor's warnings
# about it and about the notice fields are superseded and preserved below rather than deleted.
