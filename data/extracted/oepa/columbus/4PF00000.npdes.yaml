permit:
  tag: '[verified]'
  confidence: high
  warnings:
  - >-
    A NOTE HEADER MISPRINTS THE SIBLING PLANT'S PERMIT PREFIX. Part I.B.12 (sheet 20),
    the Downstream-Nearfield Monitoring table for station 4PF00000901, is followed by
    "Notes for Station Number 4PF00001001:" — that is permit prefix 4PF00001 (Columbus's
    OTHER plant, transcribed separately — see meta.not_in_this_corpus) with station
    suffix 001, not this permit's own 4PF00000901. The note's BODY text is internally
    consistent with THIS permit ("Sampling for the respective, common parameters shall
    occur on the same day as Outfall 4PF00000001"), so this reads as a copy-paste
    artifact in the note's label, not a real cross-reference to the sibling plant's data.
    Transcribed exactly as printed; not corrected, not treated as authority for anything
    about 4PF00001.
  - >-
    A SECOND NOTE HEADER IS MALFORMED, DIFFERENTLY, ON SHEET 3. The notes following the
    Part I.A.1 outfall-001 table are introduced "Notes for station 4PF00000001:" (sheet
    3) — lowercase "station", no "Number" — where the 12 other "Notes for Station
    Number ..." headers in this permit (sheets 5, 6, 7, 9, 11, 13, 15, 16, 17, 18, 19,
    20) use the capitalized, expanded form. Transcribed exactly as printed; not
    corrected to match the permit's own prevailing convention. See
    effluent_limits_001.note_header_defect.
  - >-
    SHEET 19 MISSPELLS A SPECIES NAME IN A PARAMETER LABEL. The upstream (801) table's
    61435 row reads "96-Hr. Acute Toxicity Pimephales promela - % Affected" — missing
    the terminal "s" on "promelas". The correct spelling prints two rows below, in the
    same table's 61441 row ("7-Day Chronic Toxicity Pimephales promelas"). Transcribed
    as printed at 61435, not silently normalized. See
    monitoring_stations.upstream_801.ambient_toxicity.acute_pimephales_promelas_96hr.
  - >-
    OUTFALL 001 HAS NO INITIAL/FINAL PHASE-IN — ONE TABLE COVERS THE WHOLE TERM. Unlike
    permits that split effluent limits into an interim and a final period, Part I.A.1
    (sheets 2-4) is explicit: "During the period beginning on the effective date of this
    permit and lasting until the expiration date, the permittee is authorized to
    discharge in accordance with the following limitations..." — one table, titled
    "Table - Final Outfall - 001 - Final" on its face. The whole effluent toxicity
    parameters (61425 Ceriodaphnia dubia acute, 61426 chronic, 61427 Pimephales promelas
    acute, 61428 chronic) are MONITOR ONLY — no maximum, no weekly, no monthly value —
    for the entire permit term; no numeric WET limit is ever triggered by this permit.
    There is no Toxicity Reduction Evaluation schedule anywhere in Part I.C either (see
    schedule_of_compliance below) — a materially different toxicity posture than a
    permit that phases WET limits in partway through the term.
  - >-
    THE TSS/AMMONIA/CBOD TABLE USES A THREE-WAY SEASON SPLIT THAT DOES NOT MATCH PART
    III's SUMMER/WINTER DEFINITIONS. Part III, Item 1 (sheet 43) defines "Summer" as May 1
    through October 31 and "Winter" as November 1 through April 30 — a two-way split, and
    the definition several OTHER parameters in this permit actually use (E. coli and
    total residual chlorine are both keyed to "Summer" alone). But the TSS (00530),
    ammonia (00610) and CBOD5 (80082) sub-tables in Part I.A instead print THREE distinct
    limit sets keyed "May", "June - Oct." and "Nov. - April" — May stands alone with its
    own numbers, not folded into either the general Summer or Winter period. Reading "the
    summer TSS limit" off this permit without checking which of the three rows is meant
    would silently drop the May-specific numbers. Transcribed as three separate rows
    below, labeled with the permit's own header text.
  - >-
    THE NUMERIC CHLORINE LIMIT IS PRINTED BELOW THE PERMIT'S OWN QUANTIFICATION LEVEL.
    Part I.A sets a Summer maximum of 0.019 mg/l for Total Residual Chlorine (50060,
    sheet 3). Part II, Item M (sheet 33), "Limits Below Quantification", lists exactly one
    parameter — Chlorine, Total Residual, PQL 0.050 mg/L — and explains that compliance
    with a limit set below the Ohio EPA Quantification Level is judged by the below-QL
    rule in OAC 3745-33-07(C), not by ordinary comparison against the raw limit value
    (0.019 mg/l is itself below 0.050 mg/L). Anyone auditing chlorine DMR values against
    the 0.019 number alone, without Item M's compliance rule, will apply the wrong test.
  - >-
    THIS PERMIT PRINTS NO NUMERIC BYPASS-ACTIVATION THRESHOLD FOR STATIONS 002 OR 003.
    Some sibling NPDES permits condition a bypass station on a hard flow precondition
    (e.g. "shall not divert until a sustained peak flow of N MGD is being processed
    through secondary treatment"). This permit's bypass tables (Part I.B.1-2, sheets 5-6,
    stations 4PF00000002 "at wet well" and 4PF00000003 "at headworks") carry no such
    language; bypass is governed only by the general provisions of Part III, Item 11
    (bypass prohibited except under the 40 CFR 122.41(m) / Part III conditions) and Part
    II, Item F, Peak Flow Management (below), which sets a PLANT treatment-capacity
    figure (150 MGD wet-weather primary+secondary capacity; mass loadings at outfall 001
    are based on a 68 MGD normal operating capacity) rather than a bypass-station trigger.
  - >-
    COORDINATES ARE GIVEN FOR THE FINAL OUTFALL AND THE CSO POINTS ONLY. Part II, Item B
    (sheet 24) gives a DMS coordinate for station 4PF00000001 alone among the
    non-CSO/non-bypass stations; bypass (002, 003), all four sludge disposal stations
    (581, 583, 586, 588), influent (601), upstream (801, "Frank Road bridge") and
    downstream (901, "Martin Marietta Aggregates bridge") are named by description only,
    with NO coordinate printed anywhere in this permit. The 28 CSO stations (Item D,
    sheets 25-28) DO each carry two coordinate pairs (relief point and discharge point).
    No River Mile figure appears anywhere in this document for any station — a contrast
    with permits (e.g. Mansfield's 2PE00001) that give an explicit River Mile on the
    authorization sentence.
  - >-
    THIS DOCUMENT DOES NOT STATE WHETHER IT IS A RENEWAL, MODIFICATION, OR NEW ISSUANCE.
    The only revision marker on the face of the permit is the "*QD" suffix on the permit
    number; nothing in the authorization sentence, Part I, Part II or Part III labels the
    action. `permit_action` is therefore left unset below rather than asserted from
    convention or from what a sibling permit's suffix has meant elsewhere in this corpus.
  - >-
    THE 004-052 CSO STATION RANGE IS NOT CONSECUTIVE. Part II Item B lists
    "4PF00000004-052" as a single range descriptor for "Combined Sewer Overflow", but Item
    D's station-by-station list (sheets 25-28) enumerates exactly 28 stations, not the ~49
    numbers the range would imply if consecutive: 004, 005, 006, 007, 010, 011, 012, 015,
    017, 018, 019, 020, 027, 028, 029, 031, 032, 033, 041, 043, 044, 045, 046, 047, 048,
    049, 051, 052. Numbers like 008, 009, 013, 014, 016, 021-026, 030, 034-040, 042, 050
    are simply absent from the document — not omitted here, never printed there.
  - >-
    MINOR: the authorization sentence's facility address prints "2104 Jackson Pike,
    Columbus, Ohio Franklin County" — no comma between "Ohio" and "Franklin County" —
    transcribed as printed (sheet 1).

