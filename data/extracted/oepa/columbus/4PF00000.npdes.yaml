# City of Columbus — Jackson Pike Wastewater Treatment Plant, NPDES permit 4PF00000*QD
# (application OH0024732), action date 2021-11-16, effective 2022-01-01, expiring
# 2026-12-31.
#
# Hand-read from the committed PDF's embedded text layer, not machine-extracted. This
# document is digitally generated (Acrobat Distiller 21.0; no scan, no OCR), so the text
# layer is the instrument's own bytes; every figure below is transcribed with its printed
# sheet cited on the block. Nothing is derived, rounded or inferred unless the block says
# so. No page was rasterized or sent to a vision model, so this file carries no render
# receipt (no doc_id / dpi / pages_read). See watermark.models.TranscribedExtraction — a
# receipt is all-or-nothing.
#
# ⚠️ Columbus has TWO WWTP permits in this batch. This file transcribes 4PF00000
# (Jackson Pike) ONLY. 4PF00001 (Columbus's other plant) is being transcribed
# separately into its own artifact — nothing here references or merges its figures.
#
# The record -> document join (watermark.site.records._source_ref) reads a TOP-LEVEL
# `source_path`, so the primary instrument is named there as well as in meta.sources.
source_path: data/documents/oepa/columbus/4PF00000.pdf
