  # ── Part II, Item E — Nine Minimum Controls (sheets 28-29) ───────────────────────────────
  nine_minimum_controls:
    citation: 'Permit 4PF00000*QD, sheets 28-29, Part II Item E'
    tag: '[verified]'
    preamble: >-
      "The entire wastewater treatment system shall be operated and maintained so that the
      total loading of pollutants discharged during wet weather is minimized."
    controls:
    - proper O&M for the collection system and CSO points
    - maximum use of the collection system for wet-weather storage prior to overflow
    - review/modify the pretreatment program to minimize non-domestic CSO impact
    - maximize POTW wet-weather treatment capability and flow to the plant
    - prohibit dry weather overflows
    - control solid and floatable materials in CSO discharge
    - conduct required CSO inspection, monitoring and reporting
    - implement pollution-prevention programs reducing CSO contaminant levels
    - implement a public-notification program for CSO-affected areas, especially beaches/recreation areas

  # ── Part II, Item F — Peak Flow Management (sheets 29-30) ────────────────────────────────
  peak_flow_management:
    citation: 'Permit 4PF00000*QD, sheets 29-30, Part II Item F'
    tag: '[verified]'
    wet_weather_capacity_mgd: 150
    normal_operating_capacity_mgd: 68
    text: >-
      "The Jackson Pike WWTP shall always be operated to maximize the treatment of wet
      weather flows from its combined sewer system. For each wet weather event, the
      treatment plant shall have the capacity to treat 150 MGD through the primary and
      secondary treatment processes." Requires a Wet Weather Operating Plan (WWOP) with
      procedures for treating wet-weather flow without appreciably diminishing effluent
      quality or destabilizing treatment on return to dry weather, and reasonable-effort
      staffing to maintain non-redundant critical equipment.
    reporting_mechanism: >-
      "Mass loading limitations included in this permit at Outfall 4PF00000001 are based
      on the facility's normal operating capacity of 68 MGD. Exceedances of the mass
      loading limitations could occur if the volume of wet weather flow to the plant
      reaches a point that exceeds the normal operating capacity." During excessive/
      extended wet weather, the permittee reports a MINIMUM of 68 MGD under Reporting Code
      50050 (Flow Rate) and all excess flow under Reporting Code 50047 (Peak Flow Rate).
      Code 50047 values are NOT used in loading calculations, and may not be used when
      reporting under 50050 would reasonably be expected to achieve the mass loading
      limitation.

  # ── Part II, Item G — Sanitary Sewer Overflow reporting (sheets 30-32) ──────────────────
  sso_reporting:
    citation: 'Permit 4PF00000*QD, sheets 30-32, Part II Item G'
    tag: '[verified]'
    prohibition: 'All SSOs are prohibited. An SSO does not include a listed CSO discharge.'
    imminent_danger_reporting:
      notify: 'Ohio EPA (1-800-282-9378) and the appropriate Board of Health within 24 hours of learning of an SSO that may imminently/substantially endanger human health.'
      examples: dry weather overflows, major line breaks, fish kills or other significant harm, public contact with raw sewage, overflows in sensitive/high-exposure areas
      follow_up: 'Written report to the district office within 5 days, covering: estimated start/stop time, location/ID, receiving water, estimated volume, sewer component, cause, and remediation/mitigation steps with milestone schedules.'
    all_sso_reporting:
      dmr: 'System-wide occurrences entering waters of the state reported via station 300 (code 74062, No./Month) — see monitoring_stations.sso_300.'
      annual_report:
        due: March 31 for the prior calendar year
        contents: >-
          (i) a table of SSO locations (ID, description, receiving water, and any
          eliminated locations), numbered consecutively from 301; (ii) a table of overflow
          date, ID, receiving water and estimated volume in million gallons (may summarize
          overflows under ~1,000 gallons); (iii) a table of water-in-basement (WIB)
          occurrences by total number and sewershed, with a narrative WIB pattern analysis
          by location, frequency and cause (public-system-caused WIBs only).
        public_notice: 'Required — administration building, library, post office, newspaper, or sewer-bill insert.'

  # ── Part I.C — Schedule of Compliance (sheets 21-22) ─────────────────────────────────────
  # ONE schedule item only — a Municipal Pretreatment Schedule. There is no Toxicity
  # Reduction Evaluation schedule and no Phosphorus Optimization schedule in this permit
  # (contrast a permit such as Mansfield's 2PE00001*PD, which carries three).
  schedule_of_compliance:
    citation: 'Permit 4PF00000*QD, sheets 21-22, Part I.C'
    tag: '[verified]'
    municipal_pretreatment_schedule:
      part: I.C.A
      due: '2024-01-01'
      due_basis: >-
        [inference] — the permit says "no later than 24 months from the effective date of
        this permit" (sheet 21); 2022-01-01 + 24 months.
      event_code: '52599'
      submit_to: 'Ohio EPA, Central Office Pretreatment Unit and to Ohio EPA, Central District Office'
      submit_to_note: >-
        A single district (Central) is named consistently for this schedule item —
        unlike a permit that splits submittals across two different district offices for
        different schedule items.
      requirement: >-
        Evaluate the adequacy of local industrial user limitations to prevent pollutants
        entering the POTW that interfere with its operation, pass through in amounts
        exceeding water-quality-standard-based limits, are incompatible with the POTW, or
        limit wastewater/sludge use options. Submit either (a) technical justification for
        REVISING local limits with a pretreatment program modification request, or (b)
        technical justification for RETAINING existing local limits.
      pollutants_requiring_justification: >-
        Arsenic, cadmium, total chromium, dissolved hexavalent chromium, copper, free
        cyanide, lead, mercury, molybdenum, nickel, selenium, silver, zinc — "unless
        screening of wastewater and sludge indicate these pollutants are not present in
        significant amounts" — plus any other pollutant needed to protect against pass
        through, interference or sludge disposal.
      report_content_items: >-
        a. pollutants-of-concern identification/justification; b. plant + industrial
        flows to which local limits apply, including hauled-waste volumes by type; c.
        domestic/background concentrations (sample 3 locations x 5 consecutive days, or 2
        locations x 7 consecutive days, of domestic-only wastewater); d. treatment-plant
        removal efficiencies (site-specific where possible); e. maximum-allowable-
        headworks-loading comparison across all applicable criteria; f. allocation method
        if revising limits; g. implementation info if narrative/BMP local limits are
        proposed; h. supporting data/assumptions/methodologies; i. PE stamp and signature
        if new/revised limits are proposed.
      revisions: 'A revised report is due within 90 days of Ohio EPA notifying the permittee of deficiencies.'
      incorporation_deadline: 'Revised local limits must be incorporated into all industrial user control documents no later than 4 months after Ohio EPA''s approval.'
      sampling_methods:
        mercury: >-
          If EPA Method 245.1 or 245.2 is used for domestic-background sampling and
          mercury is below detection, the permittee must use EPA Method 1631 or 245.7 to
          quantify domestic-background mercury.
        free_cyanide: >-
          ASTM D7237, OIA-1677-09, or ASTM D4282-02 (the latter requires supporting
          documentation that it is a "sufficiently sensitive" test procedure under 40 CFR
          122.44(i)(1)(iv)).
    status_of_this_milestone:
      tag: '[open]'
      as_of: '2026-08-26'
      lapsed: >-
        The 2024-01-01 due date for the local-limits technical-justification report
        (Event Code 52599) has passed.
      what_is_not_established: >-
        WHETHER IT WAS FILED. Nothing in this corpus establishes that — no submittal, no
        acknowledgment, no violation notice, no ECHO/ICIS extract for this facility is
        committed. "Past due" here means only that the date has passed, NOT that the city
        missed it.

  # ── Part II — other requirements of note (sheets 32-41) ──────────────────────────────────
  other_requirements_of_note:
    citation: 'Permit 4PF00000*QD, Part II, sheets 32-41'
    tag: '[verified]'
    limits_below_quantification:
      item: 'M. Limits Below Quantification (sheet 33)'
      table: {chlorine_total_residual_pql_mg_l: 0.050}
      significance: >-
        See permit.warnings — the outfall 001 chlorine maximum (0.019 mg/l) is itself
        below this PQL, so compliance is judged by the below-QL arithmetic rule in OAC
        3745-33-07(C), not a plain value comparison. For average limits, values below the
        OEPA QL are treated as zero when computing the arithmetic mean used for
        compliance; maximum-limit results reported below the QL are automatically
        in compliance.
    biomonitoring_program:
      item: 'AA. Biomonitoring Program Requirements (sheets 36-37)'
      text: >-
        "The permittee shall continue its effluent biomonitoring program to determine the
        toxicity of the effluent from outfall 4PF00000001." ("Continue" implies the
        program predates this permit; no prior-permit text is committed in this corpus to
        say what triggered it.)
      testing: >-
        Annual chronic toxicity tests (Ceriodaphnia dubia and Pimephales promelas) for the
        life of the permit; acute endpoints derived from the chronic test; ambient/control
        water tested concurrently at station 4PF00000801, upstream of the effluent/
        receiving-water interaction zone. Per "Reporting and Testing Guidance for
        Biomonitoring", Ohio EPA, July 1998 or current revision.
      sop_due: >-
        The SOP (or verification of SOP submittal) was due "no later than three months
        after the effective date of this permit" — on or about 2022-04-01 [inference].
      definitions: 'TUa = 100/LC50 (acute); TUc = 100/IC25 (chronic), or 100/sqrt(NOEC x LOEC) for Ceriodaphnia dubia where that is more restrictive, outside the mixing zone.'
      note: >-
        No numeric WET limit currently attaches to this program's results — see
        permit.warnings on the absence of a phase-in. Ohio EPA reserves the right to
        modify the permit to require additional biomonitoring, a TRE, or WET limits based
        on the results.
    pretreatment_program_requirements:
      item: 'AB. Pretreatment Program Requirements (sheets 37-40)'
      program_approved: '1985-07-03'
      text: >-
        "The permittee's pretreatment program initially approved on July 3, 1985 and all
        subsequent modifications approved before the effective date of this permit, shall
        be an enforceable term and condition of this permit."
      items_summary: >-
        1. Legal authority to implement/enforce the program, including agreements with
        contributing jurisdictions. 2. Sufficient resources/qualified personnel
        (funding). 3. Industrial-user inventory; Significant Industrial Users (SIUs) per
        OAC 3745-3-01 notified of standards within 30 days of determination. 4. Slug-load
        control-plan evaluation for each SIU at least once per control-mechanism term
        (existing SIUs within 1 year of the effective date if never evaluated; new SIUs
        within 1 year of designation). 5. Local limits, with the waste-load-allocation
        table below for pollutants lacking a final effluent limit. 6. Control mechanisms
        issued to all SIUs per OAC 3745-3-03(C)(1)(c). 7. Industrial compliance monitoring
        — at least annual inspection/sampling of all SIUs, 40 CFR 136 methods, repeat
        sampling within 30 days of a known violation (unless the IU is required to
        self-repeat). 8. POTW priority-pollutant monitoring — annual influent/effluent/
        sludge sampling, reported on Ohio EPA Form 4221 with the annual pretreatment
        report. 9. Enforcement — investigate all noncompliance; publish a Significant
        Noncompliance (SNC) list by February 15 each year. 10. Reporting — Quarterly
        Industrial User Violation Report by the 15th of Jan/Apr/Jul/Oct; Annual
        Pretreatment Report by February 15 (program effectiveness, IU inventory,
        monitoring program description, pass-through/interference incidents, SNC
        publication copy, priority-pollutant results). 11. Records retained a minimum of 3
        years (extended during unresolved litigation). 12. Program modifications —
        substantial changes need prior Ohio EPA approval; otherwise effective 45 days
        after application.
      waste_load_allocation_ug_l:
        arsenic: 202
        cadmium: 7
        chromium_hexavalent: 15
        chromium_total: 235
        copper: 27
        free_cyanide: 16
        lead: 29
        mercury_ng_l: 12
        molybdenum: 27008
        nickel: 161
        selenium: 6.4
        silver: 1.8
        zinc: 351
        note: 'Mercury is printed in ng/L; every other value in this table is ug/L, as labeled.'
    storm_water_compliance:
      item: 'AC. Storm Water Compliance (sheet 41)'
      general_permit_no: 4GR00606*EG
      general_permit_effective_date: '2017-09-21'
      text: >-
        "To comply with industrial storm water regulations, the permittee requested
        coverage under the industrial storm water general permit. Permit 4GR00606*EG
        became effective on September 21, 2017. No later than 90 days after the effective
        date of the renewed general permit, the permittee must request renewed coverage
        under the industrial storm water general permit or make other provisions to
        comply with the industrial storm water regulations."
      status: '[open] — whether/when 4GR00606*EG was subsequently renewed, and whether Columbus filed a renewed-coverage request, is not established anywhere in this corpus.'
    other_items_present:
      note: >-
        Indexed here so a later reader knows what Part II contains without re-walking it;
        not detailed further as most of the remaining letters are procedural/definitional
