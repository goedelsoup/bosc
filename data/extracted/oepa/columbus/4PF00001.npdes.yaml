# City of Columbus, Southerly Wastewater Treatment Plant — NPDES permit 4PF00001*SD
# (application OH0024741), a modification issued 2025-08-06 and effective 2025-10-01,
# expiring 2026-12-31. It modifies the prior permit 4PF00001*RD.
#
# Hand-read from the committed PDF's embedded text layer, not machine-extracted. This
# document is digitally generated (no scan, no OCR; producer "Adobe Acrobat (64-bit) 25.1",
# authoring tool "Fluent Engine 24.2.0.82 (java) www.windwardstudios.com" per the PDF's own
# /Author field), so the text layer is the instrument's own bytes; every figure below is
# transcribed with its printed sheet cited on the block. Nothing is derived, rounded or
# inferred unless the block says so.
#
# THE COMMITTED PDF BUNDLES THREE DOCUMENTS IN ONE 59-PAGE FILE, not one 52-page permit:
#   - PDF page 0 (unnumbered): a 1-page Ohio EPA transmittal cover letter to the permittee,
#     dated 2025-08-06, enclosing the modification and summarizing its three revisions.
#   - PDF pages 1-52: the issued permit itself. PDF page 1 (sheet 1) itself carries NO
#     printed page number, only the "Total Pages: 52" footer; visible page numbering runs
#     "Page 2" through "Page 52" on sheets 2-52. This still matches the permit's own
#     "Total Pages: 52" footer on sheet 1 exactly.
#   - PDF pages 53-58: a 6-page Fact Sheet for the modification, printed "Page 1 of 6"
#     through "Page 6 of 6", a distinct explanatory document (facility description, basis
#     for the modification, public-notice procedure), also transcribed below since it is
#     bound into the same committed file.
# So the PDF's 59-page count and the permit's own "Total Pages: 52" do NOT disagree once
# the cover letter and fact sheet are accounted for — see permit.pdf_structure_note. This is
# the resolution the brief's self-check asks for, not an unresolved discrepancy.
#
# FIVE EMBEDDED IMAGES were inspected directly (extracted from the PDF's own image XObjects,
# not a rasterized page render) solely to identify their subject matter for this note — no
# permit figure, limit, or date below is sourced from an image. See permit.embedded_images.
# Two (the cover-letter letterhead banner and a decorative signature swirl repeated at
# smaller/larger size on two pages) are non-substantive. Two — the Fact Sheet's Figure 1
# (a Black & Veatch topographic location map) and Figure 2 (a Black & Veatch process-flow
# diagram of the whole plant) — are genuine COVERAGE GAPS: their content exists ONLY in the
# image, and the text layer at both captions carries nothing but a broken Word
# cross-reference field ("Error! Reference source not found.") — a defect of the source
# document itself, not of this transcription.
#
# No page was rasterized at 300 DPI for verification, so this file carries no render
# receipt (no doc_id / dpi / pages_read). See watermark.models.TranscribedExtraction — a
# receipt is all-or-nothing, and none of it happened here.
#
# The record -> document join (watermark.site.records._source_ref) reads a TOP-LEVEL
# `source_path`, so the primary instrument is named there as well as in meta.sources.
