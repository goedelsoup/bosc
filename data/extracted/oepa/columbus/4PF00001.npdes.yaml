permit:
  tag: '[verified]'
  confidence: high
  warnings:
  - >-
    A PART II CROSS-REFERENCE MISMATCH runs through station 001's own footnotes b, c and d.
    Notes for Station 4PF00001001 (sheet 4) read: "b. Free cyanide - See Part II, Item U.",
    "c. Mercury - See Part II, Item V.", and "d. Orthophosphate - See Part II, Item W." Part
    II's own lettering (sheets 35-36) runs U = Tracking of Group 4 Parameters (free cyanide
    PEL) → V = Monitoring for Free Cyanide (low-level) → W = Monitoring for Mercury
    (low-level) → X = Monitoring for Dissolved Orthophosphate (as P). [verified], with
    independent internal corroboration, that footnote c is one letter early: the influent
    station's own mercury footnote (Station 4PF00001601, sheet 24, footnote b) correctly
    cites "Item W", so the same permit cites the same item (mercury) both correctly and
    incorrectly in two places — that is a document self-contradiction, not a reading of ours.
    Footnote d (orthophosphate → printed W, titled Item X) fits the identical one-letter-early
    shift. [inference], not equally verified: footnote b (free cyanide → printed U) is read
    here as ALSO one letter early, because Item V is the item literally titled "Monitoring for
    Free Cyanide (low-level)" — an exact match to this row's own label
    (free_cyanide_low_level) — while Item U's own heading is the generic "Tracking of Group 4
    Parameters." Unlike c, there is no second citation of free cyanide anywhere else in this
    permit to confirm b the same way 601's footnote confirms c, so reading b as wrong rests on
    title-matching alone, not a second internal contradiction — flagged here plainly as an
    interpretation, not stated as verified fact. Footnote a (chlorine → Item N) and footnote e
    (peak flow → Item F) and footnote f (biomonitoring → Item Z) are all unambiguously correct
    on both title and content. Transcribed exactly as printed in both places below; not
    silently corrected.
  - >-
    A PARAGRAPH OF PART II ITEM D REAPPEARS VERBATIM, OUT OF PLACE, INSIDE ITEM U. Part II
    Item D's full text — "The permittee is authorized to discharge from the following
    overflows only during wet weather periods when the flow in the sewer system exceeds the
    capacity of the sewer system. See Part III, Item 11." — is printed once correctly under
    heading "D." on sheet 30 (introducing the CSO overflow-location table for station 006).
    It is printed AGAIN, word for word, in the middle of Item U (Tracking of Group 4
    Parameters) on sheet 35, wedged between the free-cyanide PEL reduction requirement and
    the heading for Item V, with no heading letter of its own and no connection to the
    surrounding free-cyanide text. Confirmed against a layout-mode re-extraction of sheet 35
    (identical result), so this is the document's own duplication defect, not a pypdf
    extraction artifact. Transcribed as printed at both locations; the sheet-35 occurrence is
    not treated as a second, independent Item D.
  - >-
    THE FACT SHEET'S TWO FIGURE CAPTIONS ARE BROKEN CROSS-REFERENCES, and the figures'
    content is a coverage gap. Sheet "Page 3 of 6" of the Fact Sheet reads "...Error!
    Reference source not found. shows the approximate location of the facility" and "...which
    are shown on Error! Reference source not found.:" — an unresolved Microsoft Word
    cross-reference field, left in the document as exported to PDF, at both points where the
    Fact Sheet means to name the two figures that follow it (Figure 1, a topographic location
    map, and Figure 2, a process-flow diagram — see permit.embedded_images). The figures
    themselves carry real content — station labels and the plant's full process train — that
    exists ONLY in the image and nowhere in the extractable text of this PDF. See
    permit.embedded_images for what was established about them by direct inspection.
  - >-
    THE FACILITY'S OWN MAILING ADDRESS IS GIVEN TWO DIFFERENT WAYS in this same PDF for the
    same street address, and the document itself resolves why. The cover letter (PDF page 0)
    addresses the permittee at "6977 South High Street, Columbus, OH 43206". The issued permit
    itself (sheet 1) and the Fact Sheet (Page 1 of 6) both give the facility's location as
    "6977 South High Street, Lockbourne, Ohio" / "Lockbourne, OH 43137", Franklin County. But
    the Fact Sheet's own "Name and Address of Applicant" block (Page 1 of 6) gives the
    applicant's mailing address as "1250 Fairwood Avenue, Columbus, OH 43206" — the identical
    ZIP the cover letter used. So the cover letter is not carrying Lockbourne mail under a
    different ZIP; it pairs the plant's own street address (6977 South High Street) with the
    applicant's own corporate mailing ZIP (43206, the same ZIP printed at 1250 Fairwood
    Avenue), not the facility's Lockbourne ZIP (43137). Both are transcribed below at their
    respective fields.
  - >-
    THE SCHEDULE OF COMPLIANCE IS RETIRED, NOT ACTIVE, in this permit — the opposite of
    Mansfield's 2PE00001*PD, which carries a live, dated Toxicity Reduction Evaluation
    schedule. Part I,C here (sheet 27) lists exactly two items, both parenthetically marked
    "(COMPLETE)", with NO due dates and NO event codes: "A. Municipal Pretreatment Schedule
    (COMPLETE)" and "B. Chemically-Enhanced Primary Treatment Effectiveness Study
    (COMPLETE)". The cover letter and Fact Sheet explain why: "the permittee has completed
    all schedule of compliance requirements in the current permit; Part I,C is proposed to be
    modified accordingly." So this modification's own express purpose was to close out the
    schedule that used to be here (under the prior *RD permit, not committed in this corpus)
    — there is no compliance clock running on this facility as of this permit.
  - >-
    SHEET 5 PRINTS STATION 090'S OWN NUMBER TWO WAYS, AND CARRIES A RUN-TOGETHER WORD; SHEET
    29 LEAVES A PARENTHESIS UNCLOSED. Sheet 5's notes block header reads "Notes for Station
    Number 4PF0000190:" — nine digits, missing the "1" that makes the station's real number
    4PF00001090 (ten digits, as printed everywhere else in this document, including the table
    heading two lines above on the same sheet: "outfall: 4PF00001090"). The same sheet's
    footnote a reads "...on each day when the CEPT system is inoperation and wastewater is
    being discharged..." — "is inoperation" printed as one run-together word. Separately, on
    sheet 29, the Item B location table's row for 4PF00001090 reads: '"Fictitious station" -
    final effluent, prior to discharge to Scioto River, includes effluents from secondary
    treatment and CEPT (report at this station when CEPT is operating' — the opening
    parenthesis is never closed before the row ends. All three are the document's own
    printing defects, transcribed as printed; none is corrected here.

