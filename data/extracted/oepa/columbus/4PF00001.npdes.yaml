      ammonia_nh3: {units: mg/l, limit: null, monitoring: When Disch. 24hr Composite}
      ph_minimum: {units: S.U., minimum: 6.0, monitoring: When Disch. Continuous}
    note: >-
      Only three parameters are tracked here at all, each looser than its 001 counterpart in
      the same footnote-g carve-out (DO minimum 5.0 here vs 7.0 at 001; pH minimum 6.0 here vs
      6.5 at 001; ammonia monitor-only at both). "When Disch." means monitored only on days
      the CEPT system (station 603) is discharging.

  # ── Part I.A.3 — internal monitoring station 603 (CEPT effluent) (sheets 6-7) ───────────
  # THE core of this modification — see warnings[4] / revision_summary. The 30 mg/l TSS
  # maximum here is the limit the cover letter says is now effective immediately instead of
  # 2026-01-01.
  effluent_limits_603:
    citation: 'Permit 4PF00001*SD, sheets 6-7, Part I.A.3'
    tag: '[verified]'
    outfall: '4PF00001603'
    period: 'October 1, 2025 through December 31, 2026'
    limits:
      total_suspended_solids: {units: mg/l, maximum: 30, monitoring: When Disch. Calculated, footnote: 'e, f'}
      dissolved_oxygen: {units: mg/l, limit: null, monitoring: When Disch. Multiple Grab}
      ammonia_nh3: {units: mg/l, limit: null, monitoring: When Disch. Composite}
      flow_rate: {units: MGD, limit: null, monitoring: When Disch. Continuous, footnote: c}
    tss_rolling_average_method: >-
      Footnote f: "The 'Maximum' limit for total suspended solids applies to a calculated
      7-activation rolling average. The permittee shall calculate the arithmetic mean of the
      total suspended solids concentrations for seven consecutive CEPT activations. For each
      7-activation data set, the calculated value shall be reported on the day of the seventh
      activation." So the 30 mg/l limit is never tested against any single sample — only
      against a 7-activation trailing mean.
    activation_definition: >-
      Footnote g: an intermittent discharge within one day counts as one activation; a
      discharge continuing across multiple days from one continuing precipitation event also
      counts as one activation (sampling type continues for the activation's duration, value
      reported on the activation's first day).
    two_hour_sampling_footnote: >-
      Footnote h (sheet 7): "Sampling shall commence no later than two (2) hours after a
      discharge has begun to occur at this station. Samples are not required for discharges
      lasting less than two (2) hours. The two-hour delay does not apply to flow monitoring."
      This is the SECOND of the modification's two changes named in the cover letter — the
      footnote itself is new to this *SD revision.
    bypass_authority_note: 'Footnote a: "Discharge through this station is approved as a CSO-related bypass under certain conditions. See Part II, Item G."'

  # ── Part I.B — the non-outfall monitoring stations (sheets 8-26) ────────────────────────
  monitoring_stations:
    citation: 'Permit 4PF00001*SD, sheets 8-26, Part I.B'
    tag: '[verified]'
    bypass_002:
      part: 'I.B.1'
      description: Raw sewage bypass — monitored WHEN DISCHARGING; every parameter is monitor-only
      parameters: >-
        Bypass Occurrence (No./Day), Bypass Total Hours Per Day, Total Suspended Solids,
        Bypass Volume (MGAL), CBOD 5-day — all "When Disch.", no numeric limit on any of
        them.
      note: >-
        Footnote f: "Discharge through this station is prohibited. The Director may take
        enforcement action for violations of this prohibition unless the three conditions
        specified at 40 CFR 122.41(m) and in Part III, Item 11.C.1 of this permit are met."
        A DMR for this station must be submitted every month regardless of whether it
        discharged.
    cso_006:
      part: 'I.B.2'
      description: >-
        Combined sewer overflow, Alum Creek Storm Tank — the ONE CSO authorized under this
        permit (see permit.fact_sheet.cso_ownership_split for the other 30 in the Columbus
        system).
      parameters: >-
        Total Suspended Solids, Ammonia (NH3), Overflow Occurrence (No./Month), Overflow
        Volume (Million Gallons), CBOD 5-day — all "When Disch.", monitor-only, no numeric
        limit.
      note: >-
        Authorized "only during wet weather periods when the flow in the sewer system exceeds
        the capacity of the sewer system" (Part II Item D). If not monitored in a given month,
        the DMR is left blank with a "Monitoring not required" remark rather than a
        "No Discharge" box.
    sso_300:
      part: 'I.B.3'
      parameter: Overflow Occurrence (74062), No./Month, 1/Month Total
      note: >-
        Same reporting-vs-monitoring-frequency distinction as Mansfield's 2PE00001*PD: "the
        intent of that provision is to specify a reporting frequency for Overflow Occurrence,
        not a monitoring frequency. The monitoring requirement under this permit is that these
        overflows shall be monitored on each day when they discharge." Only SSOs reaching
        waters of the state (directly or via a storm sewer) are reported here; "All sanitary
        sewer overflows are prohibited."
      annual_report: >-
        Due March 31 for the prior calendar year: an SSO location table (numbered
        consecutively from 301), a per-overflow date/location/volume table, and a
        water-in-basements summary by sewershed with narrative cause analysis. See Part II
        Item H for the full reporting regime.
    biosolids_sludge_stations:
      note: >-
        FIVE sludge stations are separately monitored here — 581 (land application), 583
        (deep-row hybrid tree farming), 584 (compost for distribution), 586 (landfill) and 588
        (transfer to another NPDES permit holder) — numbered Part I.B.4 through I.B.8 of
        eleven I.B groups total. Mansfield's permit carried only three (581/586/588); this
        permit's tree-farming and compost pathways are Columbus-specific. Only THREE of the
        five — 581, 583 and 584 — carry the 9-metal ceiling table and the nutrient
        (ammonia/TKN/TP/potassium) panel; 586 and 588 carry neither, weight only — see the
        comparison below. Only 584 additionally carries a Pollutant Concentration
        (monthly-average) limit set and a Salmonella limit.
      ceilings_mg_per_kg_581_583_584: {arsenic: 75, cadmium: 85, copper: 4300, lead: 840, nickel: 420, zinc: 7500, selenium: 100, mercury: 57, molybdenum: 75}
      also_monitored_no_limit_581_583_584: ammonia, total Kjeldahl nitrogen, total phosphorus, potassium (nutrient suite)
      land_application_581:
        part: 'I.B.4'
        frequency: 1/2 months Composite (Bimonthly - Even)
        sludge_fee_and_weight_frequency: 1/2 months Total (Bimonthly - Even)
        pollutant_concentration_limits: none — ceiling only
      tree_farming_583:
        part: 'I.B.5'
        frequency: 1/2 months Composite (Bimonthly - Even)
        sludge_fee_and_weight_frequency: 1/2 months Total (Bimonthly - Even)
        pollutant_concentration_limits: none — ceiling only, identical table to 581
      compost_distribution_584:
        part: 'I.B.6'
        frequency: 1/2 months Composite (Bimonthly - Even)
        sludge_fee_and_weight_frequency: 1/2 months Total (Bimonthly - Even)
        pollutant_concentration_limits_mg_per_kg_monthly: {arsenic: 41, cadmium: 39, copper: 1500, lead: 300, nickel: 420, zinc: 2800, selenium: 100, mercury: 17, molybdenum: 75}
        salmonella: {units: MPN/4G, maximum: 3, frequency: 1/2 months Multiple Grab (Bimonthly - Even)}
        note: >-
          Stricter than 581/583: the ceiling table applies here too, but 584 ALSO carries a
          monthly-average Pollutant Concentration limit for every metal (equal to the ceiling
          for nickel and molybdenum, tighter for the rest) plus a Salmonella cap. [verified] —
          station 584's own footnote k (sheet 20) uses this characterization directly: "...all
          results shall meet the limit listed in this station for the biosolids to be
          considered exceptional quality." "Class A" does NOT appear anywhere in this
          document — the only "class" hit in all 59 pages is unrelated ("class A operators,"
          sheet 29, Part II Item A, a wastewater-operator certification level, not a biosolids
          designation). So "exceptional quality" is the permit's own word for 584's limit set
          ([verified], footnote k); "Class A" is genuinely absent, and 581/583's contrasting
          "Class B ceiling-only regime" label remains this file's own [inference] from the
          shape of their (unlabeled) limit set — the document does not use that term either.
        engineering_note: 'For reporting: "At the time of sale/distribution/land application, the Salmonella monitoring results shall not be more than sixty days old" (sheet 20, item k).'
      landfill_586:
        part: 'I.B.7'
        parameter: 'Sludge Fee Weight (51129)'
        units: dry tons
        frequency: 1/Year Total
        month: December
        pollutant_concentration_limits: none — no metals panel at all, weight only
      transfer_to_other_permittee_588:
        part: 'I.B.8'
        parameter: 'Sludge Weight (70316)'
        units: Dry Tons
        frequency: 1/Year Total
        month: December
        pollutant_concentration_limits: none — no metals panel at all, weight only
      shared_conversion_formula: >-
        "dry tons = gallons x 8.34 (lbs/gallon) x 0.0005 (tons/lb) x decimal fraction total
        solids" — printed identically at all four stations.
    influent_601:
      part: 'I.B.9'
      description: >-
        "Influent Monitoring" (sheet 23 heading) — printed with no further location detail
        (no "downstream of..." or similar qualifier); unlike Mansfield's 2PE00001*ND-successor,
        this permit does not say "bar screen" or any other reference point here.
      parameters: >-
        TSS, total cyanide, nickel, zinc, cadmium, lead, total chromium, copper, dissolved
        hexavalent chromium, low-level mercury, pH (max and min), CBOD 5-day — all monitor-only.
      note: >-
        Footnote a: "Sampling for the respective/common parameters shall occur on the same
        day as Outfall 4PF00001001." Footnote b: "Mercury - See Part II, Item W." — this one
        CORRECTLY cites Item W (mercury); contrast with station 001's footnote c, which cites
        the same item as "V" — see warnings[0].
    upstream_801:
      part: 'I.B.10'
      description: Receiving stream, upstream of the point of discharge
      chemistry: pH, ammonia, TKN, nitrite+nitrate, total phosphorus — 1/Month Grab, all months
      bacteria: E. coli, 1/2 Weeks Grab, June-Aug
      ambient_toxicity: >-
        48-hr acute and 7-day chronic Ceriodaphnia dubia, 96-hr acute and 7-day chronic
        Pimephales promelas — all "1/Year Grab, May", reported as "% Affected", no limits.
      note: 'Footnote a: same-day-as-001 sampling. Footnote b: "Biomonitoring - See Part II, Item Z."'
    downstream_nearfield_901:
      part: 'I.B.11'
      description: Receiving stream, downstream of the point of discharge, at the State Route 762 bridge
      parameters: >-
        Water temperature, pH, ammonia, TKN, nitrite+nitrate, total phosphorus, total hardness
        (as CaCO3) — 1/Month Grab, all months; E. coli 1/2 Weeks Grab, June-Aug.
      note: 'Footnote a: same-day-as-001 sampling, identical wording to 801.'

  # ── Part I,C — SCHEDULE OF COMPLIANCE (sheet 27) — see warnings[4] ──────────────────────
  schedule_of_compliance:
    citation: 'Permit 4PF00001*SD, sheet 27, Part I,C'
