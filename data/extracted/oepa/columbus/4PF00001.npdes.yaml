  # ── Part II — other requirements of note (sheets 28-40) ─────────────────────────────────
  other_requirements_of_note:
    citation: 'Permit 4PF00001*SD, Part II, sheets 28-40'
    tag: '[verified]'
    peak_flow_operations:
      item: 'F (sheets 30-31)'
      text: >-
        "The Southerly WWTP shall always be operated to maximize the treatment of wet weather
        flows from its combined sewer system. For each wet weather event, the treatment plant
        shall have the capacity to treat 330 MGD through the primary and secondary treatment
        processes." Mass-loading limits at 001 are based on 114 MGD normal operating capacity;
        during excess wet-weather flow the permittee may report flow above 114 MGD under
        Reporting Code 50047 (Peak Flow Rate) rather than 50050 (Flow Rate), and 50047 values
        are excluded from loading calculations.
    cept_bypass_authority:
      item: 'G (sheet 31)'
      text: >-
        "A CSO-related bypass of the secondary treatment portion... of the POTW treatment
        plant is approved when the influent flow rate to the facility exceeds 330 MGD. ...At a
        minimum, CSO-related bypass flows must receive solids and floatables removal, primary
        clarification, and disinfection... provided by the Chemically Enhanced Primary
        Treatment (CEPT) system." Notice of any CEPT-related bypass is due to Ohio EPA within
        24 hours.
    percent_removal_requirement:
      item: 'M (sheet 33)'
      text: >-
        "The treatment works must obtain at least 85 percent removal of carbonaceous
        biochemical oxygen demand (five-day) and suspended solids (see Part III, Item 1)."
        The only percent-removal limit in this permit — distinct from the concentration/load
        limits at 001 (effluent_limits_001) and from the sampling-timing use of "percent
        removal" in station 601's own text (Part I,B.9, sheet 23: "Samples of influent used
        for determination of net values or percent removal must be taken the same day as
        those samples of effluent used for that determination").
    limits_below_quantification:
      item: 'N (sheets 33-34)'
      pql_table: {chlorine_total_residual: '0.050 mg/L'}
      note: >-
        The one PQL entry in this permit — matches footnote a on station 001's chlorine limit
        (0.020 mg/l maximum, below this 0.050 mg/L PQL).
    pretreatment_local_limits_wla:
      item: 'AA.5 (sheet 38)'
      table_ug_per_l_unless_noted: {arsenic: 202, cadmium: 7, chromium_hexavalent: 15, chromium_total: 235, copper: 27, free_cyanide: 16, lead: 29, mercury_ng_per_l: 12, molybdenum: 27008, nickel: 161, selenium: 6.4, silver: 1.8, zinc: 351}
      note: >-
        Waste load allocation values the permittee must use "when evaluating local limits...
        for which a final effluent limit has not been established" — a SEPARATE dataset from
        the Group 4 free-cyanide PEL (16/60 ug/L, see below) and from the plant's own Part I.A
        limits, which carry no numeric metals limits at all.
    pretreatment_program:
      item: 'AA (sheets 37-40)'
      approved: July 3, 1985, and all subsequent modifications approved before the effective date
      note: >-
        Indexed, not transcribed in full: legal authority, funding, industrial user inventory
        (30-day notification of Significant Industrial User status), slug load control plans,
        local limits (see table above), control mechanisms, industrial compliance monitoring,
        annual POTW priority-pollutant monitoring, enforcement (SNC publication by Feb 15),
        quarterly/annual reporting, 3-year record retention, program modifications (45-day
        default effective date for non-substantial changes).
    group_4_tracking:
      item: 'U (sheet 35)'
      pel_table: {free_cyanide_avg_pel_ug_l: 16, free_cyanide_max_pel_ug_l: 60}
      trigger: >-
        Written notification to Ohio EPA Central District Office within 30 days if the max
        PEL is exceeded 4+ months in any consecutive 6-month period, OR the avg PEL is
        exceeded 2+ months in any consecutive 6-month period; reduction below PEL required
        within 6 months of either trigger (or a compliance-schedule modification request).
    biomonitoring_program:
      item: 'Z (sheets 36-37)'
      text: '"The permittee shall continue to implement an effluent biomonitoring program to determine the toxicity of the effluent from outfall 4PF00001001."'
      testing: >-
        Annual chronic (Ceriodaphnia dubia + Pimephales promelas) and acute bioassays per the
        July 1998 Ohio EPA biomonitoring guidance; ambient/control water from upstream station
        801. SOP or verification of SOP submittal due within 3 months of the effective date
        (2026-01-01 [inference] — three calendar months after the 2025-10-01 effective date).
      definitions: 'TUa = 100/LC50. TUc = 100/IC25, or 100/sqrt(NOEC x LOEC) for Ceriodaphnia dubia where that is more restrictive.'
    outfall_signage:
      item: 'Y (sheet 36)'
      note: >-
        Standard sign requirements at every regulated outfall/bypass/CSO; SSO signage
        specifically grandfathered under "SSO Consent Order (Case No. 02-CVH-05-5768; entered
        August 1, 2002)" — matches the same case number in the Fact Sheet's consent-order
        recital (see permit.fact_sheet.consent_orders).
    storm_water_general_permit:
      item: 'AB (sheet 40)'
      text: >-
        Coverage under industrial storm water general permit 4GR00607*EG, effective September
        13, 2017; renewal request due within 90 days of the general permit's next renewal.
    part_iii_general_conditions_index:
      note: >-
        Boilerplate NPDES general conditions, sheets 41-52, 32 numbered items — indexed here,
        not transcribed in full (standard federal/state language, not facility-specific).
        Item 13 is printed "RESERVED" with no text. Full list of headings: 1 Definitions ·
        2 General Effluent Limitation · 3 Facility Operation and Quality Control ·
        4 Reporting · 5 Sampling and Analytical Method · 6 Recording of Results ·
        7 Records Retention · 8 Availability of Reports · 9 Duty to Provide Information ·
        10 Right of Entry · 11 Unauthorized Discharges (bypass) · 12 Noncompliance
        Notification · 13 RESERVED · 14 Duty to Mitigate · 15 Authorized Discharges ·
        16 Discharge Changes · 17 Toxic Pollutants · 18 Permit Modification or Revocation ·
        19 Transfer of Ownership or Control · 20 Oil and Hazardous Substance Liability ·
        21 Solids Disposal · 22 Construction Affecting Navigable Waters · 23 Civil and
        Criminal Liability · 24 State Laws and Regulations · 25 Property Rights · 26 Upset ·
        27 Severability · 28 Signatory Requirements · 29 Other Information · 30 Need to Halt
        or Reduce Activity · 31 Applicable Federal Rules · 32 Availability of Public Sewers.
        This permit's own authorization sentence names only "Parts I, II, and III" — unlike
        Mansfield's permit (which named Parts I-VI), there is no separate stormwater Part
        IV/V/VI here; industrial stormwater is instead covered by the separate general permit
        at Item AB above.

