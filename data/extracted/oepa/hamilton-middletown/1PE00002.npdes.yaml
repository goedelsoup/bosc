# document is digitally generated (producer "Adobe PDF Library 21.7.123", creator
# "Acrobat PDFMaker 21 for Word" — no scan, no OCR), so the text layer is the instrument's
# own bytes; every figure below is transcribed with its printed sheet cited on the block.
# Nothing is derived, rounded or inferred unless the block says so.
#
# NO page was rendered or read visually. Every transcribed value was unambiguous in the
# pypdf text layer (spot-checked by grep against the raw extraction — design flow, the
# B2EHP final-table figures, the ammonia/CBOD/TSS numeric limits and the chlorine limit
# all match). This file therefore carries no render receipt at all (no doc_id / dpi /
# pages_read / image_pages_read). See watermark.models.TranscribedExtraction — a receipt
# is all-or-nothing and this extraction used none of it.
#
