        Sheet 18 note a: "Data for 24 hour total flow, bypass occurrence, and bypass duration
        may be estimated if a measuring device is not available." An intermittent discharge
        within one day is reported "1"; a discharge continuing over
        multiple days from one continuing precipitation event is also reported "1" (on the
        first day only). Discharge through this station is prohibited (see warnings[7]).
    upstream_801:
      description: Receiving stream ABOVE the discharge
      chemistry: 'water temperature, dissolved oxygen, pH, ammonia, nitrite+nitrate, total phosphorus — 1/Month Grab, All months'
      bacteria: E. coli, 1 per 2 Weeks Grab, June - Aug
      ambient_toxicity: >-
        48-Hr Acute Ceriodaphnia dubia (61432), 1/Year Grab, June; 96-Hr Acute Pimephales
        promelas (61435), 2/Year Grab, Semi-annual; 7-Day Chronic Ceriodaphnia dubia (61438),
        1/Year Grab, June; 7-Day Chronic Pimephales promelas (61441), 2/Year Grab,
        Semi-annual. Reported as "% Affected", no limits.
      note: >-
        a. Biomonitoring - See Part II, Item Y. b. Sampling for the respective/common
        parameters shall occur on the same day as Outfall 1PE00002001.
    downstream_nearfield_901:
      description: Receiving stream BELOW the discharge
      parameters: >-
        Water temperature, pH, ammonia, total Kjeldahl nitrogen, nitrite+nitrate, total
        phosphorus, total hardness (as CaCO3) — 1/Month Grab, All months; E. coli, 1 per 2
        Weeks Grab, June - Aug.
      note: 'Sampling for the respective/common parameters shall occur on the same day as Outfall 1PE00002001.'
      significance: >-
        801 + 901 together are a committed monthly upstream/downstream nutrient record on the
        Great Miami River, arriving through DMRs for the life of the permit (to 2026-10-31 —
        see warnings[4] on how little of that life remains).
    same_day_and_detention_time_sampling_notes:
      tag: '[verified]'
      citation: 'Permit 1PE00002*OD, sheet 27, Part II Items M, N, O'
      item_m: >-
        "Sampling for these parameters at station 1PE00002001, 1PE00002601, and 1PE00002901
        shall occur the same day." Governs cadmium, chromium, copper, lead, nickel, zinc, and
        (via footnote g on the 001 table) B2EHP.
      item_n: >-
        "Sampling at station 1PE00002001 for these parameters shall occur one detention time
        (the time it takes for a volume of water to travel through the treatment plant) after
        sampling at station 1PE00002601 for the same parameters on the same day." Governs
        dissolved hexavalent chromium, free cyanide, and mercury.
      item_o: >-
        The mirror-image rule for station 601: sampling there for those same parameters
        occurs one detention time BEFORE the corresponding 001 sample, same day. More precise
        than a flat same-day rule — it accounts for actual plant travel time.

  # ── Part I.C — Schedule of Compliance (sheets 22-24) ─────────────────────────────────────
  schedule_of_compliance:
    citation: 'Permit 1PE00002*OD, sheets 22-24, Part I.C'
    tag: '[verified]'
    structural_note: >-
      This permit prints NO separate milestone summary table (unlike some sister permits in
      this corpus) — only the narrative sections below, each carrying its own single Event
      Code with no alternate zero-padded form observed anywhere in this document.
    municipal_pretreatment_schedule:
      part: I.C.A
      due: '2022-05-01'
      due_basis: '[inference] — the permit says "no later than six months from the effective date of this permit"; 2021-11-01 + 6 months.'
      event_code: '52599'
      submit_to: 'Ohio EPA, Central Office Pretreatment Unit and to Ohio EPA, Southwest District Office'
      requirement: >-
        Evaluate the adequacy of local industrial user limitations to prevent pollutants
        entering the POTW that would interfere with its operation, pass through in amounts
        exceeding water quality standard-based limits, be incompatible with the POTW, or
        limit wastewater/sludge use options. Submit either a technical justification for
        REVISING local limits (with a pretreatment program modification request) or a
        technical justification for RETAINING the existing ones.
      pollutants_requiring_justification: >-
        Arsenic, bis(2-ethylhexyl) phthalate, cadmium, total chromium, dissolved hexavalent
        chromium, copper, free cyanide, lead, mercury, molybdenum, nickel, selenium, silver,
        and zinc — "unless screening of wastewater and sludge indicate these pollutants are
        not present in significant amounts" — plus any other pollutant where a local limit
        may be necessary to protect against pass through, interference or sludge disposal.
      engineering_requirement: >-
        If new or revised industrial user discharge limits are proposed, the stamp and
        signature of a licensed Ohio professional engineer is required.
      revisions: >-
        A revised report is due within 90 days of Ohio EPA notifying the permittee of
        deficiencies; revised limits must be incorporated into all industrial user control
        documents no later than 4 months after Ohio EPA's approval.
    final_effluent_limits_for_b2ehp:
      part: I.C.B
      preamble: >-
        "The permittee shall attain compliance with the new effluent limits for
        bis(2-ethylhexyl) phthalate (B2EHP) as expeditiously as possible but no later than
        the dates in the following schedule."
      steps:
      - step: 1
        due: '2022-11-01'
        due_basis: '[inference] — "no later than 12 months from the effective date of this permit."'
        event_code: '07099'
        submit_to: Ohio EPA Southwest District Office
        requirement: >-
          Submit a report on the process of bringing the facility into compliance with the
          final B2EHP limits: five years of B2EHP influent/effluent data; a list of
          significant and non-significant industrial users with any available B2EHP data
          from the pretreatment program; a summary of the previous 12 months' actions taken;
          and a description of actions planned for the next 12 months.
      - step: 2
        due: '2023-11-01'
        due_basis: '[inference] — "no later than 24 months after the effective date of this permit."'
        event_code: '61099'
        requirement: >-
          Submit a progress report detailing progress toward B2EHP compliance, including at
          minimum the previous 12 months' B2EHP data and a description of reduction actions
          taken.
      - step: 3
        due: '2024-11-01'
        due_basis: '[inference] — "no later than 36 months after the effective date of this permit." See warnings[3] on how this lines up with the Final table.'
        event_code: '05699'
        requirement: >-
          Attain compliance with the final B2EHP effluent limits and notify Ohio EPA
          Southwest District Office within 7 days of achieving compliance.
    phosphorus_optimization:
      part: I.C.C
      due: '2022-11-01'
      due_basis: '[inference] — "no later than 12 months from the effective date of this permit."'
      event_code: '21599'
      submit_to: 'Ohio EPA Southwest District Office AND Ohio EPA, Division of Surface Water, NPDES Permit Unit, P.O. Box 1049, Columbus, OH 43216-1049 (two copies, one to each)'
      requirement: >-
        Prepare and submit for acceptance a Phosphorus Discharge Optimization Evaluation
        plan — an evaluation of collected effluent data, possible source reduction measures,
        operational improvements and minor facility modifications that will optimize
        reductions in phosphorus discharges from the WWTP, with a proposed implementation
        schedule.
      follow_through: >-
        Upon Ohio EPA's acceptance, the permittee implements the plan and schedule; a
        complete Permit-to-Install (PTI) application with approvable detail plans must be
        submitted to the Southwest District Office "where appropriate." The permittee must
        also fill out and submit the Evaluation for Reducing Discharge of Phosphorus Form,
        reporting overall progress, attached to the future permit renewal application.
    status_of_these_milestones:
      tag: '[open]'
      as_of: '2026-08-26'
      lapsed: >-
        All five scheduled dates have passed: the pretreatment local-limits justification
        (2022-05-01), the Phosphorus Optimization plan and the first B2EHP report
        (2022-11-01, same due date, different requirements), the second B2EHP progress
        report (2023-11-01), and B2EHP compliance itself (2024-11-01). See warnings[4] for
        the additional lapsed No-Exposure-Certification deadline and the renewal-application
        deadline.
      what_is_not_established: >-
        WHETHER ANY OF THEM WAS FILED. Nothing in this corpus establishes that — no
        submittal, no acknowledgment, no violation notice, and no ECHO/ICIS extract for this
        facility is committed. "Past due" here means the date has passed, NOT that the City
        of Hamilton missed it.
      how_to_close_it: >-
        A public-records request to Ohio EPA Southwest District Office for the 52599, 07099,
        21599, 61099 and 05699 submittals under permit 1PE00002 would settle all five at
        once, and would also indicate whether the plant is in fact meeting the B2EHP limit
        that has been enforceable, on this reading, since 2024-11-01.

  # ── Part II — other requirements of note (sheets 25-36) ─────────────────────────────────
  other_requirements_of_note:
    citation: 'Permit 1PE00002*OD, Part II, sheets 25-36'
    tag: '[verified]'
    sso_legal_framework:
      item: 'D. Sanitary Sewer Overflows (sheet 26-27)'
      text: >-
        All SSOs are prohibited. The permittee must follow its Overflow Emergency Response
        Plan (OERP, dated July 1, 2007, approved by the Director January 4, 2008) and "the
        requirements in the consent order for case number CV88 10 1450 that was filed in the
        Butler County Common Pleas Court system on January 19, 2007" for responding to,
        reporting and recording SSOs.
      significance: >-
        A named, citable consent-order case number and court — CV88 10 1450, Butler County
        Common Pleas — that a records request could pull directly, independent of this
        permit.
    limits_below_quantification:
      item: 'J. Limits Below Quantification (sheets 27-28)'
      table: {chlorine_total_residual: {pql_mg_l: 0.050, ml: null}}
      note: >-
        Only chlorine is listed in this permit's below-QL table (compare to the metals/
        cyanide/mercury complex of "See Part II, Item...' footnotes elsewhere — those are
        governed by the same-day/detention-time rules in Items M/N/O, not this table).
    local_limits_wla_table:
      item: 'Z.5 Local Limits (sheet 32-33)'
      text: >-
        Waste load allocation values the permittee must use when evaluating local limits for
        pollutants without a final effluent limit already established in this permit.
      values_ug_per_l_unless_noted:
        arsenic: 296
        cadmium: 11
        chromium_hexavalent: 22
        chromium_total: 383
        copper: 42
        free_cyanide: 22
        lead: 47
        mercury_ng_l: 12
        molybdenum: 41509
        nickel: 235
        selenium: 8.9
        silver: 2.7
        zinc: 516
    pretreatment_program_requirements:
      item: 'Z. Pretreatment Program Requirements (sheets 31-34)'
      program_approved: '1985-07-03'
      requirements_index: >-
        Legal authority (item 1), funding/staffing (2), industrial user inventory with a
        30-day Significant-Industrial-User notification duty (3), slug load control plan
        evaluation within one year (4), local limits development using the WLA table above
        (5), control mechanisms for all SIUs (6), industrial compliance monitoring including
        annual SIU inspection (7), annual POTW priority-pollutant monitoring of influent/
        effluent/sludge (8), enforcement with an annual (by Sept 15) newspaper publication of
        industrial users in Significant Noncompliance (9), reporting — quarterly industrial
        user violation reports (Jan/Apr/Jul/Oct 15) and an annual pretreatment report
        (Sept 15) (10), 3-year record retention (11), and a program-modification approval
        process, with substantial modifications requiring prior Ohio EPA approval (12).
    storm_water_no_exposure_certification:
      item: 'AA. Storm Water (sheet 35)'
      certification_signed: '2019-03-15'
      reaffirmation_cycle: every five years
      next_due: '2024-03-15'
      note: >-
        This is an explicit printed calendar date, not an [inference] — and, like the
        Schedule of Compliance dates, it has already passed as of 2026-08-26 (see
        warnings[4]).
    biomonitoring_program:
      item: 'Y. Biomonitoring Program Requirements (sheets 30-31)'
      text: 'The permittee shall "continue to implement" an effluent biomonitoring program to determine the toxicity of the effluent from outfall 1PE00002001.'
      sop_due: '2022-02-01'
      sop_due_basis: '[inference] — "no later than three months after the effective date of this permit."'
      chronic_bioassays: 'Annual, Ceriodaphnia dubia AND fathead minnow (Pimephales promelas), on effluent from 1PE00002001.'
      acute_bioassays: >-
        Annual for Ceriodaphnia dubia, semi-annual for fathead minnow, on effluent from
        1PE00002001. Acute testing is skipped in a month where chronic testing is conducted;
        acute endpoints are derived from the chronic test instead.
      ambient_testing: Upstream control water collected at station 1PE00002801, same test sections as effluent testing.
      definitions: 'TUa = 100/LC50. TUc = 100/IC25, except for Ceriodaphnia dubia outside the mixing zone, where TUc = 100/sqrt(NOEC x LOEC) applies when more restrictive.'
      significance: >-
        Unlike a facility whose WET limits and biomonitoring program name different outfalls,
        every reference here — the Part I.A toxicity monitoring, Item Y's biomonitoring
        program, and the ambient comparison at 801 — consistently names the single outfall
        1PE00002001. There is no cross-station disagreement to record for this permit.
    other_items_present:
      note: >-
        Transcribed as an index of what Part II contains, so a later reader knows what is in
        the instrument without re-walking it. Not summarized in detail here.
      items: >-
        A. Operator Certification Requirements (Class IV facility / Class II collection
        system, minimum staffing) · C. Weekend/holiday reporting exception ("AN") · E. Duty
        to maintain treatment works and sewerage system · F/G/H. Composite, grab and multiple
        grab sample definitions · I. 85 percent removal requirement · K. RCRA
        permit-by-rule for POTWs accepting hazardous waste by truck/rail/pipeline · L. Water
        quality-based limits subject to revision on updated WLAs/TMDLs · M/N/O. Same-day and
        detention-time sampling sequencing (transcribed above) · P/Q/R/S. Sludge disposal
        compliance, composite-sample method, annual disposal-summary report (due March 1),
        and daily percent-total-solids sampling/weight calculation · T. Free cyanide method
        approval (ASTM D7237-10, OIA-1677-09, or ASTM D4282-02 — see warnings[9] on this same
        standard printed without the "-10" suffix elsewhere in the permit) · U. Dissolved orthophosphate
        method (0.45-micron filter within 15 minutes, analyzed within 48 hours) · V. Mercury
        method (EPA 1631 or 245.7) · W. B2EHP composite method (glass containers, 3+ manual
        grabs over 8 hours) · X. Outfall signage requirements.
    part_iii_general_conditions:
      citation: 'Permit 1PE00002*OD, Part III, sheets 36-47'
      note: >-
        Indexed rather than transcribed in full — this is standard statewide NPDES boilerplate
        (definitions of daily/weekly/monthly discharge, "85 percent removal," absolute
        limitations, net concentration/load, winter [Nov 1 - Apr 30] and summer [May 1 -
        Oct 31], bypass/upset/severe-property-damage definitions, sewage sludge definitions;
        general effluent-free-of-substances prohibitions A-F; facility operation and quality
        control; DMR/e-DMR reporting and signatory requirements; sampling/analytical methods;
        recording of results; 3-year records retention (5 years for sludge records);
        availability of reports; duty to provide information; right of entry; unauthorized
        discharges (bypass notice and prohibition conditions); noncompliance notification
        (24-hour, 30-minute emergency, and 5-day follow-up procedures, with a full district-
        office phone/e-mail directory); duty to mitigate; authorized discharges; discharge
        changes; toxic pollutants; permit modification/revocation; transfer of ownership; oil
        and hazardous substance liability; solids disposal; construction affecting navigable
        waters; civil/criminal liability; state laws; property rights; upset; severability;
        signatory requirements; ORC 6111.99 penalty provisions ($25,000 per violation, or up
        to one year imprisonment for ORC 6111.04/6111.042/6111.05/6111.07(A) violations);
        need to halt or reduce activity; applicable federal rules; and availability of public
        sewers — not facility-specific and not re-transcribed here.
