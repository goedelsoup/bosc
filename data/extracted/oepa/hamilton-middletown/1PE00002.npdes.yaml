permit:
  tag: '[verified]'
  confidence: high
  warnings:
  - >-
    THE PERMIT'S OWN PAGE COUNT DOES NOT MATCH THE PDF. Sheet 1 prints "Total Pages: 48",
    but the committed PDF has 47 pages and the last page's own printed header reads
    "Page 47" — there is no page 48 anywhere in the file, numbered or not. Either the
    printed total is simply wrong by one, or a 48th page exists in the original instrument
    and was not captured into this PDF. This corpus cannot distinguish those two
    possibilities; it is recorded here as a finding, not resolved.
  - >-
    THIS PERMIT HAS ONLY ONE OUTFALL, 1PE00002001, and it carries BOTH the technology-based
    limits (TSS, CBOD, oil & grease) AND the water-quality-based limits (ammonia,
    phosphorus monitoring, E. coli, chlorine, B2EHP, whole effluent toxicity monitoring, pH)
    at the same point. There is no second "001/002" split of technology- vs
    water-quality-based limits the way some sister facilities in this corpus are built.
    Anyone expecting a 002 table in this permit will not find one.
  - >-
    THE ONLY SUBSTANTIVE CHANGE BETWEEN THE INITIAL AND FINAL TABLES IS BIS(2-ETHYLHEXYL)
    PHTHALATE (B2EHP). This was confirmed programmatically (a parameter-by-parameter diff
    of the two tables' extracted text, after stripping page headers/footers) as well as by
    reading both tables end to end: every other parameter — TSS, CBOD, oil & grease,
    ammonia (both seasons), TKN, nitrite+nitrate, phosphorus, orthophosphate, the metals
    suite, E. coli, chlorine, mercury, free cyanide, both toxicity species, pH, total
    filterable residue, flow rate — is byte-identical in both tables. B2EHP goes from
    MONITOR ONLY (all dashes, Initial table) to a numeric limit (maximum 2100 ug/l,
    monthly average 7.7 ug/l, load 255 kg/day daily / 0.933 kg/day monthly, Final table).
  - >-
    THE B2EHP COMPLIANCE DEADLINE AND THE NEW LIMIT'S ENFORCEABILITY DATE APPEAR TO LAND ON
    THE SAME DAY, WITH NO MARGIN. Part I.C.B.3 requires compliance with the final B2EHP
    limits "no later than 36 months after the effective date of this permit" — a plain
    duration, which from 2021-11-01 computes to 2024-11-01. Part I.A.2 separately says the
    Final table (carrying that same B2EHP limit) applies "beginning on the 37th month after
    effective date" — an ordinal-month phrase that, read the same way the "36th month"/"37th
    month" language resolves elsewhere in this corpus (month 1 = the effective date's own
    calendar month), also lands on 2024-11-01. Both resolutions are [inference]: the permit
    prints neither date, only the duration/ordinal language. If the reading is right, the
    permittee's deadline to already BE compliant is the identical calendar date the limit
    first becomes legally enforceable — effectively zero buffer, unlike a schedule that gives
    a facility a running-start margin before its own new limit bites.
  - >-
    EVERY SCHEDULE-OF-COMPLIANCE DEADLINE IN THIS PERMIT HAS ALREADY PASSED, AND SO HAS THE
    PERMIT'S OWN RENEWAL-APPLICATION DEADLINE. As of 2026-08-26: the pretreatment local-limits
    justification (6 months, ~2022-05-01), the Phosphorus Optimization plan and the first
    B2EHP report (12 months, ~2022-11-01), the second B2EHP progress report (24 months,
    ~2023-11-01), B2EHP compliance itself (36 months, ~2024-11-01), and the Storm Water
    "No Exposure Certification" re-affirmation (an explicit calendar date printed on the
    permit: 2024-03-15) are all in the past. More urgently: the permit's own 180-day
    renewal-application deadline ahead of its 2026-10-31 expiration — on or about 2026-05-04
    — has ALSO passed, and the permit itself expires in roughly two months from today. Nothing
    in this corpus establishes whether any of these were filed — no submittal, no
    acknowledgment, no renewal application, no ECHO/ICIS extract for this facility is
    committed. "Past due" here means only that the date has passed, NOT that the City of
    Hamilton missed it or that the permit is lapsing without a pending renewal.
  - >-
    THE TABLE CAPTIONS IN THE TEXT LAYER READ AS DUPLICATED: "Table - Final Outfall - 001 -
    Initial - 001 - Initial" for the Initial table and "Table - Final Outfall - 001 - Final -
    001 - Final" for the Final table. This may be the permit's own printed caption or an
    artifact of how pypdf linearizes a merged/multi-row table header cell; it does not affect
    any transcribed limit value, and it was not checked against a render (see method above).
    Transcribed here verbatim rather than silently cleaned up.
  - >-
    THIS PERMIT NAMES NO COMBINED SEWER OVERFLOW PARTS. The authorization sentence on sheet 1
    limits itself to "Parts I, II, and III of this permit" — there is no Part IV/V/VI here,
    and Part II Item D's SSO definition explicitly carves out "wet weather discharges from
    combined sewer overflows specifically listed in Part II of this NPDES permit (if any)" —
    the "(if any)" is boilerplate; no CSO station or CSO limits appear anywhere in this
    document.
  - >-
    THE BYPASS STATION CARRIES NO NUMERIC LIMITS AND NO FLOW-BASED TRIGGER. Station
    1PE00002603 (Part I.B.6) is monitor-only on every parameter — TSS, ammonia and CBOD carry
    no limit, only "When Disch. Grab All." Discharge through it is simply "prohibited," full
    stop, with enforcement waived only under the general three-part defense at 40 CFR
    122.41(m) / Part III Item 11.C.1. There is no permit-specific numeric precondition (e.g.
    a sustained-flow threshold) governing when the bypass may be used.
  - >-
    THE SSO NOTE'S OWN PREMISE CONTRADICTS ITS OWN TABLE, AT BOTH SSO STATIONS. Note a for
    both 1PE00002027 (sheet 10) and 1PE00002037 (sheet 11) opens: "Although the above table
    indicates that the Measuring Frequency for Overflow Occurrence is 1/Month..." But the
    table it refers to prints "When Disch. Total" in the Measuring Frequency cell for Overflow
    Occurrence (code 74062) at both stations — not "1/Month" (see
    monitoring_stations.sso_027.parameters.overflow_occurrence.monitoring above, transcribed
    verbatim from the table; "No./Month" there is only the reporting UNIT, not a measuring
    frequency). The note's stated premise does not match the table it is describing. Both
    halves are already transcribed elsewhere in this file; recorded here as an unresolved
    internal disagreement rather than silently favoring either reading.
  - >-
    THE SAME ASTM STANDARD IS PRINTED TWO WAYS IN THIS PERMIT. Part I.C, Item A.4.b (sheet 23,
    Sampling Methods) lists "ASTM D7237" among the approved free-cyanide domestic-background
    methods, with no revision suffix. Part II, Item T (sheet 29) lists the same method as
    "ASTM D7237-10." Both are printed exactly as quoted here on their own sheet; this corpus
    does not resolve whether the permit means the same edition of the standard in both places
    or whether the omission on sheet 23 is simply informal.
  - >-
    THREE PRINTED TYPOS, TRANSCRIBED VERBATIM RATHER THAN SILENTLY CORRECTED. (1) Sheet 19's
    upstream monitoring table (station 1PE00002801) prints parameter 61435 as "96-Hr. Acute
    Toxicity Pimephales promela" — missing the terminal "s" (the correct species name,
    Pimephales promelas, is printed correctly elsewhere in this same permit, e.g. parameter
    61428). (2) Sheet 11, SSO note c for station 1PE00002037, prints "All sanitary sewer
    overflowsare prohibited" — "overflows" and "are" are run together with no space; sheet 10's
    note c for station 1PE00002027 prints the same sentence correctly spaced. (3) Sheet 30,
    Item Y.2 (Acute Bioassays) prints "annual acute toxicity tests using Ceriodaphnia dubia
    semi-annual acute toxicity tests using fathead minnows" — dropping the conjunction between
    the two clauses (almost certainly "and," between "dubia" and "semi-annual," was intended).
    None of the three affects a numeric limit or a monitoring requirement; recorded here per
    the corpus's transcribe-as-printed convention.

