  # ── Part I.B.1 — bypass monitoring, station 002 (sheet 8) ───────────────────────────────
  effluent_limits_002_bypass:
    citation: 'Permit 1PE00003*RD, sheet 8, Part I.B.1'
    tag: '[verified]'
    outfall: '1PE00003002'
    all_parameters_monitor_only: true
    parameters: >-
      Bypass Occurrence (00051, No./Day), Bypass Total Hours Per Day (00052, Hrs/Day), Total
      Suspended Solids (00530, mg/l), Bypass Volume (51428, MGAL), CBOD 5-day (80082, mg/l) —
      ALL carry "When Disch." measuring frequency and NO numeric limit. Unlike the mansfield
      precedent's bypass station (which carries real TSS/CBOD weekly-monthly limits), this
      headworks bypass has no numeric limit of any kind — monitoring and reporting only.
    notes: >-
      a. 24-hour total flow, bypass occurrence and duration may be estimated if a measuring
      device is unavailable. b. A DMR for this station must be submitted every month. c.
      Monitoring/sampling conducted and reported on each day of discharge. d. If no discharge
      the entire month, select "No Discharge" and PIN the eDMR. e. Bypass Occurrence counting
      rule: intermittent starts/stops on one day count as "1"; a continuing precipitation
      event spanning days counts as one occurrence, reported on the first day. f. "Discharge
      through this station is prohibited. The Director may take enforcement action for
      violations of this prohibition unless the three conditions specified at 40 CFR
      122.41(m) and in Part III, Item 11.C.1 of this permit are met."

  # ── Part I.B.2 — CSO monitoring, station 003 (template for 003-010) (sheets 9-10) ───────
  effluent_limits_003_cso:
    citation: 'Permit 1PE00003*RD, sheets 9-10, Part I.B.2'
    tag: '[verified]'
    template_note: >-
      "The monitoring tables for the 8 CSO sampling stations listed in Part II, Item F. of
      this permit are identical to this one, which is for station 1PE00003003." Applies to
      1PE00003003 through 1PE00003010 (see sampling_stations.cso_stations for each station's
      own coordinates and receiving stream).
    all_parameters_monitor_only: true
    parameters: >-
      Total Suspended Solids (00530, mg/l, 1/Quarter Grab), E. coli (31648, #/100 ml,
      1/Quarter Grab, Summer-Qtrly), Overflow Occurrence (74062, No./Month, When Disch.
      Total), Overflow Volume (74063, Million Gallons, When Disch. 24hr Total), CBOD 5-day
      (80082, mg/l, 1/Quarter Grab) — no numeric limit on any parameter.
    notes: >-
      a. Authorized discharge only during wet weather when sewer-system flow exceeds sewer
      capacity, subject to Part III Item 2 (General Effluent Limitations). b. DMR due every
      month; see Part II Items F and G for per-station requirements. c. If not monitored a
      given month: leave data blank, enter "Monitoring not required" in Remarks, PIN the
      eDMR. d. If monitored with no discharge: select "No Discharge" and PIN. e. Overflow
      Occurrence/Volume may be estimated if no measuring device available. f. Occurrence
      counting rule mirrors SSO station 300's. g. Overflow Volume reported each discharge
      day; TSS/CBOD quarterly, E. coli quarterly in summer.

  # ── Part I.B — the non-outfall monitoring stations (sheets 11-19) ───────────────────────
  monitoring_stations:
    citation: 'Permit 1PE00003*RD, sheets 11-19, Part I.B.3-9'
    tag: '[verified]'
    sso_300:
      citation: sheet 11, Part I.B.3
      parameter: Overflow Occurrence (74062), No./Month, 1/Month Total
      note: >-
        The permit is explicit the 1/Month frequency is a REPORTING frequency, not a
        monitoring one: "these overflows shall be monitored on each day when they
        discharge." Only SSOs entering waters of the state (directly or via storm sewer)
        are reported here. Each location overflowing on a given day counts as one occurrence.
        "All sanitary sewer overflows are prohibited."
      annual_report: >-
        Annual SSO report covering ALL overflows (including those never reaching waters of
        the state) due March 31 for the prior calendar year: a table of SSO locations
        numbered consecutively from 301 with receiving water; a table of overflow dates,
        IDs, receiving waters and estimated volumes (MG; may summarize overflows under
        ~1,000 gallons); a table summarizing water-in-basement (WIB) occurrences by number
        and sewershed with narrative analysis by location/frequency/cause — WIBs from the
        publicly-owned system only. Public notice of the report's availability is required
        (posted notices, newspaper, or sewer-bill insert).
    sludge_581:
      citation: sheets 12-13, Part I.B.4
      description: Class B biosolids, prior to land application
      frequency: 1/Quarter Composite
      ceilings_mg_per_kg: {arsenic: 75, cadmium: 85, copper: 4300, lead: 840, nickel: 420, zinc: 7500, selenium: 100, mercury: 57, molybdenum: 75}
      also_monitored: >-
        Ammonia (00611), TKN (00627), total phosphorus (00668), potassium (00938), Sludge Fee
        Weight (51129) and Sludge Weight (70316) — all monitor-only at this station.
    sludge_584:
      citation: sheets 14-16, Part I.B.5
      description: Exceptional Quality (EQ) biosolids, prior to land application or sale/distribution
      frequency: 1/Quarter Composite
      ceilings_mg_per_kg: {arsenic: 75, cadmium: 85, copper: 4300, lead: 840, nickel: 420, zinc: 7500, selenium: 100, mercury: 57, molybdenum: 75}
      table3_pollutant_concentration_mg_per_kg: {arsenic: 41, cadmium: 39, copper: 1500, lead: 300, nickel: 420, zinc: 2800, selenium: 100, mercury: 17, molybdenum: 75}
      salmonella: {units: MPN/4G, maximum: 3.0}
      also_monitored: Ammonia (00611), TKN (00627), total phosphorus (00668), potassium (00938), Sludge Fee Weight (51129), Sludge Weight (70316).
      note: >-
        584 carries BOTH the ceiling (Table 1) values AND the tighter Table 3 pollutant-
        concentration monthly values that 581 (Class B) does not — consistent with 40 CFR
        503's requirement that EQ biosolids meet the stricter Table 3 limits, not just the
        ceilings.
      salmonella_reporting_rule: >-
        Note k (sheet 16): at least seven grab samples shall be taken and analyzed; ALL
        results must meet the limit for the biosolids to be considered exceptional quality;
        the single highest value attained is reported.
    sludge_586:
      citation: sheet 17, Part I.B.6
      description: Sewage sludge disposed of in a solid waste landfill
      parameter: Sludge Fee Weight (51129), dry tons, 1/Year Total, reported on the December DMR for the entire year.
    upstream_801:
      citation: sheet 18, Part I.B.8
      description: Receiving stream upstream of the point of discharge, at State Route 73
      chemistry: Ammonia, TKN, nitrite+nitrate, total phosphorus — 1/Month Grab, all months.
      bacteria: E. coli, 1/2 Weeks Grab, June-Aug.
      ambient_toxicity: >-
        48-hr acute Ceriodaphnia dubia (61432) and 7-day chronic Ceriodaphnia dubia (61438),
        96-hr acute Pimephales promelas (61435) and 7-day chronic Pimephales promelas
        (61441) — all "% Affected", 1/Year Grab in August. All monitor-only, no limits.
    downstream_farfield_901:
      citation: sheet 19 (and its byte-identical duplicate at sheet 21, see permit.warnings[1])
      description: "Receiving stream downstream of the point of discharge, directly above the confluence of Dick's Creek"
      parameters: >-
        Water temperature (00010), pH (00400), ammonia (00610), TKN (00625), nitrite+nitrate
        (00630), total phosphorus (00665), hardness as CaCO3 (00900) — 1/Month Grab, all
        months; E. coli (31648) 1/2 Weeks Grab, June-Aug. All monitor-only, no limits.

  # ── Part I.C — SCHEDULE OF COMPLIANCE (sheets 22-24) ─────────────────────────────────────
  # The finding: this permit carries TWO compliance schedules (pretreatment local limits, and
  # the phase-in for the seven parameters listed in changes_at_month_37). Unlike mansfield,
  # there is no Toxicity Reduction Evaluation schedule — WET never gains a numeric limit here.
  # All three milestone dates below are already in the past as of 2026-08-26.
  schedule_of_compliance:
    citation: 'Permit 1PE00003*RD, sheets 22-24, Part I.C'
    tag: '[verified]'
    municipal_pretreatment_schedule:
      part: I.C.A
      due: '2022-07-01'
      due_basis: '[inference] — the permit says "no later than six months from the effective date of this permit"; 2022-01-01 + 6 months.'
      event_code: '52599'
      submit_to: 'Ohio EPA, Central Office Pretreatment Unit and to Ohio EPA, Southwest District Office'
      district_office_note: >-
        Only ONE district office is named anywhere in this permit's compliance-schedule
        material (Southwest); unlike the mansfield precedent, there is no inter-part
        disagreement between two named districts to record here.
      requirement: >-
        Evaluate the adequacy of local industrial user limitations to prevent pollutants
        entering the POTW that would interfere with its operation, pass through in amounts
        exceeding water-quality-standard-based limits, be incompatible with the POTW, or
        limit wastewater/sludge use options. Submit either technical justification for
        REVISING local limits (with a pretreatment program modification request) or
        technical justification for RETAINING existing ones. Required for arsenic, cadmium,
        total chromium, dissolved hexavalent chromium, copper, free cyanide, lead, mercury,
        molybdenum, nickel, selenium, silver and zinc "unless screening of wastewater and
        sludge indicate these pollutants are not present in significant amounts," plus any
        other pollutant that may need a local limit against pass-through/interference/sludge
        disposal.
      report_contents: >-
        a. Pollutants of concern and justification. b. Plant flow and industrial flows to
        which local limits apply (including hauled-waste data, if accepted). c.
        Domestic/background concentrations (min. 3 locations x 5 consecutive days, or 2
        locations x 7 consecutive days). d. Treatment plant removal efficiencies. e.
        Comparison of maximum allowable headworks loadings against all applicable criteria.
        f. Method of allocating pollutant loads to industrial users, if limits are revised.
        g. Narrative/BMP local limits, if proposed. h. Supporting data/assumptions/
        methodologies. i. A licensed Ohio PE's stamp and signature, if new/revised limits
        are proposed.
      sampling_methods: >-
        a. Mercury: if EPA Method 245.1/245.2 yields non-detect for domestic background,
        use EPA Method 1631 or 245.7 to quantify domestic background mercury. b. Free
        cyanide: use ASTM D7237, OIA-1677-09, or ASTM D4282-02 for domestic background.
      revisions: >-
        A revised report is due within 90 days of Ohio EPA notifying the permittee of
        deficiencies; revised limits incorporated into all industrial user control
        documents no later than 4 months after Ohio EPA's approval.
    final_limits_compliance_schedule:
      part: I.C.B
      title: >-
        Compliance Schedule to Meet Final Effluent Limits for 3,4-benzofluoranthene, benzo
        (a) pyrene, bis (2-ethylhexyl) phthalate, dibenzo (a,h) anthracene, dissolved oxygen
        (winter), indeno (1,2,3-c,d) pyrene, and selenium
      preamble: >-
        "The permittee shall attain compliance with the final effluent limits for outfall
        1PE00003001 as soon as possible, but no later than the schedule included below."
      cross_check: >-
        These seven pollutants are exactly the seven items transcribed under
        effluent_limits_001.changes_at_month_37 above.
      milestones:
      - step: i
        due: '2023-01-01'
        due_basis: '[inference] — "Within 12 months of the effective date"'
        event_code: '95999'
        requirement: 'Submit to the Ohio EPA Southwest District Office a status report on progress toward the final effluent limits for outfall 1PE00003001.'
      - step: ii
        due: '2024-01-01'
        due_basis: '[inference] — "Within 24 months of the effective date"'
        event_code: '95999'
        requirement: 'Submit to the Ohio EPA Southwest District Office a second status report on progress toward the final effluent limits.'
      - step: iii
        due: '2025-01-01'
        due_basis: '[inference] — "Within 36 months of the effective date"'
        event_code: '05699'
        requirement: 'Have attained full compliance with the final effluent limits for outfall 1PE00003001.'
    status_of_these_milestones:
      tag: '[open]'
      as_of: '2026-08-26'
      lapsed: >-
        All four milestone dates are in the past: the pretreatment local-limits submittal
        (2022-07-01) and all three final-limits schedule steps (2023-01-01, 2024-01-01,
        2025-01-01).
      what_is_not_established: >-
        WHETHER ANY OF THEM WAS FILED, OR WHETHER COMPLIANCE WAS ACTUALLY ATTAINED BY STEP
        III. Nothing in this corpus establishes that — no submittal, no acknowledgment, no
        violation notice, and no ECHO/ICIS extract for this facility is committed. "Past
        due" here means only that the date has passed, NOT that the city missed any of
        them. The Final table (numeric selenium/PAH/B2EHP/DO-winter limits) is the one
        currently in force regardless of whether step iii's status-report history is known.
      how_to_close_it: >-
        A public-records request to Ohio EPA for the 52599, 95999 (x2) and 05699 submittals
        under permit 1PE00003, and for the facility's DMR history since 2025-01-01, would
        settle both whether the schedule was met and whether the Final limits are currently
        being achieved.

  # ── Part II — other requirements of note (sheets 25-41) ─────────────────────────────────
  other_requirements_of_note:
    citation: 'Permit 1PE00003*RD, Part II, sheets 25-41'
    tag: '[verified]'
    biomonitoring_program:
      item: 'D. Biomonitoring Program Requirements (sheets 27-28)'
      text: '"The entity shall continue to implement its effluent biomonitoring program to determine the toxicity of the effluent from outfall 1PE00003001."'
      testing: >-
        Annual chronic toxicity tests (with acute endpoints derived from the chronic test) on
        Ceriodaphnia dubia and Pimephales promelas, effluent from 1PE00003001, per Ohio EPA's
        biomonitoring guidance (July 1998 or current revision). Ambient/control water
        collected at upstream station 1PE00003801, outside the effluent/receiving-water
        interaction zone.
      significance: >-
        Unlike the mansfield precedent's WET program (which is tied to a station-naming
        discrepancy between Part I.A and Part II), this permit names ONE outfall (001)
        consistently for biomonitoring in both Part I.A and Part II Item D — no
        cross-reference ambiguity to record here. Consistent with permit.warnings[2]: this
        program stays monitor-only for the life of the permit.
    nine_minimum_controls:
      item: 'G. Nine Minimum Controls (sheet 29)'
      preamble: >-
        "The entire wastewater treatment system shall be operated and maintained so that the
        total loading of pollutants discharged during wet weather is minimized."
      controls: >-
        1. Proper O&M of the collection system and CSO points. 2. Maximize collection-system
        storage of wet-weather flow before overflow. 3. Review/modify the pretreatment
        program to minimize nondomestic-discharge impact from CSOs. 4. Maximize the POTW's
        wet-weather treatment capability within its limits. 5. Prohibit dry-weather
        overflows. 6. Control solid/floatable materials in CSO discharge. 7. Required
        CSO inspection, monitoring and reporting. 8. Pollution-prevention programs targeting
        CSO contaminant levels. 9. Public notification program for CSO-affected areas,
        especially beaches/recreation areas.
    sso_reporting:
      item: 'H. Sanitary Sewer Overflow Reporting (sheets 30-32)'
      definition: >-
        "SSOs do not include wet weather discharges from combined sewer overflows
        specifically listed in Part II of this NPDES permit (if any). All SSOs are
        prohibited."
      imminent_endangerment: >-
        Immediate notice to Ohio EPA (1-800-282-9378) and the Board of Health within 24
        hours of learning of an SSO that may imminently/substantially endanger human health
        (dry-weather overflows, major line breaks, fish kills, public contact with raw
        sewage, overflows in sensitive/high-exposure areas). Written follow-up to the Ohio
        EPA Southwest District Office within 5 days, with the items enumerated at H.1.b.
      routine_reporting: >-
        SSOs reaching waters of the state reported on DMRs at station 300 (see
        monitoring_stations.sso_300). Annual report of ALL SSOs (including those not
        reaching waters of the state) due March 31; contents at H.2.b; public notice
        required.
    quantification_levels:
      item: 'N. Below-OEPA-QL Parameters (sheet 33)'
      pql_ug_per_l: {benzo_a_pyrene: 0.11, bis_2_ethylhexyl_phthalate: 10.0, chlorine_total_residual_mg_l: 0.05, dibenzo_a_h_anthracene: 0.15, indeno_pyrene: 0.21}
      compliance_rule: >-
        Maximum limits: any value reported below the OEPA QL is in compliance. Average
        limits: compliance is the arithmetic mean using zero for values below the QL,
        compared to the average limit. All results reported, including sub-QL ones; results
        below MDL reported as "AA" (below detection).
    mdls:
      item: 'AF. Method Detection Limits (sheet 41)'
      mdl_ug_per_l: {benzo_a_pyrene: 0.02, benzofluoranthene_34: 0.09, bis_2_ethylhexyl_phthalate: 2.0, dibenzo_a_h_anthracene: 0.03, indeno_pyrene: 0.07, silver: 1.3}
      alternate_methods: >-
        If the listed MDLs cannot be met for benzo(a)pyrene, 3,4-benzofluoranthene,
        dibenzo(a,h)anthracene, and/or indeno(1,2,3-cd)pyrene: EPA Method 610 by GC or
        Standard Methods 6440 B by HPLC.
    local_limits_wla_values:
      item: 'AA.5 Local Limits — waste load allocation values (sheet 37)'
      note: >-
        Used "when evaluating local limits for the following pollutants for which a final
        effluent limit has not been established" — i.e. the metals/cyanide suite that stays
        monitor-only at outfall 001 throughout this permit.
      wla_ug_per_l: {arsenic: 296, cadmium: 11, chromium_hexavalent: 22, chromium_total: 383, copper: 42, free_cyanide: 22, lead: 47, mercury_ng_l: 12, molybdenum: 41509, nickel: 235, silver: 2.7, zinc: 516}
    pretreatment_program:
      item: 'AA. Pretreatment Program Requirements (sheets 36-40)'
      approved: March 16, 1985, and all subsequent modifications approved before this permit's effective date.
      contents_index: >-
        1. Legal Authority. 2. Funding. 3. Industrial User Inventory (SIU notification
        within 30 days of determination). 4. Slug Load Control Plans for SIUs. 5. Local
        Limits (see local_limits_wla_values above). 6. Control Mechanisms for SIUs. 7.
        Industrial Compliance Monitoring (annual SIU inspection/sampling minimum). 8. POTW
        Priority Pollutant Monitoring (annual, influent/effluent/sludge). 9. Enforcement
        (annual Significant Noncompliance publication by Feb 15). 10. Reporting (quarterly
        IU violation report by the 15th of Jan/Apr/Jul/Oct; annual pretreatment report by
        Feb 15). 11. Record Keeping (3-year minimum retention, extended during litigation).
        12. Program Modifications (45 days to take effect unless deemed substantial).
    outfall_signage:
      item: 'Z. Outfall Signage (sheet 35)'
      requirement: >-
        Permanent sign at each regulated outfall (final outfalls, bypasses, CSOs) naming the
        permittee, the Ohio EPA permit number, the outfall number, and a contact phone
        number; letters >=2 inches; sign >=2ft x 2ft, >=3ft above ground, unobstructed and
        kept visible. Submerged outfalls note that fact; CSO signs must state that untreated
        human sewage may be discharged during wet weather and harmful bacteria may be
        present.
    other_items_present:
      note: >-
        Indexed so a later reader knows what is in the instrument without re-walking it. Not
        summarized in detail here beyond what appears above.
      items: >-
        A. Operator Certification Requirements (classification, professional operator of
        record, staffing) · B. O&M Manual compliance · C. Sampling station locations · E.
        Weekend/holiday monitoring exception ("AN") · F. CSO authorization/coordinates · I.
        General duty to maintain treatment/sewerage works · J./K./L. Composite/grab/multiple-
        grab sample definitions · M. 85% removal requirement · O. RCRA permit-by-rule for
        POTWs accepting hazardous waste by truck/rail/pipeline · P. Water-quality-based
        limits subject to revision on updated WLAs/TMDLs · Q./R./S. Same-day and detention-
        time sampling sequencing between stations 001 and 601 · T./U./V./W. Sewage sludge
        ORC/OAC compliance, composite-sample method, annual disposal-summary report (due
        March 1), daily percent-total-solids/weight recordkeeping · X. Approved free-cyanide
        methods · Y. Approved mercury methods · AB. Reserved · AC. B2EHP composite-sampling
        method (glass containers, >=3hr intervals) · AD. Dissolved orthophosphate
        field-filtration method (0.45-micron, 15-min/48-hr windows) · AE. CMOM Plan
        (continuing; annual self-audit).

