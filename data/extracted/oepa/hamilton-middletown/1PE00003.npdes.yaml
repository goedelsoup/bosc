# City of Middletown Wastewater Treatment Works — NPDES permit 1PE00003*RD (application
# OH0026522), action date 2021-12-01, effective 2022-01-01, expiring 2026-12-31.
#
# Hand-read from the committed PDF's embedded text layer, not machine-extracted. This
# document is digitally generated (Producer: "Adobe Acrobat Standard DC (32-bit)", Creator:
# "Acrobat PDFMaker 21 for Word" — no scan, no OCR), so the text layer is the instrument's
# own bytes; every figure below is transcribed with its printed sheet cited on the block.
# Nothing is derived, rounded or inferred unless the block says so. Several Part I.A limit
# tables interleaved their columns under pypdf's default text-extraction order (the
# "Monitoring Months" value was pulled to the FRONT of the row); those tables were re-read
# with extraction_mode="layout", which reproduces true left-to-right column order, and every
# loading figure was cross-checked by recomputing it from its own concentration limit and
# the permit's stated 26 MGD design flow before being transcribed (see effluent_limits_001
# below).
#
# ONE page was additionally rendered at 300 DPI and read visually — sheet 5 (PDF page index
# 4), to confirm that the outfall number is genuinely blank in the Part I.A.2 authorization
# sentence ("...following outfall: 1PE00003 . See Part II...") and not a text-extraction
# artifact. It is the document's own defect — see permit.warnings[0]. That is a VERIFICATION
# of one transcribed line, not the extraction method: no page was rasterized and sent to a
# vision model, so this file carries no render receipt (no doc_id / dpi / pages_read). See
# watermark.models.TranscribedExtraction — a receipt is all-or-nothing.
#
# hamilton-middletown is a DUAL-CITY site. This file covers ONLY 1PE00003 (City of
# Middletown). The sibling permit 1PE00002 (City of Hamilton) is a different agent's
# artifact at data/extracted/oepa/hamilton-middletown/1PE00002.npdes.yaml — its figures are
# NOT referenced here and this file does not open or depend on it.
#
# The record -> document join (watermark.site.records._source_ref) reads a TOP-LEVEL
# `source_path`, so the primary instrument is named there as well as in meta.sources.
source_path: data/documents/oepa/hamilton-middletown/1PE00003.pdf
