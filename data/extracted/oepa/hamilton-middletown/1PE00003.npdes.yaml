permit:
  tag: '[verified]'
  confidence: high
  warnings:
  - >-
    THE OUTFALL NUMBER IS BLANK IN THE PART I.A.2 AUTHORIZATION SENTENCE ON ITS FACE, and
    this was checked against a 300 DPI render of sheet 5 (see header note) rather than
    assumed from the text layer. The sentence reads "...the permittee is authorized to
    discharge in accordance with the following limitations and monitoring requirements from
    the following outfall: 1PE00003 . See Part II, OTHER REQUIREMENTS, for locations of
    effluent sampling." — the expected "001" suffix simply is not printed between "1PE00003"
    and the period. The parallel sentence introducing the Initial-period table (sheet 2)
    prints the full "1PE00003001" without defect. Every other reference to the outfall in
    this permit (the table captions, Item C, Item D, the compliance schedule) prints the full
    eight-digit number; only this one sentence is short.
  - >-
    THE PRINTED PAGE NUMBERING SKIPS "PAGE 20", AND THE STATION THAT WOULD LOGICALLY SIT
    THERE IS MISSING FROM THE PERMIT. PDF page index 18 is printed "Page 19" (the Part I.B.9
    Downstream-Farfield table, station 901); PDF page index 19 — the very next physical
    page — is printed "Page 21" and is BYTE-IDENTICAL in body text to "Page 19" (confirmed by
    direct text comparison, not by page-number reading alone). No physical page anywhere in
    this PDF is printed "Page 20"; the sequence goes 1-19, 21-81, which is 80 distinct
    printed numbers matching the PDF's actual 80 pages — see pdf_vs_printed_pages below.
    Separately, Part I.B's own item numbering skips "7." outright: the sequence printed is
    "1. Bypass Monitoring" / "2. CSO Monitoring" / "3. SSO Monitoring" / "4./5./6. Sludge
    Monitoring" / "8. Upstream Monitoring" — no "7." appears anywhere in the permit. And
    station 1PE00003601 (Influent) is named in Part II Item C's station-location list and
    referenced procedurally in Items Q, R and S (same-day / detention-time sampling relative
    to 001), but carries NO monitoring table of its own anywhere in Part I.B — every other
    named station (002, 003, 300, 581, 584, 586, 801, 901) does. These three facts are
    consistent with a single explanation: the true "Page 20" — logically "7. Influent
    Monitoring," station 1PE00003601 — was dropped during production and the following page
    was printed as a duplicate of "Page 19" instead, with its page number bumped to 21 to
    keep the running count. That is [inference], not read off the document — nothing in this
    permit says so — and it is offered as the most economical account of three independently
    observed gaps, not asserted as fact. What IS verified is only: no page 20 exists, no item
    7 exists, and no 601 table exists. See sampling_stations.station_601_note.
  - >-
    THE INITIAL/FINAL PHASE-IN AT OUTFALL 001 IS A DIFFERENT SHAPE THAN THE ONE-PARAMETER
    CHANGE SEEN AT OTHER FACILITIES IN THIS BATCH. Seven things change between the Initial
    table (sheets 2-4) and the Final table (sheets 5-7): the winter dissolved-oxygen minimum
    tightens (2.0 -> 4.0 mg/l), and SIX parameters move from monitor-only to numeric limits —
    selenium, 3,4-benzofluoranthene, benzo(a)pyrene, indeno(1,2,3-cd)pyrene, dibenzo(a,h)
    anthracene, and bis(2-ethylhexyl)phthalate. This exactly matches the seven pollutants
    named in Part I.C.B's compliance-schedule heading ("...dissolved oxygen (winter)...and
    selenium"), which cross-validates the transcription. By contrast, and unlike the
    mansfield precedent, the whole-effluent-toxicity parameters (61425-61428, Ceriodaphnia
    dubia and Pimephales promelas) are MONITOR-ONLY in BOTH the Initial and Final tables —
    this permit carries no Toxicity Reduction Evaluation schedule at all, and no WET
    parameter ever gains a numeric limit at any point in the permit term. See
    effluent_limits_001 below for the full parameter-by-parameter diff.
  - >-
    THREE OF THE EIGHT CSO STATIONS DISCHARGE TO A DIFFERENT NAMED WATER THAN THE OTHER FIVE.
    Part II Item F gives each of the eight CSO stations (1PE00003003 through 010) its own
    DMS coordinate and receiving stream. Stations 003-007 are marked "GMR" (the permit's own
    abbreviation for Great Miami River, defined in the same table). Stations 008 (2nd
    Avenue), 009 (Lakeside) and 010 (Bulls Run) are marked "Hydraulic Canal" instead — a
    different named water that this permit never defines, locates, or traces onward. Whether
    the Hydraulic Canal is itself a Great Miami tributary is `[open]`; nothing in this
    corpus establishes it.
  - >-
    THE RENEWAL-APPLICATION DEADLINE THIS PERMIT SETS FOR ITSELF HAS ALREADY PASSED. The
    authorization sentence requires renewal materials "no later than 180 days prior to" the
    2026-12-31 expiration date — on or about 2026-07-04 [inference; the permit prints no
    calendar date for this, only the 180-day rule] — which is before today's date
    (2026-08-26). Whether the City of Middletown filed a renewal application is `[open]`; no
    ICIS-NPDES extract, no Ohio EPA correspondence and no draft renewal permit for this
    facility is committed in this corpus. The permit remains in force on its printed terms
    until 2026-12-31 regardless (or under Ohio's continuation-of-permit rule if a timely
    renewal application was filed — which this file cannot establish either way).

