      class: not stated as a letter class on this permit's face — parameters mirror biosolids land-application monitoring
      frequency: >-
        1/Year, reported on the December DMR. Sampling Type is NOT uniform across the
        table: Composite for the metals/nutrient rows, Multiple Grab for fecal coliform
        (51131), and Total for Sludge Fee Weight (51129) and Sludge Weight (70316).
      ceilings_mg_per_kg: {arsenic: 75, cadmium: 85, copper: 4300, lead: 840, nickel: 420, mercury: 57, molybdenum: 75, zinc: 7500, selenium: 100}
