      toc_table_numbering_defect: >-
        The Fact Sheet's own Table of Contents (sheet "Page 3 of 34") misnumbers its List
        of Tables from Table 7 onward: it prints "Table 7" twice ("Table 7. Effluent
        Characterization Using Pretreatment Data" and "Table 7. Effluent Characterization
        Using Self-Monitoring Data") and, continuing the resulting off-by-one, ends at
