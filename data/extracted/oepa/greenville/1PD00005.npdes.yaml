        mansfield, this permit's toxicity parameters (61425-61428) stay MONITOR ONLY at
        the outfall in BOTH the Initial and Final tables — no numeric WET limit is
        introduced anywhere in this permit term, and the Fact Sheet places the plant in
        WET "Category 4" (no current toxicity problem, monitoring only).
