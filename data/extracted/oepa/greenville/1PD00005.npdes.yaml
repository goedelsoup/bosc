# City of Greenville WWTP — NPDES permit 1PD00005*OD (application OH0025429), issued
# 2023-08-29, effective 2023-10-01, expiring 2028-09-30. Ohio EPA's own Fact Sheet titles
# the action a "Permit Renewal"; the permit's authorization sentence itself prints no
# action-type label (see permit_action below).
#
# Hand-read from the committed PDF's embedded text layer, not machine-extracted. This
# document is digitally generated (Producer: Adobe PDF Library 21.5, Creator: Acrobat
# PDFMaker 21 for Word) — no scan, no OCR — so the text layer is the instrument's own
# bytes; every figure below is transcribed with its printed sheet cited on the block.
# Nothing is derived, rounded or inferred unless the block says so.
#
# TWO pages were additionally rendered at 300 DPI and read visually to verify one
# transcribed detail: PDF index 1 (permit sheet "Page 2", Initial effluent table) and
# PDF index 4 (permit sheet "Page 5", Final effluent table), to confirm that the Water
# Temperature row's printed "Sampling Type" cell genuinely differs between the two
# periods ("Continuous" vs "Daily Continuous Max") and is not a text-extraction
# line-wrap artifact — see effluent_limits_001.changed_at_month_36.water_temperature.
# That is a VERIFICATION of one transcribed cell, not the extraction method: no page was
# rasterized and sent to a vision model, so this file carries no render receipt (no
# doc_id / dpi / pages_read). See watermark.models.TranscribedExtraction — a receipt is
# all-or-nothing.
#
# The record -> document join (watermark.site.records._source_ref) reads a TOP-LEVEL
# `source_path`, so the primary instrument is named there as well as in meta.sources.
source_path: data/documents/oepa/greenville/1PD00005.pdf
