  # ── Part I.B — the non-outfall monitoring stations (sheets 8-18) ────────────────────
  monitoring_stations:
    citation: 'Permit 1PD00005*OD, sheets 8-18, Part I.B'
    tag: '[verified]'
    sso_300:
      parameter: Overflow Occurrence (74062), No./Month, 1/Month Total, all months
      note: >-
        Explicit that 1/Month is a REPORTING frequency, not monitoring: "these overflows
        shall be monitored on each day when they discharge." Only SSOs reaching waters of
        the state (directly or through a storm sewer) are reported at this station. A
        two-location day counts as two occurrences.
      annual_report: >-
        An annual SSO report (all overflows, including those never reaching waters of the
        state) is due March 31 for the prior calendar year, with locations numbered
        consecutively from 301, volumes in millions of gallons, and a narrative WIB
        (water-in-basement) analysis by location, frequency and cause.
