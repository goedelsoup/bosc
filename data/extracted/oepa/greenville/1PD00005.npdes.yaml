permit:
  tag: '[verified]'
  confidence: high
  warnings:
  - >-
    THE PDF HAS 81 PAGES; THE PERMIT'S OWN PRINTED "Total Pages" ON SHEET 1 IS 47. This
    is NOT a missing/extra-page defect in the issued instrument: PDF pages (0-based)
    0-46 ARE the permit's own 47 numbered pages ("Page 1" through "Page 47", Parts I-III),
    and PDF pages 47-80 are the Fact Sheet for the same permit action, bound into the same
    file with its own independent "Page 1 of 34" .. "Page 34 of 34" numbering that the
    permit's own page count does not include. 47 + 34 = 81 exactly. See
    meta.bound_fact_sheet_note and the `fact_sheet` block below for what those 34 pages
    contain. Read all 81 PDF pages to produce this file; the permit body proper is only
    the first 47.
  - >-
    THE SAME EVENT CODE, 1799, IS ASSIGNED TO TWO DIFFERENT MILESTONES WITH DIFFERENT DUE
    DATES, and the Milestone Summary Report table on sheet 19 lists only ONE of them.
    Part I.C.A.2 (the Permit-to-Install application for the new WQ-based limits) is due
    "not later than 24 months after the effective date...(Event Code 1799)" and IS in the
    milestone table. Part I.C.B.1 (the municipal pretreatment local-limits technical
    justification) is due "no later than 6 months after the permit effective date (Event
    Code 1799)" and is ABSENT from the milestone table entirely — the table has no row for
    it at all, under 1799 or any other code. A reader relying on the milestone table alone
    would miss the 6-month pretreatment deadline and would, if they noticed 1799 twice,
    reasonably read it as one requirement rather than two. See schedule_of_compliance.
  - >-
    THE FINAL EFFLUENT TABLE'S OWN FOOTNOTES MISNUMBER, and the letters after the error
    no longer match the Initial table's footnotes for the same items. The Initial table
    (sheet 4) letters its notes a. Mercury, b. Free Cyanide, c. Orthophosphate,
    d. Biomonitoring, e. Selenium/PAHs/Silver, f. Ammonia-Summer/PAHs/Selenium. The Final
    table (sheet 8) prints a. Mercury, b. Free Cyanide, **b. Orthophosphate** (repeating
    "b." instead of advancing to "c."), c. Biomonitoring, d. Selenium/PAHs/Silver,
    e. Ammonia-Summer/PAHs/Selenium — every letter from Orthophosphate onward is shifted
    one letter earlier than in the Initial table for the identical content. Transcribed as
    printed in both tables; see effluent_limits_001 notes.
  - >-
    NO RIVER MILE IS PRINTED ANYWHERE IN THE PERMIT ITSELF. The sheet-1 authorization
    sentence names the receiving water ("discharging to Greenville Creek") but gives no
    mile marker — contrast the mansfield precedent, where the water was blank but the
    mile WAS printed. Part II Item B's station table gives station 1PD00005001 a DMS
    coordinate but likewise no river mile. "River Mile 19.35" appears only in the bound
    Fact Sheet's location paragraph (sheet "Page 6 of 34") — a distinct document, tagged
    [reference] in the `fact_sheet` block, not [verified] against the permit's own text.
  - >-
    ONLY STATION 1PD00005001 CARRIES A PRINTED COORDINATE. Part II Item B gives DMS
    lat/long for the outfall alone; the upstream (801) and downstream (901) stations are
    identified only by named bridge crossings ("at the Ohio Street bridge",
    "at the Jaysville-St. John bridge"), with no coordinates on the permit's face. The
    Fact Sheet's Table 11 independently lists river miles for locations matching those
    bridge names (19.55 for "Ohio St.", 18.33 for "Jaysville-St. Johns Rd.") — cited as
    [reference] corroboration in sampling_stations, not as a second source of coordinates.
  - >-
    THE WATER TEMPERATURE MONITORING TYPE CHANGES AT THE PHASE-IN, and this was checked
    against 300 DPI renders of both table pages (see header) because it looked like it
    could be a text-extraction line-wrap. It is not: the Initial table's Sampling Type
    cell for 00010 reads "Continuous"; the Final table's reads "Daily Continuous Max" —
    three lines in the same cell, confirmed visually. No other cell in either table
    changed as a result of that check.
  - >-
    A FACT-SHEET-ONLY TYPOD STATION NUMBER: the Fact Sheet's summary-of-changes text
    twice refers to "upstream monitoring station 3PD00002801" where the permit's own
    Part I.B and Part II Item B consistently use 1PD00005801. Likely a copy-paste
    carryover from a different facility's fact sheet template. Recorded as printed in
    `fact_sheet.observations` — not corrected, and not present anywhere in the permit
    body itself.
  - >-
    THE FACT SHEET CONTRADICTS THE PERMIT BODY — AND ITS OWN TABLE — ON THE CAUSE OF THE
    DOWNSTREAM IMPAIRMENT. Fact Sheet sheet "Page 9 of 34" ("ASSESSMENT OF IMPACT ON
    RECEIVING WATERS"), summarizing the 2013 Biological Water Quality Monitoring and
    Assessment Report of the Stillwater River Basin: "The source of this degradation was
    the Greenville WWTP according to the report." The permit body, Part I.C.C (sheet 21),
    summarizing the SAME 2013 assessment: impairments in the Bridge Creek-Greenville
    Creek watershed assessment unit are "due to natural causes and sources," and, "based
    on the indication that the Greenville WWTP is not contributing," the permit does not
    require a WLA-achievement plan. The Fact Sheet's OWN Table 11 (sheet "Page 26 of 34")
    agrees with the permit body, not with its own narrative sentence: for the impaired
    downstream station (Jaysville-St. Johns Rd., river mile 18.33) it lists Cause as
    "Natural Conditions (Flow or Habitat)" and Source as "Natural Sources" — no mention
    of the WWTP. Both sides are transcribed faithfully elsewhere in this file
    (schedule_of_compliance.part_C_stillwater_tmdl_schedule.background and
    fact_sheet.impairment) but the disagreement between them was not previously flagged.

