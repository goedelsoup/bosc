    public_notice_date: '2023-07-12'
    comment_period_ends: '2023-08-11'
    river_mile_discharge: 19.35
    facility_history: Constructed 1936, last upgraded 2021.
    design_flow: {average_design_mgd: 3.5, peak_hydraulic_mgd: 6.0}
    bypass_trigger: >-
      "When influent flow rate exceeds 6.0 MGD, flow is diverted at the headworks to the
      equalization basins" — two basins, 90 ft diameter × 7.25 ft deep, 0.345 MG storage
      each; overflow past the basins bypasses all treatment except UV disinfection. See
      monitoring_stations.bypass_602.trigger_note above.
    pretreatment_program: Approved pretreatment program; 3 significant industrial users (2 categorical); average industrial flow 0.202 MGD.
    infiltration_inflow_rate_mgd:
      value: 0.202
      note: >-
        Sheet "Page 7 of 34": "Greenville WWTP has an estimated infiltration/inflow (I/I)
        rate of 0.202 MGD that does not cause known problems in the collection system."
        Printed identically to pretreatment_program's average industrial-user flow figure
        above (also 0.202 MGD, same sheet) — two different quantities that happen to
        share a printed value; recording both so neither reads as the other.
    receiving_water_use_designations: >-
      Agricultural Water Supply, Industrial Water Supply, Primary Contact Recreation
      throughout; aquatic-life designation varies by reach — Warmwater Habitat through
      Greenville and downstream to the Boyd Creek confluence, Exceptional Warmwater
      Habitat elsewhere; the reach from the Indiana line to the Stillwater confluence is
      an Ohio outstanding state water.
      Ohio EPA River Code 14-220, HUC 05080001-11-02, Ecoregion Eastern Corn Belt Plains.
    impairment: >-
      The Bridge Creek-Greenville Creek assessment unit is listed impaired for primary
      contact recreation (E. coli) on Ohio's 303(d) list; downstream is listed impaired
      for aquatic life. A 2013 basin survey attributed downstream partial attainment to
      habitat/flow degradation "according to the report", sourced to the Greenville
      WWTP. No nutrient-related impairment was found 20 miles downstream in that survey.
    wet_wla: '0.4 TUa, 1.62 TUc; acute WLA computed as 30 percent mortality in 100 percent effluent at a 1.39:1 dilution ratio (1Q10 1.83 cfs + 5.4 cfs WWTP flow, over 5.4 cfs).'
    wet_wla_arithmetic_note: >-
      The dilution-ratio arithmetic printed on sheet "Page 12 of 34" does not follow from
      its own inputs: "Downstream Dilution Ratio = (1Q10 + [WWTP flow rate]) / [WWTP flow
      rate] = (1.83 cfs + 5.4 cfs) / 5.4 cfs = 1.39." (1.83 + 5.4) / 5.4 = 1.339, not 1.39.
      Transcribed above in wet_wla as printed (1.39, carried through to "30 percent
      mortality...at a 1.39:1 dilution ratio" later on the same sheet); this note records
      that the printed quotient does not follow from the printed inputs.
    dmr_history_summary: >-
      9 effluent violations 2017-2022 (2 dissolved oxygen, 1 oil & grease, 3 total
      phosphorus, 3 TSS), "not caused by a known process error or upset condition." Zero
      SSOs reported 2017-2022. Bypass events: 2 (2018) / 5 (2019) / 3 (2020) / 1 (2021) /
      0 (2022).
    observations:
      duplicate_upstream_station_typo: >-
        The summary-of-changes text (sheet "Page 2 of 34") and the additional-monitoring
        section (sheet "Page 15 of 34") both print "upstream monitoring station
        3PD00002801" where the permit itself and the rest of the Fact Sheet consistently
