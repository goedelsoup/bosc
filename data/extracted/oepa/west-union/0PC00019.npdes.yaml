        district office for this facility (Adams County) — unlike the Mansfield precedent
        [reference], where the district office was left [open].
    sludge_586: {parameter: Sludge Fee Weight (51129), units: dry tons, frequency: 1/Year Total, month: December, applies_to: disposal in a solid waste landfill}
