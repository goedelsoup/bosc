      facility-independent numeric content worth recording:
    unauthorized_discharges:
      item: '11. Unauthorized Discharges (sheet 20-21)'
      note: >-
        Bypass not exceeding limitations is allowed only for essential maintenance to
        assure efficient operation; bypass causing an exceedance is otherwise prohibited
