permit:
  tag: '[verified]'
  confidence: high
  warnings:
  - >-
    THE RECEIVING WATER IS NAMED TWO DIFFERENT WAYS ON THE FACE OF THE SAME PDF. The
    authorization sentence (sheet 1), the Fact Sheet header, and Attachment I's location
    paragraph all say "Beasley Creek" (3 occurrences, no "Fork"). The Part II Item B
    sampling-station table (sheet 10) names the SAME water "Beasley Fork Creek" three times,
    at stations 001, 801 and 901 (3 occurrences, with "Fork"). This file transcribes each
    exactly as printed where it appears rather than harmonizing the name; see
    receiving_water_note and sampling_stations below.
  - >-
    THE FACILITY ADDRESS IS PRINTED TWO WAYS. The sheet-1 authorization sentence gives
    "6875 State Route 247, West Union, Ohio, Adams County" (no directional suffix, no ZIP).
    The Fact Sheet (bound into this same PDF) gives "6875 State Route 247 South, West
    Union, OH 45693" — adding "South" and the ZIP code. Same facility, same road; the
    document does not explain the "South" suffix. Transcribed as printed at each location.
  - >-
    THIS PERMIT CONTAINS NO PART I.C SCHEDULE OF COMPLIANCE. Unlike the Mansfield precedent
    (which carries a Toxicity Reduction Evaluation and a Municipal Pretreatment Schedule),
    Part I of this permit ends at Part I.B (the non-outfall monitoring tables, sheets 4-8)
    and Part II, "Other Requirements," begins directly on sheet 9. There is no whole
    effluent toxicity (WET) limit anywhere in this permit, no biomonitoring program item,
    no pretreatment schedule, and no numeric bypass-volume trigger — this is a materially
    smaller and simpler instrument than the Mansfield one. See no_schedule_of_compliance
    below for the explicit absence.
  - >-
    THE PDF HOLDS 33 PAGES; THE PERMIT'S OWN "Total Pages" READS 27. This reconciles
    cleanly and is not a defect: sheets 1-27 (PDF indices 0-26) are the permit itself
    (Parts I-III), each headed "Page N / 0PC00019*KD" — 27 pages, matching the printed
    count exactly. PDF indices 27-32 (6 more pages) are the bound-in Fact Sheet plus
    Attachments I and II; none of those 6 pages carries the permit's "Page N" header or is
    counted in "Total Pages: 27". See fact_sheet_and_attachments below.
  - >-
    ATTACHMENT II'S FOOTNOTES SKIP "b". The table cites footnote "a" (design flow) and
    footnote "c" (the Basis-code legend on the following page) but no footnote "b" appears
    anywhere on either page — a gap in the document's own lettering, not a transcription
    omission. Checked in both default and layout-mode extraction of both pages. The same
    design-flow note also carries a DIFFERENT marker in each table for the same fact: Part
    I.A marks it "*" (bound to the column header "Loading* kg/day", sheet 2; see
    effluent_limits_001.footnotes) while Attachment II marks the identical note "a" — one
    document, two footnote-lettering conventions for the same note.
  - >-
    FREE CYANIDE'S UNITS DISAGREE BY 1000× BETWEEN THE TWO EFFLUENT-LIMIT TABLES. Part I.A
    (sheet 3) prints "51173 - Cyanide, Free (Low-Level) - ug/l"; Attachment II (PDF idx 31)
    prints the same monitor-only parameter as "Cyanide, Free ... mg/l" — a milligram value,
    where this permit's own Part II Item I sets the free-cyanide PQL at 0.025 mg/L (sheet
    12). Neither table carries a numeric limit here (both monitor-only), so there is no live
    compliance conflict, but the unit disagreement is real and internal to this one
    committed document — re-checked in extraction_mode="layout" for both pages. See
    effluent_limits_001.limits.cyanide_free_low_level and effluent_limits_001.cross_check.

