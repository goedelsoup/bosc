  # ── Part I.B — the non-outfall monitoring stations (sheets 4-8) ────────────────────────
  monitoring_stations:
    citation: 'Permit 0PC00019*KD, sheets 4-8, Part I.B'
    tag: '[verified]'
    sso_300:
      parameter: Overflow Occurrence (74062), No./Month, 1/Month Total, all months
      note: >-
        The permit is explicit that the 1/Month frequency is a REPORTING frequency, not a
        monitoring one: "these overflows shall be monitored on each day when they
        discharge." Only SSOs that reach waters of the state — directly or through a storm
        sewer — are reported at this station; each location overflowing on a given day
        counts as one occurrence.
      annual_report: >-
        An annual SSO report covering ALL overflows in the collection system is due March
        31 for the prior calendar year, with locations numbered consecutively from 301,
        volumes in millions of gallons, and a narrative water-in-basement analysis.
      prohibition: >-
        Part II Item D itself (sheet 10) states a flat prohibition, distinct from the
        reporting/monitoring machinery around it: "All SSOs are prohibited." The station-300
        table's own Notes (sheet 4, footnote c) independently state the same thing: "All
        sanitary sewer overflows are prohibited." One of this instrument's few absolute
        conditions, not merely a reporting requirement.
      submission_district_office: >-
        Part II Item D.2(b) names where the hardcopy alternative to electronic submission
        goes: "you may submit one hardcopy of the report to Ohio EPA Southeast District
        Office and one copy to: Ohio EPA; Division of Surface Water; NPDES Permit Unit..."
