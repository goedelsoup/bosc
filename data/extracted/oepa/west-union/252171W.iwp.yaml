# Reviewed transcription of Ohio EPA's GRANT of a Level Two Isolated Wetland Permit for the
# Buck Canyon site, Sprigg Township, Adams County — Ohio EPA ID 252171W / DSW401252171W,
# issued 2026-06-08 under R.C. Chapter 6111.
#
# THE FIRST STATE ENVIRONMENTAL AUTHORIZATION IN THIS SITE'S RECORD, and it does two things the
# corpus could not do before: it gives 68 Yards, LLC a principal and a street address, and it
# states the project's purpose in the state's own words — "construct a light industrial park".
# Tags per CLAUDE.md.
