    note: >-
      ⚠️ THESE ARE **ISOLATED** WETLANDS AND ARE A SEPARATE ACCOUNT FROM THE FEDERAL FILL. The
      USACE NWP 39 verification authorizes 0.06 ac of two JURISDICTIONAL wetlands (E and G) plus
      1,893 linear feet of four streams. This permit authorizes 0.74 ac of seven ISOLATED wetlands
      (B, D, F, H, I, J, K) that are outside federal jurisdiction post-Sackett. The wetland ids do
      not overlap, which is consistent with one delineation split between two authorities.
      ⚠️ NEVER SUM THE TWO into a single "wetland impact" figure without saying which authority
      each half sits under.

  conditions:
    - Permit valid 5 years from issuance
    - Written notice to Ohio EPA on start and completion of site development and mitigation construction
    - A copy of the permit kept on site for the duration of project and mitigation construction
    - Inadvertent spills reported immediately to the Ohio EPA Spill Hotline (1-800-282-9378) and the §401 Manager
    - Unpermitted impacts to surface waters or their buffers reported within 24 hours
    - Pesticide application only under NPDES general permit OHG870003; may require an ODA applicator licence
    - Ohio EPA inspection access at reasonable times

