    email: 68YardsLLC@protonmail.com
    note: >-
      ⚠️ THE FIRST DOCUMENT TO GIVE 68 YARDS, LLC A PRINCIPAL AND AN ADDRESS. The corpus carried
      the name only from the USACE NWP 39 verification, with its affiliation to Buck Canyon
