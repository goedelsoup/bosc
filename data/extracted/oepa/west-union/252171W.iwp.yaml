  project_description:
    verbatim: Construct a light industrial park.
    tag: '[verified]'
    note: >-
      ⚠️ THE STATE'S OWN DESCRIPTION OF THE PROJECT, and it is NOT "data center". Adams County's
      government domain (amazon.adamscountyoh.gov) calls this an Amazon Web Services campus;
      Ohio EPA's granted permit calls it a light industrial park. Both are primary. The corpus
      records the discrepancy and does NOT resolve it — a generic land-use description on an
      environmental permit is ordinary practice and is not evidence of concealment, and it is
      equally not corroboration of the end use.

  watershed:
    verbatim: >-
      "The project is partially located in two watersheds: The project is located in the Cabin
      Creek - Ohio River Watershed (HUC 05090201-06). Crooked Creek has a designated aquatic life
      use of warmwater habitat (WWH), agricultural water supply (AWS), industrial water supply
      (IWS), and primary contact recreation (PCR) water."
    tag: '[verified]'
    note: >-
      ⚠️ CORROBORATES THE ROUTE-BLIND FINDING. The state places this project in the Cabin
      Creek-Ohio River watershed, not on Ohio Brush Creek — while `SiteProfile.nwis_sites` screens
      Ohio Brush Creek gage 03237500. A dilution screen on that gage answers a question about a
      different watershed. Recorded verbatim including the permit's own "partially located in two
      watersheds", which it does not enumerate.

  antidegradation:
    verbatim: >-
      "I have determined that a lowering of water quality in the Ohio Brush-Whiteoak watershed
      (HUC 05090201) as authorized by this permit is necessary."
    tag: '[verified]'
    note: >-
      The R.C. 6111 antidegradation determination — the state finding that the permitted
      water-quality loss is necessary. Note it names the HUC-8 (Ohio Brush-Whiteoak, 05090201)
      while the setting paragraph names the HUC-12 (05090201-06); they are nested, not conflicting.

