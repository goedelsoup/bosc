open_questions:
  - id: IWP-68YARDS-BUCKCANYON-LINK
    tag: '[open]'
    question: >-
      What joins 68 Yards, LLC (Chicago; this permit and the federal NWP 39 verification) to Buck
      Canyon Properties, LLC / Buck Canyon LLC and Derek Harmon (Flemingsburg KY; the USACE
      jurisdictional determination, the NPDES construction NOI and the parcel)? Four instruments,
      two entity families, one project — and no document in the corpus connects them. Ohio SOS is
      the obvious route and is retrieval-blocked (see the SOS registry epic); Illinois and Delaware
      registries are untried.
  - id: IWP-LIGHT-INDUSTRIAL-PARK
    tag: '[open]'
    question: >-
      Does any other state filing for this site describe it as something other than a "light
      industrial park"? The description matters because it is what the antidegradation
      determination was made against.
