  # ── Part II — other requirements of note (sheets 22-34) ─────────────────────────────────
  other_requirements_of_note:
    citation: 'Permit 2PD00018*RD, Part II, sheets 22-34'
    tag: '[verified]'
    operator_certification:
      item: 'A (sheet 22)'
      note: >-
        Class III professional operator of record for the treatment works, Class II for the
        collection system (see treatment_works_classification above for the full text). A
        backup operator one class lower may substitute for up to 30 consecutive days without
        notifying Ohio EPA; beyond 30 days requires the Director's written authorization for
        cause (military leave, long-term illness). Minimum weekday visits required whenever the
        plant is operating (Item A.4).
    staffed_days_exemption:
      item: 'C (sheet 23)'
      text: >-
        All parameters except flow "need not be monitored on days when the plant is not
        normally staffed (Saturdays, Sundays, and Holidays)" — report "AN" on those days.
    sso_reporting:
      item: 'D (sheets 23-25)'
      immediate_notification: >-
        Any SSO that "may imminently and substantially endanger human health" must be phoned to
        Ohio EPA (1-800-282-9378) and the local Board of Health within 24 hours, with a written
        follow-up report within 5 days covering timing, location, receiving water, estimated
        volume, cause, and remediation/mitigation steps with milestones.
      dmr_reporting: >-
        All SSOs reaching waters of the state (directly or via storm sewer) are reported on the
        DMR via station 300 (reporting code 74062).
      annual_report: >-
        Due by March 31 for the prior calendar year, covering ALL SSOs including those never
        reaching waters of the state: a location table (IDs numbered from 301), a date/volume
        table (may summarize overflows under ~1,000 gallons), and a water-in-basements (WIB)
        table with narrative analysis by location, frequency and cause. Ohio EPA NWDO gets a
        hardcopy, or one goes to Columbus, plus one electronically; adequate public notice of
        the report's availability is required (posted notices, newspaper, or bill insert).
    storm_water_compliance:
      item: 'J (sheet 26)'
      text: >-
        The permittee holds coverage under the industrial storm water general permit
        2GR00552*GG, effective 7/1/2022. Renewed coverage (or other compliance arrangement) is
        due no later than 90 days after the effective date of a renewed general permit.
    rcra_potw_by_rule:
      item: 'K (sheet 26)'
      text: >-
        POTWs accepting hazardous waste by truck/rail/pipeline are RCRA TSDFs under the 40 CFR
        270.60(c) "permit-by-rule": comply with the NPDES permit, obtain a RCRA ID and comply
        with manifest/reporting requirements, satisfy corrective action, and meet all
        pretreatment requirements.
    free_cyanide_method:
      item: 'P (sheet 26)'
      text: 'The permittee shall use ASTM D7237-10, OIA-1677-09, or ASTM D4282-02 for low-level free cyanide.'
    mercury_method:
      item: 'Q (sheets 26-27)'
      text: 'EPA Method 1631 for both influent and effluent low-level mercury monitoring.'
    orthophosphate_method:
      item: 'R (sheet 27)'
      text: 'Grab sample, filtered within 15 minutes with a 0.45 micron filter, analyzed within 48 hours.'
    outfall_signage:
      item: 'S (sheet 27)'
      text: >-
        Permanent stream-bank marker at every regulated outfall, bypass and CSO: permittee
        name, Ohio EPA permit number, outfall number, contact phone; lettering >= 2 inches, sign
        >= 2ft x 2ft, mounted >= 3ft above ground, unobstructed and kept clear of vegetation;
        submerged outfalls must say so; CSOs must warn of possible untreated sewage/bacteria.
    pretreatment_program:
      item: 'T (sheets 27-30)'
      program_approved: 1985-01-16, plus all subsequent modifications approved before this permit's effective date.
      requirements_index: >-
        Legal authority, funding, industrial user inventory (SIU notification within 30 days of
        determination), slug load control plan evaluation (existing SIUs within 1 year if never
        evaluated; new SIUs within 1 year of designation), local limits (waste load allocation
        table below), control mechanisms for SIUs, industrial compliance monitoring (annual SIU
        inspection minimum, repeat sampling within 30 days of a violation the POTW self-detects
        unless the user is made to repeat it), POTW priority-pollutant monitoring (annual,
        influent/effluent/sludge), enforcement (annual SNC publication by Jan 15), reporting
        (quarterly industrial-user violation report by the 15th of Jan/Apr/Jul/Oct; annual
        pretreatment report by Feb 15), record keeping (3 years minimum, extended through
        unresolved litigation), and program modification procedures (45 days to take effect
        unless deemed substantial).
      local_limits_wla_values: >-
        Waste load allocation values for evaluating local limits (Item T.5, sheet 28), for
        pollutants without a final table limit: Arsenic 107 ug/l, Cadmium 6.3 ug/l, Chromium
        (hexavalent) 11 ug/l, Chromium (total) 107 ug/l, Free Cyanide 5.2 ug/l, Lead 29 ug/l,
        Nickel 141 ug/l, Silver 1.3 ug/l, Zinc 333 ug/l, Selenium 5 ug/l. [verified] as printed;
        this file does not attempt to derive which fact-sheet criteria column each value was
        struck from.
    biomonitoring_program:
      item: 'U (sheets 29-31)'
      text: >-
        "As soon as possible but not later than three months after the effective date of this
        permit, the entity shall initiate an effluent biomonitoring program to determine the
        toxicity of the effluent from outfall 2PD00018002" — on or about 2024-09-01
        [inference]. SOP (or verification of submittal) due the same three months.
      testing: >-
        Twice-yearly chronic C. dubia and annual chronic fathead minnow (Pimephales promelas)
        tests on outfall 002 effluent; acute endpoints derived from the chronic results (per
        Section 2.H of the biomonitoring guidance); ambient/upstream control water collected
        concurrently at station 801. Per "Reporting and Testing Guidance for Biomonitoring",
        Ohio EPA, July 1998 or current revision.
      definitions: 'TUa = 100/LC50. TUc = 100/IC25 (or 100/sqrt(NOEC x LOEC) for C. dubia where more restrictive).'
    tmdl_reopener:
      item: 'V (sheet 32)'
      text: >-
        The permit may be modified or revoked-and-reissued to incorporate new or revised limits
        needed to comply with an approved TMDL under CWA Section 303(d).
    general_mercury_variance:
      item: 'W (sheets 32-34)'
      basis: 3745-1-38(H); a RENEWAL of an existing variance, not a new grant.
      the_two_mercury_numbers: >-
        This permit carries TWO distinct mercury thresholds that are easy to conflate but test
        different things: (1) the enforceable variance-based limit in Part I.A — 1700 ng/l
        daily maximum, 2.7 ng/l 30-day average (transcribed under effluent_limits_002 above);
        and (2) a separate annual-average CEILING of 12 ng/l in this Item W — if the permittee's
        trailing-12-month annual average mercury concentration ever exceeds 12 ng/l, Item W.2
        requires notice to Ohio EPA NWDO within 30 days, then EITHER a new individual variance
        application within 6 months OR a permit-modification request for a compliance schedule
        within 6 months; failing either, a monthly water-quality-based limit of 1.3 ng/l (the
        UNVARIED WQBEL) applies at outfall 002 beginning 6 months after the exceedance.
      pmp_requirement: >-
        Continue a Pollutant Minimization Program (PMP): control strategy to locate/reduce
        mercury sources, periodic source/treatment-system monitoring, annual reporting. Annual
        PMP report due by July 15 each year to Ohio EPA's NPDES Permit Unit, covering monitoring
        results, potential sources, actions taken, and control-strategy updates.
      certification_at_end_of_study: >-
        Upon completing the plan-of-study actions OR upon submitting the permit renewal
        application (whichever first), the permittee certifies to Ohio EPA's NWDO whether the
        WQBEL has been achieved and can be maintained, with 12 months of mercury data, source
        documentation, and a determination of the lowest reliably achievable concentration
        attached. (See permit.warnings[1] for this item's own internal "BB" cross-reference
        defect.)
    mercury_variance_reopener:
      item: 'X (sheet 34)'
      text: 'Ohio EPA may reopen and modify the permit at any time based on WQS revisions to the mercury variance granted under Item W.'
    mercury_variance_renewal:
      item: 'Y (sheet 34)'
      text: >-
        Renewal requires the Item W.1.h certification and supporting data, a PMP status report,
        a listing of PMP strategies to continue, and a request for renewal. (Also carries the
        "BB" cross-reference defect — see permit.warnings[1].)
    maumee_tmdl_phosphorus:
      item: 'Z (sheet 34)'
      text: >-
        "The Maumee Watershed Nutrient Total Maximum Daily Load (TMDL) Report was approved in
        September 2023. The TMDL assigned an individual wasteload allocation to the Bryan WWTP
        of 770 kg of total phosphorus for the critical season (March through July)." Compliance
        is regulated through the Maumee Watershed Total Phosphorus NPDES General Permit, under
        which Bryan WWTP holds coverage — not through this permit's own numeric phosphorus
        limits (which are the design-based 1.5/1.0 mg/l transcribed under effluent_limits_002).
        770 kg is a SEASONAL total; this file does not attempt to convert the daily/monthly
        loadings elsewhere in this document into a season total for comparison to it.
    other_items_present:
      note: >-
        Transcribed as an index only, so a later reader knows what is in the instrument without
        re-walking it: Item E (maintain treatment works per ORC 6111.01), F (composite sample
        definition), G (grab sample definition), H (multiple grab sample definition — >= 3 grabs
        at >= 3-hour intervals, critical value reported), I (85% removal requirement for CBOD5
        and TSS, cross-referencing Part III Item 1), L-N-O (sludge disposal/composite-sampling/
        annual-report general conditions, cross-referenced throughout the sludge stations
        above).

