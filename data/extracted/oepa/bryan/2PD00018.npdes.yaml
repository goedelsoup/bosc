permit:
  tag: '[verified]'
  confidence: high
  warnings:
  - >-
    THE PDF IS 86 PAGES; THE PERMIT'S OWN "TOTAL PAGES" SAYS 47 — and both are correct,
    for different documents. The issued instrument (Parts I, II, III) is PDF pages 0-46
    (printed sheets 1-47), ending at sheet 47 with Part III Item 32. PDF pages 47-85 are a
    separately, independently paginated document bound into the same file: "Fact Sheet for
    NPDES Permit Renewal, City of Bryan WWTP, 2024", printed "Page 1 of 39" through "Page 39
    of 39". 47 + 39 = 86. A reader who counts PDF pages without reading the printed sheet
    numbers would wrongly conclude 39 pages are missing or padded; neither is true. See the
    fact_sheet: block below for what is on those 39 pages — it is transcribed separately from
    this permit: block because a NPDES fact sheet is Ohio EPA's rationale document, not an
    enforceable term of the permit, even though it is physically part of this same sha256.
  - >-
    PART II'S OWN CROSS-REFERENCES NAME A SECTION LETTER THAT DOES NOT EXIST. Part II runs
    items A through Z with no repeats or gaps (confirmed by walking the whole document); the
    general mercury variance is lettered "W". Yet Part II, Item W.1.h (sheet 33) reads "...as
    required in Part II, Item BB.1.d. of this permit..." and Part II, Item Y.1 (sheet 34) reads
    "...the certification described under Part II, Item W.1.h., and all information required
    under Part II, Item BB.1.h.i. through Part II, Item W.1.h.iii" — mixing "BB" and "W" in the
    SAME sentence for what is plainly the same section. "BB" is transcribed exactly as printed
    in both places; it is almost certainly a drafting leftover from an earlier double-lettered
    scheme (AA/BB) that was renumbered to single letters (A-Z) without updating these two
    internal citations. It does not change what is required — everything named belongs to Item
    W by content — but a party citing the permit's own text to locate "Item BB" would find
    nothing.
  - >-
    PART I.C DISAGREES WITH ITSELF ON THE PRETREATMENT SCHEDULE'S DUE DATE. The narrative at
    Part I.C.1.a (sheet 20) reads "...shall be submitted for acceptance to Ohio EPA...as soon
    as possible, but no later than 18 months after the permit effective date (Event Code
    52599)". The Milestone Summary Report table, printed on the SAME sheet — interleaved
    mid-paragraph, inside item "iii. Domestic/background concentrations..." — gives the
    identical Event Code 52599 a due date of "12 months after the permit effective date."
    Both are transcribed verbatim below under schedule_of_compliance. Resolved against the
    2024-06-01 effective date, 18 months ≈ 2025-12-01 and 12 months ≈ 2025-06-01
    [inference]; the permit prints no calendar date for either. The bound Fact Sheet's own
    "OTHER REQUIREMENTS" section (page 16 of 39) independently states "An 18-month compliance
    schedule is proposed" — so two of the three appearances of this deadline in the same PDF
    say 18 months and one says 12. This file does not pick a winner.
  - >-
    ONE NUMERIC LOADING FIGURE DIFFERS BETWEEN THE ISSUED PERMIT AND ITS OWN BOUND FACT
    SHEET. The permit's Part I.A.1 table (sheet 3) prints the copper loading limits at outfall
    002 as 0.51 kg/day (daily maximum) / 0.30 kg/day (30-day average) — confirmed by directly
    inspecting the raw text-layer line "ug/l 44 -  -  26 0.51 -  0.30 1/Month 24hr". The Fact
    Sheet's Table 14 (page 36 of 39, "Final Effluent Limits for Outfall 002") prints the SAME
    limit as 0.52 / 0.31. The concentration limits agree exactly in both documents (44 µg/l
    maximum, 26 µg/l 30-day average); only the derived loading cells differ, by 0.01 kg/day in
    each case — almost certainly a rounding artifact of converting µg/l to kg/day against the
    3.1 MGD design flow with a slightly different rounding step between the two documents. The
    ISSUED PERMIT's printed table (0.51/0.30) is what is transcribed under effluent_limits_002
    below, since that table — not the fact sheet — is the enforceable instrument; the fact
    sheet's 0.52/0.31 is recorded here rather than silently reconciled.
  - >-
    THE AUTHORIZATION SENTENCE AND THE FACT SHEET PRINT SLIGHTLY DIFFERENT RIVER MILES for
    the same discharge point: the permit's sheet-1 authorization sentence reads "River Mile
    11.0"; the Fact Sheet's "Location of Discharge" section (page 7 of 39) reads "RM 11.01".
    11.0 is plausibly a one-decimal rounding of 11.01, not a contradiction, but the two
    documents do not print an identical figure and this file reproduces both.
  - >-
    BARIUM, STRONTIUM AND METHYL BROMIDE CARRY NO LIMIT OR MONITORING REQUIREMENT ANYWHERE
    IN THIS PERMIT — not at outfall 002 (Part I.A.1) and not at influent station 601 (Part
    I.B.8) — despite barium having been a NUMERIC LIMIT and strontium/methyl bromide having
    been MONITORED under whatever permit governed the 2018-2023 self-monitoring period the
    bound Fact Sheet's Table 6 reports on (barium "Current Limits": 220 µg/l 30-day / 2060
    µg/l daily). The Fact Sheet's own "SUMMARY OF PERMIT CONDITIONS" (page 2 of 39) confirms
    this was a deliberate removal ("reasonable potential was not observed"), not an omission
    in this transcription. Flagged because the plant's own violation history (effluent
    violations table below) shows barium exceedances as recently as 2022 and 2023, under a
    limit this permit no longer carries.
  - >-
    [open] WHETHER THE OUTFALL-002 CERIODAPHNIA DUBIA TOXICITY LIMITS ARE NEW TO THIS PERMIT
    CYCLE IS NOT SETTLED BY THIS CORPUS. The Fact Sheet's "SUMMARY OF PERMIT CONDITIONS" (page
    2 of 39) frames 1.0 TUa / 1.0 TUc Ceriodaphnia dubia limits as newly "proposed", and its
    reasonable-potential analysis (Attachment 1, page 38 of 39) computes a chronic PEQ of 1.65
    TUc against a 1.01 TUc WLA to justify them. But the same Fact Sheet's self-monitoring Table
    6 (page 23-24 of 39, covering July 2018-August 2023) ALREADY lists a "Current Limits"
    30-day value of 1.0 TUc for a "June and Aug" Ceriodaphnia dubia chronic test (n=12) — the
    same frequency transcribed under effluent_limits_002 below — alongside a SEPARATE
    "Quarterly" monitor-only listing for the same species/endpoint (n=1). Whether the June/Aug
    numeric limit is a genuine continuation from an earlier permit iteration that ran alongside
    a since-dropped quarterly monitor-only regime, or whether "Current Limits" in that table
    means something else entirely, cannot be resolved without the prior permit (2PD00018, the
    revision before *RD), which is not committed in this corpus.

