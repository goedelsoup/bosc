# City of Bryan WWTP — NPDES permit 2PD00018*RD (application OH0020532), issued
# 2024-05-07 and effective 2024-06-01.
#
# Hand-read from the committed PDF's embedded text layer, not machine-extracted. This
# document is digitally generated (producer: Microsoft: Print To PDF; no scan, no OCR),
# so the text layer is the instrument's own bytes; every figure below is transcribed with
# its printed sheet cited on the block. Nothing is derived, rounded or inferred unless the
# block says so.
#
# NO page was rasterized or sent to a vision model at any point. This file carries no
# render receipt (no doc_id / dpi / pages_read). See watermark.models.TranscribedExtraction
# — a receipt is all-or-nothing, and this extraction is a pure text-layer transcription.
#
# ⚠️ THE COMMITTED PDF IS 86 PAGES, NOT 47. The issued permit itself (Parts I, II, III) runs
# PDF pages 0-46 (printed sheets 1-47) and its own sheet 1 prints "Total Pages: 47" — that
# figure is correct for the instrument. PDF pages 47-85 are a second, separately-paginated
# document — "Fact Sheet for NPDES Permit Renewal, City of Bryan WWTP, 2024", 39 pages,
# printed "Page 1 of 39" through "Page 39 of 39" — bound into the SAME PDF immediately after
# the signed permit. 47 + 39 = 86. Unlike the mansfield precedent (2PE00001), where the fact
# sheet was NOT committed at all, Bryan's fact sheet IS bound in and IS part of this sha256.
# See permit.warnings[0] and the top-level fact_sheet: block below, which is kept SEPARATE
# from permit: because the Fact Sheet is a rationale/support document, not an enforceable
# term of the permit — citations below distinguish "Permit ... sheet N" from "Fact Sheet,
# page N of 39" throughout.
#
# The record -> document join (watermark.site.records._source_ref) reads a TOP-LEVEL
# `source_path`, so the primary instrument is named there as well as in meta.sources.
