# WHAT THIS FILE IS — read this before quoting the permit number.
#
# The Ohio EPA DAM slot `permits/doc/2PD00008.pdf` does NOT serve the original 2024 *UD renewal.
# It serves the LATER modification package: a 2025-11-07 transmittal letter from Director John
# Logue, the modified permit as issued (2PD00008*VD, effective 2026-02-01), and — from 0-based
# page 44 — the modification's own 8-page fact sheet (Public Notice 216133). 52 pages total.
# The original *UD issuance is therefore NOT a byte we hold; its term is recorded in
# 2PD00008.fs.npdes.yaml (`permit_term:`) from the Ohio EPA variance list that states it.
#
# The `permit:` block is the pipeline's read of the first six pages. The header fields were
# CORRECTED on review from the *VD fact sheet inside this same PDF (p. 45), which prints the
# public-notice fields the six-page window could not see; the extractor's three warnings about
# them are superseded and are preserved below as `superseded_warnings` rather than deleted.
