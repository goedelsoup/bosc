# --- reviewed augmentation (issue 1460) -------------------------------------------------------
# Fields the six-page text-primary read does not reach. Every value is transcribed from the page
# named in its own `page` key (1-based printed sheet, matching the "Page N of 33" running head).

review:
  issue: 1460
  reviewed_on: '2026-07-31'
  method: >-
    Verbatim transcription from the PDF's embedded text layer (pypdf), page by page. No figure is
    derived, rounded or carried over from any other document except where a block says so
    explicitly and names the other instrument.
  zip_code_discrepancy: >-
    This fact sheet prints the applicant/facility ZIP as 45804 on its cover page; the issued
    permit package (data/documents/oepa/findlay/2PD00008.pdf, cover letter) and the *VD public
    notice (2PD00008.1abaf306.pdf) both print 45840. Both are preserved as printed in their
    respective records; neither is "corrected". (45840 is Findlay's; 45804 is a Lima ZIP.)
  effective_dates_are_not_in_this_document: >-
    Neither the *UD renewal's effective date nor its expiration date is printed anywhere in this
    fact sheet or in the permit PDF the Ohio EPA DAM now serves at the `doc/2PD00008.pdf` slot
    (that slot carries the LATER *VD modification package). They are recorded on the
    `permit_term:` block below from a THIRD Ohio EPA instrument that states them outright — the
    January 2026 statewide variance list — and are cited to it, not to this fact sheet.

permit_term:
  permit_no: 2PD00008*UD
  effective: '2024-11-01'
  expires: '2029-10-31'
  outfall: '001'
  citation: >-
