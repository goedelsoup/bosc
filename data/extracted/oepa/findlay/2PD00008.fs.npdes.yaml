acute_dilution:
  page: 13
  formula: (1Q10 + WWTP flow rate) / WWTP flow rate
  computed_as: (0.17 cfs + 23.2 cfs) / 23.2 cfs
  ratio: 1.0
  acute_wla: 30 percent mortality in 100 percent effluent
  note: >-
    A dilution ratio of 1.0 means the receiving water contributes essentially no dilution at
    design flow: below the outfall the Blanchard River at low flow IS the effluent. The fact
    sheet adds that below 3.3-to-1, "the permittee may be required to investigate and remediate
    toxicity" in the 0.3-1.0 TUa range.

mercury_variance:
  pages: [15, 16]
  first_granted: '2010'   # "The Findlay WPCC permit was modified in 2010 to include a mercury variance"
  renewed_in_this_action: true
  authority: OAC 3745-1-38(H)
  wqbel_ng_l: 1.3                       # the water-quality-based limit the variance departs from
  variance_limit_monthly_avg_ng_l: 3.3  # Table 14 basis "VAR" (OAC 3745-1-38(J))
  variance_limit_daily_max_ng_l: 1700
  annual_average_condition_ng_l: 12     # variance condition: annual average <= 12 ng/L
  observed_reduction_ng_l:
    at_variance_issue: 8.5
    current: 2.2
  modified_allowable_ambient_concentration_ng_l: 3.29
  maac_citation: >-
    Ohio EPA, "January 2026 List of Variances"
    (data/documents/oepa/Jan_2026_List_of_Variances.pdf, p. 2) — Findlay WPCF, outfall 001,
    Blanchard River, Mercury, MAAC 3.29 ng/L.
  conditions:
  - variance-based monthly average effluent limit of 3.3 ng/L
  - reasonable progress toward the mercury WQBEL
  - low-level mercury monitoring of plant influent and effluent
  - annual average mercury effluent concentration <= 12 ng/L
  - continued Pollutant Minimization Program (PMP)
  note: >-
    The MAAC (3.29 ng/L, an in-stream ambient concentration) and the variance-based effluent
    limit (3.3 ng/L) are DIFFERENT quantities that happen to coincide here — which is what a
    1.0 acute dilution ratio implies: with no dilution available, the allowed ambient
    concentration and the allowed effluent concentration converge.

