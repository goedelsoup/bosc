  summary: On April 4, 2019, Ohio EPA Division of Surface Water conducted a Compliance
    Evaluation Inspection (CEI) of the City of Lima Wastewater Treatment Plant. All
    major units were in service and the final effluent to the Ottawa River was clear,
    colorless, and without noticeable odor. The inspection resulted in no finding
    of significant noncompliance, with one advisory recommendation to survey storm
    water outfalls, catch basins, and downspouts to determine storm water sources.
