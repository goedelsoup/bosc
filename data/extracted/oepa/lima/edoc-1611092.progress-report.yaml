  summary: This is the semiannual compliance progress report filed by the City of Lima, Ohio under the
    Consent Decree (Case 314-CV-02551-JZ) covering the period January 1 – June 30, 2021. Lima reports
    no outstanding deadlines or noncompliance for the period, with several capital projects either completed
    (Headworks, SEP, Phase 2 sewer rehab) or ongoing (CMOM Plan, Simmon's Field CSO EQ Basin), and Phase
    1 sewer rehab halted in litigation but out for rebid. The report inventories 65 SSO and 7 CSO overflow
    events across numerous system locations, 3 Water-in-Basement events, and no NPDES permit exceedances.
  note: 'SSO/CSO overflow totals for period: 65 SSO events, 7 CSO events (YTD totals as reported in the
    table). Table header notes "Report Updated on 7/3/2020" which appears to be a carry-over template
    error; the reporting period is 1/1/2021–6/30/2021. Duration and volume data are not provided per-event
    in the table; only frequency (count of overflow events) is listed. CMOM section reports 20,722.77
    linear feet (3.92 miles, 3.9% of SSS) cleaned; 22,837 linear feet CCTV inspected (4.33 miles, 4.3%
    of SSS); 201 manholes inspected; 3 manholes rehabilitated; 2 new manholes installed; 12 point repairs
    on gravity sewer mains. case_no NORMALIZED FOR THE JOIN. This report''s text layer renders the citation
    as "CASE: 314-CV-02551-JZ Doc #5 Filed: 01/13/15" — the colon is missing from "3:14", and the trailing
    "Doc #5 Filed: 01/13/15" is a filing inside the case rather than the case. Every other document in
    this chain prints 3:14-CV-02551-JZ, so the colon is an OCR drop, not a different case. The field carries
    the canonical number so this row joins edoc-412983.order.yaml; the printed form is preserved here
    rather than discarded.'
