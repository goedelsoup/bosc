  projects:
  - name: Lima Wastewater Treatment Headworks Project
    status: Complete. Lima has optimized plant performance during peak wet weather.
    next_period: null
  - name: CMOM Plan
    status: Lima continues to execute the approved plan.
    next_period: Further details to be provided in the January 1, 2022 reporting period.
  - name: Asset Management — Phase 1 High Street/Jameson Ave. Sewer Rehabilitation Project
    status: Progress has halted. Project is still in litigation, but is out for rebid to remove incorrectly
      installed SPR lining and reline using geopolymer technology.
    next_period: Project will be awarded and commenced in the coming six months.
  - name: Asset Management — Phase 2 Collett/Delphos/Grand/Woodward Sewer Rehabilitation Project
    status: 'Completed. Total project encompassed: SPR – 2062 linear feet; Geopolymer – 508 linear feet;
      9 manholes rehabilitated (5 with existing lining received new covers/frames and geopolymer in transition
      areas; 4 without existing lining received full geopolymer rehab and new covers/frames).'
    next_period: null
  - name: Supplemental Environmental Project (SEP)
    status: Complete.
    next_period: Lima will continue annual maintenance of the project.
  - name: Simmon's Field CSO EQ Basin
    status: Basin is in full operation.
    next_period: Lima will work on optimizing use of the basin in conjunction with the three underground
      structures over the next six months. Lima will install rain gauges throughout the city to collect
      data and prepare for updating the hydraulic study of the collection system.
