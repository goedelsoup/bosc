  summary: The City of Lima's Director of Utilities, Michael H. Caprella, submitted
    to Ohio EPA Northwest District Office the annual update to Lima's Control Strategy
    for Dissolved Hexavalent Chromium, as required by NPDES Permit 2PE00000*ND, Part
    I, C – Schedule of Compliance, B,3. The attached progress report covers monitoring
    results from June 2021 through June 2022 for Outfall 001 and numerous industrial
    pretreatment sources, all of which were below detectable limits for hexavalent
    chromium. No further control strategy updates were needed as the POTW is meeting
    its permit limits and no known sources of hexavalent chromium have been identified.
  note: Document is a compliance correspondence letter (not a DFFO or consent decree)
