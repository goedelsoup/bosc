  summary: On December 5, 2017, Ohio EPA representatives Andrew Gall and Peggy Christie
    conducted a Biosolids Generator Inspection of the City of Lima WWTP, evaluating
    compliance with Ohio's Sewage Sludge Rules (OAC Chapter 3745-40). Sewage sludge
    is treated via anaerobic digestion and the N-Viro Process to produce EQ biosolids,
    which are managed by Lima Compost/Wright Mulch through land application and blending
    into a topsoil product. Overall, at the time of the inspection, the City was meeting
    the applicable requirements of Ohio's Sewage Sludge Rules.
