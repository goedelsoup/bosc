  summary: This July 11, 2016 Ohio EPA correspondence from the Northwest District Office responds to the
    City of Lima's June 15, 2016 reply to a June 1, 2016 Notice of Violation regarding a Sodium Hypochlorite
    Incident at the Lima WWTP. The letter identifies two required revisions to the facility's SOP for
    filling the sodium hypochlorite tank and directs the City to submit a revised SOP within 14 days to
    achieve partial resolution of the NOV. No civil penalty is assessed at this time, but non-compliance
    may result in administrative or civil penalties under ORC Chapter 6111.07.
