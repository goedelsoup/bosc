  summary: A Reconnaissance Inspection was conducted on July 13, 2016 at the City
    of Lima's WWTP to observe progress on the new headworks construction project.
    All components but two of the four primary clarifiers are nearly complete, and
    effluent in the final clarifiers was clear, colorless, and odorless. The compliance
    data review (9/1/2015–6/1/2016) identified 2 effluent limit violations, 15 code
    violations, and 57 reported SSO events; however, significant non-compliance was
    not indicated on the form.
