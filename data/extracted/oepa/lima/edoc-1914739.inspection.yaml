  summary: On July 13, 2016, Ohio EPA conducted a Reconnaissance Inspection at the
    City of Lima's WWTP to observe progress on the new headworks construction project,
    finding all components nearly complete except for two of the four primary clarifiers.
    The effluent in the final clarifiers was clear, colorless, and had no noticeable
    odor. Compliance data for the period 9/1/2015–6/1/2016 recorded 2 permit effluent
    limit violations, 15 code violations, and 57 reported SSO events; significant
