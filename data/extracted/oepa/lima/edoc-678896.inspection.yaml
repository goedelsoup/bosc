  summary: Ohio EPA conducted a reconnaissance inspection of the Lima WWTP on July 25, 2017, following
    a lightning strike and power outage on July 22, 2017. The strike damaged the main switchgear, causing
    loss of pumping capacity, overflow of final clarifiers and aeration tanks, and flooding of the plant
    with substantial damage. At the time of the inspection, power had been partially restored and temporary
    generators were in use, with final effluent to the Ottawa River appearing clear and odor-free. Compliance
    data for the period 3/1/2017–7/1/2017 showed zero effluent limit violations but 10 code events and
    68 reported SSO events.
