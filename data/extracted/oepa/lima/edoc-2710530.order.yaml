  summary: The City of Lima, Ohio, through its Director of Utilities, wrote to U.S. EPA Region V and Ohio
    EPA on May 30, 2019, requesting a one-year extension of the Nitrification Towers sampling period under
    Appendix C of the applicable Consent Decree — from August 1, 2019 through July 31, 2020 — because
    the original July 2018–July 2019 period produced insufficient wet-weather sampling events to evaluate
    tower performance. The letter details the operational complications (bearing failure, seeding issues,
    sewer detention problems, flow-meter uncertainties, and limited peak wet-weather events) that prevented
    adequate data collection, and provides effluent quality data from the four peak wet-weather tests
    conducted between February and May 2019.
  note: 'The City''s 2019-05-30 letter REQUESTS a one-year extension of the Appendix C nitrification-tower
    sampling period. A request does not modify or extend the Consent Decree; USEPA/OEPA granted it on
    2019-06-20 (per progress report edoc-1104344). `supersedes` is null: the decree stayed in force throughout.'
