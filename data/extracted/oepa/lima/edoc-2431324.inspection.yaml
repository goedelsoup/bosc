    number: '1'
    deadline: null
  - kind: finding
    text: Facility plans to develop a biosolids master plan to prepare for biosolids
      treatment upgrades. Master plan will consider new biosolids treatment units
      and return to exceptional quality biosolids.
    number: '2'
    deadline: null
  - kind: recommendation
    text: 'When bulk exceptional quality biosolids are applied to the land, it is
      recommended the following records are retained: (a) Records showing that bulk
      EQ biosolids were not stored ≥90 days at the beneficial use site. (b) Forecast/actual
      precipitation data. (c) A description detailing how the agronomic rate is met
      at each beneficial use site, including how the beneficial use application equipment
      is calibrated. (d) The date and quantity used.'
    number: '1'
    deadline: null
  summary: On June 13, 2023, Ohio EPA Northwest District Office staff conducted an
    NPDES Biosolids compliance inspection of Lima WWTP. The inspection found that
    as of January 2023 the facility is no longer generating exceptional quality biosolids
    and is instead sending all biosolids to landfill, with plans to develop a biosolids
    master plan for future upgrades. The inspection resulted in a finding of no significant
    non-compliance, and one advisory recommendation regarding recordkeeping requirements
    for when bulk EQ biosolids are land-applied in the future.
