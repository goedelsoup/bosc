  period_end: '2017-12-31'
  deadlines_status: None noted.
  noncompliance_reasons: None noted for deadlines. A direct lightning strike to the
    main electrical switch gear equipment on July 22, 2017 caused complete loss of
    power, resulting in substantial flooding throughout the plant and significant
    equipment loss, which is documented in the discharge/contacts sections.
  projects:
  - name: Lima Wastewater Treatment Headworks Project
    status: Commenced construction on July 1, 2015. Building and tank construction
      is complete.
    next_period: Develop implementation strategy for seeding nitrification towers
      during dry weather to develop biomass suitable for wet weather treatment; develop
      implementation strategy for employing primary tank 5-7, effluent pumping, and
      towers to treat wet weather flows; develop PLC programming for seeding the nitrification
      tower and for control of wet weather treatment system; implement dry weather
      seeding strategy for towers and collect data.
  - name: CMOM Plan Development
    status: Lima submitted the revised plan to USEPA on 5/26/17. Currently awaiting
      final approval.
    next_period: null
  - name: Asset Management
    status: Final design and contract documents were completed for the Phase 1 High
      Street/Jameson Ave Sewer Rehabilitation Project. A PTI application was submitted
      to OEPA on October 18, 2017.
    next_period: Bidding and award of this project followed by commencement of construction.
  - name: Supplemental Environmental Project (SEP)
    status: Project is complete. USEPA requests Lima to submit a Revised SEP Completion
      Report by January 31, 2018.
    next_period: Submit Revised SEP Completion Report by January 31, 2018.
  - name: Simmon's Field CSO EQ Basin
    status: City is under contract with Stantec for engineering. A PTI application
      was submitted to OEPA on October 16, 2017. Project was bid on November 11-22,
      2017. Bids were opened on December 15, 2017. Lima received four bids, which
      are currently under review.
    next_period: Bid award and commencement of construction.
  agency_contacts:
  - July 18, 2017 --- Lima submitted a response letter to OEPA concerning the 'AD'
    values submitted on the June DMR for overflow volumes at Stations 002 and 003.
  - July 25, 2017 --- OEPA conducted an inspection at Lima's WWTP to evaluate the
    facility following a lightning strike and subsequent power outage that occurred
    on July 22, 2017.
  - July 26, 2017 --- Lima submitted a SSO 5-Day Follow-up Report to OEPA concerning
    the loss of power at the WWTP due to the lightning strike on July 22, 2017.
  - July 31, 2017 --- Lima submitted a letter to USEPA concerning the loss of power
    at the WWTP due to the lightning strike on July 22, 2017.
  - August 16, 2017 --- Lima received a report from OEPA relative to the inspection
    of the WWTP on July 25, 2017.
  - August 7, 2017 --- Lima submitted a force majeure event letter to USEPA concerning
    the loss of power at the WWTP due to the lightning strike on July 22, 2017.
  - August 28, 2017 --- Lima submitted a letter to OEPA concerning the codes reported
    on the July DMR for water temperature, dissolved oxygen, overflow volume and E.
    coli.
  - November 29, 2017 --- Lima received a letter from USEPA concerning the 3-day Consent
    Decree Monitoring Inspection conducted on June 19-20-21, 2017.
  - December 5, 2017 --- OEPA conducted a NPDES compliance evaluation inspection at
    Lima's WWTP.
  - December 29, 2017 --- Lima received a letter from OEPA detailing the results of
    the NPDES compliance inspection conducted on December 5, 2017.
  permit_exceedances:
  - July 7, 2017 --- Lima recorded 'AD' values for overflow volume at Stations 002
    and 003. The sensors were in the process of being replaced and reprogrammed.
  - July 10, 2017 --- Lima recorded 'AD' values for overflow volume at Stations 004,
    005 and 006. The sensors were in the process of being replaced and reprogrammed.
  - July 21, 2017 --- Lima recorded 'AB' values for water temperature and dissolved
    oxygen. This was directly related to the loss of power due to a lightning strike
    at the WWTP.
  - July 24, 2017 --- Lima recorded an 'AB' value for dissolved oxygen and an 'AK'
    value for E. coli. This was directly related to the loss of power due to a lightning
    strike at the WWTP.
