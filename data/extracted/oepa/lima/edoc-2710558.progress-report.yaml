  summary: This is the semiannual Consent Decree Progress Report for the City of Lima,
    Ohio covering the period July 1, 2017 through December 31, 2017, filed January
    25, 2018 under Case 3:14-CV-02551-JZ. No consent decree deadlines were missed
    during the period; however, a lightning strike on July 22, 2017 caused a complete
    power loss at the WWTP, resulting in four NPDES permit exceedances, one SSO requiring
    a 5-day follow-up report, and substantial plant damage. The attached overflow
    totals report documents 142 SSO events and 28 CSO events across 38+ locations
    during the reporting period, with five named capital/compliance projects in various
    stages of progress.
  note: 'Attachment: SSO & CSO Overflow Totals July 1 – December 31, 2017. Total SSO
    overflow count = 142; total CSO overflow count = 28. Total number of reports =
    18. Report updated 1/5/2018. Signed by Michel N. Carea, Director of Utilities,
    City of Lima, Ohio. CMOM section reports 57,662 linear feet (10.92 miles, 11%
    of SSS) of sewer cleaned; 32,992 linear feet CCTV (6.25 miles, 6% of SSS), 348
    manholes inspected; 12 manholes rehabilitated; 2 new manholes installed. 1 SSO
    required a 5-Day Follow-up Report to OEPA in reporting period.'
