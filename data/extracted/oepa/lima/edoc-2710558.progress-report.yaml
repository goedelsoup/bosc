  confidence: high
  warnings:
  - Clause (c) references 'July 22, 2018' for the lightning strike but context and
    all other references confirm this should be July 22, 2017 — likely a typo in the
    original document.
  - Overflow frequency counts in the attachment are event counts per location for
    the period, not individual dated events; duration and volume are not provided
    per location in the attachment.
  - Some Annual Report entries in the attachment have no EPA ID# (marked with asterisks
    in original); these are noted in discharge event records.
  - OCR layer is unreliable; all figures verified against image scan.
