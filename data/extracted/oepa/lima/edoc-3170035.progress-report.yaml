  deadlines_status: (1) June 2, 2017 — USEPA required Lima to submit a revised CMOM
    plan (modifications requested in letter received March 30, 2017). Lima submitted
    the revised plan on May 26, 2017 — MET EARLY. (2) July 2, 2017 — USEPA required
    Lima to submit an updated CSOOP (modifications requested in letter received May
    3, 2017). Lima submitted a revised CSOOP on June 30, 2017 — MET EARLY.
  noncompliance_reasons: None noted.
  projects:
  - name: Lima Wastewater Treatment Headworks Project
    status: 'Construction commenced July 1, 2015. Completed: All Bar Screens (4),
      All Aerated Grit Tanks (4) placed in service; All Primary tanks (7) can be placed
      in service as needed; All Secondary Effluent pumps placed in service; Disinfection
      process completed and placed in service 5-1-17; Chlorine Contact Tank Construction
      completed; Primary Scum Screen placed in service; Drainage Pump Station placed
      in service; All miscellaneous valves and gates replaced/installed; Site paving
      completed; Replacement of existing plant PLCs complete, programming partially
      complete.'
    next_period: PLC programming and optimizing of control systems; site cleanup punch
      list and grading/seeding; develop implementation strategy for seeding nitrification
      towers during dry weather; develop implementation strategy for employing primary
      tank 5-7, effluent pumping, and towers to treat wet weather flows; develop PLC
      programming for seeding the nitrification tower and for control of wet weather
      treatment system; implement dry weather seeding strategy for towers and collect
      data; begin trials of towers for wet weather treatment after successful seeding.
  - name: CMOM Plan Development
    status: Lima received a letter on 3/30/17 from USEPA requesting modification to
      the plan submitted 7/10/15. Lima submitted the revised plan to USEPA on 5/26/17.
    next_period: null
  - name: Asset Management
    status: Final design and contract documents are still being developed for the
      Phase 1 Rehabilitation of the Segmented Block Sewers.
    next_period: Completion of final design and public bidding of this project.
  - name: Supplemental Environmental Project (SEP)
    status: Lima replanted 213 trees in April after the total failure of the trees
      planted in 2016. A recent inspection by USEPA revealed all re-planted trees
      appear to have established roots and are doing well.
    next_period: USEPA requests Lima to submit a Revised SEP Completion Report by
      January 31, 2018.
  - name: Simmon's Field CSO EQ Basin
    status: City is under contract with Stantec (formerly MWH) for engineering. Three
      progress meetings occurred in the reporting period; 60% design drawings submitted
      May 5, 2017. Early unfavorable boring results led to additional borings as part
      of a Phase II Environmental Site Assessment, completed June 16, 2017.
    next_period: Contingent upon soil boring results, completion of final design and
      public bidding expected in the next six month period.
  agency_contacts:
  - January 6, 2017 — Lima submitted a SSO 5-Day Follow-up Report to OEPA concerning
    a force main rupture at the West Street Pump Station.
  - January 12, 2017 — Lima submitted a SSO 5-Day Follow-up Report to OEPA concerning
    a flooded wet well at the Lost Creek Pump Station.
  - January 13, 2017 — Lima submitted a comment letter (via Frost Brown Todd) to OEPA
    in response to the proposed promulgation of WQS for the Maumee river drainage.
  - February 10, 2017 — Lima submitted a response letter to OEPA in reference to two
    'AD' values recorded for effluent temperature at Station 604 on the Compliance
    Review Report.
  - March 30, 2017 — Lima received a letter from USEPA requesting modifications to
    the CMOM plan submitted July 10, 2015. Lima was given 60 days to respond.
  - April 5, 2017 — OEPA conducted a Reconnaissance Inspection of Lima's WWTP.
  - April 19, 2017 — Lima submitted a SSO 5-Day Follow-up Report to OEPA concerning
    the failure of a check valve at the Westgate Pump Station.
  - April 26, 2017 — Lima submitted notification letter to USEPA that the replanting
    of 213 trees as part of the Supplemental Environmental Project (SEP) had been
    completed.
  - May 1, 2017 — Lima received a letter from USEPA requesting modifications be made
    to the CSOOP submitted May 13, 2015.
  - May 26, 2017 — Lima submitted revised CMOM Plan to USEPA.
  - June 19-21, 2017 — USEPA and OEPA conducted a 3-day reconnaissance inspection
    focused on the progress Lima has made on improvement projects defined in the consent
    decree entered into on January 13, 2015.
  - June 30, 2017 — Lima submitted revised CSOOP plan to USEPA.
  permit_exceedances:
  - January 1-2, 2017 — Lima recorded 'AD' values for effluent temperature at Station
    604. Construction activity at the plant required manual recording (versus normal
    automatic SCADA entry) of temperature for a short period. Paper files were misplaced
    between shifts and the data was lost.
