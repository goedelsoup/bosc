  summary: This is the semiannual compliance progress report filed by the City of
    Lima, Ohio under Paragraph 33 of the Lima Consent Decree (Case 3:14-CV-02551-JZ)
    for the period January 1 – June 30, 2017. Lima reports meeting both its deadline
    obligations for the period (revised CMOM plan submitted May 26, 2017; revised
    CSOOP submitted June 30, 2017) and documents substantial construction progress
    on the Headworks Project, CMOM Plan, Asset Management, SEP tree replanting, and
    Simmon's Field CSO EQ Basin. The attached Overflow Totals Report inventories 119
    SSO events and 13 CSO events at 47 locations system-wide during the reporting
    period, with volumes and durations reported monthly to OEPA via DMR.
  note: null
