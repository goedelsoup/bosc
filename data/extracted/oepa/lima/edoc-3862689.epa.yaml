  note: 'Letter notifies City of Lima that Ohio EPA has determined the application
    for addition of its POTW Pretreatment Program meets requirements of OAC Rule 3745-3-03(C).
    A public notice (Public Notice No. 14-03-053-PTM) has been issued with a public
    comment period through May 15, 2014. Official action approving or denying the
    submission is pending. The modification adds required streamlining rules (including
    optional rules for Non-Significant Categorical Users) to the city''s Sewer Use
    Ordinance. Signed by Craig W. Butler, Director. CC: David L. Schnipke (Environmental
    Compliance Manager), Justin Williams (NWDO/DSW), Allen County Health Department,
    Pretreatment File. Contact Ashley Ward at (614) 644-2001. Email correspondence
    also included between Ashley Ward (ashley.ward@epa.ohio.gov) and David L. Schnipke
    (david.schnipke@cityhall.lima.oh.us) regarding Lima Local Limits Resubmittal dated
    March 20, 2014.'
