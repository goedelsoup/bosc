    text: The compliance issue identified in the Compliance Review Report pertained
      to Overflow Volumes at station 002 and 003. The volume of the overflow at these
      stations is not available due to sensor replacement and computer programming.
      New Rosemont 5400 sensors were observed in place during the site visit on June
      20, 2017. The 'AD' code was determined to be appropriate for this occurrence
      per email contact with Ohio EPA. Sensor programming was on schedule to be completed
      by July 20, 2017, and the same code would appear in the July e-DMR.
