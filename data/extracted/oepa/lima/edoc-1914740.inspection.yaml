  summary: On October 18, 2016, Ohio EPA conducted a Reconnaissance Inspection at
    the City of Lima's WWTP to observe the air break constructed to prevent backflow
    from the sludge thickening tanks to the chlorine contact tank. The air break was
    found to be installed and no corrective action was needed for Operations & Maintenance
    or Effluent/Receiving Water Observations. The effluent following dechlorination
    was clear, colorless, and had no noticeable odor.
