  observations:
  - kind: finding
    text: The City of Lima submitted a local limit study in February 2019 to Ohio EPA for approval. The
      study has not yet been approved.
    number: '1'
    deadline: null
  - kind: finding
    text: The City currently has eight industrial users under permits. The pretreatment annual report
      lists 12 Significant industrial users, 11 categorical industrial users and four significant non-categorical
      industrial users.
    number: '2'
    deadline: null
  - kind: finding
    text: The City is investigating surfactants that are discharged to the City's Wastewater Treatment
      Plant (WWTP) to determine how they influence plant operations.
    number: '3'
    deadline: null
  - kind: recommendation
    text: 'Once the local limit study has been approved, the sewer use ordinance can be modified to include
      the limits. US EPA has a model of a pretreatment sewer ordinance that is very comprehensive and
      addresses all the current regulations. It can be found here: https://epa.ohio.gov/portals/35/pretreatment/PretreatmentModelSUO.pdf.'
    number: '1'
    deadline: null
  - kind: recommendation
    text: Conduct an inventory of industries that discharge to the City of Lima's WWTP to determine if
      they are required to be permitted as specified in Ohio Administrative Code (OAC) 3745-3-03(C)(1)(c).
    number: '2'
    deadline: null
  - kind: recommendation
    text: Identify any industrial users that are non-significant categorical users and are located upstream
      of a combined sewer overflow (CSO) to determine if these industries are required to be permitted.
    number: '3'
    deadline: null
  summary: On June 30, 2021, Ohio EPA conducted a comprehensive desktop review (PCI) of the City of Lima's
    approved pretreatment program, with facility representatives Ms. Emily Kerber and Ms. Kim Furry present.
    Key findings included a pending local limit study submitted in February 2019 that had not yet been
    approved, a discrepancy between the number of industrial users under permits and those listed in the
    annual report, and an ongoing investigation of surfactants discharged to the WWTP. Three non-binding
    recommendations were issued regarding the sewer use ordinance, an industrial user inventory, and identification
    of non-significant categorical users near CSOs.
  note: null
