  summary: This Director's Final Findings and Orders (DFFO), issued by the Ohio EPA
    on February 25, 1994, addresses the City of Lima's noncompliance with ORC Sections
    6111.04 and 6111.07 arising from documented discharges through at least 27 unpermitted
    separate sanitary sewer overflow (SSO) points between May 1992 and May 1993 (out
    of 36 known SSO points in the collection system). Lima is ordered to submit an
    approvable General Plan to eliminate all unpermitted SSOs within 12 months of
    the effective date (i.e., by February 25, 1995). Lima waived its right to appeal
    the Orders.
