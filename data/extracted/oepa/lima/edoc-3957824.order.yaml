  obligations:
  - requirement: 'Submit an approvable General Plan to abate pollution and eliminate
      all unpermitted separate sanitary sewer overflows (SSOs), whether or not discharges
      have been documented, within the City of Lima. The General Plan shall include:
      (a) alternatives for eliminating SSOs, (b) cost estimates for required improvements,
      (c) financial mechanisms to fund improvements and O&M/replacement costs, and
      (d) implementation schedule for PTI application, detail plans, bid advertisement,
      contract execution, construction initiation and completion, and NPDES permit
      compliance. Three copies to be submitted to Ohio EPA Northwest District Office,
      Division of Surface Water (Attn. Enforcement Group Leader).'
