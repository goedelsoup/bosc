    ph:                            [7.48, 8.34]
    total_filterable_residue_ppm:  [503, 1931]
    conductivity_umho:             [709, 2720]
    p_alkalinity_as_caco3:         ['<1', 4.4]
    m_alkalinity_as_caco3:         [40, 168]
    calcium_hardness_as_caco3:     [76, 331]
    magnesium_hardness_as_caco3:   [30, 133]
    sodium_as_na:                  [115, 462]
    potassium_as_k:                [3.6, 14]
    chloride_as_cl:                [70, 249]
    sulfate_as_so4:                [195, 795]
    nitrate_as_no3:                [0.83, 2.2]
    ortho_phosphate_as_po4:        [1.4, 4.3]
    total_phosphate_as_po4:        [1.4, 5.8]
    total_phosphorus_as_p:         [0.46, 1.9]
    fluoride_as_f:                 [0.68, 2.5]
    silica_as_sio2:                [3.4, 14]
    bromide_as_br:                 ['<0.1', '<0.5']
    aluminum_total:                ['<0.01', 0.01]
    barium_total:                  ['<0.01', 0.04]
    iron_total:                    ['<0.01', 0.09]
