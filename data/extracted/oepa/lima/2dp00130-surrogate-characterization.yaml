# ── The one quantity this data supports, and its limits ───────────────────────────────────────
derived_cycles_of_concentration:
  tag: inference
  basis: >-
    Ratio of each conservative species in the cooling loop to the same species in the makeup
    water, from the paired CLB-1 samples above. This is the standard way an operating tower's
    cycles of concentration is observed, and the paired makeup/loop structure of the filing is
    what makes it computable at all.
  conservative_tracers:
    chloride_as_cl: 3.56
    total_filterable_residue: 3.84
    conductivity: 3.84
    potassium_as_k: 3.89
    sodium_as_na: 4.02
    sulfate_as_so4: 4.08
  conservative_range: {min: 3.56, max: 4.08, median: 3.86, n: 6}
  wider_range_including_scaling_species:
    detail: >-
      Adding species that can precipitate or deposit and are therefore weaker tracers —
      fluoride 3.68, strontium 3.70, silica 4.12, total phosphorus 4.13, M-alkalinity 4.20,
      calcium hardness 4.36, magnesium hardness 4.43 — widens the band to 3.56-4.43 with a
      median of 4.02 over 13 species. The tight clustering across both groups is what makes the
      figure credible AS AN OBSERVATION OF CLB-1.
  excluded_and_why:
    toc: 10.91 — organic loading from treatment product feed and airborne capture; not conservative
    zinc_total: 2.12 — a corrosion-inhibitor / metallurgy species, consumed and plated out
    nitrate_as_no3: 2.65 — biologically active
    ortho_phosphate_as_po4: 3.07 — a fed treatment chemical, partly consumed
  finding: >-
    Google's CLB-1 tower was running at roughly 3.9 cycles of concentration on 2026-04-09.
    [reference] as to CLB-1; it says nothing directly about Lima.

# ── Reconciliation against the corpus's cooling model ─────────────────────────────────────────
reconciliation:
  against: src/watermark/hydrology/cooling_models.py (_CYCLES) and docs/HYDROLOGY.md section 4
  model_assumption:
    value: 5.0
    cite: '"cooling-tower cycles of concentration ~5 (typical 4-6)"'
    nature: >-
      A literature assumption, not a back-solve from Lima data and not a disclosed figure. Worth
      stating plainly, because the issue that commissioned this ingest described A3's cycles
      figure as a back-solved bracket: what the code actually carries is a constant.
  observed_analogue: {range: [3.56, 4.08], median: 3.86, site: GOOGLE CLB-1, tag: reference}
  result:
    tag: inference
    detail: >-
      THE DISCLOSED ANALOGUE SITS AT OR JUST BELOW THE BOTTOM OF THE MODEL'S OWN CITED BAND. The
      model assumes 5.0 and cites 4-6 as typical; the only paired makeup/loop measurement the
      applicant has put on any public record runs at ~3.9. This is a mild disagreement, in a
      direction that would REDUCE the bottom-up bound rather than raise it: evaporation is
      back-solved as blowdown x (CoC-1), so 3.9 gives 2.9 x blowdown where 5.0 gives 4.0 —
      about 28% less. Applied to the 3.84 MGD bottom-up upper bound in docs/HYDROLOGY.md that
      would be roughly 2.8 MGD, which still sits inside the 3.14-3.84 MGD bracket's neighbourhood
      and does not disturb the corridor conclusion (the buildout draw remains an order of
      magnitude above the Ottawa's 7Q10).
  model_not_adjusted:
    tag: verified
    detail: >-
      ⚠️ THE MODEL IS NOT CHANGED ON THIS EVIDENCE, AND THE FIGURE IS NOT ADOPTED. Three reasons,
      each sufficient on its own:
      (1) It is a self-reported measurement of a DIFFERENT FACILITY. The standing rule across the
      B-series route-blind issues is that a self-report never upgrades the source; a self-reported
      analogue is weaker still, and swapping a stated-typical constant for one day's reading at
      another campus would trade a declared assumption for an undeclared one.
      (2) Cycles of concentration is limited by the SCALING POTENTIAL OF THE LOCAL MAKEUP WATER,
      and Columbus city water is not Lima's. CLB-1's makeup runs 709 umho with 76 mg/L calcium
      hardness; nothing in this corpus establishes Lima's tower makeup chemistry, so the ratio is
      not transferable on chemistry grounds even setting the provenance aside.
      (3) It is a SINGLE GRAB PAIR on one date, with no indication of where in the tower's cycle
      it was taken.
      What it does do is what a corroborator should: it is the first disclosed, measured
      cycles-of-concentration figure of any kind connected to this applicant, and it lands close
      to the assumption the model already uses rather than contradicting it. That is worth
      recording precisely because it is uncomfortable to overclaim.

# ── Flow, and what it reconciles against ──────────────────────────────────────────────────────
disclosed_flow:
  tag: verified
  source: data/documents/oepa/lima/edoc-4116201.pdf p1 (Manufacturing Process table)
  stream: Non-contact cooling water
  average_gpd: 52000
  maximum_gpd: 156000
  mode: B (batch), frequency "Variable"
  date_installed_on_form: Nov 2026
  reconciliation_with_pti:
    tag: inference
    detail: >-
      COHERENT WITH #2088, WHICH IS WORTH SAYING BECAUSE IT NEED NOT HAVE BEEN. The Rev. 1 PTI
      application (DSWPTI-260597, eDoc 4230068) gives a design AVERAGE DAILY flow of 0.10 MGD for
      the combined main and a design PEAK HOURLY flow of 0.36 MGD. This form puts the cooling
      component of that combined stream at 0.052 MGD average and 0.156 MGD maximum, leaving about
      0.048 MGD for the domestic half — plausible against 155 staff on three shifts, and below
      both the peak-hourly figure and the 0.79 MGD sewer hydraulic capacity. The two filings, made
      three weeks apart by different preparers, describe the same pipe consistently.
  derived_makeup:
    tag: inference
    detail: >-
      ⚠️ A CHAINED ESTIMATE, STATED ONLY TO BOUND ITS OWN WEAKNESS. Makeup = blowdown x CoC. Taking
      the Lima-disclosed blowdown (0.052 MGD average) with the CLB-1 observed ratio (~3.9) gives
      roughly 0.20 MGD of tower makeup on average and about 0.61 MGD at the disclosed maximum.
      This MULTIPLIES A LIMA FIGURE BY A COLUMBUS RATIO and inherits every objection above; it is
      recorded as an order-of-magnitude marker, not as a campus water demand, and it is NOT fed to
      any scenario. Note also that it is more than an order of magnitude below the 3.14-3.84 MGD
      consumptive bracket, which is a BUILDOUT figure against a phase-1A permit — the two are not
      the same quantity and must not be differenced.

# ── Temperature ───────────────────────────────────────────────────────────────────────────────
temperature:
  tag: reference
  detail: >-
    The summary table is the only place in the entire application package where a blowdown
    temperature appears: maximum 85 degF (29.4 degC) and average 65 degF (18.3 degC), for the
    CLB-1 loop. It is worth flagging that the draft 2DP00130 permit monitors WATER TEMPERATURE,
    pH and FLOW RATE — so the one parameter set the permit will require is the one the application
    characterises entirely by proxy: Group A's own temperature-maximum and temperature-average
    rows are blank.
  do_not_overread:
    tag: open
    detail: >-
      ⚠️ 85 degF converts to 29.4 degC, which is numerically the Ottawa River's daily-maximum
      temperature criterion for this reach (OAC 3745-1-35 Table 35-11, zone G, Jun 16-30) named in
      the THERMAL-NO-LIMIT lead. THAT COINCIDENCE IS NOT A FINDING and must not be published as
      one. This is an INDIRECT discharge: the stream reaches the Ottawa only after the American-Bath
      POTW, and nothing in this corpus establishes what temperature leaves that plant's outfall.
      It is also CLB-1's water, not Lima's, on one day in April. Recorded so that a later reader
      who notices the coincidence finds the caveat already attached to it.

# ── What this package does not settle ─────────────────────────────────────────────────────────
open_questions:
  - id: BOSC-DISCHARGE-UNCHARACTERISED
    tag: open
    detail: >-
      No measurement of Project BOSC's own discharge exists in any public record this corpus
      holds. The applicant states one becomes available when the facility operates. This does NOT
      reopen #1479 / H1-DRAW, which closed as modelled on the correct ground that the facility is
      pre-operational — it sharpens that closure by dating it: the record now shows the applicant
      saying so in its own filing, and names the event that would change it.
  - id: BOSC-DESIGN-DOSAGES-NOT-FILED
    tag: open
    detail: >-
      The four treatment chemicals are disclosed; the design dosages the application says are
      attached are not in the package. Without them the loading of bromide, phosphate and
      hypochlorite to the POTW cannot be estimated from the record.
  - id: BOSC-APPLICATION-COORDINATE-ERROR
    tag: open
    detail: >-
      The application locates the facility at 40.741894 / -73.989311 — Manhattan, New York. A
      transcription or template defect, not a substantive claim about the site, and it does not
      affect any figure above. Recorded because it went through the agency uncorrected.
  - id: BOSC-PTI-QUESTION-ANSWERED-NO
    tag: open
    detail: >-
      The form answers NO to "was a Permit to Install obtained?" on 2026-05-05, 28 days after
      DSWPTI-260294 issued to this applicant for this site (eDoc 4074527, 2026-04-07). The form
      does not say what scope it read the question as having. [verified] that the answers differ;
      [open] as to why.
