    cod:                           ['<10', 49]
    toc:                           [1.1, 12]
    tss:                           ['<8.0', '<8.0']
    ammonia_as_n:                  [null, '<0.1']
    dehp_ug_l:                     ['<5.00', '<5.00']
    temperature_maximum_f:         [null, 85]
