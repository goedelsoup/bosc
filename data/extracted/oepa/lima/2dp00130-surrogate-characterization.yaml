# Reviewed analysis artifact — NOT a document extraction and deliberately not shaped like one.
# It carries no `permit:` / `inspection:` / `order:` block, so `watermark.pipeline.corpus._classify`
# declines it and it never enters the records feed. Its sources are the committed documents named
# on every value below; those are the record, this is the reading.
meta:
  subject: >-
    What the 2DP00130 application package actually characterises — and whose water it characterises
  permit_id: 2DP00130*AP
  applicant: BISTROZZI LLC
  facility: Project BOSC (4110 N Cole St, Lima, Allen County, Ohio)
  application_id: APP285104563
  reviewed_on: '2026-08-23'
  issue: 2089
  provenance: data/documents/oepa/lima/2dp00130-app285104563-manifest.yaml
  headline: >-
    The campus's own discharge characterisation contains no measurement of the campus's discharge.
    The Group A results table of the Indirect Discharge Permit Sampling Report — the nine
    parameters the form states results MUST be provided for — is blank on both committed copies.
    In its place the applicant filed laboratory data from a different Google data center, in a
    different county, on a different watershed, and said so on the application form. Everything
    numeric below is that other site's water.

# ── The applicant's own statement, verbatim ───────────────────────────────────────────────────
disclosure:
  source: data/documents/oepa/lima/edoc-4116201.pdf p2 (ADDITIONAL INFORMATION block)
  tag: verified
  quote: >-
    "Sampling Report Note: site sampling information is not available at this time as the facility
    is under construction. Our understanding is that the form is intended to reflect process
    blowdown only. Also, note that we left the Group A table blank since we do not have actual
    blowdown WQ data. Biocides will be used in the cooling water to control microbiological
    growth. See attached SDSs sheets for the anticipated cooling water treatment chemicals and
    their design dosages. Sample data from a similar site has been added for reference until
    sampling data can be obtained from the Project Bosc site."
  reading: >-
    This is a disclosure, not a concealment: the substitution is stated on the face of the filing.
    It is recorded here because the substitution is easy to lose downstream — the summary table
    that carries the numbers is headed "Lima Project" (4116204 p9) and one of the two laboratory
    reports carries "Project Name: Lima Project" on its cover (4116205), while the sample
    identities on both say CLB1. A reader who takes the project label for the sample identity
    publishes Columbus measurements as Lima's.

# ── Whose water this is ───────────────────────────────────────────────────────────────────────
surrogate_site:
  tag: verified
  name_on_lab_report: GOOGLE CLB - 1 (C008798)
  address: 225 Rathmell Rd, Columbus, OH 43137-9324
  county: Franklin
  relation_to_lima: >-
    A different Google data center roughly 90 miles southeast of the Lima campus, in the Scioto
    basin rather than the Maumee. It is NOT the facility this permit application is for.
  sampled_on: '2026-04-09'
  samples:
    - id: CLB1-CITY-(L)
      description: municipal makeup water
      summary_table_column: City Domestic
    - id: CLB1-MCP3-(L)
      description: cooling loop / tower water
      summary_table_column: Blowdown from MCU3
  label_discrepancy:
    tag: open
    detail: >-
      The loop sample is MCP3 on both laboratory reports (4116202, 4116205) and MCU3 on the
      summary table (4116204 p9). The analyte values match exactly across all three documents
      (pH 8.34, TOC 12, COD 49, sulfate 795, fluoride 2.5, total P 1.9, magnesium 133, zinc 0.36,
      barium 0.04, iron 0.09), so this is the same sample under two spellings, not two samples.
      Which spelling names the actual unit is not established by the record.

# ── What the sampling report itself carries ───────────────────────────────────────────────────
sampling_report:
  documents: [edoc-4116204.pdf, edoc-4116226.pdf]
  permit_number_on_form: 2DP00130*AP
  facility_name_on_form: Project BOSC
  outfall: '001'
  collection_period: {from: '2026-01-13', to: '2026-01-14'}
  group_a_results:
    tag: verified
    state: blank
    parameters_left_blank:
      - Biochemical Oxygen Demand (BOD)
      - Chemical Oxygen Demand (COD)
      - Total Organic Carbon (TOC)
      - Total Suspended Solids (TSS)
      - Ammonia (as N)
      - Temperature (Maximum)
      - Temperature (Average)
      - pH
      - Total Filterable Residue
    detail: >-
      All nine, on both committed copies, together with every results column in Groups B and C.
      ⚠️ A declared collection period of 2026-01-13 to 2026-01-14 sits in the header above an
      empty table. The application form explains it — the facility was under construction and had
      no blowdown to sample — so the period is a form field that was completed, not evidence that
      a January 2026 sampling event occurred. Nothing in the package establishes that one did.
  group_b_c_believed_present:
    tag: verified
    detail: >-
      The report's whole affirmative content. Eight analytes marked BELIEVED PRESENT; everything
      else on the form — all metals but copper and zinc, all volatile, acid, base/neutral and
      pesticide GC/MS fractions, cyanide, dioxin, oil and grease, radioactivity, surfactants,
      phenols, sulfide, sulfite — marked BELIEVED ABSENT.
    present: [Bromide, Fluoride, Phosphorus (as P) Total, Sulfate (as SO4), Aluminum Total,
              Barium Total, Copper Total, Zinc Total]
    reading: >-
      Consistent with the treatment programme disclosed in the four attached SDSs — bromide from
      the sodium-bromide/hypochlorite biocide pair, phosphorus from a phosphate-based scale and
      corrosion inhibitor, copper and zinc from the loop's own metallurgy, sulfate and fluoride
      concentrated up from the makeup water. Consistency is not corroboration: these are the
      applicant's beliefs about an unbuilt facility, not observations.

# ── The disclosed treatment chemistry ─────────────────────────────────────────────────────────
