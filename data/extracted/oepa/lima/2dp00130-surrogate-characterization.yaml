      document: edoc-4116203.pdf
    - product: HYDROCHLORIC ACID 15% 10B
      manufacturer: Univar Solutions USA
      sds: '100000057230'
      sds_revision: '2020-07-21'
      role_inferred: pH control
      document: edoc-4116206.pdf
    - product: Sodium bromide (CAS 7647-15-6)
      manufacturer: Aldrich / MilliporeSigma (product 229881)
      sds_revision: '2024-09-08'
      role_inferred: biocide precursor, with the hypochlorite below
      document: edoc-4116207.pdf
