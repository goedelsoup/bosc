  - kind: finding
    text: 'Ford Motor Company (1155 Bible Road, Lima, Ohio), Non-categorical SIU,
      manufacturer of automotive engines: In compliance. Average process flow 100,000–120,000
      gpd. Sanitary is discharged through a separate line. Ford uses a modified Windsor
      process to treat wastewater to remove oil and precipitate metals. Coolant water
      is sent to filters and reused.'
    number: IU-1
    deadline: null
  - kind: finding
    text: 'Dana Holding Corporation (777 Bible Road, Lima, OH 45801-2025), Non-SIU,
      manufactures driveshafts for the automotive industry: In compliance. Average
      total flow 1,300 gpd. Facility now hauls all process wastewater off-site to
      Valicor for recycling; only discharges sanitary wastewater to the City. City
      noted that the containment pit around the hauled wastewater tanks had some oily
      waste and trash. Older file references notification of SNC and publication in
      paper, but the facility is currently in compliance.'
    number: IU-2
    deadline: null
  summary: On February 28, 2017, Ohio EPA conducted a Pretreatment Audit of the City
    of Lima's approved Pretreatment program, including a file review and site inspections
    of two industrial users (Ford Motor Company and Dana Holding Corporation). All
    industrial user inspections and sampling requirements were found to be carried
    out, and the implementation of Lima's approved pretreatment program was determined
    to remain satisfactory. Both industrial users reviewed were found to be in compliance.
