  observations:
  - kind: finding
    text: Ford Motor Company (1155 Rible Road, Lima, Ohio) — Non-categorical SIU,
      manufacturer of automotive engines. Average total flow 100,000–120,000 gpd.
      Sanitary discharged through a separate line. Facility is in compliance.
    number: '1'
    deadline: null
  - kind: finding
    text: Dana Holding Corporation (777 Rible Road, Lima, OH 45801-2025) — Non-SIU,
      manufactures driveshafts for the automotive industry. Average process flow 1,300
      gpd. Facility previously held a discharge permit with the City but now hauls
      all process wastewater off-site to Valicor for recycling; currently only discharges
      sanitary wastewater to the City. The City inspects this facility once a year
      and samples them twice a year. Older file reference of notification of SNC and
      publication in paper, but facility is currently in compliance.
    number: '2'
    deadline: null
  - kind: finding
    text: All industrial user inspections and sampling requirements are being carried
      out. Implementation of Lima's approved Pretreatment program remains satisfactory.
    number: '3'
    deadline: null
  - kind: finding
    text: No changes pending or completed to the pretreatment program since the last
      inspection (legal authority, local limits, multi-jurisdictional agreements,
      ERP, sewer use ordinance, control mechanism, etc.).
    number: '4'
    deadline: null
  - kind: finding
    text: 'Contributing jurisdiction: Findlay Road area drains to the City, metered
      and billed; all domestic wastewater.'
    number: '5'
    deadline: null
  - kind: finding
    text: SIU classification has not changed. New IUs are identified through developer
      contact; facilities fill out a waste characterization form. New small users
      can also be caught through new account billing. Changes in wastewater discharges
      at existing IUs are identified through inspections, industrial monthly billing
      (changes in flow flagged via spreadsheet), and sampling.
    number: '6'
    deadline: null
  summary: On February 28, 2017, Ohio EPA conducted a Pretreatment Audit of the City
    of Lima WWTP's approved Pretreatment program, including a file review and site
    visits to two industrial users (Ford Motor Company and Dana Holding Corporation).
    Both industrial users were found to be in compliance, and all industrial user
    inspections and sampling requirements are being carried out. The City's implementation
    of its approved pretreatment program was found to remain satisfactory.
  note: null
