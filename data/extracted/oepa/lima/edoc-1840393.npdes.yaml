  warnings:
  - 'APPLICANT CORRECTED ON REVIEW. The form''s "Applicant Name: Michael Caprella / Title: Deputy Director"
    is the eBusiness Center SUBMITTER — the individual who filed it ("Electronically submitted by caprella
    on 05/18/2022") — not the permit applicant. The applicant is the CITY OF LIMA: US EPA I.D. OH0026069,
    facility City of Lima WWTP. The first read copied the field label faithfully and got the relationship
    wrong, which would have published a person as the permittee.'
  - ⚠️ THIS APPLICATION'S SSO SCHEDULE CONTRADICTS THE CONSENT DECREE IT TRANSCRIBES, on the design storm
    and only on the design storm. Section II.G.1 lists all SEVEN SSO basin improvements as "upgrades sized
    to convey 25 year, 6 hour storm". Appendix A, Table A.1 of the 2015 consent decree (edoc-412983.order.yaml,
    verified against the page image at 200 DPI) sizes only THREE that way — Allentown, West Street, Koop
    — and sizes Lost Creek, COLE ST., Findlay Road and Fifteenth St. to a 5-YEAR, 6-hour design storm.
  - Every DATE in that table matches the decree exactly (Simmons Field 2024-08-30 through Fifteenth St.
    2038-04-01), so the application transcribes the schedule faithfully and uniformly overstates the design
    storm on the four lower-tier basins — consistent with a copy-down of the first row's language, though
    this document does not say so. [inference], not [verified].
  - 'NOT RESOLVED HERE: which figure governs the AS-BUILT design, and whether Ohio EPA relied on the 25-year
    statement when issuing 2PE00000*OD in 2023. Both open. What is established is that the permitting
    authority was told 25-year for basins the federal decree protects at 5-year.'
  - The 54 outfalls below were absent from the first read entirely (0 outfalls, null receiving water)
