  - ⚠️ THIS APPLICATION'S SSO SCHEDULE CONTRADICTS THE CONSENT DECREE IT TRANSCRIBES, on the design storm
    and only on the design storm. Section II.G.1 lists all SEVEN SSO basin improvements as "upgrades sized
    to convey 25 year, 6 hour storm". Appendix A, Table A.1 of the 2015 consent decree (edoc-412983.order.yaml,
    verified against the page image at 200 DPI) sizes only THREE that way — Allentown, West Street, Koop
    — and sizes Lost Creek, COLE ST., Findlay Road and Fifteenth St. to a 5-YEAR, 6-hour design storm,
    with performance criteria "Control SSOs in this basin up to 5-Year, 6-hour design event flow rates".
  - Every DATE in this table matches the decree exactly (Simmons Field 2024-08-30, Allentown 2029-12-31,
    West Street 2031-12-31, Koop 2032-12-31, Lost Creek 2035-04-03, Cole St. 2036-04-01, Findlay Rd 2037-03-31,
    Fifteenth 2038-04-01). The application is therefore transcribing the decree's schedule accurately
    and uniformly overstating the design storm on the four lower-tier basins — consistent with a copy-down
    of the first row's language, though this document does not say so. [inference], not [verified].
  - 'NOT RESOLVED HERE, and it should not be resolved from these two documents alone: which figure governs
