  summary: On April 5, 2017, Ohio EPA conducted a Reconnaissance Inspection at the
    City of Lima's WWTP to observe the status of plant upgrades. New screens, grit
    chambers, and primary clarifiers are operational, but nitrification towers are
    not yet in service and SCADA is not yet connected to Collett and Heindel CSO control
    structures. Final effluent was clear, colorless, and had no noticeable odor; 23
    permit effluent code violations (water temperature) and 54 reported SSO events
    were noted in the compliance summary.
