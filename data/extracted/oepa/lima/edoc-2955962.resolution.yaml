# City of Lima Council, Ordinance No. 155-13 — amending Section 1040.01 of the Codified
# Ordinances (the SEWER USE ordinance's definitions) "in order to comply with new USEPA rules".
# Issue #2080.
#
# Hand-authored, not extracted. `resolution:` is a whole-document payload with NO extractor in
# this repo — every committed one (bowling-green/middleton-township, planning-commission) is a
# reviewed transcription, and this follows that convention rather than inventing a genre for a
# single document.
#
# Why a City ordinance is in a WWTP permit drawer: Chapter 1040 is the pretreatment authority
# the NPDES permit requires the City to maintain, so the portal files its amendments under
# 2PE00000. That is a real relationship, not a misfiling like edoc-3063821 or edoc-3296496.

