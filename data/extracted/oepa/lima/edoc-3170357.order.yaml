  summary: This is a May 23, 2016 comment letter from Stephen P. Samuels of Frost
    Brown Todd LLC, counsel for the City of Lima, Ohio, submitted to Ohio EPA's Division
    of Surface Water and Northwest District Office regarding NPDES Draft Permit No.
    2PE00000*ND for the City of Lima Wastewater Treatment Plant. The letter transmits
    23 detailed preliminary comments and objections to specific terms and conditions
    in the draft permit, including limits for phosphorus, mercury, toxicity, and various
