  summary: A Reconnaissance Inspection was conducted on April 5, 2017 at the City of Lima's wastewater
    treatment plant to observe the status of plant upgrades. New screens, grit chambers, and primary clarifiers
    were found operational, while nitrification towers were not yet in service. Final effluent was clear,
    colorless, and had no noticeable odor; no significant non-compliance was identified. The compliance
    data for the period 11/1/2016–3/1/2017 showed 23 permit effluent code violations (Water Temperature,
    Station 604) and 54 reported SSO events.
