  summary: This is the semiannual compliance progress report filed by the City of Lima, Ohio under Paragraph
    33 of the Lima Consent Decree (Case 3:14-CV-02551-JZ) covering the period July 1 – December 31, 2019.
    Lima reports no unmet deadlines, two NPDES permit exceedances (chlorine and pH, both attributed to
    equipment/instrument error), and SSO/CSO overflow totals of 88 SSO and 17 CSO events across monitored
    locations per the attached Overflow Totals Report. Five named capital/compliance projects are underway
    or recently completed, including the Simmon's Field CSO EQ Basin and Phase 2 sewer rehabilitation,
    with contract award issued to SAK Construction.
  note: 'Signed by Michael H. Carella, Director of Utilities, City of Lima, Ohio. Overflow Totals Report
    updated 1/3/2020; SSO total = 88 events, CSO total = 17 events across all monitored locations for
    the period. CMOM report included as paragraph g. Page ID #212, 1 of 64 pages. Cited in the report
    as "CASE: 3:14-CV-02551-JZ Doc #5 Filed: 01/13/15" — the trailing text identifies one FILING inside
    the case, not the case. `case_no` holds the case number alone so this row joins the decree extraction
    (edoc-412983.order.yaml) and the rest of the enforcement chain.'
