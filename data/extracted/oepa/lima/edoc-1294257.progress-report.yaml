  projects:
  - name: Lima Wastewater Treatment Headworks Project
    status: Construction is complete.
    next_period: Continued seeding of the nitrification towers and performance testing of TSS and BOD
      in wet-weather mode.
  - name: CMOM Plan
    status: Lima continues to execute the approved plan.
    next_period: null
  - name: Asset Management – Phase 1 High Street/Jameson Avenue Sewer Rehabilitation Project
    status: Construction continues. Progress to date includes the installation of 8 manholes and 2,167
      linear feet of 10" sanitary sewer and HDPE lining of 1,782 feet of 54" combined sewer.
    next_period: HDPE lining of the remaining 385 feet of 54-inch sewer, and lining and grouting of 550
      feet of 78-inch sewer.
  - name: Asset Management – Phase 2 Collett, Delphos, Woodward & Grand Avenue Sewer Rehabilitation Project
    status: Advertised for bid in October 2019; bid opening November 4, 2019. Two bids received and reviewed.
      Notice of Award to SAK Construction issued November 14, 2019. Phase 2 includes relining/rehabilitation
      of 3,075 feet of 78-inch segmented block sewer, installation of 1,075 feet of new 8-inch sanitary
      sewer and four manholes.
    next_period: Execution of contract documents and issuance of Notice-to-Proceed; mobilize crews to
      begin surveying, cleaning, and dye-water testing of laterals connected to the 78" sewer; begin installation
      of 1,033 feet of 10" express sewer and manholes.
  - name: Supplemental Environmental Project (SEP)
    status: Project is complete. Annual maintenance of the project area will continue.
    next_period: Annual maintenance of the project area.
  - name: Simmon's Field CSO EQ Basin
    status: Completion of base structure; approximately 90% of wall structure; approximately 90% of roof
      structure; approximately 95% of pump station wet well structure; approximately 40% of backfill.
    next_period: Completion of the tank structure; completion of pump station wet well and valve vault;
      continuation of backfill up to grade; begin construction of pump station building.
  agency_contacts:
  - July 22, 2019 — Lima submitted to OEPA an update to the Control Strategy for Dissolved Hexavalent
    Chromium, as required by NPDES Permit 2PE00000*ND, Part I, C — Schedule of Compliance, B, 3.
  - August 2, 2019 — Lima submitted to OEPA an evaluation form for Reducing the Discharge of Phosphorus
    from the WWTP.
  - August 28, 2019 — Lima submitted to USEPA/OEPA a response letter to a request for revisions to the
    Flow Maximization Plan.
  permit_exceedances:
  - August 11, 2019 — Lima reported an exceedance of chlorine. A residual of 0.25 mg/l was recorded at
    Station 001. A flow meter erroneously recorded a flow of zero, which reduced the sodium bisulfite
    feed to a level below what is necessary for neutralization. The sodium bisulfite pump is now adjusted
    to provide a higher minimum feed rate, regardless of the flow meter recording.
  - October 18, 2019 — Lima reported a pH level of 6.3 at Station 001, in violation of the 6.5 Daily Maximum
    Limit. This was later determined to be a faulty read, as an operator recorded a 6.56 reading on the
    bench sheet at this same time. A short power interruption due to maintenance of switchgear equipment
    is believed to have caused the error.
