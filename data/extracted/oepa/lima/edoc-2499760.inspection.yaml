  observations:
  - kind: finding
    text: The City of Lima submitted a local limit study in February 2019 to Ohio
      EPA for approval. The study was approved on August 10, 2021.
    number: '1'
    deadline: null
  - kind: finding
    text: The City contracted with Geosyntec to perform a comprehensive evaluation
      of the pretreatment program. The consultant presented a report with recommendations
      to the city on April 5, 2023. The city is working on implementing the recommendations.
    number: '2'
    deadline: null
  - kind: recommendation
    text: We recommend that the City continues to implement the recommendations presented
      in the Geosyntec report, including permitting the significant industrial users
      that were identified in report.
    number: '1'
    deadline: null
  summary: On June 28, 2023, Ohio EPA conducted a Pretreatment Audit Inspection of
    the City of Lima WWTP, with a follow-up TEAMS interview meeting on July 5, 2023;
    the audit also included site visits to Randall Bearings and Pepsi. The audit reviewed
    pretreatment reports, records, permits, and a completed checklist, finding that
    a local limit study was approved in 2021 and that the city is actively implementing
    recommendations from a Geosyntec pretreatment program evaluation. Ohio EPA recommended
    that the city continue implementing the Geosyntec report recommendations, including
    permitting identified significant industrial users.
