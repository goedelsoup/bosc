  summary: Ohio EPA responds to the Mansfield WWTP's February 24, 2020 letter regarding
    the Pollutants Control Strategy required under NPDES permit Part I, C-A.2. Ohio
    EPA concurs with the WWTP's request to exclude hexavalent chromium and bis(2-ethylhexyl)phthalate
    from the Pollutant Minimization Program (PMP) report requirements, given five
    years of non-detect data for those parameters. The City is directed to continue
    submitting the annual PMP report for all other pollutants per Part I, C-A.3.
  note: Ohio EPA's response to the City of Mansfield's 2020-02-24 submittal of the
    pollutant Control Strategy required by its NPDES permit Part I, C-A.2 — covering
    copper, dissolved hexavalent chromium and bis(2-ethylhexyl)phthalate. Mansfield
    is a registered site in this network (the first documented data-center rejection
    site), so this is a document Mansfield's own record should know about; it is reachable
    only because Ohio EPA filed it under Lima's permit number. Raised as a follow-up
    rather than acted on here — moving or re-shelving the source byte is exactly what
    the chain-of-custody rule forbids.
