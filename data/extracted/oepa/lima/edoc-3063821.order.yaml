    NPDES / Richland County / 2PE00000", pairing Mansfield''s plant and county with
    LIMA''s permit number. That is why a portal sweep of permit 2PE00000 returned
    it, and why it sits in data/documents/oepa/lima/.'
  - 'The extraction is shelved under oepa/lima/ because the extracted tree MIRRORS
    its source and the source is immutable — the byte was served under Lima''s permit
    and keeps that identity. Nothing here is Lima evidence: `respondent`, `facility`
    and every figure describe Mansfield. Read the shelf as custody, not as attribution.'
  - '`permit_no: 2PE00000` is AS PRINTED and is the error itself, not a transcription
    of Mansfield''s real permit. Do not ''correct'' it to a Mansfield permit number
    — the printed value is the evidence that the misfiling happened. Mansfield''s
    actual NPDES id is not stated in this document.'
  - Permit number '2PE00000' may be a placeholder or file-reference identifier rather
    than the full active NPDES permit number; verify against permit records.
