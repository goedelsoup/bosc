  status: active
  summary: U.S. EPA Region 5 issued an Administrative Order on February 7, 2005 to the City of Lima, Ohio
    under CWA Sections 308 and 309(a), finding violations of NPDES Permit No. OH0026069 due to 36+ sanitary
    sewer overflow (SSO) discharge points discharging untreated sewage to the Ottawa River. The Order
    required the City to certify compliance, immediately cease SSOs, submit a Sanitary Sewer Overflow
    Elimination Plan (SSOEP) within 30 days, implement it within 180 days, and begin monthly SSO sampling
    and Compliance Progress Reports. The City, through counsel (Schottenstein, Zox & Dunn), responded
    that it could not meet the deadlines, anticipated completing the SSOEP by approximately June 20, 2005,
    and proposed negotiating a Consent Order in lieu of accepting the administrative order as issued.
  note: 'The file contains: (1) the Feb. 7, 2005 U.S. EPA Administrative Order; (2) the City''s Feb. 18,
    2005 response letter rejecting the Order and proposing a Consent Order; (3) the City''s March 11,
    2005 status letter to Nicole Cantello (U.S. EPA ORC) reporting inability to meet SSOEP deadline and
    beginning SSO sampling; and (4) a Lima News article describing potential $147 million cost and 83%
    sewer rate increase. The permit expiration date is March 31, 2007. The 30-day SSOEP deadline computed
    from Feb. 7, 2005 receipt is approximately March 9, 2005; the 180-day implementation deadline is approximately
    August 5, 2005.'
