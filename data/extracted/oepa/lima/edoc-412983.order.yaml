method: >-
  Hybrid. The decree BODY (pp. 0-63, court-stamped "1 of 64" - "64 of 64") carries a clean text
  layer and was read from it by the `order` extractor over all 64 pages (`extract_order(...,
  text_pages=64)`; the shipped default of 6 sees only the caption and table of contents and
  produces obligations read off the TOC with null deadlines). Seven body pages are image-only
  and invisible to that read - pp. 59-63 are signature pages, but pp. 30 and 33 are substantive
  and were recovered by OCR. The APPENDICES (pp. 64-102) have NO text layer at all: 39 scanned
  pages, recovered by rotation-corrected OCR (Table A.1 and the figure sheets are landscape;
  tesseract at 0 degrees returns mirror-gibberish). Table A.1's Bid Date / Achieve Full
  Operation column and its row alignment were then VERIFIED against the rendered page image at
  200 DPI, because the OCR interleaved the Findlay Road and Fifteenth St. rows.
  Appendices A, B, C, D, E and F are transcribed only to the depth stated in `obligations` and
  the warnings below - the figure sheets (pp. 67-69, 79, 90, 95-99) are maps and planting
  schedules that carry no obligation text and were not transcribed.
  `image_pages_read` is every page RASTERIZED, and the reads behind it are not uniform: p0 is the
  only page a VISION MODEL saw (rendered at 150 DPI, the `order` spec's `image_pages=1`); pp. 30,
  33 and 64-102 were rendered at 300 DPI and read by TESSERACT, of which pp. 67-72, 79, 90, 95-97
  and 99-102 needed rotation correction; pp. 71 AND 72 - the two Table A.1 pages carrying every
  control-measure row - were additionally verified by eye against a 200 DPI render, because a
  rotated table is where OCR misaligns rows and every date and outfall list in this artifact comes
  from those two pages. `dpi: 300` records the OCR render, which produced everything transcribed
  here that the text layer did not.
order:
  confidence: high
  warnings:
  - >-
    penalty_usd is the TOTAL assessed, $49,000, and the decree splits it in two equal halves that
    sit on facing pages: para 44 assesses $24,500 to the United States (p29, text layer) and
    para 45 assesses $24,500 to the State of Ohio (p30, IMAGE-ONLY, recovered by OCR). A
    text-layer-only read of this decree sees half the penalty and reports $24,500 with no
    indication anything is missing.
  - >-
    INTERNAL INCONSISTENCY, recorded not resolved. Table A.1 sizes the Lost Creek / Cole St. /
    Findlay Road / Fifteenth St. control measures to a "5-yr, 6-hour design storm", but para 50
    excuses an SSO from those same four basins when precipitation is below a "5-year recurrence
    interval, 24-hour duration" storm (3.11 in). Those are different storms. The 25-year tier is
    self-consistent (6-hour in both places, 3.26 in). Whether the 6/24-hour split is deliberate
    or a drafting error is an open question - do not silently harmonise them.
  - >-
    The PDF contains Appendix B twice (pp. 73-79 and pp. 84-90, both stamped Doc #: 4-3, PageID
    #192-198) and Table A.1 twice (pp. 70-72 and pp. 100-102, the second copy a poorer scan).
    Transcription is from the cleaner first copy. This is duplication in the as-served document,
    not in the corpus - do not "fix" it.
  - >-
    Appendix E (CMOM, p92) is reproduced as a table of contents only in this filing; Appendix D
    (p91) is "Supplemental Information". Neither carries an obligation schedule here. Appendix F
    (pp. 93-99) carries the SEP scope and a planting estimate but its milestone schedule was not
    legible enough to transcribe dates from - the SEP obligations below cite it without deadlines.
  - >-
    Read as of 2026-08-22, this instrument's own compliance status is NOT established by this
    document. The latest para 33 progress report held in the corpus is 2021-07-23 (edoc-1611092)
    and the 2026-08-22 portal sweep of permit 2PE00000 - complete, untruncated, 261 of 261 -
    carries no later filing under doc type "Judicial Order". `status: active` records the
    instrument's own terms (para 88 termination conditions are unmet on this record), NOT a
    verified present-day docket status.
