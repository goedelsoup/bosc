  penalty_usd: 49000
  stipulated_penalties: >-
    Section X, tiered. NPDES permit noncompliance (para 49): $500/day daily concentration or mass
    limits; $750/day weekly average; $1,000/month monthly average; $500 per any other violation.
    SSO discharges (para 50): $1,000 per day, accruing only AFTER the Achievement of Full
    Operation date for that basin's Appendix A control measures, and only where precipitation was
    below the basin's design event - a 5-year/24-hour storm (3.11 in) for Lost Creek, Cole St.,
    Findlay Road and Fifteenth St., a 25-year/6-hour storm (3.26 in) for Allentown, West St. and
    Koop, both taken from NOAA's Point Precipitation Frequency Estimates at the 90% confidence
    interval for the Lima area. SSOs from any other location (para 51): $500-$2,000 per SSO,
    tiered on whether Lima is in compliance with its CMOM Program schedule. Dry Weather Overflows
    (para 52): per-day schedule rising with the period of noncompliance. Failure to complete the
    SEP: $150,000 lump sum. Penalties are split 50/50 between the United States and the State of
    Ohio where both elect to seek them.
  status: active
  summary: >-
    The federal Clean Water Act consent decree governing the City of Lima's WWTP and
    combined/sanitary sewer system, lodged 2014-11-19 and entered 2015-01-13 by the United States
    and the State of Ohio in N.D. Ohio (Case No. 3:14 CV 2551). It assesses a $49,000 civil
    penalty split evenly between the two plaintiffs, requires a $218,400 Ottawa River bank
    revitalization SEP, and binds Lima to the Appendix A "Table A.1" integrated control schedule -
    WWTP headworks and nitrification-tower upgrades to 70 mgd by 2018, the 13.0 MG Simmons Field
    CSO storage tank and full CSO control by 2024-08-30, then seven SSO basins in sequence from
    2029 through 2038, closing with a final post-construction compliance monitoring report due
    2043-12-31. The decree protects Lima's basins at two different levels: Allentown, West Street
    and Koop are engineered to a 25-year, 6-hour storm, while Lost Creek, Cole St., Findlay Road
    and Fifteenth St. are engineered only to a 5-year storm and are scheduled last.
  note: >-
    The Cole St. basin row matters to this project beyond its place in the schedule. The Bosc
    campus address is 4110 N Cole St, and Table A.1 schedules the Cole St. basin's pump-station
    and relief-sewer upgrades to bid 2034-09-20 and achieve full operation 2036-04-01, sized to a
    5-year storm - the lower of the decree's two protection tiers, and tenth of its twelve control
    measures by completion date (Findlay Road 2037-03-31 and Fifteenth St. 2038-04-01 are later). Under para 50 the $1,000/day stipulated penalty for an SSO in that
    basin does not begin to accrue until that 2036 date. THIS IS NOT YET A FINDING ABOUT THE
    CAMPUS: a sewer basin named for a street is not evidence that a parcel on that street drains
    to it. The decree gives the testable handle - the Cole St. basin's control measures address
    SSO 49 and SSO 10 - and the campus/basin relationship must be established from the sewershed
    geometry and those two SSO locations, never from the street name. See lead H1 and issue #1760.
