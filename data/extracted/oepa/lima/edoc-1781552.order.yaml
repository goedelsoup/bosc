  summary: Letter dated April 7, 2022 from City of Lima Wastewater Supervisor Kim
    Furry to Ohio EPA's David Brumbaugh documenting the permanent elimination of Stations
    057 (Treatment Plant Bypass) and 036 (CSO) and the modification of Station 035
    (35a, 35b, 35c under the City's Consent Decree) from NPDES Permit 2PE00000*ND.
    The work was accomplished during Contract 50 (2016) for Station 057 and via MWH
    2015 drawings for Stations 036 and 035. The letter formally requests that Ohio
    EPA remove Stations 057 and 036 from the NPDES permit during its renewal.
  note: Letter authored by Kim Furry, Wastewater Supervisor, City of Lima. CC to Michael
    Caprella (Utilities Director), Eric Bontrager (Environmental Compliance Manager),
    and Shawn Dershem (Assistant Wastewater Supervisor). Attachments include photos
    of Influent Structure 2 (Contract 50 work) and MWH 2015 engineering drawings for
    CSO-036 reconfiguration (Sheets PP-13 and PP-14, Lima Upstream Regulators Sewer
    Separation Project, issued for bid June 2015).
