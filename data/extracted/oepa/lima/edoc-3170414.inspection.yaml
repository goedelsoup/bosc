  summary: This letter is the City of Lima's response to Ohio EPA's Compliance Review
    Report dated July 20, 2016, concerning the City of Lima WWTP (NPDES Permit No.
    2PE00000). The compliance issue identified was a Total Residual Chlorine reading
    of 0.30 mg/l at Station 001 against a limit of 0.02 mg/l, caused by inadequate
    chlorine feed rate adjustment following a rain event. As a corrective measure,
    training was provided to all plant operators on responding to flow changes.
