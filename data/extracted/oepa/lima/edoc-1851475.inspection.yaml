    evaluation inspection (CEI) at the Lima WWTP to evaluate compliance with NPDES
    permit terms and conditions and the operation and maintenance of the plant. All
    treatment units were in service, the final effluent was clear and odorless, but
    the nitrification towers had not yet been seeded to treat wet weather flows. No
    significant non-compliance was identified.
