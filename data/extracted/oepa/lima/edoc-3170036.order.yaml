  summary: Two letters from Michael H. Caprella, Director of Utilities, City of Lima, Ohio, to U.S. EPA
    Region 5. The August 7, 2017 letter invokes the force majeure provisions (Paragraphs 58, 64, 65, and
    69) of the Lima Consent Decree (Case 3:14-CV-02551-JZ), requesting that noncompliance caused by a
    direct lightning strike to the Lima WWTP on July 22, 2017 be excused and that any stipulated penalties
    be waived. The July 31, 2017 letter is the underlying incident report detailing the lightning strike,
    resulting loss of power and discharge to the Ottawa River, and the remedial measures taken to restore
    plant operations.
