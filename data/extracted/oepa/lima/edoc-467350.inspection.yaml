  summary: On July 13, 2016, Ohio EPA conducted a Reconnaissance Inspection at the City of Lima's WWTP
    to observe progress on the new headworks construction project. All components except two of the four
    primary clarifiers were nearly complete, and effluent in the final clarifiers was clear, colorless,
    and odor-free. No significant non-compliance was identified at the time of the inspection, though
    compliance data for 9/1/2015–6/1/2016 showed 2 limit violations, 15 code violations, and 57 reported
    SSO events.
