  summary: Ohio EPA conducted a reconnaissance inspection of the Lima WWTP on July
    25, 2017, to evaluate the facility following a lightning strike and power outage
    on July 22, 2017. The lightning strike damaged the main switchgear, causing loss
    of pumping capability, overflow of final clarifiers and aeration tanks, and rendering
    SCADA inoperable. At the time of inspection, power had been largely restored with
    temporary generators in use, and final effluent to the Ottawa River was clear
    with no noticeable odor.
  note: null
