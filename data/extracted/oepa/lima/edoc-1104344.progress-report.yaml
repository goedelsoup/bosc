  summary: This is the semiannual compliance progress report filed by the City of Lima, Ohio under Paragraph
    33 of the Lima Consent Decree (Case 3:14-CV-02551-JZ) for the period January 1, 2019 through June
    30, 2019, received by Ohio EPA on July 31, 2019. Lima reports that it received approved extensions
    for nitrification tower sampling compliance determination, continued construction on multiple infrastructure
    projects including the Headworks Project and Simmon's Field CSO EQ Basin, and reported 251 SSO and
    55 CSO overflow events as well as three NPDES permit exceedances at Station 001. The CMOM program
    report documents 5.65 miles of sewer cleaning and 6.99 miles of CCTV inspection during the period.
  note: 'Total overflow counts for reporting period: 251 SSO events, 55 CSO events (26 total report locations).
    Overflow Totals Report updated 7/1/2019. CMOM program report also included per Paragraph 19: 29,847
    linear feet (5.65 miles, 5.7% of SSS) cleaned; 36,904 linear feet (6.99 miles, 7% of SSS) CCTV inspected;
    430 manholes inspected. No material problems noted for the period (Clause c: None). No cross-connections
    detected or eliminated (Clause e: None). Signed by Michael H. Caprella, Director of Utilities, City
    of Lima, Ohio.'
