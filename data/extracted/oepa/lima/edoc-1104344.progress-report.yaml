  deadlines_status: Lima was required to sample and analyze effluent from its nitrification towers from
    July 2018 to July 2019 and had until May 31, 2019 to determine if the sampling period was sufficient
    to determine compliance. Lima determined the sampling period was not sufficient, submitted a letter
    requesting an extension on May 30, 2019, and received approval from USEPA and OEPA on June 20, 2019.
  noncompliance_reasons: Lima determined that the nitrification tower sampling period (July 2018–July
    2019) was not sufficient to demonstrate compliance with performance criteria. Lima requested and received
    an approved extension from USEPA and OEPA on June 20, 2019.
  projects:
  - name: Lima Wastewater Treatment Headworks Project
    status: Building and tank construction is complete.
    next_period: Continued seeding of the nitrification towers and performance testing of TSS and BOD.
  - name: CMOM Plan
    status: Lima submitted a plan revision to USEPA on 7/31/18. On 3/1/19 Lima received approval from
      USEPA/OEPA with a stipulation to implement the plan within 30 days. Lima implemented the plan immediately.
    next_period: null
  - name: Asset Management — Phase 1 High Street/Jameson Avenue Sewer Rehabilitation Project
    status: Construction continues. Installation of the 10-inch sanitary sewer is complete. On 2/6/19,
      Lima entered into an engineering contract with Black & Veatch Inc. to design and bid the Phase 2
      Woodward & Grand Avenue Sewer Rehabilitation Project. A project kickoff meeting was conducted on
      2/27/19. Flow metering, sewer cleaning and geotechnical investigation is currently underway.
    next_period: 'HDPE lining of 550 feet of 78-inch and 2,190 feet of 54-inch segmented block sewers
      (Phase 1). For Phase 2: Completion of final drawings and specifications; prepare and issue bid documents;
      award bid and move into the construction phase.'
  - name: Supplemental Environmental Project (SEP)
    status: Project is complete. Maintenance of the project area will continue. A controlled burn of the
      river bank grasses to control invasive grass species was conducted the week of 4/8/19.
    next_period: Maintenance of the project area will continue.
  - name: Simmon's Field CSO EQ Basin
    status: Completion of the diversion structure and the 96-inch diversion pipe; completion of the 54-inch
      force main across the Ottawa River; approximately 75% of base complete; approximately 75% of wall
      structures complete; approximately 40% of roof structure complete; approximately 66% of pump station
      wet well structure complete.
    next_period: Completion of base slab; continued construction of walls and interior support structures;
      continued construction of pump station wet well.
  agency_contacts:
  - January 31, 2019 — Lima submitted to OEPA a strategic plan for the control of Dissolved Hexavalent
    Chromium, as required by NPDES 2PE00000*ND, Part I, C — Schedule of Compliance, B, 2.
  - February 1, 2019 — Lima submitted a Local Limit evaluation and technical justification document, as
    required by NPDES 2PE00000*ND, Part I, C — Schedule of Compliance, C, 1.
  - March 1, 2019 — Lima received a letter from USEPA approving the CMOM Program Plan, as last submitted
    by the City on 7/31/18. Implementation was initiated immediately.
  - March 1, 2019 — Lima received a letter from USEPA approving the CSO Operations Plan, as last submitted
    by the City on 7/31/18. Implementation was initiated immediately.
  - May 30, 2019 — Lima submitted a request to USEPA/OEPA for a one-year extension of the sampling period
    to determine compliance of the nitrification towers with the performance criteria as defined in Appendix
    C of the Consent Decree.
  - June 20, 2019 — Lima received a letter from USEPA approving the request for an extension of the sampling
    period to determine compliance of the nitrification towers with the performance criteria as defined
    in Appendix C of the Consent Decree.
  permit_exceedances:
  - March 19, 2019 — Lima reported an exceedance of the Daily Maximum pH limit at Station 001. This exceedance
    was later determined to be a recording error related to the calibration of the pH probe.
  - May 25, 2019 — Lima reported an exceedance of the residual chlorine limit at Station 001. This occurrence
    was related to the SCADA programming work being done for wet-weather treatment.
  - June 28, 2019 — Lima reported an exceedance of the geometric mean for e-Coli for the month of June
    at Station 001. A line supplying sodium hypochlorite to the contact chambers was discovered to be
    plugged. A new line was installed.
