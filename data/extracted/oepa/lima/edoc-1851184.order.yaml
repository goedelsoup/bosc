  summary: The City of Lima's Director of Utilities, Michael H. Caprella, submitted
    the annual Hexavalent Chromium Control Strategy progress report to Ohio EPA as
    required by NPDES Permit 2PE00000*ND, Part I, C – Schedule of Compliance, B,3.
    The report covers monitoring results from June 2021 through June 2022 for the
    WWTP effluent (Outfall 001) and industrial pretreatment sampling, finding no detectable
    levels of hexavalent chromium in the collection system or treatment plant effluent.
    No updates to the control strategy were required, as all results were below detectable
    limits and the POTW is meeting its permit limits.
  note: This is a compliance correspondence letter (annual progress report) rather
    than a direct enforcement order. The City of Lima is the reporting/respondent
    party; Ohio EPA Northwest District Office and NPDES Permit Unit are the recipients.
    All monitoring results for Outfall 001 show "AA 3.0" (non-detect at 3.0 µg/L method
    detection limit) except one 1/24/22 result of 10.0 (dilution required). Industry
    results similarly show non-detects with some requiring dilution. No PMP sources
    identified; no further remedial actions required.
