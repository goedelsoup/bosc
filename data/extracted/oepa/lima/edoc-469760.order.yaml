  summary: Attorney Stephen P. Samuels of Frost Brown Todd LLC responds on behalf
    of the City to Ohio EPA Northwest District Office's July 11, 2016 letter concerning
    the June 1, 2016 Notice of Violation. The letter transmits a revised SOP for filling
    the hypochlorite tank (effective 2016-07-14, signed by Acting Supervisor Eric
    Markley) and asserts that the City has complied with all NOV requests and that
    the NOV is fully resolved. The SOP governs PPE, tank truck unloading procedures,
    spill response, and chlorine residual sampling at Station 001.
