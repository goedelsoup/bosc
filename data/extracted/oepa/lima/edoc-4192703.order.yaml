  summary: Ohio EPA DSW issued this Notice of Violation to the City of Lima on July
    16, 2026, following an inspection of the Lima WWTP on July 7, 2026. The NOV identifies
    effluent limit violations for low level mercury, E. coli, total suspended solids,
    dissolved oxygen, pH – minimum, CBOD5, and ammonia under NPDES permit 2PE00000,
    with the City in significant noncompliance (SNC) for ammonia. The City is required
    to submit a compliance plan and timeline, along with supporting documentation,
    within 30 days of receipt.
