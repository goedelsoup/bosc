  summary: Ohio EPA grants a time extension to the City of Lima for completion of
    the Cable Road and Hickory Knoll lift station construction projects originally
    listed in the compliance schedule of NPDES permit 2PE00000. Because the permit
    was set to expire February 28, 2015, a formal permit modification was deemed impractical;
    instead, Ohio EPA extended the completion deadline to April 1, 2015, and required
    written notification upon project completion.
  note: Letter is in response to the City of Lima's request dated December 8, 2014.
    Signed by Elizabeth A. Wick, P.E., Environmental Engineer/Section Manager, Division
    of Surface Water, Ohio EPA Northwest District Office. NPDES permit was set to
    expire February 28, 2015.
