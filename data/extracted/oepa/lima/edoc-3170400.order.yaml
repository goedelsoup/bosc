  summary: The City of Lima's Environmental Compliance Manager, David L. Schnipke,
    writes to OEPA-Northwest District requesting a time extension under NPDES Permit
    2PE00000*MD, Part I, C.b for two lift stations (Cable Road and Hickory Knoll)
    that cannot meet the original January 1, 2015 completion deadline due to construction
    difficulties and an easement acquisition issue. The letter requests a new completion
    deadline of April 1, 2015 for those two stations, noting that 11 of 30 total lift
    stations are already complete and all are expected to be finished by April 14,
    2015.
