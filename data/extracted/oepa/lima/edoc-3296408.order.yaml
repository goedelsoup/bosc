  summary: This file contains two letters from the City of Lima, Ohio to OEPA-Northwest
    District. The February 27, 2015 letter (signed by Environmental Compliance Manager
    David L. Schnipke) is a completion notification under NPDES Permit 2PE00000*MD,
    Part I, C.b, confirming that upgrades to the Hickory Knoll and Cable Road sanitary
    lift stations — for which OEPA had granted an extension on January 29, 2015 —
    are now fully complete ahead of the revised April 1, 2015 deadline. The February
    24, 2015 letter (signed by WWTP Supervisor Russell C. Bales) is a correction/notification
    letter reporting a dry weather by-pass at McDonald CSO Structure 004 on January
    4, 2015, where a gate operator failure caused approximately 12.23 MG of sewage
    to discharge to the Ottawa River, with repairs and temporary preventive measures
    underway.
