  summary: This is a February 24, 1995 transmittal letter from Gary Sheely, Director of Utilities for
    the City of Lima, Ohio, to Ms. Elizabeth Wick, Enforcement Group Leader at Ohio EPA NWDO, enclosing
    three copies of the City of Lima General Plan for Abatement of Sanitary Sewer Overflows as required
    by the Director's Final Findings and Orders dated February 25, 1994. The report was prepared by URS
    Consultants, Columbus, with input from City of Lima officials and staff.
  note: The City of Lima's 1995-02-24 letter to Ohio EPA enclosing the General Plan the 1994-02-25 DFFO
    ordered. A submittal made UNDER an order does not supersede it — the DFFO stayed in force, and the
    2005 U.S. EPA order found 36 SSO points still discharging a decade later.
