  summary: This is a May 26, 2017 correspondence letter from the City of Lima, Ohio
    (signed by the Director of Utilities) to U.S. EPA Region 5, DOJ, and the Ohio
    Attorney General, responding line-by-line to USEPA's April 3, 2017 letter conditionally
    approving Lima's CMOM Program Plan (a Consent Decree requirement under Case 3:14-CV-02551-JZ,
    entered January 13, 2015). The letter addresses requested modifications across
    multiple CMOM sections—including hydrogen sulfide monitoring, emergency preparedness,
    maintenance scheduling, sewer cleaning/CCTV inspection, capacity evaluation, and
    rehabilitation—and commits to submitting a revised CMOM Program Plan and all requested
    reports within 30 days.
