  summary: This is a follow-up correspondence from Ohio EPA's Northwest District Office,
    Division of Surface Water, responding to the City of Lima's June 15, 2016 reply
    to a June 1, 2016 Notice of Violation (NOV) related to a Sodium Hypochlorite Incident
    at the Lima WWTP. The letter constitutes a partial resolution of the NOV and requests
    that the City submit a revised SOP for filling the sodium hypochlorite tank within
    14 days, addressing two specific corrections. Failure to comply may result in
    administrative or civil penalties under Ohio Revised Code Chapter 6111.07.
  note: Letter signed by Peggy B. Christie, Division of Surface Water, Northwest District
    Office. Re line references NPDES and Allen County. The permit number field "2PE00000"
    appears in the Re line as an identifier. The 14-day deadline from July 11, 2016
    resolves to approximately July 25, 2016. The document is titled "Partial Resolution
    of Violation," indicating the NOV is not fully closed.
