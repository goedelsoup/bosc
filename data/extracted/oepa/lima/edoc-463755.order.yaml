  summary: This is a follow-up correspondence from Ohio EPA's Northwest District Office, Division of Surface
    Water, responding to the City of Lima's June 15, 2016 reply to a June 1, 2016 Notice of Violation
    (NOV) related to a Sodium Hypochlorite Incident at the Lima WWTP. The letter constitutes a partial
