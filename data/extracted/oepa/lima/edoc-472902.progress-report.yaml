  summary: This is the semiannual compliance progress report filed by the City of Lima, Ohio under Paragraph
    33 of the Lima Consent Decree (Case 3:14-CV-02551-JZ) for the reporting period January 1, 2016 through
    June 30, 2016, received by Ohio EPA on August 1, 2016. The report documents progress on six ongoing
    projects including the Headworks Project, Upstream Regulator Project, and the completed SEP, and self-reports
    two NPDES permit exceedances (TSS and Total Residual Chlorine), 40 SSO and 16 CSO overflow events
    all attributable to rainfall, 5 Water-in-Basement events, and one accidental Sodium Hypochlorite discharge
    that resulted in an NOV now resolved. CMOM sewer cleaning, CCTV inspection, and rehabilitation activities
    are also reported for the period.
