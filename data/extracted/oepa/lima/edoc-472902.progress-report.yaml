  projects:
  - name: Lima Wastewater Treatment Headworks Project
    status: 'Construction commenced July 1, 2015. Two bar screens in service, two bar screens in progress;
      Primary tanks #1 and #2 completed (expected service date 8/1/16); Aerated grit tanks #1 and #2 completed
      (expected service date 8/1/16); Primary sludge pump station complete (expected service date 8/1/16);
      Secondary effluent pump station construction in progress; Chlorine contact chamber construction
      in progress.'
    next_period: See attached Gantt chart for anticipated progress in the next 6 months.
  - name: Upstream Regulator Project
    status: 'Installation of all sanitary sewers, storm sewers, manholes and catch basins is complete.
      All curb and gutter repair, street resurfacing and landscaping is complete. Work items expected
      to be completed during the reporting period include the weir wall modification at CSO #38 and planting
      of 12 trees in Faurot Park. Project is approximately 98% complete and is on schedule.'
    next_period: Full operation by June 30, 2017.
  - name: CMOM Plan Development
    status: CMOM plan was submitted to USEPA and OEPA on July 10, 2015. Lima has not received a response
      from the agency on the submittal.
    next_period: Lima will implement the plan within 30 days of agency approval.
  - name: Asset Management
    status: Flow meters installed at intersection of High Street and Rosedale Avenue and High Street and
      Cole Street for two months beginning 2/18/16. On 4/4/16, City cleaned and inspected 2,172 feet of
      54" sewer and 550 feet of 78" sewer on High Street and Jameson Avenue. On 6/2/16, rain gage data
      from WWTP sent to MWH to further calibrate hydraulic model.
    next_period: Completion of final design and development of bid documents for Phase 1 Rehabilitation
      project.
  - name: Supplemental Environmental Project (SEP)
    status: City contracted with Geosyntec Consultants, Ann Arbor, Michigan, to complete the environmental
      components. Project completed on time by June 30, 2016.
    next_period: null
  - name: Simmon's Field CSO EQ Basin
    status: City authorized a contract with MWH Engineers on 2/8/16 for a preliminary engineering study.
      A kick-off meeting was conducted on 4/5/16.
    next_period: null
  agency_contacts:
  - March 1, 2016 -- Underground Utilities, on behalf of the City of Lima and as part of the Upstream
    Regulator Sewer Separation Project, received authorization from OEPA to conduct construction activity
    at the Collett Street City Dump site pursuant to OAC 3745-27-13.
  - March 17, 2016 --- Lima received a Preliminary Compliance Review Letter from OEPA indicating a weekly
    average limit violation for TSS at Station 604.
  - March 18, 2016 --- Lima submitted a response letter to OEPA concerning the weekly average limit violation.
  - April 25, 2016 --- Lima submitted a letter of explanation to OEPA concerning a potential accidental
    discharge of Sodium Hypochlorite from the WWTP on April 14, 2016.
  - April 27, 2016 --- Lima received a Fact Sheet and NPDES Draft permit from OEPA for an initial 14-day
    review.
  - May 12, 2016 --- Lima submitted a follow-up letter to OEPA concerning the Sodium Hypochlorite discharge.
  - May 23, 2016 --- Lima submitted a letter to OEPA containing its preliminary comments to the draft
    NPDES permit.
  - June 1, 2016 --- Lima received an NOV letter from OEPA concerning the Sodium Hypochlorite discharge.
  - June 6, 2016 --- Lima submitted a notification letter to OEPA informing of a daily maximum limit exceedance
    of Total Residual Chlorine at Station 001.
  - June 10, 2016 --- Lima submitted a letter to OEPA requesting a change in the Operator of Record at
    the WWTP.
  - 'June 15, 2016 --- Lima submitted a response letter to OEPA concerning the June 1 Sodium Hypochlorite
    NOV. Note: subsequent letter from OEPA on July 11, and a response by the City on July 25; NOV is now
    resolved.'
  permit_exceedances:
  - February 2016 --- Lima's WWTP had an exceedance of the weekly average limit of 20 mg/l for Total Suspended
    Solids at Station 604. Lima recorded an average of 25.47 mg/l for the week of February 21-28, 2016.
    This exceedance was due to a significant rain event on 2/24/16; high flows from the rain event, in
    conjunction with headworks construction underway at the plant, limited capacity to process suspended
    solids.
  - June 6, 2016 --- Lima's WWTP had an exceedance of the daily maximum limit of 0.02 mg/l for Total Residual
    Chlorine at Station 001. Lima recorded 0.3 mg/l. This exceedance was due to inadequate adjustment
    of the chlorine feed rate as flows decreased following a rain event. Operator training measures have
    been instituted.
