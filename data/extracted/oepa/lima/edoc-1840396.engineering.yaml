  key_features:
  - City of Lima requests continuance of mercury variance (3.7 ng/L) in NPDES permit
    renewal as it cannot consistently achieve the water quality based limit of 1.3
    ng/L
  - 2021 annual average effluent mercury of 0.80 ng/L is below the current permit
    limit of 3.7 ng/L; May 2021 result of 3.08 ng/L was the only exceedance of 1.3
    ng/L target
  - Influent mercury ranged widely from 3.57 to 145.00 ng/L over the monitoring period
    (Apr 2021–Apr 2022)
  - No mercury violations cited for any of the 19 monitored industries in 2021
  - Mercury recycling program operated in cooperation with Allen County Solid Waste
    Management, Allen County Homeland Security, and Bowling Green State University/OEPA
  - All medical and dental facilities in the inventory listed as 'Have not inspected
    yet' with no annual reports submitted
  - Biosolids mercury average of 0.300 mg/kg in 2021; analysis by Alloway Testing
    using Method SW7471A
  - PMP initially submitted 6/6/2007; this is the 2021 annual report covering 1/1/2021–12/31/2021
  - Signed by Michael H. Caprella, Director of Utilities, on 3/2/22
  summary: This is the City of Lima WWTP's 2021 Annual Mercury Pollutant Minimization
    Program (PMP) Report submitted to Ohio EPA under NPDES Permit 2PE00000*ND. The
    report documents influent, effluent, and biosolids mercury monitoring data for
    calendar year 2021, demonstrates continued compliance with the current permit
    limit of 3.7 ng/L (with one near-exceedance in May 2021 at 3.08 ng/L), and formally
    requests renewal of the mercury variance at 3.7 ng/L in the next NPDES permit
    because the water quality criterion of 1.3 ng/L cannot yet be consistently achieved.
    The report also inventories medical and dental facilities within the service area,
    all of which have not yet been inspected, and describes the city's mercury recycling
    partnerships.
  note: null
