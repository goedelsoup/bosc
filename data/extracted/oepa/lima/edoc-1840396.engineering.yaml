  warnings:
  - The document header on pages 6–10 reads 'IV. Dental Facility Inventory and Compliance
    Evaluation' but the content clearly includes Section III medical facility listings
    — this appears to be a form printing/labeling issue; medical facilities are recorded
    as such.
  - Jan 2021 and Apr 2021 biosolids concentrations are blank (not reported); May,
    Dec 2021 also blank — averages computed from available months only.
  - Jan and Feb 2021 effluent results shown as 'AA 0.50' (at or below analytical method
    detection limit); Apr 2021 effluent also 'AA 0.50'.
  - Influent/effluent data table in the cover letter (page 2) covers Apr 2021–Apr
    2022 while the PMP analytical data table (page 5) covers Jan–Dec 2021 — these
    are two overlapping but distinct datasets.
