source_text_excerpt: "\n\n \n \n \n \n \n \n \n \n \n \n \n \n \n \nThe City of Lima\
  \ coordinates with the Allen County Solid Waste District & Allen County \nHomeland\
  \ Security personnel to collect mercury from industries, schools, and citizens \n\
  and make certain it is properly contained and transported to a recycling center.\
  \  \n  \nThe City of Lima monitors 19 industries at least once a year for mercury\
  \ .  No industries \nwere cited for a mercury violation in 2021.  There were no\
  \ mercury violations in 2021 at \nthe Wastewater Treatment Plant.  The month of\
  \ May did have a 3.08 ng/l mercury effluent \nresult.  This test result would support"
