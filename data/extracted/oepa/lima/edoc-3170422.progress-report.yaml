  summary: This is the semiannual compliance progress report filed by the City of Lima, Ohio under Paragraph
    33 of the Lima Consent Decree (Case 3:14-CV-02551-JZ) for the period July 1, 2016 through December
    31, 2016. Lima reports that its one CD construction deadline (Headworks construction, due July 1,
    2016) was met ahead of schedule, with six active projects in varying stages of completion including
    the Headworks Project, Upstream Regulator (now complete), and Simmon's Field CSO EQ Basin in preliminary
    engineering. Four NPDES permit exceedances and multiple SSO/CSO overflow events (detailed in Attachment
    C) are self-reported for the period.
  note: 'Report received by Ohio EPA N.W.D.O. on January 26, 2017. Signed by Michael H. Prella, Director
    of Utilities, City of Lima, Ohio, and David J. Berger, Lima City Mayor. Counsel: Fred P. Andes (Barnes
    & Thornburg LLP) and Stephen P. Samuels (Frost Brown Todd LLC). CMOM Plan submitted to USEPA and Ohio
    EPA on July 10, 2015 but not yet approved as of this report. Attachment C (SSO & CSO Overflow Totals)
    updated 1/5/17 with Total # of Reports: 17.'
