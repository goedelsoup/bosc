  deadlines_status: July 1, 2016 --- Required Lima to begin construction on the Headworks and Primary
    Clarification Improvements. Lima actually began construction on May 18, 2015 (ahead of deadline).
  noncompliance_reasons: No noncompliance with CD deadlines noted; the Headworks construction deadline
    of July 1, 2016 was met early (construction began May 18, 2015). NPDES permit exceedances occurred
    but are reported separately under clause (e).
  projects:
  - name: Lima Wastewater Treatment Headworks Project
    status: 'Construction commenced July 1, 2015. Items placed in service: Bar screens #3 & #4; Primary
      settling tanks #1 and #2; Aerated grit tanks #1 and #2; Primary sludge pump station; Secondary effluent
      pump station; New Outfall (Station 001) to Ottawa River. Items in progress: Chlorine contact chamber
      construction; Primary settling tanks #3 and #4 construction; Primary scum screen; Drainage pump
      station; Chemical Feed building for sodium hypochlorite / sodium bisulfite; Aerated grit tanks #3
      & #4.'
    next_period: See Attachment A (Gantt chart) for anticipated progress in next 6 months.
  - name: Upstream Regulator Project
    status: In full operation on September 21, 2016. Final punch-out items including as-built drawings
      completed on November 30, 2016.
    next_period: null
  - name: CMOM Plan Development
    status: CMOM plan submitted to USEPA and OEPA on July 10, 2015. Lima has not received a response from
      the agency on the submittal.
    next_period: Lima will implement the plan within 30 days of agency approval.
  - name: Asset Management
    status: Final design documents nearing completion; development of bid documents for Phase 1 Rehabilitation
      of the Segmented Block Sewers is in progress. Survey work completed in November 2016.
    next_period: Completion of the bid documents expected in the next six months.
  - name: Supplemental Environmental Project (SEP)
    status: Lima submitted a final report via Geosyntec Consultants on June 30, 2016. Lima received a
      response letter from USEPA on December 15, 2016 indicating the SEP cannot be considered successfully
      completed at this time.
    next_period: USEPA requests Lima to submit a Revised SEP Completion Report by January 31, 2018. USEPA
      also requests an interim letter of notification within 30 days of the replanting of 213 trees.
  - name: Simmon's Field CSO EQ Basin
    status: City under contract with MWH Engineers for preliminary engineering. Four progress meetings
      occurred in the reporting period. Basis of Design document submitted on December 22, 2016.
    next_period: Submittal of 30% and 60% design drawings expected. A Phase II Environmental Site Assessment
      is also expected to be performed.
