  confidence: high
  warnings:
  - CLAUSE (f) IS AGGREGATED HERE, NOT ENUMERATED — 2 discharge_events for a period this report totals
    as the period's overflow totals. That is a property of the DOCUMENT, not a truncated read. The per-outfall
    table is present but is a scan of an embedded spreadsheet and its text layer is badly garbled ("Da!e
    Dr." for Dale Dr., "SSQ" for SSO, outfall ids running together with counts). Transcribing those rows
    would have invented outfall identifiers and event counts, so the aggregate the report states in prose
    is recorded instead and the rows are not. Prefer omission over invention.
  - TO GET THE PER-OUTFALL ROWS, read the page images rather than the text layer — the same hazard and
    the same remedy as the consent decree's rotated Table A.1 (#2075). Sibling reports in this series
    (edoc-3170035, 2710558, 1104344, 1294257, 1611092) DO enumerate, at 49-54 events each, because their
    tables carry a clean text layer. The difference between 3 events and 50 in this genre is the scan
    quality, never the plant's behaviour — do NOT read a low discharge_events count as a quiet half-year.
