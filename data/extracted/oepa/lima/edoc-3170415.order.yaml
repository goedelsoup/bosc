  summary: This is an Initial Pollution Incident Report (IPIR) filed on 07/26/2016 documenting a sewage
    overflow/bypass at the Lima WWTP (Allen County, NW District) that occurred on 07/25/2016 at 23:00.
    The cause was a power failure during ongoing construction, resulting in sewage discharge to the Ottawa
    River (surface water/storm media). The incident was reported by the facility's Environmental Manager,
    Dave Schnipke, and DSW/WW was notified the following morning.
