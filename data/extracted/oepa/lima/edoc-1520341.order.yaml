  summary: 'Ohio EPA Director Laurie A. Stevenson approved the City of Lima''s request
    for a reduction in minimum staffing requirements at the Lima WWTP (NPDES #2PE00000),
    pursuant to OAC Rule 3745-7-04(C)(3)(a)(i). The approved reduction allows staffing
    to be reduced to 20 hours per week, provided a Class IV Wastewater operator of
    record is physically present 5 days per week. If the conditions of the approved
    operating plan are not met, the facility must immediately return to full minimum
    staffing requirements.'
