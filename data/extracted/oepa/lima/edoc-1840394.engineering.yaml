  key_features:
  - Process flow diagram (Figure 1-2) from the O&M Manual for the City of Lima, Ohio
    Wastewater Treatment Plant
  - Influent received from North Sewer and South Sewer via MH-17 and two influent
    structures
  - Septage accepted from truck unloading station
  - 'Preliminary treatment: Screening and Grit Removal (Hydrogritter)'
  - 'Primary treatment: Primary Settling with Primary Sludge Pump Station'
  - 'Secondary treatment: Aeration, Secondary Settling, Secondary Sludge Pump Station,
    Nitrification Towers'
  - Disinfection with Sodium Hypochlorite; Dechlorination with Sodium Bisulfite before
    Ottawa River outfall
  - Ferrous Chloride addition at four alternate points for phosphorus removal
  - Polymer addition at multiple points including Primary Effluent Pump Station and
    Dewatering
  - 'Sludge processing train: Sludge Thickening → Digestion → Dewatering → Class A
    Sludge Processing → Bio Solids Storage → Land Application'
  - Sludge Thickener Bypass provision shown as dashed line
  - Return sludge loop from Secondary Sludge Pump Station back to Aeration
  summary: This record is Figure 1-2 from the City of Lima, Ohio Wastewater Treatment
    Plant Operations & Maintenance Manual, prepared by Jones & Henry Engineers, Ltd.
    It presents a complete process flow diagram for the municipal WWTP, illustrating
    the full liquid and solids treatment trains from influent screening through biological
    treatment, disinfection/dechlorination, and discharge to the Ottawa River. The
    solids train proceeds through thickening, digestion, dewatering, Class A sludge
    processing, bio-solids storage, and land application, with multiple chemical addition
    points (Ferrous Chloride alternates, Polymer, Sodium Hypochlorite, Sodium Bisulfite,
    Lime, Alkaline Material) shown throughout.
