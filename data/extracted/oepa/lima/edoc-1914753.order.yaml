  status: closed
  summary: This August 1, 2016 letter from Ohio EPA's Division of Surface Water, Northwest District Office,
    confirms that the City of Lima WWTP has resolved all violations identified in the June 1, 2016 Notice
    of Violation (NOV), following the City's July 25, 2016 response that included a revised SOP for filling
    the sodium hypochlorite tank. Ohio EPA notes that administrative or civil penalties under ORC Section
    6111 may still be sought but have not yet been assessed. The letter effectively closes the compliance
    matter raised by the June 2016 NOV.
  note: 'A Resolution of Violation letter CLOSES a sequence; it imposes nothing. The obligations list
    is therefore empty by design, not by omission. The chain it closes: Ohio EPA NOV 2016-06-01 -> the
    City''s 2016-06-15 response -> Ohio EPA Partial Resolution of Violation 2016-07-11 -> the City''s
    2016-07-25 response through counsel (Frost Brown Todd) enclosing a revised Standard Operating Practice
    for filling the sodium hypochlorite tank -> this letter. The SOP submission is a COMPLETED act the
    letter acknowledges receiving, not a future deadline.'
