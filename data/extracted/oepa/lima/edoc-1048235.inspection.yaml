  observations:
  - kind: finding
    text: Sewage sludge at the Lima WWTP is treated in anaerobic digesters. Methane gas produced during
      digestion powers two micro-turbines generating electric power and heat. Digested sludge is dewatered
      with belt filter presses and mixed with lime and fly ash using the N-Viro Process. Temperature and
      pH of the blended material is monitored over a 72-hour period to ensure EQ biosolids treatment requirements
      for pathogen reduction and vector attraction reduction are met. Once compliance is documented, biosolids
      are stored at the WWTP before being released to Lima Compost/Wright Mulch for distribution for beneficial
      use.
    number: null
    deadline: null
  - kind: finding
    text: EQ biosolids are no longer being transferred to the Lima Compost Facility (regulated under SMP
      No. 2MP00014) for storage or blending with compost, wood chips and dirt. Lima Compost is now distributing
      all EQ biosolids from storage areas at the Lima WWTP directly to farmers for beneficial use on farm
      fields. The City is providing copies of biosolids monitoring results to Lima Compost/Wright Mulch
      to meet permittee NANI requirements of OAC 3745-40-05(A). The City is no longer receiving copies
      of biosolids end user reports from Lima Compost.
    number: null
    deadline: null
  - kind: recommendation
    text: Ohio EPA requests that the City of Lima review the new record keeping requirements of the sludge
      rules (OAC 3745-40-09(C)(1)(a)–(f) for permittees and OAC 3745-40-09(C)(2)(a)-(g) for beneficial
      users) with their distribution contractor Lima Compost and the beneficial users of Lima's EQ biosolids,
      to ensure that required records will start being maintained and available at the Lima WWTP for review
      during Ohio EPA compliance inspections. Please submit a written response to Mr. Gall's attention
      at the NWDO indicating how Lima WWTP and their biosolids contractor and beneficial users will comply
      with the new record keeping requirements of Ohio's Sewage Sludge rules.
    number: null
    deadline: null
  summary: On April 4, 2019, Ohio EPA inspectors visited the City of Lima WWTP to evaluate compliance
    with Ohio's Sewage Sludge Rules (OAC Chapter 3745-40). The inspection found that EQ biosolids are
    no longer transferred to Lima Compost for blending but are now distributed directly to farmers from
    WWTP storage, and that the City is no longer receiving end-user reports from Lima Compost. Ohio EPA
    requested that the City review new record-keeping requirements under updated Sewage Sludge rules (effective
    December 1, 2018) with its distribution contractor and beneficial users, and provide a written response
    describing how compliance with those requirements will be achieved.
  note: null
