  summary: This is the semiannual compliance progress report filed by the City of Lima, Ohio under Paragraph
    33 of the Lima Consent Decree (Case 3:14-CV-02551-JZ) for the reporting period July 1, 2018 through
    December 31, 2018. Lima reports that all identified deadlines were met, with five named capital and
    program projects underway, including the Simmon's Field CSO EQ Basin under active construction. The
    report identifies two NPDES permit exceedances, one WIB event, and 146 total SSO/CSO overflow events
    during the period, as detailed in the attached Overflow Totals Report.
  note: 'Report received by Ohio EPA N.W.D.O. on FEB 04 2019. Signed by Michael H. Caprella, Director
    of Utilities, City of Lima, Ohio. Attachment includes SSO & CSO Overflow Totals for July 1 – December
    31, 2018 and a Gantt chart (Peterson Construction Company, Lima CSO Classic Schedule Layout). Secondary
    ID stamped: 2PF00000 (partially legible).'
