  deadlines_status: (1) July 1, 2018 --- Lima was required to submit a WWTP Flow Maximization Plan. Lima
    submitted the plan on June 28, 2018 (submitted early, in compliance).
  noncompliance_reasons: None stated. All identified deadlines were met (WWTP Flow Maximization Plan submitted
    June 28, 2018, before the July 1, 2018 deadline).
  projects:
  - name: Lima Wastewater Treatment Headworks Project
    status: Commenced construction July 1, 2015. Building and tank construction is complete.
    next_period: Continuation of seeding of the nitrification tower and performance testing of the tower
      for TSS and BOD removal.
  - name: CMOM Plan
    status: Lima submitted a plan revision to USEPA on 7/31/18 that included changes requested by Mr.
      Todd Brown in an email dated 3/20/18.
    next_period: null
  - name: Asset Management — Phase 1 High Street/Jameson Avenue Sewer Rehabilitation Project
    status: Contract documents signed and Notice-to-Proceed issued 7/17/18. Field activities commenced
      9/18/18. Progress includes dye-water testing of laterals and installation of the first manhole.
    next_period: Complete installation of 10-inch PVC sanitary sewer and manholes on High Street between
      N. Rosedale and N. Jameson; begin HDPE lining of the 78-inch and 54-inch segmented block sewers.
  - name: Supplemental Environmental Project (SEP)
    status: Project is complete. Maintenance of the project area will continue with the possibility of
      a spring burning.
    next_period: Continued maintenance; possibility of spring burning.
  - name: Simmon's Field CSO EQ Basin
    status: Excavation of soil and rock to base elevation complete; diversion structure and partial completion
      of 96-inch diversion pipe; partial completion of pump station wet well; completion of bridge over
      Ottawa River for future force main; completion of rock anchor installation; partially completed
      base slab; initial framing of wall structure.
    next_period: Completion of base slab; continued construction of walls and interior support structures;
      continued construction of pump station wet well; continued construction of 96-inch diversion pipe.
      See attached Gantt chart for more detailed activities.
  agency_contacts:
  - July 31, 2018 --- Lima submitted to USEPA and OEPA a revised CMOM Plan and CSOOP that included changes
    requested in a letter from USEPA on 3/20/18.
  - September 21, 2018 --- Lima submitted to OEPA a CSO Public Notification Plan.
  - October 5, 2018 --- Lima submitted a SSO 5-day Follow-up Report to OEPA concerning the failure of
    a check valve at the Mumaugh Road Lift Station that occurred on 10/4/18.
  - October 11, 2018 --- Lima submitted a revised CSO Public Notification Plan that addressed changes
    requested by OEPA in a comment letter dated 9/27/18.
  - October 19, 2018 --- Lima received a letter of approval from OEPA for the CSO Notification Plan.
  permit_exceedances:
  - July 7, 2018 --- Lima recorded 'AD' values for overflow volume at Stations 002 and 003. The sensors
    were in the process of being replaced and reprogrammed. That work has been completed.
  - August 23, 2018 --- Lima submitted a response letter to OEPA in reference to an exceedance of mercury
    and ammonia at Station 604, as identified on the Preliminary Compliance Report dated 8/21/18.
