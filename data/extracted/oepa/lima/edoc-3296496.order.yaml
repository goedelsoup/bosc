  summary: This Ohio EPA Emergency Response Section Initial Pollution Incident Report
    (IPIR), dated 7/14/2016 and assigned Spill ID 1607-35-1349//0, documents a citizen
    complaint received on 07/13/2016 alleging that RAILTECH, located at 25 Interstate
    Drive in Napoleon (Henry County), OH, is repeatedly dumping glycol directly into
    a nearby creek and across railroad tracks into a pond behind a hospital during
    tank-cleaning operations. The product spilled is glycol; affected media include
    surface water/storm water and land. The report was referred to DSW/WW and RRS/SIS
    for follow-up.
