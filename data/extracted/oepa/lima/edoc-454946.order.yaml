  summary: This is a June 15, 2016 response letter from Frost Brown Todd LLC (attorneys
    for the City of Lima) to Ohio EPA's Northwest District Office, written in reply
    to a Notice of Violation dated June 1, 2016, concerning the loss of approximately
    2,500 gallons of sodium hypochlorite (NaOCl) at the Lima WWTP on April 12–14,
    2016. The City disputes each of the six alleged violations on legal grounds but
    commits to implementing protocol changes, encloses an incident investigation report,
    and provides an adopted SOP to prevent recurrence. No civil penalty is assessed
    in this document; it is a respondent's correspondence rather than an agency enforcement
    order.
