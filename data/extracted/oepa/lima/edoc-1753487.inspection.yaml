  - kind: finding
    text: At the time of inspection, final effluent was slightly turbid and light brown with no noticeable
      odor.
    number: '1'
    deadline: null
  - kind: finding
    text: The plant was operating in wet weather mode, meaning a side stream of primary clarifier effluent
      was being sent to the nitrification tower for secondary treatment and blending with the final clarifier
      effluent.
    number: '2'
    deadline: null
  - kind: finding
    text: Wright Mulch/Lima Composting is contracted with the city to manage the land application of Class
      A biosolids. The City is required to maintain copies of the beneficial use records and has had problems
      getting these records from Wright Mulch. Wright Mulch is operating without a valid Land Application
      Management Plan. Their plan expired on February 28, 2022, and no renewal application has been received.
    number: '3'
    deadline: null
  - kind: recommendation
    text: Please submit documentation validating that the bypass has been eliminated so it can be removed
      from the permit.
    number: '1'
    deadline: null
  - kind: recommendation
    text: Please develop and implement procedures to ensure that the city complies with the biosolids
      record keeping requirements found in Ohio Administrative Code 3745-40-09 (C)(1).
    number: '2'
    deadline: null
  summary: On February 22, 2022, Ohio EPA conducted a Compliance Evaluation Inspection (CEI) of the Lima
    WWTP, finding the facility operating in wet weather mode with slightly turbid effluent. A significant
    noncompliance finding was recorded, notably that Wright Mulch/Lima Composting — the city's Class A
    biosolids contractor — is operating without a valid Land Application Management Plan, which expired
    February 28, 2022 with no renewal application received. Inspectors also noted ongoing SSO occurrences
    and prior deficiencies in sludge recordkeeping, and issued two recommendations addressing bypass documentation
    and biosolids recordkeeping compliance.
  note: null
