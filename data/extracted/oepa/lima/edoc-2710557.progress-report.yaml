  deadlines_status: January 31, 2018 --- Lima was required to submit a Revised Supplemental Environmental
    Project (SEP) Completion Report. Lima submitted the report on 1/30/18 (one day early — met).
  noncompliance_reasons: None reported. All identified deadlines were met.
  projects:
  - name: Lima Wastewater Treatment Headworks Project
    status: Commenced construction on 7/1/15. Building and tank construction is complete.
    next_period: Continued development of implementation strategy for seeding nitrification towers during
      dry weather to develop biomass suitable for wet weather treatment; continued development of implementation
      strategy for employing primary tank 5-7, effluent pumping, and towers to treat wet weather flows;
      continued development of PLC programming for seeding the nitrification tower and for control of
      wet weather treatment system; continued development of dry weather seeding strategy for towers and
      collection of data.
  - name: CMOM Plan Development
    status: Lima submitted the revised plan to USEPA on 5/26/17. Lima received a request from USEPA on
      3/20/18 to make a revision to the plan and resubmit for approval.
    next_period: Lima will be submitting the plan with the requested revision to USEPA in conjunction
      with this Consent Decree report on 7/31/18.
  - name: Asset Management — Phase I Segmented Block Rehabilitation
    status: Project was bid in January 2018. Benchmark Construction was awarded the contract on 2/14/18
      for $3,250,828. Lima received the PTI from OEPA on 2/20/18. Project start has been delayed due to
      the need to relocate a natural gas line.
    next_period: Commencement of construction and completion of the project.
  - name: Supplemental Environmental Project (SEP)
    status: Project is complete. Lima submitted a Revised SEP Completion Report on 1/31/18. Lima received
      USEPA approval of the revised plan on 6/12/18. Lima is required to maintain the plantings in good
      condition through the life of the Consent Decree.
    next_period: Conduct a controlled burn to control the growth of invasive species of grass and weeds.
  - name: Simmon's Field CSO EQ Basin
    status: City is under contract with Stantec for engineering and construction. Project was re-bid on
      1/31/18 and 2/7/18. Bids opened on 2/22/18. PTI issued on 2/27/18. Project awarded to Peterson Construction;
      official groundbreaking occurred on 5/4/18. Excavation activities to date include removal of approximately
      15 feet of soil within the footprint of the storage basin and installation of fencing and shoring.
    next_period: Continued excavation of soil down to bedrock, then blasting and excavating rock down
      to maximum tank depth; inspection of three underground control structures and replacement as necessary
      of gates, gate stems, motors and operators; excavation for construction of the diversion structure.
      See attached Gantt chart for more detailed activities.
  agency_contacts:
  - January 30, 2018 --- Lima submitted a revised SEP Plan to USEPA.
  - February 20, 2018 --- Lima received PTI from OEPA for construction of a 10-inch sanitary sewer as
    part of the Segmented Block Sewer Rehabilitation Project.
  - March 20, 2018 --- Lima received a request from USEPA on 3/20/18 to make revisions to the CMOM and
    CSO Operations plans and resubmit for approval.
  - February 27, 2018 --- Lima received PTI from OEPA for construction of the CSO EQ Basin.
  - March 22, 2018 --- Lima received notification from OEPA that the proposed new NPDES permit was posted
    for a 30-day public comment period.
  - June 12, 2018 --- Lima received approval of the Revised SEP plan from USEPA, with conditions to maintain
    the plantings in good condition through the term of the Consent Decree.
  - June 14, 2018 --- Lima submitted a SSO 5-Day Follow-up Report to OEPA concerning a force main break
    near the Cable Road Lift Station.
  - June 22, 2018 --- Lima met with OEPA officials in Columbus to discuss unresolved issues with the proposed
    NPDES permit.
