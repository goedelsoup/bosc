  summary: This is Lima's semiannual Consent Decree progress report for the period January 1 through June
    30, 2018, filed under Paragraph 33 of the Lima Consent Decree (Case 3:14-CV-02551-JZ). Lima reports
    it met the one deadline due this period (Revised SEP Completion Report submitted 1/30/18), describes
    progress on five active projects including the Headworks Project, CMOM Plan, Segmented Block Rehabilitation,
    SEP, and Simmon's Field CSO EQ Basin, and notes no NPDES permit exceedances. SSO and CSO overflow
    totals for the period are attached (127 SSO and 11 CSO overflow reports), and one SSO 5-Day Follow-up
    Report was submitted to OEPA for a force main break near the Cable Road Lift Station.
  note: Report received by Ohio EPA N.W.D.O. on July 30, 2018. Signed by Michael H. Cappa, Director of
    Utilities, City of Lima, Ohio. Attachment includes SSO & CSO Overflow Totals (January 1 – June 30,
    2018) and Gantt chart for Simmon's Field CSO EQ Basin project (Peterson Construction Company). OCR
    reads case number as 3:14-CV-02553-JZ in one location and 3:14-CV-02551-JZ in the header reference;
    image shows 3:14-CV-02551-JZ.
