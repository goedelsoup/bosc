method: >-
  Reviewed read of the three documents in the 2DP00130 application package (APP285104563,
  2026-05-13) that #2089 did not reach. #2089 characterised the package's SAMPLING data and cited
  nine of its twelve committed documents; these three carry the conveyance side — who authorised
  the discharge, what the applicant says the flow path is, and how the pipe is actually laid. The
  letter was read from its embedded text layer (a digitally generated PDF); the schematic and the
  site plan are drawings and were read from renders.
source_text_excerpt: >-
  edoc-4116228: "Please allow this letter to serve as a formal written statement from the Allen
  County – American-Bath POTW authorizing the discharge of industrial or other non-domestic
  wastewater from the proposed Project BOSC – Data Center, located near the intersection of Cole
  Street and Beery Road into our sanitary sewer system." / "The applicant must be in possession of
  a valid Indirect Discharge Permit issued by the OEPA prior to the initial discharge of regulated
  wastewater into the sanitary sewer system." edoc-4116227 (entire drawing): "Wastewater Flow
  Schematic — NON-CONTACT COOLING TOWER BLOWDOWN → LIFT STATION; SANITARY FLOW → LIFT STATION;
  LIFT STATION → TO SANITARY SEWER".
action:
  confidence: high
  warnings:
  - >-
    The authorization is the POTW's, not Ohio EPA's, and it says so: it is "provided in
    fulfillment of the requirements for a new permit application" and is expressly "contingent
    upon the applicant's compliance with all applicable federal, state, and local statutes". It
    does not grant, and does not predict, the Indirect Discharge Permit — the letter itself
    requires a valid IDP "prior to the initial discharge".
  - >-
    The flow schematic is an application exhibit, not an engineering drawing. It carries three
    labels and one box. Read it as the applicant's own statement of the flow path, not as
    evidence about equipment that is or is not installed.
  - >-
    The site plan's pipe sizes and structure numbers are transcribed from the drawing's text
    layer, which on a CAD export carries the labels without carrying which line each belongs to.
    The sizes present in the drawing are recorded as a SET below; no size is attributed to a
    named run, because that attribution cannot be made from this read.
  agency: Allen County Sanitary Engineering Department (POTW) / Ohio Environmental Protection
    Agency (permitting)
  program: Indirect discharge (pretreatment) — permit application 2DP00130, APP285104563
  permit_no: 2DP00130
  action: POTW authorization of non-domestic wastewater discharge, filed in support of an
    indirect-discharge permit application
  action_date: '2025-12-03'
  applicant: Bistrozzi LLC
  facility: Project BOSC data center, near Cole Street and Beery Road, Lima, Allen County
  site_address: 4110 N Cole St, Lima, OH 45801
  project_name: Project BOSC — Data Center
  affected_resource: Allen County American-Bath POTW (NPDES 2PH00007) → Pike Run → Ottawa River
  note: >-
    [verified] On 2025-12-03 the Allen County Sanitary Engineer, Brad Niemeyer PE, wrote to
    Jeremey Eisele PE of EMH&T formally authorizing the American-Bath POTW to receive "industrial
    or other non-domestic wastewater" from the Project BOSC data center. The authorization is
    contingent, and it requires the applicant to hold a valid OEPA Indirect Discharge Permit
    before any regulated wastewater is discharged.
    [verified] The applicant's own Wastewater Flow Schematic for that discharge is a single
    junction: non-contact cooling tower blowdown and sanitary flow both enter one lift station,
    and the lift station discharges to the sanitary sewer. No treatment, metering, equalization or
    separation of the two streams is shown anywhere on the drawing.
    [verified] The site plan shows the sanitary connection built in two stages — a TEMPORARY LIFT
    STATION with temporary gravity and force mains, all three annotated "REMOVE AFTER LIFT STATION
    (BY OTHERS) IS OPERATIONAL", alongside a "FUTURE LIFT STATION (BY OTHERS)".
    [open] Because the schematic commingles blowdown with sanitary flow upstream of the only
    measurement point the system has, no monitoring at American-Bath can separate the campus's
    cooling stream from its domestic stream. That is the structural reason the cycles-of-
    concentration work has only a back-solve and the discharge characterisation had to borrow a
    different site's data — but whether any instrument measures the blowdown separately is not
    settled by these three documents.

