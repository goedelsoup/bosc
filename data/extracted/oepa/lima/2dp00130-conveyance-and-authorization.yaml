  pages: 1
  inputs:
  - NON-CONTACT COOLING TOWER BLOWDOWN
  - SANITARY FLOW
  unit: LIFT STATION
  output: TO SANITARY SEWER
  shown_but_absent:
    treatment: none depicted
    metering: none depicted
    equalization_or_storage: none depicted
    stream_separation: none — both inputs enter the same lift station
  finding: >-
    [verified] The entire drawing is two labelled arrows into one box and one arrow out. The
    campus's cooling-tower blowdown and its domestic sewage are commingled at the lift station,
    which is upstream of everything downstream of it.
  bears_on: >-
    The blowdown stream's own volume and chemistry cannot be read off any downstream
    measurement once it is mixed. This is a fact about the filed flow path, not an inference
    about instrumentation; see the open question in `action.note`.

site_plan:
  document: data/documents/oepa/lima/edoc-4116229.pdf
  docid: '4116229'
  pages: 1
  subject: campus sanitary utility layout, Bistrozzi LLC, 4110 N Cole St
  staged_construction:
    temporary_lift_station: >-
      A "TEMPORARY LIFT STATION" is drawn, served by a "TEMP SANITARY GRAVITY MAIN" and a "TEMP
      SANITARY FORCE MAIN". All three temporary elements carry the annotation "REMOVE AFTER LIFT
      STATION (BY OTHERS) IS OPERATIONAL".
    future_lift_station: >-
      A "FUTURE LIFT STATION (BY OTHERS)" is shown. "(BY OTHERS)" is the drawing's own term and
      identifies work outside this contractor's scope; it does not name who.
    reading: >-
      [verified] The sanitary connection is drawn in two stages, a temporary one to be removed
      once a permanent lift station built by another party is operational.
      [open] Which party, under which instrument, and on what schedule, is not on this drawing.
      The BOSC-1A sanitary permit record (DSWPTI-260597 / DSW-7312 and its application) is where
      that would be settled.
  buildings_labelled: [PROP BLDG 1A, PROP HUB]
  sanitary_pipe_sizes_present:
    values_in: [8, 10, 12, 15, 24]
    units: inches
    note: >-
      The set of sanitary-sewer sizes appearing anywhere on the drawing. Deliberately NOT
      attributed to particular runs: the text layer of a CAD export carries the size labels
      without carrying which line each labels, and reading a 24-inch main onto the wrong run
      would be a material error. Attributing them needs a measured read of the drawing geometry.
  also_shown:
  - BADGE and FIRE ACCESS LANE - NO PARKING annotations (site circulation)
  - numbered structures and cleanouts (CO2, CO3, CO8-CO13, and numbered nodes)
  publication_note: >-
    This sheet carries site-circulation detail of the kind the deferred plan sets 4230061/4230062
    were flagged for. It is nonetheless already public: Ohio EPA serves it on its own portal, and
    the `oepa` collection is cleared as a whole. Recorded here so the clearance is a noted
    decision rather than an unexamined consequence of the standing rule.

