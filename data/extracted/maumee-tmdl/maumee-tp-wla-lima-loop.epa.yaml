  proposed_grouped_load_daily_kg: 418.8
  allowance_for_future_growth_metric_tons: 1.4
  facilities: 39
  lima_loop_share_of_grouped_load: >-
    The seven OTTAWA RIVER basin facilities above — Lima WWTP, Shawnee II, Lima Refining, Elida,
    American-Bath (Pike Run), American II (Dug Run) and Cridersville — hold 6.70 MT of the 64.1 MT
    grouped load, 10.5%, of which Lima WWTP alone is 4.0 MT (6.2%). Bluffton is Allen County but
    discharges to Riley Creek in the BLANCHARD basin, so it is listed above for completeness and
    excluded from this subtotal; including it gives 7.17 MT (11.2%). Computed by summing the Table
