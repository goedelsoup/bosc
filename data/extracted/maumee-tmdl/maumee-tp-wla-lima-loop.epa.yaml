general_permit:
  permit_no: OHP000001
  title: General Permit Authorization to Discharge Total Phosphorus from Point Source Facilities
    in the Maumee Watershed under the NPDES
  issued: '2023-11-01'          # printed as the Effective Date on p. 1
  expires: '2028-10-31'
  signed_by: Anne M. Vogel, Director, Ohio Environmental Protection Agency
  facilities_covered: 39
  source: data/documents/oepa/OHP000001.pdf
  cumulative_load_limit:
    part: IV.B
    page: 8
    definition: >-
      "The Cumulative Load Limit is defined as the sum of the Individual Load Limits of all
      facilities authorized under this permit, plus an allowance for future growth."
    allowance_for_future_growth_kg: 1400
    note: >-
      The Director sets the season's specific value and notices it to permittees before each
      season, so the cap is not a fixed number in the permit text.
  compliance_rule:
    part: IV.C
    page: 8-9
    individual_violation: >-
      "For any given season, individual permittees are in violation of their Individual Load
      Limit only if: a. The Cumulative Load exceeds the Cumulative Load Limit and; b. The
      permittee's Individual Load exceeds their respective Individual Load Limit."
    consequence_for_this_record: >-
      An Allen County plant running 68% over its own allocation is not, on this rule, in
      violation of anything unless the whole 39-facility group is also over. That is the
      mechanism, stated by the permit — not a criticism of it.
  season_report:
    part: IV.D
    due: September 1 of each year
    status: '[open] — no Season Report for any Allen County facility is in the corpus. They are
      the records that would say whether American-Bath and Elida are still over. A
      records-request lead.'

# --- the OTHER TMDL: the Ottawa River (Lima Area) near-field allocations -----------------------
# Appendix 5 of the far-field TMDL summarises six approved NEAR-FIELD TMDLs in the basin and
# tabulates their NPDES wasteload allocations. One of them is Lima's own, and it was not in this
# corpus at all before this read.

nearfield_tmdl:
  source: data/documents/maumee-tmdl/Appendix-5-Nearfield-TMDLs-Final.pdf
  table: A5.1 — individual NPDES permitted facilities with total phosphorus wasteload allocations
    from near-field TMDL reports
  pages: A5-1 to A5-3
  read_from: 200 DPI renders of pages 2 and 3 (the text layer truncates a row at the page break)
  report:
    title: Ottawa River Watershed (Lima Area) TMDL Report
    approved_by: U.S. EPA
    approved: '2014-04-15'
    project_area: the Ottawa River mainstem and tributaries
    phosphorus_tmdls_calculated: 7
    npdes_permits_in_the_wla: 10
    major_sources_named: [agriculture, CSOs, point source discharges]
    impairment_quote: >-
      "the enrichment and excess algal production caused diel high and low dissolved oxygen (DO)
      fluctuations (and sometimes high pH values) that were exacerbated by chronic low flow
      conditions"
    url_published_in_appendix: epa.ohio.gov/static/Portals/35/tmdl/OttawaLima_Report_Final.pdf
    in_corpus: false
    lead: >-
      [open] ⚠️ THE REPORT ITSELF IS NOT IN THIS CORPUS. Everything recorded below is Appendix 5's
      SUMMARY of it, which gives the allocations but not their derivation, their critical
      conditions, the seven TMDL segments, or the implementation plan. Ohio EPA publishes it at
      the URL above. Acquiring it is a concrete, cheap, named gap in Lima's own record.
  lima_loop_allocations:
  - facility: Lima WWTP
    permit_no: 2PE00000
    project_area: Ottawa (Lima)
    total_phosphorus_wla: 5.33 kg/day
  - facility: Shawnee No 2 WWTP
    permit_no: 2PK00002
    project_area: Ottawa (Lima)
    total_phosphorus_wla: 2.31 kg/day
  - facility: Columbus Grove WWTP
    permit_no: 2PC00004
    project_area: Ottawa (Lima)
    total_phosphorus_wla: 2.16 kg/day
  - facility: Ada WWTP
    permit_no: 2PB00050
    project_area: Ottawa (Lima)
    total_phosphorus_wla: 0.85 kg/day
  - facility: Cridersville WWTP
    permit_no: 2PB00048
    project_area: Ottawa (Lima)
    total_phosphorus_wla: 0.61 kg/day
  - facility: Lima Refinery
    permit_no: 2IG00001
    project_area: Ottawa (Lima)
    total_phosphorus_wla: 1.58 kg/day
  - facility: PCS Nitrogen Ohio LP
    permit_no: 2IF00004
    project_area: Ottawa (Lima)
    total_phosphorus_wla: 1.25 kg/day
    note: printed TWICE in Table A5.1, identically. Transcribed once; the repetition is the
      source's (so is StoneCo Maumee Quarry's, in the Swan Creek rows).
  - facility: Chemtrade Logistics Inc
    permit_no: 2IF00008
    project_area: Ottawa (Lima)
    total_phosphorus_wla: 0.30 kg/day
    note: not previously in this corpus under any permit number.
  - facility: National Lime & Stone Co Lima Plant No 1
    permit_no: 2IJ00013
    project_area: Ottawa (Lima)
    total_phosphorus_wla: 0.11 kg/day
    note: not previously in this corpus under any permit number.
  - facility: Bluffton WWTP
    permit_no: 2PC00005
    project_area: Blanchard        # Allen County, but the Blanchard near-field TMDL, not Lima's
    total_phosphorus_wla: 119 kg/year
  finding: >-
    [verified] TWO TMDLs REACH THE LIMA LOOP, NOT ONE. The far-field Maumee Watershed Nutrient
    TMDL (2023, Lake Erie western-basin algal blooms) allocates a SPRING-SEASON load; the
    near-field Ottawa River Watershed (Lima Area) TMDL (2014, in-stream aquatic life use)
    allocates a DAILY load. They address different impairments, were approved nine years apart,
    and neither document says the other is superseded. Every Lima-loop facility appears in both.
  comparability_warning: >-
    ⚠️ DO NOT COMPARE 5.33 kg/day AGAINST THE FAR-FIELD TABLE'S "25.9 kg/day" AS IF THEY WERE THE
    SAME KIND OF NUMBER. Appendix 4's daily column is arithmetic, not a limit: its own footnote
    says the daily loads are "equivalent to the total springtime load (March – July) divided by
    the total number of days in the season (153 days)" and that "The total maximum daily load is
    not equivalent to a maximum daily limit". It exists because "The Clean Water Act, as
    interpreted by courts firmly establishes that TMDLs require an expression of daily load".
    (The division is against the UNROUNDED allocation — 4,000/153 is 26.1, not the printed 25.9 —
    so the metric-ton column is the rounded one.)
    What CAN be said, on a common basis: the near-field allocation of 5.33 kg/day is 815 kg across
    a 153-day spring season, against a far-field spring allocation of 4,000 kg — roughly a FIFTH.
    Whether the near-field number therefore binds tighter in practice depends on how each is
    implemented, and only one of the two has a permit instrument in this corpus (OHP000001, for
    the far-field). The Ottawa River (Lima Area) report would answer it; it is not here.
  bears_on: >-
    The near-field TMDL's own stated impairment — DO swings and algal production "exacerbated by
    chronic low flow conditions" in the Ottawa River — is the same low-flow assimilative-capacity
    question the routed water balance screens. That is a documented Ohio EPA finding about this
    reach, from 2014, that the corpus did not previously hold.

group_performance_2024:
  source: data/documents/maumee-tmdl/2024_Maumee_Biennial_Report_Final_clean.pdf
  document: Maumee Watershed Nutrient TMDL Biennial Report, December 2024
  page: 17-18
  season: March – July 2024
  facilities_covered: 39
  cumulative_load_limit_kg_tp: 64170
  allowance_for_future_growth_kg_tp: 1400
  cumulative_load_reported_kg_tp: 43304
  headroom_kg_tp: 20866
  quote: >-
    "The Cumulative Load reported by facilities covered under the general permit for the 2024
    spring season was 43,304 kg-TP (Figure 9), which is 20,866 kg-TP below the Cumulative Load
    Limit."
  finding: >-
    The group bubble had 20,866 kg of headroom in its first reported season, so under OHP000001
    Part IV.C.3 no covered facility was in violation of its individual limit that season —
    including American-Bath and Elida, whichever way their 2024 loads fell.
  note: >-
    The report publishes the group total only, not per-facility 2024 loads, so it neither
    confirms nor refutes a continuing Allen County exceedance.
  unit_note: >-
    The permit's Cumulative Load Limit (64,170 kg) and Table A4.1's "Proposed grouped load"
    (64.1 MT = 64,100 kg) are close but not identical. Both are transcribed as printed; no
    reconciliation between them is asserted, because neither instrument shows its arithmetic and
    the per-facility limits in the permit are rounded.

