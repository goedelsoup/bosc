# ── The CSO construction schedule the modification put in force ───────────────
cso_schedule:
  tag: '[verified]'
  source: data/documents/oepa/van-wert/2PD00006.f8aaad0a.pdf, composite sheets 20–23 (Part I.C)
  what_the_modification_did: >-
    Removed the completed milestones for the CSO Long Term Control Plan Compliance Assistance Plan
    and inserted the new ones. That is its whole operative act: it converts a submitted plan into
    dated, event-coded obligations inside the enforceable part of the permit.
  history:
    ltcp_submitted: 1999
    ltcp_goal: four CSO events or less per typical year
    ltcp_amended: 2011
    completion_evaluation_report: 2022
    finding: goals of the LTCP had NOT been attained; additional control is needed
  compliance_assistance_plan:
    submitted_per_permit: '2025-07-24'
    submitted_per_fact_sheet: '2026-02-02'
    approved: null
    approval_as_printed: '[approval pending]'
    discrepancy_tag: '[open]'
    note: >-
      Two submission dates in the same package (permit Part I.C.1 vs fact sheet composite sheet
      52), and the issued permit still prints the literal placeholder "[approval pending]" where
      the plan's approval date belongs. The instrument that entered the Director's Journal on
      2026-06-30 enforces a schedule derived from a plan it does not record as approved. Which
      submission is operative, and whether an approval has since issued, is `[open]`.
  control_projects:
  - project: Blaine Street interceptor sewer + Town Creek siphon
    purpose: increase conveyance downstream of CSO 004
    pti: DSW-6320, approved 2025-10-12
  - project: Bonnewitz Pump Station weir adjustment
    purpose: maximize storage in the existing 15-MG equalization basin
  - project: raise the CSO 010 overflow weir
    amount: six inches
  milestones:
  - {due: '2026-08-01', event_code: '3099', requirement: begin construction; notify Ohio EPA within 14 days}
  - {due: '2026-10-01', event_code: '1299', requirement: submit the revised 2020 PCCM Plan}
  - {due: '2027-01-01', event_code: '96899', requirement: attain operational level; notify Ohio EPA within 14 days}
  - {due: '2027-03-01', event_code: '21599', requirement: initiate the 24-month PCCM period}
  - {due: '2028-03-01', event_code: '95999', requirement: PCCM progress report (12 months of occurrence, volume, precipitation)}
  - {due: '2029-03-01', event_code: '1599', requirement: conclude PCCM}
  - {due: '2029-06-01', event_code: '34099', requirement: submit the LTCP Completion Evaluation Report}
  watch_item:
    tag: '[open]'
    detail: >-
      The first milestone — begin construction, event code 3099 — falls 2026-08-01, one month
      after the modification took effect. Whether construction began, and whether the 14-day
      notification was filed, is not established by any captured source. This is the single
      highest-value thing to re-check on the next pass: the same permittee's three OTHER CSO
      schedule events have been recorded "unachieved and not reported" since 2024 (see
      `noncompliance.permit_schedule_violations`), so the base rate for this obligation being met
      on time is not good, and it is now testable against a dated deadline.

