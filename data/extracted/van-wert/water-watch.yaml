        ECHO's ComplianceSummary reports QtrsInNC = 12 with a CurrentAsOf of 2026-03-31, i.e.
        against a 12-quarter window. But within those twelve quarters (Qtr1–Qtr12) only ELEVEN
        carry a violation, because 2023-Q4 reads "No Violation Identified". The count of 12 matches
        the THIRTEEN-quarter grid ECHO displays, which extends to the partial quarter ending on the
        extract date. Both figures are recorded; the reconciliation is ours, not ECHO's, and the
        headline to use is "12 of the 13 quarters ECHO displays", never "12 of 12".
  reportable_noncompliance:
    other_violation: [2023-Q2, 2023-Q3]
    reportable_noncompliance: [2024-Q1, 2024-Q2, 2024-Q3, 2024-Q4, 2025-Q1, 2025-Q2, 2025-Q3, 2025-Q4, 2026-Q1]
    none: [2023-Q4]
    note: RNC status runs continuously from 2024-Q1 through 2026-Q1, the last full quarter in the window.
  effluent_exceedances:   # CWAEffluentCompliance; % = share of the quarter's reports exceeding
  - {parameter_code: '31648', parameter: E. coli MTEC-MF, outfall: '001', basis: non-monthly, quarters: {2023-Q2: 4%, 2025-Q3: 4%, 2025-Q4: 4%}}
  - {parameter_code: '00665', parameter: Phosphorus total (as P), outfall: '001', basis: monthly, quarters: {2023-Q3: 13%, 2025-Q3: 30%}}
  - {parameter_code: '00665', parameter: Phosphorus total (as P), outfall: '001', basis: non-monthly, quarters: {2025-Q3: 30%}}
  - {parameter_code: '00530', parameter: Total suspended solids, outfall: '001', basis: monthly, quarters: {2024-Q2: 10%}}
  - {parameter_code: '00530', parameter: Total suspended solids, outfall: '001', basis: non-monthly, quarters: {2024-Q2: 14%, 2025-Q3: 28%}}
  - {parameter_code: '61427', parameter: Acute toxicity — Pimephales promelas, outfall: '001', basis: non-monthly, quarters: {2024-Q3: 10%}}
  - {parameter_code: '61426', parameter: Chronic toxicity — Ceriodaphnia dubia, outfall: '001', basis: monthly, quarters: {2024-Q1: 10%, 2024-Q3: 100%, 2025-Q3: 40%}}
  - {parameter_code: '61942', parameter: pH minimum, outfall: '001', basis: limit violation, quarters: {2024-Q2: LIMIT VIOLATION, 2024-Q3: LIMIT VIOLATION}}
  effluent_exceedances_note: >-
    The list above is the DFR's own quarterly summary, transcribed as ECHO presents it. The
    effluent chart pulled 2026-08-04 pins the two PHOSPHORUS quarters to a month — both are
    September, 2023 and 2025, and both are concentration-only with the loading well inside its
    limit. See `total_phosphorus.measured_load.exceedances_pinned`. The other parameters have not
    been pulled at month resolution.
  permit_schedule_violations:   # CWAPSCompliance — the continuing half of the record
  - schedule_event: CSO Event Report
    violation: Schedule Event unachieved and not reported
    started: '2024-01-01'
    open_through: the current quarter (grid Qtr13, ending 2026-07-24)
    npdes_violation_id: '3674270156'
  - schedule_event: Operation and Maintenance (O&M) Report
    violation: Schedule Event unachieved and not reported
    started: '2024-02-01'
    open_through: the current quarter (grid Qtr13, ending 2026-07-24)
  - schedule_event: Combined Sewer Report
    violation: Schedule Event unachieved and not reported
    started: '2024-06-01'
    open_through: the current quarter (grid Qtr13, ending 2026-07-24)
  - schedule_event: CSO Event Report
    violation: Schedule Event reported late
    period: 2024-01-15 .. 2024-01-25
    resolved: true
  - schedule_event: Combined Sewer Report
    violation: Schedule Event achieved late but reported
    started: '2024-06-01'
    resolved: true
  enforcement:
    inspections: 5
    window: 2021-07-25 .. 2026-03-31
    last_inspection: '2024-05-07'
    last_inspection_type: Pretreatment - Evaluation
    formal_enforcement_actions: 0
    total_penalties: $0
    note: >-
      No formal action, no penalty, over a window containing 30 months of continuously open CSO
      reporting-schedule violations. Recorded as fact, not as an accusation of anything: state
      practice is generally to work a POTW's CSO obligations through the permit rather than
      through enforcement, and the *WD modification is arguably that mechanism operating.
  missing_or_late_dmrs:
    tag: '[verified]'
    label: MISSING
    counts: {2025-Q2: 20, 2025-Q3: 8}
    detail: 20 missing DMRs in June 2025 and 8 in August 2025 (ECHO CWA3YrD80D90Counts).
