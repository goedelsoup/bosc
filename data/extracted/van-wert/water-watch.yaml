        2026 is SIX MONTHS (January-June). Eleven outfall-events through June already exceed all of
        2025 and all of 2024. An outfall-event is one overflow at one outfall; a single storm that
        opens three weirs counts three. The DMR does not report storm events, so the number of
        distinct wet-weather events behind these counts is `[open]`.

    sso_station_300:
      tag: '[verified]'
      detail: >-
        Station 2PD00006300 carries the occurrence parameter (74062) for all 42 months and reports
        NODI "C — No Discharge" in every one of them. It carries no volume parameter at all. So the
        record shows no reported sanitary sewer overflow in the window — a reported absence from a
        permittee with three CSO reporting obligations unmet since 2024, which is worth stating
        plainly rather than reading as a clean bill.

    volume_totals:
      tag: '[inference]'
      what_is_derivable: >-
        A LOWER BOUND only. The DMR reports a monthly-average and a daily-maximum overflow volume;
        it does not report a monthly TOTAL, and the total is not recoverable from the two. The
        obvious reconstruction — monthly average × occurrences — fails against the record: Wall
        Street reported ONE occurrence in May 2026 with a 0.142 Mgal average and a 0.277 Mgal daily
        maximum, which a single-event month cannot produce. So no season or annual total is stated.
      floor_arithmetic: >-
        A month's total is at least that month's reported daily maximum, so summing the daily maxima
        gives a valid floor on the year.
      floor_mgal: {2023: 2.0, 2024: 1.787, 2025: 3.739, 2026: 3.495}
      reading: >-
        At least 2.0 / 1.79 / 3.74 million gallons of combined sewage reached Town Creek in 2023,
        2024 and 2025, and at least 3.50 MG in the first half of 2026 alone. Against a creek whose
        own record puts a dry year's whole yield at 180 MG, the floor for 2025 is about 2% of that
        year — but the floor is a floor, and the true figure is unbounded above by anything in this
        record.
      still_open: >-
        The monthly TOTAL overflow volume per outfall. The instrument that carries it is the City's
        CSO Event Report — which is one of the three permit-schedule obligations recorded "unachieved
        and not reported" continuously since 2024-01-01 (`noncompliance.permit_schedule_violations`).
        The report that would close this gap is the report that is not being filed.

    against_the_ltcp_goal:
      tag: '[open]'
      why_not_a_verdict: >-
        The 1999 LTCP's goal is "four CSO events or less per TYPICAL year" (`cso_schedule.history`),
        and a typical year is a modeled design-precipitation year, not a calendar year. A count of
        DMR-reported overflows in 2023 or 2025 is therefore NOT the test the goal sets, and this
        file does not claim it is. Two further ambiguities the instrument does not resolve: whether
        the four-event goal is per outfall or system-wide, and how a storm opening several weirs is
        counted. What IS established, and by the state's own hand, is that the goal was not attained
        — the 2022 LTCP Completion Evaluation Report says so, and the *WD modification exists
        because of it. The counts above are the reported record, not a re-adjudication of it.
      to_resolve: >-
        The 2022 LTCP Completion Evaluation Report and the typical-year precipitation record it was
        run against; the 2020 PCCM Plan due in revised form 2026-10-01 (event code 1299), which
        defines how occurrence and volume will be measured across the 24-month monitoring period.

    a_gap_the_record_names_itself:
      tag: '[verified]'
      detail: >-
        Main Street (007) reported ONE overflow in April 2026 and reported its volume as NODI "E —
        Failed to Sample/Required Analysis Not Conducted". The overflow is on the record; its
        volume is not, because it was not measured. That is one of the twenty-three reported
        overflow-months in this table, and it falls four months before the construction milestone
        whose whole purpose is to reduce what this table counts.

# ── Phosphorus and the Maumee TMDL ────────────────────────────────────────────
total_phosphorus:
  tag: '[verified]'
  source: data/documents/oepa/van-wert/2PD00006.f8aaad0a.pdf, composite sheet 35 (Part II, AE)
  tmdl: Maumee Watershed Nutrient TMDL Report, approved September 2023
  individual_wla_kg: 1000
  critical_season: March through July
  regulated_through: the Maumee Watershed Total Phosphorus NPDES General Permit (no number printed in the permit)
  corpus_general_permit: data/documents/oepa/OHP000001.pdf
  coverage: granted
  reopener: >-
    "In the event the permittee is no longer covered by the general permit, this individual permit
    may be modified, or revoked and reissued, to incorporate effluent limits consistent with the
    wasteload allocation."
  permit_limits:
    parameter_code: '00665'
    weekly_average_mg_l: 1.5
    monthly_average_mg_l: 1.0
    weekly_average_kg_day: 23
    monthly_average_kg_day: 15
    identical_in_interim_and_final_tables: true
  headroom:
    tag: '[inference]'
    arithmetic: 15 kg/day × 153 days (Mar 1 – Jul 31) = 2,295 kg
    wla_kg: 1000
    ratio: 2.30
    reading: >-
      Held at its own monthly-average loading limit through the whole critical season, the
      individual permit allows 2.30× the phosphorus the Maumee TMDL individually allocated to this
      plant for the same window. That is not a violation — it is the reason Part II.AE routes
      compliance to the general permit instead of to a number in Part I.A, and the reason the
      individual permit carries a reopener. It is a ceiling comparison, not a measured load.
  local_limits_review:
    due: '2026-12-01'
    event_code: '52599'
    target_mg_l: 0.5
    tag: '[verified]'
    detail: >-
      Part I.C.B requires the City to determine whether local industrial-user limits for total
      phosphorus would make substantial progress toward a monthly average effluent concentration
      of 0.5 mg/L — half the permit's own 1.0 mg/L limit — or to submit evidence that local limits
      are not appropriate. Three categorical industrial users discharge 0.176 MGD into this plant.
  measured_load:
    tag: '[verified]'
    source: EPA ECHO eff_rest_services.get_effluent_chart, p_id OH0027910, parameter_code 00665, read 2026-08-04
    regenerate: >-
      One request per (year, parameter code). ECHO accepts exactly ONE parameter_code — a
      comma-separated list silently returns nothing — and the service refused wider windows on
      2026-08-01, so the year is the unit of pull:
      curl -s "https://echodata.epa.gov/echo/eff_rest_services.get_effluent_chart?output=JSON&p_id=OH0027910&start_date=01/01/2025&end_date=12/31/2025&parameter_code=00665"
    coverage: >-
      Outfall 001 Effluent Gross, complete calendar months 2023-01 through 2026-06 — 42 monthly
      periods, no gap. The March-July critical season is therefore complete for 2023, 2024 and
      2025 and four-fifths complete for 2026 (July had not been reported at the read date).
    what_echo_reports: >-
      Four monthly rows per period, two statistics × two limit families. The load rows are
      Quantity1/Quantity2 in kg/d against the permit's 15 and 23 kg/day limits; the concentration
      rows are Concentration2/Concentration3 in mg/L against 1.0 and 1.5 mg/L. The monthly-average
      LOADING row (StatisticalBaseCode MK, kg/d) is the one the seasonal arithmetic uses, because
      it is the only reported figure denominated the same way the TMDL allocation is.

    monthly_average_load_kg_per_day:   # [verified] verbatim, outfall 001, StatisticalBaseCode MK, Quantity1, limit 15 kg/d
      '2023': {Jan: 5.1, Feb: 3.9, Mar: 6.6, Apr: 4.3, May: 4.2, Jun: 3.6, Jul: 3.9, Aug: 5.1, Sep: 6.63, Oct: 3.7, Nov: 4.0, Dec: 4.2}
      '2024': {Jan: 4.7, Feb: 4.7, Mar: 3.6, Apr: 6.2, May: 5.2, Jun: 3.91, Jul: 2.8, Aug: 3.2, Sep: 4.1, Oct: 4.3, Nov: 5.5, Dec: 3.5}
      '2025': {Jan: 4.9, Feb: 3.6, Mar: 6.2, Apr: 4.8, May: 5.8, Jun: 4.9, Jul: 5.1, Aug: 4.2, Sep: 6.38, Oct: 3.95, Nov: 3.7, Dec: 2.6}
      '2026': {Jan: 2.3, Feb: 2.6, Mar: 2.6, Apr: 5.5, May: 3.7, Jun: 5.3}
    monthly_average_concentration_mg_l:   # [verified] verbatim, same rows, Concentration2, limit 1.0 mg/L
      '2023': {Jan: 0.42, Feb: 0.35, Mar: 0.36, Apr: 0.5, May: 0.43, Jun: 0.54, Jul: 0.56, Aug: 0.55, Sep: 1.13, Oct: 0.58, Nov: 0.42, Dec: 0.55}
      '2024': {Jan: 0.58, Feb: 0.36, Mar: 0.33, Apr: 0.33, May: 0.43, Jun: 0.53, Jul: 0.43, Aug: 0.5, Sep: 0.56, Oct: 0.69, Nov: 0.63, Dec: 0.34}
      '2025': {Jan: 0.39, Feb: 0.33, Mar: 0.37, Apr: 0.34, May: 0.35, Jun: 0.57, Jul: 0.83, Aug: 0.7, Sep: 1.3, Oct: 0.73, Nov: 0.72, Dec: 0.53}
      '2026': {Jan: 0.4, Feb: 0.37, Mar: 0.35, Apr: 0.44, May: 0.41, Jun: 0.39}

    critical_season_load:
      tag: '[inference]'
      method: >-
        Monthly-average loading (kg/day, verbatim above) × the calendar days in that month, summed
        over March-July. This is how a seasonal mass load is built from a monthly-average DMR
        series, and it is an INFERENCE for one specific reason: the permittee's monthly average is
        computed over the days it sampled, and extending it across every day of the month assumes
        the sampled days represent the unsampled ones. Nothing else here is derived.
      arithmetic:
        '2023': 6.6×31 + 4.3×30 + 4.2×31 + 3.6×30 + 3.9×31 = 204.6 + 129.0 + 130.2 + 108.0 + 120.9
        '2024': 3.6×31 + 6.2×30 + 5.2×31 + 3.91×30 + 2.8×31 = 111.6 + 186.0 + 161.2 + 117.3 + 86.8
        '2025': 6.2×31 + 4.8×30 + 5.8×31 + 4.9×30 + 5.1×31 = 192.2 + 144.0 + 179.8 + 147.0 + 158.1
        '2026': 2.6×31 + 5.5×30 + 3.7×31 + 5.3×30 = 80.6 + 165.0 + 114.7 + 159.0 (March-June only)
      seasons:
      - {season: '2023', months: 5, load_kg: 692.7, wla_kg: 1000, ratio: 0.693, complete: true}
      - {season: '2024', months: 5, load_kg: 662.9, wla_kg: 1000, ratio: 0.663, complete: true}
      - {season: '2025', months: 5, load_kg: 821.1, wla_kg: 1000, ratio: 0.821, complete: true}
      - {season: '2026', months: 4, load_kg: 519.3, wla_kg: 1000, ratio: null, complete: false,
         note: July not reported at the 2026-08-04 read; no ratio is stated for a partial season.}

    the_finding:
      tag: '[inference]'
      headline: >-
        The measured critical-season load is UNDER the allocation in all three complete seasons —
        0.69×, 0.66× and 0.82× of the 1,000 kg individual WLA. The ceiling comparison this file
        already carried (2.30×) turns out to describe the permit, not the plant.
      reading: >-
        This inverts the premise the pull was made to test. What the record shows is a plant
        discharging roughly a third of what its own permit would allow it to — the worst month in
        forty-two is 6.63 kg/day against a 15 kg/day monthly-average limit, 44% of the limit — and
        staying inside the TMDL's individual allocation without any allocation-denominated limit in
        its permit compelling it to. Part II.AE's deferral to the general permit and its reopener
        are unexercised headroom, not a live gap. That is a finding about THIS plant and does not
        travel: it says nothing about the other Maumee dischargers, nothing about nonpoint load,
        and nothing about whether 1,000 kg was the right allocation.
      but_the_margin_is_narrowing: >-
        0.693, 0.663, 0.821 across the three complete seasons — not a trend on three points with a
        dip in the middle, but 2025 is the highest of them and 24% above 2024, and it is the season
        closest to the allocation. Two more seasons decide whether that is a direction or a wet
        spring; the margin, not the current verdict, is the thing to re-check.
      what_2026_would_take:
        tag: '[inference]'
        arithmetic: 1,000 kg - 519.3 kg (Mar-Jun) = 480.7 kg needed in July; 15 kg/day × 31 days = 465 kg
        reading: >-
          For the 2026 critical season to reach the allocation, July alone would have to carry
          480.7 kg — more than the 465 kg the permit's own 15 kg/day monthly-average loading limit
          allows for a 31-day month, and more than three times the largest July in the record
          (158.1 kg, 2025). So 2026 cannot reach 1,000 kg without simultaneously violating the
          individual permit's loading limit. Bounded, not projected — July's actual figure is still
          `[open]` and is the single value to pull on the next pass.

    exceedances_pinned:
      tag: '[verified]'
      detail: >-
        The chart pins to a MONTH the two quarters the DFR reports as TP exceedances (see
        `noncompliance.effluent_exceedances`), and both fall OUTSIDE the critical season.
      rows:
      - {period: 2023-09, concentration_mg_l: 1.13, limit_mg_l: 1.0, exceedance_pct: 13,
         load_kg_day: 6.63, load_limit_kg_day: 15, violation: 'E90 DMR, Limited - Numeric Violation'}
      - {period: 2025-09, concentration_mg_l: 1.3, limit_mg_l: 1.0, exceedance_pct: 30,
         load_kg_day: 6.38, load_limit_kg_day: 15, violation: 'E90 DMR, Limited - Numeric Violation'}
      also_weekly: 2025-09 weekly maximum 1.95 mg/L against the 1.5 mg/L limit, the same +30%, same E90 code.
      what_it_means:
        tag: '[inference]'
        detail: >-
          Both exceedances are CONCENTRATION exceedances in September, and September sits at the
          bottom of the flow record in both years — the lowest month of 2023 at 1.487 MGD, and the
          second-lowest of 2025 at 1.438 behind October's 1.389, against a 4.0 MGD average design
          flow (see `wastewater_permit.reported_flow`). The loading side
          never exceeded: 6.63 and 6.38 kg/day against a 15 kg/day limit. Neither exceedance is in
          the March-July window the TMDL allocation governs, so neither bears on the WLA
          comparison above. What the pair does show is that the concentration limit binds when the
          creek and the plant are both at their driest — the same months the reach has least
          assimilative capacity.

    caveats: >-
      Three, and they all point the same way. (1) The load is the permittee's own self-monitored
      DMR figure, not an independent measurement, and this permittee's record carries 28 missing
      DMRs in 2025 and three CSO reporting obligations continuously unmet since 2024 — the
      phosphorus series happens to be complete, but it comes from a reporter whose other
      obligations are not. (2) The season-total step assumes the sampled days represent the
      unsampled ones (see `critical_season_load.method`). (3) A cross-check computing load from the
      reported concentration and the reported flow (mg/L × MGD × 3.785) reproduces the reported
      kg/day to a median ratio of 0.94 across 42 months but scatters 0.52 to 1.48, exactly as it
      should — the true load is the mean of daily concentration × flow products, not the product of
      two monthly means. The reported kg/day is used directly and was never back-computed; the
      cross-check confirms the unit chain and nothing more.

mercury_variance:
  tag: '[verified]'
  source: data/documents/oepa/van-wert/2PD00006.f8aaad0a.pdf, composite sheet 32 (Part II, Y)
