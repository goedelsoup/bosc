# ── Phosphorus and the Maumee TMDL ────────────────────────────────────────────
total_phosphorus:
  tag: '[verified]'
  source: data/documents/oepa/van-wert/2PD00006.f8aaad0a.pdf, composite sheet 35 (Part II, AE)
  tmdl: Maumee Watershed Nutrient TMDL Report, approved September 2023
  individual_wla_kg: 1000
  critical_season: March through July
  regulated_through: the Maumee Watershed Total Phosphorus NPDES General Permit (no number printed in the permit)
  corpus_general_permit: data/documents/oepa/OHP000001.pdf
  coverage: granted
  reopener: >-
    "In the event the permittee is no longer covered by the general permit, this individual permit
    may be modified, or revoked and reissued, to incorporate effluent limits consistent with the
    wasteload allocation."
  permit_limits:
    parameter_code: '00665'
    weekly_average_mg_l: 1.5
    monthly_average_mg_l: 1.0
    weekly_average_kg_day: 23
    monthly_average_kg_day: 15
    identical_in_interim_and_final_tables: true
  headroom:
    tag: '[inference]'
    arithmetic: 15 kg/day × 153 days (Mar 1 – Jul 31) = 2,295 kg
    wla_kg: 1000
    ratio: 2.30
    reading: >-
      Held at its own monthly-average loading limit through the whole critical season, the
      individual permit allows 2.30× the phosphorus the Maumee TMDL individually allocated to this
      plant for the same window. That is not a violation — it is the reason Part II.AE routes
      compliance to the general permit instead of to a number in Part I.A, and the reason the
      individual permit carries a reopener. It is a ceiling comparison, not a measured load.
  local_limits_review:
    due: '2026-12-01'
    event_code: '52599'
    target_mg_l: 0.5
    tag: '[verified]'
    detail: >-
      Part I.C.B requires the City to determine whether local industrial-user limits for total
      phosphorus would make substantial progress toward a monthly average effluent concentration
      of 0.5 mg/L — half the permit's own 1.0 mg/L limit — or to submit evidence that local limits
      are not appropriate. Three categorical industrial users discharge 0.176 MGD into this plant.
  measured_load:
    tag: '[open]'
    detail: >-
      What the plant actually discharged in a critical season is not established. ECHO's DFR
      records TP exceedances in two quarters (13% of 2023-Q3 monthly averages, 30% of 2025-Q3 —
      see `noncompliance`), but the loads themselves need the effluent chart, which would not
      respond on 2026-08-01. Pull: eff_rest_services.get_effluent_chart, p_id OH0027910,
      parameter_code 00665, one year per request.

mercury_variance:
  tag: '[verified]'
  source: data/documents/oepa/van-wert/2PD00006.f8aaad0a.pdf, composite sheet 32 (Part II, Y)
  action: renewed, under OAC 3745-1-38(J)
  wqbel_monthly_average_ng_l: 1.3
  achievable_annual_average_ng_l: 12
  multiple: 9.2   # [inference] 12 ÷ 1.3; the gap the variance covers
