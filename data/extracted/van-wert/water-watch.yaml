# ── What to pull next, in priority order ──────────────────────────────────────
instruments_to_pull:
- item: Whether CSO construction began by the 2026-08-01 milestone, and the 14-day notification.
  why: The first enforceable date the *WD modification created; testable now.
  route: Ohio EPA NWDO file review / STREAMS event record for 2PD00006, event code 3099.
- item: The CSO Long Term Control Plan Compliance Assistance Plan itself, and its approval date.
  why: The issued permit prints "[approval pending]" and two different submission dates.
  route: Ohio EPA NWDO; the City of Van Wert Safety-Service Director.
- item: Ohio EPA DSW plan approval PTI DSW-6320 (Blaine Street interceptor + Town Creek siphon).
  why: The engineering instrument behind two of the four control projects; approved 2025-10-12.
  route: Ohio EPA eDocument portal (docs/… — the open scriptable route for Ohio permits).
- item: The Drinking Water Source Protection delineation for PWS OH8100611.
  why: Pins the raw-water intake location and river mile — the one geometry this file leaves open.
  route: Ohio EPA Division of Drinking and Ground Waters.
- item: The City's CSO Event Reports — the monthly TOTAL overflow volume per outfall.
  why: >-
    The DMR reports a monthly-average and a daily-maximum overflow volume and no total, so this
    file can state only a floor (`combined_sewer_overflows.volumes.volume_totals`). The report that
    carries the total is the same CSO Event Report recorded "unachieved and not reported"
    continuously since 2024-01-01 — the gap and the reporting violation are the same object.
  route: Ohio EPA NWDO file review; the City of Van Wert Safety-Service Director.
- item: The July 2026 phosphorus DMR — the last month of the 2026 critical season.
  why: >-
    2026 stands at 519.3 kg through June. July closes the fourth season and tests the upward trend
    across 2023-2025 (0.69× → 0.66× → 0.82× of the allocation).
  route: eff_rest_services.get_effluent_chart, p_id OH0027910, parameter_code 00665, 2026 window; re-run after the August DMR lands.
- item: OHG8P0006 and OH0135569 — the two water-plant NPDES instruments.
  why: Two more permitted discharges on the same reach, neither in the corpus.
  route: Ohio EPA DAM.
- item: The City's CSO Public Notification Plan (2018-08-07) and Consumer Confidence Reports 2023–2025.
  why: The empty public-access-area table and the eight SDWA quarters in noncompliance.
  route: City of Van Wert Utilities; Ohio EPA DDAGW.

