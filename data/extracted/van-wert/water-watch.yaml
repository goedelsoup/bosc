# City of Van Wert (Van Wert County, OH) — standing water watch.
#
# Provenance vocabulary (see docs/investigative-method/ENRICHMENT.md):
#   [verified]  = stated in a captured primary record (cite file + page) or read from a named
#                 federal system on a named extract date
#   [reference] = secondary / self-published source, not a controlling record
#   [inference] = reasoned from verified facts, labelled as such, arithmetic shown
#   [open]      = not established by any captured source — do NOT assert
#
# THE ONE FACT THIS FILE EXISTS TO HOLD: Van Wert drinks Town Creek and discharges to Town Creek.
# Bowling Green's two water sides share a city and nothing else — different rivers, different
# basins, different dockets (data/extracted/bowling-green/water-watch.yaml). Van Wert is the
# opposite case and the network's tightest one. The City's raw-water pump stations, its five
# combined sewer overflows and its wastewater outfall are all on ONE flowline of ONE creek, in
# that order, inside about 4.6 km. There is no second source. There is no other river.
#
# THE ORDER MATTERS AND IS NOT THE OBVIOUS ONE. The intake is UPSTREAM of the CSOs and the WWTP
# outfall, not below them. Nobody is drinking this plant's effluent. What the geometry does mean
# is that every claim on Town Creek's flow — the reservoir refill, the CSO dilution, the effluent
# assimilation — is a claim on the same water, in sequence, and the creek is small enough that in
# a dry year the City's own record says it yields 180 million gallons for the whole year.
#
# Violations below are data with citations, not a gotcha. The quarter that came back clean is
# recorded as such, and the fact that no formal enforcement action has ever issued is recorded at
# the same weight as the 30 months of unmet reporting milestones.
#
# AND THE MEASURED RECORD CUTS AGAINST THIS FILE'S OWN EARLIER READING. The 2026-08-04 pull of the
# effluent chart (issue 1860) replaced two ceilings with measurements, and one of them reversed.
# The permit would allow 2,295 kg of phosphorus across the critical season, 2.30x the TMDL's
# individual allocation — but the plant discharged 693, 663 and 821 kg in 2023, 2024 and 2025, all
# UNDER the 1,000 kg allocated to it. Both figures stay. The ceiling explains why the permit defers
# to a general permit and carries a reopener; the measurement is the answer the ceiling could not
# reach, and it is recorded here at full weight because a watch that only ever confirms its own
# suspicion is not a watch.

meta:
  subject: >-
    Standing watch on the single reach of Town Creek that carries Van Wert's drinking-water
    intake, its five combined sewer overflows and its wastewater outfall — anchored on NPDES
    permit 2PD00006*WD, the CSO Long Term Control Plan construction schedule it put in force on
    2026-07-01, and the Maumee TMDL phosphorus allocation it defers to a general permit
  kind: water-watch
  site: van-wert
  captured_for: issue 1406 (epic 1267, readiness(van-wert)); effluent record added by issue 1860
  extracted_at: '2026-08-01'
  checked_on: '2026-08-04'
  previous_check: '2026-08-01'      # the 1406 pass; before that, the 2026-07-10 discovery sweep
  federal_extract_dates:
    ICIS-NPDES: '2026-07-24'
    SDWIS: '2026-07-09'
  method: >-
    Five routes, run independently and recorded separately. (1) The controlling Ohio EPA
    instruments — the 2PD00006*WD modification package and its draft public notice — pulled from
    the Ohio EPA DAM on 2026-08-01 and transcribed page-by-page from their embedded text layers
    (data/documents/oepa/van-wert/filename-map.yaml; extractions under
    data/extracted/oepa/van-wert/). (2) EPA ECHO: dfr_rest_services.get_dfr for the CWA side
    (OH0027910, and the two water-plant permits OHG8P0006 / OH0135569) and for the SDWA side
    (OH8100611), plus sdw_rest_services.get_systems for the Van Wert County public water system
    index — all read 2026-08-01 against the ICIS-NPDES and SDWIS extract dates above. (3) USGS
    NLDI / NHDPlus v2, snapped 2026-08-01, to establish that the intake, the overflows and the
    outfall are on one flowline and in what order. (4) The City's own Utilities publications for
    the source-water description. (5) EPA ECHO eff_rest_services.get_effluent_chart for OH0027910,
    read 2026-08-04 — the plant's own reported DMR record for total phosphorus (00665), CSO
    occurrence (74062), CSO volume (74063) and effluent flow (50050), sixteen requests, one per
    (calendar year × parameter code). Each federal figure is stamped with the system extract date
    it was read against, because a quarter that reads clean today may only be a quarter whose DMRs
    have not landed.
  effluent_chart_note: >-
    The effluent-chart service refused this permit entirely on 2026-08-01 (read timeouts on a
    three-year window, a 502 Proxy Error on retry, and a year-by-year loop abandoned after
    repeated timeouts), which is why the 1406 pass left the measured load and the CSO volumes
    `[open]`. It answered normally on 2026-08-04 — 3.2 s for a one-year, one-parameter request,
    with one HTTP 429 in sixteen calls that cleared on the connector's own backoff. The failure
    was transient and the year-per-request discipline is kept regardless, because it is what the
    2026-08-01 log recommended and it keeps each committed response reviewable.

# ── What changed, newest first ────────────────────────────────────────────────
# Recorded first because a standing watch is worth having only if it says what moved. The first
# two entries are the 2026-08-04 pass (issue 1860); the rest are the 2026-08-01 pass (issue 1406),
# three of which correct the 1406 issue body's own premises against the primary instruments.
delta_since_previous_check:
- item: The effluent chart answered, and the measured phosphorus load inverts the ceiling reading.
  tag: '[verified]'
  checked_on: '2026-08-04'
  detail: >-
    ECHO's eff_rest_services.get_effluent_chart, which refused this permit across every window on
    2026-08-01, returned normally on 2026-08-04. The plant's own reported March-July loading is
    692.7 kg (2023), 662.9 kg (2024) and 821.1 kg (2025) against the Maumee TMDL's 1,000 kg
    individual allocation — 0.69×, 0.66× and 0.82×. This file's existing headroom figure, 2.30×,
    described what the PERMIT would allow across the season, not what the plant discharged. Both
    are kept: the ceiling comparison is why Part II.AE defers to the general permit and carries a
    reopener, and the measured load is the answer to the question the ceiling could not reach.
    See `total_phosphorus.measured_load`.
- item: The CSO baseline exists now, and the plant's flow record shows routine primary bypass.
  tag: '[verified]'
  checked_on: '2026-08-04'
  detail: >-
    Twenty-three reported overflow-months across the five CSOs, 2023-01 to 2026-06, with per-outfall
    occurrence counts and volumes in Mgal — the pre-construction baseline the 24-month PCCM period
    (2027-03 → 2029-03) will be measured against. 2026 is already at eleven outfall-events through
    June, more than all of 2025 or 2024. Pulled alongside it, outfall 001's reported flow shows a
    daily maximum above the 5 MGD primary-clarifier bypass threshold in 22 of 42 months and above
    the permit's 8.0 MGD peak hydraulic capacity in five. See `combined_sewer_overflows.volumes`
    and `wastewater_permit.reported_flow`.
- item: The *WD modification is in the corpus, and the DAM slot that served the *VD now serves it.
  tag: '[verified]'
  detail: >-
    Ohio EPA re-serves `permits/doc/2PD00006.pdf` IN PLACE. The same URL that delivered the 2025
    *VD renewal on 2026-06-28 delivered the *WD modification package on 2026-08-01 (Last-Modified
    2026-07-02). Both sets of bytes are held under the fetcher's collision rule; the *VD is not
    superseded as a source, because the modification letter states that "all terms and conditions
    of the existing permit not recommended for modification by this document will remain in
    effect." Anything the modification did not touch is still read from the *VD.
- item: The compliance run is 12 of THIRTEEN quarters, not 12 of 12 — and one quarter is clean.
  tag: '[verified]'
  detail: >-
    The issue carried "12 of 12 quarters with violations (2023-Q2 → 2026-Q1)". ECHO's three-year
    grid displays THIRTEEN quarters (2023-04-01 through the partial quarter ending 2026-07-24) and
    2023-Q4 reads "No Violation Identified". See `noncompliance` below; the count of 12 is right,
    the denominator is not.
- item: The largest driver is not effluent. It is three CSO reporting milestones unmet since 2024.
  tag: '[verified]'
  detail: >-
    The effluent exceedances are real but intermittent — eight parameter-quarters across three
    years. What runs unbroken from 2024-Q1 to the current quarter is a set of PERMIT SCHEDULE
    violations: a CSO Event Report, an Operation and Maintenance Report and a Combined Sewer
    Report, each recorded "Schedule Event unachieved and not reported", each still open. Zero
    formal enforcement actions, $0 in penalties, over the same window.
- item: The permit does not name OHP000001. It names the general permit only by title.
  tag: '[verified]'
  detail: >-
    Part II.AE regulates the 1,000 kg TP allocation "through the Maumee Watershed Total Phosphorus
    NPDES General Permit" — no permit number is printed anywhere in the instrument. OHP000001 is
    the general permit held in this corpus and is almost certainly the one meant, but that binding
    is ours, not the permit's. See `total_phosphorus` below.
- item: The instrument names the wrong facility as the covered one.
  tag: '[verified]'
  detail: >-
    Part II.AE reads "under which **Defiance** Van Wert WWTP has been granted coverage". There is
    no such facility; Defiance is a different city with its own WWTP, ~40 river miles downstream.
    Boilerplate carried over unedited into an issued permit. Transcribed as found.

# ── The reach ─────────────────────────────────────────────────────────────────
reach:
  name: Town Creek
  ohio_epa_river_code: '04-143'
  huc12: '041000070804'
  huc12_name: Lower Town Creek
  ecoregion: Huron-Erie Lake Plains
  stream_network: Town Creek → Middle Creek → Little Auglaize River → Auglaize River → Maumee River → Lake Erie
  confluence_note: Town Creek combines with Maddox Creek to form Middle Creek.
  source: data/documents/oepa/van-wert/2PD00006.f8aaad0a.pdf, composite sheets 49 and 52 (the attached fact sheet)
  tag: '[verified]'

  designated_uses:   # OAC 3745-1-11, as printed for the segment receiving the discharge
    listed: [Modified Warmwater Habitat, Agricultural Water Supply, Industrial Water Supply,
             Secondary Contact Recreation]
    public_water_supply_listed: false
    tag: '[verified]'
    open_question: >-
      Public Water Supply is not among the uses printed for the discharge segment, and the City
      draws its drinking water from this creek. The intake is upstream of the outfall, so the two
      need not be the same WQS segment — but which segment carries a PWS designation, and where
      its boundary falls relative to the pump stations, is `[open]`. Instrument to pull: OAC
      3745-1-11 use designation table for river code 04-143, and the Ohio EPA Drinking Water
      Source Protection area delineation for PWS OH8100611.

  impairment:   # EPA ATTAINS via ECHO DFR, 2024 reporting cycle, read 2026-08-01
    assessment_unit: OH041000070804
    name: Lower Town Creek
    condition: Impaired - 303(d) Listed
    causes: [PATHOGENS, POLYCHLORINATED BIPHENYLS (PCBS)]
    uses:
      aquatic_life: Fully Supporting
      ecological: Fully Supporting
      drinking_water: Fully Supporting
      fish_consumption: Not Supporting
      recreation: Not Supporting
    possible_impairing_parameters_echo: [E. coli MTEC-MF, Fecal coliform]
    url: https://mywaterway.epa.gov/waterbody-report/21OHIO/OH041000070804
    tag: '[verified]'
    note: >-
      The creek is 303(d)-listed for pathogens and its recreation use is Not Supporting — on a
      reach whose five combined sewer overflows the permit's own public-access-area table lists as
      impacting no public access area at all (see `combined_sewer_overflows.public_access_areas`).

  one_flowline:
    tag: '[verified]'
    method: >-
      Each ICIS-NPDES facility coordinate snapped to NHDPlus v2 through the USGS NLDI
      linked-data/comid/position service on 2026-08-01 (watermark.hydrology.connectors.nldi).
    comid: 15653063
    length_km: 17.05
    upstream_end: {lat: 40.833845, lon: -84.572991}
    downstream_end: {lat: 40.931526, lon: -84.517449}
    flow_direction: south → north-northeast
    members:
    - {what: Van Wert WWTP outfall 001, npdes: OH0027910, lat: 40.8882410, lon: -84.58437518}
    - {what: Van Wert Water Plant discharge, npdes: OHG8P0006, lat: 40.8469444, lon: -84.5772222}
    - {what: City of Van Wert (CSO area permit at the water plant address), npdes: OH0135569, lat: 40.847601, lon: -84.574769}
    finding: >-
      All three snap to the SAME NHDPlus flowline. The drinking-water plant and the wastewater
      outfall are 4.61 km apart in a straight line on one 17 km reach, and the five CSO outfalls
      (lat 40.8683 – 40.8800) fall between them.
    upstream_downstream:
      tag: '[inference]'
      reasoning: >-
        The flowline's upstream end (lat 40.8338) is south of the water plant and its downstream
        end (lat 40.9315) is north of the WWTP; the upstream-main trace from the outfall extends
        south and the downstream-main trace north. The water-plant points therefore lie upstream
        of the outfall, and the CSOs between them.
      order: intake / water plant → five CSOs → WWTP outfall 001 (RM 13.87)
      caveat: >-
        The water plant's ICIS coordinate is the PLANT, not the raw-water intake. The City
        describes "two pumping stations east of the reservoirs" as what fills the reservoirs from
        the creek; those pump stations are not coordinate-pinned in any captured source and their
        river mile relative to RM 13.87 is `[open]`.

# ── Drinking water ────────────────────────────────────────────────────────────
drinking_water:
  pws_id: OH8100611
  pws_name: VAN WERT CITY
  system_type: Community water system (CWS)
  primary_source: Surface water (SDWIS PrimarySourceCode "SW")
  population_served: 10846
  activity: Active
  source: EPA ECHO sdw_rest_services.get_systems, Van Wert County OH, read 2026-08-01 (SDWIS extract 2026-07-09)
  tag: '[verified]'
  county_context:
    tag: '[verified]'
    detail: >-
      Van Wert City is the ONLY surface-water public water system in Van Wert County. Every other
      system in the county index is ground water; the only two other surface-water entries are
      "Surface water purchased" (SWP) systems buying treated water. There is no alternative
      surface source in the county to switch to.

  source_water:
    tag: '[reference]'
    source: City of Van Wert Utilities, vanwert.org/water-treatment (self-published, read 2026-08-01)
    as_published:
      creek: >-
        "The water that the people of Van Wert use and drink comes from Town Creek. This is the
        name of the stream that flows through our City."
      pump_stations: >-
        "East of the reservoirs are two pumping stations that we use to fill the reservoirs when
        stream flow is great enough to allow the pumps to be operated."
      pump_capacity: >-
        "The pump stations can pump 48.96 million gallons of water per day when all eight pumps
        are running."
      reservoir_capacity: >-
        "The capacity of our reservoirs is 1.01 billion gallons and can supply Van Wert for
        theoretically 21 months" — reduced to 15–16 months in practice because "the bottom 2 feet
        is not available and evaporation depletes resources further."
      historic_yield: >-
        "Since 1951 the creek has provided as little as 180 million gallons and as much as 1.26
        billion gallons in a calendar year."
    why_this_matters:
      tag: '[inference]'
      arithmetic: 1,010 MG reservoir capacity ÷ 180 MG (the record-low annual yield) = 5.6
      reading: >-
        The City's own figures put a 7x spread between the creek's worst year and its best. In the
        worst year on record the creek delivers less than a fifth of what the reservoirs hold, and
        the reservoirs are the buffer that makes a 4.0 MGD wastewater plant and a ~1.5 MGD city
        possible on a creek this size. Any new municipal demand is a claim on that buffer, not on
        the creek's average. The QTS campus's water and sewer service is not yet an executed
        agreement (data/extracted/van-wert/data-centers.md), so no volume is screened here.
    caveat: >-
      A utility's own page is `[reference]`, not a controlling record — it is the operator
      describing its own system, with no permit or engineering report behind it in this corpus.
      Instrument to pull: the City's Consumer Confidence Report and the Ohio EPA Drinking Water
      Source Protection plan for OH8100611, which would pin the intake location and the permitted
      withdrawal.

  compliance:
    tag: '[verified]'
    source: EPA ECHO dfr_rest_services.get_dfr (OH8100611), read 2026-08-01, SDWIS extract 2026-07-09
    current_snc: 'No'
    quarters_in_noncompliance: 8
    window: 2023-04-01 .. 2026-03-31
    note: >-
      Eight of twelve quarters in noncompliance on the SDWA side, SNC flag No. The violation
      TYPES are not resolved here — the DFR's SDWIS violation detail was not transcribed, and
      naming a cause without reading it would be invention. `[open]`: pull the SDWIS violation
      table for OH8100611 and the City's Consumer Confidence Reports for 2023–2025.

# ── The permit in force ───────────────────────────────────────────────────────
wastewater_permit:
  permit_no: 2PD00006*WD
  application_no: OH0027910
  permittee: City of Van Wert
  facility: Van Wert WWTP, 7998 S.R. 127 N., Van Wert, OH 45891
  receiving_water: Town Creek at River Mile 13.87
  outfall_001: {design_flow_gpd: 4000000, lat: 40.8882410, lon: -84.58437518}
  average_design_flow_mgd: 4.0
  peak_hydraulic_capacity_mgd: 8.0
  population_served: 11039
  collection_system: 35% separate sewers, 65% combined sewers
  action_date: '2026-05-18'
  public_notice_no: '221593'
  public_notice_date: '2026-05-25'
  comment_period_end: '2026-06-24'
  entered_directors_journal: '2026-06-30'
  effective: '2026-07-01'
  expires: '2030-05-31'
  supersedes: 2PD00006*VD (renewal, action 2025-04-18, effective 2025-06-01)
  source: data/extracted/oepa/van-wert/2PD00006.f8aaad0a.npdes.yaml
  tag: '[verified]'
  out_of_service_note: >-
    "The roughing trickling filters and peak flow primary tanks are currently not in use at
    treatment plant. Flows above 5 MGD are bypassed around the primary clarifiers directly to the
    secondary treatment activated sludge tanks." (fact sheet, composite sheet 52) — a plant
    running above 5 MGD is a plant with its primary treatment bypassed, on a permit whose average
    design flow is 4.0 MGD and whose peak hydraulic capacity is 8.0.

  reported_flow:
    tag: '[verified]'
    source: EPA ECHO eff_rest_services.get_effluent_chart, p_id OH0027910, parameter_code 50050, read 2026-08-04
    what: Outfall 001 Effluent Gross, monthly-average flow (StatisticalBaseCode MK), MGD, 2023-01 through 2026-06.
    why_here: >-
      Pulled alongside the phosphorus record (issue 1860) as the denominator that makes the load
      series readable. It also gives the `out_of_service_note` above its first measured test.
    statistics_reported: >-
      Two rows per month, both in MGD — a monthly average (MK, Quantity1) and a daily maximum (DD,
      Quantity2). Neither carries a numeric permit limit; flow at this outfall is report-only, so
      nothing below is a limit exceedance and none of it is described as one.
    annual_mean_mgd: {2023: 2.774, 2024: 2.662, 2025: 2.43, 2026: 2.914}
    critical_season_mean_mgd: {2023: 3.116, 2024: 3.091, 2025: 3.048, 2026: 3.527}
    monthly_average_extremes:
      lowest: {'2025-10': 1.389, '2023-09': 1.487, '2026-01': 1.548, '2024-10': 1.585}
      highest: {'2024-04': 5.983, '2023-03': 5.622, '2026-04': 5.059, '2025-04': 4.369}
    daily_maximum_mgd:   # [verified] verbatim, StatisticalBaseCode DD
      '2023': {Jan: 7.613, Feb: 8.073, Mar: 9.048, Apr: 6.938, May: 3.862, Jun: 4.27, Jul: 20.92, Aug: 4.496, Sep: 2.823, Oct: 5.502, Nov: 4.246, Dec: 4.353}
      '2024': {Jan: 7.954, Feb: 5.068, Mar: 7.533, Apr: 9.216, May: 5.352, Jun: 3.595, Jul: 4.31, Aug: 3.849, Sep: 3.971, Oct: 2.622, Nov: 3.308, Dec: 7.251}
      '2025': {Jan: 7.244, Feb: 5.346, Mar: 6.782, Apr: 9.544, May: 7.213, Jun: 3.537, Jul: 5.517, Aug: 4.879, Sep: 2.422, Oct: 2.161, Nov: 2.389, Dec: 3.293}
      '2026': {Jan: 2.309, Feb: 2.864, Mar: 5.864, Apr: 7.94, May: 7.013, Jun: 6.658}
    against_the_plant_as_described:
      tag: '[inference]'
      primary_bypass_months: 22 of the 42 reported months carried a daily maximum above 5 MGD
      by_year: {2023: 6 of 12, 2024: 6 of 12, 2025: 6 of 12, 2026: 4 of 6}
      monthly_average_above_5_mgd: ['2023-03', '2024-04', '2026-04']
      monthly_average_above_design_flow_4_mgd: ['2023-02', '2023-03', '2024-01', '2024-04', '2025-04', '2026-04']
      above_peak_hydraulic_capacity_8_mgd:
        '2023-02': 8.073
        '2023-03': 9.048
        '2023-07': 20.92
        '2024-04': 9.216
        '2025-04': 9.544
      reading: >-
        The fact sheet says flows above 5 MGD are bypassed around the primary clarifiers because the
        roughing trickling filters and peak-flow primary tanks are out of service. The reported
        daily-maximum flow crossed 5 MGD in 22 of the 42 months on record — six of twelve in each
        full year and four of the first six months of 2026. So the bypass is not an exceptional
        event; on this record it is a routine feature of more than half the months, and of every
        wet season. Five months went past the permit's own 8.0 MGD PEAK HYDRAULIC CAPACITY. Three
        months averaged above 5 MGD for the whole month, and six averaged above the 4.0 MGD design
        flow. None of this is a violation — flow is report-only at this outfall and the bypass is
        described in the fact sheet as existing practice. That is exactly what makes it worth
        recording: a plant is documented running past its primary treatment in most wet months, in
        the permittee's own numbers, and no condition in the modified permit is addressed to it.
        The CSO construction schedule the *WD put in force is aimed at the collection system's
        overflows, not at the plant's out-of-service primary units.
      the_outlier:
        tag: '[verified]'
        value: 20.92 MGD daily maximum, July 2023, in a month averaging 2.957 MGD
        note: >-
          Recorded verbatim and flagged rather than used. It is 2.2× the next-highest daily maximum
          in the series (9.544) and 2.6× the permit's stated peak hydraulic capacity, in a month
          whose average is unremarkable and in which one CSO (Keplar 010) reported a single
          overflow. A single extreme storm day and a reporting error look the same in this record,
          and nothing captured here distinguishes them. No figure in this file depends on it.
      caveat: >-
        A daily maximum above 5 MGD establishes that at least one day in the month crossed the
        bypass threshold, not how many did. The DMR carries no daily series, so the number of
        bypass DAYS — and the volume that passed the primary clarifiers — is `[open]`. The
        instruments that would carry it are the plant's own operating records and the O&M Report,
        which is one of the three schedule obligations recorded unachieved since 2024-02-01.

