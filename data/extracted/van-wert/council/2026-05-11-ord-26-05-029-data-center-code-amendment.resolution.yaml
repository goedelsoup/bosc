  what_this_instrument_does_not_establish:
    - >-
      IT IMPOSES NO CONDITION ON A DATA CENTER. The amendment defines the use and permits it in
      I-2; it sets no water, discharge, noise, height, lighting or generator condition of any kind.
      Whatever conditions bind this campus are in Ordinance 26-05-030's Exhibit C, which contains
      only a landscape mound.
    - >-
      IT NAMES NO OPERATOR. The definition and the use-list entry are generic code text. Nothing in
      this ordinance joins the term to QTS, to any tenant, or to the annexed acreage.
