  what_this_instrument_does_not_establish:
    - >-
      THE CONDITIONS ARE A LANDSCAPE MOUND AND NOTHING ELSE. See `conditions_exhibit_c
      .what_it_does_not_contain`. A reader who sees "conditional zoning" and infers a negotiated
      set of operating limits will be wrong about this instrument.
    - >-
      IT NAMES NO OPERATOR AND NO LOAD. The ordinance rezones acreage; it states no megawatt
      figure, no water demand and no tenant.
