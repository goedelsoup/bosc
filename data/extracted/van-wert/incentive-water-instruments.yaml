# 2. THE STATE THREAD — R.C. 122.175 data-center sales-tax exemption, and the pause
# =============================================================================================
state_thread:
  status: negative-on-two-independent-routes
  exemption_status_for_this_project: '[open]'
  tag: '[verified]'

  the_pause:
    announced: '2026-05-27'
    what: >-
      The Governor "directed the chair of the Ohio Tax Credit Authority to pause consideration of
      any new data center tax exemption requests while the Ohio General Assembly's Joint Data
      Center Committee studies the growth of data centers in Ohio."
    source: data/documents/odd/2026-05-27-governor-dewine-announces-pause-of-data-center-tax-exemption.governor-ohio-gov.html
    captured: '2026-08-05'
    tag: '[verified]'
    two_days_before: >-
      The pause is dated two days before the 2026-05-29 public announcement of the QTS Van Wert
      campus. The sequence is a fact; a causal reading of it is not supported by anything in this
      corpus and is not offered.
    still_in_force: >-
      No lift was found on 2026-08-05. `[open]` as to any lift after the 2026-06-29 meeting, since
      the Authority's 2026-07-27 minutes are not yet published.

  ohio_tax_credit_authority:
    route: Ohio DAM (dam.assets.ohio.gov), the same open, unauthenticated, scriptable route as the Ohio EPA permit DAM
    meetings_read: ['2026-03-30', '2026-04-27', '2026-06-01', '2026-06-29']
    read_on: '2026-08-05'
    result: >-
      No application, award, exemption or agenda item naming Van Wert, QTS, QTS Realty Trust or
      QTS Van Wert LLC appears in any 2026 meeting minute. `[verified]`
    the_last_exemption:
      grantee: Cologix, Inc
      approved: '2026-06-01'
      terms: 50 percent for 10 years
      location: Orange Township, Delaware County and the City of Johnstown, Licking County
      commitment: 90 full-time equivalent employees, $10,000,000 new annual payroll, $5,185,126 retained
      term_dates: 2026-01-01 .. 2035-12-31
      vote: 3-0 yes; Garczyk and Kelly abstained
      source: data/documents/odd/tca/TCA_Meeting_Minutes_6.1.2026.pdf
      page: 2
      tag: '[verified]'
      note: >-
        Granted FIVE DAYS AFTER the pause was announced. The pause is written as applying to NEW
        requests, and this one was already before the Authority — so "the last pre-pause award"
        is precise only if that distinction is kept.
    the_first_meeting_under_the_pause:
      date: '2026-06-29'
      new_projects: 7
      data_center_exemptions: 0
      source: data/documents/odd/tca/Meeting_Minutes_TCA_6.29.2026.pdf
      tag: '[verified]'
    the_van_wert_item_that_is_not_this_campus:
      name: Van Wert Forward II
      where: 'Section VI, Transformational Mixed-Use Development'
      action: >-
        The Authority engaged the University of Cincinnati Economics Center as the third party to
        analyse the increase in tax collections under the alternative calculation method.
      why_it_is_not_the_campus: >-
        "Van Wert Forward II" is a downtown Van Wert redevelopment already carried in the
        committed ODD export as an Ohio Historic Preservation Tax Credit approved 2022-06-22 at an
        estimated $1,200,000 — four years older than this project, a different program, and a
        different part of the city. Recorded explicitly so a future keyword sweep for "Van Wert"
        in the state incentive record does not mistake it for a Mega Site award. `[verified]`
    transcription_notes: >-
      The 2026-06-29 minutes as published print "The meeting was adjourned at HH:MM a.m." — an
      unfilled placeholder in an issued state record — and give the next meeting time as "July 27,
      2026 at 10:52 a.m." where every other meeting in the series is called for 10:00. Both are
      quoted from the instrument, not artifacts of this reading.

  odd_tax_incentive_export:
    file: data/reference/odd/tax_incentives.csv
    pulled: '2026-06-28'
    queried: '2026-08-05'
    van_wert_county_rows: 8
    van_wert_county_detail: >-
      MEK Van Wert Inc (JCTC 2017-12-04, completed), Toledo Molding & Die (JCTC 2012), Unverferth
      Manufacturing (JCTC 2010, completed), and five Ohio Historic Preservation credits — 135 E.
      Main Street and 111 W. Main Street (both 2022-06-22), Van Wert Forward and Van Wert
      Revitalization (both 2021-06-30), Van Wert Forward II (2022-06-22). The most recent approval
      of ANY state incentive in Van Wert County is 2022-06-22.
    qts_rows_statewide: 0
    datacenter_exemption_rows_statewide: 9
    datacenter_exemption_counties: [Hamilton, Licking, Cuyahoga, Franklin, Monroe, 'blank (Amazon Data Services)']
    tag: '[verified]'
    known_lag: >-
      THIS EXPORT IS NOT A REAL-TIME REGISTER. Its newest Datacenter Tax Exemption approval date
      is 2022-08-29, so it does NOT yet carry the 2026-06-01 Cologix exemption that the Authority's
      own minutes record. A "not in the CSV" negative is therefore bounded by that lag, which is
      exactly why the minutes were read as a second, independent route.

  jobsohio:
    result: >-
      No JobsOhio award naming the project was found. `[open]` JobsOhio is a private non-profit
      and is NOT subject to R.C. 149.43; its incentive commitments do not appear in the ODD export
      or the Authority's minutes, so this route has no negative worth asserting — only an absence
      of press. Recorded so the gap is not mistaken for a search.

