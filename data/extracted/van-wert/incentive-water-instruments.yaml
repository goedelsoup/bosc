# 5. THE COUNTY THREAD — Van Wert County Board of Commissioners
# =============================================================================================
county_thread:
  status: negative-with-a-corroborating-timeline
  tag: '[verified]'
  route: >-
    The Board's published 2026 agenda index — one page carrying all 63 meeting dates from
    2026-01-01 through 2026-08-06, captured 2026-08-05 to
    data/documents/van-wert/county/2026-08-05-board-of-commissioners-2026-agendas.vanwertcountyohio-gov.html
  result: >-
    ZERO agenda entries in 2026 mention an enterprise zone, an abatement, a CRA, tax increment
    financing, or QTS by name. `[verified]` If the County has taken an incentive action for this
    campus, it did not reach a published agenda in the first seven months of 2026.
  what_the_agendas_do_show:
    - date: '2026-01-29'
      entry: 'Teleconference with Dan Baker, CCAO — "Re: General data center information"'
    - date: '2026-02-12'
      entry: 'Brent Stevens, Executive Director, Van Wert Area Economic Development Corporation — "Re: Megasite End User Options"'
      note: >-
        THREE AND A HALF MONTHS before the end user was publicly named (2026-05-29) and four weeks
        before the annexation petition was filed (2026-03-09), the County's own published agenda
        records its economic-development director briefing the Commissioners on end-user options
        for the Megasite. The agenda line is `[verified]`; what was said is `[open]`.
    - date: '2026-03-10'
      entry: 'Chuck Koch, Attorney, Koch & White Law — "Re: Annexation"'
      note: >-
        INDEPENDENT CORROBORATION of the date the annexation ordinance recites. Ordinance
        26-05-028 says the Board "approved and granted the petition by the passage and approval of
        a resolution on 2026-03-10"; the Board's own agenda for that date carries the petitioners'
        agent. Until now that date rested on the City ordinance's recital alone. The journal entry
        itself is still not in the corpus.
    - date: '2026-04-20'
      entry: 'Special Session — "8:00 a.m. Bus Trip to New Albany, OH Re: Data centers (Commissioner Owens and Commissioner Lichtensteiger)"'
      note: Corroborates the stakeholder tour already recorded in mega-site-instruments.yaml.
    - date: '2026-07-16'
      entry: 'Bill Evans, Trustee, Ridge Township — "Re: Mendon Road"'
    - date: '2026-07-28'
      entry: 'Ridge Township Trustees, Van Wert County Engineer''s Office, and Van Wert City Representatives — "Re: Mendon Road and surrounding area expectations"'
      note: >-
        The campus's own address on its construction-stormwater NOI is 8002 Mendon Road (issue
        1402), and the campus lies in Ridge Township's former territory. Two County agenda items
        five weeks apart about that road and "surrounding area expectations" are the closest the
        county record comes to the campus in this window. What was decided is `[open]` — agendas,
        not journal entries.
    - date: '2026-08-04'
      entry: 'Chuck Koch, Attorney, Koch & White Law — "Re: Annexation"'
      note: >-
        A second annexation appearance by the petitioners' agent, one day before this pass. It may
        be the City's new 49.682-ac petition (Ord. 26-07-039) rather than anything Mega Site; the
        agenda does not say and no identification is made here.
  blind_spot: >-
    Agendas are published; JOURNAL ENTRIES ARE NOT. Every action, resolution and vote of this
    Board is invisible to this route. The Board's 2026-03-10 resolution granting the annexation
    petition — recited in a City ordinance, dated, and now corroborated by an agenda line — is
    still not in the corpus for exactly this reason.

# =============================================================================================
# 6. THE ONE EXECUTED INSTRUMENT WITH THE CAMPUS'S UTILITY
# =============================================================================================
power_franchise:
  tag: '[verified]'
  what: >-
    Ordinance 26-02-010 — "AN ORDINANCE GRANTING FRANCHISE TO OHIO POWER, ITS SUCCESSORS AND
    ASSIGNS, THE RIGHT TO ACQUIRE, CONSTRUCT, MAINTAIN, AND OPERATE IN THE STREETS,
    THOROUGHFARES, ALLEYS, BRIDGES, AND PUBLIC PLACES OF THE CITY OF VAN WERT … THIS AGREEMENT IS
    AN EXTENSION OF THE AGREEMENT SET OUT IN VAN WERT ORDINANCE NUMBER 5270-75 PASSED OCTOBER 15,
    1975."
  passed: '2026-06-08'
  reading: third and final; "All concurred; Ordinance passed" — no numeric tally recorded
  source: 'data/documents/van-wert/council/6.8.26.pdf p. 3'
  the_term_was_cut:
    date: '2026-05-27'
    record: >-
      "Fleming supplied the updated AEP Lease Agreement to council which took the lease from 50
      years down to 10 years." Ordinance 26-02-010 was untabled and the term amended from 50 years
      to 10 years on the same motion; second advisory reading followed as amended.
    source: 'data/documents/van-wert/council/5.27.26.pdf p. 3'
    tag: '[verified]'
    antecedent: >-
      The ten-year figure was already on the record two weeks earlier: at the 2026-05-11 meeting —
      the Mega Site vote itself — Fleming told Council "an agreement has been made with AEP on a
      10 year contract", moving toward a signed lease agreement for the City `[verified]`
      (5.11.26.pdf, issue 1401). So 2026-05-27 is the date Council conformed the ORDINANCE to a
      term the administration had already announced, not the date the term was negotiated.
  why_it_matters: >-
    It is the City's only executed instrument in this window with the utility that will serve the
    campus, and it was shortened by four fifths twelve days before passage, in the weeks between
    the campus's zoning and its public announcement. The minutes give no reason for the change and
    none is inferred here. The 1975 predecessor ordinance (5270-75) is not in the corpus.

transmission_line_correction:
  tag: '[verified]'
  what: >-
    "Next, AEP has been planning a power line upgrade for about 3 years ago between the Haviland
    facility and the substation behind the street department in the city. The path of repair
    includes Dutch John Road where a 135-kilovolt line will be ran to help Industrial Park along
    with the city's electrical backbone. FLEMING REITERATED THIS PROJECT WAS NOT RELATED TO THE
    DATA CENTER."
  who: Jay C. Fleming, Safety-Service Director
  date: '2026-05-27'
  source: 'data/documents/van-wert/council/5.27.26.pdf p. 1'
  read_at: 300 and 450 DPI, identical
  bears_on: >-
    The register carries OPSB 25-0697-EL-BLN — the AEP Ohio Transco Van Wert-Haviland 138 kV
    letter of notification — as the transmission instrument associated with this load, with two
    unreconciled cost figures ($45M in the register, "$72 million" from a County Commissioner's
    written comment). The City's Safety-Service Director states on the record that the
    Haviland-to-Van Wert line project is NOT related to the data center and has been in planning
    for about three years. That does not settle what the LON covers, and one official's
    characterization is not a filing — but it is the only primary-source statement in the corpus
    on the question, and it cuts against attributing that line, or its cost, to this campus.
  the_kilovolt_figure: >-
    The approved minutes read "135-kilovolt" at both 300 and 450 DPI. Every other source in the
    corpus, including the OPSB case caption, says 138 kV. A minutes typo is the likeliest reading
    and is `[inference]`; what is `[verified]` is what the minutes print.

# ── Per-source negatives from this pass ───────────────────────────────────────
# Recorded as negatives against a named route, never as absences.
source_negatives:

- source: City of Van Wert WordPress media index — the 2026-06-22 council minutes
  attempted: '2026-08-05'
  result: >-
    The media index lists "6.22.26" (uploaded 2026-07-14, source_url
    /wp-content/uploads/2026/07/6.22.26.pdf) but the file 404s, as do three path variants. The
    attachment record survives the file. The 2026-06-22 regular meeting is therefore the one
    council meeting in this window whose minutes could not be read — and it sits between the
    2026-06-08 well motion and the 2026-07-13 incentive report.
  workaround: >-
    A records request to the Clerk of Council, or a re-check of the index in case the City
    re-uploads. Its content is [open]; the 2026-07-13 minutes record that it was the meeting whose
    minutes the 7/13 consent agenda approved.

- source: Lincolnview Local Schools BoardDocs — agenda-item attachments
  attempted: '2026-08-05'
  result: >-
    The meeting list (BD-GetMeetingsList) and full agendas (BD-GetAgenda) are readable by POST
    with no auth, and both were used. The attachment endpoint behind each item's
    "attachment-public-<id>" div was NOT resolved — three candidate endpoint names returned the
    portal's login/404 page — so the approved MINUTES documents (attached to the 2026-07-22
    consent item covering the June 18, June 29 and July 8 meetings) were not retrieved. A burst of
    agenda requests also drew a CloudFront 403, so the route is rate-limited; pace it.
  workaround: the per-item UI URL (go.boarddocs.com/oh/lls/Board.nsf/goto?open&id=<item unique>), or a records request to the district treasurer.

- source: Ohio Tax Credit Authority — the 2026-07-27 meeting
  attempted: '2026-08-05'
  result: >-
    Not published. The Authority publishes minutes only after the following meeting approves them,
    so the 7/27 minutes should appear after the next meeting. Eight URL patterns across both DAM
    paths returned 404. This is the reason the state thread's "still paused" reading stops at
    2026-06-29.
  workaround: re-probe both DAM paths (business/stateincentives/ and about/taxcreditminutes/) on cadence; the filename pattern alternates between TCA_Meeting_Minutes_<M.D.YYYY>.pdf and Meeting_Minutes_TCA_<M.D.YYYY>.pdf.

- source: Van Wert County Board of Commissioners — journal entries
  attempted: '2026-08-05'
  result: >-
    Only agendas are published. The county site serves a 403 on /commissioners/ and a 404 on
    /commissioners/minutes; the working index is
    /government/county_commissioners/2026_agendas.php, which carries agendas only. No resolution,
    journal entry or vote is reachable by this route.
  workaround: records request to the Clerk of the Board.

- source: Van Wert County Board of Elections — the initiative certificate
  attempted: '2026-08-05'
  result: >-
    The 255-of-323 signature determination is carried only by press. The Board's own certificate,
    protest record and the part-petitions themselves are not in the corpus.
  workaround: records request to the Board of Elections (Director Pam Henderson).

