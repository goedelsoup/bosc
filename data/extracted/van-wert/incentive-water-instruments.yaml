# City of Van Wert (Van Wert County, OH) — the QTS Mega Site incentive and water-service
# instruments: what exists, what does not, and the dated route by which each was searched.
#
# Provenance vocabulary (see docs/investigative-method/ENRICHMENT.md):
#   [verified]  = stated in a captured primary record (cite file + page) or read from a named
#                 public system on a named read date
#   [reference] = secondary / self-published source, not a controlling record
#   [inference] = reasoned from verified facts, labelled as such
#   [open]      = not established by any captured source — do NOT assert
#
# THE ONE FACT THIS FILE EXISTS TO HOLD: as of 2026-08-05 there is still NO executed incentive
# instrument and NO water-service instrument for the QTS Van Wert campus, and that is now a
# DATED, SOURCED NEGATIVE against five named routes rather than an unfound thing. The strongest
# of the five is the City's own: on 2026-07-13 the chair of Council's Economic Development
# committee reported that VWAED's Executive Director "is concluding incentives and development
# agreements for the data center and hopes to have those done by the next council meeting." That
# sentence is what closes the question for this pass. It establishes, from inside the City's
# approved minutes, that on that date the agreements did not yet exist — and it is the first
# instrument-grade statement of the incentive package's existence, negotiator and expected timing.
#
# THE SECOND FACT, and the one that changes the water thread: the operator's own live FAQ still
# asserts "The City of Van Wert has approved our water usage", and the City's legislative record
# through 2026-07-13 contains NO water-service approval, agreement, resolution or ordinance for
# this campus. Fourteen council meetings' worth of record now carry the claim's weight without
# the instrument. The same FAQ names, for the first time, a document that would settle it — "the
# analysis completed by QTS and City engineering" — which is a records request, not a search.
#
# WHAT THIS FILE MUST NOT BE READ AS SAYING. A negative against a named route is not proof of
# absence. An enterprise-zone agreement negotiated but unexecuted, a water-service letter signed
# by a utility director, or an ODOD application filed and held would each be invisible to every
# route below. Where a route has a known blind spot it is written down as such.

meta:
  subject: >-
    The incentive instruments (enterprise zone / CRA / PILOT / development agreement, and the
    R.C. 122.175 state data-center sales-tax exemption) and the water-service instrument for the
    QTS Van Wert Mega Site — searched to a dated negative against the City, County, school, state
    and operator records, with the three City instruments that DID land in the window
  kind: instrument-search
  site: van-wert
  captured_for: issue 1407 (epic 1267, readiness(van-wert)); mirror of Urbana's 1354
  extracted_at: '2026-08-05'
  previous_pass: '2026-08-03'      # the 1401 legislative ingest, which recorded the same gap
  covers_through:
    city_council: '2026-07-13'     # last approved minutes posted; 2026-07-27 not yet published
    city_legislation: '26-07-040'  # highest ordinance number posted (uploaded 2026-07-13)
    county_commissioners: '2026-08-06'  # last dated entry on the published 2026 agenda index
    lincolnview_boe: '2026-07-22'
    ohio_tax_credit_authority: '2026-06-29'  # 7/27 minutes not yet published (approved in arrears)
    odd_tax_incentive_export: '2026-06-28'
    operator_faq: '2026-08-05'
  method: >-
    Five routes, run independently and recorded separately. (1) THE CITY — the open WordPress
    REST media index at vanwert.org (/wp-json/wp/v2/media?per_page=100, 298 items enumerated
    2026-08-05), which is the archive behind the rolling /ordinances/ window; every council
    minute and ordinance uploaded since the 2026-05-11 Mega Site vote was listed, downloaded and
    read. (2) THE COUNTY — the Van Wert County Board of Commissioners' published 2026 agenda
    index, one page carrying all 63 meeting dates from 2026-01-01 to 2026-08-06, captured and
    keyword-scanned. (3) THE SCHOOL DISTRICT — Lincolnview Local's BoardDocs portal
    (go.boarddocs.com/oh/lls), whose meeting list and full agendas are scriptable without auth;
    all twelve 2026 meetings enumerated and their agenda item titles read. (4) THE STATE — the
    Ohio Tax Credit Authority's own meeting minutes from the Ohio DAM (the same open route as the
    Ohio EPA permits), plus the committed ODD tax-incentive export already in this corpus
    (data/reference/odd/tax_incentives.csv, pulled 2026-06-28), plus the Governor's own notice of
    the 2026-05-27 pause. (5) THE OPERATOR — a raw capture of q.com/data-centers/van-wert, which
    unlike the dead vanwertohiodatacenter.com microsite is server-rendered and therefore
    capturable.
  ocr_note: >-
    Every City of Van Wert PDF in this pass is an image-only scan with a zero-character text
    layer, exactly as in issue 1401. All quotations from them were read by rendering the page with
    pypdfium2 and running tesseract (watermark.civic.indexer.ocr_pdf) at 300 DPI, and every
    load-bearing sentence quoted below was re-read at 450 DPI and matched character-for-character
    before being written here. Page numbers are 0-based PDF page indices. The Ohio Tax Credit
    Authority minutes and both HTML captures carry real text layers and were read directly.

# ── What changed since the last pass, newest first ────────────────────────────
whats_new:

- date: '2026-08-05'
  finding: >-
    The operator's FAQ carries boilerplate from another market. In the answer to "How will this
    project strengthen the local economy?", the q.com Van Wert page states that the project will
    "support services and community programs throughout RICHMOND COUNTY" — Richmond County is
    Augusta, Georgia, not Van Wert County, Ohio. `[verified]` as to what the page says. It is the
    same species of defect as the issued NPDES permit that names the "Defiance Van Wert WWTP"
    (issue 1406) — recorded because a page carrying an unproofed paste is weaker evidence of
    Van-Wert-specific diligence than its confident tone implies, not because it changes a figure.

- date: '2026-08-05'
  finding: >-
    THE FILL VOLUME IS THE CITY'S NUMBER, NOT THE OPERATOR'S. QTS's own page declines to state
    one — "The total initial charging volume can vary widely based on a variety of factors
    including power capacity and facility design. Since we're still early in the planning stage
    for this development, it's hard to predict the exact amount of water needed." `[verified]`
    Every figure in the corpus's fill-vs-annual dispute (~660,000 gal one-time, 700,000 gal
    lasting 6-8 years, 5,500 gal) traces to a City official or a citizen citing the dead city
    microsite. The operator has never published a volume. That materially weakens any reading of
    "660,000 gallons" as a disclosure BY QTS, and it is why the closed_loop_dry pin stays
    `[reference]` (B2, issue 1682).

- date: '2026-08-05'
  finding: >-
    THE COOLING MEDIUM IS STATED TWO DIFFERENT WAYS. QTS: "The closed-loop system that cools the
    data hall uses only water." `[verified]` The City's Safety-Service Director, press release
    2026-04-21 as printed in the hearing record: a sealed "water and glycol" loop. `[verified]`
    Both are in the corpus and they do not agree. Unresolved and left standing.

- date: '2026-07-27'
  finding: >-
    The citizen initiative that would have repealed the data-center use from the I-2 district
    FELL SHORT. 255 valid signatures against 323 required, so no city question reaches the
    2026-11-03 ballot; because the part-petitions were already filed with the Board of Elections,
    signatures cannot be added to them. `[reference]` (VW Independent, 2026-07-27, quoting Board
    of Elections Director Pam Henderson.) The certificate itself is not in the corpus.

- date: '2026-07-13'
  finding: >-
    THE INCENTIVE PACKAGE IS UNDER NEGOTIATION AND WAS NOT DONE. Council's Economic Development
    committee, on the record. See `city_incentive_thread.the_statement` below — this is the
    finding that closes issue 1407's first thread.

- date: '2026-07-13'
  finding: >-
    A private-well ordinance is moving through Council, and the drafted text does not say what
    the Council discussion says it says. See `water_thread.private_wells` below.

- date: '2026-06-29'
  finding: >-
    The Ohio Tax Credit Authority met and considered SEVEN new projects and ZERO data-center
    exemptions — the first meeting wholly under the Governor's pause, four weeks after the last
    exemption (Cologix) was granted. `[verified]` A Van Wert item does appear on that agenda and
    it is NOT this campus. See `state_thread` below.

- date: '2026-06-08'
  finding: >-
    The City's franchise with Ohio Power was extended for TEN years, not the fifty the ordinance
    originally carried — the term was cut on 2026-05-27, twelve days before passage. See
    `power_franchise` below. Recorded here because it is the City's only executed instrument with
    the campus's electric utility.

# =============================================================================================
# 1. THE INCENTIVE THREAD — enterprise zone / CRA / PILOT / development agreement
# =============================================================================================
city_incentive_thread:
  status: negative-with-a-dated-statement-of-imminence
  tag: '[verified]'

  the_statement:
    what: >-
      "Economic Development: Johnson reported groundbreaking will occur on July 22[nd] for the new
      Hampton Inn. Additionally, he reported the Brent Stevens is concluding incentives and
      development agreements for the data center and hopes to have those done by the next council
      meeting."
    who: Dewaine Johnson, chair, Council Economic Development committee
    about: Brent Stevens, Executive Director, Van Wert Area Economic Development (VWAED)
    source: data/documents/van-wert/council/7.13.26.pdf
    page: 3
    read_at: 300 and 450 DPI, identical
    meeting: '2026-07-13'
    minutes_approved: '2026-07-27'
    tag: '[verified]'
    why_it_matters: >-
      It is the first primary-source statement in this corpus that an incentive package for the
      campus EXISTS as a negotiation, who is conducting it, and when it was expected to close. It
      also fixes the negative: on 2026-07-13 the agreements were not executed, because a person
      does not "conclude" what is already signed. It does not disclose type, term, percentage,
      counterparty or revenue share — every one of those stays `[open]`.
    the_next_meeting: >-
      Council next met 2026-07-27 (the same meeting that approved these minutes). Those minutes
      were not yet published on 2026-08-05, and the only account of that meeting available is
      press, which reports public comment on the data center and no incentive action
      `[reference]`. Whether the agreements were signed on or after that date is `[open]` and is
      the single highest-value re-check on this file.

  legislative_sweep:
    tag: '[verified]'
    route: vanwert.org open WordPress REST media index, enumerated 2026-08-05
    window: every item uploaded 2026-05-12 .. 2026-07-29 (39 items)
    ordinances_read: ['26-05-032', '25-06-028', '26-06-033 (draft + update)', '26-06-034', '26-06-035', '26-07-036', '26-07-037', '26-07-038', '26-07-039', '26-07-040']
    minutes_read: ['2026-05-27', '2026-06-08', '2026-06-08 council of the whole', '2026-07-13', '2026-07-13 public hearing']
    result: >-
      NO enterprise-zone agreement, NO Community Reinvestment Area agreement, NO PILOT, NO tax
      increment financing, NO JEDD and NO development agreement for the Mega Site appears anywhere
      in the City's published legislation through ordinance 26-07-040. The subjects actually
      legislated in the window are a supplemental appropriation, the 2027 tax budget, a solar
      lease on a city parcel, private wells, a tree commission repeal, door-to-door sales, a
      handicap parking space, a smoking prohibition and an unrelated annexation.
    blind_spot: >-
      The City posts ordinance DRAFTS before passage and its minutes about two weeks in arrears.
      An instrument executed administratively — a service agreement signed by the Safety-Service
      Director under existing authority, or an agreement authorized in an executive session — need
      never appear on this route at all. Council did go into executive session on 2026-06-08 "for
      the purpose of a property transaction to discuss the sale or lease of real property owned by
      the city", 7:44-8:12 p.m., with no action taken afterward `[verified]` (6.8.26.pdf p. 3);
      what property that was is `[open]` and is NOT asserted to be the campus.

  what_was_checked_and_excluded:
    - id: '26-04-026 / 26-04-027'
      what: Two Community Reinvestment Area ordinances passed 2026-05-11 as emergencies.
      why_excluded: >-
        True North Partners Holdings, LLC (90% for 10 years, $14M building at 205 Bonnewitz
        Crossing, 15 jobs) and Cool Machines Holdings, Inc. Neither is a Mega Site instrument.
        Already recorded at issue 1401; re-confirmed, do not re-chase.
    - id: '26-06-035'
      what: Ordinance authorizing the Mayor to sign a lease with Butterfly Meadows Solar Project, LLC
      detail: >-
        City-owned parcel 08-011900.0000, for solar production; introduced 2026-06-22, passed
        2026-07-13 on second and final reading as an emergency. `[verified]` (26-06-035-DRAFT.pdf
        p. 0; 7.13.26.pdf p. 5)
      why_excluded: >-
        An energy instrument, not an incentive instrument, and not connected to the campus by any
        record. Flagged for the grid/energy line of work rather than ignored — the same project is
        before the County Commissioners in August 2026 (Union Township trustees 2026-08-04; the
        County Prosecutor 2026-08-06).
    - id: '26-07-039'
      what: Ordinance authorizing the Mayor to sign a petition to annex 49.682 ac in four parcels
      detail: >-
        32.422 ac owned by the City (11-014256.0000), 1.084 + 11.166 ac owned by Business
        Development Corporation, 5.010 ac owned by OHIO POWER COMPANY. `[verified]`
        (26-07-039-DRAFT.pdf p. 0)
      why_excluded: >-
        The Law Director explained it on the record as a sanitary equalization basin near John
        Brown Road and SR 30 that the City uses as a dump site, connecting to Vision Park, and as
        the residue of an annexation "discussed last fall" `[verified]` (7.13.26.pdf p. 2). An AEP
        parcel in a city annexation is worth knowing about; it is not a Mega Site instrument and
        is not asserted to be one.

  what_would_close_it:
    - The executed enterprise-zone or CRA agreement itself, with its exemption percentage, term, and any revenue-sharing or school-compensation schedule.
    - The development agreement between the City and QTS Van Wert LLC (or QTS Realty Trust Inc.), which is what the 2026-07-13 minutes name.
    - The schedule and assumptions behind the announcement's "$200 million in projected tax revenue over 20 years" — a figure that appears in press and in the letter campaign and in NO instrument.

