# 3. THE WATER THREAD — the instrument behind "The City of Van Wert has approved our water usage"
# =============================================================================================
water_thread:
  status: negative-against-the-city-legislative-record
  tag: '[verified]'

  the_operators_claim:
    text: >-
      "What water supply will you be using to initially fill the closed-loop system? The City of
      Van Wert has approved our water usage and we're currently in discussions to identify the
      best solutions to support the initial fill. QTS has no intentions of utilizing the aquifer
      to support the initial fill."
    source: data/documents/van-wert/operator/2026-08-05-qts-van-wert-project-faq.q-com.html
    captured: '2026-08-05'
    tag: '[verified]'
    as_to: what the operator publishes, not that an approval exists
    the_gap: >-
      "Approved" names an act by the City. The City's own legislative record — every ordinance
      through 26-07-040 and every set of approved minutes from 2026-04-27 through 2026-07-13 —
      contains no water-service approval, no service agreement, no rate resolution and no
      authorization to sell water to this campus. Whatever the approval was, it was not a
      published act of Council. `[verified]` as to the absence from that record; `[open]` as to
      what the approval actually is.

  the_named_analysis:
    text: >-
      "The analysis completed by QTS and City engineering indicates that there is adequate
      capacity in the existing system to support the proposed development."
    source: data/documents/van-wert/operator/2026-08-05-qts-van-wert-project-faq.q-com.html
    tag: '[verified]'
    why_it_matters: >-
      This is the first time either party has named a specific WORK PRODUCT behind the capacity
      claim. It converts "no capacity study found" into a records request with a subject line: the
      joint QTS / City engineering capacity analysis for the campus, held by the City Engineer or
      the Safety-Service Director. It is the priority-1 pull on this thread.

  what_the_city_record_actually_says:
    reading: >-
      Four statements, no reconciliation, and the newest one withdraws the number rather than
      settling it. The corpus's fill-vs-annual ambiguity (issue 1409 / B2 1682) is not narrowing.
    entries:
    - date: '2026-04-21'
      who: Jay C. Fleming, Safety-Service Director
      what: >-
        City press release — a one-time initial fill, "approximately 660,000 gallons", "a one-time
        transaction required only at startup", a sealed water-and-glycol loop, reservoir >85% full,
        ~2 MGD of excess treatment and distribution capacity.
      source: '5.4.26-Public-Hearing-1.pdf p. 14 (issue 1401)'
      tag: '[verified]'
    - date: '2026-04-27'
      who: Jay C. Fleming, Safety-Service Director
      what: >-
        Six days later, to Council — the City "would be incapable of fulfilling the requires" if
        asked to supply fill water.
      source: '4.27.26.pdf p. 4 (issue 1401)'
      tag: '[verified]'
    - date: '2026-05-04'
      who: Thad Lichtensteiger, County Commissioner
      what: '"700,000 gallons of the city''s 1.6 million daily consumption … and that will last for 6 to 8 years"'
      source: '5.4.26-Public-Hearing-1.pdf p. 15 (issue 1401)'
      tag: '[verified]'
    - date: '2026-08-05'
      who: QTS (operator FAQ)
      what: >-
        No volume at all — "The total initial charging volume can vary widely … it's hard to
        predict the exact amount of water needed."
      source: data/documents/van-wert/operator/2026-08-05-qts-van-wert-project-faq.q-com.html
      tag: '[verified]'
    reading: >-
      Four statements, no reconciliation, and the newest one withdraws the number rather than
      settling it. The corpus's fill-vs-annual ambiguity (issue 1409 / B2 1682) is not narrowing.

  private_wells:
    what: >-
      Ordinance 26-06-034, "AN ORDINANCE ADOPTING SECTION 150.41 PRIVATE WELLS TO THE CITY OF VAN
      WERT CODE OF ORDINANCES", Judiciary and Annexation committee.
    origin:
      date: '2026-06-08'
      record: >-
        Councilman Block proposed "prohibiting any new wells be drilled within city limits;
        existing wells within the city limits will be grandfathered in. Council agreed this may be
        necessary to more clearly define an existing ordinance in which it is not clear if
        INDUSTRIAL AREAS ARE COVERED." Motion for the Law Director to prepare it carried.
      source: 'data/documents/van-wert/council/6.8.26.pdf p. 1'
      tag: '[verified]'
    the_drafted_text:
      exhibit_a: >-
        "Section 150.41 — Private Wells. No new private wells shall be a permitted use within the
        City of Van Wert through all zoning classifications. All new private wells shall be a
        conditional use in all zoning classifications."
      source: 'data/documents/van-wert/council/26-06-034-DRAFT.pdf p. 1'
      read_at: 450 DPI
      tag: '[verified]'
    the_discrepancy: >-
      THE DRAFT DOES NOT PROHIBIT ANYTHING. Council moved for a prohibition and the public
      discussion (2026-07-13) was about grandfathering and a geothermal exception; the drafted
      Exhibit A instead converts new private wells from a PERMITTED use to a CONDITIONAL use in
      every zoning classification — a discretionary approval, not a ban — and contains no
      grandfather clause and no geothermal exception in its own text. `[verified]` as of the draft
      posted 2026-06-22. What Council eventually enacts is `[open]`.
    procedural_state:
      introduced: '2026-07-13'
      first_reading_advisory: '2026-07-13'
      passed: null
      source: 'data/documents/van-wert/council/7.13.26.pdf p. 6'
      custody_caveat: >-
        Like every Van Wert ordinance PDF in this corpus, the posted file is unsigned and prints
        an unfilled "Passed: ____ 2026".
    why_it_belongs_in_the_water_thread: >-
      If enacted in this form, a campus inside city limits could not open a private well without a
      discretionary City approval in every zoning classification, which leaves the municipal
      system as the only unconditional supply. That is consistent with the operator's "no
      intentions of utilizing the aquifer" — but the record nowhere connects the ordinance to this
      campus, and the closest it comes is Council's own "not clear if industrial areas are
      covered". Reading the ordinance as aimed at the campus is `[inference]`, not a finding.
    also_on_the_record:
      - '2026-07-13, Fleming: in agreement with the prohibition "with an exception with a closed loop geothermal system" [verified] (7.13.26.pdf p. 2).'
      - '2026-07-13, Law Director Hatcher, answering a resident: "all parties within city limits would be prohibited" [verified] (7.13.26.pdf p. 2).'
      - '2026-07-13, Fleming cited the local Early Childhood Center as a commercial geothermal user, arguing the exception should not be residential-only [verified] (7.13.26.pdf p. 3).'

  what_would_close_it:
    - The joint QTS / City engineering capacity analysis named on the operator's FAQ.
    - Any water-service or sewer-service agreement between the City and QTS Van Wert LLC, and the utility-director or Council action the FAQ calls an approval.
    - The City's industrial-user / pretreatment permit for the campus (the C2 ask, issue 1688) — still unsearched, and the instrument that would settle where facility water goes.

# =============================================================================================
# 4. THE SCHOOL THREAD — Lincolnview Local, Van Wert City Schools, Vantage
# =============================================================================================
school_thread:
  status: negative
  tag: '[verified]'
  why_two_districts: >-
    The campus straddles two school districts (issue 1403) — 772.46 ac Lincolnview Local, 128.13
    ac Van Wert City — so any exemption deep enough or long enough to require board consent under
    R.C. 5709.62/5709.63 or a CRA compensation agreement under R.C. 3735.671 would have to reach
    BOTH boards, plus Vantage Career Center as a joint vocational district.
  lincolnview:
    route: 'BoardDocs public portal, go.boarddocs.com/oh/lls (committee A9HD78345336) — meeting list and full agendas readable without auth'
    read_on: '2026-08-05'
    meetings_enumerated: 12
    window: 2026-01-14 .. 2026-07-22
    agendas_read: ['2026-05-20', '2026-06-18', '2026-06-29', '2026-07-08', '2026-07-22']
    result: >-
      No agenda item mentioning a data center, QTS, an enterprise zone, an abatement, a
      revenue-sharing or compensation agreement, or a tax increment appears at any 2026 meeting,
      including every meeting after the campus was publicly announced. `[verified]`
    press_context: >-
      Superintendent Jeff Snyder is reported to have told the board in June 2026 that negotiations
      are the NEXT step, with financial information possibly available later `[reference]` (VW
      Independent, 2026-06-18). The board's own July meeting coverage carries no data-center item
      at all `[reference]` (2026-07-22).
    blind_spot: >-
      BoardDocs agenda ITEM TITLES were read; the minutes documents attached to those items were
      not retrieved — the portal's attachment endpoint was not resolved in this pass (see
      source_negatives). A superintendent's verbal report can appear in minutes without ever
      appearing as an agenda item, so this negative is against the AGENDA record, not against
      everything said in the room.
  van_wert_city_schools_and_vantage:
    result: not searched in this pass — '[open]'
    route: >-
      Van Wert City Schools posts board minutes as PDFs on its Finalsite-hosted site; Vantage
      Career Center is a separate joint vocational district board. Both are named here so the gap
      is explicit.

