# City of Van Wert (Van Wert County, OH) — the Mega Site primary-instrument set.
#
# Provenance vocabulary (see docs/investigative-method/ENRICHMENT.md):
#   [verified]  = stated in a captured primary record (cite file + page)
#   [reference] = secondary / self-published source, not a controlling record
#   [inference] = reasoned from verified facts, labelled as such, arithmetic shown
#   [open]      = not established by any captured source — do NOT assert
#
# THE ONE FACT THIS FILE EXISTS TO HOLD, stated as narrowly as the record allows: Ordinance
# 26-05-028 declares itself to be "in furtherance of" three Pre-Annexation Agreements dated
# 2014-11-14, 2014-12-22 and 2016-06-14, each recited as being among City Council, a named
# township's board of trustees, and the Board of County Commissioners. That recital — dates,
# parties, and the ordinance's own statement of what it furthers — is what is [verified].
# NOTHING MORE. None of the three agreements is in the corpus: their terms, the territory they
# cover, whether they bind anyone to anything, and whether they bear on THIS annexation at all are
# every one of them [open]. Reading them as a decade-early runway for the campus is an
# [inference], and a load-bearing one — do not restate it as fact, and do not write that the
# jurisdictions had "already agreed" to this project. What is verified is that a 2026 annexation
# ordinance reached back to instruments from 2014 and 2016 to justify itself, which is why those
# three agreements are the priority-1 pull.
#
# THE SECOND FACT: on 2026-05-11 the City of Van Wert had no zoning category for what it was
# approving. Ordinance 26-05-029 wrote the words "Data Center" into the Van Wert Code of
# Ordinances for the first time, and Ordinance 26-05-030 designated 901.698 acres for that use in
# the same sitting.
#
# Nothing here is a characterization of motive. Where the record contradicts itself — and it does,
# on the annexation's own statutory route and on how much water the City is selling — both
# readings are printed with their citations and the conflict is left standing.

meta:
  subject: >-
    The City of Van Wert legislative instruments that annexed, defined and zoned the QTS Van Wert
    Mega Site — Ordinances 26-05-028 / 029 / 030, passed as emergencies on first and final reading
    2026-05-11 — together with the 2026-05-04 statutory public-hearing record and the 2026-04-27
    meeting that ordered them
  kind: instrument-set
  site: van-wert
  captured_for: issue 1401 (epic 1267, readiness(van-wert))
  extracted_at: '2026-08-03'
  sources:
    documents: data/documents/van-wert/council/
    manifest: data/documents/van-wert/council/filename-map.yaml
  method: >-
    Nine PDFs pulled 2026-08-03 from the City's open WordPress upload tree
    (https://vanwert.org/wp-content/uploads/). SEVEN of the nine carry no text layer at all (0
    extractable characters): the six ordinance files and 4.27.26.pdf. The remaining TWO
    (5.11.26.pdf, 5.4.26-Public-Hearing-1.pdf) carry a PARTIAL text layer covering only their
    typed attachments — their minutes bodies are images. So every figure and quotation below was
    read by rendering the page with pypdfium2 and running tesseract
    (watermark.civic.indexer.ocr_pdf) at 300 DPI, with targeted 450- and 500-DPI re-renders where
    the 300-DPI read was ambiguous and a 600-DPI render for the handwritten approval stamp — never
    from the OCR of a filename or an upload path. Page numbers below are 0-based PDF page indices.
  ocr_caveat: >-
    26-05-028.pdf and the Exhibit-A pages of 26-05-030.pdf are photocopies of a bound record book,
    heavily skewed and degraded. Metes-and-bounds courses in those exhibits are NOT transcribed
    here — OCR at 450 DPI still garbles bearings and distances, and a wrong bearing is worse than
    no bearing. Only figures that survived a clean read at two DPIs are stated, and the acreage
    reconciliation below is arithmetic over four such figures, shown in full.
  visually_verified: >-
    Four load-bearing readings were confirmed by rendering the page and READING IT, not by
    trusting tesseract: the "TYPE 2" in the posted 26-05-028 title against the "TYPE 1" in the
    minutes' passage title, the 660,000-gallon fill sentence, the 5,342 MW / 30,000 MW sentence,
    and the handwritten approval stamp on 5.11.26.pdf p. 4. HANDWRITING IS THE RULE, NOT THE
    EXCEPTION: tesseract read that stamp as "5/211202¢6" at both 300 and 500 DPI, and a
    digit-by-digit reading of that OCR gives 2026-05-21 — a Thursday on which Council did not
    meet. The page plainly reads "Approved on 5/27/2026", which IS the meeting (the second May
    meeting moved to Wednesday the 27th for Memorial Day). Do not date anything in this corpus
    from OCR of handwriting.

