# ── Where the record contradicts itself ───────────────────────────────────────
# Printed, not resolved. Each is a discrepancy inside the City's OWN documents.
discrepancies:

- id: expedited-type
  question: Was this an Expedited Type 1 or an Expedited Type 2 annexation?
  tag: '[verified]' # that the conflict exists; which route governs is [open]
  type_2_appears_in:
  - 4.27.26.pdf p. 3 — the committee motion that ordered the ordinance ("expedited Type 2 annexation of approximately 901.69[8] acres")
  - 26-05-028-draft-ordinance.pdf p. 0 — the ordinance title the City posted on 2026-05-07
  - 5.11.26.pdf p. 0 — the 2026-05-11 agenda, before it was amended
  type_1_appears_in:
  - 5.11.26.pdf p. 3 — the title as read at passage
  the_citys_explanation: >-
    At the top of the 2026-05-11 meeting, Law Director Hatcher requested a motion to amend the
    agenda from "Type 2" to "Type 1" as "a typographical error in the agenda only, the Ordinance
    title is true and accurate." The minutes then add: "This EXPEDITED TYPE 1 ANNEXATION is
    consistent with the change in the Agenda at the start of the meeting and is consistent with
    the heading of Ordinance 26-05-028 itself."
  why_that_does_not_close_it: >-
    The minutes' own added sentence — "This EXPEDITED TYPE 1 ANNEXATION … is consistent with the
    heading of Ordinance 26-05-028 itself" — is contradicted by that heading. The ordinance the
    City published on 2026-05-07 is titled "AN ORDINANCE TO ACCEPT THE EXPEDITED TYPE 2
    ANNEXATION OF 901.698+/- ACRES…", and the committee motion two weeks earlier said Type 2 as
    well. BOTH READINGS WERE CONFIRMED VISUALLY at 400 DPI, so this is a discrepancy in the
    record and not an OCR artifact. The correction was framed as agenda-only; the record shows
    the same word in two other places. Whether the ENACTED instrument reads Type 1 cannot be
    settled from any document in this corpus, because no signed or certified copy is public —
    only unsigned pre-passage uploads and the minutes' account of the title as read.
  why_it_matters: >-
    [inference] R.C. 709.022 (expedited type 1) and R.C. 709.023 (expedited type 2) are different
    procedures with different consequences for township taxation and for what the annexed
    territory remains subject to. The three recited Pre-Annexation Agreements among the City, the
    townships and the BOC are the kind of instrument a type-1 route rests on, which is consistent
    with the passed title — but that is a reading of the statute against the recitals, not a fact
    the record states.
  resolution_route: >-
    A certified copy of Ordinance 26-05-028 from the Clerk of Council, and/or the annexation
    transcript filed with the County Recorder and the Ohio Secretary of State under the
    ordinance's own Section 2.

- id: initial-fill-volume
  question: How much water is the City selling for the initial closed-loop fill?
  tag: '[verified]' # that three figures are on one record; which is right is [open]
  figures:
  - value: ~660,000 gallons
    framing: >-
      "there will be a one-time initial fill of the closed-loop system. The city will sell the
      developers approximately 660,000 gallons of water for this purpose … This is a one-time
      transaction required only at startup."
    who: Jay C. Fleming, Safety-Service Director, City of Van Wert
    source: 5.4.26-Public-Hearing-1.pdf p. 14 (City press release, 2026-04-21)
  - value: 700,000 gallons
    framing: >-
      "The cooling loop system uses less than a half a day's water for the City of Van Wert
      (700,000 gallons of the city's 1.6 million daily consumption), and that will last for 6 to
      8 years."
    who: Thad Lichtensteiger, Van Wert County Commissioner (on Commissioners' letterhead)
    source: 5.4.26-Public-Hearing-1.pdf p. 15 (written comment, 2026-05-04)
  - value: 5,500 gallons
    framing: attributed by an opposing commenter to the city-launched project website's own answers page
    who: written public comment, citing "Van Wert Ohio Data Center (2026)"
    source: 5.4.26-Public-Hearing-1.pdf p. 104
  the_conflict: >-
    Two officials, one week apart, give two volumes for the same fill — and they do not agree on
    whether it recurs. Fleming: "a one-time transaction required only at startup." Lichtensteiger:
    "that will last for 6 to 8 years," which describes a service life, not a one-time purchase.
    The third figure is two orders of magnitude smaller and reaches the record only second-hand.
  bearing_on_the_corpus: >-
    This is the same fill-vs-annual ambiguity already logged as the #1409 open question and
    carried as WaterAccount.disclosed_makeup by B2 (#1682). The primary record now DEEPENS that
    ambiguity rather than settling it — the discrepancy is not between the corpus and the City,
    it is inside the City's own record. Per the B2 rule, a self-report of the very claim under
    test never upgrades the source, so the closed-loop pin stays [reference] and the gap stays a
    gap.

- id: where-the-facility-water-goes
  question: Does facility water reach Town Creek?
  tag: '[verified]' # that the two statements sit oddly together
  statement: >-
    Fleming, 2026-04-27: "any time the facility must clean or dispose water, it goes directly to
    the wastewater treatment plant to be dealt with. It will not be put in the ground, aquifers or
    town creek." (4.27.26.pdf p. 4)
  the_tension: >-
    Van Wert's WWTP discharges to Town Creek. Outfall 001 under NPDES 2PD00006*WD sits at River
    Mile 13.87 on COMID 15653063 — the same flowline as the City's own raw-water intake — and five
    CSO outfalls sit between them (data/extracted/van-wert/water-watch.yaml, #1406). Water routed
    "directly to the wastewater treatment plant" reaches Town Creek by definition, after
    treatment. The statement is defensible as a claim about DIRECT discharge and about
    groundwater; as stated it is not accurate about Town Creek.
  bearing: >-
    [inference] If the facility routes cleaning/blowdown water to the WWTP, the receiving-water
    question for this campus is not "will it discharge to Town Creek" but "what does it add to a
    plant already under a dated CSO construction schedule." That is a different and more tractable
    question than the one the public debate was having.

- id: acreage-in-the-register
  question: How many acres were annexed?
  tag: '[verified]'
  correction: >-
    901.698 ± acres. The figure carried in this corpus's register since 2026-07-02 — "~962 acres
    annexed 2026-05-11" — came from press coverage and is WRONG. The instrument states 901.698 in
    two ordinance titles, and its own Exhibit A components sum to exactly that. Corrected in
    data/extracted/van-wert/data-centers.md.

- id: vote-tally
  question: Did the ordinances pass 6-0?
  tag: '[verified]'
  correction: >-
    The minutes record NO numeric tally for any of the three ordinances — each reads "all
    concurred. Ordinance passed." Seven members answered roll call; Roberts was excused during
    public comment and abstained as a Marsh Foundation employee, leaving six. "6-0" is a
    reasonable reconstruction and it is how the press reported it, but it is not what the
    instrument says. The one roll-called Mega Site vote in this document set is the 2026-04-27
    preparation motion: "Hurless, Agler, Ringwald, Johnson, Block, and Moore voted yes. Roberts
    abstained." (4.27.26.pdf p. 2)

