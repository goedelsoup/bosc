- id: ord-26-05-029
  ordinance: '26-05-029'
  committee: Judiciary and Annexation
  title: >-
    AN ORDINANCE TO AMEND VAN WERT CODE OF ORDINANCES SECTION 150.03 TO ADD THE TERM "DATA CENTER"
    AS A DEFINED TERM AND TO MODIFY THE DEFINITION OF THE TERM "PUBLIC SERVICE FACILITY", TO AMEND
    VAN WERT CODE OF ORDINANCES SECTION 150.15(h)(1) BY ADDING DATA CENTERS AS A PERMITTED USE IN
    THE I-2 GENERAL INDUSTRIAL ZONING CLASSIFICATION, AND DECLARING AN EMERGENCY.
  tag: '[verified]'
  source:
    body: 26-05-029-draft-ordinance.pdf pp. 0-1
    exhibit_a: 26-05-029.pdf pp. 2-3
    passage: 5.11.26.pdf p. 4
  effect: >-
    Writes "Data Center" into the Van Wert Code of Ordinances for the first time, adds it to the
    I-2 General Industrial permitted-use list, and rewrites the "Public Service Facility"
    definition.
  emergency: true
  readings: first and final (statutory rules suspended)
  vote_as_recorded: '"Moore seconded; all concurred. Ordinance passed." — no numeric tally'
  new_definition_verbatim: >-
    "Data Center. A facility comprised of a building or group of buildings designed to incorporate
    a large number of computer servers used for the storage of, processing, and distribution of
    large amounts of data, and the accessory equipment and structures necessary to support the
    critical functions of the facility such as (but not limited to) generators, cooling towers,
    fuel storage, and electrical equipment."
  definition_note: >-
    [verified] The City's own definition names GENERATORS, COOLING TOWERS and FUEL STORAGE as
    accessory equipment a data center is expected to carry — written into the code in the same
    sitting that approved a campus the record elsewhere describes as closed-loop and
    non-evaporative. The definition is generic and permits an evaporative build; it is not a
    constraint on this campus and does not contradict the closed-loop disclosures. Recorded
    because the code text, not the press release, is what binds the next applicant.
  public_service_facility_change: >-
    [verified] The amended §150.03 definition adds a footnote to "power plants or substations":
    "*These facilities can only be operated in the I-2 zoning district." Generation and substation
    siting citywide was narrowed to I-2 in the same ordinance that made data centers an I-2 use.
  permitted_use_list_as_amended:
