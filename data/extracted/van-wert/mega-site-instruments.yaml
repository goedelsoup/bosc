# ── The written-comment record ────────────────────────────────────────────────
public_comment:
  hearing_2026_05_04:
    attendance: ~200
    speakers: ~40
    format: comment-only, two minutes each, one turn per person, no questions taken
    tag: '[verified]'
    source: 5.4.26-Public-Hearing-1.pdf pp. 0-1
    written_comment_pages: 88   # pp. 17-106
  meeting_2026_05_11:
    speakers_on_annexation: 18
    written_comment_signers: 25
    tag: '[verified]'
    source:
      speakers_on_annexation: 5.11.26.pdf p. 5 (named list, "Members of the Public who spoke in regards to annexation")
      written_comment_signers: 5.11.26.pdf p. 6 (written-comment sign-in sheet)
  duplication:
    tag: '[verified]'   # the measurement; the "campaign" reading of it is the [inference] below
    finding: >-
      Of the 88 written-comment pages in the 2026-05-04 record, 21 share an IDENTICAL normalised
      900-character opening with an earlier page. Clustering on that prefix yields 67 distinct
      openings across 88 pages; 15 clusters hold more than one page and the largest holds five
      (pp. 31, 32, 34, 40, 49).
    full_body_check: >-
      Measured separately, because a shared opening is not a verbatim page. Compared over the
      WHOLE normalised body, only ONE pair of pages is byte-identical (pp. 17 and 64, two scans of
      the same two-page letter); on that test there are 87 distinct bodies across 88 pages. The
      other 20 differ from their cluster-mate somewhere after the first 900 characters. They do
      not differ by much: full-body similarity to the cluster's first page runs 0.974 to 1.000
      with a median of 0.987 (difflib.SequenceMatcher over the normalised text, median body 1,114
      characters), and the divergence sits in the tail — signature blocks, addresses and closing
      lines, which are handwritten and OCR-noisy. So: near-identical, not verbatim. Do not write
      "verbatim" of anything but pp. 17/64.
    method: >-
      Reproducible from the committed PDF: OCR at 300 DPI, split on page, keep pages whose
      normalised body is >= 400 characters (this is the 88), lowercase and strip to letters and
      spaces, then (a) group on a hash of the leading 900 characters and (b) group on a hash of
      the whole body, and score full-body pairs with difflib.
    caveats: >-
      The count is of PAGES, not of people: a cluster may be one letter scanned twice, a two-page
      letter counted as two pages, or different signers submitting the same text — the signature
      blocks are handwritten and largely illegible to OCR, so who signed what is not established
      from this file.
    campaign_reading:
      tag: '[inference]'
      text: >-
        That 21 of 88 pages open with 900 identical characters and stay ~98-99% identical
        thereafter is very hard to produce by independent authorship, and the same claim set
        recurs across them in near-identical wording (a $10 billion investment, $200 million in
        community revenue over 20 years, 200-250 permanent jobs at roughly $80,000, 1,000-1,500
        construction jobs, closed-loop cooling, and a site "designated and pre-annexed for
        industrial use since 2007"). Reading that as a coordinated letter campaign is the natural
        inference and it is labelled as one. What the record does NOT establish is who organised
        it, whether signers knew the text was shared, or how many distinct people are behind the
        21 pages.
  the_2007_claim:
    tag: '[open]'
    finding: >-
      "The site has been designated and pre-annexed for industrial use since 2007" recurs across
      the support letters. NOTHING in this instrument set supports 2007. The ordinances' own
      recitals date the pre-annexation agreements to 2014-11-14, 2014-12-22 and 2016-06-14. The
      2007 date may refer to a Mega Site designation, a comprehensive plan, or a JEDD — none of
      which is in the corpus. Do not carry 2007 as a fact; carry the three agreement dates.
  the_one_cited_opposition:
    tag: '[verified]'
    source: 5.4.26-Public-Hearing-1.pdf pp. 104-106
    finding: >-
      One written comment (pp. 104-106, submitted with a full reference list) argues the water
      case with citations: that all Van Wert County subwatersheds are impaired and Lower Town
      Creek specifically for E. coli and PCBs, with no plan in place eight years after detection
      (EPA, HUC 041000070804); that the reservoir holds 1.01 billion gallons against a creek
      yielding 180 MG to 1.26 BG a year; that county annual public surface-water withdrawal is
      1.002 billion gallons; that Ohio EPA's draft data-center general permit OHD000001 would
      loosen discharge regulation; and that closed-loop systems still require line bleeds carrying
      PFAS.
    why_it_is_recorded: >-
      Two of its figures — the 1.01 BG reservoir and the 180 MG-1.26 BG creek yield — are the same
      figures independently committed at data/extracted/van-wert/water-watch.yaml from the City's
      own utilities publications. The corpus and an informed member of the public reached the same
      numbers from the same public sources. Its arithmetic elsewhere does NOT survive checking
      (it multiplies a 500 MW figure by a per-MWh water intensity to get "1,400,000 gallons of
      water an hour", conflating MW with MWh, and its 5,500-gallon fill is two orders of magnitude
      off the City's own figure) — recorded so the citation is usable and the arithmetic is not.
    ohd000001_note: >-
      The comment cites OHD000001 as a live draft. It is not: Ohio EPA WITHDREW the draft
      data-center general permit on 2026-07-21 (see the Bowling Green record, #1685). The hearing
      record preserves a regulatory premise that has since lapsed.

