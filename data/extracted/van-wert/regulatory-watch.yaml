  air_pti:
    watch_item: 2
    subject: Ohio EPA air Permit-to-Install for the campus's emergency-generator bank
    outcome: negative
    tag: '[verified negative]'
    checked_on: '2026-08-05'
    why_it_is_the_most_valuable_thread: >-
      This is the single instrument that would lift the facility readiness domain from `seeded` to
      `live` (#1630) — it is the document that states generator count and ratings, and therefore
      the first document that would ground this campus's load with something other than a press
      bracket. Every other thread on this watch is context; this one is the hinge.
    queries_run:
    - query: eDoc — Entity Name "QTS", statewide, all programs
      result: >-
        35 documents. Three are Van Wert (the 2GC08872 stormwater family, NPDES). The other 32 are
