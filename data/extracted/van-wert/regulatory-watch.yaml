    what_would_close_it: >-
      A DRAFT FOR PUBLIC COMMENT or PUBLIC NOTICE under Program = AIR PERMIT, County = VAN WERT,
      for a QTS facility. Ohio EPA publishes the draft before the final, so the draft is the
      earliest signal and it is the document that names the generators. Note the campus is one of
      the few large data centers whose operator says generators are emergency-only, tested
      monthly — if they stay under 500 hr/yr they may fall under permit-by-rule and NO PTI would
      ever issue. That possibility is [open] and must not be mistaken for delay.

