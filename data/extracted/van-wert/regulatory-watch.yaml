        QTS North Justice, QTS NAL 1/NAL 2, QTS - NAL3 Stockpile. Not one Van Wert air document.
      note: >-
        35 is the same count #1402 reported on 2026-08-03, and the newest document in the set is
        still the 2026-07-30 Van Wert approval. Nothing has been added to QTS's Ohio fleet in six
        days.
    - query: eDoc — County = VAN WERT, Program = AIR PERMIT, all entities
      result: >-
        328 documents, and the newest is dated 2026-08-04 — YESTERDAY. No QTS document, no data
        center, no Mega Site facility, under any entity name, at any date.
    positive_control:
      tag: '[verified]'
      statement: >-
        The Van Wert County air-permit stream is live and current to within one day of this check.
        The most recent document is a PRELIMINARY PROPOSED Title IV acid-rain permit (renewal) for
        the Robert P. Mone Plant, facility ID 0381000043, permit P0140139, letter-dated
        08/04/2026 — issued in draft 05/21/2026, comment period closed, now going to U.S. EPA.
        Ohio EPA DAPC's NORTHWEST District Office is copied, confirming the district that would
        handle a Mega Site application. So the route surfaces Van Wert County air permits within a
        day of signature, for a generating station, in the same county, through the same office.
        The zero is a zero, not a broken query.
    corroborating_negative:
      tag: '[verified]'
      statement: >-
        Independent of any search: the campus's own Notice of Intent answers the permit-status
        field `PTI: YET_TO_APPLY`, certified under penalty of law 2026-07-21 (#1402). That is an
        instrument-grade statement of the negative by the party who would have to file it. The two
