  local_ballot:
    watch_item: 6
    subject: The local ballot effort against the campus's zoning
    outcome: decided_against
    tag: '[reference]'
    checked_on: '2026-08-05'
    decided_on: '2026-07-27'
    headline: >-
      It failed, and the mechanism was not the one the issue predicted. The issue expected a
      REFERENDUM and expected the emergency clauses to foreclose it. What was actually filed was
      an INITIATIVE — a proposed new ordinance repealing the old one — which is the route that
      remains open when emergency passage has closed the referendum route. It then died on
      signatures, not on the emergency clause.
    chronology:
    - {date: '2026-07-18', event: 'Initiative petitions filed by Joe Jared, a City of Van Wert resident'}
    - {date: '2026-07-27', event: 'Van Wert County Board of Elections certification received; petition insufficient'}
    what_it_targeted:
      tag: '[reference]'
      ordinance: 26-05-029
      statement: >-
        Ordinance 26-05-029 — the code amendment that wrote "Data Center" into Van Wert Code
        §150.03 for the first time and added it to the I-2 permitted-use list. The corpus already
        holds that instrument (#1401), and this is a useful independent confirmation of which of
        the three May ordinances opponents identified as the load-bearing one: not the annexation
        and not the site-specific rezoning, but the definitional amendment. The initiative would
        have prohibited data centers in industrial zones, with a narrow exception for data
        processing "accessory to and located on the same site as a corporate headquarters".
    the_numbers:
      tag: '[reference]'
      required_valid: 323
      obtained_valid: 255
      short_by: 68
      target_election: '2026-11-03'
      certifying_officer: Pam Henderson, Director, Van Wert County Board of Elections
      announced_by: Erika Blackmore, City Auditor of Van Wert, presenting the BOE certification
      statutes_cited: [R.C. 731.28, R.C. 731.34, R.C. 3501.11(K), R.C. 3501.38]
    why_it_cannot_be_cured:
      tag: '[reference]'
      statement: >-
        Because the petitions were submitted to the Board of Elections, new signatures cannot be
        added to them. That is what makes this a decided thread rather than a pending one: the
        shortfall is not a deadline that could be met later with more signatures on the same part
        petitions. A fresh petition for a later election is a different filing and is not
        foreclosed by this outcome.
    tag_rationale: >-
      `[reference]`, not `[verified]`, throughout — every figure here comes from local press
      quoting the BOE director and reproducing the City Auditor's presentation of the
      certification. The certification itself is a public record of the Van Wert County Board of
      Elections and is NOT in this corpus. The counts are consistent across two independent
      articles, which is corroboration, not primacy.
    what_would_make_it_verified: >-
      The Board of Elections' own certification and the filed part petitions — an R.C. 149.43
      request to the Van Wert County BOE. That record would also give the invalidation reasons
      per signature, which is the interesting part and which press reports only in the generic
      ("not registered, not city residents, signature mismatch, circulator-statement errors").
    still_open:
      tag: '[open]'
      items:
      - Whether a protest or appeal of the certification was filed within any applicable window.
      - Whether a fresh initiative is being circulated for a 2027 election.
      - >-
        Whether the emergency clauses did in fact foreclose a referendum on 26-05-028/029/030.
        The issue assumed so and the opponents' choice of an initiative is consistent with it —
        but consistency is not proof, and no instrument in this corpus states it. The
        certified-copy problem #1401 recorded (no signed copy of any of the three ordinances is
        public) sits underneath this question.

