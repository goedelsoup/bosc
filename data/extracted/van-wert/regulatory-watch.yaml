  data_center_general_permit:
    watch_item: 4
    subject: The statewide data-center NPDES general permit OHD000001
    outcome: moot
    tag: '[verified]'
    checked_on: '2026-08-05'
    finding: >-
      Permanently answered before this watch ran. Ohio EPA posted a Community Notice dated
      2026-07-21 declining to finalize the draft, and #1883 has already swept the Van Wert record
