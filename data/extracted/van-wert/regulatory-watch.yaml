        sewer, and a campus on the sewer holds no NPDES permit whatsoever. The instrument that
        would disclose it is the City of Van Wert's industrial-user / pretreatment permit and
        sewer-use agreement, which is a municipal record under R.C. 149.43 and appears on no
        state or federal portal. Neither has been searched. [open] — tracked as the C2 ask
        (#1688 / #1409).
      the_trap: >-
        A future pass must not read "no NPDES permit found for the campus" as evidence that no
        discharge is planned. For a sewered campus that absence is the EXPECTED state, and it is
        permanent. The absence that would be informative is a missing City pretreatment permit,
        and that is a records request, not a portal query.

