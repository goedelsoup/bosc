  statewide_ballot:
    watch_item: 7
    subject: Conserve Ohio's proposed constitutional amendment banning data centers over 25 MW
    outcome: deferred_to_2027
    tag: '[reference]'
    checked_on: '2026-08-05'
    finding: >-
      Confirmed and dated. The group missed the 2026 cycle: more than 413,000 valid signatures
      from at least 44 of Ohio's 88 counties were required by 2026-07-01, and as of 2026-06-18 it
      had collected over 70,000 — roughly 17% of the requirement. Conserve Ohio has said "We are
      not going to be submitting this year" and is retargeting the 2027 ballot with 1,000+
      volunteers still collecting.
    top_counties_reported: {Lucas: 6482, Stark: 6329, Butler: 4030}
    relevance_here:
      tag: '[inference]'
      statement: >-
        Bounded, and worth stating so the thread is not over-read. The measure would prohibit data
        centers with peak load exceeding 25 MW per month. This campus's load is carried at a
        `[reference]` 500 MW bracket and is not disclosed — but any figure in the plausible range
        is an order of magnitude above 25 MW, so the measure would reach it if it passed. It is
        also two ballot cycles and a signature campaign away from mattering, and the campus's own
        filed completion date is 2030-08-03. Watch it annually, not quarterly.
    next_dated_trigger: >-
      The 2027 filing deadline, and any Ohio Attorney General certification of summary language
      or Ohio Ballot Board determination — neither of which has been checked on the AG/Ballot
      Board's own record. That check is the upgrade path from `[reference]` to `[verified]`.

