  four_oh_one_four_oh_four:
    watch_item: 5
    subject: Section 401 water quality certification / Section 404 USACE authorization
    outcome: negative
    tag: '[verified negative]'
    checked_on: '2026-08-05'
    queries_run:
    - query: eDoc — County = VAN WERT, Program = 401 WETLANDS, all entities, all dates
      result: >-
        FOUR documents for the entire county, and none is the campus. Three are the Van Wert
        Airport Runway Expansion (DSW401241237, 2024-10/11) and one is Van Wert Reservoir #3
        (DSW401073053, 2013). Nothing for QTS, the Mega Site, or any 2026 filing.
    positive_control:
      tag: '[verified]'
      statement: >-
        The airport rows prove the route works for this county AND show exactly what a 404 looks
        like when it exists: that project's eDoc facility name carries its Corps identifier in
        line — "VAN WERT AIRPORT RUNWAY EXPANSION (LRB-2024-00952)" — which also settles that Van
        Wert County sits in the USACE BUFFALO District (LRB), the district a campus filing would
        go to. A Van Wert 401 is visible on this route, with its Corps number attached, when one
        is filed.
    corroborating_negative:
      tag: '[verified]'
      statement: >-
        The campus's own NOI answers "NO" to both an individual 401 Water Quality Certification
        and an Isolated Wetlands Permit, while answering `YET_TO_APPLY` on the USACE nationwide
        permit (#1402). Ohio EPA's approval letter separately warns that fill in regulated waters
        may require a 401 and/or an isolated-wetlands permit. So the applicant asserts it needs
        neither state instrument and has not yet sought the federal one.
    the_structural_limit:
      tag: '[verified]'
      statement: >-
        A nationwide-permit VERIFICATION is not public-noticed. An INDIVIDUAL 401 or an individual
        404 would be; an NWP verification is a letter from the district to the applicant, and the
        only routes to it are a FOIA to USACE Buffalo or the applicant's own disclosure. QTS's
        published FAQ says stream impact falls below the individual-permit threshold and that
        USFWS review is complete — `[reference]`, the applicant describing its own project. So
        the most likely outcome on this thread is that the authorization issues and NEVER APPEARS
        on any watchable portal. Do not read continued silence here as continued absence.
    what_would_close_it: >-
      A DSW401-numbered document under County = VAN WERT naming the campus (the individual-permit
      branch), or a USACE Buffalo District public notice (the individual-404 branch). Failing
      both, a FOIA to LRB for any NWP verification issued to QTS Realty Trust Inc. or QTS Van Wert
      LLC — which is the branch the applicant's own answers point to.

