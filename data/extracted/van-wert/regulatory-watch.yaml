      thread is not left blank and re-opened by a future pass.
    source: data/documents/oepa/2026-07-21-ohio-epa-will-not-finalize-data-center-general-permit.npdes-general-permits.html
    what_it_means_here:
      tag: '[verified]'
      statement: >-
        The issue called OHD000001 "the likeliest wrapper for any future campus discharge". There
        is now no general-permit path at all, and the individual-permit path is not established
