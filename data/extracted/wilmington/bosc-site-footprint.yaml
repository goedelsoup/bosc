dominant_hsg:
  value: C
  source: connector
  citation: >-
    [verified] USDA NRCS SSURGO via Soil Data Access (SDA), grid-sampled over
    parcel-assemblage.geojson (watermark.hydrology.connectors.ssurgo.dominant_hsg, 2026-08-01).
    Over the CAMPUS TRACT the answer is C at every resolution tested — 8x8 (41 interior points:
    C 16, B/D 15, C/D 10), 10x10 (61 pts), 12x12 (89 pts) and 16x16 (158 pts: C 43.7%, B/D 34.8%,
    C/D 21.5%) — so the letter is not a grid artefact. The map units are the Southern Ohio Till
    Plain association: Miamian silt loam 6-12% eroded (C, 9 pts), Treaty silty clay loam 0-1%
    (B/D, 10 pts), Fincastle silt loam 2-4% (C/D, 7 pts) and 0-2% (B/D, 4 pts), Xenia silt loam
    2-6% (C, 4 pts) and its eroded phase (C/D, 3 pts), Sligo silt loam occasionally flooded
    (C, 3 pts), Treaty silt loam overwash (B/D, 1 pt). This CONFIRMS the profile's prior
    [inference] letter "C" and its reasoning — glaciated till plain, not the buried-valley
    outwash of the Mad River / Great Miami sites — and upgrades it to [verified]. It is the
    opposite outcome from Sidney (B->D), Urbana (B->C) and Troy-Piqua (B->C/D), where the prior
    inference had argued from an aquifer rather than the surface. TWO CAVEATS. (1) It is a
    PLURALITY on a mixed mosaic, not a uniform C: ~60% of campus points carry a DUAL rating whose
    UNDRAINED letter is D, so under the post-development condition (tile severed;
    watermark.hsg / WS-20) the runoff basis brackets materially above a flat C, and any screen
    should state that bracket rather than read C as settled. (2) The letter is grid-stable for the
    campus but NOT for the whole 1,023-ac corridor, which returns C/D at 8x8, 10x10 and 12x12 and
    C at 6x6 and 16x16 as the four petitioned tracts pull it wetter — this record characterizes
    the disclosed campus, which is what the stormwater screen models.
  confidence: high

