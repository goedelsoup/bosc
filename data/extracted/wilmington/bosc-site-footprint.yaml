# The US-68 S / SR-730 data-center corridor — footprint record for the Wilmington, OH
# (Lytle Creek → Todd Fork → Little Miami) watershed point. LIKE Sidney's / Troy-Piqua's /
# Urbana's (and UNLIKE Lima's document-transcribed stormwater-permit footprint), the boundary here
# is drawn from the auditor's parcels, committed as
# data/reference/wilmington/parcel-assemblage.geojson. UNLIKE all of those, it is NOT one thing:
# it is a recorded OWNERSHIP holding (the three parcels deeded to Amazon Data Services, Inc.)
# ADJOINING a legislative REZONING schedule (the four tracts of ordinances O-26-04 – O-26-07,
# still in their original owners' names). Read `boundary_basis` before quoting any acreage.
# parcel_acres is the GIS-measured planar area; building/impervious/developed stay [open] pending
# the site-plan PDFs. Source tags: reference = committed GIS reference dataset; connector = a live
# public-data read; document = transcribed from a corpus instrument; assumption = a stated
# modeling input.
site: >-
