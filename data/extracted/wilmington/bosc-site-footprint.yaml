receiving_water: >-
  [inference] Lytle Creek → Todd Fork → Little Miami River (HUC-8 05090202). The corridor sits on
  the till upland south-west of the City; the specific stormwater receptor for the built campus is
  [open] pending the construction stormwater permit. DISTINCT from the SANITARY pathway, which the
  record does close: campus wastewater goes to the City of Wilmington WWTP → NPDES OH0028134 /
  Ohio EPA 1PD00013*QD → outfall 001 to Lytle Creek at RM 6.83, watershed
  HUC 05090202-06-03, Clinton County, Eastern Corn Belt Plains ecoregion; use designations
  Warmwater Habitat, General High Quality Water, Agricultural + Industrial Water Supply and
  Primary Contact Recreation (OAC 3745-1-18) [verified — Ohio EPA NPDES fact sheet 1PD00013.fs,
  2023-05-19, p.2]. Read the two HUCs as what they are: 05090202 is the HUC-8 BASIN this corridor
  drains into, an [inference] about undelineated stormwater; 05090202-06-03 is the regulator's
  own watershed code for the OUTFALL, [verified], and it is the one the low-flow screen is keyed
  to (#886). And DISTINCT again from the WITHDRAWAL side, which is Caesar
  Creek Lake, not this basin (#1472). One SSURGO map unit on the campus, Sligo silt loam, is rated
  "occasionally flooded" — a flag for the site-plan/floodplain review, not a delineation.

notes:
  - 'LOW FLOW — the receiving reach now carries a committed 7Q10 and the assimilative screen runs (#886, closing the #516/#1472 thread). Lytle Creek at WWTP outfall 001 (drainage area 9.0 mi², USGS NLDI basin polygon for NHDPlus comid 3932402): 7Q10 = 0.0068 cfs, 1Q10 = 0.0045 cfs, harmonic mean = 0.237 cfs. DERIVED, not cited, and the distinction is the finding: Ohio EPA fact sheet 1PD00013.fs states NO design low flow for this reach anywhere in its 11 pages [verified — exhaustive read, 2026-08-01], having set limits on BADCT plus the 2011 Lower Little Miami TMDL rather than on assimilative capacity — on a reach this small there was no capacity to allocate. The value is a drainage-area-ratio transfer (b = 1.0, same stream system) of a log-Pearson III fit on USGS 03244000 (Todd Fork near Roachester, DA 219 mi²), 21 complete climatic years, 8,094 days, 1952-09-01..1974-10-29, LP3 7Q10 0.1654 cfs (90% band 0.0809-0.3385, transferring to 0.0033-0.0139). VINTAGE: that record ends in 1974 and nothing on Todd Fork, Lytle Creek or Caesar Creek below the dam has reported discharge since — it is the most recent measurement of this stream that exists, not a current one, and it is committed at confidence: low for exactly that reason. Against the WWTP''s 3.0 MGD design flow (4.6417 cfs) the reach is 99.85% effluent at design low flow, 99.90% after the PTI #1543170 expansion to 4.5 MGD. Screening denominator committed at data/reference/hydrology/low-flow-7q10.yaml (`lytle creek`); full method, drainage areas and the two water threads in data/extracted/wilmington/low-flow-screen.md §2.3-2.6.'
  - 'CORRIDOR = 7 parcels / 1,023.764 ac deeded / 1,023.786 ac planar / ONE contiguous polygon. Amazon holding (3 parcels, 478.885 ac deeded): 285-13-02-01-0000-00 (471.609 ac, situs 1488 S US 68, use 111 cash-grain farm CAUV, tax district 285-UNION TWP-WILMINGTON), 290-26-01-12-0000-00 (7.040 ac ROW on US 68, annexed to city district 290 in 1988) and 270-13-02-01-0000-00 (0.236 ac ROW on SR 730) — all conveyed 2025-12-10 on recorder instrument 2025-00005287 for a single $86,436,000 consideration, valid_sale True. Petitioned rezoning (4 parcels, 544.879 ac deeded): 285-13-11-02-0000-00 / O-26-04 / L T Land Development LLC / 119.375 ac; 285-13-03-01-0000-00 / O-26-05 / Matthew E Thompson / 65.323 ac (situs 1957 SR 730); 285-13-02-02-0000-00 / O-26-06 / June 11 2001 Ralph Larry Roberts II FT / 190.065 ac; 285-13-04-01-0000-00 / O-26-07 / Jack L Webb RLT / 170.116 ac. All [verified] from the Clinton County Auditor CAMA (cntyparcelsRealPropData_gdb layer 0, tax year 2025, read 2026-08-01).'
  - 'PRICE — this closes an `[open]` the register carried as "Recorder deed pull (grantee, price)". The answer is $86,436,000 on instrument 2025-00005287, conveyed 2025-12-10, against a TY2025 appraised total of $6,092,700 on the campus tract. Note what it is NOT: it is the whole deed''s consideration covering all three parcels, so it must not be summed across them, and the auditor CAMA gives the instrument number but not the grantor — the Recorder pull for the grantor and any recorded easements stays `[open]` (#1471).'
  - 'ACREAGE — the four petitioned acreages differ from the wnewsj 2026-01-16 figures (119.373 + 65.29 + 191.12 + 170.11 = 545.893 ac) by 1.014 ac, and the whole difference is one split. The petition quotes the Roberts tract''s PARENT 270-13-05-01 at 191.117 ac; the auditor''s surviving 285-13-02-02 is the 190.065 ac that actually annexed ("SPLIT FROM 270130501000000(191.117AC) 26DUP PER ANNEX"). The other three agree to within 0.033 ac. Cite 544.879 ac for the rezoned land of record.'
  - 'ANNEXATION — the campus tract''s legal reads "SPLIT/FR 270130201000000(480.202AC) 25DUP DUE TO TYPE II ANNEX" and the residual''s reads "REM 8.593AC RW SR 730". 480.202 − 471.609 − 0.236 = 8.357 ac against that 8.593 ac, a 0.236-ac difference left UNRECONCILED: the annexation plat and the 2025-08-07 annexation ordinance are the instruments that would close it (#1471), and neither is in the corpus. The tax record moves with it — all five non-ROW tracts now sit in district 285 "UNION TWP-WILMINGTON", the Type-II annexed block, with legals reading "2026 ANNEX TO 285-UNION-WILMINGTON CITY".'
  - 'TAX — the campus tract''s own legal description carries "TY26 TIF 100% 30YRS -FINAL", a `[verified]` auditor record of the 30-year 100% TIF the register had as `[reported]` (council 2025-12-18/19). Do NOT read the layer''s `has_abatement: NO` as "no incentive": a TIF is not a real-property abatement, and the TY2025 record still shows CAUV farmland with $17,339.93 of current tax. Three of the four petitioned tracts show appraised_total_value 0 and current_tax 0 — unvalued NEW split parcels at this extract, not $0 properties.'
  - 'PROXIMITY TO THE WWTP is real but is not adjacency. The FAQ gives proximity to the wastewater plant as the disclosed site-selection driver. Measured in UTM 17N from the ECHO/FRS plant point (39.4391, -83.85132), the nearest campus-tract boundary is 1,224 m (0.76 mi) and the four petitioned tracts are 1,990–2,853 m away. The `[verified]` $25M AWS-funded 3.5 mi of new sewer trunk line is what closes that distance.'
  - 'CONNECTOR — this record is only reachable because the profile''s parcel layer changed. Wilmington had been pointed at the OGRIP Ohio statewide substitute scoped to `County=''Clinton''`, which is owner-redacted by construction and, for Clinton, reports a NULL `CurrentTo` (no stated export date) with situs and land-area null on a large share of rows: a silent false negative for any owner search. CLINTON_PARCEL_SCHEMA (`clinton_gis`) reads the Clinton County GIS Department''s own auditor CAMA join instead. Two older twins of that layer exist and are stale — `cntyparcels` on the CCRPC org is tax year 2022 (last edited 2023-08-28) and returns ZERO rows for "AMAZON". Check `editingInfo.dataLastEditDate` before believing a negative.'
  - 'SITE-PLAN RECORD — what was obtained, and what was not. Obtained `[verified]`: the City Planning Commission agendas of 2026-01-06 (regular) and 2026-03-25 (special), both listing "Property Owner: Amazon Data Services, Inc / Address: 1488 S US 68 / Agent: Bohler Engineering / Zoning: Light Industrial / Request for site plan review of data center facility". Bohler Engineering is a new entity for the graph. NOT obtained: the site-plan exhibits themselves, and therefore the 9-vs-12 building count. The City publishes agendas but no exhibits and no 2026 Planning Commission minutes; the county GIS site-plan layers stop at 2024. The pull is an R.C. 149.43 request, not a web fetch.'
  - 'This record commits the boundary + measured acreage + the SSURGO-validated HSG so the onboard SSURGO/HSG step no longer skips (it had been skipped for want of a committed footprint), and it sets the pre_cover/post_cover/developed_pervious_cover scenario knobs and the toxic_corridor_bbox the profile had carried as TODO / (0,0,0,0) "pending an identified site".'
  - 'Building/impervious/developed stay `[open]`: no site plan, no grading permit and no Rule-5 construction stormwater permit is in the corpus, and the reported floor area (1,920,299 sq ft) is the basis of the facility profile''s SCREENING IT-load bracket (#1468), not a surveyed footprint.'
