  Township / City of Wilmington, Clinton County, OH 45177 — the Amazon Data Services, Inc. "Cosler
  Farm" data-center campus (parcel 285-13-02-01-0000-00), together with the adjoining four-tract
  Ardent/TAC rezoning corridor. #1470 (places) / #1468 (facility), sub-issues of #1277.
operator: >-
  Amazon Web Services (operator) / Amazon Data Services, Inc. (developer and owner of record of
  the campus tract; auditor mailing "ATTN: GENERAL COUNSEL (REAL ESTATE) [CMH165], PO Box 80416,
  Seattle WA 98108-0416"; the defendant-intervenor in Sharp v. City of Wilmington). Bohler
  Engineering is the site-plan agent of record before the City Planning Commission [verified —
  Planning Commission agendas 2026-01-06 and 2026-03-25]. The second campus's operator is
  reported as Ardent/TAC (Ardent Technologies) and holds NO land here: all four rezoned tracts
  remain deeded to L T Land Development LLC, Matthew E Thompson, the June 11 2001 Ralph Larry
  Roberts II FT and the Jack L Webb RLT. See data/extracted/wilmington/data-centers.md.
boundary_basis: >-
  TWO LEGALLY DISTINCT BOUNDARIES, committed in one file and kept apart by the geojson's
  `corridor_role` property — never sum them into a single "campus".
  (1) RECORDED OWNERSHIP — the three Clinton County parcels deeded to Amazon Data Services, Inc.
  on 2025-12-10 by recorder instrument 2025-00005287: the 471.609-ac campus tract
  285-13-02-01-0000-00 (situs 1488 S US 68) plus two right-of-way strips, 290-26-01-12-0000-00
  (7.040 ac on US 68) and 270-13-02-01-0000-00 (0.236 ac on SR 730) — 478.885 ac deeded /
  479.226 ac planar in total. The $86,436,000 consideration is the ONE deed's, repeated on each
  parcel; it is not a per-parcel price.
  (2) A LEGISLATIVE REZONING SCHEDULE — the four tracts City Council rezoned 5-2 on 2026-02-19/20
  by ordinances O-26-04 (L T Land Development LLC, 119.375 ac), O-26-05 (Matthew E Thompson,
  65.323 ac), O-26-06 (Roberts II FT, 190.065 ac) and O-26-07 (Jack L Webb RLT, 170.116 ac) —
  544.879 ac deeded / 544.561 ac planar, ownership unchanged. This is the Mansfield #1431 shape
  (a rezone footprint), not an assemblage.
  NOT a surveyed earth-disturbance boundary: neither site-plan PDF nor the Ohio EPA construction
  stormwater (NPDES OHC000005 / Rule-5) footprint is in the corpus. LEGAL STATUS RIDES WITH THE
  GEOMETRY: the campus map rezoning is one of three ordinances a federal court ordered the City to
  redo for defective 30-day notice (Sharp v. City of Wilmington, S.D. Ohio 1:26-cv-00448, ruling
  ~2026-07-09/10 [reported]), and the four-tract rezoning is the subject of a November 2026
  citizen referendum [reported]. These are disclosed and petitioned footprints, not settled
  entitlements.

