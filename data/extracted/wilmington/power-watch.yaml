  - route: journal-news.com "biggest power guzzlers" article
    tag: '[verified]'
    probed: '2026-08-06'
    result: HTTP 404 at the URL issue #1469 cites; daytondailynews.com and wcpo.com mirrors of the same story ID were not retrieved.
    consequence: >-
      The statewide ranking that seeded the "1.5 GW at Wilmington" error could not
