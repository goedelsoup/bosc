  - route: PUCO / OPSB Docketing Information System — dis.puc.state.oh.us
    tag: '[verified]'
    probed: '2026-08-06'
    result: >-
      Plain request: HTTP 200 with a 245-byte "Request Rejected ... Your support
      ID is <11974344142440136380>" body. Full browser headers: HTTP 200 with a
      7,554-byte F5/BIG-IP `bobcmn` JavaScript bot challenge. Sixth confirmation
      of this block in this repo (Findlay #1464, Bowling Green #1437, Van Wert
      #1408 twice, and here).
    consequence: >-
      The 25-0871-EL-BLN docket is UNSEARCHED. The application, its route
      exhibits, its affected-property tables, the seven petitions, Staff's report
      and the Board's entry are all unobtained. Nothing is inferred from the
      silence of a route that refused to answer.
  - route: opsb.ohio.gov pretty-URL case pages
    tag: '[verified]'
    probed: '2026-08-06'
    result: >-
      https://opsb.ohio.gov/cases/25-0871-EL-BLN returns HTTP 200 and 197 KB of
      IBM WebSphere Portal chrome whose content region reads "No content found
      for: ohio content english/opsb/cases/25-0871-EL-BLN".
    consequence: >-
      Not an alternative route to DIS; it proxies nothing. Recorded because a 200
      status on a state siting-board domain reads like success and is not.
  - route: Wilmington News Journal — wnewsj.com
    tag: '[verified]'
    probed: '2026-08-06'
    result: HTTP 403 to browser-headered curl and to the agent fetcher alike, for all three cited articles.
    consequence: >-
      Issue #1469's items 3 and 5 rest entirely on this publisher — AES Ohio's
