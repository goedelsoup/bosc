# Adams County Water Company, Inc. — annual meeting of 1993-05-13: the members' vote to amend the
# Articles of Incorporation and convert to an R.C. Ch. 6119 regional water district.
# Epic #1983 (west-union readiness), ingested with PR #2047.
#
# THE MOMENT THE ELECTED BOARD ENDED. Every governance fact about the body that is now building a
# water main to the Buck Canyon campus descends from this vote: 579 customers voted to replace a
# board they elected with one a court appoints and which fills its own vacancies. Tags per CLAUDE.md.

