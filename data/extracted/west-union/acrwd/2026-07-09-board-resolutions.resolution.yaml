        Industrial Park water storage tank, from ~$8,700 of inventory materials, "for future
        expansion"
      moved_by: Rhonemus
      seconded_by: Crawford
      tally_verbatim: 'Yes 7  No 0'
    - number: '26-42'
      subject: 'Purchase of a laptop computer for the District accountant/business manager, not to exceed $2,000.00'
      moved_by: Baxla
      seconded_by: Grooms
      tally_verbatim: 'Yes 7  No 0'
    - number: '26-43'
      subject: 'Adopting a $5,000 capital-asset capitalization threshold for the District financial statements'
      moved_by: Crawford
      seconded_by: Weeks
      tally_verbatim: 'Yes 7  No 0'
    - number: '26-44'
      subject: 'Approving the fiscal-year 2027 budget as presented by the Budget Committee'
      moved_by: Crawford
      seconded_by: Baxla
      tally_verbatim: 'Yes 7  No 0'
    - number: '26-45'
