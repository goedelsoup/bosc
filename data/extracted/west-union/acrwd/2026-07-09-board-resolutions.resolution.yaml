    - id: EXECUTIVE-SESSIONS-2026-07-09
      tag: '[verified]'
      statement_verbatim: >-
        Two executive sessions: "according to ORC 121.22 G (3) for possible litigation concerning a
        former employee issue", and "according to ORC 121.22 G (8) for confidential matters."
      note: >-
        Both roll calls recorded 7-0. ⚠️ The minutes record only the statutory purpose, never
        content. R.C. 121.22(G)(8) is the trade-secret/confidential-information exception — the
        same statutory family as the NDA's subject matter — but NOTHING in the minutes connects
        this session to the Buck Canyon project, and the corpus does not connect them. It is
        recorded because the (G)(8) invocation is itself a fact about how this board meets.

    - id: TERMINATION-PROTEST
      tag: '[verified]'
      statement_verbatim: >-
        "Roxie McNeilan addressed the Board protesting the termination of her husband, Kevin
        McNeilan. Attorney Grimes informed her that Ohio is an 'at will' state for employment.
        President Staggs stated the vote was seven to zero to terminate."
      note: >-
        Recorded as the meeting's own opening business. A personnel matter unconnected to the
        campus, carried because it is on the same page as the record above it and omitting it
        would misrepresent the meeting. No inference is drawn.

    - id: GM-TITLE-CONFIRMED
      tag: '[verified]'
      statement_verbatim: >-
        "The Board stated that the 'Interim' could be removed from Johnny Hayslip's title to now
        become General Manager. His salary will be discussed at a later date."
      note: >-
        ⚠️ The District has a new General Manager. Rickey W. Adamson, who signed the 2024-01-10 NDA,
        no longer holds the office; the corpus does not record when or why he left it.

