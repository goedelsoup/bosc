# Adams County Regional Water District — the self-appointment power, first exercises (1997-1998).
# Epic #1983 (west-union readiness), ingested with PR #2047.
#
# WHAT THE 1993 CONVERSION VOTE ACTUALLY BOUGHT, shown rather than argued: four resolutions in
# which the board of a public water utility fills its own seats, and in three of them the trustees
# being appointed sit in the room. Tags per CLAUDE.md.

