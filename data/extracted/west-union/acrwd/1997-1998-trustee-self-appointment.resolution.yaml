resolution:
  instrument: >-
    Adams County Regional Water District — Resolutions 97-19, 97-20, 97-119, 98-49 and 98-90:
    trustee appointment, re-appointment, and the definition of the term-expiration date
  body: Board of Trustees, Adams County Regional Water District
  body_kind: regional_water_district_board
  subject_matter: board_composition
  meeting_date: '1997-02-13'
  meeting_date_note: 'Earliest of the set; the run spans 1997-02-13 → 1998-12-10 (see `acts` below).'
  outcome: approved

  mechanism:
    tag: '[verified]'
    statement_verbatim: >-
      "In accordance with the By-Laws of the Board of Trustees of the Adams County Regional Water
      District, the President of said Board did appoint a nominating committee to nominate a
      successor to fill the unexpired term of Mr. Tadlock, and ... The Nominating Committee has
      recommended the appointment of Chris Baxla for the said term"
    note: >-
      The by-laws' vacancy mechanism (three-trustee nominating committee → two-thirds of the
      trustees) operating in fact. No court, no county appointing authority and no electorate
      appears anywhere in the chain.

  acts:
    - number: '97-19'
      date: '1997-02-13'
      subject: >-
        Appointment of Chris Baxla to the unexpired term of Jimmy Tadlock, ending 1997-12-31
      moved_by: Sam Cooper
      tally_verbatim: 'Yes 7  No 0'
      disclosure:
        id: TADLOCK-TOWNSHIP-CONFLICT
        tag: '[verified]'
        statement_verbatim: >-
          "Jimmy Tadlock has submitted his resignation from the Board of Trustees of the Adams
          County Regional Water District due to A CONFLICT WITH HIS POSITION AS TOWNSHIP TRUSTEE"
        note: >-
          The one seat in this record vacated over an office-holding conflict, and it is the
          township-trustee seat. Recorded without inference about the nature of the conflict —
          the resolution does not state it.

    - number: '97-20'
      date: '1997-02-13'
      subject: >-
        Defining the trustee term-expiration date as December 31, to align with the District's
        fiscal year
      moved_by: Wendell Barnes
      seconded_by: Chris Baxla
      tally_verbatim: 'Yes 7  No 0'

    - number: '97-119'
      date: '1997-12-11'
      subject: >-
        Re-appointment of Chris Baxla, Gary McDowell and Sam Cooper for three-year terms ending
        2000-12-31
      moved_by: Seaman
      seconded_by: Gray
      tally_verbatim: 'Yes 5   No 1 (Cooper)   Abstain 2 (Baxla, McDowell)'
      conflict_handling:
        tag: '[verified]'
        note: >-
          ⚠️ ALL THREE BENEFICIARIES VOTED ON THEIR OWN RE-APPOINTMENT — two by abstaining, and
          Cooper by voting NO on his own. The vote carried 5-1 on a nine-member board. Recorded as
          the record shows it; the abstentions are the board handling the conflict, not concealing
          it, and this corpus draws no adverse inference from a recusal.

    - number: '98-49'
      date: '1998-07-09'
      subject: >-
        Appointment of Daniel Fristoe to the unexpired term of Steve Ryan, ending 1999-12-31
      moved_by: Gray
      seconded_by: Cooper
      tally_verbatim: 'Yes 7  No 0'
      note: >-
        Ryan resigned "due to personal reasons". Fristoe was still a trustee at the 2024-01-11
        meeting — a 26-year tenure beginning with an appointment, never an election.

    - number: '98-90'
      date: '1998-12-10'
      subject: >-
        Re-appointment of Russell Gaffin, Gerald Gray and Richard Seaman Jr. for three-year terms
        ending 2001-12-31
      moved_by: McDowell
      seconded_by: Barnes
      tally_verbatim: 'Yes 5   No 0   Abstain 3 (Gray, Gaffin, Seaman)'
      conflict_handling:
        tag: '[verified]'
        note: >-
          The same pattern one year on: every beneficiary abstains, five trustees appoint three.

