      - {name: Gerald Gray, title: Trustee, term_expires: '1998-12-31'}
      - {name: Sam Cooper, title: Trustee, term_expires: '1997-12-31'}
      - {name: Chris Baxla, title: Trustee, term_expires: '1997-12-31'}
      - {name: Richard Seaman, Jr., title: Trustee, term_expires: '1998-12-31'}
    committees: [Equipment, Building & Grounds, Policy Committee, Personnel Committee]
    continuity_note: >-
      ⚠️ THREE OF THESE NINE WERE STILL SEATED IN THE 2024-2026 MINUTES — Howard A. "Tony" Staggs
      (by then President), Gerald Gray and Chris Baxla. With Daniel Fristoe (appointed 1998,
      trustee at the 2024-01-11 meeting), FOUR members of the board that authorized the Buck Canyon
      NDA had held their seats for a quarter century or more, none of them ever elected to it.
      [verified] by name against the committed 2024-2026 minutes. ⚠️ Tenure is a fact here, not a
      finding — long service on a rural utility board is unremarkable, and this corpus asserts no
      impropriety from it.

open_questions:
  - id: SELF-APPOINTMENT-COURT-ROLE
    tag: '[open]'
    question: >-
      The 1994 by-laws say the board is "composed as per the Entry of the Court" (Case No. 930355)
      while these resolutions show the board seating itself under the by-laws' nominating-committee
      clause. What role, if any, does the Common Pleas court retain in composition? Unanswerable
      without the court entry — pull it from the Adams County Clerk of Courts.
  - id: APPOINTMENT-RECORD-1999-2023
    tag: '[open]'
    question: >-
      This file stops in 1998. The appointment resolutions for the twenty-five years between are
      not in the corpus, and they are what would show how the 2024 board was composed. R.C. 149.43
      request to ACRWD for all trustee appointment/re-appointment resolutions 1999-2026.
