    ⚠️ NOT NAMED ANYWHERE IN THE INSTRUMENT. [verified] as an ABSENCE, read off the document:
    the recital reads "A company (together with its Affiliates or agents of any of the foregoing,
    collectively the 'Company') has approached you in connection with a project that may be
    located in _______" — the location blank is unfilled — and the notice block reads
    "Notices to Company will be delivered: Attn: [____________________]."
  company_identification_mechanism: >-
    §Preamble and the closing notice paragraph together make the anonymity a designed feature,
    not an oversight: "When the Company has revealed its identity to the Agency, all references
    to the 'Company' in this nondisclosure agreement will be deemed to be (a) references to the
    Company's actual legal entity ... and (b) CONFIDENTIAL INFORMATION", and "The Company may
    change the foregoing notice information at any time and expects to provide new contact
    information ONCE IT HAS REVEALED ITS IDENTITY TO THE AGENCY."

