terms:
  - id: NDA-SCOPE-RELATIONSHIP
    section: '§1'
    tag: '[verified]'
    statement_verbatim: >-
      "'Confidential Information' means all nonpublic information ... relating to Company or
      disclosed by Company or its Affiliates to Agency ... including THE NATURE, CONTENT, AND
      EXISTENCE OF THE PARTIES' COMMERCIAL RELATIONSHIP or discussions about a possible
      relationship or transaction, or any discussions or negotiations between the parties."
    note: >-
      The existence of the relationship is itself the secret. This is the clause that makes the
      District's own minutes read "the company" for two years.

  - id: NDA-PUBLIC-RECORDS-VETO-WINDOW
    section: '§5'
    tag: '[verified]'
    statement_verbatim: >-
      "Agency may disclose Confidential Information as required to comply with (a) orders of
      governmental entities with jurisdiction over it and (b) applicable freedom of information
      or public records laws, IF Agency (i) gives Company PRIOR WRITTEN NOTICE sufficient to
      allow Company to seek a protective order or other remedy ..., (ii) discloses only such
      information as is required by the governmental entity, and (iii) uses commercially
      reasonable efforts to obtain confidential treatment for any Confidential Information so
      disclosed."
    note: >-
      A private notice-and-object window bolted onto R.C. 149.43. ⚠️ It fixes NO number of days,
      unlike the five business days in Sidney's CRA §32 (data/extracted/sidney/). Whether such a
      clause is enforceable against Ohio's public-records act is a legal question this corpus does
      not answer; what is [verified] is that a public body agreed to it.

  - id: NDA-DURATION
    section: '§10'
    tag: '[verified]'
    statement_verbatim: >-
      "This Agreement is effective as of the date Confidential Information is first received and
      will continue for 3 years, after which it AUTOMATICALLY RENEWS unless either party
      terminates ... by providing at least 90 days prior written notice ..., provided, that
      Agency's obligations with respect to Confidential Information will survive for 5 years
      following termination ..., and Sections 6, 9, 10, and 11 will survive INDEFINITELY and the
      confidentiality obligations ... will continue to apply ... for as long as the information
      continues to constitute a trade secret."

  - id: NDA-GOVERNING-LAW-BEFORE-SITE
    section: '§11'
    tag: '[verified]'
    statement_verbatim: >-
      "This Agreement will be governed by internal laws of THE STATE IN WHICH THE PROPERTY WHERE
      THE PROJECT IS TO BE BUILT IS LOCATED, without reference to its choice of law rules."
    note: >-
      Drafted to be signed before the site is known — the same posture as the unfilled location
      blank in the recital. [inference] that this is a multi-state siting template; nothing in the
      instrument says so.

  - id: NDA-NO-COUNTERPARTY-SIGNATURE
    tag: '[verified]'
    statement_verbatim: >-
      The executed copy carries a completed AGENCY box only. No Company signature, printed name,
      title, date or notice address appears anywhere on either page.

open_questions:
  - id: NDA-WHO
    tag: '[open]'
    question: >-
      Who is the "Company"? The corpus cannot answer from this instrument. The 2024-01-11 minutes
      describe it only as "a company interested in purchasing and developing the former Stuart
      Generating Plant land". By 2024-10-10 the District's minutes call the project "Project
      Galaxy"; by 2025-10-09 they retire that name. Buck Canyon Properties, LLC appears on the
      District's own plan set (route parcel #30, auditor parcel 1830000070002) and on the USACE
      jurisdictional determination — but NO instrument in this corpus joins that LLC to this NDA.
  - id: NDA-COUNTERSIGNED-COPY
    tag: '[open]'
    question: >-
      Does a countersigned copy exist? R.C. 149.43 request to ACRWD for the fully executed
      agreement, any amendment, and any §5 notice the District has given or received.
  - id: NDA-SECTION-5-INVOCATIONS
    tag: '[open]'
    question: >-
      Has §5 ever been invoked — i.e. has the District notified the Company of a pending
      public-records request? That correspondence would name the counterparty.
