dominant_hsg:
  value: C
  source: connector
  citation: >-
    [verified] USDA NRCS SSURGO via Soil Data Access (SDA), 8x8 grid sample (48 interior points)
    over parcel-assemblage.geojson (watermark.hydrology.connectors.ssurgo.dominant_hsg, grid_n=8,
    2026-07-13): C/D 47 pts (97.9%) + C 1 pt (2.1%) — drained-basis hydrologic soil group C
    (undrained the C/D units run to group D). This CORRECTS the prior profile [inference] of HSG
    "B": the deep Great Miami buried-valley aquifer (glacial outwash sand & gravel, an EPA
    sole-source aquifer) is well-drained, but the SURFACE soils that govern the runoff CN across
    this specific Farrington-Rd footprint are dominantly the C/D till/lacustrine units — the same
    surface-vs-aquifer correction found at Urbana (B->C). The parcels are actively-farmed CAUV
    cropland (class 101), consistent with tile-drained C/D. Runoff-relevant HSG is C, not B.
  confidence: high

receiving_water: >-
  [inference] Great Miami River watershed (HUC-8 05080001, upper Great Miami), the same basin the
  Piqua WWTP (NPDES 1PD00008 / OH0027049) discharges to at outfall 001. The campus sits north of
  Farrington Rd, west of I-75; the specific stormwater receptor (a Great Miami tributary vs. the
  mainstem) is [open] pending the construction stormwater permit. DISTINCT from the Piqua WWTP
  SANITARY receptor; this is the CONSTRUCTION/site-runoff pathway.

