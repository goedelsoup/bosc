# "Project Klondike" (J5 LLC dba Shaytura LLC) data-center campus — footprint record for the
# Troy · Piqua, OH (upper Great Miami) watershed point. LIKE Urbana's / Fort Wayne's (and UNLIKE
# Lima's document-transcribed stormwater-permit footprint), the boundary here is the RECORDED
# OWNERSHIP ASSEMBLAGE — the three Miami County parcels now deeded to J5 LLC (the disclosed
# developer of record), committed as data/reference/troy-piqua/parcel-assemblage.geojson.
# parcel_acres is the GIS-measured planar area; building/impervious/developed stay [open] pending a
# full site-plan / stormwater-permit extraction.
# Source tags: reference = committed GIS reference dataset; connector = a live public-data read;
# document = transcribed from a corpus instrument; assumption = a stated modeling input.
site: >-
  North of Farrington Road, east of Washington Road, in the Piqua I-75 Business & Industrial Park,
  Piqua, Miami County, OH 45356 — the "Project Klondike" data-center campus. #1482 (facility) / #1483
  (places), sub-issues of #1274.
operator: >-
  J5 LLC (dba Shaytura LLC) — the developer of record and owner of record across all three parcels
  (auditor mailing 52 E Gay St, Columbus OH 43215). The reported hyperscaler backer (Meta, via
  Hunterbrook's Menlo-Park-address trace) stays [reported]; never merge the J5/Shaytura entity with
  a Meta entity. See data/extracted/troy-piqua/data-centers.md.
boundary_basis: >-
  Recorded ownership assemblage — the three parcels currently deeded to J5 LLC (N44-101834,
  N44-101770, N44-101846), committed as data/reference/troy-piqua/parcel-assemblage.geojson (Miami
  County auditor CAMA parcel_joined layer). NOT a surveyed earth-disturbance boundary; the assembled
  Ohio EPA construction stormwater (NPDES OHC000005 / Rule-5) footprint and the campus site plan are
  not yet in the corpus. This is the ~607.8-ac developer-owned campus — a NESTED SCOPE within the
  larger ~1,026-ac cumulative annexation record and the ~1,200-ac whole I-75 business park; an
  adjacent 93.1-ac parcel (N44-101772, J3 Development LLC) shares the same M40-WA022 split lineage
  but a different mailing, so it is an [inference] lead, excluded here (see the geojson provenance
  + data/reference/troy-piqua/README.md).

parcel_acres:
  value: 607.81
  unit: acre
  source: reference
  citation: >-
    parcel-assemblage.geojson — UTM-16N (EPSG:32616) planar area of the three recorded J5 LLC
    parcels (watermark.hydrology.geo.parcels_total_acres). CORROBORATED by the county CAMA acreage
    sum (PPAcres): 359.475 (N44-101834) + 245.367 (N44-101770) + 3.0 (N44-101846) = 607.842 ac —
    within ~0.005% of the GIS planar measure. Matches the ~607-ac "phase-one site" figure in the
    public record (Data Center Dynamics / opposition coverage). [verified]
  confidence: high

