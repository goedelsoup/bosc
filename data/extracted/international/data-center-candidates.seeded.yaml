aois:
- slug: singapore
  label: Singapore
  country: SG
  bbox:
  - 1.15
  - 103.6
  - 1.48
  - 104.1
  selection_basis: 'The region''s interconnection anchor — a small territory carrying one of the densest
    concentrations of carrier-neutral facilities in Asia Pacific, which is what ''capability first'' means
    operationally. It is also the control for its own neighbour: Singapore is the constrained market Johor''s
    buildout sits across the strait from, so sweeping one without the other would show the growth and
    hide the reason for it.'
  observations_by_source:
    peeringdb: 46
    osm: 60
  candidate_count: 70
  corroborated_count: 36
  is_negative: false
- slug: johor
  label: Johor (Iskandar / Sedenak corridor), Malaysia
  country: MY
  bbox:
  - 1.25
  - 103.3
  - 1.95
  - 104.35
  selection_basis: 'One of the epic''s two nominated pilot AOIs: an operator-dense market with active
    buildout, adjacent to a constrained one. The window runs inland past Johor Bahru to the Kulai/Sedenak
    industrial corridor, where the newer campuses are, rather than stopping at the metro.'
  observations_by_source:
    peeringdb: 6
    osm: 75
  candidate_count: 80
  corroborated_count: 1
  is_negative: false
- slug: queretaro
  label: Querétaro, Mexico
  country: MX
  bbox:
  - 20.35
  - -100.65
  - 20.95
  - -100.0
  selection_basis: 'The epic''s other nominated pilot AOI, and a deliberate contrast to the Asia Pacific
    pair: a newer inland cluster in a semi-arid basin, where the open-data coverage is thinner. Sweeping
    it tests whether the funnel degrades honestly where the priors are sparse instead of quietly reporting
    nothing.'
  observations_by_source:
    peeringdb: 10
    osm: 11
  candidate_count: 18
  corroborated_count: 3
  is_negative: false
- slug: dublin
  label: Dublin, Ireland
  country: IE
  bbox:
  - 53.2
  - -6.6
  - 53.55
  - -6.05
  selection_basis: A mature European cluster whose growth is bounded by grid connection capacity rather
    than land — the closest international analog to the power-constrained posture the domestic sites are
    read against, and a second capability anchor outside Asia Pacific so the seeded register is not a
    one-region sample.
  observations_by_source:
    peeringdb: 21
    osm: 82
  candidate_count: 87
  corroborated_count: 16
  is_negative: false
