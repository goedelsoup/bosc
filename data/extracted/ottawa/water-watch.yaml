open_leads:
- id: OTTAWA-PMP-REPORTS
  question: What do the annual Pollutant Minimization Program reports say about the source of the mercury?
  why: >-
    Permit Part II Item X.1.g requires one by March 1 each year, listing all minimization
    monitoring results, potential sources of mercury, and actions taken. The 2026 report would
    cover the December 2025 spike. It is the single document most likely to explain the
    influent/effluent inversion.
  route: Ohio EPA records request, Division of Surface Water NPDES Permit Unit
- id: OTTAWA-SSO-2026
  question: What sanitary sewer overflow drew the O&M half of the 2026-03-04 warning letter?
  why: ICIS records the violation but no date, volume or location. The village runs fully separated sewers, so an SSO is a prohibited discharge, not a permitted wet-weather event.
  route: The warning letter itself (Ohio EPA NWDO) and the permit's Part II Item C SSO reports
- id: OTTAWA-INSPECTION-2026-02
  question: What did the 2026-02-24 state evaluation find?
  why: It sits between the December exceedance and the March warning letter; ICIS publishes no finding.
  route: Ohio EPA records request, compliance monitoring report OH000NQ0000115015
- id: OTTAWA-FINISHED-WATER-MERCURY
  question: Does the Village sample its raw or finished drinking water for mercury, and what are the results?
  why: >-
    The permit's own Item X.3 makes intake-water mercury a defence to the annual ceiling. The CCR
    publishes no mercury figure. Both facts are established; the link between them is not.
  route: Ohio EPA Division of Drinking and Ground Waters sampling record for OH6900711
- id: OTTAWA-INTAKE-RIVER-MILE
  question: At what river mile does the Village's intake sit?
  why: The outfall's river mile (22.1) is cited; the intake's is not, so the separation between them is an inference from coordinates.
  route: The Village's Drinking Water Source Assessment (Ohio EPA, November 2003), named in the CCR
- id: OTTAWA-PEQ-2014-BASELINE
  question: What was the projected effluent quality average in the ORIGINAL mercury variance?
  why: The fact sheet's narrative and its Table 8 give incompatible readings of the figure 7.1 ng/L; only the 2014 permit settles which.
  route: Ohio EPA DAM / records request for the 2014 permit and its variance application
- id: OTTAWA-EFFLUENT-P
  question: What is this plant's effluent total-phosphorus record against its 750 kg seasonal allocation?
  why: The previous check recorded strong performance; this check did not verify it and will not carry it unverified.
  route: ECHO effluent chart parameter 00665; the annual Season Report required by OHP000001 Part IV.D
- id: OTTAWA-SANITARY-SURVEY-2025
  question: What recommendations did the 2025-06-12 sanitary survey make against Source and Treatment?
  why: Five months before the first TTHM violation, with recommendations recorded against exactly the two categories a disinfection-byproduct problem would implicate.
  route: Ohio EPA / Putnam County district health department records request
- id: OTTAWA-CCR-2020-VIOLATION
  question: What is Consumer Confidence Rule violation 8263895, unaddressed since 2020-01-27, actually about?
  why: It is one of the two records keeping this system at twelve of twelve quarters in noncompliance. SDWIS publishes no reason text.
  route: Ohio EPA Division of Drinking and Ground Waters
- id: OTTAWA-LTO-2026
  question: Was a 2026 licence to operate issued for OH6900711, and was it unconditional?
  why: The 2025 licence expired 2026-01-30; the report published 2026-07-01 says nothing about 2026.
