  source_water_assessment_date: November 2003
  potential_contaminant_sources_named:
  - agricultural runoff
  - home construction
  - feed lot runoff
  - unsewered areas
  - combined sewer overflows
  - wastewater treatment discharges
  - commercial and industrial sources
  - junk yard runoff
  - pesticide and fertilizer tank farms
  - roadways
  - railways
  - gas line ruptures
  accident_exposure:
    quote: >-
      "Ohio EPA's 'Drinking Water Source Assessment for the Village of Ottawa' lists 162 miles of
      roads and 75 miles of rail lines, containing 1,066 road intersections and 48 rail crossings,
      as potential accident sites located in the surface water area draining upstream of where
      Ottawa draws water from the Blanchard River."
  the_village_lists_its_own_outfall_type:
    tag: '[verified]'
    note: >-
      "wastewater treatment discharges" appears in the Village's own list of potential contaminant
      sources in its drinking-water source protection area. The Village's own WWTP is the largest
      such discharge on this reach — but it is ~1.6 mi DOWNSTREAM of the intake, so it is not in
      the intake's own protection area. The upstream wastewater discharges that ARE in it include
      Findlay WPCC, 34.3 river miles above the Ottawa outfall.

# --- the violation ------------------------------------------------------------------------------
tthm_violation:
  pages: [2, 5]
  contaminant: Total Trihalomethanes (TTHM)
  quarter: 2025 fourth quarter
  metric: highest locational running annual average (LRAA)
  value_ppb: 83.4
  mcl_ppb: 80
  exceedance_pct: 4.25
  individual_result_range_ppb: [37.9, 129.4]
  violation_flag_in_table: 'Yes'
  health_language_quote: >-
    "Some people who drink water containing trihalomethanes in excess of the MCL over many years
    may experience problems with their liver, kidneys, or central nervous systems, and may have an
    increased risk of getting cancer."
  cause_stated: >-
    "TTHMs are disinfection by-products that form when chlorine used to treat drinking water reacts
    with naturally occurring organic matter in the source water."
  corrective_steps:
  - Adjusting treatment processes at the water plant to optimize disinfection and reduce by-product formation
  - Optimizing chlorine feed rates and reducing chlorine residual levels where appropriate while still maintaining proper disinfection
  - Increasing system monitoring and sampling to better track disinfectant residuals and TTHM levels
  return_to_compliance_expected: second quarter of 2026
  the_maximum_is_the_number_that_is_not_quoted:
    tag: '[verified]'
    note: >-
      The narrative and the public notice both lead with the 83.4 ppb annual average, which is 4%
      over the MCL. The table of detected contaminants on p. 4 gives the year's RANGE as
      37.9-129.4 ppb. The high individual result is 62% over the MCL and is stated nowhere in the
      prose. Both figures are the Village's own and both are required table entries; the average
      is what the MCL is written against.
  speciation:
    page: 4
    unregulated_thm_species_ppb:
      chloroform_trichloromethane: {level_found: 87, range: [22.5, 87.0]}
      bromodichloromethane: {level_found: 28.1, range: [9.2, 28.1]}
      dibromochloromethane: {level_found: 13.7, range: [5.6, 13.7]}
      bromoform: {level_found: 1.6, range: [0.6, 1.6]}
    finding:
      tag: '[inference]'
      note: >-
        Chloroform dominates the four species by a wide margin. Chloroform-dominated
        trihalomethane formation is the signature of chlorinating water rich in natural organic
        carbon rather than bromide — consistent with an agricultural surface-water source and with
        the plant's reported total organic carbon (1.47-2.28). Recorded as an inference from the
        speciation the Village itself reports; no treatment study in the corpus tests it.
  haa5_did_not_violate:
    page: 4
    level_found_ppb: 31.8
    range_ppb: [20.7, 51.0]
    mcl_ppb: 60
    note: >-
      The other regulated disinfection by-product group stayed comfortably inside its MCL through
      the same year. Whatever is driving the TTHM result is not driving HAA5 with it.

lead_service_line_reporting_violation:
  pages: [2, 5]
  rule: 40 CFR 141.85(e) and 40 CFR 141.90(f)(4)
  instrument: Ohio EPA Warning Letter
  warning_letter_date: '2025-10-21'
  requirement_missed: annual service-line material notifications to affected consumers, due 2025-07-01
  cured_date: '2026-01-09'
  quote: >-
    "The Village of Ottawa failed to adequately demonstrate to the State that it delivered annual
    notifications and information to affected consumers with lead, galvanized requiring
    replacement, or lead status unknown service lines as required by July 1, 2025."
  remediation: >-
    "We are currently working with Arcadis engineering to gain the information needed to build and
    maintain a complete service line inventory. While we did not certify and notify the State as
    quickly as we should have, we provided the required notifications to persons served, as well as
    the missing information to the State on January 9, 2026. We are no longer in violation."
  corroboration: >-
    EPA SDWIS carries this as violation 8263938 (Lead and Copper Rule Revisions, Reporting
    Violation), non-compliance 2025-07-02 to 2026-01-09, "State Compliance achieved" 2026-01-09 —
    matching the Village's account date for date.
  service_line_inventory_url: https://pws-ptd.120wateraudit.com/ottawavillageoh

ccr_corrections_directed_by_ohio_epa:
  page: 1
  nov_date: '2025-11-13'
  applies_to: the preceding (2024-data-year) Consumer Confidence Report
  corrections:
  - Copper 90th percentile corrected to 0.075 ppm
  - Gross Alpha 2022 result added
  - Atrazine removed (non-detect)
  - Lead Service Line Inventory information added
  older_uncorrected_set:
    page: 2
    year: 2018
    quote: >-
      "2018 CCR Violations: In the 2018 CCR, MCLG was not defined, turbidity was not updated, and
      in the Table of Detected Contaminants, nitrate was not updated, simazine was reported
      incorrectly, lead should be reported in ppb, and contaminants not detected in the most recent
      sample should be removed."
    note:
      tag: '[inference]'
      statement: >-
        A 2018-report defect list is still being reprinted in the 2025 report. EPA SDWIS carries an
        UNADDRESSED Consumer Confidence Rule violation (id 8263895) whose compliance period begins
        2020-01-27 — the date of the only enforcement action against it, a State Violation/Reminder
        Notice. The dates and the subject line up, and it is the obvious candidate for what that
        open violation is about.
      why_it_is_not_verified: >-
        SDWIS publishes no reason text for violation 8263895 and this report does not cite it.
        The link between the reprinted 2018 defect list and the open 2020 rule violation is
        reasoned, not stated by either source. Lead OTTAWA-CCR-2020-VIOLATION.

