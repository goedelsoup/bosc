  total_coliform: no positive samples during 2025; no Level 1 or Level 2 assessment triggered
  mercury:
    tag: '[open]'
    note: >-
      NO mercury result appears anywhere in this report. The Village states it sampled "more than
      80 different contaminants, most of which were not detected", and one of the Ohio EPA
      corrections it implements is that "contaminants not detected in the most recent sample should
      be removed" from the table — so a non-detect would be omitted by design. Absence from this
      table is therefore NOT evidence that finished water was not sampled for mercury, and still
      less evidence of a detection. It means this document publishes no mercury figure. What the
      Village's raw and finished water carry is unestablished. Lead OTTAWA-FINISHED-WATER-MERCURY.

