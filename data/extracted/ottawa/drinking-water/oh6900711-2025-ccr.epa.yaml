method: >-
  Reviewed transcription from the PDF's embedded text layer (pypdf). This is a digitally generated
  document, not a scan. Every figure below is read verbatim from the page named on its block; the
  document's own pagination is not printed, so pages are 1-based positions in the 6-page PDF.
source_text_excerpt: >-
  "Village of Ottawa • PWS ID: OH6900711 • 2025 Consumer Confidence Report ... Date Distributed:
  July 1, 2026 ... 2025 TTHM MCL Violation: During the 2025 fourth quarter, the Village of Ottawa
  exceeded the Maximum Contaminant Level (MCL) for Total Trihalomethanes (TTHMs). The MCL for TTHMs
  is 80 ppb. Our highest locational running annual average was 83.4 ppb."

action:
  confidence: high
  warnings:
  - >-
    The file is served under a URL slug reading "2024-CCR" but is the 2025-CALENDAR-YEAR report,
    distributed 2026-07-01. The as-received name is kept per the chain-of-custody rule; see
    data/documents/ottawa/drinking-water/filename-map.yaml. The 2024-data-year CCR is not held.
  - >-
    A Consumer Confidence REPORT is not the same thing as the Consumer Confidence RULE. This
    document is the report. EPA's SDWIS carried two OPEN "Consumer Confidence Rule" violations
    against this system on the 2026-07-09 extract, one of them since 2020-01-27. Publishing the
    report does not by itself clear a rule violation, and nothing here establishes that it did.
  - >-
    A calendar-year CCR reports its calendar year. This one states an expectation of "return to
    compliance by the second quarter of 2026" without disclosing that the FOLLOWING quarter's TTHM
    locational running annual average — Q1 2026, recorded by SDWIS at 0.086 mg/L — was higher than
    the violation it reports. That later quarter is outside the report's period and its omission is
    not a rule violation; it is recorded because a reader of this document alone would take the
    trend to be improving.
  agency: Village of Ottawa (permittee-issued) under Ohio EPA oversight; Ohio EPA NOV and warning letter cited within
  program: Safe Drinking Water Act — Consumer Confidence Report, Stage 2 DBPR public notice, Lead and Copper Rule Revisions public notice
  permit_no: PWS ID OH6900711
  action: annual consumer confidence report published, carrying two Tier-3 public notices and four Ohio-EPA-directed corrections
  action_date: '2026-07-01'
  applicant: Village of Ottawa
  applicant_address: 136 North Oak Street, Ottawa, Ohio 45875, Putnam County
  facility: Village of Ottawa Public Water System, PWS ID OH6900711 — community water system, surface water source, population served 4,393
  site_address: Water treatment plant, 1972 Agner Street, Ottawa, OH 45875, Putnam County
  project_name: Village of Ottawa 2025 Calendar Year Drinking Water Consumer Confidence Report
  affected_resource: Blanchard River (source water) → the Village distribution system
  contact: Richard Knowlton, Water Treatment Director, (419) 523-5020
  note: >-
    [verified] The Village of Ottawa drinks from the Blanchard River and discharges to it. This
    report is the intake half of that loop. It records a Total Trihalomethanes MCL violation for
    the 2025 fourth quarter — a locational running annual average of 83.4 ppb against an 80 ppb
    MCL, with individual results across the year ranging 37.9 to 129.4 ppb — and a lead
    service-line notification reporting violation cured 2026-01-09. It reports no mercury result
    of any kind.

