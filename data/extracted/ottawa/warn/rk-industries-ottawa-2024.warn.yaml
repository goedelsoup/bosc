method: >-
  VISION transcription from a 300 DPI render (pypdfium2), not a text-layer copy. Unlike the
  Findlay WARN pair (#1460), which are digitally generated letters, this notice is a SCAN: the
  PDF's text layer holds exactly one string — "Received: 5/16/2024 @ 1:18pm" on page 1, a digital
  receipt stamp overlaid on the scanned page — and nothing at all on page 2. Every other figure
  and quotation below was read from the image. Both pages were re-read at 300 DPI against the
  original 200 DPI pass before committing; the statute cite, the situs, the cease date and all
  three handwritten headcounts were confirmed on that second read.
source_text_excerpt: >-
  "Received: 5/16/2024 @ 1:18pm" — the complete extractable text layer of the document.

layoff_notice:
  confidence: high
  warnings:
  - >-
    ALL THREE HEADCOUNT FIGURES IN THIS INSTRUMENT ARE HANDWRITTEN, and the printed document
    left each of them blank: the "approximately __ employees" figure in the letter body (80),
    the General Labor row of the position schedule (68), and the schedule's TOTAL (80). The
    typed positions on the schedule sum to 12, and 68 + 12 = 80, so the three agree with each
    other and with the ODJFS index row — but they are a hand annotation on a scan, read by
    vision, not printed text. Treat 80 as the employer's stated approximation, which is what the
    letter itself calls it, and never as a precise payroll count.
  - >-
    The letter is a notice of an EXPECTED closure that the employer expressly qualifies: "Despite
    the anticipated closure, the Company is also considering a number of options, including a
    potential sale, merger, or other strategic transaction, although no definite plans in that
    regard have emerged," and the cease date is conditioned — "Absent a transaction or
    implementation of another viable strategic alternative." Nothing in the corpus confirms the
    closure actually occurred on 2024-07-14, or that a sale did not intervene. The DISPOSITION IS
    [open]; do not state the plant closed as a completed fact on this document alone.
  - >-
    The county attribution ("Ottawa/Putnam") and the notice ID come from the ODJFS 2024 public
    notice list, not from the letter — the letter names the city and ZIP but never the county.
  - >-
    Ohio's mini-WARN statute (R.C. 4113.31) took effect 2025-09-30, AFTER this filing. This
    notice cites the older R.C. 4141.28(C) notice provision alongside the federal Act, which is
    what a 2024 Ohio filing would cite. Do not read the absence of a 4113.31 citation as a defect.
