  note: >-
    [verified] The only WARN notice filed from Putnam County, Ohio in the 2024-2026 window — one
    hit across the 241 notices on the ODJFS 2024, 2025 and 2026 public lists (#1423). An 80-job
    automotive stamping and robotic-welding plant inside the Village of Ottawa, noticed for
    closure 2024-05-16 and expected to cease 2024-07-14. It is the second industrial closure this
    site's record carries, twenty-two years after the Sylvania/GTE/Philips CRT works went dark on
    2002-12-31, and its significance here is directional: Ottawa's industrial story is a
    SUBTRACTION story. This is emphatically NOT a data-center datum — no arrival, no siting, no
    assembly — and it is committed because the sweep that looked for an arrival found a departure.
    RK Industries does not appear in the county's ICIS-Air universe, so the closure leaves no
    trace in that dataset either. The building stands on Putnam County parcel 320841200000
    (2.31 ac, use class 330 industrial, owner of record PATRICK HOLDINGS INC of Leipsic); at that
    size it is not a data-center site under any siting model.

