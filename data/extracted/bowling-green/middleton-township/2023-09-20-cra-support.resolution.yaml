# Middleton Township Trustees, 2023-09-20 — resolution of support for the Liames LLC Community
# Reinvestment Area application, eight days before the county acted on it. Issue #1438, epic #1433.
#
# THE EARLIEST PUBLIC STATEMENT OF THE PROJECT'S END USE AND SCALE that this corpus holds. On a
# township agenda in September 2023, the county's economic-development director describes "a
# $750M investment in the township for a data center by a Fortune 200 company" — nineteen months
# before the 2025-04-09 Meta announcement. Tags per CLAUDE.md.

