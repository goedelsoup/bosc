  aggregate:
    tag: '[inference]'
    statement: >-
      91 + 68 + 75 + 37 = 271 acres of A-1 land brought toward M-1 by four separate landowners
      around this campus between August 2024 and September 2025, of which 91 were rezoned and
      180 were withdrawn before a vote. Arithmetic on [verified] figures; the figures are the
      minutes' own approximations ("approximately"), so the total is approximate too.
    do_not_read_as: >-
      NOT a Meta land assembly. None of these four applicants is Liames, none of the named
      parcels is in the committed assemblage, and the only one with a stated buyer position said
      there was none. What the pattern establishes is a market forming around a disclosed campus,
      which is a different and weaker claim than assembly — and it is the weaker claim this
      corpus makes.

  confidence: high
