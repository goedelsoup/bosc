# Middleton Township Trustees — the three campus-adjacent rezoning matters of 2024-2025 that
# were NOT approved as filed: one granted over a seller with no known buyer, and three
# applications withdrawn on the eve of their hearings. Issue #1438, epic #1433.
#
# These are kept together because they are one phenomenon, not three events: between November
# 2024 and September 2025, four separate landowners around the Meta campus brought ~271 acres of
# A-1 land to M-1 and three of the four pulled out. The withdrawals are the applications the
# 2026-01-07 minutes mean when they record that "the most recent rezoning applications were
# pulled by the applicants and to date have not been resubmitted to the zoning commission."
#
# Tags per CLAUDE.md: [verified] = printed in these minutes; [open] = not established.

