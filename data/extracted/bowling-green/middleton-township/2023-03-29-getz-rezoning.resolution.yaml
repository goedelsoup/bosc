  disclosures:
    - id: MERCER-ROAD-ACCESS-2023
      tag: '[verified]'
      statement_verbatim: >-
        "He noted that by utilizing the acreage in question the concerns about road access onto
        Mercer Road could have less impact."
      note: >-
        The stated rationale is a site-access problem on Mercer Road — six months before the
        first Liames deed (2023-09-05) and two and a half years before the applicant's counsel
        told the trustees, at the 2026-07-07 hearing, that "Mercer Road is not being utilized for
        this project." The record does not say who raised the access concern or on whose behalf,
        and no inference is drawn about coordination; what is [verified] is that a Mercer Road
        access constraint was already shaping this township's zoning map in March 2023.

  linkage:
    tag: '[open]'
    note: >-
      WHETHER THIS 80 ACRES IS INSIDE THE LIAMES ASSEMBLAGE IS NOT ESTABLISHED. The minutes name
      no parcel, and the committed parcel layer records only the LAST conveyance per parcel, so a
      2023 Getz-to-Liames transfer would have been overwritten by the 2025-04-09 consolidation
      quitclaims. What is [verified] independently: by 2024-03-20 the township's own zoning
      inspector described Liames LLC as "property owners of the recently rezoned parcels between
      St. Rt. 582, St. Rt. 25 and Mercer Road," and by 2023-09-20 the CRA application covered
      "the rezoned properties within the CRA boundaries." The Wood County Recorder is the
      instrument that would close it; see record-watch.yaml → WOOD-COUNTY-RECORDER.

  confidence: high
