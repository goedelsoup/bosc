# owner Tim Getz. Issue #1438, epic #1433.
#
# The FIRST of the campus-area rezonings, and the reason a search of this township's record for
# "Liames" before September 2023 returns nothing: the land that became the Meta campus was
# rezoned in the SELLERS' names, one landowner at a time, before the buyer's name appears on any
# township application. Tags per CLAUDE.md: [verified] = printed in these minutes.

