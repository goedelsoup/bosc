    acreage_reconciliation: >-
      [verified] The thirteen deeded acreages sum to 31.820 — the Wood County Planning
      Commission's "approximately 31.82 acres" to the hundredth. The 31.82 figure had been
      carried as press [reference]; it is now a measurement against the auditor's own layer.
      The eight Liames-name parcels carry 21.37 ac and the other five 10.45 ac.
    ownership_caveat: >-
      FIVE OF THE THIRTEEN DO NOT STAND IN LIAMES' NAME IN THE COUNTY'S PARCEL LAYER, AND THAT
      IS A STATEMENT ABOUT JULY 2025, NOT ABOUT THE HEARING. The `cama_deeded_name` above is
      from a live query of Wood County's Vision_Parcels layer on 2026-08-05, which returned the
      same 73,839 rows and the same maximum Sale_Date of 2025-07-25 that #1436 recorded — zero
      rows transfer after that date, so the layer has not been refreshed in more than a year and
      any transfer after 2025-07-25 is invisible to it. Applicant's counsel told the trustees the
      parcels are "owned by Liames, LLC" and that "structures on the properties have been razed."
      Two readings survive and neither is adopted: the five transferred after the snapshot, or
      Liames applied over land it does not hold of record (which R.C. 519.12 permits — an
      application is not limited to owners). The Wood County Recorder is the instrument that
      settles it, and it is logged as a blocked route in record-watch.yaml. What IS established
      is the identity of the five: an individual owner served as SIMON JAY (1.01 ac,
      owner-occupied — the tax mailing address IS the situs, which is what identifies it as a
      residence rather than a holding entity; the layer serves an individual's name without
      saying which token is the surname, so it is carried as served and never re-ordered),
      Pine Apartments Ltd (2.05 ac at 21332 Dixie, CAMA use class 401), and the P&J Thayer
      Family Limited Partnership (three parcels, 7.39 ac). The register previously carried these
      five as [open].

