  # -----------------------------------------------------------------------------------------
  # DISCLOSED FACTS the hearing put on the record and no secondary source carries.
  # -----------------------------------------------------------------------------------------
  disclosures:
    - id: ADDITIONAL-NW-PARCEL
      tag: '[verified]'
      statement: >-
        Applicant's counsel "informed the Board that an additional parcel is currently being
        reviewed by the Wood County Planning Commission for rezoning from A-1 to M-1 that is
        located at the northwest corner of the complex."
      reads_on: >-
        The A. Schaller Limited Partnership 39.265-acre application, docketed by the county for
        the SAME EVENING (WCPC agenda item 4.b, 2026-07-07). The two boards were sitting on the
        two halves of this assembly at the same hour.
    - id: MERCER-ROAD-NOT-USED
      tag: '[verified]'
      statement: >-
        An exhibit shown at the hearing "shows constraints on St. Rt. 25, noting retention ponds
        in place, development standards in place due to the M-1 zoning and noted that MERCER ROAD
        IS NOT BEING UTILIZED FOR THIS PROJECT."
      reads_on: >-
        The 2023-03-29 Getz rezoning was argued on the ground that using that acreage would mean
        "the concerns about road access onto Mercer Road could have less impact." Three years
        apart, the same road, the same answer.
    - id: PETREA-PARCELS-NOT-IN-PLAN
      tag: '[verified]'
      statement: >-
        "Mrs. Petrea also stated the initial plans for the data center complex do not include the
        parcels under review."
      reads_on: >-
        A trustee's characterization, not a company statement — but it is consistent with the
        applicant's own stated purpose ("construction logistics") and with the register's reading
        that these thirteen are a fringe, not campus core.
    - id: DEWATERING-UNFAMILIAR
      tag: '[verified]'
      statement: >-
        A resident raised "the ODNR dewatering process"; the minutes record that "Mr. Ingram
        noted he was not familiar with the dewatering concept."
      reads_on: >-
        Construction dewatering is an ODNR/Ohio EPA matter that this repo tracks at other sites.
        No dewatering instrument for this campus is in the corpus. [open]
    - id: ODOT-CONTROLS-ENTRANCES
      tag: '[verified]'
      statement: >-
        Trustee Vetter stated "that ODOT, not the township has control over the design or
        location of the entrances and new entrances may be needed to help with the traffic flow".
    - id: FIRSTENERGY-ENFORCEMENT
      tag: '[verified]'
      statement: >-
        "Discussion was held with regard to the FirstEnergy power facility and the continued work
        by the township to enforce the township zoning regulations."
      reads_on: >-
        A township enforcement posture toward a FirstEnergy facility, unresolved in these
        minutes. Note the register's separate finding that the FirstEnergy/ATSI transmission
        tract (72.43 ac, 22105 Mercer Rd) shares a 0.0 m boundary with the assembly. What the
        "continued work" is, and whether it is the substation or something else, is [open].

