# Middleton Township Trustees, 2026-07-07 — the R.C. 519.12 hearing on Application 2026041
# (Liames, LLC), thirteen parcels rezoned R-4 Residential / A-1 Agricultural to M-1 Light
# Industrial. Issue #1438 (the record domain), epic #1433 readiness(bowling-green).
#
# TAG VOCABULARY (per CLAUDE.md / evidentiary-discipline):
#   [verified]  — printed in the township's own approved minutes, read from the PDF text layer.
#   [reference] — secondary reporting, carried because the repo already carries it and this
#                 instrument now contradicts or refines it. Never promoted here.
#   [inference] — reasoned from [verified] facts, labelled, with the reasoning shown.
#   [open]      — not established by any captured source. Do not assert.
#
# WHY THIS FILE EXISTS AS ITS OWN RECORD. The repo has carried this vote since #1436 as
# "Middleton Township Trustees granted it anyway, 2-1 on 2026-07-07 — Mike Moulton and Fred
# Vetter in favor, Melissa Petrea against," sourced to the Sentinel-Tribune and BG Independent
# News. The minutes record the opposite roll call on a differently-framed motion, reaching the
# same outcome. Both halves of that sentence matter and the difference is not pedantry: it is
# the difference between two trustees voting FOR a rezoning and two trustees voting AGAINST
# their own zoning commission.

