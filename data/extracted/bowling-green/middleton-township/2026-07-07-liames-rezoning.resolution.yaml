  instrument: >-
    Middleton Township Trustees — action on Application 2026041 (Liames, LLC), rezoning
    thirteen parcels in Section 19 to M-1 Light Industrial, 2026-07-07
  body: Board of Trustees, Middleton Township, Wood County, Ohio
  body_kind: township_trustees
  subject_matter: zoning
  statute: R.C. 519.12                       # [inference] — the minutes recite the county-planning
