  # -----------------------------------------------------------------------------------------
  # THE ROLL CALL — the reason this record exists.
  # -----------------------------------------------------------------------------------------
  vote:
    motion: >-
      "to approve the recommendation of the Middleton Township Zoning Commission for the purpose
      of rezoning thirteen (13) parcels to M-1 based on the details noted in the application"
    motion_moved_by: Michael Moulton
    motion_seconded_by: Melissa S. Petrea
    the_recommendation_being_approved: deny   # [verified] — the MTZC "voted on June 10, 2026, to
                                              # deny the request", stated earlier in the same minutes
    roll_call:
      - trustee: Michael Moulton
        vote: 'NO'
      - trustee: Melissa S. Petrea
        vote: 'YES'
      - trustee: Fred E. Vetter
        vote: 'NO'
    tally: 1-2                                 # [verified] as recorded
    effect: >-
      [verified] The motion was to ADOPT the zoning commission's recommendation, and that
      recommendation was to DENY. It failed 1-2, and the minutes record the rezoning as approved.
    press_discrepancy: >-
      SECONDARY REPORTING HAS THIS BACKWARDS AND SO DID THIS REPO. The register carried
      "trustees granted it anyway, 2-1 ... Mike Moulton and Fred Vetter in favor, Melissa Petrea
      against" [reference]. On the face of the minutes the vote is 1-2, and the single YES is
      PETREA — the trustee reported as the dissenter. Both accounts agree on the outcome and on
      who was on which side of it; they disagree on the direction of the question. A reader
      given only the press number would state the tally, the majority and the dissenter's name
      wrongly while stating the result rightly. The minutes are the record.
      WHY THIS READING AND NOT THE OBVIOUS ONE. The motion text can be read a second way — "approve
      the recommendation ... for the purpose of rezoning" as simply "approve the rezoning" — but
      that reading does not survive its own roll call: 1-2 would then have DEFEATED the rezoning,
      and the next sentence of the same minutes says it was approved. Only the reading above is
      self-consistent with the outcome the minutes state. What is NOT resolved is WHY the question
      was put that way: a deliberate procedural device, an error at the meeting, or a clerical
      error in the minutes are all live, the minutes give no reason, and none is asserted. The
      Wood County Recorder's copy of the filed rezoning would corroborate the outcome but not the
      framing. [open]

