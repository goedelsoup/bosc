  - id: WILL-POWER-PLATO-SOUTH-REVOCATION
    statement: >-
      Plato South's air-permit history shows an approval (P0137838, 2025-11-13), a
      DENIAL OR REVOCATION OR NON-APPROVAL action on the same permit number (2026-06-08), and a
      fresh approval under a new number (P0140567, 2026-07-14). Only the eDoc index labels were
