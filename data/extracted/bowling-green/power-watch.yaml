      (p. 12). Neither may be cited without the other.
  - id: APOLLO-PBR-ENGINE-COUNT
    statement: >-
      Two or three emergency engines. The OPSB Staff Report and Ohio EPA's hearing deck both say
      two; the draft permit's PTE table has a row for "3 PBR Emergency Engines".
  - id: APOLLO-CGP-NUMBER-RECONCILIATION
    statement: >-
      Whether Ohio construction-stormwater coverage 2GC08564*AG (named in the final PTI,
      Responses 34 and 41, issued 2026-01-04) and ICIS coverage OHGC17963 (named APOLLO POWER GEN
