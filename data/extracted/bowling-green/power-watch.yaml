  - id: APOLLO-OPSB-COMMENT-COUNT
    statement: >-
      How many comments were filed in the siting docket. The Staff Report says only "Several".
      Issue 1437's figure of 14 is [reference] press reporting and is uncorroborated. It must not
      be conflated with the 42 numbered comments in the air permit's Response to Comments, which
