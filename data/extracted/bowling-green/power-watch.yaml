  - id: APOLLO-ERAC-APPEAL
    statement: >-
      Whether anyone appealed the final PTI to the Environmental Review Appeals Commission within
      the 30-day window under R.C. 3745.04 (i.e. by roughly 2026-07-02).
  - id: APOLLO-CONSTRUCTION-START
    statement: >-
      The actual construction-start date, which Condition 3 requires to be docketed and which
      the OPSB gas case table's missing "Under Construction" footnote neither confirms nor denies.
