  - id: APOLLO-PSWU-FACILITY-ID
    statement: >-
      The Permit Strategy Write-Up bound into the draft permit carries Plato North's Ohio EPA
      facility ID (0145000615) under Apollo's permit number and name, on both of its pages.
      Visually confirmed. Whether the write-up's analysis was likewise adapted from the sibling
