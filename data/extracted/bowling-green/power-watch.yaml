  - id: APOLLO-CO2E-BASIS
    statement: >-
      The ~2.5 million tons/year CO2e figure in press coverage of the April hearing is a
      commenter's estimate reported secondhand. No captured primary source states a CO2 or CO2e
      figure — the permit contains no CO2 limit at all (final PTI, Response 35). Do not cite the
