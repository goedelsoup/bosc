            "approximately 31.82 ac" carried as a press [reference] figure in
            data/extracted/bowling-green/data-centers.md.
          now: >-
            [verified] — it is the county's own docketed figure, and it reconciles to the
            hundredth against the sum of the thirteen parcels' deeded acreage in the Wood County
            auditor CAMA (31.820). A press number became a measurement.
        - was: >-
            "eight on the east side of SR-25 and five on the west side of Mercer Rd" —
            [reference] press, and flagged in the register as uncheckable because the record
            named only eight of the thirteen.
          now: >-
            The county says "All parcels are located north of State Route 582." That is
            compatible with the press split but it is not the same statement, and it is the one
            the instrument makes. The east/west split remains [reference] and is now checkable
            against the thirteen situs addresses recorded in the township rezoning extraction
            (Dixie, Middleton and Mercer frontages) — a check this issue does not perform,
            because it needs the parcel geometry, not the address strings. [open]

