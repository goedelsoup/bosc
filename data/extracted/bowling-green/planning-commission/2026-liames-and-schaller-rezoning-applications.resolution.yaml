# Wood County Planning Commission — the two 2026 Middleton Township applications as the county
# docketed them: Liames LLC's thirteen parcels (agenda 2026-06-02, item 6.b) and A. Schaller
# Limited Partnership's 39.265 acres (agenda 2026-07-07, item 4.b). Issue #1438, epic #1433.
#
# Under R.C. 519.12 a township rezoning is referred to the county planning commission before the
# township's own zoning commission and trustees act, so these are the upstream half of the
# instrument chain the Middleton Township minutes complete. What the county's docket adds that
# the township's minutes do not: the county's OWN statement of the acreage and of where the
# parcels are, and — on the June agenda — a rasterized map with the thirteen outlined in red.
#
# Tags per CLAUDE.md: [verified] = printed on the county's own agenda; [reference] = press;
# [inference] = reasoned, shown; [open] = not established.

