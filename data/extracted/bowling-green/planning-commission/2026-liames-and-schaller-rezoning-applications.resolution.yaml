      text_verbatim: >-
        "Liames LLC has submitted an application to rezone thirteen parcels totaling
        approximately 31.82 acres in Section 19 of Middleton Township from an R-4 Residential and
        A-1 Agricultural zoning classification to an M-1 Industrial zoning classification.
        Applicant has stated that the rezoning is for 'construction logistics.' All parcels are
        located north of State Route 582. See attached map with parcels to be rezoned outlined in
        red."
      recommendation: approve
      recommendation_tally: 6-2
      recommendation_tally_tag: '[reference]'
      recommendation_tally_note: >-
        The 6-2 is press (BG Independent News / Sentinel-Tribune, via the register). The township
        trustees' 2026-07-07 minutes [verified] only that the WCPC "voted on June 2, 2026, in
        favor of the rezoning request", without a tally. The commission's own minutes would close
        it and were not published at capture.
