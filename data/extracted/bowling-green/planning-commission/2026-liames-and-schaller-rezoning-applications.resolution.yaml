    - id: LIAMES-THIRTEEN
      agenda_date: '2026-06-02'
      agenda_item: 6.b
      agenda_note: >-
        The agenda was reissued — its own title line reads "AGENDA - UPDATED WITH ATTACHED MAP
        (5/26/2026 4:05 P.M.)". The map is pages 1-2 of the PDF and is the county's own drawing
        of the thirteen parcels "outlined in red"; it is why this three-page file is 18 MB.
      applicant: Liames LLC
      parcel_count: 13
      acres_stated: 31.82
      from_zoning: [R-4 Residential, A-1 Agricultural]
      to_zoning: M-1 Industrial
      location: Section 19, Middleton Township
