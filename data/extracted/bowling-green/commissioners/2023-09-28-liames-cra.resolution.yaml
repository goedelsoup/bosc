      session, concluding 10:28 a.m. — thirteen minutes. [verified]

  beneficiary:
    name: Liames, LLC
    described_as: >-
      "Liames LLC plans to construct one or more data center buildings on property located at
      State Route 582 and Mercer Road in Middleton Township."                # [verified] as said
    note: >-
      THE END USE IS ON A PUBLIC RECORD ON 2023-09-28. That is nineteen months before the
      2025-04-09 Meta announcement and three days after the first Liames deed was recorded.
      The NDA concealed the OPERATOR; it did not conceal that the land would become data
      centers, nor the location, nor the scale. Nothing in this journal names Meta.

  terms:
    exemption_pct: 75                        # [verified] as requested and granted: "Liames LLC is
                                             # requesting a 75% tax abatement for 15 years"
    term_years: 15                           # [verified]
    tax_type: real property                  # [inference] — a CRA exemption under R.C. 3735.67
                                             # abates real-property improvement value; the journal
                                             # says only "tax abatement".
    executed_agreement: null                 # [open] — the resolution AUTHORIZES an agreement
