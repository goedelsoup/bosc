# Wood County Commissioners, 2023-09-28 — Resolution 23-01249, "AUTHORIZE COMMUNITY
# REINVESTMENT AREA AGREEMENT BETWEEN LIAMES LLC AND WOOD COUNTY, OHIO". The 75% / 15-year
# real-property tax exemption on the Meta campus. Issue #1438, epic #1433.
#
# TAG VOCABULARY (per CLAUDE.md / evidentiary-discipline):
#   [verified]  — printed in the county's own approved journal.
#   [reference] — a statement MADE at the meeting by a party or a promoter, journalled
#                 accurately but not adjudicated by the Board. The minutes verify that it was
#                 SAID; they do not verify that it is so.
#   [inference] — reasoned from [verified] facts, labelled, arithmetic shown.
#   [open]      — not established by any captured source.
#
# READ THE PROVENANCE SPLIT CAREFULLY. Almost every figure below was spoken by the county's
# economic-development director or by the applicant's counsel at a public meeting. That the
# words were said is [verified]; the figures themselves are the applicant's representations
# and stay [reference] until the executed CRA agreement or a school compensation agreement
# states them. The one exception is the resolution's own title and number, which are printed
# on the county's resolution listing.

