resolution:
  instrument: >-
    Wood County Commissioners Resolution 23-01249 — Authorize Community Reinvestment Area
    Agreement between Liames LLC and Wood County, Ohio, 2023-09-28
  resolution_no: '23-01249'                  # [verified] — printed listing, p3
  body: Board of County Commissioners, Wood County, Ohio
