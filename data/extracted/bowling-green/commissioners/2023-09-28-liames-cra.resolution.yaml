  vote:
    motion: approve resolution 23-01249 (the CRA agreement with Liames LLC)
    motion_moved_by: Doris I. Herringshaw
    motion_seconded_by: Theodore H. Bowlus
    presiding: Craig LaHote
    roll_call_recorded: false
    tally_verbatim: All voted aye and the motion carried.       # [verified]
    note: >-
      The item was PULLED from the consent listing at the start of the day ("with the exception
