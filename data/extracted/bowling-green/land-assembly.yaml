limitations:
  - >-
    NO RECORDER INSTRUMENT WAS READ. Every row here is the auditor's transfer record, not a deed.
    Grantors, recorder instrument numbers, deed book/page and the full chronological chain are
    all [open]. The Wood County Recorder publishes an electronic index from 1980 (Fidlar AVA,
    https://ohwood.fidlar.com/OHWood/AvaWeb/); it is an Angular single-page application that
    serves no server-rendered search and exposes no discoverable API path, so it was NOT
    retrievable by script. That is a per-source negative, not an absence — see
    record-watch.yaml → WOOD-COUNTY-RECORDER.
  - >-
    THE CAMA KEEPS ONLY THE LAST CONVEYANCE PER PARCEL. Everything before it is gone from this
    source by construction. The two consolidations erased eleven tracts' prices.
  - >-
    THE LAYER'S VINTAGE IS ~2025-07-25 and has not advanced in a year. Nothing here is a
    statement about 2026.
  - >-
    LIAMES, LLC'S OWN REGISTRATION IS [open]. The Ohio Secretary of State business search returns
    HTTP 403 to automated retrieval (re-probed 2026-08-05), so the entity's organizers, agent and
    formation date are unread. The register's caution stands: a tax-billing address at 1 META WAY
    is not ownership of the LLC, and the Meta attribution rests on Meta's own 2025-04-09
    announcement and its 2026-01-07 letter to the trustees, not on a corporate filing.

confidence: high
