# Liames, LLC — Wood County land-assembly register (the Meta "Bowling Green Data Center" /
# "Project Accordion" campus, Middleton Township). Issue #1438, epic #1433.
#
# THIS IS A COMPILED CHAIN, NOT A DEED READ. Every conveyance below comes from the Wood County
# auditor's Vision CAMA layer — the county's own transfer record — not from a recorder deed
# image. The `land-assembly` record genre exists for exactly this distinction (see
# watermark.site.records): a per-deed vision read of a recorder PDF is `deeds`; a register
# sourced to a CAMA layer is this. What that means in practice is stated in `limitations` and it
# is the single most important thing on this page: THE CAMA KEEPS ONLY THE LAST CONVEYANCE PER
# PARCEL, so this register is a snapshot of who holds what, not the history of how it moved.
#
# TAG VOCABULARY (per CLAUDE.md / evidentiary-discipline):
#   [verified]  — read directly from the county's Vision_Parcels layer (grantee, deeded acreage,
#                 transfer date, consideration, instrument code, conveyance number).
#   [reference] — public reporting or a company statement. A lead, never a finding.
#   [inference] — arithmetic or reasoning over [verified] values, shown.
#   [open]      — not in the corpus. The grantors, the recorder instrument numbers, and every
#                 conveyance before the surviving one are all here.
#
# SEPARATION (the #1438 acceptance criterion, and the standing rule of this repo): this register
# is kept STRICTLY SEPARATE from the Allen-County / Lima Bistrozzi land-assembly graph and from
# Urbana's. No entity, parcel or relationship here cross-references either. There is no
# evidentiary link between Wood County and Allen County and none is manufactured.

as_of: '2026-08-05'
site: bowling-green
strengthens: [record, places]
issue: 'watermark-directory/the-watermark-directory#1438'
epic: 'watermark-directory/the-watermark-directory#1433'
county: Wood County, OH (FIPS 39173)
assembly: >-
  Meta "Bowling Green Data Center" / "Project Accordion" — SR-582 between SR-25 and I-75,
  Middleton Township, adjacent the FirstEnergy Mercer Road substation

source:
  instrument: county-auditor-cama
  layer: Services_for_Web_Apps/Vision_Parcels MapServer layer 0 (auditor CAMA join)
  url: https://wcohiogis.woodcountyohio.gov/server/rest/services/Services_for_Web_Apps/Vision_Parcels/MapServer/0
  fields_used:
    [Name, Owner_Name, Deeded_Name, Land_Acres, Sale_Date, Transfer_Price, Qualified,
     Instrument_Code, Conveyance__, Deed_Number, District, Street_Number, Street_Name,
     Primary_Use, Legal_Description]
  pulled: '2026-08-05'
  committed_as: data/reference/bowling-green/parcel-assemblage.geojson   # #1436, same layer
  layer_vintage:
    tag: '[verified]'
    max_sale_date: '2025-07-25'
    rows: 73839
    rows_after_max: 0
    note: >-
      PROBED FROM THE DATA, because the server publishes no `editingInfo`. A max-of-Sale_Date
      statistic over all 73,839 rows returns 2025-07-25 and a count of rows transferring after
      that date returns zero — the same two numbers #1436 recorded, unchanged a year later. EVERY
      NEGATIVE IN THIS FILE IS THEREFORE A STATEMENT ABOUT JULY 2025, not about the pull date. A
      conveyance recorded after 2025-07-25 is invisible here and its absence means nothing.

