  finding:
    tag: '[verified]'
    statement: >-
      Liames LLC applied to rezone thirteen parcels of which five, carrying 10.45 of the 31.82
      acres, stood in three other names in the county's parcel layer — a family partnership with
      three of them, an apartment company, and an owner-occupier.
    and_the_caveat: >-
      AS OF ~2025-07-25, WHICH IS ELEVEN MONTHS BEFORE THE APPLICATION WAS DOCKETED. Applicant's
      counsel told the trustees the parcels are "owned by Liames, LLC" and that the structures on
      them "have been razed." Two readings survive and NEITHER is adopted: (a) the five
      transferred after the CAMA snapshot, which is entirely ordinary and would make counsel's
      statement correct; (b) the application ran over land Liames did not hold of record, which
      R.C. 519.12 permits. This corpus previously carried the five as unnamed and the gap as "the
      CAMA layer's ~2025-07 vintage, not a research gap"; that reading survives, and the five are
      now named. The Wood County Recorder's chronological index closes it. [open]
  name_collision_warning: >-
    P&J THAYER FAMILY LTD and P&J THAYER FAMILY LIMITED PARTNERSHIP are served as two distinct
    `Deeded_Name` strings for what is almost certainly one partnership; they are carried
    separately because the layer serves them separately. Separately, #1436 flagged a LIMES family
    (Dale Limes LLC, Limes Real Estate Holdings LLC) holding several hundred acres on Devils Hole
