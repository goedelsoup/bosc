# ---------------------------------------------------------------------------------------------
# TOTALS AND THE ONE ARITHMETIC TRAP.
# ---------------------------------------------------------------------------------------------
totals:
  parcels: 12
  deeded_acres: 775.02                  # [verified] sum of Land_Acres over the twelve
  planar_acres: 774.878                 # [verified] #1436 measurement; union is ONE polygon
  consideration_sum_usd: 6921460        # [inference] arithmetic over the [verified] figures
  consideration_is_a_floor:
    tag: '[verified]'
    note: >-
      NEVER PRESENT $6,921,460 AS WHAT THE ASSEMBLY COST. The CAMA keeps only the last conveyance
      per parcel, and the two 2025-04-09 consolidations that carry 519 of the 775 acres are $0
      quitclaims which erased eleven predecessor tracts' purchase prices. The sum is a floor on a
      fraction. The register's own press figure — >$800M investment — is a different quantity
      again (land plus buildings plus equipment) and the two must never be compared.
  first_deed_date:
    cama_earliest: '2023-11-14'
    press_earliest: '2023-09-05'
    tag: '[reference]'
    note: >-
      THE REGISTER CARRIES "Deeds recorded from 2023-09-05" AND THE CAMA DOES NOT CORROBORATE IT.
      The earliest surviving conveyance here is 2023-11-14. That is not a contradiction: a
      September 2023 deed into a tract later folded into the 2025-04-09 consolidation would have
      been overwritten. The 2023-09-05 date stays [reference] and the discrepancy is recorded
      rather than reconciled, because the recorder's chronological index is the only thing that
      can settle it.

