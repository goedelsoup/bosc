meta_water_demand_conflict:
  tag: '[open]'
  status: UNRESOLVED — both figures recorded, neither preferred, no reconciliation asserted
  question: How much water will the Meta campus actually take, and through whom?
  figure_a:
    value_gpd: 50000
    attribution: Meta's own public announcement of the Bowling Green Data Center
    tag: '[reference]'
  figure_b:
    value_gpd: 600000
    attribution: >-
      Local reporting and NWWSD-linked coverage, characterized as a design commitment of "up
      to" roughly 600,000 gpd
    tag: '[reference]'
  spread: 12x
  what_would_settle_it:
    instrument: The NWWSD-Meta water service agreement
    secondary_instrument: >-
      The Bowling Green-NWWSD wholesale contract, whose ceiling was raised to 1.5 MGD in August
      2024 (against roughly 860,000 gpd actually purchased)
    route: R.C. 149.43 records request to NWWSD and to the City of Bowling Green
    status: not requested in this pass — recording the conflict was the instruction
  why_both_can_be_true: >-
    Stated as a hypothesis to be tested, NOT as a resolution. A closed-loop dry-cooled campus
    can have a small OPERATIONAL consumption and a much larger CONTRACTUAL reservation — the
    first is what it drinks, the second is what it is entitled to draw and what the district
    must build pipe and tank for. If that is the shape here, the two figures are answers to
    different questions and neither is wrong. Nothing in the captured record establishes this.
    Until an instrument is in hand, both figures stand side by side.
  the_cooling_claim:
    tag: '[reference]'
    claim: Closed-loop with dry coolers — "no operational water."
    discipline_note: >-
      This is the company's own characterization. It is carried at [reference] and it is
      load-bearing in the wrong direction for a water-stress thesis: a closed-loop dry-cooled
      design UNDERCUTS an abstraction-stress story. The Urbana lesson (1330) applies directly —
      model what the instruments support. On the evidence captured here the Bowling Green water
      story is SUPPLY EXPANSION UNDER DROUGHT and a wastewater plant already failing its
      nutrient limit, not a campus drinking a river dry. Do not import Lima's framing.
  the_real_tension:
    tag: '[verified]/[reference]'
    detail: >-
      The instruments support a narrower and better-documented tension than "data center takes
      water." The city sells water wholesale to NWWSD, which serves the campus. The city is
      simultaneously expanding treatment capacity ([verified] via the 2025 CCR's microfiltration
      trains) and buying reservoir land ([reference]). And in November 2025 a flash drought left
      the Maumee roughly 50% dry at Waterville and the city began studying an emergency Toledo
      interconnection through the same district it sells to ([reference]). An independent seller
      contemplating becoming a buyer is the documented story. The 50k-vs-600k question matters
      because it sizes that tension, not because it settles a water-stress claim.

