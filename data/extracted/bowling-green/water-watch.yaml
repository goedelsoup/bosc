  the_mbas_limit_is_one_month_old:
    tag: '[verified]'
    finding: >-
      Both Category-I quarters are exceedances of a limit that had just come into existence.
    chronology:
    - date: '2022-02-22'
      event: >-
        Fact sheet proposes NEW limits for MBAS and B2EHP "due to reasonable potential to exceed
        the wasteload allocation," with "a 36-month compliance schedule ... for the permittee to
        attain compliance with the new limits."
      citation: Fact Sheet 2PD00009 p. 2
    - date: '2022-05-01'
      event: Permit 2PD00009*TD effective. Part I.A.1 interim table carries MBAS as MONITOR ONLY — no numeric limit.
      citation: Permit 2PD00009*TD p. 1, pp. 2-4
    - date: '2025-04-30'
      event: >-
        Interim limit set ends. ICIS-NPDES independently carries LimitEndDate 30-APR-25 on the
        interim limits, which agrees with the permit's "through the 36th month" from a
        2022-05-01 effective date.
      citation: ICIS-NPDES via ECHO effluent chart, extract 2026-07-24
    - date: '2025-05-01'
      event: >-
        Final limits take force — "the period beginning on 37th month after the effective date."
        MBAS daily maximum 0.51 mg/L and 19.4 kg/day now apply. Part I.C.A.3 required compliance
        "no later than 36 months after the effective date."
      citation: Permit 2PD00009*TD pp. 5-7, pp. 20-21
      tag: '[inference]'
      inference_note: >-
        The calendar date is arithmetic on the permit's month-offsets; the permit prints no
        calendar date for the changeover. The ICIS interim end date of 2025-04-30 corroborates
        it from an independent system.
    - date: '2025-05-31'
      event: >-
        FIRST MBAS exceedance. Monitoring period ending 2025-05-31, outfall 001, daily maximum,
        reported 28 against a 19.4 kg/day limit — 44% over. RNC code R, "TRC Limitations
        Exceeded, Non-Monthly Average." Resolution code 2, "RE - Back into Compliance."
      citation: ICIS-NPDES DMR via ECHO effluent chart
    - date: '2025-10-31'
      event: >-
        SECOND MBAS exceedance. Daily maximum 1.24 mg/L against the 0.51 mg/L limit — 143% over.
        Same RNC code R, same resolution code 2.
      citation: ICIS-NPDES DMR via ECHO effluent chart
    why_it_matters: >-
      The plain reading — "a plant in significant noncompliance on surfactants" — is true and
      incomplete. Ohio EPA identified reasonable potential in 2022, gave the plant three years
      to prepare, and the limit was breached in the first month it applied and again five months
      later. Three years of compliance-schedule progress reports were required (Part I.C.A.1 and
      .2, event code 07099) and a compliance notification was due within seven days of attaining
      compliance (event code 05699). Whether any of the three was submitted is [open] and is the
      highest-value records request on this side of the story.
    unresolved_coding_conflict:
      tag: '[verified]'
      detail: >-
        ECHO codes these two quarters' reportable-noncompliance status as "Effluent - Monthly
        Average Limit," but the underlying DMR violations are both on the DAILY MAXIMUM
        statistical base and both carry RNC code R, which ECHO itself defines as "TRC
        Limitations Exceeded, NON-Monthly Average." The quarter-level label and the row-level
        code disagree. Both are recorded; neither is corrected against the other. The permit
        itself sets MBAS only as a daily maximum — there is no MBAS monthly average in Table 15
        — which favours the row-level coding, but the permit is not evidence about what ECHO
        meant.
    units_warning: >-
      The two MBAS exceedances are NOT in the same units and must not be plotted on one axis.
      2025-05 is a LOADING exceedance (28 vs 19.4 kg/day); 2025-10 is a CONCENTRATION exceedance
      (1.24 vs 0.51 mg/L). The "143% over" figure that appears in the issue body is the October
      concentration exceedance and is correct as such.

  the_phosphorus_record_is_the_larger_one:
    tag: '[verified]'
    finding: >-
      MBAS produced the two Category-I quarters, but phosphorus is the most-violated parameter
