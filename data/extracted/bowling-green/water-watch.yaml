    tag: '[verified]'
    source_document: data/documents/bowling-green/drinking-water/oh8700311-2025-ccr.pdf
    sha256: 593623f81a124e47c151bc3a890c14c5741a199466470802c76ed53c66ec8d72
    source_url: https://www.bgohio.gov/DocumentCenter/View/6013/2025-Drinking-Water-Consumer-Confidence-Report-PDF
    fetched_at: '2026-08-01'
    pages: 5
    license_status: '"The City of Bowling Green has a current unconditional license to operate our Water System." (p. 1)'
    violations_reported: none — every regulated contaminant row reads "No" in the Violation? column
    detections_2025:
      turbidity_ntu: {detected: 0.10, range: 0.02-0.10, tt: 0.3}
      total_organic_carbon: {detected: 2.9, range: 2.4-3.4, basis: 'removal ratio; >1 is compliant'}
      barium_ppm: {detected: 0.013, mcl: 2}
      fluoride_ppm: {detected: 1.03, range: 0.87-1.18, mcl: 4}
      nitrate_ppm_as_n: {detected: 7.3, range: <0.2-7.3, mcl: 10}
      tthm_ppb: {detected: 66.6, range: 34.3-85.7, mcl: 80}
      haa5_ppb: {detected: 23.1, range: 8.3-27.7, mcl: 60}
      total_chlorine_ppm: {detected: 1.5, range: 1.3-1.6, mrdl: 4.0}
      copper_ppm: {p90: 0.029, al: 1.3, samples_over_al: '0 of 31'}
      lead_ppb: {p90: <4, al: 15, samples_over_al: '0 of 31'}
    the_two_numbers_worth_watching:
      tthm: >-
        The MCL is 80 ppb and the reported RANGE OF DETECTION tops out at 85.7 ppb — an
        individual sample above the MCL. There is no violation, because the TTHM MCL is assessed
        on a locational running annual average, not on a single sample, and the LRAA-equivalent
        "Detected Level" is 66.6. But the city's own source water assessment names TTHM as its
        one standing exception: "historically, the City has effectively treated this source
        water to meet drinking water quality standards WITH THE EXCEPTION OF TTHMs" (p. 1,
        emphasis added here). TTHM is a disinfection by-product of chlorinating organic-rich
        water; a Maumee source with high organic load is exactly the setting that produces it.
      nitrate: >-
        7.3 ppm against a 10 ppm MCL — 73% of the standard, in a river draining the most
        intensively fertilized watershed in the state. No violation. The CCR carries the
        blue-baby-syndrome advisory and notes "nitrate levels may rise quickly for short periods
        of time because of rainfall or agricultural activity."
    treatment_train:
      described: >-
        "two independent treatment systems; a multi-barrier Conventional Treatment process and
        an Integrated Membrane Treatment process," blended for finished water (p. 1)
      recent_improvements: >-
        "The six Rapid Sand Filters were upgraded by completely rebuilding the filter bottoms
        and adding air to the backwash cycle. Also, two Microfiltration trains were added which
        will improve the plants ability to utilize the Reverse Osmosis Membranes." (p. 1)
      corroborates: >-
        This is the ~$4M membrane/RO expansion the issue body tracked as approved 2024-03 and
        still in "planning stages" as of Sept 2025. The CCR opens the passage "Two significant
        improvements were recently completed at the Bowling Green Water Treatment Plant" (p. 1)
        and names the added microfiltration trains as one of the two. So the utility places the
        work in the past tense. That is a self-published [reference] statement, not a
        construction record, but it is the first captured source indicating the expansion moved
        from planning to done.
      scope_caution: >-
        The CCR's "recently completed" covers the two improvements it enumerates — the rebuilt
        rapid sand filters and the added microfiltration trains. It does NOT say the whole ~$4M
        membrane/RO program is finished, and the trains are described as improving "the plants
        ability to utilize the Reverse Osmosis Membranes," which is an enabling step rather than
        the RO expansion itself. Do not read this as the program's completion.
    source_water_assessment: >-
      Revised by Ohio EPA in 2025 (p. 1). The revision itself is not captured. [open]
    pfas: >-
      Bowling Green participated in UCMR 5 in 2023-2024. The CCR does not print the results and
      directs readers to phone the Water Supply Superintendent for a copy. [open] — UCMR 5
      results are also published federally and could be pulled without a request.

  hab_and_cyanotoxin:
    tag: '[verified]'
    finding_in_the_2025_ccr: >-
      The 2025 CCR contains NO microcystin or cyanotoxin row in its regulated-contaminant table
      and NO harmful-algal-bloom narrative anywhere in its five pages. Recorded as an absence,
      which is what it is: the report does not say cyanotoxins were absent, it does not discuss
      them. Consistent with the issue body's note that the 2024 CCR reported no microcystin
      detections.
    premise_correction_that_must_not_regress:
      tag: '[reference]'
      claim_to_reject: >-
        That Bowling Green had a 2017 drinking-water advisory. It did not. The 2017 advisory on
        the lower Maumee near Toledo was a RECREATIONAL advisory; tap water was declared safe.
        This correction was made during the 2026-07-10 discovery research and is carried here so
        the myth does not re-enter through a later summary.
      what_actually_happened: >-
        Bowling Green's documented HAB fight was with cyanobacteria in ITS OWN off-stream
        reservoir — roughly 68% of algal composition in 2016, a RADOR aeration system installed
        2017, reported resolved January 2025 — plus daily microcystin testing adopted after the
        2014 Toledo event and a PhycoSens early-warning pilot.
      evidentiary_status: >-
        [reference] throughout. None of the reservoir-cyanobacteria record, the RADOR
        installation, or the PhycoSens pilot is backed by a captured primary document in this
        corpus. They rest on secondary reporting and city self-publication. They must NOT be
        cited as [verified] until the underlying records are pulled. See open_leads.
    oepa_advisory_table_check:
      status: '[open]'
      detail: >-
        The acceptance criterion asked for an Ohio EPA advisory-table check across 2016-2026 for
        this public water system. Not performed in this pass. The SDWIS compliance record is a
        strong negative for that period — zero quarters in noncompliance, no violations — but a
        public-water-system advisory is not the same instrument as an SDWA violation and the
        absence of the latter does not establish the absence of the former.

