# THE INTAKE SIDE — Maumee basin. Clean, and recorded at equal weight.
# ══════════════════════════════════════════════════════════════════════════════

intake_side:
  facility: City of Bowling Green Water Treatment Plant (WTP)
  pws_id: OH8700311
  pws_name: BOWLING GREEN CITY
  frs_registry_id: '110006258815'
  source: Maumee River intake near Waterville, into a 170 million gallon off-stream reservoir
  reservoir_capacity_mg: 170          # [verified] 2025 CCR p. 1, "our 170 million gallon above ground reservoir"
  reservoir_storage_days:
    value: ~30
    tag: '[reference]'
    attribution: >-
      The City's own Water Treatment Plant page (https://www.bgohio.gov/349/Water-Treatment-Plant),
      read 2026-08-01: "The Reservoir provides approximately 30 days of raw water supply."
      Self-published by the utility; the page is NOT captured as a committed document, so this
      is the weakest-provenance figure in this block.
    not_in_the_ccr: >-
      IMPORTANT — the captured 2025 CCR does NOT state a storage duration. It gives the
      capacity (170 MG) and nothing else. Do not cite the CCR for the 30-day figure.
    implied_denominator:
      tag: '[inference]'
      arithmetic: 170 MG / ~30 days = ~5.7 MGD implied average daily demand
      status: >-
        NO CAPTURED SOURCE STATES THE WTP'S AVERAGE DAILY DEMAND. ~5.7 MGD is what the city's
        own 30-day claim implies, not an independently sourced figure, and it is recorded only
        so the claim can be checked when a demand figure lands. It is consistent in magnitude
        with the ~5 MGD average carried in the epic's discovery research (also [reference]).
        The number that would settle it — pumpage or finished-water production — is [open].
      caution: >-
        A 30-day figure is a DESIGN characterization at some assumed demand, not a drought
        reserve. As demand rises toward the plant's ~10 MGD capacity the same 170 MG buys
        proportionally fewer days, so this number falls exactly when it would matter most —
        which is the whole reason the November 2025 flash drought and the Toledo interconnection
        study belong in the same file as the Abbott and Meta load growth.
  basin: Maumee, HUC 04100009 — a DIFFERENT basin from the discharge side

