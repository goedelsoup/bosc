ohd000001_data_center_general_permit:
  tag: '[verified]'
  status: CLOSED — the watch is over, and not because the permit issued
  disposition: Ohio EPA will NOT finalize the proposed data center general permit.
  notice_date: '2026-07-21'
  captured_source: data/documents/oepa/2026-07-21-ohio-epa-will-not-finalize-data-center-general-permit.npdes-general-permits.html
  quoted: >-
    "Ohio EPA Will NOT Finalize Proposed Data Center General Permit — Community Notice (July 21,
    2026) ... After carefully reviewing the significant volume of public comments received on the
    draft National Pollutant Discharge Elimination System (NPDES) general permit for data
    centers, Ohio EPA has decided not to move forward with finalizing the general permit. The
    individual NPDES permit issuance process is the most appropriate path forward at this time.
    Individual NPDES permits will continue to uphold the same rigorous environmental standards
    and protections required under state and federal law."
  what_the_issue_expected: >-
    The issue body, written 2026-07-10, set a standing watch: "on issuance, check the coverage
    list for the Meta campus and Apollo." There will be no coverage list. The notice landed
    eleven days after the issue was written.
  what_replaces_the_watch:
    tag: '[open]'
    detail: >-
      The watch does not disappear; it changes shape. If either the Meta campus or the Apollo
      plant has a process-water or cooling discharge, it now requires an INDIVIDUAL NPDES permit
      — a public-noticed, fact-sheeted, individually-limited instrument, which is a
      substantially better evidentiary object than a general-permit coverage row would have
      been. Neither facility appears in ICIS with an individual NPDES permit as of the
      2026-07-24 extract. The new watch is: does an individual NPDES application or draft permit
      appear for either? Shared with Sandusky (1384), which was on the same watch.
  do_not_confuse: >-
    OHD000001 is the DATA CENTER general permit and it is dead. OHC000000, the CONSTRUCTION
    general permit under which all the earthwork above is covered, is a different instrument
    entirely and is very much alive.

