    - {period: '2024-11-30', basis: MO AVG, value: 0.93, limit: 0.7, units: mg/L, pct_over: 33}
    - {period: '2024-11-30', basis: WKLY MAX, value: 1.3, limit: 1.1, units: mg/L, pct_over: 18}
    - {period: '2026-01-31', basis: MO AVG, value: 0.8, limit: 0.7, units: mg/L, pct_over: 14}
    - {period: '2026-02-28', basis: MO AVG, value: 1.2, limit: 0.7, units: mg/L, pct_over: 71}
    - {period: '2026-02-28', basis: WKLY MAX, value: 1.6, limit: 1.1, units: mg/L, pct_over: 45}
    the_closing_of_the_loop: >-
      The fact sheet says the North Branch Portage "is impaired for aquatic life use due to
      nutrient enrichment DOWNSTREAM of Bowling Green WPC," names the plant as a source, records
      that the TMDL's own 0.5 mg/L target for this plant was never adopted as a wasteload
      allocation, and sets 0.7 mg/L as an adaptive-management limit pending a resurvey. ECHO
      independently flags this facility's E90 effluent violations as being for parameters that
      impair its own receiving water — "BOD, carbonaceous, 05 day, 20 C | Phosphorus, total (as
      P)". As of 2026-02-28 the plant reported a monthly average of 1.2 mg/L: above the 0.7
      limit it is under, above the 1.0 limit it used to be under, and more than double the 0.5
      mg/L the TMDL said the stream needed.
    resurvey_status: >-
      [open] — the fact sheet states Ohio EPA "has not yet resurveyed the North Branch Portage
      River." Whether a resurvey has occurred since 2022 is not established by any captured
      source. The 2024 assessment cycle (below) is an Integrated Report listing, not necessarily
      a new biological survey.
    other_notable_exceedances:
    - {period: '2024-03-31', parameter: Oil and grease hexane extr method, basis: DAILY MX, value: 91.7, limit: 10, units: mg/L, pct_over: 817, note: 'the single largest exceedance on the permit, and unexplained by any captured source'}
    - {period: '2023-03-31', parameter: Mercury total low level, basis: MO AVG, value: 1.51, limit: 1.3, units: ng/L, pct_over: 16}
    - {period: '2023-02-28', parameter: 'Nitrite + Nitrate (station 801, ambient)', basis: 'non-receipt', note: 'DMR non-receipt, administratively resolved — a reporting failure at the UPSTREAM ambient station, not an effluent violation'}
    ammonia_note: >-
      All nine ammonia violations fall in 2022, immediately after the permit took effect and
      during the period the fact sheet attributes to the 2020-21 aeration rebuild ("the aeration
      treatment systems were operating at half capacity"). None occur after 2022. The
      permittee's explanation is carried at the same weight as the violations.

