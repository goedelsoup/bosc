  the_plant_is_bigger_than_its_river:
    tag: '[verified]'
    citation: 'Fact Sheet 2PD00009, Page 30 of 35, Table 12'
    discharger_flow_cfs: 15.47
    discharger_flow_mgd: 10
    receiving_7q10_cfs: 0.364
    receiving_1q10_cfs: 0.285
    harmonic_mean_cfs: 3.233
    ratio_note: >-
      Design flow is roughly 42x the annual 7Q10 of the water it enters — 15.47 against 0.364
      cfs, both printed in the same table. [inference] on the ratio (division), [verified] on
      both inputs. Under design-flow low-flow conditions Poe Ditch below this outfall is
      effluent rather than diluted effluent. This is the single most important hydrologic fact
      about the discharge side and it is not a violation of anything; it is the physical setting
      every limit on this permit was written against.
    low_flow_provenance_warning: >-
      These are REGULATORY denominators, drainage-area-adjusted from USGS gage 04195500 (Portage
      River at Woodville) over 1951-97. They are not measurements of Poe Ditch, and the record
      closed before the network's derived 7Q10 window (1980-2024) opens. Do not reconcile them
      against a derived value by preferring one. Same posture as Ottawa.

