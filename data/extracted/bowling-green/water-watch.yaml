# City of Bowling Green (Wood County, OH) — standing water watch.
#
# Provenance vocabulary (see docs/investigative-method/ENRICHMENT.md):
#   [verified]  = stated in a captured primary record (cite file + page) or read from a named
#                 federal system on a named extract date
#   [reference] = secondary / self-published source, not a controlling record
#   [inference] = reasoned from verified facts, labelled as such, arithmetic shown
#   [open]      = not established by any captured source — do NOT assert
#
# Bowling Green is the network's cleanest CROSS-BASIN water point, and that is the whole
# discipline of this file. The city DRINKS the Maumee (HUC 04100009) through an intake near
# Waterville and a 170 MG off-stream reservoir. It DISCHARGES to the Portage (HUC 04100010)
# through Poe Ditch. The two sides share a city and share nothing else — not a river, not a
# basin, not a permit, not a regulator's docket. They are recorded here together because the
# same municipal utility runs both and the same growth is pushing on both, not because they are
# hydrologically connected. They are not.
#
# THE CONFLATION TRAP, stated once: the WATER TREATMENT PLANT (WTP — drinking, ~10 MGD, Maumee,
# 17549 W. River Rd, PWS OH8700311) and the WATER POLLUTION CONTROL plant (WPC — wastewater, 10
# MGD average design, Poe Ditch, 901 N. Dunbridge Rd, NPDES 2PD00009 / OH0024139) are DIFFERENT
# PLANTS on DIFFERENT RIVERS with NEARLY IDENTICAL CAPACITY NUMBERS. A "10 MGD" figure with no
# plant named is unusable here.
#
# Violations below are data with citations, not a gotcha. Every quarter that came back clean is
# recorded as such; the drinking-water side, which is clean, is recorded at the same weight as
# the wastewater side, which is not.

meta:
  subject: >-
    Standing watch on the two sides of Bowling Green's water — the Water Pollution Control
    plant's Category-I significant noncompliance under NPDES 2PD00009*TD / OH0024139 on a
    surfactants limit that had been in force for one month, and the Maumee-sourced drinking
    water system PWS OH8700311, which is in compliance
  kind: water-watch
  site: bowling-green
  captured_for: issue 1439 (epic 1433, readiness(bowling-green))
  extracted_at: '2026-08-01'
  checked_on: '2026-08-01'
  previous_check: '2026-07-10'      # the discovery-sweep research recorded in the issue body
  federal_extract_dates:
    ICIS-NPDES: '2026-07-24'
    SDWIS: '2026-07-09'
  method: >-
    Four routes, run independently and recorded separately. (1) The two controlling Ohio EPA
    instruments — permit 2PD00009*TD and its Fact Sheet — pulled from the Ohio EPA DAM on
    2026-08-01 and transcribed page-by-page from their embedded text layers
    (data/documents/oepa/bowling-green/filename-map.yaml). (2) EPA ECHO for both statutes:
    dfr_rest_services.get_dfr and eff_rest_services.get_effluent_chart for the CWA side
    (OH0024139, FRS 110002321005), get_dfr for the SDWA side (OH8700311 and OH8752212), all read
    2026-08-01 against the ICIS-NPDES and SDWIS extract dates above. (3) ECHO's CWA facility
    index for Wood County (FIPS 39173), swept for construction general permit coverages under
    master permit OHC000000 — the route that answered the construction-stormwater question the
    issue had carried as open. (4) The City's own Utilities Department publications for the
    Consumer Confidence Report. Each federal figure is stamped with the system extract date it
    was read against, because a quarter that reads clean today may only be a quarter whose DMRs
    have not landed.

# ── What changed since the 2026-07-10 research ────────────────────────────────
# Recorded first because a standing watch is worth having only if it says what moved. Four of
# these are corrections to the issue body's own premises, made against the primary instruments.
delta_since_previous_check:
- item: The construction-stormwater chain is not open. It was never open; it was unsearched.
  tag: '[verified]'
  detail: >-
    The issue carried CGP/SWP3 coverage for the Meta earthwork and the Apollo site as "[open]
    until pulled." ECHO's Wood County index carries 158 active construction general permit
    coverages under master permit OHC000000, and the entire build-out is in it under its own
    codename — PROJECT ACCORDION (OHGC15219), APOLLO POWER GENERATION FACILITY (OHGC17963),
    APOLLO LAYDOWN YARD (OHGC18721), APOLLO NORTH PIPELINE (OHGC19094), ACCORDION-DOWLING 138KV
    INTERCONNECT (OHGC15929), plus NORTHWESTERN WATER AND SEWER DISTRICT (OHGC11188), OPPIDAN
    BOWLING GREEN DATA CENTER (OHGC15293), Abbott (OHGC08916, filed as NUTRITIONAL PRODUCT
    MANUFACTURING FACILITY) and BOWLING GREEN (45126) (OHGC17556, at the WPC's own address —
    the wastewater plant is itself a construction site). See `construction_stormwater` below.
    All nine are Effective with zero quarters in noncompliance.
- item: The campus does not drain to the plant's receiving water.
  tag: '[verified]'
  detail: >-
    Every Accordion/Apollo coverage is assigned by ECHO to WBD12 041000100703, "Cedar Creek-
    Frontal Lake Erie." The WPC and its receiving water are WBD12 041000100301, "North Branch
    Portage River." NWWSD's coverage is 041000090901, "Grassy Creek Diversion" — a MAUMEE
    (04100009) sub-watershed. Three of the four actors in this story are in three different
    HUC-12s. Any model that puts the campus's construction runoff into Poe Ditch is wrong.
- item: The 2022 renewal did not tighten the phosphorus limit.
  tag: '[verified]'
  detail: >-
    The issue body records "total-P limit tightened 1.0 -> 0.7 mg/L in the 2022 renewal." The
    fact sheet says the reduction happened in the PRIOR permit action: "the monthly average
    limit for total phosphorus was reduced from 1.0 to 0.7 mg/L in permit 2PD00009*SD" (p. 9).
    The 2022 *TD renewal CONTINUES that limit — it declined to go further to the TMDL's own 0.5
    mg/L target while Ohio EPA waited to resurvey the stream. The correction matters because it
    changes who did what and when.
- item: The SNC is younger than it looks, and it is not a story about a plant ignoring a limit.
  tag: '[verified]'
  detail: >-
    Both 2025 Category-I quarters are MBAS (surfactants). The MBAS limit did not exist before
    2025. It was created by this permit with a 36-month compliance schedule, and it first took
    force at the 37th month — on or about 2025-05-01. The plant's first exceedance is the
    monitoring period ending 2025-05-31, the first full month the limit was in force. See
    `the_mbas_limit_is_one_month_old` below, which is the central finding of this watch.
- item: The drinking-water side is clean and should stop being narrated as if it were at risk.
  tag: '[verified]'
  detail: >-
    PWS OH8700311 carries ZERO quarters in noncompliance over 04/2023-03/2026, CurrentSNC "No,"
    and no SDWA violation of any kind in the window. The only enforcement action on its entire
    ECHO record is a state public notification received 1985-06-26. The 2025 CCR reports no
    violation for any regulated contaminant. Whatever the water story at Bowling Green is, it is
    not a tap-water-quality story.

