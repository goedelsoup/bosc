open_leads:
- id: BG-WARNING-LETTER-OH-I00107014
  question: What violations did the 2025-02-19 warning letter actually cite?
  why: >-
    It is the only enforcement action on the CWA side in five years and it predates both
    Category-I quarters, so it cannot be about MBAS. ECHO gives the action type and date but not
    the cited violations.
  route: Records request to Ohio EPA Northwest District Office for enforcement action OH-I00107014.
- id: BG-COMPLIANCE-SCHEDULE-SUBMITTALS
  question: >-
    Were the two compliance-schedule progress reports (event code 07099, due ~2023-05-01 and
    ~2024-05-01) and the compliance notification (event code 05699) submitted?
  why: >-
    Highest-value item on the discharge side. The plant had three years' notice of the MBAS
    limit and exceeded it in month one. What it told Ohio EPA during those three years about its
    ability to meet it is the difference between a plant that was surprised and a plant that
    was not.
  route: Records request to Ohio EPA NWDO for the 2PD00009 compliance-schedule file.
- id: BG-CGP-NOIS
  question: Disturbed acreage, receiving water and SWP3 for OHGC15219, OHGC17963 and OHGC19094.
  why: >-
    Construction coverage is established; the earthwork's SIZE is not. The issue's ~280-acre
    Meta and 147-acre Apollo figures have no permit-document support in the captured record.
  route: Ohio EPA eBusiness Center NOI lookup, or a records request for the NOIs.
- id: BG-NWWSD-SERVICE-AGREEMENT
  question: The NWWSD-Meta service agreement and the August 2024 BG-NWWSD wholesale contract.
  why: The only instruments that can settle the 50,000-vs-600,000 gpd conflict.
  route: R.C. 149.43 request to NWWSD and to the City of Bowling Green.
  note: Deliberately not drafted in this pass — the instruction was to record the conflict, not to request.
- id: BG-RESERVOIR-CYANOBACTERIA-RECORD
  question: >-
    Primary documentation for the reservoir cyanobacteria history — the ~68% algal composition
    figure (2016), the RADOR aeration installation (2017), the January 2025 resolution, and the
    PhycoSens pilot.
  why: >-
    All four are currently [reference] only. The HAB backdrop is the part of this site's water
    story with the weakest evidentiary footing, and it is the part most likely to be repeated
    into [verified] by a later summary.
  route: City of Bowling Green Board of Public Utilities minutes and Water Treatment Plant records.
- id: BG-OEPA-ADVISORY-TABLE
  question: Ohio EPA public-water-system advisory table for OH8700311, 2016-2026.
  why: >-
    Explicitly asked for by the acceptance criteria and not performed in this pass. Needed to
    close out the no-2017-advisory correction against the state's own table rather than against
    secondary reporting.
  route: Ohio EPA Division of Drinking and Ground Waters HAB/advisory records.
- id: BG-PORTAGE-RESURVEY
  question: Has Ohio EPA resurveyed the North Branch Portage River since the 2022 renewal?
  why: >-
    The 0.7 mg/L phosphorus limit is explicitly an adaptive-management placeholder pending a
    resurvey. If the resurvey has happened, the next renewal's limit is in play — and the next
    renewal application is due on or about 2026-11-01.
  route: Ohio EPA Division of Surface Water biological and water quality survey reports.
- id: BG-UCMR5-PFAS
  question: Bowling Green's UCMR 5 PFAS results (2023-2024).
  why: The CCR confirms participation but prints no results, directing readers to phone the superintendent.
  route: Federal UCMR 5 public dataset — no records request needed.
- id: BG-INDIVIDUAL-NPDES-DATA-CENTER
  question: >-
    Does an individual NPDES application or draft permit appear for the Meta campus or the
    Apollo plant, now that the general-permit route is closed?
  why: The replacement for the dead OHD000001 watch. Shared with Sandusky (1384).
  route: Standing check of Ohio EPA public notices and the ICIS-NPDES facility index for Wood County.
