dominant_hsg:
  value: C/D
  source: connector
  citation: >-
    [verified] USDA NRCS SSURGO via Soil Data Access (SDA), grid-sampled over the twelve
    parcel_role=liames_assembly parcels (watermark.hydrology.connectors.ssurgo.dominant_hsg,
    2026-08-01). The answer is C/D at every resolution tested — 6x6 (26 interior points), 8x8
    (45), 10x10 (70), 12x12 (102) and 16x16 (185) — with 428 of 428 points returning C/D and NO
    other group appearing at any density. That is a uniformity none of the peer sites showed,
    and it means the letter is not a grid artefact. It REPLACES the profile's prior [inference]
    of a plain "D" argued from the Great Black Swamp lakebed clays (Hoytville / Nappanee /
    Latty). The inference was reading the soils correctly; what it missed is that the survey
    rates them DUAL. C is the group where field tile is installed and maintained and D the
    natural undrained condition, and this is tiled farm ground — so collapsing it to D
    pre-selects the high-runoff condition for every scenario including the PRE-development one,
    where the ground is drained. The per-scenario switch (pre_drainage_condition drained /
    post_drainage_condition undrained, watermark.hsg / WS-20) is what resolves it, and it is
    live here in a way it is inert for a single-group site. This is the same class of correction
    as Sidney (B->D), Urbana (B->C) and Troy-Piqua (B->C/D) — a profile letter argued from
    regional geology, checked against the survey — but it is the first where the correction is
    about the RATING'S FORM rather than its letter.
  confidence: high

