  source: reference
  citation: >-
    parcel-assemblage.geojson — the UTM-17N (EPSG:32617) planar area of the UNION of the twelve
    parcel_role=liames_assembly parcels, which is a SINGLE polygon. The union is 0.004764 ac —
    about 19 m2 — SMALLER than the 774.883-ac sum of the parts, and that difference is the total
    pairwise intersection: the parcels abut along shared boundaries that overlap by slivers at
    that scale, not exactly. Say "one contiguous block", not "they do not overlap".
    The county CAMA DEEDED total is 775.020 ac; the two are NOT reconciled — cite
    the deeded figure for the record and the planar one for area/runoff modeling. THIS UPGRADES
    the register's "~750-acre Liames assembly" from [reference — press] to [verified], and the
    upgrade is a measurement of contiguity, not an arithmetic sum of press acreages. The
    ~280-ac initial building site reported inside it is a SITE-PLAN figure and is not derivable
    from the parcels [open].
  confidence: high

