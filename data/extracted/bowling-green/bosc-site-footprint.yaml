# The Meta "Bowling Green Data Center" / "Project Accordion" campus — footprint record for the
# Bowling Green, OH (Poe Ditch → North Branch Portage) watershed point. LIKE Sidney's /
# Wilmington's / Urbana's (and UNLIKE Lima's document-transcribed stormwater-permit footprint),
# the boundary here is drawn from the auditor's parcels, committed as
# data/reference/bowling-green/parcel-assemblage.geojson. UNLIKE Wilmington's, the campus itself
# is a single recorded OWNERSHIP holding — twelve contiguous parcels all deeded to one entity —
# and the other claims in the file are kept out of it by the `parcel_role` property rather than mixed in.
# parcel_acres is the GIS-measured planar area; building/impervious/developed stay [open] pending
# the site plan. Source tags: reference = committed GIS reference dataset; connector = a live
# public-data read; document = transcribed from a corpus instrument; assumption = a stated
# modeling input.
site: >-
  Middleton Township, Wood County, OH — the Meta Platforms "Bowling Green Data Center"
  (codename "Project Accordion"), north of SR-582 (Middleton Pike) between SR-25 (Dixie Highway)
  and Mercer Road, about 6 mi north of the City of Bowling Green and immediately south-east of
  the FirstEnergy/ATSI Mercer Road transmission tract. Land of record: twelve contiguous Wood
  County parcels deeded to LIAMES, LLC. #1436 (places) / #1435 (facility), sub-issues of #1433.
operator: >-
  Meta Platforms (operator and announced developer, "Hello, Bowling Green", 2025-04-09
  [verified]); LIAMES, LLC is the owner of record of every parcel in the assembly and the
  customer of record on the Apollo OPSB case 25-0973-EL-BLN. The county tax roll is an
  INDEPENDENT corroboration of the Meta attribution rather than a second-hand one: eight of the
  twelve parcels carry the owner mailing address "1 META WAY, MENLO PARK, CA 94025" (served
  "MENLOW PARK" on four of them), and the other four go to a Columbus address the county spells
  two ways: "52 E GAY ST, COLUMBUS, OH 43215" on three and "52 EAST GAY ST, COLUMBUS, OH 43215"
  on 611190000036001. All four spellings are carried verbatim in the committed geometry rather
  than normalized — a CAMA string is transcription, not a value to tidy.
  That is a billing address, not a certificate of ownership of the LLC — the Ohio Secretary of
  State registration for Liames, LLC stays [open] (#1437 probed it; the SOS business search is
  automation-blocked). See data/extracted/bowling-green/data-centers.md.
boundary_basis: >-
  ONE RECORDED OWNERSHIP HOLDING, plus three rows that are NOT part of it and are held apart by
  the geojson's `parcel_role` property — never sum them into a single "campus".
  (1) parcel_role=liames_assembly — TWELVE Wood County parcels deeded to LIAMES, LLC, 775.020 ac deeded
  / 774.878 ac planar, whose union is a SINGLE polygon across a 1,821 m x 2,489 m extent. Four
  tracts over 50 ac carry 753.65 ac of it and are themselves contiguous: 611190000003500
  (322.5 ac, 0 Mercer Rd), 611190000029510 (196.5 ac, 0 Dixie Hwy), 611300000001000 (160 ac,
  12279 Middleton Pike) and 611300000002000 (74.65 ac, 12499 Middleton Pike). The remaining
  21.37 ac are eight small parcels along SR-25, Mercer Rd and Middleton Pike whose houses and a
  strip of motel rooms have been razed.
  (2) parcel_role=rezoning_pending — 611190000006000, 64.55 ac still deeded to A. SCHALLER LIMITED
  PARTNERSHIP, abutting the campus, 39.265 ac of which the Wood County Planning Commission
  recommended rezoning A-1 to M-1 by 6-2 on 2026-07-07 for Liames construction parking, township
  action pending. Ownership unchanged; Liames is in contract to purchase.
  (3) parcel_role=apollo_permit_situs — 611200000011000, 79.07 ac at 11902 Middleton Pike, the address
  on the Apollo Power Generation Facility's Ohio EPA air permit, still deeded to JJJ FAMILY
  PROPERTIES LLC since 2008. Not the plant's project boundary (see notes).
  (4) parcel_role=oppidan_colo — 511210000002003, the separate 11.80-ac Oppidan colo site 4.83 mi away
  in the City of Bowling Green.
  NOT a surveyed earth-disturbance boundary: no site plan and no Ohio EPA construction stormwater
  (NPDES OHC000005 / Rule-5) footprint is in the corpus. ZONING STATUS RIDES WITH THE GEOMETRY:
  the eight small parcels' M-1 designation was granted by a 2-1 trustees vote on 2026-07-07 over
  the township zoning commission's rejection, and a referendum petition against it was
  circulating when this geometry was pulled.

parcel_acres:
  value: 774.878
