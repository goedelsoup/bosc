  value: M-1
  source: connector
  citation: >-
    [verified] "M-1: Light Industrial", Middleton Township, over the campus CORE. Read from the
    township's own parcel-joined zoning layer (MIDDLETON_ZONING_SCHEMA — Wood County ArcGIS
    Hosted/Middleton_Twp_Zoning_Viewer26 layer 1, zoning content built 2025-11-13), by GEOMETRIC
    OVERLAP rather than by parcel id, because that layer rides an older parcel fabric (see
    notes). The four core tracts read 99.82-100% M-1: 611190000003500 99.82% across seven
    old-fabric parcels, 611190000029510 99.88% across three, 611300000001000 and
    611300000002000 100% each. The Apollo permit-situs parcel also reads 100% M-1. THE EIGHT
    SMALL PARCELS DO NOT: seven read "A-1: Agricultural" and 611190000025000 (21186 Dixie) reads
    "R-4: Multiple Dwelling" — their pre-rezoning districts, because no published Wood County
    layer carries the 2026-07-07 change. B-4, the SR-25/582 Overlay, is an OVERLAY served as a
    separate layer and does not replace the base district.
  confidence: high

small_parcel_zoning_district:
  value: null
  source: connector
  citation: >-
    [open] — and the reason is a sequence of contested votes plus a publication lag, both
    documented rather than absent. Middleton Township trustees rezoned THIRTEEN parcels totalling
    31.82 ac from R-4 Residential and A-1 Agricultural to M-1 Industrial by a 2-1 vote on
    2026-07-07 (Mike Moulton and Fred Vetter in favor, Melissa Petrea against), after the Wood
