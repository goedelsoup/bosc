    commission REJECTED it on 2026-06-10 [verified — Sentinel-Tribune 2026-06-12 / 2026-07-07,
    BG Independent News 2026-06-03 / 2026-07-08]. Under R.C. 519.12 that starts a 30-day
    referendum-petition window closing about 2026-08-06, and a petition drive needing 971 valid
    signatures to reach the November 2026 ballot was circulating as of 2026-07-18 (organizers
    targeting ~1,300 to absorb rejections; Leslie Harper coordinating) [reference — The Blade via
    thecooldown.com]. THE WINDOW WAS STILL OPEN WHEN THIS GEOMETRY WAS PULLED (2026-08-01), so
    the outcome is not captured and must not be back-filled from an assumption that it lapsed.
    Separately, no published GIS layer carries the grant either way: the countywide township
    zoning layer is a 2013 snapshot and the hosted Middleton layer's zoning content is from
    2025-11-13. The instruments are the trustees' resolution and, if it is filed, the referendum
    petition at the Wood County Board of Elections.
  confidence: null

receiving_water: >-
  [inference] The campus sits on the Middleton Township till/lakebed upland; the specific
  stormwater receptor for the built campus is [open] pending the construction stormwater permit.
  DISTINCT from the SANITARY pathway, which the record closes for the city's own POTW: Bowling
  Green WPC → Poe Ditch RM 2.5 → North Branch Portage River RM 8.56 → Portage River → Lake Erie
  (Ohio EPA NPDES 2PD00009 / OH0024139 [verified — fact sheet, #1439]). And DISTINCT again from
  the WITHDRAWAL side, which is the MAUMEE at the Waterville intake, a different HUC-8 entirely
  (04100009 vs the discharge side's 04100010) — the campus's own water is wholesaled through the
  Northwestern Water & Sewer District, whose 20-ac tract at 12560 Dixie Hwy ABUTS the assembly
  (0.0 m). Whether campus wastewater reaches the city WPC at all is [open]; the closed-loop-dry
  cooling claim is [reference] (#1439).

notes:
  - 'ASSEMBLY = 12 parcels / 775.020 ac deeded / 774.878 ac planar / ONE contiguous polygon over a 1,821 m x 2,489 m extent. Core (4 tracts, 753.65 ac deeded): 611190000003500 (322.5 ac, 0 Mercer, use 101, district J36, acquired 2025-04-09 QC $0), 611190000029510 (196.5 ac, 0 Dixie, use 101, J34, 2025-04-09 QC $0), 611300000001000 (160 ac, 12279 Middleton, J36, 2023-11-14 QC $0) and 611300000002000 (74.65 ac, 12499 Middleton, J36, 2023-11-14 LW $2,923,960). Fringe (8 parcels, 21.37 ac, all use 511, acquired 2024-09-04 through 2025-07-21 for $315,000-$650,000 each). All [verified] from the Wood County Auditor Vision CAMA (Vision_Parcels layer 0, read 2026-08-01).'
  - 'PRICE — do NOT sum the transfer prices and call it what the land cost. The CAMA carries only the LAST conveyance per parcel, and on 2025-04-09 eleven predecessor tracts were consolidated into the two large campus parcels by quitclaim to Liames itself at $0 (deed numbers 0519 and 0520, consecutive), which erased their purchase prices from this layer. What survives across the twelve rows sums to $6,921,460 — a floor on a fraction of the assembly. The ~$9M reported for the 2023-09-05 warranty deeds (Toledo Legal News transfer listings, [reference]) is not visible here at all. Every conveyance number in the file is distinct, so the Clinton County "consideration is per deed, repeated on every parcel" trap does NOT apply — but the Wood County Recorder deed chain is still the instrument, and it stays [open].'
  - 'THE PARCEL FABRIC MOVED — an id join across the county''s own layers silently misses this campus. 611190000003500 and 611190000029510 are 2025-04-09 consolidations; their eleven predecessors (611190000002500, 002501, 003000, 004000, 005000, 007000, 020000, 029500, 032000, 032002) still populate the township zoning layer, summing to 319.99 ac and 195.86 ac against the successors'' 322.5 ac and 196.5 ac. Every zoning read in the committed geojson is therefore geometric, and names the old-fabric parcels it read through in zoning_fabric_parcels.'
  - 'THE LAYER SERVES ONE ROW PER POLYGON PART, and both obvious fixes are wrong. Twelve of the 774 parcels in the Middleton neighbourhood come back on 2-6 rows with identical attributes; all twelve repeat sets are pairwise disjoint (0.000 ac of overlap) and the parts sum to the deeded acreage. Deduping on the parcel id DROPS LAND — 25.294 of the Schaller tract''s 64.55 acres — while summing Land_Acres over the raw rows double-counts. Union the geometry per id and take the acreage once.'
  - 'THE SCHALLER REZONING IS FOR PART OF A PARCEL. 611190000006000 is served as two disjoint parts of 39.621 ac and 25.294 ac (64.915 ac planar, 64.55 ac deeded). The township''s mapped A-1 polygon covers 61.03% of the parcel, which is exactly the 39.621-ac EASTERN part, and the press places the application "north of Ohio 582 on the east side of Ohio 25" against a stated 39.265 ac. That the application is that eastern part is [inference] — the rezoning''s own legal description is the instrument and is not in the corpus.'
  - 'THE APOLLO PLANT SITS ON LAND ITS OWNER DOES NOT OWN, and its project boundary is not a parcel. A countywide CAMA owner scan on "%WILL-POWER%" returns ZERO rows: Will-Power OH, LLC holds no land in Wood County at this snapshot. The parcel of record for its air permit, 611200000011000 (79.07 ac, 11902 Middleton Pike), is still deeded to JJJ Family Properties LLC of 20022 Mercer Rd since 2008-12-22 and abuts the campus at 0.0 m. The OPSB staff report''s ~146.84-acre project area reconciles to NO parcel or contiguous parcel group here — no combination of JJJ''s four parcels (79.07 + 38.66 + 10.70 + 53.48 ac) or of the abutting Dauer tracts lands within 3 ac of it — and the report itself gives 146.84 / 163 / 165.11 ac for three different boundaries. The plant''s footprint stays [open]; the lease or option that puts it there is [open] too. (#1437)'
  - 'THE RECORD SHOWS 8 OF THE 13 REZONED PARCELS, and the gap is the layer''s vintage, not a research gap. This server publishes no editingInfo, so currency has to be probed from the data: max(Sale_Date) over all 73,839 rows is 2025-07-25 and there are ZERO rows with Sale_Date after 2026-05-01. It is a ~2025-07 snapshot and cannot show a later conveyance. The press reports all thirteen parcels as already owned by Meta with the structures razed [reference]; the record shows eight, 21.37 ac. The rezoning application''s parcel schedule at the county planning commission is what would close the other 10.45 ac. [open]'
  - 'CAUV READS ZERO ON THE CONSOLIDATED TRACTS AND THAT HAS TWO READINGS. The 160-ac and 74.65-ac parcels acquired 2023-11-14 still carry CAUV land values ($585,960 and $255,360); the 322.5-ac and 196.5-ac tracts consolidated 2025-04-09 read 0. SEVEN of the eight fringe parcels also read 0 — but 611190000009000 (1.01 ac, 21630 Dixie) reads $46,750, so "the fringe is off CAUV" is not a rule and the one exception is on the record. Either the campus core came off current agricultural use valuation, or the new parcel numbers have not been re-valued at this extract. The auditor''s CAUV recoupment record settles it and is not in the corpus — do not report the zeros as a documented removal. [open] Note that CAUV (R.C. 5713.30) is NOT the Agricultural District program (R.C. 929) whose 75.143 ac the Apollo staff report says will not be retained.'
  - 'THE CAMPUS ABUTS ITS OWN INFRASTRUCTURE, and that is measured, not asserted. Sharing a boundary with the assembly at 0.0 m: the FirstEnergy/ATSI transmission tract 611180000001000 (72.43 ac, 22105 Mercer Rd, AMERICAN TRANSMISSION SYSTEMS) plus its 9.45-ac Dowling Rd parcel, with a third ATSI tract 126 m away; the Northwestern Water & Sewer District''s 20-ac tract at 12560 Dixie Hwy, the wholesaler in the 50k-vs-600k GPD conflict; the Apollo permit-situs parcel; and the Board of Trustees of Middleton Township''s own 11.81-ac parcel at 21745 Dixie. These grounded the profile''s "adjacent the FirstEnergy Mercer Rd substation" claim, which had been uncited geometry. Their polygons are deliberately NOT committed to parcel-assemblage.geojson: that file feeds the geo/campus layer, and rendering a substation or a water-district yard as "campus" would be a map that lies. THE SAME OBJECTION PARTLY APPLIES TO WHAT IS IN THE FILE, and is accepted knowingly: campus_from_parcels emits EVERY feature of parcels_relpath onto the campus layer, so the Oppidan colo 4.83 mi away renders there too. It is kept because #1436 asks the pull to cover it and because parcel_role rides through to the popup, so a reader can tell the four claims apart; nothing computes a map extent from this feed (CorridorMap carries a hardcoded initial view), so there is no silent distortion of the campus bounds. If a per-site campus layer ever starts auto-fitting, filter on parcel_role=liames_assembly at that point rather than dropping the parcel from the record.'
  - 'THE OPPIDAN COLO IS A DIFFERENT PLACE, 4.83 mi away. 511210000002003, 11.80 ac deeded to CLOP BOWLING GREEN OH LLC on 2025-02-03 for $1,105,000, in the Woodbridge Business Park inside the CITY of Bowling Green — 7,771 m from the nearest campus boundary, measured in UTM 17N. The owner''s mailing address, 400 Water St Suite 200, Excelsior MN 55331, is Oppidan Investment Company''s own headquarters, which is what identifies the SPE; the register had the site as "~12 ac" [reference] and it is now 11.80 ac deeded [verified]. Its situs reads 2371 Woodstream in this snapshot while the building''s address is 2501 Woodstream Dr. City zoning, not township: the City of Bowling Green publishes its own districts (gis.bgohio.org PublicData/UtilitiesWithZoning layer 2, "Current Zoning", with Year_2015..Year_2027 columns carrying a per-parcel zoning history) and that layer, not the Middleton one, is the instrument for this parcel. Never fold its acreage or its 6-8 MW into the Meta campus.'
  - 'THE NEIGHBOURS INCLUDE A "LIMES" FAMILY. Dale Limes LLC, Limes Real Estate Holdings LLC and Limes Galen E hold several hundred acres along Devils Hole Rd and Dixie Hwy — one letter from LIAMES. The issue register''s "Devils Hole Rd ~112 ac, ag to light-industrial, township zoning commission voted against recommending" is [reference] and was NOT resolved here: no such request appears in the 2026-06 / 2026-07 press coverage, and the parcel it refers to is not identified. Check the spelling before reading a Devils Hole parcel as part of the assembly. [open]'
  - 'This record commits the boundary + measured acreage + the SSURGO-validated HSG so the onboard SSURGO/HSG step no longer skips (it had been skipped for want of a committed footprint), and it sets the pre_cover / post_cover / developed_pervious_cover scenario knobs and the toxic_corridor_bbox the profile had carried as TODO / (0,0,0,0) "pending an identified site".'
  - 'Building / impervious / developed stay [open]: no site plan, no zoning permit file and no Rule-5 construction stormwater permit is in the corpus, and the disclosed 715,000 sq ft is the basis of the facility profile''s SCREENING IT-load bracket (#1435), not a surveyed footprint.'
