# =============================================================================================
# 1. THE CHAIN OF LEGISLATION — five resolutions over six months, in the order they bind.
# =============================================================================================
legislative_chain:
  - ref: "Res. 84-22"
    adopted: "2022-10-10"                     # [verified] — read off the instrument (#1998)
    subject: "ESTABLISHING the City of Sidney City-Wide Community Reinvestment Area under R.C. 3735.65-.70, designating a Housing Officer and creating a Housing Council"
    in_corpus: true                           # data/extracted/sidney/council/2022-10-10-res-84-22-citywide-cra-established.resolution.yaml
    state_certification:
      designator: "Director, Ohio Department of Development"
      cra_area_number: "149-72424-06"
      cra_area_number_tag: "[verified: recital]"
      cra_area_number_source: >-
        Recited in Res. 69-25, journal page 0297. ⚠️ NOT read off Res. 84-22 itself: the pages of
        84-22 read here (0-3, the operative sections) state no ODOD area number, and its Exhibit A
        is an image. A recital is a party's account of another instrument — the distinction this
        register learned the hard way, twice — so the number is tagged for what it is rather than
        promoted to a direct read. To settle it, read 84-22's remaining pages or ODOD's own record.
    monitoring_fee:
      tag: verified
      section: '§5, as originally adopted 2022-10-10'
      verbatim: >-
        An annual monitoring fee to the City of Sidney of one percent ( 1 % ) of the amount of the
        incentives, or a minimum of Five Hundred Dollars ($500.00), up to a maximum of Twenty-five
        Hundred Dollars ($2,500.00) annually is required for commercial and industrial projects.
      source:
        file: data/documents/sidney/council/84-22 - Establishing CRA based on Community Boundaries.pdf
        journal_pages: ['0299', '0300']
        read: text layer, confirmed by independent 300-dpi OCR
      ⚠️_re_attributed: >-
        RE-ATTRIBUTED 2026-08-13 (#1998 tail). This sat under Res. 69-25 as "§5, as amended", which
        made a 2022 figure read as though the 2025 expansion had set a $2,500 annual administration
        cap on a $3 billion project. It did not: 69-25 restated §5 and left the fee unchanged. The
        cap is still worth knowing — it is what the City charges to administer an exemption of any
        size — but it is 84-22's. Same error class as the designation mis-attribution corrected in
        #1998, one subsection away, and found the same way: by re-reading a committed instrument
        instead of reasoning from the file that cites it. ⚠️ The FIRST correction was narrative
        only — the key stayed nested under 69-25's megaproject block, so a structured consumer
        still read it as a property of the thirty-year tier. Correcting prose without moving the
        key is half a fix.
    note: >-
      ⚠️ THIS, NOT RES. 69-25, IS THE DESIGNATING ACT — and the register said otherwise until #1998
      read both instruments directly. §4 as adopted here tops out at FIFTEEN years / 100% for new
      commercial and industrial construction; there is no thirty-year tier and no reference to
      R.C. 122.17 anywhere in it.

  - ref: "Res. 69-25"
    adopted: "2025-09-08"                     # [verified] — read off the instrument (#1998)
    subject: "EXPANDING the City-Wide CRA to be coterminous with the City, and amending Res. 84-22 §4 to add a thirty-year megaproject exemption tier"
    in_corpus: true                           # data/extracted/sidney/council/2025-09-08-res-69-25-cra-expansion-and-megaproject-tier.resolution.yaml
    state_certification:
      designator: "Director, Ohio Department of Development"
      effective: "2025-09-19"
      cra_area_number: "149-72424-06A"
      tag: "[verified: recital]"
      source: >-
        Both values are recited in Res. 82-25 and NOT stated in Res. 69-25 itself, which is now in
        the corpus and read: 69-25 §8 only AUTHORIZES the Community Development Director to
        petition ODOD for approval of the expanded CRA. So the certification date and the `-06A`
        number are still a third party's account, tagged as such. That the suffix reconciles with
        84-22's `-06` is what makes the recital credible — it is not what makes it a direct read.
    creates_the_thirty_year_tier:
      tag: verified
      verbatim: >-
        (e) Up to thirty (30) years, and up to one hundred percent (100%) if the commercial or
        industrial structure is situated on the site of a megaproject and is owned and occupied by
        a megaproject operator (as such terms are defined in Ohio Revised Code Section
        122.17(A)(12)) …
      why_it_matters: >-
        The 30-year / 100% exemption in the CRA Agreement below rests on this clause, and the
        clause did not exist until this resolution added it — seven weeks before Res. 80-25
        authorized the agreement. [verified] as a SEQUENCE from two instruments and the minutes of
        both meetings. [open] as a motive: 69-25 names no project, no company and no parcel, and
        its stated reason is the recent annexations.
      monitoring_fee_note: >-
        The monitoring fee is NOT a property of this clause. 69-25 restated §5 and left it
        unchanged; the figures are Res. 84-22's, and they are recorded there. See that entry's
        `monitoring_fee`.
    note: >-
      ⚠️ CORRECTED at #1998. The register carried this as the DESIGNATING legislation, reasoning
      from the CRA Agreement's and Res. 82-25's recitals. Read directly, it amends and expands
      Res. 84-22. Both readings of the corpus before this one were wrong in the same direction —
      "Resolution 18-25 … October 2025" (the pre-#1380 register), then "the designating
      legislation is Res. 69-25" (#1380) — and each was corrected only by reading one document
      closer to the source. The `-06A` suffix on the area number was the standing clue.

