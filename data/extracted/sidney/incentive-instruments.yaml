# =============================================================================================
# 1. THE CHAIN OF LEGISLATION — five resolutions over six months, in the order they bind.
# =============================================================================================
legislative_chain:
  - ref: "Res. 69-25"
    adopted: "2025-09-08"                     # [verified] — recited in BOTH the CRA Agreement and Res. 82-25
    subject: "Designation of the City of Sidney City-Wide Community Reinvestment Area under R.C. 3735.65-.70"
    in_corpus: false                          # [open] — the City does not publish it; see `open_items`
    note: >-
      The register carried the CRA legislation as "Resolution 18-25 … October 2025". That is
      wrong on both the number and the month, and it is why no such instrument could be found.
      The designating legislation is Resolution No. 69-25, adopted 2025-09-08, and the CRA it
      designates is CITY-WIDE, not a project-specific envelope.
    state_certification:
      designator: "Director, Ohio Department of Development"
      effective: "2025-09-19"                 # [verified] — Res. 82-25 recitals
      cra_area_number: "149-72424-06A"        # [verified] — Res. 82-25 recitals

  - ref: "Res. 80-25"
    adopted: "2025-10-27"                     # [verified]
    subject: "Authorizing the City Manager to enter into a Community Reinvestment Area Agreement with Amazon Data Services, Inc."
    in_corpus: true

  - ref: "Res. 81-25"
    adopted: "2025-10-27"                     # [verified]
    subject: "Authorizing a Development Agreement with the Sidney City Schools and Upper Valley Career Center Boards of Education regarding the CRA tax abatement"
    in_corpus: true

  - ref: "Res. 82-25"
    adopted: "2025-10-27"                     # [verified]
    subject: "Authorizing an Income Tax Sharing Agreement with the same two boards of education"
    in_corpus: true

  - ref: "Res. 26-26"
    adopted: "2026-04-27"                     # [verified]
    subject: "Authorizing a Water and Wastewater Service Agreement with Amazon Web Services, Inc."
    in_corpus: true

  - ref: "Res. 27-26"
    adopted: "2026-04-27"                     # [verified]
    subject: "Authorizing a Development Agreement with Amazon Web Services, Inc."
    in_corpus: true
    entity_mismatch: >-
      [verified] The resolution authorizes an agreement with Amazon WEB Services, Inc.; the
      agreement it authorizes names Amazon DATA Services, Inc., a Delaware corporation, as
      "Developer" in its own Project Summary and signature block. Both entities are real and both
      appear elsewhere in this record, so this is not a transcription slip in one direction — the
      City legislated one counterparty and executed with another. Not resolved here.

# =============================================================================================
# 2. THE CRA AGREEMENT — Res. 80-25. The abatement instrument.
# =============================================================================================
cra_agreement:
  parties:
    city: "City of Sidney, Ohio"
    company: "Amazon Data Services, Inc., a Delaware corporation"     # [verified]
  effective_date: "2025-10-27"                # [verified]
  approved_by: "Resolution No. 80-25, passed 2025-10-27"              # [verified] — §14
  execution:
    docusign_envelope_id: "BA694CA4-6647-470C-88C2-2A02D605BB64"      # [verified]
    company_signatory: "Hillary Lambert, Authorized Signatory"        # [verified]
    company_date_signed: "2025-11-06"                                 # [verified]
    city_date_signed: null                                            # [open] — handwritten, not legible in the published scan
    document_control_code: "CC 0TH 00444437 2025 TR"                  # [verified] — header stamp on every page
    confidentiality_marking: "AMAZON CONFIDENTIAL"                    # [verified] — footer on every page of the agreement
  statutory_basis: ["R.C. 3735.65-.70", "R.C. 3735.67(A)", "R.C. 3735.671"]

  exemption:
    rate_pct: 100                             # [verified] — §4
    term_years: 30                            # [verified] — §4
    unit: "each Building constructed at the Project Site"             # [verified]
    no_exemption_commences_after_tax_year: 2035                       # [verified] — §4
    no_exemption_extends_beyond_tax_year: 2065                        # [verified] — §4
    project_may_exceed_30_years_overall: true                         # [verified] — §4, per-building clock
    applies_regardless_of_owner: true                                 # [verified] — §4, Company/Affiliate/other
    condition_precedent: >-
      [verified] §34 — the provision of the real property tax exemptions is CONDITIONED upon the
      prior execution of a separate Development Agreement for public infrastructure. That
      Development Agreement is Res. 27-26, authorized six months later on 2026-04-27, so the
      abatement had no operative effect until then.

  project_estimates:                          # [verified] — §1/§2, expressly "good faith estimates" under R.C. 3735.671(B)
    investment_usd: 3000000000
    first_building_operations_by: "2028-12-31"
    jobs_by: "2030-12-31"
    jobs_count: 75
    annual_payroll_usd: 6750000
    baseline_jobs_at_site: 0
    binding: false
    note: >-
      §1 and §2 both state in terms that these estimates "will not limit the amount or term of
      the tax exemptions … or allow the City to compel the Company to make investments" / "to
      create positions". The $3B and the 75 jobs are not covenants; they are the recitals the
      exemption was granted against.

  payments:
    pilot:
      term_years: 14                          # [verified] — §7(a)
      cap_usd: 46000000                       # [verified] — §7(b), "the sum of all PILOTs … will equal no more than $46,000,000"
      schedule_source: "Exhibit E"
      schedule:                               # [verified] — Exhibit E, p. 29
        - {year: 1,  usd: 3333333}
        - {year: 2,  usd: 3333333}
        - {year: 3,  usd: 3333333}
        - {year: 4,  usd: 3333333}
        - {year: 5,  usd: 3333333}
        - {year: 6,  usd: 3333333}
        - {year: 7,  usd: 3333333}
        - {year: 8,  usd: 3333333}
        - {year: 9,  usd: 3333333}
        - {year: 10, usd: 3333333}
        - {year: 11, usd: 3333333}
        - {year: 12, usd: 3333333}
        - {year: 13, usd: 3333333}
        - {year: 14, usd: 2666671}
      first_pilot_due: "the calendar year following the first tax year an exemption applies"  # [verified] — §7(a)
      payable_by: "May 15, on a City invoice delivered at least 60 days earlier"              # [verified] — §7(c)
      cap_mechanism: >-
        [verified] §7(b) — in any tax year where the Company's total payments would exceed 100%
        of the taxes otherwise payable, the PILOT is reduced to that ceiling and the shortfall is
        carried forward into the next year as an "Increased PILOT". The abatement therefore
        cannot make the Company pay more than an unabated taxpayer would.
      city_has_no_duty_to_apply_proceeds: true    # [verified] — §7(e)
    initial_payment:
      usd: 4000000                            # [verified] — §8
      timing: "once, within 90 days of a City invoice, which the City may send any time after the Effective Date"
      note: "Separate from and in addition to the PILOTs. This is the other $4M of the '$50 million'."
    # The Company's whole obligation ($46M PILOT cap + the $4M Initial Payment). It is PAID to
    # the City, which then redistributes half under Res. 81-25 — see
    # `revenue_sharing.development_agreement_with_school_boards.distribution.city_usd` for the
    # City's own $25,000,000 share. Not the same number.
    total_payments_usd: 50000000              # [verified] — Res. 81-25 §1.1

  megaproject:
    tca_authorization_date: "2025-10-08"      # [verified] — CRA Agreement recitals
    instrument: "Sixth Amendment to Tax Credit Agreement, authorized by the Ohio Tax Credit Authority"
    statutory_basis: ["R.C. 122.17(A)(11)", "R.C. 122.17(A)(12)"]
    claim: "the Company's Ohio investment and operations qualify as a 'megaproject' and it as a 'megaproject operator'"
    enforcement_hook: >-
      [verified] §12 — the City may terminate or suspend the exemption for years 16 THROUGH 30
      if the Company neither holds a current Megaproject Certificate nor makes the annual
      certification under §3(b). Years 1-15 carry no such condition.
    in_corpus: false                          # [open] — a state instrument this record does not hold; see `open_items`

  school_district_consent:
    sidney_city_school_district:
      approved_by_resolution_on: "2025-10-08" # [verified] — CRA Agreement recitals, R.C. 3735.671
    upper_valley_career_center:
      basis: "waiver / notice under the CRA Act and R.C. 5709.83; R.C. 5709.82(C)-(D) compliance"  # [verified]

  remedies_and_limits:
    city_sole_remedy_for_material_breach: "terminate, suspend or modify the exemptions (§12)"   # [verified]
    city_sole_remedy_for_unpaid_taxes: "rescission of the Agreement (§6)"                       # [verified]
    clawback_of_paid_pilots: false            # [verified] — no repayment provision exists
    company_may_terminate_at_will: true       # [verified] — §28, any reason or no reason, 30 days' written notice
    parties_barred_from_challenging_validity: true   # [verified] — §20, both the Agreement and the CRA itself
    transfer_freely_permitted_to: "Permitted Transferees — buyers of any part of a Building or the Project Site, Affiliates, and successors"  # [verified] — §17
    jury_trial_waived: true                   # [verified] — §29
    venue: ["S.D. Ohio", "Shelby County Court of Common Pleas"]                                 # [verified] — §29

  public_records_clause:                      # [verified] — §32
    summary: >-
      Before disclosing anything it treats as the Company's "Confidential Information" in
      response to a public-records request, the City must give the Company written notice and a
      copy of the request, and allow the Company at least five business days to either negotiate
      a response with the requester or "pursue, at its sole cost and expense, legal remedies to
      stop the City's release of the requested information."
    exemptions_recited: ["R.C. 718.13", "R.C. 5703.21", "R.C. 149.43(A)(v)", "R.C. 149.45", "R.C. 122.36", "R.C. 1333.61 et seq.", "R.C. 122.75"]
    survives_termination: true
    note: >-
      The materially identical clause appears at §8.17 of the Development Agreement (Res. 27-26),
      which additionally binds the City to continuing compliance with the 2023 NDA. Neither
      clause enlarges any exemption in R.C. 149.43 — both are contractual notice-and-delay
      obligations layered on top of the statute. See `records_posture`.

  project_site_as_described: "+/- 240 acres"  # [verified] — Exhibit A. A fourth acreage figure; see `acreage_figures`.

# =============================================================================================
# 3. WHERE THE MONEY GOES — Res. 81-25 (distribution) and Res. 82-25 (income tax).
# =============================================================================================
revenue_sharing:
  development_agreement_with_school_boards:   # Res. 81-25
    made: "2025-10-27"                        # [verified]
    parties:
      - "City of Sidney, Ohio"
      - "Board of Education of the Sidney City School District, 750 S. Fourth Avenue, Sidney"
      - "Board of Education of the Upper Valley Career Center, 8811 Career Drive, Piqua"
    project_name_used: "Project Rey"          # [verified] — recitals and §6.4. Closes the register's `[open]` on the name "Rey".
    signatories:
      city: "Jon Crusey, City Manager"                       # [verified]
      scsd: "Gregory Snyder, Superintendent"                 # [verified]
      uvcc: "Jason Haak, Superintendent"                     # [verified]
    total_payment_revenue_usd: 50000000       # [verified] — §1.1
    split:
      city_pct: 50
      schools_pct: 50
    distribution:                             # [verified] — Exhibit A
      city_usd: 25000000
      schools_combined_usd: 25000000
      sidney_city_schools_usd: 21220529
      sidney_city_schools_pct_of_school_share: 84.882116
      upper_valley_career_center_usd: 3779471
      upper_valley_career_center_pct_of_school_share: 15.117884
      shape: >-
        The City takes the $4,000,000 Initial Payment up front and 100% of it. Years 1-3 run
        $2,500,000 City / $833,333.33 schools. Years 4-11 run level at $1,666,666.67 each. Year 12
        is the hinge and the two columns part: the City drops to $166,666.64 while the schools stay
        at $1,666,666.67. Years 13-15 the City takes $0 and the schools take $2,500,000. Each
        column sums to $25,000,000; the fifteen annual rows (excluding the up-front payment) sum to
        the $46,000,000 the CRA Agreement caps PILOTs at — over fifteen rows here against that
        agreement's fourteen, which is the discrepancy recorded below.
    consents_and_waivers: >-
      [verified] §3.1 — in consideration of the agreement, SCSD and UVCC each IRREVOCABLY (a)
      approve every exemption grantable under the CRA Agreement, (b) waive the notice
      requirements of R.C. 3735.671, 5709.83 and 5715.27, (c) waive any right to grant approvals
      required by R.C. 3735.671, and (d) waive any defects or irregularities in the
      authorization. The boards contracted away their statutory objection rights for the term.
    entirety_of_compensation: >-
      [verified] §4.2 — this agreement and the Income Tax Sharing Agreement "provide for the
      entirety of the compensation to which the City, the School District, and Upper Valley may
      be entitled" for the exemption.
    term: "the duration of the CRA Agreement"                # [verified] — §5.1
    non_precedent_clause: true                               # [verified] — §6.4

  income_tax_sharing_agreement:               # Res. 82-25
    made: "October 2025"                      # [verified] — the day is blank in the published copy
    statutory_basis: "R.C. 5709.82"
    tax_base: "the City's permanent 1.5% income tax levy, withheld under Codified Ordinances §142.06 from New Employees"   # [verified] — §2
    new_employee_definition: >-
      [verified] §1 — an employee first employed at the Project site who has not been subject to
      the City income tax on income from the Employer, its subsidiaries, affiliates or
      contractors within the previous two years, and who does not replace a non-new employee.
    formula:                                  # [verified] — §4
      step_1: "the City annually calculates 75% of income tax revenues from all New Employees"
      step_2: "the City annually calculates the real property taxes foregone because of the exemption"
      scsd_payment: "the LESSER of step 1 and (step 2 x 85%)"
      uvcc_payment: "step 2 x 15%"
      disbursed: "the second week of May each year"
    ceiling_intent: >-
      [verified] §3 — the districts are to receive "no more than the amount of property tax
      revenues the Project investment would have generated". The agreement is drafted as partial
      compensation with a hard ceiling, not as a share of upside.
    reconciliation_note: >-
      [inference] The two instruments use different school splits for different money: 84.882116
      / 15.117884 for the PILOT distribution (Res. 81-25 Exhibit A) and a flat 85 / 15 for the
      income-tax sharing (Res. 82-25 §4.3). Not contradictory — different bases — but they are
      not the same ratio and should not be quoted interchangeably.

  schedule_term_discrepancy:
    finding: >-
      [verified] The CRA Agreement's PILOT schedule (Exhibit E) runs FOURTEEN years and totals
      $46,000,000. The distribution schedule attached to Res. 81-25 (Exhibit A) lays the same
      $46,000,000 across FIFTEEN years, and its own workspace cells carry "Total $50,000,000 /
      Per Year $3,333,333.33" — i.e. it was modelled as $50M over 15 years, then reconciled to
      the columns by tapering Year 12 and zeroing the City in Years 13-15.
    status: "[open]"
    why_it_matters: >-
      The binding cap is the CRA Agreement's: no more than $46,000,000 of PILOTs, over a 14-year
      term measured from the first exemption year. The distribution schedule's fifteenth row has
      no PILOT behind it in the CRA Agreement. Which document governs the final year has not been
      resolved from the record and is not resolved here.

# =============================================================================================
# 4. WATER AND WASTEWATER — Res. 26-26. The instrument that finally states a sewer number.
# =============================================================================================
water_and_wastewater_service_agreement:
  parties:
    aws: "Amazon Web Services, Inc., a Delaware corporation, 410 Terry Avenue North, Seattle"
    provider: "City of Sidney, Ohio — Jon Crusey, City Manager"
  version_marking: "Execution Version"        # [verified]
  term:
    initial_years: 10                         # [verified] — §3.1
    renewal: "automatic successive one-year periods"
    aws_termination: "at any time on 90 days' written notice"                       # [verified] — §3.2
    city_termination: "90 days' notice, but only after 3 years AND 12 consecutive months of ceased operations"   # [verified] — §3.2

  reserved_capacity:                          # [verified] — §1.1
    cooling_water:
      max_mgd: 1.0
      max_rate_gpm: 694
      projected_annual_gallons: 4600000
    fire_flow:
      min_gpm: 1818
      min_psi: 20
    potable_water:
      max_gpd: 14000
    sewer_discharge:
      max_gpd: 390493
      max_rate_gpm: 716
      flow_type: "gravity"
      projected_annual_gallons: 1160000

  impact_fees:                                # [verified] — §2.2 + Schedule 1
    principle: >-
      AWS pays the ordinary metered rate for what it uses AND a monthly reserve-capacity impact
      fee on the UNUSED portion of its reservation, priced at the reserved fraction of the
      standard rate. The stated rationale is the cost of maintaining held-back capacity, the
      lost revenue when usage falls below the reservation, and the lost opportunity to sell that
      capacity to another customer.
    water:
      reserved_fraction_pct: 14.3             # 1.0 MGD of the system's 7 MGD
      standard_rate_usd_per_ccf: 7.23
      capacity_fee_rate_usd_per_ccf: 1.033
    sewer:
      reserved_fraction_pct: 5.60             # 0.390493 MGD of the system's 7 MGD
      standard_rate_usd_per_ccf: 4.11
      capacity_fee_rate_usd_per_ccf: 0.230
    reopener: "every three years from the third anniversary of build-out completion, proportionate to actual burden and to any City capacity upgrades"   # [verified] — §2.2
    fractions_are_fixed: true                 # [verified] — the percentages are fixed; the dollar rates track the City's ordinance rates

  rate_class_covenant: >-
    [verified] §2.1 — "During the Term of this Agreement, Provider shall not take steps to create
    a separate class of water or sewer rates for data centers or similar high level, but highly
    variable, users of water and sewer services." For ten years the City has contracted away its
    ability to put this customer, or any customer like it, into its own municipal rate class.
    Note the contrast with the electric side of the same campus, where AES Ohio's PUCO
    stipulation of 2026-07-21 is reported to CREATE a data-center tariff.

  substitute_supply_right: >-
    [verified] §1.5 — if the City for any reason does not supply sufficient water or sewer
    service, AWS "may secure its own substitute services", and the City must on request provide
    access to its infrastructure to obtain them. The City's FAQ statement that "no onsite wells
    will be used" is a present-tense description, not a contractual bar.

  regulatory_passthrough: >-
    [verified] §6.2 — fines, damages or penalties assessed by a regulator against the City that
    directly result from AWS consuming or discharging above the §1.2 maxima are direct damages
    reimbursable by AWS on a pass-through basis.

  city_capacity_context:                      # [verified] — the 2026-04-27 staff presentation
    water_plant_design_mgd: 7.0
    water_2025_avg_daily_demand_mgd: 3.1
    water_remaining_before_reservation_mgd: 3.9
    water_remaining_after_reservation_mgd: 2.9
    water_ohio_epa_approved_pumping_mgd: 14.0
    wwtp_design_mgd: 7.0
    wwtp_2025_avg_daily_flow_mgd: 4.6
    wwtp_remaining_before_reservation_mgd: 2.4
    wwtp_remaining_after_reservation_mgd: 2.0

  derived:
    - claim: "The cooling loop runs at roughly four cycles of concentration."
      value: 3.97
      tag: "[inference]"
      basis: >-
        Projected makeup 4,600,000 gal/yr divided by projected blowdown 1,160,000 gal/yr
        (both [verified], §1.1.1 and §1.1.4). A makeup-to-blowdown ratio near 4 is the signature
        of a closed-loop evaporative cooling tower, and the City's own presentation names
        "cooling tower discharges" in terms. This is the first documentary handle on this
        campus's cooling design, which the profile still carries as UNKNOWN.
    - claim: "Projected consumptive loss is 3,440,000 gallons per year, not 4,600,000."
      value_gal_per_year: 3440000
      tag: "[inference]"
      basis: >-
        Makeup 4,600,000 minus discharge 1,160,000. The register described the 4,600,000 figure
        as "projected cooling-water consumption"; the agreement calls it the annual cooling water
        VOLUME, i.e. the withdrawal, and books the return separately. Consumption is the
        difference. In cfs: 0.0146, against the cited regulatory Great Miami 7Q10 of 24.0 cfs
        that is 0.061% — not the 0.08% the register carried.
    - claim: "The reservation takes about a quarter of the City's remaining water headroom."
      value_pct: 25.6
      tag: "[inference]"
      basis: "1.0 MGD of the ~3.9 MGD the City states as remaining treatment capacity."
    - claim: "The reservation takes about a sixth of the City's remaining sewer headroom."
      value_pct: 16.3
      tag: "[inference]"
      basis: "0.390493 MGD of the ~2.4 MGD the City states as remaining treatment capacity."

