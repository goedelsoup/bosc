# =============================================================================================
# 9. RECORDS POSTURE — what this set says about getting the rest of it.
# =============================================================================================
records_posture:
  redactions_in_the_published_development_agreement:
    what: "sewer line size, manhole count and linear footage (Art. 1 'Replacement Sewer Improvements'); water service line size and location (Art. 1 'Developer Water Improvements'); and the ENTIRE Exhibit D water service exhibit (p. 30), blacked out edge to edge"
    exempting_statute_cited: "ORC 149.433"    # [verified] — hand-written in blue ink beside each redaction on the City's published copy, read from the page image (the OCR text layer garbles it)
    tag: "[verified]"
    note: >-
      R.C. 149.433 exempts security and infrastructure records. The City applied it to utility
      dimensions inside an executed development agreement, and to a whole exhibit — the water
      service exhibit survives only as its title, its scale bar (1 inch = 150 feet) and stray
      linework. Whether that application is sound is not assessed here. What is recorded is that
      the redactions exist, what they cover, and which statute the City wrote beside them.
  contractual_layer:
    tag: "[verified]"
    clauses:
      - "CRA Agreement §32 — notice to the Company + at least 5 business days before any disclosure"
      - "Development Agreement §8.17 — the same, plus continuing compliance with the 2023-12-19 NDA"
  city_posted_the_ag_exemptions_chart:
    what: "The Ohio Attorney General's 'Statutory Provisions Exempting Records from the Ohio Public Records Act' chart is published on the City's data-center FAQ page itself"
    url: "https://www.sidneyoh.com/DocumentCenter/View/4586/Statutory-Exemptions---Public-Records-PDF"
    tag: "[verified]"
    in_corpus: false
    why_not: >-
      It is the Attorney General's statewide chart, not a Sidney instrument, and committing it
      would put 39 pages of general Ohio law into a site corpus. Its presence ON the FAQ is the
      fact worth recording, and it is recorded here.
  implication: >-
    [inference] A records request to the City for anything in this project should expect a
    five-business-day contractual delay while the company is noticed, and should anticipate
    R.C. 149.433 asserted over utility and site-infrastructure detail. Requests are best framed
    to the instrument or the approval, not to the engineering drawing.

