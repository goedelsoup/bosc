# Sidney "Sidney Data Center Campus" / Project Rey — the incentive, service and development
# instruments (structured record)
#
# What the City of Sidney actually signed for the Amazon campus, read from the City's own
# published legislative record:
#   data/documents/sidney/council/   (five resolutions, each carrying its executed agreement)
#   data/documents/sidney/permits/   (the City grading permit)
# issue 1380 · sub-issue of issue 1275 · strengthens `record`.
#
# THE HEADLINE, so it is not mis-read downstream: the "$50 million PILOT over 15 years, $25M to
# the City and $25M to Sidney City Schools" that this register and the trade press both carried is
# three things at once, and only one of them is a PILOT. The CRA Agreement caps PILOTs at
# $46,000,000 over FOURTEEN years (§7(b), Exhibit E) and separately obliges a one-time $4,000,000
# Initial Payment (§8). The $50,000,000 total is then split 50/50 City/schools by a DIFFERENT
# instrument (Res. 81-25) — and the schools' half is not the schools' half: Upper Valley Career
# Center takes $3,779,471 of it, leaving Sidney City Schools $21,220,529, not $25,000,000.
#
# TAG VOCABULARY (per CLAUDE.md / evidentiary-discipline):
#   [verified]  — read from the executed instrument or the adopting resolution: agreement text,
#                 exhibit text, recitals, the City's own staff arithmetic presented in open
#                 session, and a signature block read from the document's own bytes.
#   [reference] — a party's account of its own conduct (the City FAQ, a press release), or a
#                 statute read through a fetched page.
#   [inference] — arithmetic this record derives by combining cited figures (the cycles of
#                 concentration back-solved from makeup and blowdown; the headroom shares).
#   [open]      — not in corpus (the recorded deeds; the Ohio SOS
#                 registrations; the approved site plan; the redacted infrastructure details).

