      Resolution 84-22, adopted 2022-10-10, ESTABLISHED the City-Wide CRA (ODOD #149-72424-06);
      Resolution 69-25, adopted 2025-09-08, EXPANDED it (#149-72424-06A) and added the thirty-year
      megaproject tier its §4 had never carried; the abatement agreement is Res. 80-25, 2025-10-27
    source: "Res. 84-22 and Res. 69-25 themselves (#1998) — not their recitals"
    note: >-
      Three readings, each closer to the source than the last. A recital is a party's account of
      another instrument, and this one was accurate about the number and the date while wrong
      about the ACT.
  - field: "PILOT"
    was: "$50 million total over 15 years — $25 million to City of Sidney, $25 million to Sidney City Schools — [verified]"
    now: >-
      PILOTs are capped at $46,000,000 over 14 years (CRA Agreement §7(b), Exhibit E); a separate
      one-time $4,000,000 Initial Payment (§8) brings Total Payments to $50,000,000; that total
      is split 50/50 City/schools by Res. 81-25, and the schools' $25,000,000 divides
      $21,220,529 to Sidney City Schools and $3,779,471 to Upper Valley Career Center
    source: "CRA Agreement §7-§8 + Exhibit E; Res. 81-25 §1.1, §2.1 + Exhibit A"
  - field: "NDA"
    was: "executed mid-2025 between Sidney City Council and AWS prior to public announcement — [verified], sourced to stopohiodatacenters.org"
    now: "dated 2023-12-19, executed by the City for the benefit of Developer and its Affiliates, and still operative"
    source: "Development Agreement Project Summary; §8.17"
  - field: "projected cooling-water consumption"
    was: "4.6 million gallons per year (~12,600 GPD average) — [verified]"
    now: >-
      4,600,000 gal/yr is the projected annual WITHDRAWAL; 1,160,000 gal/yr returns to the
      sanitary sewer; consumption is the 3,440,000 gal/yr difference (~9,425 GPD, 0.0146 cfs,
      0.061% of the cited 24.0 cfs 7Q10)
    source: "Water and Wastewater Service Agreement §1.1.1 and §1.1.4"
  - field: "grading permit date"
    was: "issued 2026-05-14 — [verified], sourced to sidneyoh.com/526"
    now: "2026-05-15, from the permit's own signature block; 5-14-2026 is the City's filename, which is not evidence of a date"
    source: "data/documents/sidney/permits/"
  - field: "the name 'Rey'"
    was: "appears once in a resident's question on the City FAQ … corroborated by nothing else — [open]"
    now: "'Project Rey' is the project name in the City's OWN executed Development Agreement with the two school boards, used in the recitals and again in the non-precedent clause — [verified]"
    source: "Res. 81-25, recitals and §6.4"
  - field: "campus sewer discharge"
