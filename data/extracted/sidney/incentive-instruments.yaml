    tag: "[closed]"
    closed: "2026-08-13"                      # #1998
    resolution: >-
      PULLED AND READ. Source bytes:
      "data/documents/sidney/council/69-25 - Amending Resolution 84-22 - Expanding CRA Boundaries.pdf".
      Extraction:
      "data/extracted/sidney/council/2025-09-08-res-69-25-cra-expansion-and-megaproject-tier.resolution.yaml".
      ⚠️ Both paths are on their own unbroken line ON PURPOSE. A `>-` folded scalar turns every line
      break into a space, so a wrap falling INSIDE a filename publishes a path with a space in it —
      one that resolves to nothing. An earlier draft of this entry did exactly that and shipped the
      dead path into the records feed, where the citation layer lifts `data/…` strings out of prose.
      The malformed string is deliberately not reproduced here, because writing it out would put it
      back in the feed. Never let a fold fall inside a path.
      Committed together with Res. 84-22, which it amends and which is the act that actually
      established the CRA. Reading it CORRECTED this register: 69-25 expands, it does not
      designate.
    how: >-
      The three-step route was: this item's own 2026-08-11 correction (the 403 is an HTTP/2
      fingerprint, not a host block) -> `curl --http1.1` -> /meta/docfolder?containerId= on the
      Resolutions container, which returns 51 year folders and every document in them. The whole
      pull took minutes. The R.C. 149.43 request drafted for this resolution was never sent and
      should not be.
    lesson: >-
      ⚠️ This corpus recorded "blocked" for this host in five artifacts and two drafted public-
      records requests before anyone retried the request over HTTP/1.1. A 403 to a scripted client
      may be a protocol-fingerprint block. Retry before recording a route negative.
