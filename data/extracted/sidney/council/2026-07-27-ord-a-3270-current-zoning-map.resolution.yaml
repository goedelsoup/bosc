    from: '2025-03-10'
    to: '2026-06-08'
    verbatim: 'the rezoning, annexation~ or detachment ordinances from March 10, 2025, to June 8, 2026'
    why_it_matters: >-
      [verified] This window CONTAINS A-3226 (2025-07-28) and A-3227, where its predecessor A-3210's
      window ("July 25, 2022, to January 13, 2025") did not. The campus was never unzoned; the
      official map simply ended before the event, and this is the first map that could show it.
    transcription_note: 'The tilde in "annexation~" is a scan artifact, preserved.'

