# City of Sidney Council, 2026-07-27 — Ordinance A-3270, adopting the current official zoning map.
# Issue #1998, epic #1275.
#
# The half of the GIS story its predecessor could not tell. A-3210 (2025-02-24) explains why the
# City's published layer could not show the campus's zoning: its declared window ends 2025-01-13,
# five and a half months before A-3226 zoned it. THIS is the first official map whose window
# contains that ordinance.
#
# TAG VOCABULARY: [verified] = read off the ordinance's own text layer; [open] = not established.

