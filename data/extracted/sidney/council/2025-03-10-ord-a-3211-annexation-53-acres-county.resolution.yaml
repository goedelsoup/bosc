    cited: R.C. 709.16
    verbatim: >-
      The undersigned petitioner, the Council of the City Sidney, Shelby County, Ohio (the
      "Petitioner") … hereby petitions to annex the Territory … pursuant to Ohio Revised Code
      Section 709.16, said actions being authorized by Ordinance No. A-3211 .
    ⚠️_the_contrast: >-
      [verified] THE CITY COUNCIL IS ITSELF THE PETITIONER here. On the campus annexation (A-3225)
      the City merely ACCEPTED, cited no R.C. 709 provision at all, and rested on a Clinton Township
      Annexation Agreement not in this corpus. Two annexations, five months apart, same Council,
      opposite postures. ⚠️ What R.C. 709.16 provides is outside these documents and is not asserted.

  emergency_clause:
    tag: verified
    verbatim: >-
      SECTION 3. That it is hereby determined to be an emergency measure, necessary to protect the
      health, safety, and well-being of the citizens as it is imperative to meet the necessity of
      expeditiously meeting the deadline for the next meeting of the Shelby County Board of
      Commissioners.
    note: >-
      [verified] The only emergency declaration among the four land ordinances. An emergency removes
      the referendum window. ⚠️ The boilerplate recites health and safety; THE STATED REASON IS A
      CALENDAR. Record the gap between the two rather than either alone.

