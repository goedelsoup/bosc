# City of Sidney Council, 2025-09-08 — Resolution No. 69-25, expanding the City-Wide Community
# Reinvestment Area and adding a thirty-year megaproject exemption tier. Issue #1998, epic #1275.
#
# THE INSTRUMENT THE CORPUS HAS BEEN CITING THROUGH RECITALS SINCE #1380. #2003 authored five
# council resolutions and deliberately did NOT scaffold a sixth: "Res. 69-25 is absent — FIVE
# files, not six. The CRA designating legislation is known only through recitals; the City doesn't
# publish it. Scaffolding a sixth would assert an unread instrument." That was the right call, and
# the premise was wrong on one word: the City DOES publish it, on a portal this corpus had
# recorded as blocked. See the second-route block in
# `data/documents/sidney/council/filename-map.yaml`.
#
# ⚠️ READ FIRST — TWO THINGS THE CORPUS HAD WRONG, both now read off the instrument itself.
#
#   1. 69-25 IS NOT THE DESIGNATING ACT. Its own second recital: "this City Council, by Resolution
#      84-22 adopted on October 10, 2022, created and established the Sidney City-Wide Community
#      Reinvestment Area, which was assigned designation #149-72424-06 by the Director of the Ohio
#      Department of Development". 69-25 EXPANDS that area and AMENDS that resolution. The
#      register's "#149-72424-06A, effective 2025-09-19" is the expansion's number — the "A"
#      suffix was the clue, and the two reconcile rather than conflict. 84-22 is committed
#      alongside this file.
#
#   2. THE THIRTY-YEAR TERM DID NOT EXIST BEFORE THIS RESOLUTION. Res. 84-22 §4 as adopted ends at
#      clause (d): fifteen years for new commercial and industrial construction. This resolution
#      restates §4 in its entirety and adds clause (e) — up to thirty years, up to 100%, for a
#      megaproject under R.C. 122.17(A)(12). Seven weeks later Res. 80-25 authorized a CRA
#      Agreement carrying a 30-year / 100% exemption. The SEQUENCE is [verified] from two
#      instruments and the minutes of both meetings. The CAUSATION is not: this resolution names
#      no project, no company and no parcel, and its stated reason is the recent annexations.
#      Write the sequence; do not write the motive.
#
# TAG VOCABULARY (per CLAUDE.md / evidentiary-discipline):
#   [verified]  — printed on the City's own RECORD OF ORDINANCES page, or recorded in the approved
#                 minutes of the meeting that adopted it.
#   [inference] — reasoned from [verified] facts, labelled.
#   [open]      — not established by this instrument.

