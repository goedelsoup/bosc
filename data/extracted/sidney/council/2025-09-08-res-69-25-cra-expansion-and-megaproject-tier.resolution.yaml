  # ------------------------------------------------------------------------------------------
  # WHAT IT DOES — the operative sections, quoted where they carry a figure or a condition.
  # ------------------------------------------------------------------------------------------
  expansion:
    verbatim: >-
      SECTION 2. Pursuant to Section 3735.66 of the CRA Act, the City-Wide CRA is hereby amended
      and expanded to include the Expanded Area.
    effect: >-
      [verified] The expansion is stated in §1 to leave the City-Wide CRA "having boundaries which
      are currently coterminous with the City". The Expanded Area is described and depicted on the
      instrument's Exhibit A (pp. 7-18), which is image-only and NOT read here.
    what_the_minutes_add: >-
      [verified] Community Development Director Barbara Dulworth told Council the expansion
      "would extend the city Community Reinvestment Area (CRA) boundaries to incorporate the
      recent annexations, including the 243.092 acres on the north side of Millcreek Road, west of
      Vandemark Road and the 53.16 acres of land west of Vandemark Road, south of Fair Road."
      Source: data/documents/sidney/council/City Council Minutes September 08, 2025.pdf p. 2.
    note: >-
      [inference] "The north side of Millcreek Road, west of Vandemark Road" is the same locator
      the Res. 80-25 recitals use for the Amazon Data Services project site. The minutes do not
      join the two, and this resolution names no project; recorded as a locator match, not a
      finding.

  megaproject_tier:
    tag: verified
    new_in_this_resolution: true
    journal_page: '0300'
    verbatim: >-
      (e) Up to thirty (30) years, and up to one hundred percent (100%) if the commercial or
      industrial structure is situated on the site of a megaproject and is owned and occupied by a
      megaproject operator (as such terms are defined in Ohio Revised Code Section 122.17(A)(12)),
      or is not situated on the site of a megaproject but is owned and occupied by a megaproject
      supplier that meets the requirements described in Ohio Revised Code Section 122.17(A)(13)(b)
    ceiling_before_this_resolution: >-
      [verified] Res. 84-22 §4 as adopted ran (a) through (d) and stopped at FIFTEEN years / 100%
      for new commercial and industrial construction. It contains no thirty-year tier and no
      reference to R.C. 122.17.
    thresholds_as_stated_to_council: >-
      [verified] "large-scale development project meeting specific investment or payroll
      thresholds, such as at least $1 billion in capital investment or creating $75 million in
      annual payroll. She noted that the Ohio Department of Development (ODOD) was responsible for
      certifying megaprojects." — the minutes of this meeting, p. 2. These are STAFF'S
      characterisation of R.C. 122.17(A)(12); the statute itself is not quoted in the instrument.
    downstream: >-
      [verified] Res. 80-25 (2025-10-27) authorized a CRA Agreement whose exemption is 30 years at
      100%. [verified] The minutes of THAT meeting recite this resolution as the authority: "Per
      the Ohio Revised Code, and the recently adopted revised Sidney City-Wide CRA, property tax
      abatements for up to 30 years can be approved for megaprojects or megaproject operators."
    what_is_still_open: >-
      [open] Whether the Ohio Department of Development has in fact DESIGNATED this campus a
      megaproject. The 2025-10-27 minutes say only that the project "meets the requirements to be
      designated" — eligibility asserted by staff, in the present tense, not a designation stated
      as made. No ODOD certification is in the corpus.

  monitoring_fee:
    tag: verified
    journal_page: '0301'
    verbatim: >-
      SECTION 5. An annual monitoring fee to the City of Sidney of one percent (1%) of the amount
      of the incentives, or a minimum of Five Hundred Dollars ($500.00), up to a maximum of
      Twenty-five Hundred Dollars ($2,500.00) annually is required for commercial and industrial
      projects.
    note: >-
      [verified] The fee is 1% of the incentives but CAPPED AT $2,500 a year. Recorded because the
      cap is a fact about the instrument, not an argument: it is what the City charges to
      administer an exemption of any size, including a thirty-year one.

  other_sections:
    - '[verified] §3 — all residential, commercial and industrial properties in the Expanded Area, consistent with applicable zoning, are eligible.'
    - '[verified] §6 — "Except as amended hereby, Resolution 84-22 shall remain in full force and effect."'
    - '[verified] §7 — a copy of the Resolution goes to the Shelby County Auditor, sent by the Community Development Director.'
