  title_verbatim: >-
    A RESOLUTION AUTHORIZING THE EXPANSION OF THE CITY'S SIDNEY CITY-WIDE COMMUNITY REINVESTMENT
    AREA AND AMENDING RESOLUTION 84-22
  outcome: approved
