      Councilmember Roddy made a motion to adopt Resolution No. 69-25 as presented; seconded by
      Councilmember VanMatre. Upon a roll call vote, the motion passed unanimously. Resolution No.
      69-25 is hereby adopted.
    moved_by: Councilmember Scott Roddy
    seconded_by: Councilmember Jenny VanMatre
    result: passed unanimously
    source:
      file: data/documents/sidney/council/City Council Minutes September 08, 2025.pdf
      pages: '2-3'                            # 0-based
    note: >-
      [verified] A roll call WAS taken; the minutes record its outcome and not its individual
      votes. That is the form of these minutes for an uncontested item — contrast Res. 82-25 on
      2025-10-27, where the same clerk journalled seven names because the vote was divided.
    deliberation: >-
      [verified] "There were no questions or comments on this topic." Recorded verbatim because it
      is the whole of the public deliberation on the clause that created the thirty-year tier.

  what_this_instrument_does_not_establish:
    - >-
      IT NAMES NO PROJECT, NO COMPANY AND NO PARCEL. Every word about Amazon, the campus or the
      data center in this file comes from the MINUTES or from a later instrument, and is labelled
      as such. A reader must not cite this resolution for the campus.
    - >-
      THE EXPANDED AREA IS NOT READ. Exhibit A (pp. 7-18) is the boundary map and legal
      description, and it is image-only. The two annexation acreages above are the minutes'
      account of it, not a reading of the exhibit. [open]
    - >-
      IT GRANTS NOTHING. §4 sets ceilings to be "negotiated on a case-by-case basis in advance of
      construction"; the grant is the CRA Agreement, authorized separately by Res. 80-25.
