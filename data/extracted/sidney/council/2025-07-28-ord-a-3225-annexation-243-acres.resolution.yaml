# City of Sidney Council, 2025-07-28 — Ordinance A-3225, accepting the annexation of 243.092 acres
# from Clinton Township. Issue #1998, epic #1275.
#
# The act that brought the campus ground into the City, passed the same night as the ordinance that
# zoned it IIM (A-3226, its sibling in this directory). Read together they are the land's legal
# entry into Sidney; read apart, neither is complete.
#
# ⚠️ THE INTERESTING THING IS WHAT IT DOES NOT CITE. A regex over the whole instrument returns
# exactly ONE Revised Code citation — 121.22, the open-meetings finding every Sidney act carries.
# There is NO R.C. 709 provision anywhere in it. Its stated authority is instead a contract: "the
# Annexation Agreement entered between the City of Sidney and Board of Township Trustees of Clinton
# Township … on or about March 24, 2025" — an instrument that is NOT in this corpus. So the
# EXPEDITED ANNEXATION TYPE stays `[open]`, and that agreement is a new, named thing to pull.
#   Contrast the City's own companion annexation of the 53-acre county tract five months earlier
#   (A-3211), which names R.C. 709.16 in terms, attaches its petition, and declares an emergency.
#   The same Council drafted both.
#
# TAG VOCABULARY: [verified] = read off this ordinance's own text layer; [inference] = reasoned
# from [verified] facts, labelled; [open] = not established here.

