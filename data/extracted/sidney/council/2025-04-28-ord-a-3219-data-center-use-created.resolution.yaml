    ⚠️_it_names_nothing: >-
      A-3219 names no project, no company and no parcel — and a Commission member asked on the
      record why the category was needed at all (see `deliberation`). Whether it was drafted with
      this campus in view is [open]. The chronology is a fact; the motive is not in any document
      read here.

  deliberation:
    tag: verified
    source:
      file: data/documents/sidney/planning-commission/Planning Commission Minutes March 17, 2025.pdf
      case: PZCA2025-0002
    the_question: >-
      A. Sakhalkar asked for clarification on why the proposed code is specifically calling out data
      centers when the code currently lists warehouse- small format and large format; noting that a
      data center should fall under one of those existing uses.
    the_answer: >-
      T. Hurysz replied that the city is being inclusive to different types of uses that may or may
      not come into the city. Data Centers was not a specific use listed before, but the proposal is
      to add it. He also noted that the terms for warehouses- small and large format pertains to the
      literal storage of physical goods and materials. Since a data center stores information, staff
      feels the distinction needs to be added.
    note: >-
      [verified] This is the only recorded deliberation on why Sidney created a data-center use, and
      it names no project. The Commission recommended the amendments; Council adopted them six weeks
      later.

  subsequent_amendments:
    tag: verified
    finding: >-
      SIDNEY HAS NOT REVISITED THE USE SINCE. The two later zoning-code amendments in the City's
      Ordinances container — A-3236 (2025-09-22) and A-3255 (2026-02-23) — carry ZERO mentions of
