# City of Sidney Council, 2025-04-28 — Ordinance A-3219, the zoning-code amendment that created
# the "Warehouse – Data Center" use. Issue #1998, epic #1275.
#
# THIS IS THE INSTRUMENT THAT MADE A DATA CENTER A THING SIDNEY'S CODE RECOGNISES — and it made it
# a use permitted BY RIGHT, in one district only, three months before the campus was zoned into
# that district and six months before the CRA agreement was signed.
#
# ⚠️ A BRIEFED NEGATIVE THAT WAS WRONG. When this research was commissioned, the corpus's working
# assumption was that Van Wert was the network's example of a city writing "data center" into its
# code — Ord. 26-05-029, May 2026 — and that Sidney had not. Sidney did it FIRST, by about twelve
# and a half months. Two sequences; write both, and do not write a race between them.
#
# ⚠️ WHAT FOLLOWS FROM "PERMITTED BY RIGHT". A P in the use table means no conditional-use permit,
# no variance and no Board of Zoning Appeals hearing is required for a data center in the IIM zone.
# That is why no BZA or Planning Commission record of a data-center APPROVAL exists to look for —
# the absence is structural, not a gap in the corpus, and it must never be reported as one.
#
# TAG VOCABULARY: [verified] = read off this ordinance's own text layer or a page render, as stated
# per claim; [inference] = reasoned from [verified] facts, labelled; [open] = not established here.

