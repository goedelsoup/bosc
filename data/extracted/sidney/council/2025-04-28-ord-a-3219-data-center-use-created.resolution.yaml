  definition:
    tag: verified
    read: text-layer
    locator: 'Exhibit A, GLOSSARY – USES, letter w (sheet foot "SIDNEY, OHIO ZONING CODE 145")'
    verbatim: >-
      Warehouse — Data Center. A facility used for the remote storage, processing, or distribution
      of large amounts of data that is greater than 50,000 square feet.
    transcription_note: >-
      The text layer inserts a stray apostrophe ("A 'facility used"); an independent 300-DPI render
      has none, so it is an extraction artifact and is excluded from the quotation.
    is_new: >-
      [verified] The whole definition is rendered in RED UNDERLINE, and the exhibit's own legend
      reads "Red Underline = NEW / Red Strike Through = REMOVE". The ordinance is the adding
      instrument on its own face.
    ⚠️_the_floor:
      threshold_sq_ft: 50000
      note: >-
        A data facility of 50,000 sq ft or LESS is not a "Warehouse – Data Center" under this code,
        and no other listed use covers it. What such a facility would be permitted as, and where,
        is [open].

  permitted_use:
    tag: verified
    read: 300-dpi page render (the cell is illegible in the text layer)
    locator: 'Exhibit A, Chapter 1103 use table, p.2 (sheet foot "SIDNEY, OHIO ZONING CODE 22 UPDATED THROUGH NOVEMBER 25, 2024")'
    finding: >-
      The row "Warehouse – Data Center" carries a single entry — P, permitted by right — in the
      "Industry/ Innov./Manuf. Zone (IIM)" column. All eight other district columns on that row are
      BLANK.
    districts_on_the_table: [R-1, R-2, R-3, CC, NC, HC, IIM, CSD, TND]
    both_marked_new: >-
      [verified] The row label AND the P are both in red underline, i.e. NEW under the exhibit's own
      legend.
    how_the_column_was_identified: >-
      Against the rendered header band, and cross-checked against the P's of "Warehouse - Large
      Format", "Storage - Contractor" and "Storage - Commercial Gases", which sit in the same
      column. ⚠️ The column was NOT inferred from the filename or from the ordinance title.
    consequence: >-
      [inference], and the reasoning is the code's own scheme: a P is by-right, so a data center in
      the IIM zone requires no conditional-use permit, no variance and no BZA hearing. This is why
      there is no BZA or Planning Commission record of a data-center approval to find. Report it as
      a structural absence, never as a corpus gap.

  the_sequence:
    tag: verified
    note: >-
      Every date below is content-verified from the instrument's own passage clause, so the ORDER is
      solid. What it means is not asserted.
    entries:
      - {date: '2025-04-28', event: 'A-3219 creates the "Warehouse – Data Center" use, P by right in IIM only'}
