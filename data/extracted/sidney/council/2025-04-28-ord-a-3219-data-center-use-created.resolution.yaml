  cross_site:
    tag: verified
    note: >-
      Van Wert wrote "Data Center" into its own code by Ord. 26-05-029 on 2026-05-11, alongside the
      annexation and zoning of ITS campus the same night. Sidney's definition precedes Van Wert's by
      about twelve and a half months, and Sidney's definition precedes its own campus zoning by
      three. TWO SEQUENCES, WRITTEN SEPARATELY. Nothing here supports a claim that either city was
      responding to the other. See data/extracted/van-wert/council/.
    ⚠️_the_briefed_negative: >-
      The research that produced this file was briefed with Van Wert as the network's example and
      the implication that Sidney had none. That was wrong, and it is recorded here so the next
      reader does not inherit it.

