  what_this_instrument_does_not_establish:
    - >-
      ANY CONNECTION TO THE CAMPUS. It names no project, no company and no parcel, and predates the
      campus's annexation by three months.
    - >-
      WHAT A DATA CENTER MAY DO once permitted. The use table grants the use; operating conditions —
      noise, water, generators, hours — are elsewhere in the code or nowhere, and this ordinance
      imposes none. ⚠️ Contrast Van Wert, whose conditional-zoning ordinance carried a landscape
      mound and nothing else: neither city attached operating conditions to a data center.
    - >-
      COVERAGE BELOW 50,000 SQ FT. See `definition.⚠️_the_floor`.
