# City of Sidney Council, 2022-10-10 — Resolution No. 84-22, establishing the City-Wide Community
# Reinvestment Area. Issue #1998, epic #1275.
#
# WHY A 2022 RESOLUTION IS IN A 2025 DATA-CENTER RECORD. The corpus attributed the CRA designation
# to Res. 69-25 (2025-09-08), on the strength of two later instruments' recitals — and #1380
# recorded that as a CORRECTION to an earlier error ("Resolution 18-25, October 2025"). Read
# directly, 69-25 amends and expands; the designation is here, three years earlier. This file is
# committed so the chain is complete and so the thirty-year exemption has a legible before-state:
# §4 of THIS resolution stops at fifteen years, and clause (e) — the megaproject tier the Amazon
# agreement uses — did not exist until 69-25 added it.
#
# ⚠️ It names no project and no company. It is the general municipal program the campus's
# agreement was later negotiated under, and nothing more.
#
# TAG VOCABULARY: [verified] = printed on the City's own RECORD OF ORDINANCES page;
# [inference] = reasoned from [verified] facts, labelled; [open] = not established here.

