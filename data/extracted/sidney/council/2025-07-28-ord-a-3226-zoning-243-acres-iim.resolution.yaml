    transcription_note: >-
      Journal-scan artifacts preserved: "ofland" for "of land", "Nwnber" for "Number", "Maiy" for
      "Mary", "23 88" for "2388". ⚠️ Parcel 1's suffix reads `.IXIl` in the text layer. That it is
      `.001` is `[inference]` — the legible prefix, the fact that it is the only unmatched
      predecessor, and the `2388 Millcreek Rd.` situs the corpus already carries. Recorded as a
      garble, NOT normalised.
    joins_the_corpus:
      tag: verified
      note: >-
        Four of the five match the predecessor tracts the corpus already recites, digit for digit;
        the fifth by prefix. THE JOIN IS PARCEL IDENTITY, ABUTTERS AND SITUS — not acreage. An
        acreage match alone would not establish that this ordinance is about this campus.
    ⚠️_no_role_word:
      tag: verified
      finding: >-
        The ordinance uses NO role word for any of the five persons — not "owner", not "petitioner",
        not "grantor", not "applicant", not "agent". The same sentence writes "owned by" for the
        two ABUTTERS (John A. Clark Jr., Bridget Douglas). The drafter had the word and did not use
        it here.
      why_it_matters: >-
        These names are the closest this corpus has come to the deed grantors, and they are NOT
        established as grantors by this document. The Planning Commission's own case caption gives
        the annexation petitioner as a fourth person entirely — JACKSON B. REYNOLDS — in a capacity
        that record does not state. The grantors stay `[open]` until the Recorder deeds are pulled.

