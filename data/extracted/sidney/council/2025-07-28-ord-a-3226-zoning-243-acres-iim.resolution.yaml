# City of Sidney Council, 2025-07-28 — Ordinance A-3226, zoning the annexed 243.092 acres
# IIM (Industry / Innovation / Manufacturing). Issue #1998, epic #1275.
#
# THIS INSTRUMENT CLOSES THE CORPUS'S ZONING `[open]`. Since onboarding, Sidney's campus zoning has
# been unanswerable: the City's published GIS layer does not show it, and #1379 recorded that as a
# currency hole rather than as an absence of zoning. Both readings were right, and A-3210 says why
# in its own recitals — the official map in force incorporates ordinances only "from July 25, 2022,
# to January 13, 2025", a window that closes five and a half months BEFORE this ordinance. The
# campus was never unzoned. The map was never current.
#
# ⚠️ AND READ THE SEQUENCE, WHICH IS THE LARGER FINDING. Six weeks before Council passed this, the
# City's own Planning Commission was asked to recommend exactly this zoning and REFUSED — a motion
# to recommend approval failed with all four members present voting no, the mover and the seconder
# among them. The Community Development Director said on the record that the request "will come
# before the Board again." The only Commission meeting in the intervening gap carries no such case
# (JOSLIN 0, ANNEX 0, 243 0 over its full text). Council enacted it anyway.
#   THIS ORDINANCE CARRIES NO WHEREAS CLAUSES AND DOES NOT MENTION THE PLANNING COMMISSION.
#   Whether a favourable recommendation was legally required, and what Council was told about the
#   refusal, are both `[open]`. Write the sequence; the instruments state no reason.
#
# TAG VOCABULARY: [verified] = read off this ordinance's own page images/text layer;
# [inference] = reasoned from [verified] facts, labelled; [open] = not established here.

