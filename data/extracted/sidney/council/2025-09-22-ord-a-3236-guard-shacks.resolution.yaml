  ⚠️_defect_in_the_enacted_text:
    tag: verified
    read: text layer AND 300-dpi render of p.7
    section: §1117.02 definition
    verbatim: >-
      Guard Shack. A structure located on private property for the purpose of manually or
      electronically monitoring pedestrian and / or vehicular traffic and promoting security by
      substantially impeding or restricting ingress or egress to said property. A guard shack shall
      not be
    finding: >-
      THE DEFINITION STOPS MID-SENTENCE. "A guard shack shall not be " is followed immediately by
      the next glossary entry, "Historic structure:". The render shows the red-underlined NEW text
      simply ending — there is no strikethrough, no continuation and no missing page. The City
      adopted an unfinished sentence.
    why_it_is_not_an_artifact: >-
      Confirmed from the page image, not only the text layer, and struck-through text elsewhere in
      the same exhibit does still render — so an extraction failure does not explain it.

