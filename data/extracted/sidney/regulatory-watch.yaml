  air_pti:
    watch_item: 1
    subject: Ohio EPA air Permit-to-Install for the emergency-generator bank
    outcome: application_filed
    tag: '[verified]'
    checked_on: '2026-08-11'
    # ── THE FLIP ──────────────────────────────────────────────────────────────
    application_filed:
      tag: '[verified]'
      application_no: P0141118
      air_facility_id: '0375015024'
      filed_as: CMH232 Campus
      received: '2026-08-03'
      acknowledged: '2026-08-04'
      district: Ohio EPA DAPC Northwest District Office (Bowling Green)
      signed_by: Mohammad Smidi, 419.373.3118
      edoc: '4214600'
      document: data/documents/oepa/sidney/4214600.pdf
      extraction: data/extracted/oepa/sidney/4214600.epa.yaml
      statement: >-
        An air PTI/PTIO application for this campus was RECEIVED 2026-08-03 and determined
        "preliminarily and administratively complete" 2026-08-04 — three days after the
        negative below was recorded. The letter disclaims approvability in its own words and
        describes the sequence still to come: technical review → terms and conditions →
        Central Office DAPC review → a DRAFT or final permit. So an application exists and a
        draft does not.
      it_states_no_load: >-
        [verified] No megawatt, kW, generator, engine, emission-unit, fuel or cooling term
        appears on either page, and the letter does not say whether the application is being
        reviewed as a major new source or a minor one. A Secondary-ID search on air facility
        0375015024 returns this ONE document — no DRAFT FOR PUBLIC COMMENT, no PUBLIC NOTICE.
        The genset fields stay None and the campus MW stays `[open]`.
      dated_clock:
        tag: '[inference]'
        basis: the letter's own processing estimates, arithmetic'd from the 2026-08-03 receipt
        non_major: '2026-10-02 to 2026-12-01'   # 60-120 days
        major: '2026-12-01 to 2027-01-30'       # 120-180 days
        caveat: >-
          The letter calls these "only an estimate". They bound the FINAL determination; the
          DRAFT precedes it and is the document that names generator count and ratings — so
          early October 2026 is a floor to start watching, not a deadline.
      site_prep_trap: >-
        [verified] The letter cites OAC 3745-31-33: some site preparation may proceed BEFORE a
        final PTI/PTIO issues. Observed construction at this campus is therefore not evidence
        that an air permit exists — earthwork has run since 2025-12-05.
      jurisdiction_vindicated: >-
        [verified] The letterhead is the Northwest District Office, 347 N. Dunbridge Road,
        Bowling Green — confirming the `jurisdiction` block below, which was reasoned from Ohio
        EPA's district table rather than from an instrument. NWDO for air, Southwest District
        for surface water, same county.
    superseded_note: >-
      Everything from `queries_run` down was the 2026-07-31 capture and is retained verbatim as
      the dated negative it was. It was CORRECT on its date — and the positive control below is
      what makes that readable, because it proves the query shape finds this kind of instrument
      when one exists. A dated negative later turning positive is the watch working.
    # ── The 2026-07-31 capture, retained ──────────────────────────────────────
    jurisdiction:
      tag: '[verified]'
      statement: >-
        Shelby County air permitting is Ohio EPA DAPC's NORTHWEST District Office
        (Bowling Green), contact John Pasquarette, 419.373.3057 — confirmed from Ohio
        EPA's own district/local-air-agency table read 2026-07-31. It is explicitly
        NOT RAPCA: the Regional Air Pollution Control Agency in Dayton takes
        applications only for Clark, Darke, Greene, Miami, Montgomery and Preble.
        (Surface water splits the other way — the campus's own PTI names the
        SOUTHWEST District Office. The two programs do not share a district for this
        county, and a search aimed at the wrong one will find nothing.)
      source: https://epa.ohio.gov/divisions-and-offices/air-pollution-control/permitting/ohio-epa-district-offices-and-local-air-pollution-control-agencies
    queries_run:
      - query: eDoc — County=SHELBY, Program=AIR PERMIT, Facility Name="SIDNEY DATA"
        result: 0 documents
      - query: eDoc — County=SHELBY, Program=AIR PERMIT, Facility Name="CMH"
        result: 0 documents
      - query: eDoc — statewide, Program=AIR PERMIT, Facility Name="CMH-232"
        result: 0 documents
      - query: eDoc — County=SHELBY, all programs, Facility Name="AMAZON"
        result: 0 documents
      - query: EPA ECHO air_rest_services — p_st=OH, p_fn=AMAZON
        result: 1 row, AMAZON.COM SERVICES LLC - CAK4, Valley View (a fulfillment center, not a data center)
      - query: EPA FRS — all program facilities at ZIP 45365
        result: >-
          SIDNEY DATA CENTER CAMPUS present, registry 110072226204, with NPDES as its
          only program system — no AIR program record
    positive_control:
      tag: '[verified]'
      statement: >-
        The eDoc route DOES surface AWS air permits when they exist. Statewide,
        Program=AIR PERMIT, Facility Name="AMAZON" returns 19 documents, including
