# Sidney (Shelby County, OH) — standing regulatory watch on the AWS campus.
#
# Provenance vocabulary (see docs/investigative-method/ENRICHMENT.md):
#   [verified]  = stated in a captured primary record (cite file + page)
#   [reference] = secondary / self-published source, not a controlling record
#   [inference] = reasoned from verified facts, labelled as such
#   [open]      = not established by any captured source — do NOT assert
#
# A watch is only worth as much as its negatives. Every instrument below records
# what was checked, by what route, on what date, and what came back — including
# the routes that CANNOT answer the question and the one that is blocked. A blank
# is never left to imply "nothing happened."
meta:
  subject: >-
    Standing watch on the five regulatory instruments framing the AWS "Sidney Data
    Center Campus" (Amazon Data Services, Inc., 2388 West Millcreek Road) — air PTI,
    construction stormwater, the receiving POTW's NPDES permit, the AES Ohio rate
    case, and City site-plan review
  kind: regulatory-watch
  site: sidney
  captured_for: issue 1383 (epic 1275, readiness(sidney))
  extracted_at: '2026-07-31'
  checked_on: '2026-08-11'
  previous_check: '2026-07-31'      # the capture below; before that 2026-07-02 (data-centers.md)
  recheck_2026_08_11: >-
    Five routes re-run and adversarially verified (#1998). ONE FLIPPED: an Ohio EPA air
    PTI/PTIO application was RECEIVED 2026-08-03 — three days after the previous check — and
    acknowledged administratively complete 2026-08-04 (eDoc 4214600, now committed). The
    `[verified negative]` below was correct on its date and has been overtaken; it is recorded as
    SUPERSEDED, not as an error. Everything else is unchanged, and the campus MW is still `[open]`
    — six instruments have now issued or been filed and not one states a load. A sixth route,
    FERC eLibrary, was named here as "the route to try next", was run for the first time, and
    resolved this watch's largest `[open]`: an AES Ohio / Amazon agreement naming this campus
    EXISTS, and the megawatt figure is in it and withheld. See `recheck_delta` at the foot.
  method: >-
    Five routes, run independently and recorded separately: Ohio EPA's eDocument
    public portal (facility name x county x program), EPA ECHO's CWA services and
    the Envirofacts ICIS-NPDES / FRS tables, the Ohio EPA DAM permit slots, the City
    of Sidney's own FAQ page, and open web search for the PUCO docket. Where a route
    is structurally incapable of answering, that is recorded as a structural finding
    rather than an empirical negative.

# ── The naming problem, which is why the last check found nothing ──────────────
# This is the single most useful thing this watch established. The 2026-07-02
# register searched "Amazon Data Services" and "Project Galaxy" against Shelby
# County and came back empty on every regulatory instrument. Both keys were wrong.
naming:
  tag: '[verified]'
  finding: >-
    Ohio EPA's records do not know this campus as "Project Galaxy." They know it as
    "Sidney Data Center Campus" in the surface-water and NPDES systems, and as
    "CMH-232" in the 401/wetlands system. Searching either of those names returns
    the full instrument set immediately; searching "Amazon Data Services" as a
    FACILITY name against Shelby County returns zero, because the applicant name and
    the facility name are different fields.
  keys_that_work:
    - key: Sidney Data Center Campus
      where: Ohio EPA eDocument facility name; ICIS-NPDES facility name; EPA FRS primary name
      evidence: data/documents/oepa/sidney/3931140.pdf (NOI, section II)
    - key: CMH-232
      where: Ohio EPA eDocument facility name, 401 WETLANDS program only
      evidence: data/documents/oepa/sidney/3935117.pdf (401 application, section 2.A)
    - key: CMH232 Campus
      where: >-
        Ohio EPA eDocument facility name, AIR PERMIT program only; air facility ID 0375015024
      evidence: data/documents/oepa/sidney/4214600.pdf (letterhead "Re:" block, 2026-08-04)
      added: '2026-08-11'
      warning: >-
        [verified] UNHYPHENATED, and the hyphen matters: the AIR program files "CMH232 Campus"
        while the 401/wetlands program files "CMH-232" (30 documents). Querying the air program
        with the hyphenated key returns ZERO — which is exactly the shape of the negative this
        watch recorded on 2026-07-31. Note the air facility carries its OWN registry id
        (0375015024), not the campus's NPDES/FRS registry 110072226204, so an air record can
        never appear as a second program row on the water one.
    - key: Amazon Data Services, Inc.
      where: ICIS-NPDES permit_name (NOT the facility name), and the applicant block of every filing
      evidence: Envirofacts ICIS_PERMIT, external_permit_nmbr OHGC16923
    - key: 2388 West Millcreek Road / 40.2692, -84.1957
      where: address and coordinate fields across all systems
  the_project_galaxy_collision:
    tag: '[verified]'
    warning: >-
      "Project Galaxy" is a live facility name in Ohio EPA's records — for a
      DIFFERENT Amazon Data Services campus. ICIS-NPDES carries "PROJECT GALAXY"
      (individual NPDES permit OH0151745, reported average flow 0.451 MGD),
      "PROJECT GALAXY" (OHGH00907, hydrostatic-test general permit, 1.05 MGD) and
      "PROJECT GALAXY FORCE MAIN FOR COOLING WATER DISCHARGE" (OHGC17083), all at
      1000 Innovation Way / Innovation Wy NW & Bluegrass Blvd, JEFFERSONVILLE, OH
      43128 — Fayette County, roughly 90 miles from Sidney, the AWS campus on the
      I-71 land AWS bought in Jefferson Township in January 2025. Its permittee name
      is also "Amazon Data Services, Inc." A records search keyed on "Project
      Galaxy" therefore returns a real, Amazon-owned, cooling-water-discharging
      Ohio data center that IS NOT THIS ONE. Do not let those instruments — least of
      all the cooling-water force main and the individual NPDES permit — migrate
      onto the Sidney record.
    checked_on: '2026-07-31'
    source: EPA ECHO cwa_rest_services.get_facilities, p_st=OH, p_fn=GALAXY (4 rows)
  where_project_galaxy_is_sourced_for_sidney:
    tag: '[reference]'
    statement: >-
      The Sidney attribution of the codename rests on secondary sources
      (stopohiodatacenters.org/shelby-county; Data Center Dynamics, Oct 2025) plus
      one resident-submitted question quoted verbatim on the City's own FAQ page,
      which refers to "the Project Galaxy/Rey development" in connection with the
      $6.8 million Millcreek Road line of the 2026 Capital Improvement Fund. The
      City answered that question without correcting the name. That is enough to
      record the codename as locally used — it is NOT enough to make it the name
      under which the campus is permitted, and the register should lead with
      "Sidney Data Center Campus" / "CMH-232". Note the same FAQ sentence introduces
      a SECOND, entirely unsourced codename, "Rey", which nothing else corroborates.
      Left `[open]`.
    source: >-
      data/documents/oepa/sidney/ (none) — sidneyoh.com/526/Proposed-Data-Center-FAQ,
      read 2026-07-31, page self-dated "Last updated: June 24, 2026"

# ── Route hazards found while running this watch ───────────────────────────────
# Recorded so the next check does not repeat them and mistake a broken query for
# an absent instrument.
route_hazards:
  # ⚠️ THE ONE THAT WAS NOT A HAZARD AT ALL — added #1998, 2026-08-13.
  - route: The City's Documents-On-Demand legislative portal (sidneycityoh.documents-on-demand.com)
    hazard: >-
      THIS CORPUS RECORDED IT AS BLOCKED IN FIVE ARTIFACTS AND TWO DRAFTED PUBLIC-RECORDS
      REQUESTS, AND IT WAS NEVER BLOCKED. A default request returns HTTP 403 behind a real
      Cloudflare challenge; the identical request with `--http1.1` and a browser UA returns HTTP
      200. The trigger is the HTTP/2 FINGERPRINT, not the client. Behind it sits an
      unauthenticated JSON API — /meta/rootfolder, /meta/docfolder?containerId=<guid>,
      /document/<guid>/<fileName>.pdf — carrying City Council Legislation (Ordinances and
      Resolutions, 51 year folders back to 1976) and Minutes (170 year folders back to 1857), plus
      the same for the Planning Commission, the Zoning Board of Appeals, the CRA Housing Council
      and ten other bodies. Res. 69-25, Res. 84-22, Res. 14-26 and all three vote-meeting minutes
      came through it in minutes on 2026-08-13.
      GENERALIZE IT: a 403 to a scripted client may be a protocol-fingerprint block. RETRY OVER
      HTTP/1.1 BEFORE RECORDING A ROUTE NEGATIVE. ⚠️ Second trap on the same host —
      /meta/childfolders?parentId=, which the page's own JavaScript calls on lazy expand, returns
      the app shell rather than JSON to a scripted client and reads as "empty". `docfolder`
      returns the entire subtree anyway; use it and never conclude a container is empty from
      `childfolders`.
  - route: EPA ECHO get_facilities county filter (p_co)
    hazard: >-
      Filtering CWA facilities by p_co=Shelby returns 32 rows and DOES NOT INCLUDE
      the AWS campus, because ICIS carries a null county on the newer general-permit
      coverages and the filter drops null-county rows. A "no Amazon facility in
      Shelby County" negative built on that query would have been false. Query by
      permit ID, facility name, or ZIP instead.
  - route: EPA ECHO facility-name search (p_fn)
    hazard: >-
      p_fn matches the ICIS FACILITY name, not the permit name. p_fn=AMAZON against
      Ohio returns exactly one row (an Etna fulfillment center) and misses OHGC16923
      entirely, whose facility name is "SIDNEY DATA CENTER CAMPUS" while its
      permit_name is "Amazon Data Services, Inc." Use Envirofacts ICIS_PERMIT
      PERMIT_NAME/CONTAINING to search the permittee.
  - route: Ohio EPA eDocument full-text field
    hazard: >-
      The free-text box does not behave like a phrase search. Shelby + AIR PERMIT +
      full text "Amazon" returned 0 while Shelby + AIR PERMIT + full text "data
      center" returned 232 — i.e. it matched loosely on common words. Only the
      structured Facility Name x County x Program fields gave reproducible results;
      full-text counts here are not evidence either way.
  - route: EPA FRS / ICIS-Air as an air-permit oracle
    hazard: >-
      FRS shows registry 110072226204 (SIDNEY DATA CENTER CAMPUS, 2388 West
      Millcreek Road) with NPDES as its ONLY program system, and ICIS-Air has no
      Amazon Data Services source in Ohio at all. That is consistent with there
      being no air permit — but ICIS-Air only carries majors and some synthetic
      minors, so a state minor-source PTI could exist without ever appearing there.
      The federal absence corroborates; it does not decide. The deciding route is
      Ohio EPA's own eDocument search, below.

