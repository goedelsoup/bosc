        in Cuyahoga (CLE9/CAK4) and Madison (OOH9). So the query shape is proven
        against exactly the kind of instrument being looked for, in the same agency
        system, for the same applicant. The Shelby zero is a zero, not a broken
        query.
    conclusion: >-
      [SUPERSEDED 2026-08-11 — see `application_filed` above; true as written on its own date.]
      As of 2026-07-31 there is NO Ohio EPA air permit-to-install, draft permit,
      public notice or permit application on the record for the Sidney campus, under
      any of the three names it is known by. The generator count, the generator
