      - data/documents/oepa/sidney/1PD00009.c43b66fd.pdf
    extraction: data/extracted/oepa/sidney/1PD00009.npdes.yaml

  # 4 ─────────────────────────────────────────────────────────────────────────
  puco_aes_ohio_rate_case:
    watch_item: 4
    subject: PUCO Case No. 25-958-EL-AIR — AES Ohio multi-year rate plan and the data-center tariff classes
    outcome: moved
    tag: '[reference]'
    checked_on: '2026-07-31'
    finding: >-
      On 2026-07-21 AES Ohio announced it had filed an UNOPPOSED Settlement
      (Stipulation) with PUCO Staff and 16 parties for a three-year rate plan, and
      that the settlement includes "Customer protections that ensure data centers
      will pay for their costs, under a new Data Center Tariff as recommended by the
      PUCO," with "planned distribution rates through 2029." Public hearings were
      held in Dayton on 2026-07-09 and 2026-07-16.
    tag_rationale: >-
      `[reference]`, not `[verified]`: this is the utility's own press release about
      its own filing. The stipulation is the record; the press release is a party
      describing it. Nothing here states the four DCT rate classes (secondary /
      primary / primary-substation / high-voltage) that the PUCO Staff Report
      recommended, and nothing names AWS, Sidney, Shelby County or any megawatt
      figure.
    what_it_does_to_the_issue_body: >-
      The issue tracked an "evidentiary hearing 2026-08-04." An unopposed stipulation
      filed two weeks earlier ordinarily converts that into a settlement hearing, but
      whether the 2026-08-04 date still stands, and in what form, is `[open]` — the
      docket is the only place that answers it and the docket is blocked (below).
    puco_dis:
      tag: '[open — access blocked]'
      what_was_checked: >-
        PUCO's Docketing Information System case record, both
        dis.puc.state.oh.us/CaseRecord.aspx?CaseNo=25-0958-EL-AIR and the
        25-958-EL-AIR spelling, with a browser user-agent.
      result: >-
        Not a negative — an ACCESS FAILURE, and it must be recorded as one. Both URLs
        return HTTP 200 with a 244-byte body: "Request Rejected / The requested URL
        was rejected. Please consult with your administrator. / Your support ID is
        <5914278294322602041>". That is a WAF block, identical in shape to the one
        recorded for the Findlay grid work
        (data/extracted/grid/findlay/megawatt-hub-interconnection.gap.yaml). The
        docket is UNSEARCHED, not empty. The stipulation text, the DCT tariff sheets,
        the service list and any AWS-specific service agreement are all behind it.
    facility_naming_watch: >-
      The instrument that would matter most here is not the tariff at all — it is an
      AES Ohio service agreement or interconnection filing that NAMES the Sidney
      campus and states its contracted load. None is on the record. The City's own
      FAQ answers a resident question premised on the existence of "the FERC
      transmission service agreement between AES and Amazon" by explaining that the
      City has no standing in a FERC proceeding; it neither confirms nor denies that
      such an agreement exists, so the agreement stays `[open]` and the FAQ exchange
      is a lead, not a source. FERC eLibrary is the route to try next.
    corpus:
      - data/documents/grid/sidney/2026-07-21-aes-ohio-files-unopposed-settlement-for-its-three-year-rate-plan.aes-ohio.html

  # 5 ─────────────────────────────────────────────────────────────────────────
  city_site_plan:
    watch_item: 5
    subject: City of Sidney site-plan review for the campus
    outcome: negative
    tag: '[verified]'
    checked_on: '2026-07-31'
    finding: >-
      Unchanged. The City's FAQ page still reads "The site plan is under review by
      City staff," and the page still self-dates to "Last updated: June 24, 2026" —
      no movement in the five weeks since the issue was written.
    structural_finding:
      tag: '[verified]'
      statement: >-
        There will be no public hearing record to watch for. Sidney site-plan
        approval is governed by Zoning Code Section 1115.09 and is "conducted
        administratively by the Zoning Code Administrator (Community Development
        Director)" with technical review by Zoning, Engineering, Fire and Underground
        Utilities; the City states explicitly that "the Sidney Planning Commission
        does not review or approve site plans for this proposed development,"
        contrasting itself with Wilmington, where the Planning Commission does. So
        the approval will surface as an administrative act, not as a noticed agenda
        item — a records request to the Community Development Director, not a meeting
        watch, is the route to the approved plan and its building count.
      source: sidneyoh.com/526/Proposed-Data-Center-FAQ, "Economic Development Process", read 2026-07-31
    what_did_move: >-
      The state-side approvals for the same works landed while the City review sat:
      the Ohio EPA sanitary-sewer-relocation PTI on 2026-06-16 and the City's own
      wetland permit for the road development on 2026-05-04.

