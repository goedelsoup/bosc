      tag: '[verified]'
      statement: >-
        There will be no public hearing record to watch for. Sidney site-plan
        approval is governed by Zoning Code Section 1115.09 and is "conducted
        administratively by the Zoning Code Administrator (Community Development
        Director)" with technical review by Zoning, Engineering, Fire and Underground
        Utilities; the City states explicitly that "the Sidney Planning Commission
        does not review or approve site plans for this proposed development,"
        contrasting itself with Wilmington, where the Planning Commission does. So
        the approval will surface as an administrative act, not as a noticed agenda
        item — a records request to the Community Development Director, not a meeting
        watch, is the route to the approved plan and its building count.
