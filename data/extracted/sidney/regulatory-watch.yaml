  # 2b ────────────────────────────────────────────────────────────────────────
  data_center_general_permit:
    watch_item: 2
    subject: >-
      The statewide data-center NPDES general permit OHD000001 — WITHDRAWN 2026-07-21,
      never finalized (public-noticed as a draft 2025-10-31; hearing 2025-12-17; comment
      closed 2026-01-16)
    outcome: moot
    tag: '[verified]'
    checked_on: '2026-07-31'
    finding: >-
      OHD000001 will never issue. Ohio EPA posted a Community Notice dated
      2026-07-21: "After carefully reviewing the significant volume of public
      comments received on the draft National Pollutant Discharge Elimination System
      (NPDES) general permit for data centers, Ohio EPA has decided not to move
      forward with finalizing the general permit. The individual NPDES permit
      issuance process is the most appropriate path forward at this time."
    source: >-
      data/documents/oepa/2026-07-21-ohio-epa-will-not-finalize-data-center-general-permit.npdes-general-permits.html
      (epa.ohio.gov NPDES General Permits page, captured 2026-07-31, "Recent Activities")
    why_it_barely_matters_here:
      tag: '[inference]'
      statement: >-
        For Sidney specifically the collapse changes little, and saying otherwise
        would overstate it. OHD000001 would have covered cooling water, cooling-tower
        and boiler blowdown, compressor condensate and industrial stormwater
        DISCHARGED TO SURFACE WATER. This campus discloses none of that: all facility
        wastewater, including any cooling-system discharge, goes to the City's
        sanitary sewer ("Cooling systems are not permitted to discharge to the storm
        sewer system" — City FAQ), the NOI answers Individual NPDES "NO", and the
        surface-water PTI's condition WW restates that a discharge permit would have
        to be applied for 180 days ahead of any discharge to waters of the state.
        The live consequence of the collapse is network-wide, not local: any BOSC
        site record that names OHD000001 as the expected coverage path is now stale.
    network_note: >-
      Sandusky's readiness epic and the Sidney register both carried OHD000001 as a
      standing watch item. Both are now answered — negatively and permanently.

