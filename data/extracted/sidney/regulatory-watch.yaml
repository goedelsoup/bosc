        "pending the OEPA NPDES fact sheet." The regulator's own number for the same
        gage over 1927-2021 is 24.0 cfs, 22% lower, and it is the one the wasteload
        allocations are actually built on. The derived figure was not wrong as a
        derivation; it was simply not the regulatory floor, and it made the
        abstraction screen 29% more permissive than the regulator's. Corrected to
        24.0. `passby_secondary_cfs` was 0.0 `[open]` with a derived Loramie 7Q10 of
        3.55 cfs noted alongside; the cited value is 3.43 cfs — close enough that the
        derivation corroborates well, far enough that the cited one governs.
    data_center_wastewater_separation:
      tag: '[verified]'
      question: Will data-center wastewater be reported separately in the WWTP's DMRs?
      answer: >-
        No — and the DMR was never the place to look. A DMR reports what leaves
        outfall 1PD00009001; an industrial user's contribution is not broken out
        there. The instrument that would separate it is the CITY's own industrial
        pretreatment program: the City states it has 16 significant industrial users
        and that potential chemicals at the site are "reviewed through the City's
        industrial pretreatment program, with support from Ohio EPA and engineering
        consultants," with authority to "require pretreatment, operational changes,
        or prohibit discharges." An AWS significant-industrial-user permit issued by
        the City of Sidney is a municipal record obtainable under R.C. 149.43 — it is
        not on Ohio EPA's eDocument portal and no amount of DMR watching will produce
        it.
      source: sidneyoh.com/526/Proposed-Data-Center-FAQ, "Utility Concerns", read 2026-07-31
      status: '[open] — no SIU permit or pretreatment agreement for the campus is on the record'
    corpus:
      - data/documents/oepa/sidney/1PD00009.pdf
      - data/documents/oepa/sidney/1PD00009.c43b66fd.pdf
    extraction: data/extracted/oepa/sidney/1PD00009.npdes.yaml

