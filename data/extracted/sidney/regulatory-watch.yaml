  # 2b ────────────────────────────────────────────────────────────────────────
  data_center_general_permit:
    watch_item: 2
    subject: >-
      The statewide data-center NPDES general permit OHD000001 — WITHDRAWN 2026-07-21,
      never finalized (public-noticed as a draft 2025-10-31; hearing 2025-12-17; comment
      closed 2026-01-16)
    outcome: moot
    tag: '[verified]'
    checked_on: '2026-07-31'
    finding: >-
      OHD000001 will never issue. Ohio EPA posted a Community Notice dated
      2026-07-21: "After carefully reviewing the significant volume of public
      comments received on the draft National Pollutant Discharge Elimination System
      (NPDES) general permit for data centers, Ohio EPA has decided not to move
      forward with finalizing the general permit. The individual NPDES permit
      issuance process is the most appropriate path forward at this time."
    source: >-
      data/documents/oepa/2026-07-21-ohio-epa-will-not-finalize-data-center-general-permit.npdes-general-permits.html
      (epa.ohio.gov NPDES General Permits page, captured 2026-07-31, "Recent Activities")
    why_it_barely_matters_here:
      tag: '[inference]'
      statement: >-
        For Sidney specifically the collapse changes little, and saying otherwise
        would overstate it. OHD000001 would have covered cooling water, cooling-tower
        and boiler blowdown, compressor condensate and industrial stormwater
        DISCHARGED TO SURFACE WATER. This campus discloses none of that: all facility
        wastewater, including any cooling-system discharge, goes to the City's
        sanitary sewer ("Cooling systems are not permitted to discharge to the storm
        sewer system" — City FAQ), the NOI answers Individual NPDES "NO", and the
        surface-water PTI's condition WW restates that a discharge permit would have
        to be applied for 180 days ahead of any discharge to waters of the state.
        The live consequence of the collapse is network-wide, not local: any BOSC
        site record that names OHD000001 as the expected coverage path is now stale.
    network_note: >-
      Sandusky's readiness epic and the Sidney register both carried OHD000001 as a
      standing watch item. Both are now answered — negatively and permanently.

  # 3 ─────────────────────────────────────────────────────────────────────────
  wwtp_npdes:
    watch_item: 3
    subject: NPDES OH0027421 (Sidney WWTP) — the receiving POTW
    outcome: issued_and_ingested
    tag: '[verified]'
    checked_on: '2026-07-31'
    finding: >-
      The instrument the corpus was waiting on was not pending at all — it has been
      on Ohio EPA's DAM since 2022 and nobody had pulled it. Ohio EPA Permit No.
      1PD00009*SD (application OH0027421), City of Sidney WWTP, 1091 Children's Home
      Road, discharging to the Great Miami River at RM 128.7; action 2022-12-16,
      effective 2023-01-01, EXPIRES 2027-12-31. Its draft public-notice package (PN
      163939, 2022-11-07) carries the 39-page Fact Sheet whose Table 14 states the
      cited regulatory stream design flows for this reach.
    renewal_cycle:
      tag: '[verified]'
      statement: >-
        The permit's own terms fix the schedule: the permittee "shall submit such
        information and forms as are required by the Ohio EPA no later than 180 days
        prior to" the 2027-12-31 expiration — i.e. by roughly 2027-07-04. There is
        therefore NOTHING to watch on the renewal until mid-2027, and no renewal
        application, draft permit or public notice exists yet. This replaces the
        open-ended "watch the renewal cycle" with a date.
    cited_design_flows:
      tag: '[verified]'
      source: 1PD00009.c43b66fd.pdf, Fact Sheet Table 14, "Instream Conditions and Discharger Flow", p.32
      great_miami_above_sidney:
        gage: USGS 03261500
        period: 1927-2021 (30Q10 summer uses 1927-2020)
        annual_1q10_cfs: 19.4
        annual_7q10_cfs: 24.0
        summer_30q10_cfs: 29.0
        winter_30q10_cfs: 67.2
        annual_harmonic_mean_cfs: 119.2
      loramie_creek_at_mouth:
        gage: USGS 03262000
        period: 1916-2020 (winter 30Q10 uses 1915-2020)
        annual_1q10_cfs: 2.71
        annual_7q10_cfs: 3.43
        summer_30q10_cfs: 4.29
        winter_30q10_cfs: 8.34
        annual_harmonic_mean_cfs: 21.76
      rush_creek_at_mouth:
        annual_7q10_cfs: 0.82
        annual_1q10_cfs: 0.66
      mixing_assumption: 100% stream-to-discharge ratio, average and maximum
      sidney_wwtp_outfall_001: 10.83 cfs (7.0 MGD), design, per the NPDES application
      interactive_dischargers: [Sidney WWTP, Piqua WWTP, Troy WWTP]
    what_it_changes:
      tag: '[verified]'
      statement: >-
        `SiteProfile('sidney').passby_primary_cfs` was 30.95 — a BOSC-derived LP3
        7Q10 over 1980-2024 at the same gage, carried explicitly as a placeholder
        "pending the OEPA NPDES fact sheet." The regulator's own number for the same
        gage over 1927-2021 is 24.0 cfs, 22% lower, and it is the one the wasteload
        allocations are actually built on. The derived figure was not wrong as a
        derivation; it was simply not the regulatory floor, and it made the
        abstraction screen 29% more permissive than the regulator's. Corrected to
        24.0. `passby_secondary_cfs` was 0.0 `[open]` with a derived Loramie 7Q10 of
        3.55 cfs noted alongside; the cited value is 3.43 cfs — close enough that the
        derivation corroborates well, far enough that the cited one governs.
    data_center_wastewater_separation:
      tag: '[verified]'
      question: Will data-center wastewater be reported separately in the WWTP's DMRs?
      answer: >-
        No — and the DMR was never the place to look. A DMR reports what leaves
        outfall 1PD00009001; an industrial user's contribution is not broken out
        there. The instrument that would separate it is the CITY's own industrial
        pretreatment program: the City states it has 16 significant industrial users
        and that potential chemicals at the site are "reviewed through the City's
        industrial pretreatment program, with support from Ohio EPA and engineering
        consultants," with authority to "require pretreatment, operational changes,
        or prohibit discharges." An AWS significant-industrial-user permit issued by
        the City of Sidney is a municipal record obtainable under R.C. 149.43 — it is
        not on Ohio EPA's eDocument portal and no amount of DMR watching will produce
        it.
      source: sidneyoh.com/526/Proposed-Data-Center-FAQ, "Utility Concerns", read 2026-07-31
      status: '[open] — no SIU permit or pretreatment agreement for the campus is on the record'
    corpus:
