# ── Loose end this watch surfaced but did not fix ─────────────────────────────
noted_not_fixed:
  - what: >-
      data/extracted/oepa/1PV00037.npdes.yaml — the Hidden Valley MHP permit
      extraction — sits at the oepa/ ROOT rather than under oepa/sidney/, so it falls
      outside Sidney's corpus scope and inside Lima's whole-tree reference scope, and
      renders as a row in Lima's Allen-County record. Its own catalog entry
      (data/catalog/extracted/oepa-sidney.yaml) already declares site_scope
      site:sidney, and its source PDF is correctly filed at
      data/documents/oepa/sidney/1PV00037.pdf. This is the same #1505 class of leak
      that adding corpus_relpaths=("sidney", "oepa/sidney", "grid/sidney") closed for
      everything else here.
    why_not_fixed: >-
      It concerns a different permit and a different facility from this watch's
      subject, and moving a committed extracted artifact ripples into the catalog
      storage relpath and the Wilmington catalog's exclusion note. Left for its own
      change rather than smuggled into a regulatory watch.
    resolved: >-
      Fixed in #1405, which found the same defect at Van Wert (2PD00006) and Wilmington
      (eight permits) and closed the class rather than the instance. The extraction now
      mirrors its source at data/extracted/oepa/sidney/1PV00037.npdes.yaml, and the
      corpus scope no longer depends on remembering to enumerate: a site owns its
      <slug>/ collection and its */<slug> nesting inside any agency collection by
      derivation (watermark.sites._eponymous_prefixes), which is also why the
      enumeration this note cites is gone from the profile. This watch's diagnosis was
      exact — including that the catalog already knew the site attribution the scope
      didn't.
