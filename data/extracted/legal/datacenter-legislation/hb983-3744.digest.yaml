kind: legislation
subject: >-
  H.B. No. 983, 136th Ohio General Assembly — As Introduced. The "Data Center
  Accountability and Citizen Protection Act." Enacts a new R.C. Chapter 3744 imposing
  air/wastewater discharge standards on data-center and associated-power-plant cooling
  systems, a local citizen-vote requirement, water-supply liability, grid-independence,
  and a local tax-incentive ban; and amends R.C. 9.66 to strip the confidentiality of
  data-center development-and-supply agreements.

