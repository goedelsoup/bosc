# ─────────────────────────────────────────────────────────────────────────────
# Why the frames are in this folder at all. Cited to the correspondence filed
# beside them; not extracted here as a record of its own (see `open`).
# ─────────────────────────────────────────────────────────────────────────────
claim_context:
  filed_beside: >-
    Addl_Pymt_Memo.pdf, BCI_Claim_Memo.doc, BCI_Claim_Memo_062510.pdf, BCI_DownTime.pdf,
    Final_Claim_BackupDoc.pdf, Final_Claim_Ltr_052010.pdf — the Final Change Order
    Correspondence for the American Bath Trunk Sewer Project.
  matter: "Beaverdam Contracting, Inc. (BCI) Claim #1, evaluated for Allen County by URS
    Corporation (project 14576153; Michael A. Frommer, P.E.) and addressed to Steve Kayatin,
    P.E., Allen County Sanitary Engineer, 3230 N. Cole Street, Lima."
  claimed_work_window: >-
    Work on the Cole Street portion performed 2009-06-09 to 2009-11-12 (URS letter, 2010-05-20).
  why_it_matters: >-
    The survey is dated 2009-05-13 — about four weeks BEFORE the claimed work began. It is
    therefore the pre-construction condition of record for the alignment the claim is about:
    what Cole Street's pavement, the side-street concrete, and the abutting concrete apron
    looked like before BCI mobilized. That is the ordinary evidentiary function of a
    video log filed into a construction claim file.
  claim_figures:
    note: >-
      [verified] transcribed from the two URS letters filed beside the archives. Recorded here
      only as the frames' context; the claim record itself is not extracted (see `open`).
    urs_evaluation_2010_05_20:
      basis: trench width installed vs. trench width assumed at bid, priced at 4 ft, 5 ft and 6 ft
      original_claim_2010_04_28: 167453.28
      total_at_4ft: 203443.27
      total_at_5ft: 144577.33
      total_at_6ft: 85835.05
      aggregate_line_at_4ft: -17097.60
    urs_final_memo_2010_06_25:
      trench_width_decided: 4 ft (Allen County decision at the 2010-06-22 meeting)
      scope_added: Knollwood Drive, alongside Cole Street
      labor_and_equipment: 200549.10
      aggregate: 29212.88
      asphalt: 41716.66
      traffic_control: 3423.24
      total: 274901.88
    quantities:
      aggregate_backfill_estimated_tons: 13500
      aggregate_backfill_installed_tons: 20309
      aggregate_backfill_calculated_at_4ft_tons: 17266
      traffic_control_claimed: 23818.00
      traffic_control_allowed: 3423.24
      transcription_note: >-
        The memo prints its own aggregate line as "3,043 Tons * $9.60/Ton = $29,212.88" and
        repeats $29,212.88 in the Final Claim Amount block, but 3,043 x 9.60 = $29,212.80. The
        figures above are as-printed; the $0.08 is URS's arithmetic, not a transcription error
        (both occurrences re-read at 500 dpi). Immaterial in amount, recorded because the
        printed total $274,901.88 carries it.

open:
- id: aggregate-sign-flip
  question: >-
    At the SAME 4 ft trench width, URS's 2010-05-20 letter carries the aggregate line as a
    CREDIT to the county of $17,097.60, while its 2010-06-25 memo carries it as a CHARGE of
    $29,212.88 — a $46,310.48 swing on the assumption the parties had just settled. The June
    memo shows its basis (20,309 t installed less 17,266 t calculated, at $9.60/t); the May
    basis is in an enclosed spreadsheet not identified in the produced folder. Unresolved on
    the produced record. [open]
- id: claim-record-not-extracted
  question: >-
    The BCI Claim #1 evaluation chain (URS 2010-05-20 letter + 2010-06-25 memo + BCI_DownTime +
    Final_Claim_BackupDoc, and the five BCI letters they recite, dated 2010-03-08, 03-30, 04-08,
    05-12 and 05-28) is a substantive construction-claim record in its own right. It is cited
    here for context only; a structured extraction is a separate piece of work. [open]
- id: concrete-apron-property
  question: >-
    Whose concrete apron is in ConcDr.zip? The five frames sit at ~40.7746-40.7748 N on Cole
    Street, and the county's own Sanitary Engineering office is at 3230 N. Cole Street — but the
    building is NOT identified in the frames and the committed Allen County CAMA subset carries
    no 3230 N Cole parcel. Resolving it matters: if the documented drive is the county's own
    facility the frames read differently than if it is a third-party abutter. [open]
- id: knollwood-side-street
  question: >-
    The two dead-end side-street frames (cap015, cap017) are unlabelled beyond the route tag
    COLE. The claim's scope is "the Cole Street and Knollwood Drive portions", so Knollwood is
    the obvious candidate, but the overlay does not name it and no plan sheet in the produced
    folder was matched to it. [inference, unconfirmed]

relevance:
  tags: [verified, corpus-hygiene, construction-claim, american-bath, secap, change-order,
    cole-street, prr-item-9, prr-item-15]
  note: >-
    Batch-3 corpus hygiene: the last two opaque containers in the change-order correspondence are
    now read and inventoried. The headline is negative in the useful sense — the archives hid
    nothing. Their contents were already produced loose at item 9, byte-identical and already
    custody-manifested, so the corpus gains a reviewed reading and a georeferenced index rather
    than any new bytes. What IS new is machine-readable: the GPS/route/time overlay was burned
    into pixels and readable by nothing in the repo until now.
  cross_refs:
  - data/extracted/legal/prr-mandamus/bosc-prr-production-2026-07-24.custody-manifest.yaml
  - data/extracted/legal/prr-mandamus/bosc-prr-production-2026-07-24.analysis.md
