terms:
  structure: >-
    The County owns/maintains the collection system (gravity mains, pumping station, force main)
    up to the point of connection to the Village's system; the Village receives and TREATS the
    County's wastewater at the Village WWTP under the Village's own NPDES permit. The County bills
    and collects the Village's treatment fee from Service-Area customers and remits it to the
    Village (quarterly invoice, paid within 30 days).
  treatment_fee: 2014 flat rate of $24.71 per month per account (Village may raise per its Rules
    & Regulations); 2013 connection charge $600 for new customers.
  term: PERPETUAL agreement from the date of initial treatment (Section 3-... "Term of Contract").
  customer_certification: County certifies the customer-account database to the Village by
    January 15 each year (Exhibit B).
  termination_mechanism: >-
    [verified] Section 16 — the County may terminate "whenever ... the County determines in its
    SOLE DISCRETION that it shall purchase treatment from any other entity or ... construct a
    wastewater project" of its own. Procedure: the County first notifies the Village of its
    intent with cost estimates/plans/specs; the Village then has 120 days to state (A) it has
    sufficient capacity, (B) it is willing to serve, and (C) its estimated cost; after which the
    County, again "in its sole discretion," may proceed with the purchase/project, terminating
    the agreement 120 days from its notice. (Section 14 adds an ordinary default-and-90-day-cure
    termination for either party; Section 15 routes disputes to non-binding mediation then
    3-arbitrator binding arbitration.)

bosc_relevance: >-
  [verified] This is the agreement whose OEPA review + potential termination item 14 requests,
  and Section 16 is precisely the mechanism the County's live 2026 "Shawnee Oaks reroute to
  Shawnee WWTP" project (item-14 tree) invokes: rather than terminate for cause, the County is
  building its OWN conveyance (pump station + force main to the Shawnee II WWTP) to move the
  Shawnee Oaks flow off the Cridersville plant — the "construct a wastewater project ... in its
  sole discretion" exit. [inference] The reroute ends the ~$102k/yr the County pays Cridersville
  to treat Shawnee Oaks flow (sanitary-economics.yaml), redirecting that load to the same
  Shawnee II plant being expanded through the DFFO chain.

open:
  - >-
    [open] No standalone OEPA-review correspondence or Prosecutor's Office legal analysis of the
    agreement was identified in the item-14 tree at survey level (item 14 requested both). The
    reroute engineering/financing records ARE the county's de-facto termination trail; whether a
    formal termination notice under Section 16 has issued is unconfirmed in the production.

