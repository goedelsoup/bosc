  penalty_usd: 49226
  stipulated_penalties: >-
    None as such — Order 8 allows completing the Findlay Road Phase II Sewer Improvement Area
    Project (~$557,000 Supplemental Environmental Project: replace on-site septic systems along
    Bluelick Road, Bath Township, with public sanitary sewer, eliminating a county-owned package
    plant; wastewater then treated by the City of Lima) IN LIEU of the $49,226 payment; failure
    to complete within 210 days revives the cash penalty (Order 9).
  status: modified (Order No. 1 modified by the 2014 Modified DFFO; see supersedes chain)
  summary: >-
    The foundational SSO-elimination consent instrument. Findings: the county's 1997-05-01
    General Plan promised elimination of all Shawnee POTW SSOs by 2003-05-01 (Finding 7);
    the county violated the 2PK00002*GD compliance schedule on all four milestones (Finding 8);
    documented overflow days Jan 2001-Dec 2003 at eight Shawnee SSOs (Cam Court 52, Elmview
    Drive 28, Riverview Drive 44, Seriff Road 2, Shawnee Country Club 60, Shawnee Country Club
    Main 15, Shawnee Road 4, Zurmehly Road 58 - to the Ottawa River or unnamed tributaries;
    Findings 6) and two American Bath SSOs May 2002-Mar 2003 (Manhole T-45 1, Meadow Apartments
    AB-03-020 14 - to Pike Run; Finding 10). Seriff Road and Shawnee Road SSOs closed 2001
    (Finding 9). Orders set the SECAP regime and a 2015-12-31 eliminate-all-SSOs deadline,
    assess $49,226 with the Findlay Road SEP alternative, and require warning signs at SSOs.
  note: >-
    [verified] All figures read from the journalized instrument itself. The compliance-schedule
    violations (Finding 8) date the original promises: detailed plans 1999-12-07, bids
    2000-10-31, construction start 2000-11-03, completion + elimination 2003-05-01.
