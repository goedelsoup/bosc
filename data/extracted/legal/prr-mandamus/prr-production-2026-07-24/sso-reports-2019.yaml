# Structured read of the two 2019 monthly SSO reports produced in batch 3 (item 9).
# Native Excel workbooks, read cell-by-cell (openpyxl, data_only); gallons and times
# copied as entered by the county. NOT a records-feed envelope (no classified payload
# block) — a corpus artifact for the hydrology/story layer, like the meeting indexes.
meta:
  subject: Shawnee 2 monthly SSO reports — January and March 2019 (the only months produced)
  source_dir: data/documents/legal/prr-mandamus/prr-production-2026-07-24-sanitary/9/SH & AB
    SSO Findings and Orders/2019 SSO Reports/
  files:
  - SSO Report For Jan19.xlsx
  - SSO REPORT March 19.xlsx
  method: openpyxl cell read (values only); every non-empty event row transcribed, including
    the negative-gallon rows the county's own monthly totals exclude
  caveats:
  - >-
    Only two months were produced. Whether February and April-December 2019 reports exist
    (Cam Court was removed 2019-02-26 mid-quarter) is a completeness question for the batch-3
    responsiveness analysis, not evidence of absence.
  - >-
    Several rows carry NEGATIVE gallon figures (metering artifacts or reverse-flow readings;
    the workbooks do not explain them). They are preserved verbatim below and excluded from
    the county's printed monthly totals, which are also preserved.
  - Rain attribution as printed in both workbooks — "All Rain Information From Amanda Lakes".

