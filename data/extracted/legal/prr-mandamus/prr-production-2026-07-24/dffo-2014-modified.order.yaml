  summary: >-
    The five-year extension the county requested on 2011-12-09: SSO elimination moves from
    2015-12-31 to 2020-12-31, restructured as Phase 1 (collect-pump-treat: interceptor, pump
    station, headworks/EQ basin/UV by July 2015), a monitored-flow year, then Phase 2 WWTP
    capacity designed from actual flows. Signed by Director Scott J. Nally 2013-12-31 and
    Commissioner Jay Begg 2013-12-05; journalized 2014-01-06. Crucially, Order 1.A.iii
    designates the equalization-basin overflow as TEMPORARY, and Order 1.A.vii requires its
    elimination along with all SSOs by 2020-12-31 — the provision the county later argued
    against ("the EQ 'bypass' ... was always part of the design", per its 2022-10-26 letter
    quoted in OEPA's 2023-02-02 response).
  note: >-
    [verified] from the journalized instrument. Six Shawnee SSOs and one American Bath SSO
    remained as of these findings (Finding 5).
