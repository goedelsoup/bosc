# Lima WWTP — Outfall 001 total-ammonia-nitrogen BENCH data, weeks of 2026-01-18 .. 2026-02-22.
# Produced by the City of Lima in PRR batch 2 (2026-08-24) against Part B item 3 ("the underlying
# lab/bench data"). Six weekly Excel workbooks, one per week, tab "Ammonia Benchseet" (sic).
#
# WHAT THIS IS. The raw analytical record beneath the reported discharge-monitoring numbers: each
# day's duplicate analyses of the final effluent, as run by plant staff. The corpus has never held
# a primary lab record before — every effluent figure in it until now was a REPORTED value (the
# permittee's DMR submission, read back out of EPA ECHO). This closes the chain to its source and
# lets the reported statistics be independently recomputed rather than taken on the permittee's word.
#
# TRANSCRIPTION. Values are read programmatically from the committed .xlsx (sample ID "001",
# the final-effluent point), not re-keyed. `replicates` are the two duplicate analyses exactly as
# recorded; `mean_mg_l` is their arithmetic mean, computed here. Rounded to 4 dp — the workbooks
# carry 3-4 significant figures.
meta:
  subject: Lima WWTP Outfall 001 — total ammonia-N (as N) bench analyses, Jan-Feb 2026
  facility: City of Lima WWTP, 1200 Ft. Amanda Rd (NPDES 2PE00000*PD / OH0026069)
  parameter: Nitrogen, ammonia (NH3-N), storet 00610
  unit: mg/l
  matrix: final effluent (bench sample ID "001")
  analyst: 'BG (initials as recorded on every result row in this range)'
  source_dir: data/documents/legal/prr-mandamus/prr-production-2026-08-24-lima/
  custody: data/extracted/legal/prr-mandamus/bosc-prr-production-2026-08-lima.custody-manifest.yaml
  prr_item: 'Part B, item 3'
  sampling_regime: >
    Sunday through Thursday, five days per week. Every workbook covers Sun-Thu and none records a
    Friday or Saturday effluent result. This is the plant's regime, not a production gap: the
    February monthly average recomputed over the 20 Sun-Thu days reproduces the reported DMR value
    (see `reconciliation`), which it could not do if Friday/Saturday results existed and were withheld.
  qualifiers:
    '*': 'ND - Non-detect (benchsheet legend; not used in this range)'
    '**': 'Estimate; Over Curve (benchsheet legend; used on two non-001 rows in this range)'
    '***': >
      "Estimate; matrix spike failed" (benchsheet legend, week of 02/22 workbook). The same
      workbook's Comments column records the cause per day: the matrix spike for 001 sampled
      2/22/26 was low, 2/23/26 was low, and 2/24/26 was high. ⚠️ These three QC-failed estimates
      are INSIDE the February monthly average the City reported to Ohio EPA, and EPA ECHO carries
      that reported value with no qualifier attached.

