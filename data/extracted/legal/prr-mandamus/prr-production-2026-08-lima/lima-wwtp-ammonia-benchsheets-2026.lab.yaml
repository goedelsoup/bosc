# ── The three-layer reconciliation ────────────────────────────────────────────────────────────
# bench (this file) -> the City's self-reported noncompliance notification -> EPA ECHO's DMR record
# (data/extracted/oepa/lima-wwtp-OH0026069.dmr.yaml, pulled 2023-01..2026-06). Independent layers:
# the bench numbers are the City's own lab, the ECHO numbers are what EPA holds. February ties out.
reconciliation:
  february_2026:
    verdict: reconciled
    monthly_average:
      recomputed_from_bench: 4.0061
      n_sample_days: 20
      reported_echo_mo_avg: 4.007
      permit_limit: 1.7
      note: agrees to four significant figures.
    weekly_maximum:
      recomputed_from_bench: 7.5209
      week: 2026-02-01..2026-02-07
      reported_echo_wkly_max: 7.521
      permit_limit: 2.6
      note: agrees to four significant figures; the worst week is the first week of February.
    second_weekly_event:
      recomputed_from_bench: 5.2368
      week: 2026-02-08..2026-02-14
      reported_on_city_form: 5.2
      permit_limit: 2.6
      note: >
        ⚠️ ECHO does NOT carry this as a separate row. The City's own February notification lists
        SIX exceeded limits — two distinct weekly events (283 kg/day + 7.5 mg/l, and 270 kg/day +
        5.2 mg/l) — while ECHO's monthly rollup reports only the worse of the two weeks. On this
        parameter the permittee's self-report is FINER-GRAINED than the federal record, so an
        exceedance count taken from ECHO alone undercounts the discrete events.
  january_2026:
    verdict: not-reconcilable-from-the-produced-record
    reported_echo_mo_avg: 2.2413
    reported_echo_wkly_max: 7.117
    permit_limits: {thirty_day_concentration_average: 1.7, seven_day_concentration_maximum: 2.6}
    why:
    - >
      The weeks of 2026-01-04 and 2026-01-11 were not produced. January's 30-day average therefore
      cannot be recomputed: the production begins 2026-01-18, and the nine produced January days
      average 4.32 mg/l against a reported month of 2.2413 — consistent with a low first half of
      the month, but not verifiable from what is in hand.
    - >
      The week of 2026-01-25 holds only FOUR results. The 2026-01-29 row is present with the
      analyst's initials but the Conc cell is BLANK, and no 2026-01-30 sample row exists. The four
      produced days average 8.1772 mg/l, which does not reproduce the reported 7.117.
    open_question: >
      [open] If the reported 7.117 mg/l is the mean of five days for the week of 2026-01-25, the
      missing 2026-01-29 result would have to be ~2.88 mg/l. That is ARITHMETIC, not evidence —
      recorded to make the gap precise, and it is exactly the one datum that would let January's
      worst week be independently verified. Sought in the follow-up request.
  parameters_cited_by_the_nov_but_absent_from_echo:
    cbod5: >
      [open] The 2026-07-16 NOV (data/extracted/oepa/lima/edoc-4192703.order.yaml) cites effluent
      limit violations for low level mercury, E. coli, TSS, dissolved oxygen, pH-minimum, CBOD5 and
      ammonia. Six of the seven appear in the ECHO exceedance record for 2023-01..2026-06; CBOD5
      appears nowhere in it. Either the violation predates the pulled window, ECHO is incomplete, or
      the NOV's parameter list is over-inclusive. Not resolvable from this production.

# ── What the bench data shows that the reported record does not ───────────────────────────────
observations:
- finding: The failure is a nitrification failure, and the bench data dates its onset to the day.
  detail: >
    Effluent ammonia sits at 0.229 and 0.245 mg/l on 2026-01-18 and 01-19, then climbs through
    1.073 (01-20), 1.773 (01-21) and 2.875 (01-22) to 9.433 (01-26), 9.964 (01-27) and a peak of
    12.140 mg/l on 2026-01-28 — roughly a 50-fold rise inside eleven days. Recovery is equally
    legible: below the 2.6 mg/l weekly limit from the week of 02-15 onward.
  corroborates: >
    The City's stated cause on both notification forms — cold-weather loss of nitrifying bacteria,
    compounded by recent nitrification-tower media replacement, with distributor arms found frozen
    in place. [verified] as the City's own contemporaneous account; the freeze mechanism itself is
    the City's characterisation, not independently confirmed here.
- finding: The tower influent and 601 series bracket where in the process the failure sits.
  detail: >
    The same benchsheets carry Tower Influent, Primary Effluent and point "601". Through the failure
    the 601 series holds ~11-13 mg/l while effluent 001 rises from 0.2 to 12 mg/l — i.e. the loading
    reaching the nitrification stage was not anomalous; what changed is how much of it the towers
    removed. Recorded as a [reference] reading of the produced columns; this file transcribes only
    the 001 series, and the identity of point 601 is not established by the production.
- finding: '[open] Three of the twenty February days carry a failed matrix spike.'
  detail: >
    2026-02-22, 02-23 and 02-24 are flagged "***" — "Estimate; matrix spike failed" — with the
    workbook comments recording the spikes as low, low and high respectively. They are low-value
    days (0.4495, 0.540, 1.6075) inside a month whose reported average is driven by the first two
    weeks, so excluding them would RAISE the monthly average, not lower it. The point is not that
    the reported number is wrong; it is that a QC qualifier present in the City's lab record does
    not survive into the federal record that everyone downstream reads.
