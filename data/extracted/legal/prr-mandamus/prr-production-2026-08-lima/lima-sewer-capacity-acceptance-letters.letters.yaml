findings:
- claim: '[verified] No acceptance letter in this production concerns the BOSC campus.'
  basis: >
    All ten letters were read. None names 4110 N. Cole Street, Bistrozzi LLC, Google, Project BOSC,
    a data center, or any large water-cooling user. Nine are residential/small-commercial force
    mains and sewer stubs; the largest identified user is the Procter and Gamble Reservoir Road
    expansion (2024-06-04).
  why_it_matters: >
    This is the production's answer to Part C item 6, which asked specifically for data-center
    service records. The City produced its capacity-letter series and that series does not contain
    one. ⚠️ Read carefully: this is a negative result about THIS PRODUCTION, not a verified negative
    about the world. Three readings remain open and the production does not distinguish them —
    (a) the campus never sought CITY sanitary service, which is consistent with the County's own
    2.5 MGD BOSC pump station and forcemain routing to the American Bath plant; (b) any such record
    exists under a different instrument than an acceptance letter; or (c) the production is
    incomplete. No cover letter, privilege log or withholding statement accompanied either batch,
    so the City has not asserted that nothing exists.
- claim: '[open] Two letters concern Harding Highway parcels; neither is connected to the campus.'
  basis: 2024-08-05 (2640 Harding Highway) and 2026-06-04 (2550 Harding Highway, 8-inch sewer).
  caveat: >
    Recorded because Harding Highway (US 30) is a corridor the investigation watches and because
    the 2026-06-04 letter is the most recent instrument in the production. Neither letter names a
    user, a load, or a use. An 8-inch gravity sewer is ordinary commercial service. Do NOT read
    proximity as connection.
- claim: '[open] One letter is on the Cole St / Bluelick corridor the campus sits on.'
  basis: 2024-05-29 — 2-inch low-pressure force main along Bluelick Road and Slabtown Road.
  caveat: >
    ⚠️ A 2-inch low-pressure force main is residential-grinder-pump scale — orders of magnitude
    below campus service, and below the County's 2.5 MGD BOSC forcemain. The road name matches the
    corridor in the Lima SiteProfile; the infrastructure does not match a data center. Recorded so
    that the match is on the record as EXCLUDED, not so that it can be cited as a link.
- claim: '[verified] The City routinely tells Ohio EPA the plant has capacity for new load.'
  basis: >
    Every one of the ten letters asserts the WWTP "is capable of handling the additional flow."
    The series runs 2023-08-31 to 2026-06-04.
  why_it_matters: >
    The last such assertion (2026-06-04) is six weeks before Ohio EPA issued the 2026-07-16 NOV
    finding the same plant in significant noncompliance for ammonia. These are different questions —
    hydraulic capacity for added flow versus treatment performance against an effluent limit — and
    the letters make no treatment-performance claim. Recorded as a documented juxtaposition, not as
    a contradiction. What would make it one is a capacity analysis reconciling the two; Part C item 4
    asked for exactly that and none was produced.
