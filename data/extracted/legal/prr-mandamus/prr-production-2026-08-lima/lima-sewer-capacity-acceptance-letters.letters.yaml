# City of Lima — sanitary-capacity "acceptance letters", 2023-08-31 .. 2026-06-04.
# Produced in PRR batch 2 (2026-08-24), responsive to Part C item 5 ("any wastewater- or
# sewer-service agreement, 'will-serve' or capacity-commitment letter ... for any new or expanded
# user from January 1, 2023 to the present").
#
# WHAT THEY ARE. Short single-page letters on City of Lima Department of Utilities letterhead in
# which the City acknowledges it will accept the sanitary waste from a named project and states
# that the WWTP "is capable of handling the additional flow." They are the City's routine
# capacity-acknowledgement instrument — the artifact a developer's engineer files with Ohio EPA to
# show downstream acceptance. Nine of the ten are signed by Eric Bontrager, P.E.; the tenth
# (2023-08-31) is on the older Mayor Sharetta Smith letterhead, also Bontrager.
#
# TRANSCRIPTION. ⚠️ All ten are Konica Minolta bizhub C360i scans with NO text layer. Contents
# below were read by OCR (tesseract, 300 DPI render) and reviewed against the images. Street names,
# pipe diameters and dates are legible and high confidence; the SIGNATURES are handwritten and were
# NOT read from the script — the signer is identified from the typed name block beneath each.
