# ── Findings ──────────────────────────────────────────────────────────────────────────────────
findings:
- claim: '[verified] The City''s collection system discharges to Pike Run at seventeen points.'
  basis: >
    Form 2A III.A lists 7 CSO outfalls on Pike Run (011, 012, 013, 014, 015, 016, 038) and II.B.4
    lists 10 constructed sanitary-relief points on Pike Run Ditch (329-338), each with coordinates.
    Counted from the tables above.
  why_it_matters: >
    Pike Run is the receiving water of the BOSC campus's 60-inch storm outfall
    (data/extracted/plans/bosc-site-footprint.yaml; SWP3 at data/extracted/plans/4091286.engineering.yaml).
    The corpus has modelled Pike Run as the campus's stormwater receiving reach; this establishes
    that the same reach is already the relief point for a seventh of the City's combined system.
    ⚠️ This is a shared-receiving-water finding, NOT a claim that the campus discharges sanitary
    flow to Pike Run, and NOT a claim about how often these points activate — the form reports
    their existence, not their frequency. Activation frequency is in the CSO annual reports, which
    were NOT produced (Part E item 10).
- claim: '[verified] The corpus previously understood "five" as a CSO count; it is an event cap.'
  basis: >
    data/extracted/oepa/2PE00000.npdes.yaml records "CSOs reduced to five events per year (p84)"
    from the permit, and the ECHO DMR summary carries 5 overflow outfalls. The application lists
    20 distinct CSO outfalls and 34 sanitary-relief points. The permit's five is a performance
    condition; ECHO's five is the subset that reports monitoring data. Neither is the inventory.
- claim: '[verified] The City sought no loading increase at renewal.'
  basis: >
    The antidegradation addendum, section B, is checked "Renewal NPDES application ... with no
    requested increase in loading of currently permitted pollutants", and Form 2A II.D.5 answers
    "No" to planned expansion of treatment capacity during the life of the permit.
  why_it_matters: >
    Filed 2022-03-01. The 2.5 MGD BOSC pump station and forcemain the County advertised in June 2025
    (data/extracted/legal/prr-mandamus/bosc-prr-production-2026-06-12.response-index.yaml) postdates
    it, and routes to the County's American Bath plant rather than the City's. Recorded as the
    City's stated position at renewal — not as evidence about the campus, which did not yet exist
    as a project on this record.
- claim: '[open] The most recent year in the application ran at 90% of design flow.'
  basis: >
    Form 2A II.D.2 gives annual average daily flow of 13.04, 13.02 and 16.65 MGD against an 18.5 MGD
    design. EPA ECHO's 2023-01..2026-06 record gives a 13.068 MGD mean (70.6% of design).
  caveat: >
    The application does not label its three years. Filed 2022-03-01, "This Year" most plausibly
    means calendar 2021, but the form does not say so and the City's fiscal convention is unknown.
    The 16.65 figure is therefore an UNDATED high-water mark, not a 2021 datum. It matters because
    headroom against 18.5 MGD is the quantity Part C item 4 asked for and no capacity analysis was
    produced — 16.65 would leave ~1.85 MGD, 13.07 would leave ~5.4 MGD, and the difference decides
    whether the plant has room for a large new user. Resolving the year is a follow-up item.
- claim: '[verified] The City documented an error in its own filed form.'
  basis: >
    Form 2A II.B.3 reports 60 combined-system lift stations; the applicant's ADDITIONAL INFORMATION
    note states there is one (Baxter Street) and that "the form keeps reverting back to 60".
  why_it_matters: >
    A caution about STREAMS-rendered filings generally: a figure on the form face may be a
    system artifact the applicant could not correct. Read the free-text notes before citing a field.
- claim: '[verified] The tertiary bypass was used 85 times in the year before filing.'
  basis: Form 2A II.E.4 — station 603, internal, 85 uses; plant bypass (057) and secondary bypass (602) zero.
  why_it_matters: >
    Tertiary treatment is the 30 MGD stage; bypassing it sends secondary effluent forward. 85 uses
    in one year is a routine-operation number, not an upset number, and it bears on how much of the
    18.5 MGD design flow is actually treated to tertiary standard. The form gives no volumes.
- claim: '[reference] The contract laboratory and the biosolids-hauling chain are both named.'
  basis: >
    Alloway Testing, 1101 N. Cole Street — the same Cole Street corridor as the campus (4110 N.
    Cole St.) and the County's American Bath WWTP (3226 N Cole Street). Biosolids transport is
    Republic Services, receiving is Wright Consolidated.
  caveat: >
    Shared street address range is proximity, not a relationship. Recorded because the corpus tracks
    the Cole Street corridor, not because any connection is established.
