subject: >-
  Sub. H.B. No. 314, 136th Ohio General Assembly — As Passed by the House. Amends
  R.C. 149.43 (Ohio Public Records Act) to restrict "harassing or disruptive"
  records requests and to let public offices engage private contractors to answer
  "voluminous" requests.

