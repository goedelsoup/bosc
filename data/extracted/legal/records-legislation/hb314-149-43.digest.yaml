# ----------------------------------------------------------------------------
# What the committee substitute changed (As Introduced → As Passed by the House)
# Verified by textual diff of the two ingested PDFs. The substitute grew the bill
# by 6 pages and added 6 cosponsors; the operative changes are below.
# ----------------------------------------------------------------------------
substitute_changes:
  harassing_or_disruptive_action:
    - tag: verified
      change: prospective-ban-capped
      division: "(B)(2)(c)(iii)"
      introduced: >-
        A future-request order "remains in force INDEFINITELY unless the order provides
        for its expiration after a specified period of time."
      passed: >-
        The order runs "for a period of up to FIVE YEARS"; a request in violation lets
        the court extend it for a period at the court's discretion.
      direction: requester-protective   # a hard 5-yr cap replaces an open-ended ban
    - tag: verified
      change: anonymous-circumvention-fine-added
      division: "(B)(2)(c)(iii)"
      passed: >-
        NEW: a person who submits a request anonymously to circumvent an order may be
        fined up to $100 per violation.
      direction: office-protective
    - tag: verified
      change: requester-fee-shift-added
      division: "(B)(2)(c)(iv)"
      introduced: "No fee recovery for a requester who defeats the office's action."
      passed: >-
        NEW (B)(2)(c)(iv): if the court finds the requests were NOT intended to harass or
        disrupt, it MAY award the requester reasonable attorney's fees and litigation
        expenses against the office that sued (subject to R.C. 9.86). This inserted a new
        clause and renumbered the exemptions list from introduced (iv) to passed (v).
      direction: requester-protective
  voluminous_contractor_route:
    - tag: verified
      change: fee-cap-added
      division: "(B)(6)(b)(i)"
      introduced: >-
        Office "may include the cost of the contractor's services in calculating the
        cost involved in providing the copy" — no explicit ceiling.
      passed: >-
        NEW ceiling: including contractor cost "does not permit" charging "a fee in
        excess of the highest permissible fee" in the existing fee structure.
      direction: requester-protective
    - tag: verified
      change: contractor-duties-clause-added
      division: "(B)(6)(b)(ii)"
      passed: >-
        NEW: the contractor must promptly dispose of copies, return originals, not use
        the records for profit outside the engagement, and not disclose redacted
        information.
      direction: guardrail
  net_read:
    tag: inference
    note: >-
      The committee softened the harass/disrupt action's worst edge for a requester
      (indefinite ban → 5-year cap) and added a fee-shift for a wrongly-sued requester,
      while adding anti-circumvention teeth and confidentiality duties on the contractor
      route. The tolling provision (B)(2)(c)(ii) — the sharpest lever against the corpus's
      delay theory — was present in BOTH versions and survived unchanged.

bill:
  number: "Sub. H.B. No. 314"
  title: >-
    To amend section 149.43 of the Revised Code to restrict harassing or disruptive
    public records requests and permit private contractors to respond to voluminous
    public records requests.
  primary_sponsors: ["Rep. Isaacsohn", "Rep. Ray"]
  cosponsors: ["Rep. Abrams", "Rep. Brennan", "Rep. Miller, J.", "Rep. Russo", "Rep. Schmidt", "Rep. Young"]
  vehicle: >-
    Substitute bill; amends R.C. 149.43 in full and (Section 2) repeals the existing
    section — the standard amendatory form, not a wholesale rewrite of the Act.

# ----------------------------------------------------------------------------
# The two operative mechanisms this bill adds (both in division (B))
# ----------------------------------------------------------------------------
new_mechanisms:

  harassing_or_disruptive_action:
    tag: verified
    division: "(B)(2)(c)"
    location: "bill body ≈ printed pp. 28-30 (PDF pp. 27-29)"
    summary: >-
      Creates an affirmative court action FOR the public office. Where a requester
      submits multiple related or unrelated requests to the same office and, based on
      the VOLUME or the REPEATED NATURE of the requests, the office "has reason to
      believe" they are intended to harass the office or to disrupt its essential
      functions, the office may sue the requester in common pleas court (county where
      the office is located) to limit or deny the requests.
    mechanics:
      - "Proceeds as an ordinary civil action under the Ohio Rules of Civil Procedure; the requester gets notice and an opportunity to be heard. [(B)(2)(c)(ii)]"
      - "TOLLING: while the action or any appeal is pending, the office's duty to respond to the requests is tolled. [(B)(2)(c)(ii)]"
      - "On a preponderance finding of harass/disrupt intent, the court may limit or deny the requests. [(B)(2)(c)(iii)]"
      - "If the court also finds the requester likely to submit future harassing/disrupting requests, it may enjoin future requests to that office for up to FIVE YEARS; a violation can extend the order. [(B)(2)(c)(iii)]"
      - "A person who requests anonymously to circumvent such an order may be fined up to $100 per violation. [(B)(2)(c)(iii)]"
    requester_fee_shift:
      tag: verified
      division: "(B)(2)(c)(iv)"
      summary: >-
        If the court determines the requests were NOT intended to harass or disrupt,
        it MAY award the requester (against the office that sued) reasonable attorney's
        fees and litigation expenses incurred in the action — discretionary ("may"),
        and subject to R.C. 9.86 (immunity).
    exemptions_from_the_action:
      tag: verified
      division: "(B)(2)(c)(v)-(vii)"
      does_not_apply_to:
        - "A journalist as defined in (B)(9)(c)."
        - "A pro se litigant requesting records pertaining to litigation in which the pro se litigant is a NAMED PARTY."
        - "A state agency / public college or university / public defender / other government attorney (and their staff/agents), with a carve-back for a public defender's non-work-scope requests."
      guardrails:
        - "No court shall limit, deny, or restrict a listed requester's access under this division. [(B)(2)(c)(vi)]"
        - "An office may not bring the action against a known/suspected public defender unless the requester fails to answer a (B)(11) request for evidence within 5 business days. [(B)(2)(c)(vii)]"
      evidence_demand:
        division: "(B)(11)-(B)(12)"
        note: >-
          An office may demand documentary evidence that a requester falls within an
          exemption; the evidence produced in response is itself non-public
          ((A)(1)(ccc)). Attorney-client / work-product materials cannot be compelled.

  private_contractor_for_voluminous_requests:
    tag: verified
    division: "(B)(6)(b)"
    location: "bill body ≈ printed pp. 31-32 (PDF pp. 30-31)"
    summary: >-
      If a request is "voluminous and it is therefore reasonable to do so," the office
      may engage a private contractor to respond — INCLUDING making required redactions
      — on the office's behalf, and may include the contractor's services in the cost to
      produce the records.
    mechanics:
      - "Fee cap preserved: including contractor cost may NOT push the fee above the highest permissible fee in the existing fee structure (B)(1)(b). [(B)(6)(b)(i)]"
      - "Contractor duties: promptly dispose of copies, return originals, not use records for profit outside the engagement, and not disclose redacted information. [(B)(6)(b)(ii)]"
      - "'Hours to produce' (B)(23) now expressly includes hours worked by a private contractor engaged under (B)(6)(b)."
      - "In the promptness/mandamus inquiry, a court SHALL NOT consider whether engaging a private contractor would have produced records faster. [bill body ≈ printed p. 23 / PDF p. 22]"

# ----------------------------------------------------------------------------
# What the bill leaves UNCHANGED that the corpus relies on
# ----------------------------------------------------------------------------
unchanged_load_bearing_provisions:
  - tag: verified
    division: "(C)(3)"
    location: "≈ printed p. 40 (PDF p. 39)"
    finding: >-
      The statutory-damages engine is intact: $100 per business day of non-compliance
      with a (B) obligation, from the day the requester files a mandamus action, to a
      $1,000 cap; injury "conclusively presumed"; "not a penalty" but compensation for
      lost use. The mandamus remedy the corpus is pursuing survives this bill.
  - tag: verified
    division: "(C)(1)(b)"
    finding: >-
      The mandamus path (aggrieved requester → writ + court costs + statutory damages,
      attorney's fees available) remains the requester's mechanism. HB 314 adds a
      SEPARATE, office-initiated (B) action; it does not replace division (C).

# ----------------------------------------------------------------------------
# Relevance to the relator's public-records program (Cory Parent / BOSC)
# ----------------------------------------------------------------------------
bosc_relevance:
  - tag: inference
    point: >-
      The relator's methodology — voluminous, multi-office, iterative PRRs under
      R.C. 149.43 (Allen County commissioners, ASWCD, sanitary engineering, school
      district, et al.) — is the exact profile both new mechanisms target: "voluminous"
      requests (contractor-fee route) and "multiple related or unrelated requests …
      volume or repeated nature" (harass/disrupt action).
  - tag: inference
    point: >-
      The tolling provision (B)(2)(c)(ii) is the sharpest edge against the corpus's core
      theory. The mandamus analysis frames "unreasonable delay = constructive denial"
      as the live §149.43(B) violation that powers (C)(3) damages
      (docs/legal/mandamus-analysis.md). An office that files a harass/disrupt action
      TOLLS its own duty to respond while the action and any appeal are pending — turning
      delay from a liability into a litigated stay.
  - tag: inference
    point: >-
      Contractor-fee exposure: an office may now bill the relator for a private
      contractor's review/redaction of a voluminous request (capped at the highest
      statutory per-page fee), and a mandamus court may not credit the office for NOT
      using a contractor to go faster. Cost becomes a friction lever on breadth.
  - tag: open
    point: >-
      Is the relator categorically exempt? Not obviously. The pro se exemption is narrow
      — records "pertaining to litigation in which the pro se litigant is a named party,"
      which reaches the records at issue in the relator's own PRR mandamus but not the
      broader research corpus. The journalist exemption ((B)(9)(c): "engaged in …
      disseminating information for the general public" through a "news medium") is a
      plausible fit given the published investigative series, but it is untested here and
      turns on whether the Watermark Directory qualifies as a "news medium." [open]
  - tag: open
    point: >-
      Enacted-text tracking. This is the As-Passed-by-the-House version. Senate
      amendments, any conference version, the effective date, and the final enacted R.C.
      149.43 language are [open] ingest targets before any of the above is relied on as
      current law.

