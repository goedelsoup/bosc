# Defiance (Defiance County, OH) — the two enforcement actions ECHO counts against the Defiance
# WWTP (NPDES OH0024899 / Ohio EPA 2PD00013), characterized.
#
# Provenance vocabulary (see docs/investigative-method/ENRICHMENT.md):
#   [verified]  = stated in a captured primary record (cite file + page) or in a machine-readable
#                 federal system of record, read on a dated pull
#   [reference] = secondary / self-published source, not a controlling record
#   [inference] = reasoned from verified facts, labelled as such, reasoning shown
#   [open]      = not established by any captured source — do NOT assert
#
# WHY THIS FILE EXISTS. Issue #392 recorded that ECHO showed `informal_enf_count: 1` and
# `formal_enf_count: 1` for OH0024899 with `compliance_status: null`, and that both actions were
# uncharacterized — "a documented analytical gap that undermines the clean 'dilution headroom =
# compliance' thesis." Two integers are not a finding. What follows is what each of those two
# integers actually is: what instrument, issued by whom, on what date, over what conduct, on what
# terms, and whether it is closed.
#
# THE HEADLINE. The two actions have nothing to do with dilution and everything to do with the
# plant and its sewers. The formal action is a FEDERAL administrative order over four DMR-level
# permit violations (chlorine, an unrepresentative sample, a numeric effluent violation, and a
# failure to submit DMRs) whose remedy is scored as an ammonia reduction; the informal action is a
# STATE letter over sanitary sewer overflows caused by a broken force main. A river with ten-to-one
# low-flow headroom does not stop a plant from bulking, and does not stop a pipe from cracking. The
# gap #392 named is real: dilution headroom never was the variable these actions turn on.

meta:
  subject: >-
    The one informal and one formal enforcement action ECHO counts for Defiance WWTP
    (NPDES OH0024899), characterized by type, date, conduct, terms and resolution status
  kind: enforcement-characterization
  site: defiance
  npdes_id: OH0024899
  ohio_epa_permit: 2PD00013
  frs_registry_id: '110000544082'
  captured_for: issue 392 (epic 1264, readiness(defiance))
  extracted_at: '2026-08-05'
  checked_on: '2026-08-05'
  method: >-
    Two independent routes, recorded separately. (1) EPA ECHO's CWA services —
    dfr_rest_services.get_dfr for FRS 110000544082 and case_rest_services.get_case_report for case
    05-2024-0328 — read 2026-08-05 against the ICIS-NPDES extract of 2026-07-31. (2) Ohio EPA's
    eDocument public portal (edocpub.epa.ohio.gov), scripted, by Entity Name "DEFIANCE WWTP":
    1,097 documents, of which 950 carry Secondary ID 2PD00013. The portal's NPDES doc-type
    histogram for this facility is the negative that scopes the search: 2 NOV, 3 ROV/RTC, 7 DFFO,
    3 Judicial Order, 22 Inspection or Compliance Review, 37 Director's Authorization, 30 Permit,
    764 Report, 58 Plan, 20 Monitoring or Sampling, 1 Technical Assistance. The state document
    behind the informal action was retrieved and is committed; the federal order's own text was
    not (see `open_questions`).
  echo_window: >-
    ECHO's CWA enforcement counts cover 2021-08-01 to 2026-03-31 (the 5-year window it reports for
    this facility). Anything older than 2021-08-01 — including the state consent order that
    actually governs this plant's CSO program — is NOT in those two integers.

