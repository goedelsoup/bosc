what_this_settles_for_the_thesis:
  tag: '[inference]'
  claim_under_test: >-
    The corpus's Defiance thesis is that this plant is the clean control for Lima — same basin,
    comparable size, the only variable being the receiving water — and that its "tight but not
    violating" dilution is what a mainstem discharge looks like
    (docs/bigger-picture.md §2, data/extracted/defiance/ONBOARDING.md).
  finding: >-
    The two enforcement actions do not threaten that thesis, and they do not support a stronger
    version of it either. They are orthogonal to it. The formal action is about a failing secondary
    process and unfiled DMRs; the informal action is about a cracked force main in a flooded
    creek bed. Neither is a receiving-water failure, and neither would have been prevented by more
    dilution or caused by less. What the pair DOES establish is that "well-diluted" and
    "compliant" are independent properties of a plant — which is the honest form of the point
    #392's rationale was reaching for, and a narrower claim than "dilution headroom = compliance"
    being undermined.
  care: >-
    12 quarters in noncompliance and 4 in significant noncompliance is a worse standing record than
    the phrase "tight but not violating" suggests to a reader. The dilution screen measures one
    thing (design-flow assimilative capacity at the outfall) and the compliance record measures
    another. Do not let the first stand in for the second in prose.

open_questions:
- >-
  The text of EPA Region 5 AOC 05-2024-0328 is not in the corpus. ECHO exposes the case's
  structured record but no document; the Ohio EPA eDocument portal carries state instruments, not
  federal ones, and the DFR's CAEDDocuments list for this facility is empty. A FOIA request to EPA
  Region 5, or the ECHO enforcement case report page, would be the route. `[open]`
- >-
  The three Judicial Order documents on 2PD00013 (docids 51767, 3862641, 3944039; dated
  2010-03-02, 2010-12-29, 2012-12-20) would date the original and first-amended consent orders
  behind Case No. 10-CB-40433. Not retrieved. `[open]`
- >-
  The SSO volume discharged to Preston Run, the Maumee and the Auglaize between 2026-03-31 and
  2026-04-10 is not stated in the NOV/ROV. The City's SSO 5-Day Notification of 2026-04-15 would
  carry it; it was not located in the portal under this issue. `[open]`
- >-
  Two Director's Authorizations on 2PD00013 postdate this pass (docids 4182152 of 2026-07-07 and
  4207138 of 2026-07-28) and are unread. They are the newest NPDES documents on the facility.
  `[open]`
