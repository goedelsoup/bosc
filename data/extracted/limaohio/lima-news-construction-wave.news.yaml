kind: lima_news_wave
subject: >-
  The Lima News (LimaOhio.com) Q2–Q3 2026 construction & community-reaction wave —
  the first post-permit CONSTRUCTION-PHASE coverage of the Google / Project BOSC data
  center: Ohio EPA lime-dust monitoring, the North Cole Street roundabout open house and
  resident concerns, the Chamber proponent pitch, the commissioners' fiber/roadwork
  approvals, the building-trades labor case, and the 2026-07-30 approval of an $8M
  Google-requested sanitary-sewer design change (Res #582-26, the Second Amendment).

provenance:
  source_path: data/documents/limaohio/
  publisher: The Lima News (LimaOhio.com), an AIM Media Midwest paper
  layer: web_capture   # secondary news; article text read from the captured syndication bytes
  capture_date: '2026-07-30'   # latest fetch: the 2026-07-30 sewer article (direct limaohio.com print/PDF). The 2026-04/05 Yahoo syndication-mirror set was fetched 2026-07-13.
  content_verified: '2026-07-30'   # each article's own datePublished (below) is authoritative; the newest content read into the corpus is the 2026-07-30 sewer article. Earlier bulk read: 2026-07-13.
  evidence: >-
    Secondary news reporting. The three 2026-04/05 articles are committed as verbatim Yahoo
    News syndication-mirror bytes (`*.yahoo-mirror.html`); Yahoo hosts the article under
    provider "The Lima News, Ohio" with the canonical limaohio.com URL, byline, and ISO
    datePublished preserved in the page JSON-LD, so figures/quotes are transcribed verbatim
    from the captured article body. The 2026-07-30 sewer-design-change article is instead a
    DIRECT canonical-publisher capture — the verbatim limaohio.com page saved as a print/PDF
    (a manual browser pull), not a syndication mirror — so its figures/quotes are transcribed
    from the publisher's own bytes.
  retrieval_caveat: >-
    limaohio.com is CAPTCHA/bot-gated and returned HTTP 403 to every automated fetch, and no
    Wayback snapshot exists for any URL (checked 2026-07-13). The canonical publisher bytes are
    not retrievable here; the Yahoo syndication mirror is the faithful capture path. The
    2026-06-22 Wendel op-ed, the 2026-07-09 commissioners item, and the 2026-07-14
    resident-transparency item were not syndicated to Yahoo/AOL/MSN (re-checked 2026-07-14) —
    their substance is confirmed at the search-snippet level and extracted as [reference]; a
    full raw byte capture is OWED (see data/documents/limaohio/SOURCES.md). The 2026-07-30
    sewer-design-change article, by contrast, was captured DIRECTLY from limaohio.com as a
    print/PDF via a manual browser pull (the .limaohio-print.pdf) — the collection's first
    canonical-publisher byte capture, confirming the manual-pull path the owed items still need.
  tags: [reference, news, lima, bosc, google, construction-phase, story, record]

headline_findings:
  first_construction_impact_signals:
    finding: >-
      This wave is the FIRST coverage on record of the campus's CONSTRUCTION-PHASE impacts,
      distinct from the permitting-stage record the corpus has carried to date. Two items are
      construction-impact signals: (1) Ohio EPA on-site monitoring of lime kiln dust leaving the
      site (2026-05-11), and (2) resident concerns about roundabout/construction traffic at a
      Port Authority open house (2026-05-15). Both post-date the draft air permit and precede
      the data center's own operation.
    significance: >-
      The record moves from "will this be permitted / who is behind it" to "what is the build
      doing to the ground and the neighbors now." Logged as the first post-permit
      construction-impact leads (data/site/leads.yaml: LIMA-LIMEDUST, LIMA-CONSTR-TRAFFIC).
    confidence: high

  lime_dust_monitoring:
    finding: >-
      Per an email from Ohio EPA Public Information Officer Anthony Chenault (reported 2026-05-11),
      EPA inspectors visited the North Cole Street site because "lime kiln dust and alkaline powder
      used in drying and stabilizing wet soil" was "being carried off-site by the wind." Verbatim:
      "Ohio EPA asked the company to reduce and contain the spread of dust. The construction company
      has since informed Ohio EPA of its plan to control the dust, which includes additional water
      trucks and monitoring wind conditions during lime kiln application." A Safety Data Sheet
      (United States Lime & Minerals, Inc.) is cited that the dust "can cause irritation in the eyes,
      skin, respiratory system and gastrointestinal tract." Chenault: "Agency staff were on site
      last week to observe the dust suppression measures and will visit the site frequently over the
      next few weeks… While dust from construction activities may be seen at times, lime kiln dust
      should not be leaving the property or impacting residents." The same article notes Ohio EPA
      was "finalizing its review of public comments submitted for the draft air permit" (standard
      review).
    significance: >-
      A documented, agency-sourced construction-phase AIR issue — fugitive alkaline dust migrating
      off the property during soil stabilization — separate from the permitted 313 MW backup-genset
      air envelope (see oepa PTI thread). It is the first on-record instance of a regulator taking a
      corrective posture on the active build, not the permit.
    confidence: high

  roundabout_open_house_and_resident_concerns:
    finding: >-
      At a Port Authority of Allen County open house on 2026-05-14 (reported 2026-05-15) at the
      Allen County Sanitary Engineering building, residents pressed the Google-funded North Cole
      Street Improvement Project (roundabouts at N. Cole & SR-115, Beery Rd, and Bluelick Rd).
      Schedule: SR-115 roundabout construction begins 2026-06-01, Bluelick Rd in August, Beery Rd
      TBD. Port Authority communications officer Theresa Pollick: "If we make these improvements, it
      is going to help people get around." County Engineer Brion Rhodes planned road repairs for the
      toll of construction vehicles (esp. Bluelick Rd; possible Cole St repaving). Residents said the
      roundabouts benefit Google more than the community: Lynne Focht (Sugar Creek Township, co-owner
      of property ceding a permanent easement near the SR-115 intersection) said she "will never own
      that land again"; David Streeter (Sugar Creek Township): "None of it has to do with long-term
      health to the individuals, to the residents." PAAC executive director Cindy Leis said real
      estate agents had contacted all owners affected by the ROW easements; design engineer Andrew
      Schetter said the Beery Rd approach "was going for least impact." The residents' unifying
      concern was transparency and wanting a Google contact person.
    significance: >-
      Corroborates and freshens the PAAC transparency/well-concerns record (paac-board-minutes:
      transparency_record) into the construction phase, and names the roundabout construction start
      (2026-06-01) and the easement-taking that residents object to. Sugar Creek Township residents
      Focht/Streeter join the corridor-resident thread (cf. Heather Davis, David Streeter,
      Mike Lugibihl in the PAAC minutes).
    confidence: high

  design_developments_corroborate_cmar_and_completion:
    finding: >-
      The 2026-05-15 article's "design developments" section adds primary-adjacent detail on the
      Peterson Construction CMAR: the County agreed to contract Peterson for construction-manager-
      at-risk pre-construction design services (matching Res #378-26, 2026-05-14). Allen County
      Sanitary Engineer Brad Niemeyer said the Engineer's Office had hired a Peterson engineer
      "six months ago," who had taken the data-center design to "30 to 40% completion"; Peterson
      will secure "early procurements for items with long wait times, such as the generator and
      electronic components," and give a guaranteed maximum price at 60–70% design (the County may
      then accept it or look elsewhere). The pump station and forcemain are "the next elements,"
      with work in the fall if Peterson is hired. Niemeyer put the "projected completion of the data
      center… around January to March of 2028."
    significance: >-
      Independent secondary corroboration of the CMAR award (bosc-resolution-ledger #378-26), the
      long-lead generator procurement (ties the 313 MW genset fleet to the build schedule), and the
      pump-station/forcemain sequence (#469-25 → #137-26/#138-26 → #378-26). The ~Jan–Mar 2028
      completion window is a new datable milestone; the "30–40% / 60–70% design" figures are the
      reporter's paraphrase of Niemeyer, not a document — treat as [reference].
    confidence: medium

  sewer_design_change_second_amendment:
    finding: >-
      Reported 2026-07-30 (Craig Kelly) [reference; captured DIRECTLY from limaohio.com as a
      print/PDF — the collection's first canonical-publisher byte capture, see SOURCES.md]: the
      Allen County commissioners approved an $8 million CHANGE ORDER to the ~$31 million Project
      BOSC sanitary-sewer construction contract, to be paid by Google, after Sanitary Engineer
      Brad Niemeyer outlined a Google-requested redesign of the sanitary sewer layout. Original
      design: wastewater — INCLUDING the plant's server-cooling water — drained via a 20-inch force
      main to a pump station on Bluelick Rd, then south down Providence Circle to the county's
      American Bath WWTP (3226 N. Cole St). New design: the pump station moves to the N. Cole St &
      Beery St intersection, adding 8-inch + 16-inch DUAL force mains; up to 500,000 gpd is SPLIT
      between the American Bath plant and the American #2 plant (4140 Diller Rd), and anything
      beyond that is diverted to the City of Lima WWTP. Niemeyer: "We've promised (Google) a
      capacity of two and a half million gallons a day on their worst day, and that's going to be
      very few days." He said the influx "will consist of water from city reservoirs that has run
      through the data center's cooling system anywhere from three to six times, with the only
      additive being chemicals designed to prevent pipe corrosion and bacteria growth" ("People
      have figured out how to treat it"). He tied the reroute to keeping treatment in county hands
      (revenue + rate stabilization): the county sanitary rate is "$57 now, and it'll be $59 (next
      year)," with no increase since 2014. Commissioners Cory Noonan ("We're not maxing ourselves
      out") and Brian Winegardner were present.
    significance: >-
      The agenda anchors this secondary report to a PRIMARY instrument: Resolution #582-26,
      titled "Approve the Second Amendment to the Sanitary Sewer Development Agreement with Project
      Bosc Developer," taken up at 1:00 p.m. on 2026-07-30 (A073026.pdf;
      commissioners/bosc-resolution-ledger #582-26). Only the resolution's NUMBER and verbatim
      TITLE are [verified] (from the agenda); the amendment's actual content is NOT — its text and
      the meeting minutes are not yet in hand. That the news-reported $8M redesign is the SUBSTANCE
      of #582-26 is therefore a LIKELY CORRESPONDENCE [inference] (same meeting, subject, and
      official — Niemeyer), not confirmed amendment content. On that inference, the redesign would
      re-route the campus sanitary/blowdown stream across THREE receiving plants (American Bath +
      American #2 + City of Lima), superseding the single-plant American Bath design in the
      #575-25/#975-25 record, as the operational face of the WWTP Data Center Flows /
      blowdown-treatment keystone (#679-24) and the forcemain CMAR (#137-26 → #378-26) — but that
      linkage awaits the amendment text. The news "~$31M construction contract" is a rounded figure
      that reconciles with, but is not identical to, the #137-26 CMAR RFQ construction estimate
      ($29,834,256). Two figures are directly load-bearing for the hydrology screen and the cooling
      epic: the 2.5 MGD WORST-DAY promised capacity, and the DISCLOSED cooling
      cycles-of-concentration of "three to six times." Both are the County Sanitary Engineer's
      self-report, transcribed as [reference] — a disclosed figure that sharpens the cooling-CoC and
      effluent-dilution questions but must NOT be upgraded to [verified] or fed to a classifier
      (cf. the closed-loop cooling reconciliation harness; the hydrology dilution screen).
    confidence: high

  chamber_proponent_case:
    finding: >-
      At the Lima/Allen County Chamber "Wake, Rattle and Roll" networking event on 2026-04-24
      (Veterans Memorial Civic Center), Regional Growth Partnership EVP Gary Thompson made the
      proponent case without naming the Google project: "They're big investments. They use lots of
      power… this is why northwest Ohio is best suited, because of our ability to harness power and
      energy and our ability to access water." He claimed lifetime jobs value "to the tune of more
      than $201 million" plus "thousands of support jobs… indirect jobs" (a Cenovus/Oregon refinery
      analogy — 600 workers but 1,000 people and 400 contractors on site daily), and urged the
      audience to scrutinize anti-data-center claims (an MIT-article/crypto-mine hyperlink example).
      The article notes Google + AEDG had launched a project website (bit.ly/3OBqdaE →
      allencountydatacenter.com).
    significance: >-
      A proponent-framing piece to weigh, not accept (cf. docs/legal/proponent-analysis.md and the
      AEDG FAQ in aedg-data-center-release). The "access to water" selling point sits directly
      against the corpus's undiluted-at-7Q10 hydrology screen; the "$201M lifetime" and "thousands
      of indirect jobs" figures are RGP's, unsourced here, and larger than the CRA's ~50 permanent
      jobs (cra-agreement).
    confidence: high

  commissioners_fiber_and_roadwork:
    finding: >-
      Reported 2026-07-09 [reference — Yahoo un-syndicated; snippet-confirmed, raw capture owed]:
      Allen County Operations Engineer Mark Droll briefed the commissioners on upcoming construction
      and road closures — buried fiber-optic lines "to facilitate communication between data
      centers," a Fort Amanda Rd / Buckeye Rd roundabout rebuild in summer/fall 2027, and a South
      Thayer Rd repave/expansion between SR-309 and Reservoir Rd. The commissioners voted to approve
      a Road Use Maintenance Agreement (RUMA) among the commissioners, the county engineer, and
      Brightspeed of Ohio for aerial and buried fiber-optic cable to improve high-speed internet
      access; the agreement lets Brightspeed use county-road right-of-way, "foregoing any need to
      purchase easements from property owners."
    significance: >-
      Extends the commissioners' Project-BOSC infrastructure spine into the connectivity layer: the
      buried-fiber-for-data-centers item is the first record of the campus's telecom build, and the
      Brightspeed RUMA is a new instrument (see bosc-resolution-ledger narrative_events 2026-07-09).
      The Fort Amanda/Buckeye roundabout and South Thayer items read as the routine county roadwork
      program, not the BOSC corridor — do not conflate with the N. Cole roundabouts.
    confidence: medium

  building_trades_labor_case:
    finding: >-
      Reported 2026-06-22 [reference — Yahoo un-syndicated; snippet-confirmed, raw capture owed]:
      an op-ed by Brad Wendel, president of the Lima Building and Construction Trades Council,
      framing the Google/American Township data center ($500M, "the largest private-sector
      investment in Allen County history") as long-horizon union work — "hundreds of members"
      employed for "nearly 10 years" — and a draw for young people into the trades.
    significance: >-
      The building-trades proponent voice, corroborating the AEDG "hundreds of construction jobs"
      framing (aedg-data-center-release: capital_and_benefits) and the ~10-year, multi-phase build
      the corpus otherwise documents through the permit/CMAR record. Opinion, lowest priority.
    confidence: medium

  transparency_and_nda_concerns:
    finding: >-
      Reported 2026-07-14 [reference — Yahoo un-syndicated; snippet-confirmed, raw capture owed]:
      residents questioned the transparency of the Allen County (Google / Project BOSC) data center,
      citing backup-generator specifications redacted from the permit record as "proprietary" and
      non-disclosure agreements signed by public officials that keep the company's identity and the
      facility's detailed plans from residents. Only the transparency/redaction/NDA thrust is
      snippet-confirmed; specific equipment counts attributed to the piece by news aggregators are
      NOT transcribed here — they are neither in the captured corpus nor confirmed to appear in this
      article, and await the owed raw capture.
    significance: >-
      Extends the transparency thread the corpus already carries — the County–Bistrozzi mutual NDA
      (legal/prr-mandamus: mutual-nda-bistrozzi) and the PAAC transparency/well-concerns record
      (paac-board-minutes; roundabout_open_house_and_resident_concerns above) — into the air-permit
      layer: the residents' new grievance is the redaction of backup-genset specifications as
      proprietary, which sits against the permitted backup-genset air envelope in the oepa PTI thread.
      The redacted-spec / NDA framing is the confirmed substance; the raw byte capture is owed
      (SOURCES.md). Byline not yet confirmed.
    confidence: medium

