  - 'Highland55 Investments LLC K48-25-11-01-32-005-00 is a multipart parcel returned as two polygon features in the geojson — the 85.619 ac is not double-counted (parcel_acres uses planar polygon area; the CAMA sum counts the parcel once).'
  - 'Deed book/page references are [open] — deferred to the county recorder deed pull (#1328). Parcel id + the CAMA transfer date/amount stand as the conveyance evidence for now.'
  - 'This record commits the boundary + measured acreage + the SSURGO-validated HSG so the onboard SSURGO/HSG step no longer skips (it had been skipped for want of a committed footprint).'
