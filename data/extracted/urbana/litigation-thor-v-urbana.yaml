# ---------------------------------------------------------------------------------------------
# CLAIMS — the eight counts, [verified] as pleaded (Doc #1 §V). The theory of each is Thor's.
# ---------------------------------------------------------------------------------------------
counts:
  - n: 1
    title: "Procedural Due Process"
    basis: "42 U.S.C. § 1983 + Ohio Const. Art. I §§ 1, 16"
    paras: "94–103"
    gist: "Deprivation of a vested property/liberty interest in the data-center use without lawful process (notice, fair BZA hearing, consideration of evidence)."
  - n: 2
    title: "Substantive Due Process"
    basis: "42 U.S.C. § 1983 + Ohio Const. Art. I §§ 1, 16"
    paras: "104–112"
    gist: "The moratorium, application denial, and appeal handling were arbitrary, capricious, and lacking any substantial relation to legitimate land-use regulation."
  - n: 3
    title: "Declaratory Judgment — Moratorium void (Charter § 2.12)"
    basis: "28 U.S.C. §§ 2201–2202"
    paras: "113–117"
    gist: "Charter § 2.12 bars enacting/amending/repealing any zoning or building resolution as an emergency; the moratorium is a de facto zoning amendment."
  - n: 4
    title: "Declaratory Judgment — Moratorium void (Charter § 2.11)"
    basis: "28 U.S.C. §§ 2201–2202"
    paras: "118–123"
    gist: "Res. 2727-26 is not necessary for public peace/health/welfare/safety and does not set forth the specific facts necessitating the emergency."
  - n: 5
    title: "Declaratory Judgment — Moratorium void (Ohio Const. Art. XVIII §3 + R.C. 731.30)"
    basis: "28 U.S.C. §§ 2201–2202"
    paras: "124–130"
    gist: "The emergency exceeds the City's home-rule authority and R.C. 731.30's emergency-ordinance requirements."
  - n: 6
    title: "Declaratory Judgment — Moratorium void (Charter §§ 2.10, 2.16 + Zoning Code Ch. 1113)"
    basis: "28 U.S.C. §§ 2201–2202"
    paras: "131–140"
    gist: "No newspaper publication 7 days before enactment, no Planning-Commission referral, no 10-day notice, and passed on one reading (three required for permanent legislation)."
  - n: 7
    title: "Declaratory Judgment — Moratorium an unlawful impairment of vested rights"
    basis: "28 U.S.C. §§ 2201–2202"
    paras: "141–151"
    gist: "Filing the Feb-13-2026 site-plan application froze the zoning rules (Golf Vill. N. LLC v. City of Powell; Gibson v. Oberlin); the later moratorium cannot retroactively defeat the vested use."
  - n: 8
    title: "Declaratory Judgment — Site-plan denial violated Zoning Code Ch. 1110"
    basis: "28 U.S.C. §§ 2201–2202"
    paras: "152–160"
    gist: "The City denied the application as 'incomplete' by importing Chapter 1161 (major-subdivision) requirements and a traffic study that Chapter 1110 site-plan review does not require — ultra vires."

key_authority_cited:                         # [verified] as cited by Thor — the vested-rights spine
  - "Golf Vill. N. LLC v. City of Powell, 826 F. App'x 426, 433 (6th Cir. 2020) — filing an application 'freezes' the applicable zoning rules"
  - "Gibson v. Oberlin, 171 Ohio St. 1, 5 (1960) — vesting on application for a zoning certificate"
  - "Snyder v. City of Bowling Green, 1996 Ohio App. LEXIS 5580 (6th Dist.) — insufficient emergency basis"

relief_sought:                               # [verified] — Prayer, pp.35–36 (A)–(M)
  - "Compensatory damages (jury)"
  - "Declarations that the Moratorium (Res. 2727-26) is void ab initio on five independent grounds (Charter §§ 2.10/2.11/2.12/2.16, Zoning Ch. 1113, Ohio Const. Art. XVIII §3, R.C. 731.30)"
  - "Declaration that the site-plan denial violated Zoning Ch. 1110 and that the Application was complete"
  - "Declaration of a vested right to the data-center use under the rules in effect at filing"
  - "Preliminary + permanent injunction (Fed. R. Civ. P. 65) barring enforcement of the Moratorium and the amended Zoning Code against the Property, and directing approval of the Application"
  - "Pre-/post-judgment interest; attorney's fees under 42 U.S.C. § 1988; costs"

