#                 instruments are [open]; the recital is corroborated where the corpus already
#                 holds an independent record — see `corroboration`).
#   [inference] — a corroboration combining Doc #1 with existing corpus (e.g. the Nov-2025 CRA
#                 aligns with the Nov-2025 Highland55 deed in land-assembly.yaml).
#   [open]      — not yet in corpus (the nine exhibits; the Common Pleas appeal case number).

