    role: developer
    tag: reference                 # Urbana Daily Citizen (2026); also VP Acquisitions contact on the
                                    # §401 WQC (highland55-findings.md, eDoc 3938244) [verified contact]
    notes: >-
      Developer of record; operates the takedown via single-purpose entities. Public reporting
      names a "Form8tion" Thor unit as the operating vehicle [reference]. NY mailing 25 W 39th St.
  - name: "Form8tion"
    role: thor_operating_unit
    tag: reference                 # named in public reporting as the Thor operating unit; [open] in corpus
    ohio_sos_agent: null           # [open]
    notes: "Reported Thor operating unit; no in-corpus filing yet. Ohio SoS registration [open]."
  - name: "Urbana Owner LLC"
    role: contract_purchaser_spe   # [verified] ¶9 (Doc #1) — the fifth Thor SPE; not yet a grantee
    tag: verified
    mailing_complaint_caption: "3040 Riverside Dr Ste 122, Columbus OH 43221"   # [verified] Doc #1 caption (no auditor row — not yet an owner of record)
    ohio_sos_agent: null           # [open]
    holds_pending: ["K48-25-11-01-36-001-00", "portion of K48-25-11-01-37-001-00"]  # under contract
    notes: "Contract purchaser (not yet grantee) — see `contract_pending`. Added from the federal complaint."
  - name: "Urbana Owner I LLC"
    role: grantee_spe
    tag: verified                  # owner-of-record, auditor CAMA (parcel -30-001-00)
    mailing_auditor: "25 W 39th St, New York NY 10018 (c/o Thor Equities)"  # [verified] PPOwnerAddress
    mailing_complaint_caption: "3040 Riverside Dr Ste 122, Columbus OH 43221"  # [verified] Doc #1 ¶10 caption
    ohio_sos_agent: null           # [open] — SoS registered agent not pulled
    holds: ["vance-brands"]
    notes: >-
      Two [verified] records give DIFFERENT mailings: the auditor PPOwnerAddress is 25 W 39th St,
      New York (c/o Thor Equities); the federal complaint caption (Doc #1 ¶10) lists the entity at
      3040 Riverside Dr Ste 122, Columbus. Which is the entity's operative address, and whether the
      NY line is a Thor-parent c/o, is [inference]/[open] pending the Ohio SoS registered-agent pull.
  - name: "Urbana Owner II LLC"
    role: grantee_spe
    tag: verified                  # owner-of-record, auditor CAMA (parcels -30-005-00, -30-006-00)
    mailing_auditor: "c/o Thor Equities, 25 W 39th St, New York NY 10018"   # [verified] PPOwnerAddress
    mailing_complaint_caption: "3040 Riverside Dr Ste 122, Columbus OH 43221"  # [verified] Doc #1 ¶11 caption
    ohio_sos_agent: null           # [open]
    holds: ["organ-farms"]
    notes: >-
      Same split as Urbana Owner I: the auditor records 25 W 39th St, New York (c/o Thor) while the
      complaint caption lists 3040 Riverside Dr, Columbus. Reconciling the two is [inference]/[open]
      — Urbana Owner II's operative address is not resolved at its recorded (auditor) address.
  - name: "Highland55 Investments LLC"
    role: grantee_spe
    tag: verified                  # owner-of-record, auditor CAMA (parcel -32-005-00)
    mailing: "3040 Riverside Dr Ste 122, Columbus OH 43221"          # [verified] PPOwnerAddress
    ohio_sos_agent: null           # [open]
    holds: ["highland55"]
    notes: >-
      Highland55's auditor mailing (3040 Riverside Dr Ste 122, Columbus) matches the complaint
      caption (Doc #1 ¶12) — the one SPE where the two [verified] records agree. A THIRD address is
      also on record: the §401 WQC prelim-JD cover (eDoc 3938251) lists "Highland Realty Development
      LLC / Urbana Owner I LLC, 720 E Broad St Suite 200, Columbus". All three (720 E Broad, 3040
      Riverside, and the 25 W 39th St NY c/o-Thor line on the Urbana Owner I/II auditor rows) are
      retained; which is each entity's operative address, and how the WQC 720 E Broad line relates,
      is [inference]/[open] pending the Ohio SoS registered-agent pull. The complaint caption lists
      all four SPEs at 3040 Riverside, but the auditor records Urbana Owner I/II at 25 W 39th St —
      so "all four share 3040 Riverside" holds only for the caption, not the auditor record.
      UPDATE (#1354, 2026-08-01): the 720 E Broad line is no longer a lone WQC artefact. The City
      of Urbana's Ord. 4612-24 Exhibit A — the Pre-Annexation Agreement, executed-draft text —
      gives "Urbana0624C, LLC, an Ohio Limited Liability Company ('Company' or 'Developer'), whose
      mailing address is 720 E. Broad Street Columbus, OH 43215", and the City's own public notice
      identifies that entity as "Highland". So TWO independent primary instruments — an OEPA §401
      filing and a City ordinance exhibit — put the project's development vehicle at 720 E Broad,
      and a third (the City's notice) names it Highland. Common control with this SPE graph is a
      strongly corroborated [inference], still not [verified]: no Ohio SoS filing has been read
      (businesssearch.ohiosos.gov remains HTTP 403). See incentive-instruments.yaml.
  - name: "Brand Investments LTD"
    role: seller
    tag: verified                  # PPOwner on the retained residual parcel; grantor of vance-brands + highland55 [reference]
    ohio_sos_agent: null           # [open]
    notes: "Seller of the 133-ac Brand disposition (vance-brands + highland55); retains K48-…-32-021-00."
  - name: "Organ Farms LLC"
    role: seller
    tag: reference                 # grantor of the 97.09-ac organ-farms deed (news [reference] + acreage [inference])
    ohio_sos_agent: null           # [open]
    notes: "Seller of the 97.09-ac block (OR606/3352) via exercise of a prior purchase agreement."
  - name: "Champaign County (Board of Commissioners)"
    role: option_holder
    tag: reference                 # Urbana Daily Citizen (2026-06-14): an unexercised land-purchase option
    notes: >-
      Holds an existing, NOT-yet-exercised land-purchase option agreement with Thor "in the same
      area" [reference]; commissioners reportedly signed before learning of the data-center plan.
      No parcel pinned, no instrument in corpus — [open].

# ---------------------------------------------------------------------------------------------
end_use:
  determination: "Data center campus (\"Urbana Technology Hub\")"
  tag: reference
  basis: >-
    Explicit, repeated public reporting (Urbana Daily Citizen, 2026-02-18 "Data center plans
    revealed at city meeting"; 2026-06-14) names the project a "data center campus", disclosed at
    a public City of Urbana meeting, plus the Thor v. Urbana litigation (tracked under #1263). This
    RESOLVES the [open] end-use carried on lead #447: the substation + build-to-suit framing
    ([verified] from the §401 WQC) now attaches to a publicly disclosed data center. A primary
    instrument that NAMES the facility type (air permit, building permit, or utility interconnection
    showing the MW load) would take the end-use itself from [reference] to [verified] — tracked in
    the sibling #1263 catch-up issues, not this one. The land assembly, developer, considerations,
    and deed references in this register are [verified].

limitations:
  - "Ohio Secretary of State (businesssearch.ohiosos.gov) is not reachable from the build/agent environment (403/DNS-blocked; only vetted connector hosts resolve). The registered-agent lines on every entity are therefore [open] pending a live SoS pull — NOT fabricated. Documented search effort: 2026-07-09."
  - "The Champaign County Recorder's own sequential instrument numbers and the deed-image grantor lines are [open]; the auditor's Official-Record BOOK_NO/PAGE_NO (the OR###/#### references above) are [verified] and are sufficient to retrieve each instrument. A recorder connector is the follow-up."
  - "Grantor identities (Brand Investments LTD, Organ Farms LLC) are [reference] from public reporting, corroborated [inference] by the auditor acreage/price/date triangulation; the deed image confirms them to [verified]."
