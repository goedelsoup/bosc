# Urbana Technology Hub (Thor Equities) — land-assembly register
#
# The multi-LLC land assembly behind the "Urbana Technology Hub" data-center campus at
# SR-55 & S US-68, Urbana Township, Champaign County, OH (FIPS 39021). Closes the [open]
# end-use on lead #447 (highland55-findings.md) and sources the conveyance chain to the
# county recorder / auditor record. #1328 · sub-issue of #1263 · strengthens `record`.
#
# TAG VOCABULARY (per CLAUDE.md / evidentiary-discipline):
#   [verified]  — from a primary government record read directly (here: the Champaign County
#                 auditor CAMA layer, parcel_joined FeatureServer 0, which records the grantee,
#                 the Official-Record deed book/page, the transfer date, and the consideration).
#   [reference] — from public reporting (Urbana Daily Citizen, 2026) — a lead, not a finding.
#   [inference] — a corroboration that follows from combining [verified] + [reference] data
#                 (e.g. grantor identity confirmed by parcel-acreage/price triangulation).
#   [open]      — not yet in corpus (here: the recorder INSTRUMENT NUMBER and the deed-image
#                 grantor line; the Ohio SoS registered-agent filings — see `limitations`).
#
# SOURCE OF THE DEED REFERENCES: the auditor CAMA `BOOK_NO`/`PAGE_NO` fields on parcel_joined
# layer 0 (Champaign County Engineer ArcGIS org HBIN2hfRscrws7eM). Champaign County records
# deeds in Official Record (OR) volumes; "OR601/4948" is volume 601, page 4948. This is the
# auditor's cross-reference to the recorder instrument — [verified] as the deed locator. The
# recorder's own sequential instrument number and the deed-image grantor line are [open]
# pending a recorder-office pull (see `limitations`); the OR book/page is sufficient to
# retrieve the instrument.
#
# SEPARATION (per #447 / #1328 acceptance criterion + BOSC method): this register is kept
# STRICTLY SEPARATE from the Allen-County / Lima Bistrozzi land-assembly graph. No entity,
# parcel, or relationship here cross-references that graph — no filed instrument bridges them.

as_of: "2026-07-09"
site: urbana
county: "Champaign County, OH (FIPS 39021)"
assembly: "Urbana Technology Hub (Thor Equities) — SR-55 & S US-68, Urbana Township"
sources:
  auditor_cama:
    layer: "parcel_joined FeatureServer 0 (auditor CAMA + geometry)"
    org: "Champaign County Engineer ArcGIS Online org (CCEO, HBIN2hfRscrws7eM)"
    url: "https://services5.arcgis.com/HBIN2hfRscrws7eM/arcgis/rest/services/parcel_joined/FeatureServer/0"
    fields_used: [Parcel, PPDeeded, PPOwner, BOOK_NO, PAGE_NO, PPAmount, PPSaleDate, PPAcres, PPClassNumber]
    pulled: "2026-07-09"
  public_reporting:
    - "Urbana Daily Citizen, \"Thor pushing forward with data center\" (2026-06-14) — https://www.urbanacitizen.com/2026/06/14/thor-pushing-forward-with-data-center/"
    - "Urbana Daily Citizen, \"Data center plans revealed at city meeting\" (2026-02-18) — https://www.urbanacitizen.com/2026/02/18/data-center-plans-revealed-at-city-meeting/"
  litigation:
    # Filed federal instrument (#1329) that CORROBORATES this assembly from a primary court
    # source: it adds the fifth SPE and lists a caption address for all four SPEs (the auditor
    # vs caption reconciliation for Urbana Owner I/II stays [inference]/[open], see entities).
    # Full structured read: litigation-thor-v-urbana.yaml.
    instrument: "Complaint, Thor Equities et al. v. City of Urbana, No. 3:26-cv-00196-MJN-CHG (S.D. Ohio, filed 2026-06-19)"
    file: "data/documents/legal/thor-v-urbana/1.pdf"
    establishes: >
      ¶¶8–13 — the four owned parcels and their owning SPEs match this register exactly; the
      OWNED-parcel holding is ~230.346 ac (¶13; = 47.637 + 85.619 + 97.09, the three conveyances
      below). A fifth entity (Urbana Owner LLC) is the contract purchaser of two FURTHER parcels
      (-36-001-00 + a portion of -37-001-00, additional to the 230.346 ac; their acreage is [open],
      see `contract_pending`). [verified] as pleaded.

# ---------------------------------------------------------------------------------------------
# CONVEYANCES — one entry per recorded deed (grantor → grantee), the [verified] transfer chain.
# ---------------------------------------------------------------------------------------------
conveyances:
  - id: vance-brands
    grantee: "Urbana Owner I LLC"
    grantee_tag: verified          # PPDeeded/PPOwner on parcel K48-25-11-01-30-001-00
    grantor: "Brand Investments LTD"
    grantor_tag: reference         # Urbana Daily Citizen (2026-06-14): Brand sold two parcels, 133 ac
    grantor_corroboration: inference  # 47.637 + 85.619 = 133.256 ac ≈ the reported "133 acres";
                                       # residual Brand parcel K48-…-32-021-00 (OR601/4518) confirms
                                       # Brand as the immediate prior holder in this block.
    parcels: ["K48-25-11-01-30-001-00"]
    acres: 47.637                  # [verified] PPAcres
    consideration_usd: 2143665     # [verified] PPAmount
    conveyance_date: "2025-08-22"  # [verified] PPSaleDate (transfer/recording date)
    deed_reference: "OR601/4948"   # [verified] auditor BOOK_NO/PAGE_NO — Official Record vol 601 p 4948
    recorder_instrument_no: null   # [open] — recorder-office sequential doc no. not yet pulled
    situs: "S US HWY 68"
    class_number: 110              # agricultural (CAUV)
    notes: >-
      The "Vance Brands" parcel of the Highland55 §401 WQC filings (highland55-findings.md).
      Owner-of-record mailing 25 W 39th St, New York NY 10018 (c/o Thor Equities). First of the
      three SPE takedowns; consideration $2,143,665.

  - id: highland55
    grantee: "Highland55 Investments LLC"
    grantee_tag: verified          # PPDeeded/PPOwner on parcel K48-25-11-01-32-005-00
    grantor: "Brand Investments LTD"
    grantor_tag: reference         # Urbana Daily Citizen (2026-06-14): second of Brand's two parcels
    grantor_corroboration: inference  # completes the 133-ac Brand disposition (47.637 + 85.619)
    parcels: ["K48-25-11-01-32-005-00"]   # multipart parcel (two polygon features in the geojson)
    acres: 85.619                  # [verified] PPAcres (counted once; parcel is multipart)
    consideration_usd: 3210712.50  # [verified] PPAmount (matches geojson last_sale_amount 3210712.5)
    conveyance_date: "2025-11-18"  # [verified] PPSaleDate
    deed_reference: "OR603/1927"   # [verified] auditor BOOK_NO/PAGE_NO
    recorder_instrument_no: null   # [open]
    situs: "ST RTE 55 URBANA OH 43078"
    class_number: 100              # agricultural (non-CAUV; has_cauv false)
    notes: >-
      The 85.6-ac parcel south of Rittal (per the issue). Owner-of-record mailing 3040 Riverside
      Dr Ste 122, Columbus OH 43221 — the Highland Realty Development address, DISTINCT from the
      Urbana Owner I/II NY mailing. Brand + Highland55 together = the ">$5.5M / 133 ac" H2-2025
      Brand disposition ([reference]); the two [verified] considerations sum to $5,354,377.50, i.e.
      the news ">$5.5M" is approximate. [inference]

  - id: organ-farms
    grantee: "Urbana Owner II LLC"
    grantee_tag: verified          # PPDeeded/PPOwner on parcels -30-005-00 and -30-006-00
    grantor: "Organ Farms LLC"
    grantor_tag: reference         # Urbana Daily Citizen (2026-06-14): Organ Farms, 97.09 ac, June 5 2026
    grantor_corroboration: inference  # 7.09 + 90.0 = 97.09 ac EXACT match to the reported figure
    parcels: ["K48-25-11-01-30-005-00", "K48-25-11-01-30-006-00"]
    acres: 97.09                   # [verified] 7.09 + 90.0 (PPAcres); single combined deed
    consideration_usd: 3398150     # [verified] PPAmount (both parcels share OR606/3352)
    conveyance_date: "2026-06-12"  # [verified] PPSaleDate (recording); news dates the exercise "June 5"
    deed_reference: "OR606/3352"   # [verified] one instrument covers both parcels
    recorder_instrument_no: null   # [open]
    situs: "S US HWY 68 URBANA OH 43078"
    class_number: 110              # agricultural (CAUV)
    notes: >-
      Reported ([reference]) as the exercise of an existing purchase agreement with Organ Farms
      LLC for 97.09 ac at ~$3.4M; the auditor records both parcels transferring on one deed
      (OR606/3352) for $3,398,150 — "nearly $3.4 million" [inference]. Owner-of-record mailing
      c/o Thor Equities, 25 W 39th St, New York NY.

# ---------------------------------------------------------------------------------------------
# EXCLUDED — seller-residual parcels NOT part of the transfer (kept for the audit trail).
# ---------------------------------------------------------------------------------------------
excluded_residual:
  - parcel: "K48-25-11-01-32-021-00"
    owner: "Brand Investments LTD"     # [verified] PPOwner — still Brand-held (not transferred)
    deed_reference: "OR601/4518"       # [verified] auditor BOOK_NO/PAGE_NO (Brand's own acquisition)
    acres: null                        # ~22.5 ac per bosc-site-footprint.yaml notes
    note: "Seller-residual — Brand's retained holding adjacent to the Vance Brands parcel; excluded from the assembly."
  - owner: "Organ Farms LLC"
    note: "[open] Any Organ Farms retained acreage not individually resolved; only the 97.09-ac transferred block (OR606/3352) is in the assembly."

# ---------------------------------------------------------------------------------------------
# CONTRACT-PENDING — parcels Thor is UNDER CONTRACT to purchase but has not yet taken title to.
# From the federal complaint (¶13); no deed of record yet, so kept out of `conveyances`.
# ---------------------------------------------------------------------------------------------
contract_pending:
  - purchaser: "Urbana Owner LLC"          # [verified] ¶9 — the fifth Thor SPE, contract purchaser
    purchaser_tag: verified                # as pleaded in a filed federal instrument (Doc #1)
    parcels: ["K48-25-11-01-36-001-00", "portion of K48-25-11-01-37-001-00"]
    status: "under contract to purchase (not yet conveyed)"   # ¶¶9, 13
    deed_reference: null                   # [open] — no deed of record; watch the auditor for the takedown
    acres: null                            # [open] — ¶13 does not state the contract parcels' acreage
    note: >-
      ADDITIONAL to the ~230.346-ac owned holding (¶13 gives 230.346 ac for the four owned parcels
      only; these two contract parcels are separate and their acreage is [open]). Not in the auditor
      conveyance chain above because title has not transferred; when it does, add a `conveyances`
      entry. Caption mailing 3040 Riverside Dr Ste 122, Columbus (Doc #1) — same caption address as
      the other three SPEs.

# ---------------------------------------------------------------------------------------------
