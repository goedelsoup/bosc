  as_written:
    city_total_annual_usd: 3000000            # "Over $3,000,000 in new tax revenue for the City of Urbana annually"
    schools_annual_usd: 2800000               # "Over $2,800,000 in new funding (FROM THE TOTAL REVENUE) for Urbana Schools annually"
    schools_drawn_from_total: true            # the parenthetical is in the source
    jobs_operations: "30-80"
    jobs_construction: "1,000+"
    investment_usd: 1000000000
    noise_offer: {day_db: 65, night_db: 55, vehicle: "a formal CRA agreement", status: "offered, never executed"}
    noise_investment: "tens of millions in noise-dampening technology"

  correction:
    what_the_corpus_said: "~$5.8M/yr combined city + school tax (datacenter-facility.md §1); #1354 states ~$6M/yr"
    what_the_source_says: >
      The two figures MUST NOT be added. The Project Overview states the schools' ">$2,800,000" is
      drawn "(from the total revenue)" — i.e. it is a component of the ">$3,000,000", not an
      addend. The disclosed aggregate is therefore "over $3,000,000" annually, roughly half what
      the corpus and the issue text carried.
    tag: verified                             # verified against the primary document

  reconciliation:                             # [inference] — explicitly derived, not disclosed
    auditor_basis:                            # [verified] — Champaign County CAMA, 2026-08-01
      assembly_land_value_usd: 2687630        # 560,460 + 82,910 + 1,060,880 + 983,380
      assembly_improvement_value_usd: 0       # PPImprValue = 0 on all four assembly parcels
      cauv_parcels: 3                         # of 4 — currently taxed at agricultural use value
      note: >
        Because the CRA exempts only "the increase in assessed valuation resulting from
        improvements" and the assembly currently carries ZERO improvement value, the whole of a
        ~$1B build would be the exemptible increase. The land stays on the roll either way.
    implied_millage_inversion: >
      Ohio assesses real property at 35% of true value, so a $1B improvement is ~$350M of assessed
      value. For that to yield only the disclosed ">$3,000,000" a year across ALL taxing bodies
      implies an effective rate of about 8.6 mills — far below any plausible Ohio commercial
      effective rate. The disclosed figure therefore CANNOT represent unabated property tax on the
      improvement. It is consistent only with (a) a substantial abatement of the improvement value,
      plus (b) revenue that a CRA does not abate — municipal income tax on construction and
      operations payroll, and any negotiated school compensation.
    corroborating_city_datum: >
      [verified] The City's own share of the property tax is small: Resolution 2721-25 (considered
      2025-10-21, FAILED 2-5) would have reduced "the City of Urbana's share of the General Fund
      (Inside) property tax collection from 1.8 mills to 1.5 mills." At 1.8 mills the City's own
      unabated take on $350M of assessed improvement would be ~$630,000/yr — well under the
      ">$3,000,000" attributed to "the City of Urbana," which reinforces that the disclosed figure
      is a jurisdiction-wide, mixed-source number rather than a municipal property-tax line.
    school_consent_threshold: >
      [verified as said] Urbana City Schools treasurer Mandy Hildebrand told the 2025-10-21 hearing
      that the statute allows up to a 75% abatement without going to the school board, that the
      board "has questions whenever a 100% abatement is asked for," that recent requests have been
      under 100%, and that revenue sharing becomes possible when total payroll exceeds $2 million.
      She was explicit that she spoke neither for nor against the designation.
    unresolved: >
      [open] The effective millage for the Urbana City School District tax district, and Urbana's
      municipal income-tax rate, are both needed to close this arithmetic. Neither the county
      auditor nor the Ohio Department of Taxation is reachable from this environment.

  land_spend_reconciliation:                  # [inference] — the City's number vs the deed record
    city_statement: >
      "the developer entered into agreements with the participating property owners for
      approximately $5,000,000" and, more specifically, "purchases of 47 acres ... for just over
      $2 million, and in November the developer purchased just over 80 acres ... for just over $3
      million."
    deed_record:                              # [verified] — land-assembly.yaml
      - {deed: "OR601/4948", recorded: "2025-08-22", acres: 47.637, usd: 2143665}
      - {deed: "OR603/1927", recorded: "2025-11-18", acres: 85.619, usd: 3210712.50}
    subtotal_usd: 5354377.50
    finding: >
      The City's "approximately $5,000,000" reconciles EXACTLY to the two Brand Investments deeds
      recorded before the notice was written — $5,354,377.50 — and its "47 acres"/"just over 80
      acres" match the recorded 47.637 ac and 85.619 ac. The third conveyance (Organ Farms →
      Urbana Owner II, $3,398,150, recorded 2026-06-12) postdates the notice; all three total
      $8,752,527.50. This is a clean two-source corroboration of the land-assembly register AND it
      confirms the City treats the Urbana Owner I / Highland55 SPEs as "the developer."

# =============================================================================================
# 5. GUARDS — errors this record exists to prevent.
# =============================================================================================
guards:
  - name: "area-designation is not an agreement"
    error: >
      Secondary summaries state that in November 2025 "the city council approved a Community
      Reinvestment Area agreement it negotiated with Thor, creating a tax abatement for the
      project." That is WRONG on the primary record. Ord. 4631-25 designated a geographic AREA
      with ceilings; the City's own notice says there are no CRA agreements; and the Director of
      Law told Council on the night of the vote that "there are no current agreements on the
      table." Never cite a Nov-2025 Urbana "CRA agreement" or an abatement percentage.
  - name: "the 65/55 dB limits are not enforceable"
    error: >
      Do not describe the noise limits as conditions of a CRA, of the zoning, or of any approval.
      They are terms the developer OFFERED for an agreement that does not exist.
  - name: "do not add the two tax figures"
    error: >
      ">$3M city" + ">$2.8M schools" is a double count — the source says the schools' figure comes
      from the total. The disclosed aggregate is "over $3,000,000."
  - name: "the filename date is not a date"
    error: >
      The City's public notice is named "...2.26.26.docx.pdf" but carries NO date in its body. Do
      not cite 2026-02-26 as its verified date.
  - name: "Urbana0624C is the City's identification, not a corporate record"
    error: >
      The City writes "Urbana0624C, LLC (which is Highland)". No Ohio SoS filing has been read.
      Treat common control with the Thor SPE graph as a strongly corroborated [inference].

