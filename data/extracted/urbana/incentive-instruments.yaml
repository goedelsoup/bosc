# =============================================================================================
# 2. THE COMMUNITY REINVESTMENT AREA — an AREA designation, not an agreement.
# =============================================================================================
cra:
  ordinance:
    number: "4631-25"                         # [verified]
    title: >
      An ordinance establishing and describing the boundaries of Community Reinvestment Area #2
      in the City of Urbana, and authorizing and approving related matters.
    authority: "R.C. 3735.65 through 3735.70"
    department_requesting: "Community Development"
    sponsor: "Councilman Pat Thackery"
    hearing_advertised: "2025-10-10"          # [verified] §Thirteen + caption (Charter §2.16)
    public_hearing_held: "2025-10-21"         # [verified] §Thirteen + the 2025-10-21 minutes
    first_reading: "2025-10-07"
    second_reading: "2025-10-21"
    passed: "2025-11-04"
    vote: "5-2"                               # [verified] — 2025-11-04 minutes
    voted_yes: ["Davis", "Truelove", "Thackery", "Collier", "Bean"]
    voted_no: ["Scott", "Jumper"]
    predecessor_cra:                          # [verified] — recitals
      area: "Community Reinvestment Area #1"
      original: "Ordinance No. 4348 (2010)"
      amended:
        - "Ordinance No. 4348, as Amended, passed 2011-02-22"
        - "Ordinance No. 4574-22, passed 2022-07-05"
      still_in_effect: true                   # [verified] — Feinstein, 2025-11-04: CRA #1 covers a different area

  # -------------------------------------------------------------------------------------------
  # What the ordinance actually grants — CEILINGS ONLY. It fixes no percentage and no term for
  # any project; §Four requires case-by-case negotiation and §Five requires Council approval.
  # -------------------------------------------------------------------------------------------
  exemption_ceilings:                         # [verified] §Four
    basis: "the increase in assessed valuation resulting from improvements"   # NOT the land
    negotiated: "case-by-case, in advance of the commencement of construction or remodeling (R.C. 3735.67)"
    written_agreement_required: "R.C. 3735.671"
    tiers:
      - kind: "remodeling of existing commercial/industrial"
        max_years: 15
        max_percent: 100
        condition: "construction-materials cost at least $100,000"
      - kind: "new commercial or industrial construction"
        max_years: 15
        max_percent: 100
      - kind: "new commercial/industrial on the site of a 'megaproject'"
        max_years: 30
        max_percent: null                     # §Four(c) states a 30-year term but NO percentage
        condition: >
          owned and occupied by a 'megaproject operator' as defined in ORC 122.17(A)(12), or —
          if not on a megaproject site — owned and occupied by a 'megaproject supplier' meeting
          ORC 122.17(A)(13)(b).

  megaproject_gate:                           # the 30-year tier is a STATE gate, not a City one
    statutory_thresholds:                     # [reference] — read from codes.ohio.gov via fetch
      megaproject: >
        At least $1 billion in fixed-asset investment OR at least $75 million in Ohio employee
        payroll; PLUS an average hourly wage of at least 300% of the federal minimum wage; PLUS
        the unique-site/robust-utilities condition (or the semiconductor/HQ/R&D alternative).
      megaproject_supplier_b: "$100 million fixed-asset investment and $10 million Ohio employee payroll"
    codification_caveat: >
      [open] The current codification places "megaproject" at (A)(11), "megaproject operator" at
      (A)(12) and "megaproject supplier" at (A)(13); Ord. 4631-25 §Four(c) attributes BOTH
      "megaproject" and "megaproject operator" to (A)(12). Whether the ordinance tracks an earlier
      numbering or mis-cites needs a byte-level read of the codified section.
    designation_authority: "Ohio Tax Credit Authority (R.C. 122.17)"   # a STATE designation
    project_status: >
      [inference] The disclosed ~$1B investment would meet the investment prong, but the 300%-of-
      federal-minimum-wage floor and the site condition are unevidenced, and with 30-80 permanent
      jobs the $75M-payroll prong is plainly not met. No megaproject designation for this project
      was found (see negative_searches). The 30-year tier is therefore unavailable to it on this
      record — it depends on a state designation nobody has shown exists.
    what_staff_told_council: >
      [verified as said] Asked at the 2025-10-21 public hearing what constitutes a megaproject,
      Community Development Manager Doug Crabill answered that "he believes it requires a
      billion-dollar investment." That is one prong of a disjunctive test and omits the wage floor.

  administration:                             # [verified] §§Three, Five-Twelve
    housing_officer: "designated by the Director of Administration via an Appointment Letter"
    application_required: "a CRA Application on the form on file with the Clerk of Council, filed with the Housing Officer"
    council_approval: "required prior to the City's execution of any CRA Agreement"   # §Five
    annual_monitoring_fee: "set by the Director of Finance; due at execution and each anniversary"  # §Seven
    housing_council: "the previously established Housing Council (R.C. 3735.69) — annual inspection; hears R.C. 3735.70 appeals"
    tirc: "Champaign County Tax Incentive Review Council — annual compliance review of all CRA Agreements"
    odod_gate: >
      §Eleven — the Housing Officer SHALL NOT authorize any CRA Exemption until the Director of the
      Ohio Department of Development assigns or affirms a unique designation number for CRA #2;
      R.C. 3735.672 annual reports are due to ODOD by March 31 of each year the City has entered a
      CRA Agreement.
    odod_number_confirmed: null               # [open] — ODOD unreachable
    revocation_grounds:
      - "real-estate taxes not subject to the exemption delinquent >12 months without an approved county payment arrangement"
      - "zoning, building or health code violations outstanding >6 months"
      - "neglect of maintenance/repair, after the first year"
      - "material failure of the CRA Agreement"

  boundary:                                   # [verified] Exhibit B, pp. 100-109
    described_as: >
      "the parcels in the City of Urbana identified by the maps below and outlined in yellow, as
      identified by the records of the Champaign County Auditor as of tax year 2024, including as
      the parcels may be split, re-combined, or combined from time to time"
    map_sheets: ["Northeast", "Dellinger Road", "Northwest", "West Annexation", "South Annexation"]
    south_annexation_parcels:                 # [verified] Exhibit B p. B-1 (PDF p.109) — exactly 9
      - {parcel: "K48-25-11-01-30-005-00", acres: 7.09,  owner: "URBANA OWNER II LLC"}
      - {parcel: "K48-25-11-01-30-006-00", acres: 90.00, owner: "URBANA OWNER II LLC"}
      - {parcel: "K48-25-11-01-36-001-00", acres: 85.29, owner: "BOARD OF COUNTY COMMISSIONERS"}
      - {parcel: "K48-25-11-01-36-002-00", acres: 8.05,  owner: "MADISON-CHAMPAIGN ESC"}
      - {parcel: "K48-25-11-01-36-003-00", acres: 2.69,  owner: "URBANA HEALTH FACILITIES LLC"}
      - {parcel: "K48-25-11-01-36-004-00", acres: 14.33, owner: "URBANA HEALTH FACILITIES LLC"}
      - {parcel: "K48-25-11-01-37-001-00", acres: 9.21,  owner: "BOARD OF COUNTY COMMISSIONERS"}
      - {parcel: "K48-25-11-01-37-002-00", acres: 2.66,  owner: "MADISON-CHAMPAIGN ESC"}
      - {parcel: "K48-25-11-01-37-003-00", acres: 0.76,  owner: "URBANA HEALTH FACILITIES LLC"}
    south_annexation_total_acres: 220.08      # [inference] sum of PPAcres; ≈ the 219.986 ac annexed
    owner_source: >
      Champaign County auditor CAMA (parcel_joined FeatureServer 0), pulled 2026-08-01 — the same
      layer land-assembly.yaml uses. Owners are CURRENT, not as of the 2024 tax year the ordinance
      keys to.

  # -------------------------------------------------------------------------------------------
  # THE BOUNDARY FINDING: most of the assembly is OUTSIDE the CRA the project is associated with.
  # -------------------------------------------------------------------------------------------
  assembly_coverage:
    inside_cra2:
      parcels: ["K48-25-11-01-30-005-00", "K48-25-11-01-30-006-00"]
      owner: "Urbana Owner II LLC"
      acres: 97.09
      note: "conveyed from Organ Farms 2026-06-12 (OR606/3352) — see land-assembly.yaml"
    outside_cra2:
      - {parcel: "K48-25-11-01-30-001-00", owner: "Urbana Owner I LLC",         acres: 47.637}
      - {parcel: "K48-25-11-01-32-005-00", owner: "Highland55 Investments LLC", acres: 85.619}
    outside_acres: 133.256
    finding: >
      [verified] Of the 230.346 recorded acres in the Thor assembly (land-assembly.yaml), only
      97.09 ac — the two Urbana Owner II parcels — fall inside Community Reinvestment Area #2.
      The 133.256 ac bought FIRST, from Brand Investments (the "Vance Brands" parcel and the
      85.6-ac parcel south of Rittal), are NOT in Exhibit B on any of its five map sheets. CRA #2's
      South Annexation area is the 219.986-ac ANNEXED territory, not the developer's assembly.
    jurisdiction_check: >
      [verified] The exclusion is a CHOICE, not a jurisdictional artefact: all four assembly
      parcels lie 100% inside the Urbana corporation limits. Tested 2026-08-01 by intersecting the
      committed parcel geometry (reference/urbana/parcel-assemblage.geojson) against the Champaign
      County GIS `Municipal_Boundaries` layer, NAME='Urbana' (the layer carries the 2025 annexation
      — the Organ Farms parcels -30-005/-30-006 fall inside it — so it is not pre-annexation
      stale). A city CRA may only cover territory in the city; these parcels were eligible and were
      left out.
    annexation_precision: >
      [verified] The two Brand parcels were in the City but were NOT among the nine parcels annexed
      by Ord. 4619-25: that petition's owners were the County Commissioners, Organ Farms LLC, the
      Madison-Champaign ESC and Urbana Health Facilities LLC — Brand Investments is not among them,
      and the nine CRA-2 South parcels match those four owners exactly (220.08 ac by auditor
      acreage vs the ordinance's 219.986 ac). NOTE that BOTH the City's public notice AND the
      federal complaint describe the 47-ac and 80-ac purchases as being "in the newly zoned and
      annexed territory" — loose on this point, and in near-identical wording in both documents.
    caveat: >
      [inference] The Project Overview places the building "on the NW side of the property adjacent
      to the Rittal facility," which reads onto the Highland55 parcel — i.e. outside CRA #2. The
      site plan is not in corpus, so the footprint's parcel cannot be fixed [verified]; and Exhibit
      B's own "as the parcels may be split, re-combined, or combined from time to time" language
      means a later re-plat could change coverage. What is [verified] is the enacted parcel list.

# =============================================================================================
# 3. WHAT DOES NOT EXIST — the negative record, which is the substance of this issue.
# =============================================================================================
no_cra_agreement:
  finding: >
    [verified] No R.C. 3735.671 CRA Agreement between the City of Urbana and any Thor/Highland
    entity has ever been presented to, or approved by, City Council. Ord. 4631-25 §Five makes
    Council approval a precondition to execution, so a Council record is dispositive: every
    approved minute from 2025-01-07 through 2026-07-07 was read, and the agendas for 2026-07-21 and
    2026-08-04 (the current one) carry no such item.
  city_own_statement: >
    [verified as the City's own words] The City's public notice states flatly: "There are no
    Community Reinvestment Agreements with the developer," "Other than the Pre-Annexation
    Agreement, there are no contracts between the developer and the City," "No 'deals' have been
    made," and "No Non-Disclosure Agreements have been signed."
  on_the_record_denials:                      # [verified as said]
    - date: "2025-10-21"
      speaker: "Doug Crabill, Community Development Manager"
      context: "answering a Council question about a potential data center"
      said: "the City has not engaged in any agreements"
    - date: "2025-11-04"
      speaker: "Mark Feinstein, Director of Law"
      said: >
        "the legislation is to create an area, not an agreement"; "there are no current agreements
        on the table"; "A CRA doesn't have anything to do with data centers"
      cross_reference: >
        Feinstein contrasted Urbana's action with Sidney's: "what happened in Sidney is an
        agreement." Sidney is a separate registered BOSC site (#1275) — noted as the City's own
        comparison, NOT as an evidentiary bridge between the two projects.
  consequence_for_the_disclosed_terms: >
    The 65 dB day / 55 dB night limits the corpus carried as disclosed CRA terms are, on this
    record, an OFFER and nothing more: the Project Overview says the project is "offering to commit
    to decibel limits via a formal CRA agreement." No ordinance imposes them, no agreement contains
    them, and Ord. 4631-25 contains no acoustic condition of any kind. Urbana's enforceable noise
    constraint on this project is currently zero.

negative_searches:
  - target: "A CRA Agreement or any incentive agreement before Council"
    scope: "37 approved council minutes 2025-01-07 → 2026-07-07, plus the 2026-07-21 and 2026-08-04 agendas"
    result: "none — the only CRA items are the area designation and Housing Council appointments (Res. 2655-26)"
    tag: verified
  - target: "JobsOhio / Ohio Department of Development / Ohio Tax Credit Authority / R.C. 122.175"
    scope: "the same 37 approved minutes (full-text search)"
    result: "ZERO occurrences of JobsOhio, ODOD, Tax Credit Authority, 122.17 or 122.175 in any 2025-2026 Urbana council minute"
    tag: verified
  - target: "A state award or R.C. 122.175 data-center sales-tax exemption for the project"
    scope: "open-web search, 2026-08-01"
    result: >
      No JobsOhio award and no Ohio Tax Credit Authority approval naming Thor Equities, Highland,
      Urbana0624C or the Urbana Technology Hub was found. R.C. 122.175 requires a Tax Credit
      Authority agreement and a $100M+ qualifying investment; nothing indicates one was sought.
    tag: reference
    caveat: "an open-web negative is weaker than a registry negative — the registries below are unreachable"
  - target: "ODOD CRA registry + R.C. 3735.672 annual reports (would show any executed agreement and the CRA #2 designation number)"
    result: "UNREACHABLE from this environment — development.ohio.gov returns HTTP 404 on every path"
    tag: open
  - target: "Ohio Secretary of State business filing for Urbana0624C, LLC (registered agent, members)"
    result: "UNREACHABLE — businesssearch.ohiosos.gov returns HTTP 403 (same block recorded in #1328)"
    tag: open
  - target: "Champaign County Auditor tax rates / effective millage"
    result: "UNREACHABLE — champaigncountyauditor.org and four other county hosts fail DNS; tax.ohio.gov returns 404"
    tag: open

