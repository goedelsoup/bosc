# Urbana Technology Hub — the incentive and development instruments (structured record)
#
# What the City of Urbana actually signed, designated, and voted on for the Thor/Highland
# data-center project (site: urbana), read from the City's own legislative record:
#   data/documents/urbana/council/
# #1354 · sub-issue of #1263 · strengthens `record` + `story`.
#
# THE HEADLINE, so it is not mis-read downstream: there is NO tax-abatement agreement. The City
# designated a Community Reinvestment AREA (Ord. 4631-25) — a geographic envelope with ceilings —
# and separately signed ONE contract with the developer, a 2024 PRE-ANNEXATION AGREEMENT (Ord.
# 4612-24). No R.C. 3735.671 CRA Agreement, no abatement percentage, no term, and no enforceable
# decibel limit exists. The 65/55 dB limits live only in a developer handout as terms OFFERED for
# an agreement that was never negotiated.
#
# TAG VOCABULARY (per CLAUDE.md / evidentiary-discipline):
#   [verified]  — read from an enacted City instrument or an approved minute: ordinance text,
#                 exhibit text, roll-call votes, and (for hearing testimony) the fact that a named
#                 person said a given thing on the record.
#   [reference] — a party's or speaker's claim taken at face value: the developer's project
#                 overview, a citizen's characterization, a statute read through a fetched page,
#                 the City's own advocacy about its conduct.
#   [inference] — a corroboration this record derives by combining instruments (e.g. the ~$5M
#                 land spend reconciled to the recorded deeds; the implied-millage inversion).
#   [open]      — not in corpus (the executed agreement counterpart; the effective millage; the
#                 Ohio SoS record for Urbana0624C, LLC; any state award).

