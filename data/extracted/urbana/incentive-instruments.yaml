        the development of the Property in order to satisfy the Developer's schedule, The City of
        Urbana agrees to execute a petition to detach the entire Property from its jurisdiction
        upon the request of Developer or Company.
      significance: >
        [verified as a term] The City pre-committed, in December 2024, to de-annex the entire
        property on the developer's demand if the zoning did not come out to the developer's
        satisfaction. Every trigger in the clause has since arguably occurred (the M-1 data-center
