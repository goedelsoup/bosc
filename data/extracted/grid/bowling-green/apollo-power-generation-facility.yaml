# --- What the instrument actually is ------------------------------------------
case_number_correction:
  tag: '[verified]'
  correct: 25-0973-EL-BLN
  asserted_in_issue: 25-0973-EL-BGN
  statement: >-
    Issue 1437, the BOSC site profile, and OPSB's own press release all give the
    case as 25-0973-EL-BGN; the docket is 25-0973-EL-BLN. The Staff Report's caption
    reads "In the Matter of the Letter of Notification Application of Will-Power OH,
    LLC ... Case No. 25-0973-EL-BLN" (p. 1 of the cover letter), the identifier block
    repeats it ("Case Number: 25-0973-EL-BLN", Staff Report p. 1), it appears in the
    footer of every one of the 22 Staff Report pages, and the DIS electronic-filing
    stamp on the final page reads "Case No(s). 25-0973-EL-BLN". OPSB's news release
    of 2026-02-03 directs readers to search "25-973-EL-BGN" — wrong suffix and a
    dropped leading zero — but OPSB's structured gas-fleet case table lists it as
    25-0973-EL-BLN in a column where sibling Licking County rows are genuinely -BGN,
    so the table is discriminating between the two tracks rather than defaulting.
  why_it_matters: >-
    BLN is the Board Letter of Notification — the accelerated track under R.C.
    4906.03 and O.A.C. 4906-6 that carries automatic approval unless suspended.
    BGN is the ordinary generation-certificate track, which is adjudicated. The
    suffix is the very fact the issue is about: it is the reason there were no
    public hearings. Citing -BGN describes a proceeding that did not happen.

