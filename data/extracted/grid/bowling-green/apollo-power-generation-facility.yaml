# --- Capacity: three different numbers, and they are not interchangeable -------
capacity:
  net_output_mw:
    tag: '[verified]'
    value: 350
    statement: >-
      "a 350 megawatt (MW) net capacity electric generation plant" (Staff Report
      p. 1). This is the certified figure and it is a hard cap: Condition 14 reads
      "The facility shall be operated in such a way that the output of the facility
      does not exceed 350 megawatts."
  gross_capability_mw:
    tag: '[verified]'
    value: 491
    statement: >-
      "The generation units would be capable of producing up to 491 MW at design
      atmospheric weather conditions. At those weather conditions, various generation
      units may be derated to still account for onsite equipment load and unplanned
      equipment downtime to still achieve a maximum 350 MW net output."
      (Staff Report p. 2.) So the installed fleet is ~40% larger than the certified
      output — the margin absorbs parasitic load, derate and outages. A 491 MW figure
      is NOT a second capacity claim and must never be reported as the plant's size.
  bess:
    tag: '[verified]'
    power_mw: 119.5
    energy_mwh: 239
    container_count: ~31
    container_model: Tesla Megapack 2XL
    statement: >-
      "The Applicant has been refining its design and layout and would utilize
      approximately 119.5 MW of BESS capacity (for delivery of 239 MW-h of energy).
      This BESS equipment would consist of approximately 31 Tesla Megapack 2XL
      battery energy storage containers with inverters." (Staff Report p. 2.) The
      widely reported "~120 MW battery" rounds this. The 239 MWh — i.e. a 2-hour
      duration — is the figure that says what the storage is FOR, and it is absent
      from every secondary account: at 119.5 MW it carries the plant for roughly two
      hours, which is a ride-through and demand-following asset, not a supply
      resource.
    purpose:
      tag: '[verified]'
      statement: >-
        "to accommodate fluctuations in demand from the associated Liames facility
        and to mitigate any unplanned outages" (Staff Report p. 2).
  oversizing_note:
    tag: '[inference]'
    statement: >-
      The 350 MW net certified here against the ~180 MW peak disclosed for the
      campus's initial phase is the ~2x oversizing this repo already tracks as a
      Phase-2 signal (see the it_load citation on the bowling-green SiteProfile and
      Meta's 2026-01-07 trustees letter). Nothing in the Staff Report states a
      customer load, a phase plan, or a reason for the margin, so the inference is
      ours and stays ours. The record's own explanation for surplus capability is the
      491-vs-350 derate margin, which is a different and smaller thing.

# --- The equipment, unit by unit ----------------------------------------------
generation_equipment:
  tag: '[verified]'
  primary_units:   # Staff Report p. 2
    - {count: 2,  model: Siemens SGT-800}
    - {count: 3,  model: Siemens A35}          # the air permit's EU group is "Siemens SGT-A35"
    - {count: 10, model: Solar PGM 130}        # the air permit's EU group is "Solar Titan T-130"
    - {count: 6,  model: Siemens SGT-400}
    - {count: 6,  model: Caterpillar 3520}     # reciprocating engines; the air permit calls them CAT G3520
  turbine_total: 21
  reciprocating_engine_total: 6
  reconciliation:
    tag: '[verified]'
    statement: >-
      21 turbines (2 + 3 + 10 + 6) and 6 reciprocating engines. The Ohio EPA air
      permit independently describes the facility as "(6) natural gas fired engines
      and (21) natural gas fired turbines" and groups the emissions units in exactly
      these five families, so the two agencies' records reconcile unit for unit. The
      model names differ slightly between them (A35/SGT-A35, PGM 130/Titan T-130,
      3520/G3520); these are the same machines under vendor and permit naming.
  duty_split:
    tag: '[verified]'
    statement: >-
      "gas combustion turbine generator sets to support baseload power demand and
      quick start reciprocating engines and battery energy storage container units to
      support the variable energy demands of the customer's data center facility"
      (Staff Report p. 2).
  fuel:
    tag: '[verified]'
    statement: >-
      "The combustion turbines and reciprocating engines would use pipeline natural
      gas as the exclusive fuel." (Staff Report p. 2.)
  solar_is_not_solar:
    tag: '[verified]'
    statement: >-
      READ THE FOOTNOTE BEFORE COUNTING ANY RENEWABLE CAPACITY HERE. Staff Report
      footnote 1: "Solar Turbines, Inc. ('Solar') is a subsidiary of Caterpillar,
      Inc. Solar is a brand name and not solar photovoltaic equipment." Ten of the
      21 turbines are "Solar" units and every one of them burns natural gas. Wood
      County already carries a live solar-capacity conflation trap in this repo
      (Bowling Green's municipal solar field is 20 MW AC, not the ~125 MW that an
      AMP Phase II conflation produces); a text search that treats "Solar PGM 130"
      as photovoltaic would manufacture a third one. The same footnote records that
      the applicant had initially specified Baker Hughes LT16 turbines and switched
      to the PGM 130 "due to supply chain issues."
  portable_generator:
    tag: '[verified]'
    statement: >-
      Space is reserved for a megawatt-scale portable unit "such as the Solar Mobile
      Turbomachinery (SMT) 130 mobile combustion turbine generator set ... brought in
      and utilized during outage events," and Staff's recommendation "includes
      authorization for the intermittent use" of it (Staff Report p. 3). Condition 34
      requires any use of it to be reported in the annual compliance report — so
      there is a certified, dispatchable unit here whose running hours are a filed
      record rather than a modelled assumption.
  emergency_generators:
    tag: '[verified]'
    count: 2
    model: Caterpillar C32
    rating_kw_each: 1000
    fuel: ultra-low sulfur diesel
    statement: >-
      "The emergency and black start generation would come from two Caterpillar C32
      diesel generators rated each at up to 1,000 kilowatts (kW) ... The diesel
      generators are only for startup of the Apollo facility and would not directly
      support the customer's electric load demand needs." (Staff Report p. 3.)
      These are the PLANT's black-start set. They are not the data center's backup
      fleet, and they must not be read into the campus's genset dimension — the
      bowling-green SiteProfile deliberately carries no gensets for the data center
      because none has been disclosed for it.
  electrical_system:
    tag: '[verified]'
    statement: >-
      "an internal BTM substation, switching substation, busses, circuit breakers,
      switchgear, transformers, and gen-tie lines. The generator sets would be
      connected to a series of approximately 18 transformers that would increase the
      voltage to 34.5 kV. The electric power would then be delivered through a series
      of 34.5 kV circuits to the customer." (Staff Report p. 3.) Note the delivery
      voltage: 34.5 kV is a distribution class, well below the 100 kV threshold at
      which OPSB jurisdiction over a transmission line attaches.

# --- The thing that makes this a behind-the-meter instrument ------------------
grid_posture:
  tag: '[verified]'
  statement: >-
    "The facility would operate in behind the meter (BTM) mode where its electric
    output is dedicated to a single customer's electric load and would not be
    physically connected to the electric grid." (Staff Report p. 1.) And at p. 10:
    "The proposed facility would not be connected to the regional grid and would
    instead serve the load of the Applicant's customer. If the Applicant plans to
    export power to the bulk power system in the future, a supplemental application
    must be filed with the Board."
  enforced_by:
    - >-
      Condition 15 — "The Applicant shall not have a physical or electrical
      interconnection with the Transmission System pursuant to the PJM
      Interconnection, LLC Open Access Transmission Tariff (OATT), Part IV or OATT
      Part VI."
    - >-
      Condition 16 — export to the bulk power system requires both "(a) New service
      request for generation interconnection with PJM Interconnection, LLC or the
      current regional transmission organization operating in Ohio" and "(b) ...
      supplemental approval from the Board."
  why_it_matters:
    tag: '[inference]'
    statement: >-
      This is the cleanest instrumented example in the network of the self-power
      posture: 350 MW of dispatchable generation certified with an express
      prohibition on touching the grid it sits beside. The consequences follow from
      the prohibition, not from us — a plant with no OATT interconnection has no PJM
      capacity obligation, no interconnection queue position, and no transmission
      service to be curtailed, and the load it serves never appears in the serving
      utility's retail sales. The BOSC bowling-green grid record already models the
      campus's grid draw as ~0 for this reason. Nothing in the Staff Report discusses
      market or tariff consequences; the reasoning is ours.

