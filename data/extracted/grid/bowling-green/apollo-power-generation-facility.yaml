# Structured record — the Apollo Power Generation Facility as the Ohio Power Siting
# Board certified it: OPSB Case No. 25-0973-EL-BLN, Will-Power OH, LLC, Middleton
# Township, Wood County. The behind-the-meter power instrument for the Meta
# ("Liames, LLC") campus.
#
# Provenance vocabulary (see docs/investigative-method/ENRICHMENT.md):
#   [verified]  = stated in a captured primary record (cite file + page)
#   [reference] = secondary / self-published source, not a controlling record
#   [inference] = reasoned from verified facts, labelled as such
#   [open]      = not established by any captured source — do NOT assert
meta:
  subject: >-
    The Apollo Power Generation Facility siting case — 350 MW net behind-the-meter
    gas generation plus ~119.5 MW / 239 MWh of battery storage, certified by
    automatic approval on the accelerated letter-of-notification track with no
    public hearings, and expressly barred from interconnecting to the grid
  kind: opsb-siting-case
  case_number: 25-0973-EL-BLN
  captured_for: issue 1437 (epic 1433, readiness(bowling-green) — the power instrument)
  extracted_at: '2026-08-01'
  method: >-
    Read verbatim from the captured Staff Report of Investigation's own text layer
    (pdftotext -layout). Page citations are the Staff Report's own printed page
    numbers, which restart at 1 after the cover letter and maps. Where the issue
