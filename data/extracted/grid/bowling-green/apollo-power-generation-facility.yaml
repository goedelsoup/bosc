  sources:
    primary:
      - file: data/documents/grid/bowling-green/power-siting-board-ohio-020326.pdf
        what: OPSB Staff Report of Investigation, 25-0973-EL-BLN, filed 2026-01-27
    secondary:
      - url: https://opsb.ohio.gov/news/opsb-authorizes-construction-of-wood-county-power-plant
        what: OPSB news release, 2026-02-03 (carries the wrong case suffix — see case_number_correction)
