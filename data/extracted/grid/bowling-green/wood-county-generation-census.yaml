      trade-press "aging, costly, under study" framing the watch was opened on, and it dates
      the event to the month. Note also that the county lost its only wind generation and
      its only remaining petroleum-fired generation in the same decade: the AMP diesel units
      at plant 7575 went in mid-2018, at 41.3822/-83.6113 — coordinates within ~150 m of the
      12 MW battery that started up at the same site in May 2023.

# ── The generator that is not there ───────────────────────────────────────────
the_absence_of_apollo:
  tag: '[verified]'
  finding: >-
    THE APOLLO POWER GENERATION FACILITY DOES NOT APPEAR IN EIA-860M AT ALL. Not in Wood
    County, not anywhere: a whole-workbook search across all four sheets and all states for
    "Apollo", "Will-Power", "Liames" and "Middleton" returns no Ohio row for this project.
    The only "Apollo" hits are Apollo Energy Corp's Hawaii wind farms and a 2.5 MW
    Massachusetts solar array. This is a 350 MW net / 491 MW gross gas plant with an OPSB
    certificate (25-0973-EL-BLN, approved 2026-02-03), a final Ohio EPA permit to install
    (P0139272, issued 2026-06-02) and an in-service schedule its applicant put at mid-2027.
  two_readings_and_neither_is_asserted:
    - id: OUT-OF-SCOPE
      reading: >-
        Form EIA-860 collects from generators connected to the local or regional electric
        power grid. Apollo's certificate FORBIDS that connection: Condition 15 bars any
        physical or electrical interconnection with the PJM Transmission System under OATT
        Part IV or Part VI, and Condition 16 requires a PJM new service request plus
        supplemental Board approval before any export. A plant built to serve exactly one
        customer behind the fence may simply not be a reporting entity.
    - id: REPORTING-LAG
      reading: >-
        EIA-860M is a preliminary monthly inventory that picks projects up as respondents
        report them; a plant that has not yet begun construction reporting can be absent for
        ordinary administrative reasons and appear later.
  why_it_is_recorded_anyway:
    tag: '[inference]'
    statement: >-
      IF THE FIRST READING IS RIGHT, THE BEHIND-THE-METER POSTURE MAKES A LARGE PLANT
      STATISTICALLY INVISIBLE. Every fleet-level count that runs off the federal generator
      inventory — state capacity additions, PJM's own generation picture, carbon and
      capacity-factor work, this repo's own greenops layer — would omit 350 MW of new gas in
      Wood County while capturing a 1 MW rooftop array in Perrysburg. That is a structural
      observation about a measurement system, not a claim about EIA or about Will-Power, and
      it is exactly the kind of thing the self-power pathway produces. It is written down
      here because it is checkable: if Apollo appears in a later edition, reading one is
      wrong and this note should be struck.
    how_to_test_it: see open_leads/APOLLO-IN-EIA

# ── Troy Energy ───────────────────────────────────────────────────────────────
troy_energy_conversion:
  id: TROY-ENERGY-AH1-711
  tag: '[reference]'
  what_the_federal_record_shows:
    tag: '[verified]'
    statement: >-
      Troy Energy LLC, plant 55348, Luckey area (41.47724/-83.45983): four simple-cycle gas
      combustion turbines of 198.9 MW each, 795.6 MW total, all in service June 2002, all
      "(OP) Operating", none carrying a planned retirement year. NOTHING IS PLANNED THERE.
      The Planned sheet's only Wood County row is Juliet Energy; there is no Troy Energy
      steam-cycle addition in the June 2026 federal inventory.
  what_the_issue_carried:
    statement: >-
      "Troy Energy CC conversion (LS Power) — PJM queue AH1-711, ~408 MW winter addition at
      the existing Luckey peaker, POI Lemoyne 345 kV, in-service 2030".
    corroboration_found: >-
      LS Power announced in March 2025 that it had applied to add approximately 700 MW of
      new generation across PJM under the RELIABILITY RESOURCE INITIATIVE, including
      converting two peaking facilities — Troy Energy among them — to base-load combined
      cycle by adding a steam cycle. Trade reporting puts the Troy addition at roughly 600
      MW. NEITHER the queue position AH1-711, NOR the Lemoyne 345 kV point of
      interconnection, NOR the 2030 in-service year, NOR the ~408 MW winter figure was
      corroborated in this pass.
  the_honest_reading:
    tag: '[inference]'
    statement: >-
      A PJM QUEUE POSITION IS NOT A PLANNED GENERATOR. The absence from EIA's Planned sheet
      is consistent with a project that has an interconnection request and no construction
      commitment, and it should not be read as the conversion having been cancelled — LS
      Power has cancelled a Troy expansion once before, in 2019 over the nuclear-subsidy
      legislation, so the distinction matters here more than most places. The three
      capacity figures now in circulation — ~408 MW winter, ~600 MW added, ~700 MW across
      LS Power's whole RRI application — are not interchangeable and describe different
      things; do not average them or pick one.
  watch: >-
    REGISTERED AND UNCLOSED. The route to close it is PJM's own queue, which was not
    reachable — see blocked_routes/PJM-QUEUE.

# ── Routes that are limited, not empty ────────────────────────────────────────
blocked_routes:
  - id: PJM-QUEUE
    tag: '[verified]'
    route: PJM new service request queue / serial service request status
    status: >-
      not a machine-readable product — the queue is NOT in Data Miner 2, and the public
      queue browser is client-rendered
    checked: '2026-08-05'
    evidence: >-
      THE OBVIOUS FIX WAS TRIED AND IS NOT THE FIX. Data Miner 2 was queried WITH a valid
      subscription key (settings.pjm_api_key / WATERMARK_PJM_API_KEY, sent as
      Ocp-Apim-Subscription-Key exactly as watermark.grid.lmp does): the authenticated feed
      catalogue at api.pjm.com/api/v1/ returns 119 datasets and NONE of them is an
      interconnection queue. They are market and operations feeds — LMP, ancillary services,
      generation by fuel, outages, wind and solar output. Four guessed feed names
      (serial_service_requests, new_service_requests, gen_queue, queue_status) each returned
      HTTP 404 with the key attached. Separately, PJM's public queue browser
      (pjm.com/planning/service-requests/services-request-status) renders client-side and
      exposes no download link in its served HTML, and three legacy spreadsheet paths under
      pjm.com/pub/planning/ answered with permanent redirects to the site shell.
    consequence: >-
      The queue position AH1-711 was NEITHER CONFIRMED NOR REFUTED, and nothing is inferred
      from its not having been checked. Note what kind of negative this is: not a credential
      problem and not a bot block, but a PRODUCT boundary — PJM publishes market data through
      an API and planning data through a web application, and the interconnection queue is on
      the planning side. Anyone who assumes a PJM key opens the queue will lose an afternoon;
      it does not.
    what_would_resolve_it:
      - a browser-session capture of the queue browser filtered to the ATSI zone
      - PJM's periodic queue reports and Reliability Resource Initiative postings, which are published as static PDFs on the planning pages
      - the interconnection agreement itself, if one is executed and filed at FERC

open_leads:
  - id: APOLLO-IN-EIA
    statement: >-
      Re-run this census against a later EIA-860M edition and record whether Apollo appears.
      If it does, the "behind-the-meter plants are invisible to the federal inventory"
      reading is wrong and must be struck. If it is still absent once the plant is in service
      (the applicant's schedule is ~150 MW around July 2027, the remainder around August
      2027), the reading is strongly supported and becomes a finding worth its own write-up —
      it would apply to every HB 15 self-power project in Ohio, not just this one.
  - id: EIA-860M-CONNECTOR
    statement: >-
      Model follow-up: there is no EIA-860 connector in this repo. The grid layer pulls
      EIA-861 (retail sales, service territory) and EIA-930 (BA demand) but never the
      generator inventory, so every per-site generation fact in the fleet is hand-sourced
      from press. A `fn(county_fips, settings) -> pydantic` over EIA-860M would give every
      site its generator census for free and would make claims like "the muni's whole fleet
      is 81.5 MW" connector-sourced instead of transcribed. Bowling Green, Findlay and
      Sandusky all have hand-built versions of the same thing.
  - id: JULIET-ENERGIZED
    statement: >-
      Whether Juliet Energy Project (50 MW, planned 2026-07) actually entered service, and
      reconcile its 50 MW EIA nameplate against the OPSB-certified capacity in
      20-1760-EL-BGN. The OPSB certificate was not read.
  - id: VESI-21
    statement: >-
      Who VESI 21 LLC is and what the 12 MW / Bowling Green Energy Storage Project battery
      does — merchant PJM asset, an AMP-contracted resource, or a city asset. It sits at the
      coordinates of AMP's retired diesel plant (7575), which suggests reuse of a municipal
      site and therefore a municipal relationship, but that is [inference] from a coordinate
      pair and nothing more. It is absent from the city's own renewable-energy page and from
      the issue body alike, so nobody has looked at it.
  - id: TROY-ENERGY-QUEUE
    statement: >-
      Confirm or refute PJM queue position AH1-711, the Lemoyne 345 kV point of
      interconnection, the ~408 MW winter addition and the 2030 in-service year for the Troy
      Energy combined-cycle conversion, and reconcile them against LS Power's own ~600 MW
      statement. NOT via Data Miner 2 — the queue is not one of its 119 feeds, tested with a
      key (see blocked_routes/PJM-QUEUE). The route is PJM's planning pages: the Reliability
      Resource Initiative postings and the periodic queue reports, both static PDFs.
