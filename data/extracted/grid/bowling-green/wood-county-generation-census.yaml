# Every generator in Wood County, Ohio, as the federal inventory has them — plus the
# one that is being built there and is not in it.
#
# Provenance vocabulary (see docs/investigative-method/ENRICHMENT.md):
#   [verified]  = stated in a captured primary record (cite file + page)
#   [reference] = secondary / self-published source, not a controlling record
#   [inference] = reasoned from verified facts, labelled as such, arithmetic shown
#   [open]      = not established by any captured source — do NOT assert
#
# The issue that opened this thread listed the county's power column from press and
# developer sources: four wind turbines of unstated current status, a 20 MW solar field
# "not the ~125 MW sometimes conflated", AMP combustion turbines of unstated size, a
# Troy Energy conversion, and a Juliet Energy solar project at "~62-65 MW AC". This file
# replaces all of that with one federal record that carries every generator ≥1 MW in the
# county with its nameplate, its technology, its operating date and, where it applies,
# its retirement date. Four of the five entries change.

meta:
  subject: >-
    The complete Wood County, Ohio generator census from EIA Form 860M (Preliminary
    Monthly Electric Generator Inventory), June 2026 edition — operating, planned and
    retired — read against the county's press-sourced power column, and the absence from
    it of the 350 MW Apollo plant
  kind: generation-census
  site: bowling-green
  captured_for: issue 1440 (epic 1433, readiness(bowling-green) — serving utility + grid posture)
  extracted_at: '2026-08-05'
  method: >-
    Programmatic read of the four generator sheets (Operating, Planned, Retired, Canceled
    or Postponed) of the June 2026 EIA-860M workbook, filtered to Plant State = OH and
    County = Wood, every field transcribed as published. A second pass searched the whole
    workbook — all sheets, all states — for "Apollo", "Will-Power", "Liames" and
    "Middleton" to test whether the Wood County filter had missed the Apollo plant. It had
    not; see the_absence_of_apollo below.
  source:
    file: june_generator2026.xlsx
    title: EIA Form 860M, Preliminary Monthly Electric Generator Inventory, June 2026
    publisher: U.S. Energy Information Administration
    url: https://www.eia.gov/electricity/data/eia860m/xls/june_generator2026.xlsx
    sha256: 47d28a1e5599135b619d249971f35f03fef8a5b3062c2d66c436b55e8f8c3072
    bytes: 13860880
    retrieved: '2026-08-05'
    committed: false
    why_not_committed: >-
      A 13.9 MB national monthly workbook is the wrong shape for this corpus: it is not a
      Bowling Green document, it is superseded every month, and only twenty of its ~28,000
      rows are in scope. The bytes are pinned by sha256 above so the transcription below is
      auditable, and the CURRENT-edition URL is recorded knowing it rolls over — the June
      edition's durable location is EIA's eia860m archive. If this becomes a recurring pull
      it should become a connector rather than a committed blob; see
      open_leads/EIA-860M-CONNECTOR.

