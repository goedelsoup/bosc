# Structured record — the behind-the-meter generation stack in Hancock County, and
# what of it does (and does not) sit behind the Findlay Megawatt Hub.
#
# Provenance vocabulary (see docs/investigative-method/ENRICHMENT.md):
#   [verified]  = stated in a captured primary record (cite file + page)
#   [reference] = secondary / self-published source, not a controlling record
#   [inference] = reasoned from verified facts, labelled as such
#   [open]      = not established by any captured source — do NOT assert
meta:
  subject: >-
    One Power Co's Hancock County behind-the-meter fleet (Wind for Industry, Net
    Zero, ManagedHV), the Findlay Megawatt Hub's digital substation, and the
    OnSite/AEP/Basalt fuel-cell collaboration — read against Schedule DCT's
    behind-the-meter provisions
  kind: behind-the-meter-generation
  captured_for: issue 1464 (epic 1265, readiness(findlay) — grid posture)
  extracted_at: '2026-07-31'
  method: >-
    Project tables read verbatim from One Power's registration statement, then
    reconciled against the equipment vendors' own releases. Corrections to the
    issue body's framing are stated where the primary text does not support it.
  sources:
    primary:
      - url: https://www.sec.gov/Archives/edgar/data/2039139/000162828025002278/onepowercompany-sx1a.htm   # One Power Co Form S-1, 2025-01-23
      - file: data/documents/grid/findlay/July_24_2026_AEP_Ohio_Tariff_Book.pdf   # Schedule DCT sheets 223-6, 223-7
    secondary:
      - url: https://selinc.com/company/news/one-energy-enterprises-digital-substation-in-findlay-ohio-energized-and-operational/   # SEL, 2023-09-14
      - url: https://www.goldwindamericas.com/wind-energy-powers-whirlpool-corporation-ball-corporation-findlay-ohio-plant   # Goldwind, North Findlay Wind Campus
      - url: https://onsitepartners.com/news/onsite-partners-aep-and-basalt-infrastructure-partners-collaborate-to-bring-power-solutions-to-data-centers/   # OnSite/AEP/Basalt, 2025-06-12

# --- The operating fleet ------------------------------------------------------
wind_for_industry_hancock_county:
  tag: '[verified]'
  what_it_is: >-
    One Power's Wind for Industry solution is explicitly behind-the-meter: "Our
    behind-the meter wind turbines are interconnected to our customer's
    facility's side of the utility meter, so the energy generated by the turbines
    is used directly by the facility without first passing through the power
    grid." Delivered under 20-year take-or-pay Renewable Energy Agreements. The
    company states it believes it is "currently the largest installer and
    operator of behind-the-meter wind energy in the United States," with 36 MW of
    nameplate capacity owned and operated in total.
  hancock_county_projects:   # from the S-1's Wind for Industry table
    - customer: Ball Metal Beverage Container Corporation
      nameplate_mw: 4.5
      commercial_operation: 2016-Q1
      contract_expiration: 2036-Q1
    - customer: Whirlpool Corporation
      nameplate_mw: 3.0
      commercial_operation: 2016-Q1
      contract_expiration: 2036-Q1
    - customer: Valfilm North America Inc.
      nameplate_mw: 3.0
      commercial_operation: 2018-Q3
      contract_expiration: 2038-Q3
    - customer: Ball Metal Beverage Container Corporation
      nameplate_mw: 4.5
      commercial_operation: 2020-Q3
      contract_expiration: 2040-Q3
  hancock_county_total_mw: 15.0   # 4.5 + 3.0 + 3.0 + 4.5
  share_of_one_power_fleet: 15.0 of 36 MW — Hancock County is the largest single county in the fleet
  fleet_performance: >-
    Turbine availability 97.5% average / 94.4% minimum in 2022 and 98.2% / 96.4%
    in 2023, across projects with more than one full year of operation. Total
    power production across all Wind for Industry projects was 83.9 million kWh
    in 2022 and 71.7 million kWh in 2023 (fleet-wide, not Hancock County).
  turbine_count:
    tag: '[inference]'
    statement: >-
      Ten turbines, and this is where the issue body's "10 utility-scale
      turbines" figure comes from. Goldwind's own release for the North Findlay
      Wind Campus states it "consists of five GW87 1.5 MW wind turbines, for a
      total capacity of 7.5 MW," offsetting "approximately 22% of the Whirlpool
      Corporation facility's power demand and 20% of Ball Corporation's" — which
      reconciles exactly with the S-1's two 2016-Q1 Hancock entries (Whirlpool
      3.0 + Ball 4.5 = 7.5 MW). Reading the later Valfilm 3.0 MW and Ball 4.5 MW
      projects as the same 1.5 MW machine class gives 2 + 3 more, i.e. 10
      turbines for 15.0 MW county-wide. The 1.5 MW multiple is arithmetic, not a
      stated turbine count in any captured source — hence [inference].
  correction_to_issue_body:
    tag: '[verified]'
    statement: >-
      Issue 1464 attributed the turbines to "the Hub" — "the Hub's 10
      utility-scale turbines." They are not at the Megawatt Hub. Every one of
      them sits behind an INDUSTRIAL customer's meter at that customer's own
      plant — Whirlpool's, Ball Metal's, Valfilm's — under a 20-year REA with
      One Power. They are not generation serving the compute load, and no
      captured source places generating equipment at the Megawatt Hub itself.
      Wiring them to the hub would put 15 MW of renewable output behind a
      bitcoin-mining load that has no documented claim to it.

net_zero_projects:
  tag: '[verified]'
  what_it_is: >-
    A distinct One Power solution from Wind for Industry: "on-site,
    behind-the-meter energy systems to deliver net-zero energy to industrial
    customers," combining "wind, solar, storage and/or other power technologies
    into a single, integrated behind-the-meter system," each with a digital
    substation, under 20-year take-or-pay REAs. Three were in the Construction
    Phase at the S-1 (the table lists four rows totalling 43.2 MW wind / 18 MW
    solar).
  hancock_county_project:
    customer: Whirlpool Corporation
    location: Hancock County, Ohio
    wind_nameplate_mw: 14.4
    solar_nameplate_mw: 6.0
    phase: Construction Phase (as of the S-1, 2025-01-23)
  correction_to_issue_body:
    tag: '[verified]'
    statement: >-
      Issue 1464 called this "Wind-for-Industry: the S-1/A documents Whirlpool's
      Hancock County program at 14.4 MW wind + 6.0 MW solar." The figures are
      right; the program is not. 14.4 MW wind + 6.0 MW solar is Whirlpool's NET
      ZERO project, listed in a different table under a different solution, and
      it was in construction rather than operating. Whirlpool's operating Wind
      for Industry project in Hancock County is 3.0 MW. Conflating the two would
      overstate the county's operating behind-the-meter wind by roughly five
      times.
  status_now:
    tag: '[open]'
    statement: >-
      Whether the Whirlpool Hancock County Net Zero project reached commercial
      operation after the January 2025 filing is not established. One Power
      withdrew its registration in May 2025 and has published no successor
      disclosure. Lead NETZERO-WHIRLPOOL-COD.

managed_hv:
  tag: '[verified]'
  statement: >-
    One Power's third solution, ManagedHV, is "on-site, behind-the-meter,
    digital, high-voltage power infrastructure ... offered as a service to
    industrial customers," letting them "interconnect at higher voltages, move
    power efficiently, electrify their facilities and incorporate renewables and
    other power solutions on-site without owning or operating" the equipment. Two
    ManagedHV projects were owned and operated at the S-1, both delivered
    alongside other solutions; their locations are not given.

# --- The hub's own electrical plant -------------------------------------------
findlay_megawatt_hub_substation:
  tag: '[verified]'
  statement: >-
    The hub is a transmission-voltage interconnection with its own substation,
    which One Power states is "the first fully digital substation in the United
    States." The S-1 describes the architecture rather than the rating: "our
    substations reduce the voltage from high voltage power transmission lines to
    lower voltage distribution lines," and the digital design "improves
    resiliency, creates better real-time monitoring, and operates as a more
    efficient protection and control system for both the substation and customers
    served by the substation." The hub has "a 30 MW transformer bay currently
    energized and is expandable to 150 MW."
  equipment:
    tag: '[reference]'
    statement: >-
      Schweitzer Engineering Laboratories' 2023-09-14 release states the
      substation "has completed energization with testing and is operational
      commercially," using SEL's TiDL system connecting the substation over fiber
      optics, with "Hitachi Energy's 30 MVA transformer and high-voltage circuit
      breakers." The 30 MVA transformer corroborates the S-1's "30 MW transformer
      bay." The release names no voltage class, no interconnection point, and no
      on-site generation.
  no_generation_at_the_hub:
    tag: '[open]'
    statement: >-
      Nothing in any captured source places wind, solar, storage or fuel cells
      physically at the Findlay Megawatt Hub. The hub as documented is a
      transmission interconnection and distribution plant serving leased compute
      load — it takes power, it does not make it. If that changes, it changes the
      Schedule DCT analysis materially (see dct_bearing below).

# --- The fuel-cell collaboration, checked -------------------------------------
onsite_aep_basalt_collaboration:
  tag: '[reference]'
  statement: >-
    OnSite Partners, LLC, American Electric Power and Basalt Infrastructure
    Partners announced on 2025-06-12 that they would "collaborate on providing
    distributed low carbon, resilient power generation solutions for data center
    customers," naming Bloom Energy fuel cells among the technologies. The
    release carries a Columbus, Ohio dateline.
  what_it_does_not_say:
    tag: '[verified]'
    statement: >-
      Read for this issue and it comes up short of the connection the issue body
      drew. The release names no site, no state beyond the dateline, no MW figure,
      and no PUCO approval — and it does not mention Findlay, Hancock County, One
      Power, or the Megawatt Hub at all, even though OnSite Partners (funds
      advised by Basalt) had announced its acquisition of One Power in February
      2026. Reading it as a Findlay fuel-cell commitment is not supported. It is
      a corporate-parent-level signal about where the hub's owner is heading,
      nothing more.
  aep_bloom_agreement:
    tag: '[open]'
    statement: >-
      Issue 1464 also cited an AEP 1 GW Bloom agreement and "a PUCO-approved AEP
      onsite-power project." Neither was captured or confirmed here, and neither
      is carried as a claim. Lead AEP-BLOOM-ONSITE.

# --- Why any of this matters under the tariff ---------------------------------
dct_bearing:
  tag: '[inference]'
  statement: >-
    Schedule DCT does not treat behind-the-meter generation as a free reduction
    in load. Sheets 223-6/223-7 draw the line in two places. First, a DCT customer
    "shall enter into an interconnection agreement between the Company and the
    Customer in advance of connecting any source of power other than the delivery
    point specified in the Contract," consistent with O.A.C. 4901:1-22 — with an
    express carve-out only for "emergency or backup generation that is not
    designed to operate in parallel with the Company's system." Second, a customer
    that ELECTS to use BTM generation to offset Contract Capacity must keep
    equipment in place "to instantaneously curtail load equal to or greater than
    the behind-the-meter generation output," and one that does not so elect can
    have service suspended, with Commission approval, for exceeding Contract
    Capacity by more than 1,000 kW. So at a site whose entire commercial premise
    is behind-the-meter power, the netting election is a real and consequential
    choice — and at the Findlay hub it is undocumented, because the ESA itself is
    undocumented (see megawatt-hub-interconnection.gap.yaml). The reasoning is
    ours; the tariff language is verbatim.
  what_would_resolve_it:
    - The hub's electric service agreement or letter of agreement with AEP Ohio
    - An O.A.C. 4901:1-22 interconnection agreement for any parallel generation at the site
    - A One Power / OnSite disclosure post-dating the withdrawn S-1

acceptance:   # per issue 1464
  behind_the_meter_stack_recorded_with_citations: true
  wind_for_industry_recorded_with_citations: true
  issue_body_framing_corrected: true    # turbines are at customers' plants, not the hub; 14.4/6.0 is Net Zero, not WFI
  no_generation_attributed_to_the_hub: true
