# --- The gap that keeps this from closing the facility domain -----------------
attribution_gap:
  tag: '[open]'
  statement: >-
    Need Dayton-2025-002 names a SUBSTATION and a CITY. It does not name a
    customer, a company, a parcel, or a campus. Two disclosed data-center
    corridors sit within about a mile of the Clinton Substation — the AWS Cosler
    Farm campus (Amazon Data Services, Inc., ~471 ac, $4B, 1,920,299 sq ft
    disclosed) and the Ardent/TAC rezoning corridor (~545 ac, every figure
    undisclosed) — and nothing in any captured record says which one the 500 MW
    request belongs to, or whether it is split between them.
  why_it_matters: >-
    This is the same shape as Van Wert #1408, where AEP's Statement of Need named
    the Mega Site but the 612 pages contained no occurrence of "QTS" or "data
    center", and the facility domain correctly stayed `seeded`; and the same
    shape as West Union #1983, where a $10B campus and a 1.3 GW request existed
    but no instrument joined the operator to the load. A 500 MW figure copied
    into the AWS campus's power basis would be an [inference] wearing a
    [verified] tag.
  what_would_close_it:
    - The LON application for 25-0871-EL-BLN itself, or the Clinton customer-feed
      cases' applications, if their affected-property tables or need statements
      name the served parcels (the Van Wert route — the applicant's own site, or
      a local government's service copy).
    - An interconnection or facilities agreement, or an AES Ohio rate case /
      Long-Term Forecast Report exhibit, naming the customer at Clinton.
    - A Southwest Ohio Air Quality Agency permit-to-install for the campus, whose
      genset fleet would size the backup and imply the load independently.
    - A subsequent TEAC deck that splits Dayton-2025-002 or renames its customer.
  what_can_be_said_now:
    tag: '[inference]'
    statement: >-
      The 500 MW request is more likely the AWS Cosler Farm campus than the
      Ardent/TAC corridor — AWS has a disclosed build, an announced investment,
      a site plan and construction activity, and a first energization of January
      2028 requires a customer already building, whereas Ardent/TAC is known by a
      rezoning ordinance and nothing else. This is reasoning, it is labelled as
      reasoning, and it does not move any figure into the facility's power basis.

# --- What the 500 MW does to the existing screening bracket -------------------
reconciliation_with_the_screening_bracket:
  tag: '[inference]'
  statement: >-
    The repo's Wilmington IT-load bracket is a floor-area SCREENING inference —
    144.0 MW low, ~312 MW central, 480.1 MW high — from the disclosed 1,920,299
    sq ft site plan at 75-250 W/sq ft, corroborated by a $4B investment screen
    (#1468, #1641 D2). The derived facility draw published in
    data/reference/eia/wilmington/demand-pressure.yaml is 402.6 MW central with a
    162.7-696.1 MW band (IT x PUE 1.13-1.45).
  finding: >-
    AES Ohio's disclosed 500 MW terminal request falls INSIDE that derived
    facility-draw band and about 24% above its central value. Reading it back
    through the same PUE band gives an implied IT load of roughly 345 MW (at PUE
    1.45) to 442 MW (at PUE 1.13) — inside the screening bracket's upper half and
    below its 480.1 MW high. Two independent methods — a floor-area screen the
    repo built from a site plan, and a utility's own transmission-service request
    — agree to within the width of the bracket.
  what_this_does_not_license: >-
    It does not license replacing the screening bracket with 500 MW. The 500 MW
    is facility demand at a delivery point, not IT load; it is a REQUEST, not
    installed capacity; its terminal year is 2030, not today; and per
    `attribution_gap` above it is not tied to this campus by any record. The
    profile's it_load_source stays SCREENING. What changes is the citation, which
    now names this instrument instead of repeating a misplaced "1.5 GW".

# --- Routes tried ------------------------------------------------------------
blocked_and_negative_routes:
  - route: PUCO / OPSB Docketing Information System (dis.puc.state.oh.us)
    tag: '[verified]'
    result: blocked
    detail: >-
      Probed 2026-08-06. A plain request for CaseRecord.aspx?CaseNo=25-0871-EL-BLN
      returns HTTP 200 with a 245-byte "Request Rejected ... Your support ID is"
      body; the same request with full browser headers returns a 7,554-byte
      F5/BIG-IP `bobcmn` JavaScript bot challenge. This is the SIXTH confirmation
      of this block in this repo (Findlay #1464, Bowling Green #1437, Van Wert
      #1408 x2, and here). The docket is UNSEARCHED, not empty — no inference may
      be drawn from its silence.
  - route: opsb.ohio.gov pretty-URL case pages
    tag: '[verified]'
    result: facade
    detail: >-
      https://opsb.ohio.gov/cases/25-0871-EL-BLN returns HTTP 200 and 197 KB,
      which looks like a served docket until it is read: the body is an IBM
      WebSphere Portal shell whose content region says "No content found for:
      ohio content english/opsb/cases/25-0871-EL-BLN". It proxies nothing and is
      not an alternative route to DIS. Recorded because the 200 status is a trap.
  - route: PJM TEAC 2025 meeting materials
    tag: '[verified]'
    result: not served
    detail: >-
      PJM's TEAC materials page lists Dayton Supplemental decks for 2026 only
      (2026-02-03, 2026-05-08, 2026-07-07). Constructed 2025 URLs on the same
      pattern returned the site's HTML not-found page rather than a PDF. So the
      Need Meeting of 2025-02-04 and the Solution Meeting of 2025-04-01 — where
      Dayton-2025-002's ORIGINAL ramp and costs were presented — are not in hand.
  - route: Wilmington News Journal (wnewsj.com)
    tag: '[verified]'
    result: blocked
    detail: >-
      All three wnewsj articles the issue cites — the 2026-02-06 AES council
      presentation, the 2026-03-04 rate-impact piece and the 2026-04-28
      intervention story — return HTTP 403 to both curl with browser headers and
      to the agent's own fetcher. The issue's claims that AES said it had been
      "working with AWS for more than a year" and that residential bills roughly
      doubled year-over-year therefore remain [reference] and UNVERIFIED here.
      Blocked, not absent.
  - route: journal-news.com "biggest power guzzlers" article
    tag: '[verified]'
    result: 'not found (HTTP 404)'
    detail: >-
      The URL issue #1469 gives for the PJM-queue ranking returns HTTP 404. The
      same story ID resolves under daytondailynews.com and wcpo.com in search
      results; neither mirror was retrieved. The ranking is recorded above as
      [reference] on that basis and nothing rests on it.
