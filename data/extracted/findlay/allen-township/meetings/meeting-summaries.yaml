- date: '2026-03-03'
  kind: minutes
  filename: 03-03-2026.pdf
  hits:
  - datacenter
  - easement
  summary: At the March 3, 2026 regular meeting of the Allen Township Trustees, the
    board discussed the possible construction of data centers in the township and
    the prospect of placing a moratorium on such construction. The Trustees voted
    to have Cindy Land draft a letter to the Hancock County Commissioners requesting
    a moratorium on data centers in Allen Township. Separately, Trustee Smith reported
    that easements related to the TR114 & CR140 intersection project had been discussed
    with Denny Bishop and John Griffith, who were found to be agreeable.
  corridor_relevance: The meeting text mentions data centers solely in the context
    of a discussion about possible construction in the township and a resulting motion
    to request a moratorium; no specific project, developer, or parcel is named. The
    easement mention is limited to the TR114 & CR140 intersection project, with no
    further detail provided in the text.
  decisions:
  - Clark moved to pay bills totaling $142,123.32; seconded by Flanagan; roll call
    — all yes.
  - Smith moved to authorize the FO to pursue a new website with Shumaker Technology
    Group; seconded by Clark; roll call — all yes.
  - Flanagan moved to accept the quote from Truland Equipment of Napoleon to trade-in
    the 2022 JD Z930M for a 2026 JD Z930M lawn mower (boot price $4,821.11); seconded
    by Clark; roll call — all yes.
  - Flanagan moved to approve job descriptions for Snow Plow Driver, Maintenance Worker,
    and Janitor; seconded by Smith; roll call — all yes.
  - Flanagan moved to approve the Frequent Traveler Policy; seconded by Clark; roll
    call — all yes.
  - Flanagan moved to approve the Tax-Exempt Certificate Use and Sales Tax Policy;
    seconded by Smith; roll call — all yes.
  - Smith moved to adopt a Resolution Adopting a Cybersecurity Policy; seconded by
    Flanagan; roll call — all yes.
  - Smith moved to have Cindy Land draft a letter to the Hancock County Commissioners
    requesting them to place a moratorium on data centers in Allen Township; seconded
    by Clark; roll call — all yes.
  - Flanagan moved to adjourn at 9:00 p.m.; seconded by Smith; roll call — all yes.
