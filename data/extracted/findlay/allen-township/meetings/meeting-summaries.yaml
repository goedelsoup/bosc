- date: '2025-12-02'
  kind: minutes
  filename: 12-02-2025.pdf
  hits:
  - one_power
  summary: At the December 2, 2025 Allen Township Trustees regular session, attorney
    Cindy Land briefed the Trustees on a legal action filed by One Power Company against
    the Hancock County Board of Elections concerning the Allen Township Zoning Resolution
    ballot language. Judge Jonathan P. Starn issued a Decision and Order (Case No.
    2025 CV 00168) finding the Board of Elections failed to meet obligations under
    R.C. 3505.06(E), rendering the May 6, 2025 Primary Election results on the Proposed
    Allen Township Zoning Plan invalid and void, thereby returning Allen Township
    to unzoned status. The Board of Elections has filed an appeal and a stay, and
    the matter is ordered to be placed on the May 5, 2026 Primary Election Ballot
    with compliant summary language. All zoning certificates issued July through October
    2025 were declared unwarranted and associated fees are being returned.
  corridor_relevance: The meeting connects to the subject "one_power" because One
    Power Company is named as the plaintiff in a complaint (Case No. 2025 CV 00168)
    filed on May 1, 2025 against the Hancock County Board of Elections challenging
    the ballot language for the Allen Township Zoning Resolution; the minutes do not
    describe One Power Company's nature, purpose, or any project beyond its role as
    the filing party in that legal action.
  decisions:
  - Minutes of November 4, 2025 were read and approved.
  - Flanagan moved to pay bills totaling $157,977.59 with Smith seconding; Roll call
    - all yes.
  - Flanagan moved to adopt the Amended 2025 Township Annual Permanent Appropriation
    Resolution (to include OPWC funds of $58,368.08) with Smith seconding; Roll call
    - all yes.
  - Flanagan moved to have Cindy update the draft Cooperative Economic Development
    Agreement (CEDA) with the City of Findlay to run for 99 years at 3.0 mills, with
    Smith seconding; Roll call - all yes.
  - Flanagan moved to adopt A Resolution Declaring Two Proposed Amendments to the
    Allen Township Zoning Resolution Moot with Smith seconding; Roll call - all yes.
  - Flanagan moved that Danny's November contract payment be prorated through 11/5/25
    in conjunction with the zoning ruling of Judge Starn and the date of his accident,
    with Smith seconding; Roll call - all yes.
  - Flanagan moved that for 2026 the Trustees prepare a Payroll Certification Form
    to allocate salaries between the Gas Tax Fund and the General Fund per Auditor
    of State Bulletin 2011-007, with Smith seconding; Roll call - all yes.
  - Flanagan moved that TR215, TR218 and the cemetery (east of TR229) roads be paved
    in 2026 utilizing the Hancock County Engineer's coop bidding process, with Smith
    seconding; Roll call - all yes.
  - Flanagan moved to restripe TR215, TR218, TR14, TR114, TR101, TR107, utilizing
    the Hancock County Engineer's coop bidding process, with Smith seconding; Roll
    call - all yes.
  - Flanagan moved to wedge specific spots on TR142, TR114, TR228, with Smith seconding;
    Roll call - all yes.
  - Trustees set January 6, 2026 at 7:00 p.m. for the Allen Township Trustee's 2026
    Organizational Meeting.
  - Flanagan moved to adjourn at 9:16 p.m. with Smith seconding; Roll call - all yes.
  - Judge Jonathan P. Starn issued a Decision and Order (Case No. 2025 CV 00168) rendering
    the ballot and results of the May 6, 2025 Primary Election regarding the Proposed
    Zoning Plan for Allen Township invalid and void on November 4, 2025.
  - Hancock County Board of Elections ordered to place the Proposed Allen Township
    Zoning Plan on the May 5, 2026 Primary Election Ballot with summary language consistent
    with R.C. 3505.06(E).
  - All Allen Township zoning certificates issued during July through October 2025
    declared unwarranted; fees collected are being returned.
  - Hancock County Board of Elections filed an appeal and a stay on the ruling.
  parties:
  - Milford Smith, Chairman (Trustee)
  - Flanagan (Trustee)
  - Mark J. Schimmoeller, Fiscal Officer
