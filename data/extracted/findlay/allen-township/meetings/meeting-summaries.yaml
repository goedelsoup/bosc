- date: '2025-12-02'
  kind: minutes
  filename: 12-02-2025.pdf
  hits:
  - one_power
  summary: At the December 2, 2025 regular meeting of the Allen Township Trustees,
    attorney Cindy Land from the Hancock County Prosecutor's Office briefed the Trustees
    on a legal action filed by One Power Company against the Hancock County Board
    of Elections concerning ballot language for the Allen Township Zoning Resolution.
    Judge Jonathan P. Starn issued a Decision and Order (Case No. 2025 CV 00168) on
    November 4, 2025, ruling the May 6, 2025 Primary Election results regarding the
    Proposed Allen Township Zoning Plan invalid and void, returning Allen Township
    to unzoned status. The Board of Elections has filed an appeal and a stay on the
    ruling, and the Proposed Zoning Plan is ordered to be placed on the May 5, 2026
    Primary Election ballot with corrected summary language. All zoning certificates
    issued July through October 2025 were declared unwarranted and associated fees
    are being returned.
  corridor_relevance: The meeting connects to the subject "one_power" solely because
    One Power Company filed a complaint (Case No. 2025 CV 00168) against the Hancock
    County Board of Elections asserting that certified ballot language for the Allen
    Township Zoning Resolution was incorrect and misleading; the minutes do not name
    any project, site, or purpose associated with One Power Company beyond this legal
    filing.
  decisions:
  - Minutes of November 4, 2025 approved.
  - Flanagan moved to pay outstanding bills totaling $157,977.59; Smith seconded;
    roll call — all yes.
  - Flanagan moved to adopt the Amended 2025 Township Annual Permanent Appropriation
    Resolution (to include OPWC funds of $58,368.08); Smith seconded; roll call —
    all yes.
  - Flanagan moved to have Cindy [Land] update the CEDA draft to run for 99 years
    at 3.0 mills; Smith seconded; roll call — all yes.
  - A Resolution Declaring Two Proposed Amendments to the Allen Township Zoning Resolution
    Moot was adopted; Flanagan moved, Smith seconded; roll call — all yes.
  - Flanagan moved that Danny [Fagan]'s November contract payment be prorated through
    11/5/25; Smith seconded; roll call — all yes.
  - Flanagan moved that for 2026 the Trustees prepare a Payroll Certification Form
    to allocate salaries between the Gas Tax Fund and the General Fund per Auditor
    of State Bulletin 2011-007; Smith seconded; roll call — all yes.
  - Flanagan moved that TR215, TR218, and the cemetery (east of TR229) roads be paved
    in 2026 using the Hancock County Engineer's coop bidding process; Smith seconded;
    roll call — all yes.
  - Flanagan moved to restripe TR215, TR218, TR14, TR114, TR101, TR107 using the Hancock
    County Engineer's coop bidding process; Smith seconded; roll call — all yes.
  - Flanagan moved to wedge specific spots on TR142, TR114, TR228; Smith seconded;
    roll call — all yes.
  - Trustees set January 6, 2026 at 7:00 p.m. for the 2026 Organizational Meeting.
  - Flanagan moved to adjourn at 9:16 p.m.; Smith seconded; roll call — all yes.
  parties:
