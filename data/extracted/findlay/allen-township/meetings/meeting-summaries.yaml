  filename: 03-04-2025.pdf
  hits:
  - one_power
  summary: At the March 4, 2025 regular meeting of the Allen Township Trustees, an
    update was provided on One Energy/One Power Company digging in the township right-of-way
    on TR215. The county engineer has not yet issued a permit to tap into the township
    catch basin, and a letter from One Power Company on this issue was received shortly
    before the meeting but had not yet been read by the Trustees. The Trustees voted
    to authorize the Allen Township Trustee chairman to approve/authorize the Hancock
    County Engineer to issue drainage-related permits related to this matter.
  corridor_relevance: The meeting text references One Energy/One Power Company digging
    in the township ROW on TR215 and a pending permit request to tap into a township
    catch basin; the text does not name a specific project or purpose beyond this
    activity and the related drainage permit authorization.
  decisions:
  - Minutes of February 6, 2025 approved.
  - Approved payment of warrants and electronic payments totaling $33,269.33.
  - Approved request from Stephanie Foster on behalf of a Girl Scout Troop to use
    the Township Center for monthly meetings in 2025 and waive rental fees.
  - 'Approved quote from Hartman & Sons LLC to replace ceiling tiles in station #1
    for $14,750.00.'
  - Approved conversion from Frontier to Spectrum for phone and internet services
    at fire stations and Township Center.
  - Approved motion to give the Allen Township Trustee chairman the authority to approve/authorize
    the Hancock County Engineer to issue drainage related permits.
  - Trustees do not desire to have a hearing on Sheetz's application for a liquor
    license at CR220 and CR99.
  - Meeting adjourned at 9:17 p.m.
