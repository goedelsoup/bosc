- date: '2026-03-03'
  kind: minutes
  filename: 03-03-2026.pdf
  hits:
  - datacenter
  - easement
  summary: At the March 3, 2026 regular meeting of the Allen Township Trustees, the
    topic of data centers possibly being constructed in the township was discussed,
    including the possibility of placing a moratorium on data center construction.
    The Trustees voted to have Cindy Land draft a letter to the Hancock County Commissioners
    requesting them to place a moratorium on data centers in Allen Township.
  corridor_relevance: The meeting connects to the datacenter subject solely through
    a discussion of data centers possibly being constructed in Allen Township and
    a subsequent motion to request a county-level moratorium on data center construction;
    the minutes do not name any specific datacenter project, developer, or parcel.
  decisions:
  - Clark moved to pay bills totaling $142,123.32; seconded by Flanagan. Roll call
    - all yes.
  - Smith moved that the FO be given the authority to pursue having a new web-site
    created with Shumaker Technology Group; seconded by Clark. Roll call - all yes.
  - Flanagan moved to accept the quote from Truland Equipment of Napoleon to trade-in
    the 2022 JD Z930M for a 2026 JD Z930M lawn mower for a boot price of $4,821.11;
    seconded by Clark. Roll call - all yes.
  - 'It was decided that Flanagan and Schimmoeller would meet with OnSite Partners
    (pka: OneEnergy/OnePower) later that week (not at a public meeting).'
  - Flanagan moved to approve job descriptions for Snow Plow Driver, Maintenance Worker
    and Janitor; seconded by Smith. Roll call - all yes.
  - Flanagan moved to approve the Frequent Traveler Policy; seconded by Clark. Roll
    call - all yes.
  - Flanagan moved to approve the Tax-Exempt Certificate Use and Sales Tax Policy;
    seconded by Smith. Roll call - all yes.
  - Smith moved to adopt a Resolution Adopting a Cybersecurity Policy; seconded by
    Flanagan. Roll call - all yes.
  - Smith moved to have Cindy Land draft a letter to the Hancock County Commissioners
    requesting them to place a moratorium on data centers in Allen Township; seconded
    by Clark. Roll call - all yes.
  - Flanagan moved to adjourn at 9:00 p.m.; seconded by Smith. Roll call - all yes.
