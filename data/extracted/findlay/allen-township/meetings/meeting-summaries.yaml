- date: '2025-03-04'
  kind: minutes
  filename: 03-04-2025.pdf
  hits:
  - one_power
  summary: The Allen Township Trustees received an update on One Energy/One Power
    Company digging in the township right-of-way on TR215, noting that the Hancock
    County Engineer has not yet issued a permit to tap into the township catch basin.
    A letter from One Power Company on this drainage permit issue was received shortly
    before the meeting but had not yet been read by the Trustees. The Trustees voted
    to authorize the Allen Township Trustee chairman to approve/authorize the Hancock
    County Engineer to issue drainage-related permits.
  corridor_relevance: The meeting text references One Energy/One Power Company digging
    in the township ROW on TR215 and a related unread letter from One Power Company
    concerning a drainage permit to tap into the township catch basin; no further
    project purpose or details are stated in the minutes.
  decisions:
  - Minutes of February 6, 2025 approved.
  - Moved to pay warrants and electronic payments totaling $33,269.33 — Roll call
    all yes.
  - Moved to grant Girl Scout Troop request to use Township Center and waive rental
    fees — Roll call all yes.
  - 'Moved to accept Hartman & Sons LLC quote to replace ceiling tiles in station
    #1 for $14,750.00 — Roll call all yes.'
  - Moved to go forward with conversion to Spectrum for communications — Roll call
    all yes.
  - Moved to give the Allen Township Trustee chairman the authority to approve/authorize
    the Hancock County Engineer to issue drainage related permits — Roll call all
    yes.
  - Trustees do not desire to have a hearing on Sheetz's liquor license application.
  - Moved to adjourn at 9:17 p.m. — Roll call all yes.
