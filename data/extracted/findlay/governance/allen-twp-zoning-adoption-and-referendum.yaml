  corrections:
    - >
      ⚠️ The reported unofficial result was 502-221. The CERTIFIED canvass is 503-221. Issue
      1463's body carries the unofficial figure; this artifact supersedes it. Both round to
      ~69%, so no downstream conclusion changes — but the certified number is the one to quote.
    - >
      ⚠️ Registration reconciliation, not an error. The zoning contest shows ALLEN W with 799
