    case_number: '[open]'
    certified_canvass: >
      [open] — the Hancock County BOE's published results begin at the November 2025 general;
      no May-2025 canvass is retrievable from the open web. See `access_failures` in
      data/documents/findlay/governance/filename-map.yaml.
    judge_name_spelling: >
      The ATZC minutes write "Jonathon Starn"; the county directory and the appellate record
      write "Jonathan Starn". Preserved as written in each source, not normalized.

# ------------------------------------------------------------------------------------------
analysis:
  - id: THE-TWENTY-MONTH-WINDOW
    tag: inference
    finding: >
      Between adoption (2024-09-09) and effect (2026-05-11) Allen Township was, as a matter of
      land use, still unzoned. That window covers the entire period in which the Megawatt Hub
      was contracted and energized and in which the +300 MW standalone interconnection was
      announced.
    why_it_matters: >
      Any vested-rights or nonconforming-use question about the Hub parcels turns on that
      window, because a use established while the township was unzoned is in a different
      posture from one established after 2026-05-11. This repo does NOT resolve that question —
      it records that the window exists and that Section 1502 of the adopted book is where the
      answer would be argued.
  - id: WHAT-THE-ELECTORATE-VOTED-ON
    tag: inference
    finding: >
      The 503 voters who approved the resolution on 2026-05-05 approved a text with no
      data-center provision in it, at a moment when the township's own counsel had said on the
      record (2026-04-07) that a data center "would not be permitted" under it. Eleven weeks
      later the zoning commission moved language that would conditionally permit data centers in
      I-1 and I-2, capped at 10 MW.
    limits: >
      This is a sequencing observation, not an allegation about anyone's intent. The 2026-06-02
      minutes show the drafting was recommended by counsel as a gap-filling measure. Nothing in
      the corpus shows the electorate was told either way.

open_targets:
  - The certified May-2025 canvass and the ballot text as printed.
  - The 2025 ballot-language case number, docket and final entry.
  - Section 1502's application to any use established during the 2024-09-09 to 2026-05-11 window.
  - Which district the map assigns to the Megawatt Hub parcels — the map is a PDF without parcel labels; this needs the auditor's parcel layer joined to the district geometry (hand off to the places sub-issue, 1462).
