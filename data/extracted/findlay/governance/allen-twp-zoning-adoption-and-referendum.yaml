      electorates and must not be reconciled against each other.
    - >
      ⚠️ 732 ballots cast against 724 votes recorded — 8 ballots on which the question was left
      blank or spoiled. Use 724 as the denominator for the percentages, as the canvass does.
  significance:
    tag: verified
    detail: >
      The canvass timestamp (2026-05-11) is the same date Article XXIV of the zoning resolution
      gives as its BOE certification and its effective date. The instrument and the election
      record agree with each other, which is what makes the effective date safe to assert.

  prior_attempt:
    election: May 2025
    outcome: >
