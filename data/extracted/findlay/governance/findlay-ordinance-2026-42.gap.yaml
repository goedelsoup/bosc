access_failure:
  targets:
    - Ordinance 2026-42 as certified by the Clerk of Council
    - Council journal / minutes for 2026-03-17, 2026-04-07 and 2026-04-22
    - Planning & Zoning Commission minutes for 2026-04-09 and the two draft codes
  observed: >
    findlayohio.gov and findlayohio.com return HTTP 403 to automated fetches on every path
    tried, with and without a browser user-agent. American Legal's Findlay code library returns
    403 to both curl and the fetch tool. There is a findlay.legistar.com hostname but no
    provisioned tenant behind it — it answers "Invalid parameters!" and the Legistar Web API
    returns "LegistarConnectionString setting is not set up in InSite for client: findlay".
  interpretation: >
    ⚠️ An ACCESS FAILURE, not a negative. None of this is evidence that the records do not
    exist or are being withheld; a WAF blocking a scripted client is an ordinary configuration.
    The standing rule from issue 1464's PUCO DIS block applies: record the failure, do not
    convert it into a finding.

open_targets:
  - Ordinance 2026-42 certified text with the clerk's certification and the recorded roll call.
  - The ordinance's own definition of "data center" — the single most load-bearing missing string.
  - Whether the 12 months runs from passage (2026-04-22) or from a separately stated effective date.
  - The two candidate zoning codes the Planning & Zoning Commission directed on 2026-04-09, and their status.
  - The 2025 annexation ordinances 2025-62 / -63 / -65 / -113 as certified.
  - Any pre-annexation agreement covering Allen Township parcels.
