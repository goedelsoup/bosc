# Allen Township proposed Section 1521 — DATA CENTERS (and the Section 1520 replacement)
#
# The two zoning-text amendments the Allen Township Zoning Commission moved on 2026-07-28 and
# set for public hearing on 2026-08-19. Read from the as-served scans:
#   data/documents/findlay/governance/Res.DataCenters.pdf  (7 pp, image-only, rendered @170dpi)
#   data/documents/findlay/governance/Res.ESS_.pdf         (5 pp, image-only, rendered @170dpi)
# Issue 1463 · sub-issue of 1265.
#
# This is CORPUS, not a RecordItem: there is no zoning RecordGroup, and inventing one would
# mean a contract bump plus a 26-bundle regeneration to publish a proposal that is not yet
# law. Same call as the four grid artifacts in issue 1464 (the Lima Lyka precedent, 1476).
#
# TAG VOCABULARY:
#   [verified]  — the text of the proposal as it reads on the filed pages, its resolution
#                 numbers, its vote, its hearing dates. These are facts about the document.
#   [inference] — this repo's reading of how the proposal interacts with the adopted book,
#                 with the disclosed facility, or with itself.
#   [open]      — not established.
#
# ⚠️ STANDING. NOTHING HERE IS LAW. Under R.C. 519.12 an amendment initiated by zoning-
# commission resolution must be heard by the commission, then transmitted to the trustees,
# then heard again by the trustees, and once adopted it is itself subject to referendum. As of
# 2026-07-31 this proposal has cleared none of those steps. Write it as a PROPOSAL every time.

