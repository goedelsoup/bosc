# ------------------------------------------------------------------------------------------
# ANALYSIS — clearly separated from the text above. Every item is [inference] or [open].
# ------------------------------------------------------------------------------------------
analysis:
  - id: LOAD-CAP-VS-DISCLOSED-FACILITY
    tag: inference
    finding: >
      The proposed cap is 10 MW Total Facility Load at any single site. The disclosed facility
      at this site is MARA Holdings' 15-year take-or-pay for the FULL 150 MW of One Power's
      Findlay Megawatt Hub, of which 30 MW is energized (see the facility record from issue
      1459). The proposal is therefore an order of magnitude below the contracted load and 3x
      below what is already energized.
    why_it_matters: >
      The aggregation rule is written to reach exactly this architecture: phases count as one
      site when "Sharing electrical infrastructure, substations, or utility interconnections,"
      which is the definition of a shared megawatt hub. A hub model cannot be sized under this
      cap by splitting tenants.
    limits: >
      This is NOT a finding that the proposal would shut the Hub. Three things are unresolved
      and none can be assumed: (a) whether the existing operation is a "Data Center" as
      defined — see DEFINITION-REACH below; (b) what Section 1502 (Nonconforming Lots, Uses of
      Land, Structures and Premises) of the ADOPTED book preserves for a use established before
      the amendment; and (c) whether the amendment is adopted at all. The proposal binds
      construction and expansion ("No data center shall be constructed or expanded to exceed"),
      which is a prospective verb.
  - id: DEFINITION-REACH
    tag: open
    finding: >
      The proposed definition captures facilities housing servers "for the purpose of storing,
      processing, or distributing electronic data." MARA Holdings is a bitcoin miner. Whether a
      proof-of-work hashing operation is "processing ... electronic data" within this definition
      is not answered by the text.
    contrast: >
      AEP Ohio's Schedule DCT does not leave this to inference — it defines a "Mobile Data
      Center" that names cryptocurrency mining outright (recorded in
      data/extracted/grid/findlay/aep-dct-tariff-posture.yaml, issue 1464). A township drafting
      from a neighboring township's template did not inherit that precision.
    retrieval: >
      Watch the 2026-08-19 hearing record and any trustee-stage revision for a crypto/blockchain
      clause. Do not resolve this from the text as it stands.
  - id: COOLING-INTERNAL-TENSION
    tag: inference
    finding: >
      Subsection D.1 permits only "air cooled (dry cooling)" and then expressly prohibits
      "Closed-loop liquid cooling systems, where water or coolant is continuously recirculated
      within a sealed system and is not consumed through evaporation." Dry cooling at
      data-center scale is normally implemented AS a sealed recirculating liquid loop rejecting
      heat to air through a dry cooler. As drafted, the permitted method and the third
      prohibited method describe overlapping equipment.
    why_it_matters: >
      This is the third cooling axis the platform already models (epic 1676 / the
      CLOSED_LOOP_DRY archetype). A rule that bans the low-water option along with the
      high-water ones is the kind of drafting artifact that surfaces at a hearing, and it is
      worth flagging BEFORE 2026-08-19 rather than after.
    limits: >
      An inference about drafting, not a legal opinion on how a zoning inspector would read it.
      The prohibition may be intended to reach liquid immersion or district-heat rejection; the
      text does not say.
  - id: INTERLOCK-WITH-THE-CLERICAL-AMENDMENT
    tag: inference
    finding: >
      Section 1521 routes approval through "the Board of Zoning Appeals in accordance with
      section 1802." But in the ADOPTED book every conditional use — I-1 (Sec. 1102),
      non-accessory solar (Sec. 1519), non-accessory storage (Sec. 1520) — is decided by the
      ZONING COMMISSION, and Article XIII opens "The Zoning Commission shall have the duty to
      hear and decide applications for conditional use permits." The 7:00 p.m. hearing on the
      same evening is what moves those duties to the BZA.
    why_it_matters: >
      The 7:30 p.m. data-center amendment presupposes the 7:00 p.m. clerical amendment. If the
      duties transfer fails or is amended and the data-center text is adopted as written, the
      section names a body that does not hold the power it assigns. The "clerical" hearing is
      load-bearing.
  - id: TERMINOLOGY-DRIFT
    tag: inference
    finding: >
      Section 1521 assigns duties to a "Zoning Administrator" (subsection I). The adopted book
      has no such officer — it uses "Zoning Inspector" throughout (Sec. 1701 Duties of Zoning
      Inspector), and Section 1521's own opening sentence says "Zoning Inspector." The
      anti-circumvention subsection, the operative anti-splitting rule, is the one that names
      the nonexistent office.
  - id: WATER-CAP-BINDS-A-DRY-FACILITY
    tag: inference
    finding: >
      The 100,000 GPD ceiling and the municipal-source-only rule are, together, a siting
      constraint independent of the load cap: Allen Township is unincorporated and the parcels
      at issue are not obviously inside a municipal water and sewer service area. A use that
      may not drill and may only take municipal water must first be reachable by a municipal
      system — which is the annexation lever the issue body flags, seen from the other side.
    retrieval: >
      Whether the Megawatt Hub parcels or the SR 613 rezoning parcels have municipal water and
      sewer availability is [open]; it is a question for the City of Findlay utilities
      department and the pre-annexation agreements sought in the records request.

