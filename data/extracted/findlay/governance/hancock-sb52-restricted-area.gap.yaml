analysis:
  - id: SCOPE-DOES-NOT-REACH-COMPUTE
    tag: verified
    finding: >
      The restricted area prohibits construction of economically significant wind farms, large
      wind farms and large solar facilities. It is silent on data centers, on load of any kind,
      and on storage. A data center in unincorporated Hancock County is unaffected by it.
    why_it_matters: >
      The county-level instrument that looks like a siting control is a GENERATION control. The
      only land-use control that reaches computing load in unincorporated Hancock County is
      township zoning — which is precisely why the Allen Township fight matters and why the
      City of Findlay's moratorium binds only inside the corporation line.
  - id: THE-GENERATION-SQUEEZE
    tag: inference
    finding: >
      Allen Township sits inside the hatched exclusion area on the proposed map. So a large new
      wind or solar facility cannot be built there, while a data center is unreached by the
      county regime and — until 2026-05-11 — was unreached by any township regime either.
    why_it_matters: >
      The county's 2022 instrument restricts the supply side and leaves the demand side open.
      That asymmetry is the shape of the whole Findlay grid story recorded in issue 1464: a
      fresh 138 kV substation built for a GENERATION interconnection (Border Basin solar, Cass
      Township, grandfathered by its 2021 filing date), and no load instrument anywhere.
    limits: >
      Rests on the PROPOSED map. If the adopted map differs, this reading must be re-checked.
  - id: GRANDFATHERED-PROJECTS
    tag: reference
    finding: >
      Two 2021-vintage solar projects predate the restricted area and were unaffected by it:
      South Branch Solar (129.6 MW, OPSB 21-0669-EL-BGN) and Border Basin I (120 MW,
      21-0277-EL-BGN). Border Basin is the IPP behind the Rocky Ford 138 kV station recorded in
      data/extracted/grid/findlay/rocky-ford-138kv-2024.project.yaml (issue 1464).
    note: >
      Case numbers carried from issue 1463's body and corroborated for Border Basin by the OPSB
      filings already in corpus. The South Branch Ohio Supreme Court affirmance
      (2025-Ohio-5679) is [reference] — the opinion is not in corpus.

open_targets:
