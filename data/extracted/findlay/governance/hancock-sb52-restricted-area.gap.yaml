# Hancock County's SB 52 restricted area — what is held, and the gap at its centre
#
# Read from the one retrievable artifact:
#   data/documents/findlay/governance/notice_from_the_hancock_county_commissioners.pdf
#   (4 pp, image-only scan, rendered @200dpi and read visually)
# Issue 1463 · sub-issue of 1265. Corpus, not a RecordItem.
#
# Named `.gap.yaml` on the issue-1464 precedent: the artifact's primary content is a
# documented ABSENCE. The county's restricted-area regime is real and consequential, but the
# ADOPTED resolution is not in corpus and could not be retrieved — only the resolution that
# scheduled the meeting at which it would be considered.
#
# ⚠️ THE HEADLINE, STATED ONCE AND PLAINLY: R.C. 303.57 et seq. restricted areas reach
# economically significant wind farms, large wind farms and large solar facilities. They do
# NOT reach data centers. Hancock County's exclusion zone is not a data-center control and
# must never be described as one.

