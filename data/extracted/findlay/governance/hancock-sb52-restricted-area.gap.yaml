gap:
  what_is_missing:
    - The resolution actually ADOPTED on 2022-04-19, and its own resolution number.
    - Its roll call.
    - The map as adopted (this file carries only the proposed map).
    - The commissioners' journal/minutes for 2022-04-19.
  why: >
    The county's AgendaCenter is reachable but its County Commissioners category holds nothing
    before 2024-02-13; a date-ranged search over March-June 2022 returns zero items, and the
    ArchiveCenter carries no journal. Recorded as an ACCESS FAILURE, not as a negative — see
    data/documents/findlay/governance/filename-map.yaml.
  correction_to_issue_body: >
    ⚠️ Issue 1463 reads "adopted an SB 52 restricted area on 2022-04-19 (2-1; Bechtol dissenting
    on the meeting-setting Resolution 167-22)". The parenthetical is right and the sentence is
    easy to misread: the 2-1 with Bechtol dissenting belongs to Resolution 167-22 of
    2022-03-15, which only set a meeting date. The vote on the ADOPTION is [open]. Secondary
    reporting from August 2022 describes a 2-1 adoption, but that is [reference] and this
    artifact does not adopt it as the roll call.

