analysis:
  - id: I-1-IS-THE-DISTRICT-AT-ISSUE
    tag: inference
    finding: >
      I-1 Light Industrial is precisely one of the two districts (with I-2) in which the
      proposed Section 1521 would conditionally permit a data center. Land rezoned to I-1
      before the amendment is heard therefore lands, if the amendment passes, inside the class
      of parcels where a data center becomes a conditional-use possibility rather than an
      unlisted use.
    limits: >
      That is a statement about the district, not about this applicant. The same is true of
      every I-1 parcel in the township, including those already zoned I-1 on the adopted map.
  - id: THE-WAREHOUSE-CLAUSE
    tag: inference
    finding: >
      The definition the ATZC moved on 2026-07-28 contains an express anti-relabeling clause:
      "Data centers shall not be considered warehouses, storage facilities, or distribution
      centers for zoning purposes," and the amendment separately defines "Warehousing" so the
      boundary is drawn on both sides. That clause was drafted in the same weeks an I-1
      application stating "Warehousing / Manufacturing" was pending.
    limits: >
      ⚠️ This is a chronology, and it is being recorded as one. The clause came from Washington
      Township's template (per the 2026-07-22 minutes), not from anything about this applicant,
      and anti-relabeling language of this kind is boilerplate in current data-center zoning.
      There is no evidence of any connection, and none is implied. The reason to record it is
      that if a warehouse-to-data-center conversion is ever proposed here, the sequence of these
      two filings will be the first thing anyone asks about — and the corpus should already
      hold the dates rather than reconstruct them later.
  - id: OWNERSHIP-AS-OF-2023
    tag: reference
    finding: >
      Neither tract stood in Interstate Capital, LLC's name in the county record as of the only
      machine-readable Hancock export (2026-08-02 read; the slice's CurrentTo is 2023-05-08).
      `020001015303` reads BISHOP FARMS LLC (Findlay) and `020001001123` reads KIROSKI DAVID D &
      CAROLINE E — both agricultural CAUV vacant land. That is exactly what R.C. 519.12 expects of
      a petition "initiated by a property owner": either the applicant took title after May 2023,
      or it petitions as a contract purchaser or optionee with the owners' consent.
    limits: >
      ⚠️ This says NOTHING about whether Interstate Capital holds title today, and it is not
      evidence that it does not. The export predates the filing by three years, and the two county
      systems that would carry the current chain refuse automated retrieval — the Auditor's Beacon
      CAMA returns Cloudflare HTTP 403 and the Recorder's Kofile CountyFusion index is login-gated
      (both probed 2026-08-02). The instrument to pull is the deed, by hand or with a recorder
      account. The `parcels` names above are the exhibit's; the owner names here are the tax-bill
      mailing labels the OGRIP public view carries in place of an owner field.
  - id: TIMING-AGAINST-THE-AMENDMENT
    tag: verified
    finding: >
      The rezoning is heard 2026-08-05. The data-center amendment is heard 2026-08-19. If the
      trustees act on the rezoning before the amendment completes its own R.C. 519.12 track,
      the parcels change district under the rules as they stand today.

open_targets:
  - The 2026-08-05 ATZC hearing outcome and recommendation, and the trustees' subsequent action.
  - >
    Who owns parcels 020001015303 and 020001001123 of record TODAY, and whether Interstate Capital
    holds title, an option or a contract. Partially answered by 1462: the parcel keys are confirmed
    (the notice's 12-digit form is the auditor's) and the 2023-05-08 owners are Bishop Farms LLC
    and Kiroski, but the current chain needs the deed — the Auditor's Beacon CAMA and the
    Recorder's Kofile index both refuse automated retrieval. Manual/authenticated pull.
  - Interstate Capital, LLC's Ohio Secretary of State registration and statutory agent, and any related entity.
  - A legible copy of the site-plan inset (the two building square footages).
  - Whether the site has municipal water and sewer availability, which the proposed Sec. 1521 would make a precondition for any data center there.
  - Whether a referendum petition follows any adopted rezoning.
