# Interstate Capital, LLC — "Allen Commerce Park" rezoning application, Allen Township
#
# The first live land-use application under Allen Township's brand-new zoning regime, filed
# eleven days after the township's counsel advised drafting data-center rules and heard two
# weeks BEFORE the data-center amendment's own hearing. Read from:
#   data/documents/findlay/governance/Application-Zoning-Amendment-Interstate-Capital.pdf
#   data/documents/findlay/governance/Application-Attachments.pdf
#   data/documents/findlay/governance/Minutes-7-7-26-ATZC.pdf
# Issue 1463 · sub-issue of 1265. Corpus, not a RecordItem.
#
# ⚠️ READ THIS FIRST. The application states its proposed use as "Warehousing / Manufacturing".
# NOTHING in the corpus connects Interstate Capital, LLC to a data center, and this artifact
# does not suggest one. It is recorded because a governance watch records what is FILED in the
# jurisdiction it watches — an ~135-acre agricultural-to-industrial rezoning on the same state
# route as the Megawatt Hub, in the month the township was writing its data-center rules, is a
# filing the watch exists to catch. Treating it as anything more would be exactly the
# unsupported leap the evidentiary discipline forbids.

