general_permit:
  permit_no: OHP000001
  title: General Permit Authorization to Discharge Total Phosphorus from Point Source Facilities
    in the Maumee Watershed under the NPDES
  issued: '2023-11-01'          # printed as the Effective Date on p. 1
  expires: '2028-10-31'
  signed_by: Anne M. Vogel, Director, Ohio Environmental Protection Agency
  facilities_covered: 39
  source: data/documents/oepa/OHP000001.pdf
  compliance_rule:
    part: IV.C
    page: 8-9
    cumulative_rule: >-
      "The sum of the Individual Loads from all facilities covered under this general permit
      ('Cumulative Load') shall not exceed the Cumulative Load Limit."
    individual_compliance: >-
      "For any given season, individual permittees shall be in compliance with its Individual Load
      Limit if: a. The Cumulative Load does not exceed the Cumulative Load Limit or; b. The
      Cumulative Load exceeds the Cumulative Load Limit but the permittee's Individual Load does
      not exceed their respective Individual Load Limit."
    individual_violation: >-
      "For any given season, individual permittees are in violation of their Individual Load
      Limit only if: a. The Cumulative Load exceeds the Cumulative Load Limit and; b. The
      permittee's Individual Load exceeds their respective Individual Load Limit."
    director_remedy: >-
      Part IV.C.4 — on review of each Season Report the Director "may re-evaluate the eligibility"
      of permittees over their Individual Load Limits; Part IV.C.5 makes any future exceedance by
      a permittee determined ineligible a violation regardless of the cumulative total.
    individual_permit_not_superseded: >-
      Part IV.C.6 — "The total phosphorus limitations in this permit do not supersede total
      phosphorus limitations in the permittees' respective individual NPDES permits."
  season_report:
    part: IV.D
    due: September 1 of each year
    contents: the calculated Individual Load and an assessment against the Individual Load Limit;
      a summary of load-reduction activities; any other relevant information
    status: '[open] — Findlay''s own Season Reports are not in the corpus. They are the record
      that would say whether the plant is still over 3,200 kg. A records-request lead.'

