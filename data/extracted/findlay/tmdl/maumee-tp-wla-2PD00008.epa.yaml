method: >-
  Reviewed transcription of the Findlay WPCF rows from THREE committed Ohio EPA instruments, read
  verbatim from each PDF's embedded text layer (these are digitally generated documents, not
  scans). Each figure below names the instrument and page it came from. Nothing is derived,
  averaged, or carried between instruments except where a field says so explicitly.
source_text_excerpt: >-
  Table A4.1 (Appendix 4, p. A4-1): "2PD00008 Findlay WPCF 3.2 21.0". Table A4.3 (p. A4-8):
  "2PD00008 Findlay WPCF 0.016 0.11". Table A4.5 (p. A4-10): "2PD00008 Findlay WPCF 4.4 3.2 4.8
  5.5 5.3 5.5 5.4". OHP000001 Part IV.A.1 (p. 8): "City of Findlay WPCF 3200". OHP000001 Part
  I.C.1 (p. 2): "City of Findlay WPCF  OH0025135  2PD00008  Blanchard River".
action:
  confidence: high
  warnings:
  - >-
    The 3.2 metric tons (Table A4.1) and the 3,200 kg (OHP000001 Part IV.A.1) are the SAME
    allocation stated in two units by two instruments, not two allocations. Do not add them.
  - >-
    Table A4.5's seven numeric columns are, in order, 2008 / WLA / 2017 / 2018 / 2019 / 2020 /
    2021. The first column is a 2008 baseline load and the second is the allocation — reading the
    row left-to-right as a time series would misreport both.
  - >-
    The most recent per-facility spring load on this record is 2021. The 2024 Biennial Report
    publishes only the BASIN GROUP total, not Findlay's own load, so no post-2021 Findlay figure
    is asserted here. Whether Findlay is still over its allocation is [open] — the annual Season
    Report required by OHP000001 Part IV.D is the record that would answer it (a records-request
    lead).
