  expiration_date: '2028-10-31'   # OHP000001's own expiration
  # Bare permittee name on purpose: the cross-document entity graph keys on this field, and a
  # parenthetical facility gloss here forks the City of Findlay into a second node. The facility
  # is named in `facility` and the instruments name it "Findlay WPCF" throughout.
  applicant: City of Findlay
  applicant_address: 1201 South River Road, Findlay, OH 45840, Hancock County
  facility: Findlay Water Pollution Control Center (WPCC/WPCF), NPDES 2PD00008 / OH0025135
  site_address: 1201 South River Road, Findlay, OH 45840, Hancock County
  project_name: Maumee Watershed Nutrient TMDL — Findlay WPCF total-phosphorus wasteload allocation
  affected_resource: Blanchard River (RM 56.42) → Auglaize River → Maumee River → Lake Erie
    Western Basin
  note: >-
    [verified] Findlay WPCF's spring-season total-phosphorus wasteload allocation is 3.2 metric
    tons (3,200 kg), and its reported spring loads for every year on the TMDL's own record —
    2017 through 2021 — were 4.8, 5.5, 5.3, 5.5 and 5.4 metric tons. Its 2008 baseline load, 4.4
    MT, was also above it. The allocation is enforced not through the plant's individual permit
    but through the Maumee Watershed Total Phosphorus general permit OHP000001, whose compliance
    rule (Part IV.C.3) makes an individual exceedance a violation ONLY when the 39-facility
    CUMULATIVE load also exceeds its cap. In the 2024 spring season the group reported 43,304 kg
    against a 64,170 kg cap — 20,866 kg of headroom — so an over-allocation Findlay load was not,
    on that record, a violation of anything.

