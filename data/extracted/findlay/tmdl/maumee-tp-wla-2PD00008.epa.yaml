  source: data/documents/maumee-tmdl/2024_Maumee_Biennial_Report_Final_clean.pdf
  document: Maumee Watershed Nutrient TMDL Biennial Report, December 2024
  page: 13-14
  season: March – July 2024
  facilities_covered: 39
  cumulative_load_limit_kg_tp: 64170
  allowance_for_future_growth_kg_tp: 1400
  cumulative_load_reported_kg_tp: 43304
  headroom_kg_tp: 20866
  finding: >-
    The group bubble had 20,866 kg of headroom in its first reported season, so under Part IV.C.3
    no covered facility could be in violation of its individual limit that season — including one
    running ~50-70% over its own allocation.
  note: >-
    The report publishes the group total only. It does not publish per-facility 2024 loads, so it
    neither confirms nor refutes a continuing Findlay exceedance.

individual_permit_phosphorus_limit:
  note: >-
    Distinct from the allocation above and easy to conflate. NPDES permit 2PD00008 carries its own
    total-phosphorus limit of 1.0 mg/L (30-day average) / 56.8 kg/day, on basis "PTS" —
    Phosphorus Treatment Standards, OAC 3745-33-06(C), a TECHNOLOGY standard, not the TMDL. The
    TMDL allocation reaches the plant only through OHP000001. Both bind
    (OHP000001 Part IV.C.6).
  source: data/extracted/oepa/findlay/2PD00008.fs.npdes.yaml (Table 14, p. 31)
  local_limits_evaluation: >-
    The *VD permit's Schedule of Compliance (event 52599, due 2026-05-01) requires the City to
    evaluate whether local industrial-user limits for total phosphorus would make substantial
    progress toward a 0.5 mg/L monthly average — half the permit limit — or to submit evidence
    that they would not.

