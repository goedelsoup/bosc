# Places handoff (#1462) — the flood-mitigation footprints for Findlay.
#
# This is a DESCRIPTOR, not committed geometry. Issue #1465 was asked to hand the Eagle Creek
# basin + benching footprints to the places sub-issue "as committed geometry" — but the public
# record gives only VERBAL bounds and an acreage, not a surveyed polygon or a parcel list. Per the
# repo spine ("never fake a value to make a partial site look complete"), no polygon is fabricated
# here: the sourced spatial facts are recorded so #1462 can commit real geometry (e.g. from the ODNR
# Dam Safety permit's parcels, or the Hancock parcels within the stated bounds), and the polygon
# itself stays [open].
#
# NOTE: this file deliberately carries NO top-level `deed`/`action`/`permit`/`filing`/`plan`/`meta`
# key, so it is inert to the record + corpus classifiers — it does not become a record row and does
# not lift the places domain (which correctly gates on committed `geo/campus` geometry, still absent).
# It is NOT the data-center campus footprint: that is the profile's `footprint_relpath`
# (extracted/findlay/bosc-site-footprint.yaml), owned by the facility places thread — do not merge.

handoff:
  to_issue: 1462          # readiness(findlay) places — committed geometry + SSURGO HSG
  from_issue: 1465        # the flood-mitigation instrument chain
  status: accepted        # #1462 committed the ACQUISITION geometry; see acquired_land below
  polygon: open           # STILL [open] — the dam alignment / impoundment outline. See below.
  accepted_by: >-
    #1462 took the gis_seed_hint's second path and it worked: the Hancock parcel record carries the
    acquisition. data/reference/findlay/civic-and-flood-places.geojson commits 18 parcels standing
    in the Maumee Watershed Conservancy District's name in Eagle Township — 795.35 ac CAMA / 782.77
    ac planar, place_role 'flood_storage_basin' — with situs addresses on exactly the four roads
    this descriptor names (TR 76, TR 77, TR 49, US RT 68), spanning 40.9739-40.9890 N against
    downtown Findlay at 41.0440 (3.4-4.5 mi south), and seven Eagle Creek flowline segments through
    the block (USGS NHD large-scale). Township confirmed via Census TIGER. Every verbal bound below
    checks out against it.
  still_open: >-
    ⚠️ THE ACQUISITION IS NOT THE IMPOUNDMENT, and this file's `polygon: open` stands for the thing
    it was always about. 795.35 ac of LAND ACQUIRED is not the published "approximately 765 acres"
    WITHIN THE DAM ALIGNMENT: acquired land properly exceeds the impoundment (embankment, access,
    buffer), so the two are consistent, but neither is derived from the other and no surveyed
    impoundment outline or ODNR Dam Safety permit exhibit is in the corpus. Also note the vintage —
    the OGRIP Hancock slice is a 2023-05-08 export cut while acquisition was still in progress, so
    795.35 ac is a FLOOR on what MWCD holds today, not a closing figure. The permit exhibit remains
    the instrument to pull.

eagle_creek_dry_storage_basin:
  impoundment_acres:
    value: 765
    approx: true          # "approximately 765 acres" within the dam alignment
    tag: verified
  bounds:                 # verbal bounds as published — NOT a polygon
    west: Township Road 76
    east: US-68
    township: Eagle Township, Hancock County, OH
    relative_location: approximately 4 miles south of downtown Findlay
    tag: verified
  status:
    final_design: complete
    property_acquisition: complete            # easements/permits in progress
    odnr_dam_safety_permit: obtained          # ODNR Division of Water Resources, Dam Safety Program; permit no. [open]
    tag: verified
  modeled_effect:
    peak_flow_reduction_cfs: ~2550            # "about 2,550 CFS" — ~16% on the Blanchard during the 1% ACE event
    bfe_lowering_ft_at_confluence: ~2.2       # "about 2.2 feet" — near the Blanchard / Eagle Creek confluence, downtown
    floodplain_removed_parcels: ~1830         # "approximately 1,830 parcels" — regulatory FLOODPLAIN (distinct from FEMA's floodway metric)
    floodplain_removed_acres: ~1400           # "approximately ... 1,400 acres" (same source clause as parcels)
    tag: verified
  source: https://hancockcountyflooding.com/eagle-creek-dry-storage   # read direct
  gis_seed_hint: >-
    Candidate committed-geometry paths for #1462: the ODNR Dam Safety construction-permit parcel set;
    or the Hancock parcels (OGRIP statewide layer scoped County='Hancock', already wired) that fall
    within TR-76/US-68 in Eagle Township. profile abstraction/super gage 04188496 (Eagle Creek above
    Findlay) sits on this tributary.

phase1_benching_reach:
  reach: Blanchard River between Howard Run and the Norfolk Southern railroad bridge
  work:
  - floodplain benching near Swale Park
  - removal of four low-head dams downstream of Lye Creek
  - instream riffle construction at the low-head-dam sites
  completed: '2024'
  lomr_effect:                                # the SFHA accounting, distinct from the basin's floodplain metric
    sfha_parcels_removed: 375                 # ~15 acres completely removed from the SFHA
    sfha_parcels_reduced: 985                 # ~67 acres remaining in the SFHA at a reduced 100-yr WSE
    submitted_to_fema: '2025-09-18'
    tag: verified
  source: https://hancockcountyflooding.com/about-us   # read direct; LOMR figures via findlayohio.gov News/2009/1375 (403; search-rendered)
  polygon: open                               # [open] the benched-reach footprint is not committed geometry

phase2_downtown_benching:
  scope: Additional Hydraulic Improvements + soil remediation (Cory St to the CSX tracks / around the NS bridge)
  soil_remediation:
    contractors: [CEC (Civil & Environmental Consultants Inc.), Buckeye Elm Contracting]
    contaminants: [lead, arsenic, mercury, cadmium, PAHs]
    removed_tons: {impacted_soil: 7325, glass_fill: 1070, asphalt: 432}   # disposed at the Hancock County Landfill
    completed: December 2025 – February 2026
    tag: verified
  source: wfin.com soil-remediation completion story (403; search-rendered)
  polygon: open

acquired_land:            # [verified] the committed acquisition geometry (#1462) — NOT the impoundment
  geojson: data/reference/findlay/civic-and-flood-places.geojson
  place_role: flood_storage_basin
  owner: Maumee Watershed Conservancy District
  parcels: 18
  cama_acres: 795.35
  planar_acres: 782.77    # UTM 17N (EPSG:32617); three non-contiguous blocks
  township: Eagle Township, Hancock County, OH
  source: OGRIP Ohio statewide parcels public view, County='Hancock' (CurrentTo 2023-05-08), read 2026-08-02
  tag: verified

