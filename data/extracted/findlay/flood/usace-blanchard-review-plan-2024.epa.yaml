  note: >-
    [reference] The USACE LRD Review Plan (published 2024-01-11) scoping agency + peer review for a
    Feasibility Study of flood risk management and ecosystem restoration plans for the Blanchard River
    Watershed. This is the open federal thread behind the flood-mitigation instrument chain: the
    Corps' prior "Western Diversion of Eagle Creek" recommended plan (presented 2015) "was deemed
    unlikely to meet Federal funding requirements because of its negative cost benefit ratio and low
    community support" (program FAQ, verbatim). The 2024 posting's status — renewed feasibility effort
    vs archival — is [open]; it is flagged as a lead. The locally-funded program (MWCD / Stantec, FEMA
    FMA + ODNR + Ohio Capital Budget) proceeded independently of the federal study.

