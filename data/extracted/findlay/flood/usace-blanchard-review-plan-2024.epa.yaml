source_text_excerpt: >-
  Blanchard River Watershed, Ohio Feasibility Report. Published Jan. 11, 2024. "This Review Plan
  defines the scope and level of agency and peer review for the Feasibility Study of flood risk
  management and ecosystem restorations plans for the Blanchard River Watershed, Ohio." The article
  is a brief announcement linking to a related document on DVIDSHUB.
action:
  confidence: medium
  warnings:
  - >-
    The LRD source page 403'd on direct WebFetch and on curl (Akamai "Access Denied"); the body was
    obtained via a reader proxy (r.jina.ai). Treat the verbatim string and the 2024-01-11 date as
    reader-proxy-recovered, not a clean primary read — the article should be re-captured from a
    non-datacenter IP to lock byte-verbatim text.
  - >-
    Whether the 2024-01-11 Review Plan signals a RENEWED/active federal feasibility effort or is an
    archival closeout is an [inference] from the document type (a Review Plan is USACE QA/peer-review
    scoping, normally produced at the START of a feasibility study) and its title ("Feasibility Study
    of flood risk management and ecosystem restorations plans"). The page states no "active / renewed
    / archival" status in words.
  - >-
    The 2015 USACE recommended plan ("Western Diversion of Eagle Creek") is characterized as having a
    NEGATIVE benefit-cost ratio in the program FAQ, but no NUMERIC 2015 BCR is public in any source
    reached. Do NOT confuse that failed federal BCR with the LOCAL program's own 2.94 BCR (the 2018
    Jack Faucett Associates / Stantec analysis) — two different studies.
