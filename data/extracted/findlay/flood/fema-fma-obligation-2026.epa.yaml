method: >-
  manual transcription of the FEMA press release (2026-04-22) and its funds-obligation follow-through.
  The FEMA.gov release, the City of Findlay newsroom pages (News/1818 obligation notice; News/2009/1375
  LOMR notice), and wfin.com all returned HTTP 403 to direct fetch. Figures below were recovered from
  independently-fetched mirrors that quote the same release — 13abc.com, spectrumlocalnews.com, and the
  full text of Rep. Bob Latta's (OH-5) press release (via wktn.com) — and cross-checked against the
  project site hancockcountyflooding.com. Figures read from the reporting, not from any filename.
source_text_excerpt: >-
  FEMA Approves $24 Million for Flood Mitigation Project in Findlay. "FEMA will pay 51 percent of the
  $46.8 million eligible project cost, while the Ohio Department of Natural Resources will provide the
  remaining 49 percent of the funds, $22.8 million" (13abc, verbatim). The project will "restore 935
  acres of the riverbank to native wetland, increasing the floodplain's capacity" and has "removed
  1,290 parcels of land and 1,500 acres from the regulatory floodway." Award distributed through
  "FEMA's Flood Mitigation Assistance program."
# Refiled ``action:`` -> ``award:`` when the RecordGroup taxonomy gained a ``finance`` bucket
# (#1746, fulfilling this site's TAXONOMY-GRANTS lead) — the filename keeps its as-committed
# ``.epa.yaml`` suffix so the record's rel (cited across feeds/tests) stays stable.
award:
  confidence: high
  warnings:
  - >-
    The FEMA.gov primary release (and the City of Findlay obligation notice, News/1818) returned HTTP
    403; all dollar/parcel/acre figures are corroborated across 13abc.com, spectrumlocalnews.com and
    Rep. Latta's release (wktn.com), not read byte-verbatim from FEMA.gov. High confidence, multiply
    sourced; re-capture the FEMA release + city notice from a non-datacenter IP to lock the primary text.
  - >-
    FLOODWAY vs FLOODPLAIN — do not conflate. This FEMA release counts "1,290 parcels and 1,500 acres
    removed from the regulatory FLOODWAY" (13abc / spectrum). The Eagle Creek basin project page counts
    "approximately 1,830 parcels and 1,400 acres from the regulatory FLOODPLAIN" (hancockcountyflooding.com).
    Different regulatory zones AND different numbers; both preserved below. The Phase-I LOMR's SFHA
    accounting (375 removed / 985 reduced) is a third, separate metric.
  - >-
    Do NOT merge the November-2024 CONDITIONAL-approval reporting (hometownstations/WLIO, "November 15,
    2024," funds "within 6 to 9 months") into this record. This is the 2026-04-22 FINAL obligation that
    unlocked summer-2026 bidding — a distinct event.
  program: Flood Mitigation Assistance (FMA)
  agency: Federal Emergency Management Agency (FEMA), U.S. Department of Homeland Security, Region V
  instrument: grant
  award_no: EMC-2023-FM-003-0004   # Ohio EMA grant ID (per the Ohio EMA Draft Environmental Assessment); not the FEMA release itself
  borrower: >-
    City of Findlay (subapplicant), in partnership with the Hancock County Commissioners and the
    Maumee Watershed Conservancy District (MWCD)
  project_name: >-
    Hancock County Flood-Risk Reduction Program — Eagle Creek Dry Storage Basin + Blanchard River benching
  amount_usd: 24000000
  award_date: '2026-04-22'
  action: grant approved / funds obligated   # the event the release announces (extra field)
  site_address: Blanchard River watershed, Findlay / Hancock County, Ohio
  affected_resource: >-
    Blanchard River regulatory floodway and floodplain; downtown Findlay businesses, agriculture, and
    residential neighborhoods (the 2007 flood event drove the program).
  note: >-
    [verified] FEMA's Flood Mitigation Assistance (FMA) obligation of $24,000,000 to the City of
    Findlay, announced 2026-04-22 — 51% of the $46.8M eligible project cost, with the Ohio Department
    of Natural Resources providing the remaining 49% ($22.8M). The FMA grant is anticipated to provide
    $19M for the Eagle Creek Flood Basin and $5M for benching (city obligation notice, News/1818). The
    funds-obligation notification cleared the milestone that let the community bid the two cornerstone
    contracts (Downtown Phase 2 Benching + Eagle Creek Dry Storage Basin), opened 2026-06-30. This is
    the headline instrument of the flood-mitigation chain (issue #1465).

