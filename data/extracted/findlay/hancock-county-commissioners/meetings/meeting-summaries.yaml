  summary: At the March 26, 2026 Hancock County Commissioners meeting, Deb Stacy raised
    concerns about the county commissioners' and township trustees' limited role in
    economic development, which led to a broader discussion about annexations, utilities,
    and data centers. Commissioner Bechtol clarified that there is no state statute
    permitting county commissioners to enact a county-wide moratorium on data centers,
    noting this is a zoning function. Discussion also touched on the ability of townships,
    villages, and the City of Findlay to implement their own moratoriums on data centers,
    as well as an Economic Development study on the subject.
  corridor_relevance: The meeting text mentions data centers in the context of a discussion
    about whether county commissioners can enact a county-wide moratorium on them,
    with Commissioner Bechtol stating no such state statute exists; no specific data
    center project, site, or party is named in the minutes beyond this general discussion.
  decisions:
  - 'Motion to approve minutes from March 24, 2026: William Bateson made motion, Timothy
    Bechtol seconded, passed 2-0 (Jeffrey Hunker abstained).'
  - 'Motion to approve two Warrant Journals: William Bateson made motion, Timothy
    Bechtol seconded, passed 3-0.'
  - 'Resolution #203-26 — Additional appropriation within the Auditor''s certification
    - Commissioners to appropriate to Severance Fund #2136: William Bateson made motion,
    Timothy Bechtol seconded, passed 3-0.'
  - Commissioners told Adam Miller to wait until May regarding new plants for the
    Judicial Center.
  - Commissioners approved the Chatelain quote for the sign at the Olive Street building.
  - Commissioner Bechtol told Adam Miller to talk to Wood County Building Inspector
    regarding window treatments at the cottages.
