  summary: During the March 26, 2026 Hancock County Commissioners meeting, Deb Stacy
    raised concerns about the county commissioners' limited role in economic development,
    prompting discussion about annexations, utilities, and data centers. Commissioner
    Bechtol clarified that there is no state statute permitting county commissioners
    to enact a countywide moratorium on data centers, noting this is a zoning function.
    Discussion also touched on the ability of townships, villages, and the City of
    Findlay to implement their own moratoriums on data centers, as well as the Economic
    Development's ongoing study on the subject.
  corridor_relevance: The meeting text references data centers in the context of a
    discussion about whether county commissioners have authority to enact a countywide
    moratorium, and mentions an Economic Development study on data centers, but does
    not name any specific data center project, applicant, or location.
  decisions:
