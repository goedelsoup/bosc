source_text_excerpt: >-
  "I am writing to inform you that, after careful consideration by our senior leaders, the
  Michigan Sugar Company will be closing its warehouse facility located at 1343 Greenwood Street,
  Findlay, OH 45840... Rail service was previously severed to the Findlay site and Ohio has
  stricter limits on truck weights than Michigan which means it is often difficult to transport
  sugar from our Michigan factories to the site... Although we do not believe the closure required
  any notice, we are sending this as a courtesy to be considered notice of a facility closing
  under the Worker Adjustment and Retraining Notification Act (WARN Act)." Stamped: "Received:
  12/11/2025 @ 4:56pm".
layoff_notice:
  confidence: high
  warnings:
  - >-
    The employer expressly disclaims that WARN was triggered — "Although we do not believe the
    closure required any notice, we are sending this as a courtesy." This is a COURTESY filing.
    Treating it as a statutory WARN trigger would misstate the employer's own position; four
    employees is far below the federal threshold.
  - >-
    No final day of operations is stated. The letter says it "has yet to be determined." The only
    fixed date is that the two BCTGM-represented employees "will remain on our active roll until
    January 31, 2026". No closure date is asserted here.
  - >-
    Three notification dates appear and are distinct: verbal notice to employees 2025-12-04,
    written notice to BCTGM Local 19 on 2025-12-03, written notice to the two represented
    employees on 2025-12-11. They are recorded separately below rather than collapsed.
  statute:
  - Worker Adjustment and Retraining Notification Act (WARN Act) — filed as a courtesy, the
    employer stating it does not believe notice was required
  filed_with: Ohio Department of Job and Family Services (ODJFS) and the Mayor of Findlay
  addressee: >-
