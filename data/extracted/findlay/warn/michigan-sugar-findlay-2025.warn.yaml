  county: Hancock
  action: facility closing (warehouse)
  scope: the warehouse operation; the site does not produce sugar
  permanent: true
  employees_affected: 4
  final_day_of_operations: null   # "has yet to be determined"
  union: Bakery, Confectionery, Tobacco Workers and Grain Millers Local 19 (BCTGM)
  represented_employees: 2
  notice_dates:
    union_written: '2025-12-03'
    employees_verbal: '2025-12-04'
    represented_employees_written: '2025-12-11'
    represented_employees_on_roll_until: '2026-01-31'
  stated_rationale:
  - an evolving product mix and customer base that lets the company serve customers from other
    warehousing sites
  - >-
    "Rail service was previously severed to the Findlay site and Ohio has stricter limits on truck
    weights than Michigan which means it is often difficult to transport sugar from our Michigan
    factories to the site."
  - outdated and obsolete equipment that would require significant capital investment at a site
    that neither produces sugar nor has rail service
  note: >-
    [verified] A four-employee warehouse closure, noticed to ODJFS and to the Mayor of Findlay on
    2025-12-11. Small in headcount, but the stated rationale is an INFRASTRUCTURE finding on the
    record: rail service to the site had already been severed, and the employer names that
    severance — together with Ohio's truck-weight limits — as a reason the site is no longer
    serviceable. That is a freight-access datum about a Findlay industrial parcel, from the
    tenant, in a filed instrument.

