method: >-
  Verbatim transcription from the PDF's embedded text layer (pypdf). Two pages: the notice letter
  and the enclosed job-title table. This is a digitally generated letter, not a scan.
source_text_excerpt: >-
  "January 30, 2026 / VIA EMAIL (rapdresp@jfs.ohio.gov) / Matt Damschroder, ODJFS Director...
  We are writing to inform you that The Goodyear Tire & Rubber Company will close its Tall
  Timbers Mold facility located at 2025 Production Drive Findlay, OH 45840. As required by the
  Ohio WARN Act and the federal Worker Adjustment and Retraining Notification Act of 1988, this
  letter serves to give you notice of the closing. The entire facility will close and this action
  is expected to be permanent." Stamped: "Received: 1/30/2026 @ 2:33pm".
layoff_notice:
  confidence: high
  warnings:
  - >-
    The letter states no destination for the work and names no receiving plant. Any claim that
    this closure consolidates production to another Goodyear site is NOT supported by this
    instrument and is not asserted here.
  - >-
    The letter names no labor organization and states "There are no bumping rights at this
    location." Do not attribute union representation at this facility from this document.
  - >-
    The separation date is stated as a 14-day window, not a date: "on or around the 14-day period
    commencing on March 31, 2026." `separations_begin` below is the window's start as printed.
