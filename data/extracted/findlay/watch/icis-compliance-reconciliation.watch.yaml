# --- the reconciliation ------------------------------------------------------------------------

reconciliation:
  study_plan_2025_12_01:
    verdict: stale federal record — the issue body's hypothesis holds HERE
    tag: inference
    reasoning: >-
      The permit in force carries one and only one "Submit Study Plan" event, code 34099, and its
      due date is 2026-11-01. It carries no milestone of any kind due 2025-12-01. The *VD
      modification's entire substance was to change 34099's due date, and a modification that
      moves a deadline forward implies an earlier deadline that it replaced. ICIS's unachieved
      Study Plan dated 2025-12-01 is therefore the pre-modification instance of event 34099,
      superseded by a state action effective 2026-02-01 that the federal system has not retired.
    why_not_verified: >-
      The *UD permit AS ISSUED is not in the corpus — the Ohio EPA DAM's permits/doc slot serves
      the *VD modification package instead (issue 1460, lead UD-ISSUANCE-BYTES). So the
      pre-modification due date of event 34099 is not held as a byte anywhere, and 2025-12-01 is
      inferred from ICIS rather than read from the instrument. Obtaining the *UD issuance would
      convert this to [verified] in one step, which is a concrete payoff for that standing lead.
    do_not_write: >-
      Do not write that Findlay missed a CSO study-plan deadline. On the state record the
      deadline is 2026-11-01 and has not arrived.
  plan_report_2026_05_01:
    verdict: LIVE — the issue body's hypothesis does NOT hold here
    tag: verified
    reasoning: >-
      The date matches exactly, and the milestone is in the permit AS CURRENTLY IN FORCE. Event
      52599 is due 2026-05-01 under the *VD permit at page 14; the *VD modification did not touch
      it — the transmittal letter's two revisions are confined to event 34099 and the LTCP
      addendum language. So no state action explains this flag. As of the 2026-07-31 ICIS extract
      the milestone stands recorded as neither achieved nor reported, three months past due.
    what_is_still_open:
      tag: open
      question: >-
        Whether the City submitted the local-limits technical justification and Ohio EPA has not
        entered it, or whether it was not submitted. "Unachieved and not reported" is an ICIS
        status, and a state-to-federal data lag is a real and common cause. What is established
        is that the modification does NOT explain it.
      how_to_close: >-
        Ohio EPA Central Office Pretreatment Unit and the Northwest District Office are the two
        addressees the permit names for this submission. A records request for the submittal and
        any Ohio EPA acceptance letter would close it.
    why_it_matters: >-
      This is the phosphorus milestone. The evaluation it requires is whether local industrial
      limits would move the plant toward 0.5 mg/L monthly average — and the eight significant
      industrial users discharging 0.428 MGD are the load it would reach. It is the one scheduled
      event in this permit that could change the plant's phosphorus trajectory, and it is the one
      the federal record says has not been reported.
    siu_citation:
      source: data/documents/oepa/findlay/2PD00008.fs.pdf
      page: 8
      verbatim: >-
        "The City of Findlay has an approved pretreatment program. The City of Findlay has eight
        significant industrial users including five categorical users that discharge 0.428 MGD of
        flow."

