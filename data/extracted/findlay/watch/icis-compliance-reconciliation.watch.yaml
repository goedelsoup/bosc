    violations begin 2025-12-01 and 2026-05-01 and so cannot reach the two 2025 quarters.
  what_was_checked: >-
    CWAEffluentCompliance and CWAEffluentComplianceEXP carry only the 2023-10 ammonia row.
    CWASECompliance, CWACSCompliance, CWAEffluentALRExceedences, CWA3YrD80D90Counts, Notices,
    FormalActions and ICISFormalActions are all EMPTY for this permit. No formal action, no
    penalty, no notice.
  do_not_speculate: >-
    The driver is not published in the Detailed Facility Report. Candidate categories exist —
    DMR non-receipt, pretreatment reporting, biosolids reporting (the facility carries both a
    biosolids and a sewage-sludge report flag) — but nothing in the retrieved record selects
    among them, and no guess is recorded here.
  how_to_close: >-
    The ICIS-NPDES quarterly non-compliance history (QNCR) tables in EPA's ECHO bulk downloads
    carry the noncompliance category per quarter; alternatively Ohio EPA's Northwest District
