# --- the CSO clock -----------------------------------------------------------------------------

cso_clock:
  deadline: '2026-11-01'
  what_is_due: >-
    The LTCP Addendum — a list of projects and an implementation schedule that will meet the goals
    of the Long-Term Control Plan — together with the Municipal CSO Schedule milestone summary
    report, event 34099. Both were moved to this date by the *VD modification issued 2025-11-07,
    effective 2026-02-01.
  history: >-
    Findlay's 1998 LTCP did not attain its designated level of control of four overflows per
    typical year. A 2018 evaluation found twelve CSO outfalls no longer had combined sewer
    upstream and were in substance sanitary sewer overflows. An updated integrated plan was
    submitted 2020-01-31 and approved 2021-07-08; the City then asked for more time to evaluate
    its treatment system and develop a new plan, and 2026-11-01 is where that request landed.
  days_remaining_at_ingest: 91
  watch: >-
    Whether the addendum lands on time, and whether the date moves a third time. A further
    modification would appear as a new public notice on the 2PD00008 permit and would carry a new
    letter suffix (*WD).
  see_also: data/extracted/findlay/watch/cso-sso-overflow-record.watch.yaml

# --- the mercury variance trigger --------------------------------------------------------------

mercury_variance_trigger:
  tag: verified
  standing_condition: >-
    The permit's mercury variance sets a monthly average of 3.3 ng/L and a daily maximum of 1,700
    ng/L, departing from a water-quality-based limit of 1.3 ng/L. Its standing condition is that
    the ANNUAL average stay at or below 12 ng/L; exceeding it starts a six-month clock to an
    individual-variance application, failing which the 1.3 ng/L WQBEL applies.
  measured:
    source: DMR parameter 50092 (Mercury, total low level), outfall 001, MO AVG, ng/L
    annual_mean_of_reported_months:
      '2023': {mean_ng_l: 0.688, months_reported: 11, max_month: 1.03}
      '2024': {mean_ng_l: 1.115, months_reported: 4, max_month: 1.49}
      '2025': {mean_ng_l: 0.749, months_reported: 6, max_month: 0.91}
      '2026': {mean_ng_l: 0.855, months_reported: 4, max_month: 1.04}
    highest_single_month_in_record: {value_ng_l: 1.49, period: '2024-09'}
  finding: >-
    Quiet, and not close. The worst calendar year on this record averages 1.115 ng/L against a
    12 ng/L trigger — a factor of roughly 11 — and the single highest month ever reported, 1.49
    ng/L, is under half the 3.3 ng/L monthly limit. The fact sheet's 2.2 ng/L (2018-2023) has
    fallen further. No month in the record approaches any mercury limit.
  method_caveat: >-
    [inference] on the averaging only: these are means of the REPORTED MONTHLY AVERAGES, not the
    permit's own annual-average computation, and mercury is sampled in some months and not others
    (4 to 11 months per year). The conclusion is insensitive to the method — the gap to the
    trigger is an order of magnitude — but the figures are not the permit's own arithmetic.
  incidental_corroboration:
    tag: verified
    finding: >-
      The DMR record shows the mercury monthly-average limit changing from 3.9 to 3.3 ng/L at the
      2024-11-30 monitoring period. That is independent corroboration, from the federal effluent
      record, of the *UD renewal's 2024-11-01 effective date — which until now rested only on the
      January 2026 statewide variance list, because the *UD permit as issued is not in the corpus.
  next_check: >-
    Annual. The trigger is an annual average, so the check is once per calendar year against the
    12 ng/L condition; nothing in the current trajectory requires a shorter interval.

# --- WET, for anyone citing the dilution screen -------------------------------------------------

whole_effluent_toxicity:
  finding: >-
    [verified from the renewal fact sheet] The prior 1.0 TUa / 1.0 TUc final limits were removed
    at the 2024 renewal — no toxicity was detected in the reporting period and reasonable
    potential was not demonstrated. Table 14 now lists all four endpoints (acute and chronic
    Ceriodaphnia dubia and Pimephales promelas) as monitoring only, annual chronic testing with
    determination of acute endpoints retained.
  why_it_is_on_the_watch: >-
    The acute dilution ratio at this outfall is 1.0 — at design flow the Blanchard below River
    Mile 56.42 IS the effluent (issue 1458). Toxicity limits were removed on a reach with no
    dilution. That is not an error and not a violation; reasonable potential is the standard the
    rule prescribes. But any prose that cites the 1.0 dilution screen should carry it, because
    the two facts sit oddly together and a reader will ask.
  dmr_record: >-
    The effluent chart carries the four toxicity parameters (61425, 61426, 61427, 61428) and the
    percent-effect parameters (TCM3B, TCP3B, TCN6C) at six to ten rows each across the window,
    with no violation flagged on any row.
