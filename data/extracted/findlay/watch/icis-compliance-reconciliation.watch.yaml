# Findlay WPCF — reconciling ECHO's federal compliance record against the state permit in force
#
# Issue 1461 · sub-issue of 1265 · corpus, NOT a RecordItem (no `action:`/`permit:`/`order:` block).
#
# WHAT THIS ANSWERS. Acceptance criterion 2 of issue 1461: "the ECHO-vs-state schedule-violation
# mismatch reconciled." The issue body carried a single hypothesis for both flagged violations —
# `[inference: federal ICIS not reflecting the state modification]`. That hypothesis is CORRECT
# FOR ONE OF THEM AND WRONG FOR THE OTHER, and the difference matters: one is a stale record, the
# other is a live milestone that the permit in force still requires and that ICIS records as
# neither achieved nor reported.

