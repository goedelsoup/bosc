# Findlay — what the overflow outfalls actually reported, 2023 through June 2026
#
# Issue 1461 · sub-issue of 1265 · corpus, NOT a RecordItem (no `action:`/`permit:` block).
#
# WHY THIS EXISTS. The CSO clock is one of the issue's three watch threads, and until now the
# corpus held only the permit's structure — ten authorized combined sewer overflows, ten sanitary
# sewer overflows, a 1998 LTCP that did not attain its four-overflows-per-typical-year level of
# control, and a compliance milestone moved to 2026-11-01. It held no measurement. This record
# supplies the reported activity from the plant's own DMRs so the 2026-11-01 addendum can be read
# against what the system is doing rather than against a 2018 evaluation.

as_of: '2026-08-02'
site: findlay
issue: 'watermark-directory/the-watermark-directory#1461'
epic: 'watermark-directory/the-watermark-directory#1265'
status: measured
tag: verified

source:
  service: >-
    EPA ECHO effluent-chart service (eff_rest_services.get_effluent_chart) for NPDES OH0025135,
    window 2023-01-01 to 2026-07-31, pulled 2026-08-02 through
    watermark.hydrology.connectors.echo_dmr.fetch_effluent_chart. ICIS-NPDES extract 2026-07-31.
  parameters:
    '74062': Overflows, reported in occurrences per month
    '74063': Overflow volume (SSO volume, CSO volume), reported in million gallons
  outfall_classification: >-
    Combined vs sanitary is taken from the permit's own station inventory (2PD00008*VD page 18,
    committed at data/extracted/oepa/findlay/2PD00008.npdes.yaml), not from the parameter code.
    ICIS parameter 74063 covers BOTH sanitary and combined overflows and does not distinguish
    them — a known trap already recorded for this connector.
  coverage:
    '2023': 12 months
    '2024': 12 months
    '2025': 12 months
    '2026': 6 months — January through June. NOT a comparable annual figure.

# --- a counting trap, recorded because it changes the numbers -----------------------------------

method_trap:
  finding: >-
    Six of the overflow outfalls (002, 003, 011, 012, 015, 016, 018, 024, 025, 026 — every SANITARY
    station) return TWO parameter blocks from the effluent-chart service, carrying overlapping
    monitoring periods with identical values, because the permit term spans two limit sets. Summing
    every returned row double-counts them. The ten CSO stations and station 300 return one block
    each and are unaffected.
  consequence: >-
    A naive sum reports 31 sanitary overflow events in 2024 instead of 17. Every figure below is
    deduplicated to one value per (outfall, monitoring period); no (outfall, period) pair carried
    conflicting values, so the dedup is lossless.

