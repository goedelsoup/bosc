  totals:
    events: {'2023': 4, '2024': 8, '2025': 12, '2026_partial': 11}
    volume_million_gallons: {'2023': 1.27, '2024': 5.87, '2025': 6.46, '2026_partial': 7.50}
  volume_by_outfall_2026_partial:
    '004': 1.87
    '005': 2.11
    '006': 0.77
    '007': 0.81
    '010': 0.65
    '019': 1.30

