# --- what the numbers say, and what they do not -------------------------------------------------

findings:
- tag: verified
  finding: >-
    Combined-sewer overflow activity is rising across the record: 4 events and 1.27 million
    gallons in 2023, 8 events and 5.87 MG in 2024, 12 events and 6.46 MG in 2025. Through the
    first six months of 2026 the system has already reported 11 events and 7.50 million gallons —
    more volume in half a year than in any complete year on the record.
- tag: verified
  finding: >-
    No single combined outfall has reported more than four overflow events in any calendar year
    on this record. Outfall 004 (East of Old WWTP) is at three through June 2026, having reported
    zero in 2023, one in 2024 and two in 2025 — the steepest per-outfall trend in the set.
- tag: verified
  finding: >-
    Sanitary sewer overflows outnumber combined ones in every year of the record: 17 against 8 in
    2024, 15 against 12 in 2025. Two stations — 011 (First and Bank Street) and 018 (East End of
    Tioga Avenue) — account for most of them, and station 300's reported count rose from 3 in 2024
    to 8 in 2025.
- tag: open
  finding: >-
    Whether any of the reported sanitary overflows was treated by Ohio EPA as an unauthorized
    discharge. A combined sewer overflow is an authorized wet-weather discharge under Part II, D;
    a sanitary sewer overflow is not authorized by the permit. The DMR records occurrences, not
    characterizations, and ECHO carries no formal enforcement action against this permit. The 2018
    CSO evaluation's finding that twelve outfalls no longer had combined sewer upstream and were
    in substance sanitary overflows makes the classification itself a live question.

do_not_write:
  four_per_typical_year: >-
    Do NOT compare these counts to the LTCP's four-overflows-per-typical-year level of control and
    conclude anything about attainment. "Typical year" is a defined design-rainfall year in the
    LTCP, not a calendar year, and the determination is Ohio EPA's to make against the plan's own
    methodology. Rainfall in any given calendar year may be well above or below the typical year.
    These are reported occurrences; the control level is a modeled design standard. State the
    counts, state the standard, and do not do the arithmetic between them.
  causation: >-
    Do not attribute the rising trend to any cause. Wet-weather activity tracks rainfall, and the
    corpus holds no precipitation normalization for these years. The permit does require rainfall
    reporting (parameter 46529), which would be the input to such a normalization — that is an
    open analysis, not a finding.

