    '005': {'2023': 1, '2024': 4, '2025': 3, '2026_partial': 2, location: North West and High
            Street, receiving: Blanchard River}
    '006': {'2023': 0, '2024': 1, '2025': 3, '2026_partial': 2, location: North Side of Liberty
            Street Dam, receiving: Blanchard River}
    '007': {'2023': 1, '2024': 1, '2025': 1, '2026_partial': 1, location: Liberty and Washington,
            receiving: Blanchard River}
    '010': {'2023': 0, '2024': 0, '2025': 1, '2026_partial': 1, location: Hancock and Bank Street,
            receiving: Eagle Creek}
    '019': {'2023': 2, '2024': 1, '2025': 2, '2026_partial': 2, location: North Cory at Walnut
            Street Alley, receiving: Blanchard River}
