  what: >-
    The LTCP Addendum and the Municipal CSO Schedule milestone summary report (event 34099) are
    due. The addendum must list projects and an implementation schedule that will meet the LTCP's
    goals. Read it against the 2025 and 2026 overflow record above.
  lead: CSO-LTCP-2026-11-01
- date: quarterly
  what: >-
    Re-pull the effluent chart and extend the overflow series. The 2026 full-year figure will be
    complete after the December 2026 monitoring period is reported, in early 2027.
- date: on-demand
  what: >-
    Pull the 2018 CSO evaluation report itself, which identified twelve outfalls as in substance
    sanitary overflows. It is the document that would say which of the stations above are which,
    and it is not in the corpus.
  lead: CSO-2018-EVALUATION-BYTES
