# Public publish policy for source documents — PUBLISHABLE-BY-DEFAULT WITHIN REVIEWED
# SCOPE, WITHHOLD DECLARATIVELY (epic #274 / #280).
#
# The object store serves the WHOLE corpus in dev/preview, but the PUBLIC site exposes
# only what this file clears. The model is two-sided:
#
#   * CLEARED SCOPE (below) — the fail-safe eligibility gate. A rel is public only if it
#     falls inside a cleared boundary; a file in NO cleared boundary is never public, so an
#     unreviewed file stays private by default. INSIDE a cleared boundary every file
#     publishes — you no longer restate each one. Curated exhibits (exhibits.yaml) are
#     auto-included (they are already published downloads).
#   * WITHHOLD (bottom) — the declarative opt-out. A withhold rule carves a specific rel,
#     subtree, or glob back out of a cleared boundary. Withhold WINS over everything,
#     including the auto-included exhibits.
#
# A boundary is cleared here ONLY after the C2 redaction/PII pre-publication pass (#281);
# a withhold rule then carves individual files back out. See published-documents.README.md.
# Three rule kinds (all optional; combine freely):
collections:      # whole data/documents/<slug> trees, e.g.  - aedg
  # The whole Ohio EPA collection — 40 PDFs (permits, draft permits, fact sheets, public
  # notices) across the Lima top level plus five sites (troy-piqua, sidney, van-wert,
  # wilmington, urbana). These are Ohio EPA public agency records with no private PII — the
  # same basis on which the Bistrozzi PTI (permits/bistrozzi-permits/4132514.pdf) is
  # published. A whole-collection rule is intended: OEPA pulls for future sites are agency
  # records and auto-publish by the same standing basis (#1370).
  # review: { by: goedelsoup, date: 2026-07-10, result: publish, basis: public-epa-agency-records }
  - oepa
  # The whole Findlay collection — 171 files (#1265): the Hancock County Commissioners' and
  # Allen Township trustees' meeting minutes, the township zoning book + map, the WARN
  # notices, the Round 11 brownfield award, the county officials' directory and the official
  # election canvass. All are Ohio public records held by the county, the township, or the
  # State, published here on the same basis as the OEPA collection above.
  #
  # C2 PII sweep run over all 166 readable files before clearing (#281). Findings: ZERO SSNs,
  # dates of birth or account numbers; 6 email addresses, every one an official .gov or a
  # township fiscal officer's posted business address; 205 distinct phone numbers, of which
  # two are the Commissioners' office lines repeated across the minutes and essentially all
  # the rest sit in ONE file (see the withhold below); and no residential addresses at all —
  # the street/road figures are road-resurfacing appropriations (TR 114, CR 140) and county
  # buildings (courthouse, BMV, Agricultural Services). Executive sessions record only the
  # fact and the statutory purpose, never content. The election canvass is precinct-level
  # aggregate with no voter-level data.
  # review: { by: goedelsoup, date: 2026-08-13, result: publish, basis: public-county-township-records }
  - findlay
  # The whole Van Wert collection — 15 files (#1267): the City of Van Wert's council record for
  # the QTS Mega Site (the three May-2026 emergency ordinances as passed plus their posted drafts,
  # the 26-06-034 private-well draft, and six meeting records — 4.27, the 5.4 public hearing, 5.11,
  # 5.27, 6.8 and 7.13), the County Commissioners' published 2026 agenda index, and the captured
  # operator project FAQ. These are the primary instruments the site's assembly and governance
  # record rests on; every one is already published by the City, the County or the operator itself.
  #
  # Pre-publication review (#281) run over all 15 before clearing. The ordinances are clean —
  # unsigned instruments, no personal data at all (all six were posted four days before the vote
  # with an unfilled "Passed this ___ day of ___", which is the #1401 finding). The county agenda
  # index and the operator FAQ are captured public web pages. Any tokens embedded in those captures
  # are evidence, not a leak to redact, per the root CLAUDE.md.
  #
  # ⚠️ WHAT THE REVIEW DID FIND, and the basis for clearing it anyway. The six MEETING RECORDS
  # embed roughly 88 pages of written public comment from private citizens, each letter carrying
  # the writer's name and a REPRODUCED HANDWRITTEN SIGNATURE. (Both the 107-page 5.4 hearing record
  # and 5.11.26.pdf were sampled page-by-page to confirm the shape.) No residential addresses, no
  # phone numbers and no email addresses appear on the sampled letters — the hearing minutes note
  # that speakers stated an address aloud, but that is in the audio/video, which is not in the
  # corpus. This is the same posture as aedg/PRR-01-bundle.ocr.pdf above: cleared whole as
  # DISCLOSED PUBLIC RECORD by operator decision, explicitly NOT as the outcome of a passed PII
  # sweep. Written comment submitted to a legislative body in a zoning hearing is quintessentially
  # public record, the City published these exact PDFs itself, and the evidentiary weight is high —
  # the letter campaign IS a finding (21 of 88 pages repeat an earlier body verbatim; 67 distinct
  # bodies, one submitted five times; and "$200M/20yr", "200-250 jobs" and "$80,000" appear ONLY
  # here and in no instrument). That is the opposite of the Findlay withhold below, which turned on
  # a file that nothing in the record rested on. If a specific letter ever needs carving out, use a
  # withhold rule rather than un-clearing the boundary.
  # review: { by: goedelsoup, date: 2026-08-14, result: publish, basis: disclosed-public-record }
  - van-wert
globs:            # fnmatch globs over the data/documents rel, e.g.  - 'permits/*/*.pdf'
  # Findlay's grid instruments — the AEP large-load request, the Rocky Ford 138 kV station
  # LON + public notice, the Ebersole-Fostoria construction notice, and the AEP Ohio tariff
  # book (#1265/#1464). Utility and PUCO filings, all public. A GLOB rather than the `grid`
  # collection ON PURPOSE: `data/documents/grid/` is shared across eight sites, so clearing
  # the collection would publish seven other sites' grid documents that no review has covered.
  # review: { by: goedelsoup, date: 2026-08-13, result: publish, basis: public-utility-filings }
  - 'grid/findlay/*'
  # Van Wert's grid instrument — AEP Ohio's public notice for the Van Wert–Haviland 138 kV route
  # adjustment (OPSB 26-0729-EL-BLN, the second case on the line first approved as
  # 25-0697-EL-BLN). A utility public notice, public by its own nature. A GLOB rather than the
  # `grid` collection for the same reason as Findlay's above: `data/documents/grid/` is shared
  # across eight sites, so clearing the collection would publish seven other sites' grid documents
  # that no review has covered.
  # review: { by: goedelsoup, date: 2026-08-14, result: publish, basis: public-utility-filings }
  - 'grid/van-wert/*'
documents:        # exact data/documents rels, e.g.  - recorder/bistrozzi-deeds/foo.pdf
  # The AEDG PRR-01 bundle — the full 328-page Port Authority public-records production.
  # Only pp. 317-327 (the six Tetra Tech OPC estimates) are the curated exhibit slice; the
  # rest is PAAC board minutes (pp. 1-90) and recorded real-estate instruments (pp. 91-295:
  # deeds, options, closings, conveyance-fee statements for the Brenneman/Miller/Neff/
  # Neighbors parcels). Published WHOLE, on the basis that it is a public-records production
  # already disclosed by PAAC and the instruments are county-recorder public record. It does
  # carry private parties' recorded signatures/addresses — accepted as disclosed public
  # record per the operator decision on #1301, not the outcome of a passed PII sweep.
  # review: { by: goedelsoup, date: 2026-07-08, result: publish, basis: disclosed-prr-production }
  - aedg/PRR-01-bundle.ocr.pdf
  # Ohio EPA Permit-to-Install P0138965 ("Bistrozzi LLC Data Center") — public agency record,
  # no private PII. Was previously public only via the sliced air-permit exhibit's source
  # auto-include (#1301 closed that path); kept public here as an explicit, reviewed entry.
  # review: { by: goedelsoup, date: 2026-07-08, result: publish, basis: public-epa-permit }
  - permits/bistrozzi-permits/4132514.pdf
  # The AEDG "Data Center Updates" web captures — AEDG's OWN public website pages about the
  # Google / Project BOSC data-center build (the marketing/news set captured through 2026-04-27;
  # provenance in data/documents/limaohio/SOURCES.md). Published on the basis that these are
  # already-public web pages by the Allen Economic Development Group with no private PII — the
  # captured bytes re-expose only what AEDG itself served publicly. Per the root CLAUDE.md,
  # any embedded analytics tokens are evidence, not a leak; the allowlist (not deletion) is the
  # exposure control. Listed per-document (not a whole-aedg-collection rule) so the PRR bundle's
  # recorded-instrument pages keep their own explicit basis and a future AEDG capture is reviewed.
  # review: { by: goedelsoup, date: 2026-07-15, result: publish, basis: aedg-public-web-captures }
  - aedg/data-center-updates/data-center-updates.index.html
  - aedg/data-center-updates/google-data-center-website-now-live-for-allen-county-community.html
  - aedg/data-center-updates/google-to-build-data-center-in-lima-ohio-with-500-million-capital-investment.html
  - aedg/data-center-updates/what-is-a-data-center-and-why-does-it-matter-for-communities-like-ours.html
  # The BOSC PRR productions produced TO the relator (Cory Parent) by Allen County and the Allen
  # Soil & Water Conservation District — the two June-12 batches. Published on the disclosed-PRR-
  # production basis (the same basis as aedg/PRR-01-bundle.ocr.pdf per #1301): these are public
  # agency records already disclosed by their producing agencies in response to an R.C. 149.43
  # request, and each producing agency did its OWN withholding/redaction before producing (the
  # County asserted no §9.66(D) withholding on the 06-12 batch; the SWCD withheld the plan sets
  # under §149.433 + §1333.61 and redacted the trade-secret plan-share links). They carry the
  # relator's own contact info plus third-party business contacts (engineers, contractors, county
  # officials) as disclosed public record — an operator decision to publish whole, NOT the outcome
  # of a passed C2 PII sweep (cf. the #1301 basis). Listed per-document so a future file added to
  # these production dirs is reviewed rather than auto-published; the sibling 06-05 and 07-24
  # batches stay unpublished until separately reviewed.
  # review: { by: goedelsoup, date: 2026-07-28, result: publish, basis: disclosed-prr-production }
  - "legal/prr-mandamus/prr-production-2026-06-12/Parent Records June 12.pdf"
  - "legal/prr-mandamus/prr-production-2026-06-12-aswcd/Mr. Parent Records request.pdf"
  - "legal/prr-mandamus/prr-production-2026-06-12-aswcd/Parent Records Request.pdf"

  # One Energy v. Allen Township, 2026-Ohio-405 — the published appellate decision in the
  # township zoning fight behind Findlay's governance record (#1265/#1463). A court's own
  # published opinion. An EXACT rel, not the `legal` collection: that tree is 2,383 files
  # spanning the select-committee record, the PRR mandamus production and the web-vendor
  # audit, none of which this review covers.
  # review: { by: goedelsoup, date: 2026-08-13, result: publish, basis: published-court-decision }
  - legal/one-energy-v-allen-twp/2026-Ohio-405.pdf

# DECLARATIVE OPT-OUT — carve specific rels back out of the cleared scope above. A withhold
# rule WINS over everything, including the auto-included exhibits, so this is the authoritative
# way to keep a single file (a CBI page, a PII-bearing recorded instrument, a captured page
# that turned out to carry a live secret) off the public surface without un-clearing its whole
# boundary. Same three rule kinds as the cleared scope (mapping form), or a bare list of exact
# rels as shorthand. Record the reason with each entry, as with a clear.
#
# withhold:
#   documents:
#     - aedg/PRR-01-bundle.ocr.pdf   # example only — not withheld; PRR bundle is cleared whole
#   globs: []
#   collections: []
withhold:
  documents:
    # Hancock County's 2026 Directory of Officials. Cleared boundary (the `findlay`
    # collection), carved back out: 17 pages listing every county office and all 18 townships'
    # trustees and fiscal officers with what are plainly PERSONAL mobile numbers — the
    # township's own office line is printed separately on the same entry. That is ~200 named
    # individuals' personal contact details in one file, and the whole file is a finding aid:
    # nothing in the Findlay record rests on it, so publishing it buys no evidentiary value
    # for a real aggregation cost. The county publishes the PDF itself; re-serving it from a
    # searchable public site is a different act, and this is the file the C2 sweep flagged.
    # The corpus keeps it — withhold is exposure control, not removal, so the research agent
    # and the committed record are unaffected.
    # review: { by: goedelsoup, date: 2026-08-13, result: withhold, basis: aggregated-personal-contact-details }
    - "findlay/reference/2026 Directory of Officials_202604131412522342.pdf"
