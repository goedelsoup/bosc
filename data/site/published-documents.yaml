# DECLARATIVE OPT-OUT — carve specific rels back out of the cleared scope above. A withhold
# rule WINS over everything, including the auto-included exhibits, so this is the authoritative
# way to keep a single file (a CBI page, a PII-bearing recorded instrument, a captured page
# that turned out to carry a live secret) off the public surface without un-clearing its whole
# boundary. Same three rule kinds as the cleared scope (mapping form), or a bare list of exact
# rels as shorthand. Record the reason with each entry, as with a clear.
#
# withhold:
#   documents:
#     - aedg/PRR-01-bundle.ocr.pdf   # example only — not withheld; PRR bundle is cleared whole
#   globs: []
#   collections: []
withhold:
  documents:
    # Hancock County's 2026 Directory of Officials. Cleared boundary (the `findlay`
    # collection), carved back out: 17 pages listing every county office and all 18 townships'
    # trustees and fiscal officers with what are plainly PERSONAL mobile numbers — the
    # township's own office line is printed separately on the same entry. That is ~200 named
    # individuals' personal contact details in one file, and the whole file is a finding aid:
