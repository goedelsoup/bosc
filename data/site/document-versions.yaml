  # ── Found by the TIMELINE, not by a document sweep (#2081) ────────────────────────────────────
  # The two clusters above were declared because two extractions of one letter DISAGREED. This one
  # was missed by that pass and surfaced only when `pipeline.timeline` began keying enforcement
  # events on the real-world event (permit + issued date + instrument) rather than on `case_no`:
  # both captures landed on the same key and collapsed, which is what a twin looks like from the
  # chronology's side. Confirmed at the source afterwards, not inferred from the collision —
  # 5 pages each, text-layer similarity 1.000 / 1.000 / 0.999 / 0.997 on pp. 1-4.
  #
  # Why the earlier sweep missed it: the pass that found the others looked for READINGS THAT
  # DISAGREE, and these two agree on everything that matters (agency, respondent, permit, date,
  # instrument, the whole attached progress report). A twin whose two readings agree is invisible
  # to a disagreement sweep and visible only to a duplicate sweep — a gap worth remembering the
  # next time a portal tranche is declared complete.
  - id: oepa:2PE00000-cr6-progress-2022-06-27
    canonical: oepa/lima/edoc-1851184.pdf
    source: >
      both docids serve the City of Lima's 2022-06-27 annual Hexavalent Chromium Control Strategy
      update to Ohio EPA NWDO (NPDES 2PE00000*ND, Part I.C Schedule of Compliance B.3) — cover
      letter over Michael H. Caprella's signature plus the same four-page progress report
    members:
      - rel: oepa/lima/edoc-1851184.pdf
        version: v2
      - rel: oepa/lima/edoc-1879637.pdf
        version: v2
        evidence_note: >
          The same 2022-06-27 letter as the canonical, and the AGENCY'S OWN FILE COPY: page 1
          carries an Ohio EPA NWDO "RECEIVED" stamp the canonical does not, so this capture is the
          only evidence in the corpus of when the submittal reached the district office. Read at
          400 DPI, the stamp is unambiguous — RECEIVED / JUN 2 3 2022 / OHIO EPA / NWDO — and it
          therefore PRE-DATES the letter it stamps by four days. That is not an OCR misread (the
          day digits are struck in the darker wheel font and legible at full resolution) and it is
          not resolved here: a receipt stamped before the document's own date is an agency
          anomaly, most plausibly a date wheel left unadvanced, and it is recorded rather than
          reconciled. The canonical is the copy to cite for the letter's CONTENT — its page 1 is a
          clean read where this capture's is degraded ("l.ima, Oliio", "Ahone:") — but the receipt
          date exists only here.

  # ── Lima WWTP inspection run, 2026-08-22 portal pull (#2077) ──────────────────────────────────
  # The portal serves most of this WWTP's inspections TWICE — once as a PDF with a text layer and
  # once as a scan of the same letter — at two unrelated docids. NONE of these pairs is
  # byte-identical (zero byte-identical groups across the 30 captures), so every one is `v2`: two
  # genuine captures of one filing, both readable evidence. 30 captures -> 18 distinct inspections.
  #
  # WHY THE TEXT-LAYER CAPTURE IS CANONICAL — and what that does NOT mean. It is canonical for
  # FIDELITY: a scan is read by the vision path alone with nothing to check itself against, which is
  # how edoc-463755 invented a case_no from a letterhead (#2076). It is NOT canonical for being
  # fuller. The opposite was true at first: three scans read MORE than their canonical, because a
  # scan is read as all-pages-as-images while the text reads were given only two, so the ATTACHED
  # INSPECTION FORM went unseen. Those three canonicals were re-read at a full image budget
  # (edoc-1851472 6 -> 26 observations, edoc-1851476 2 -> 6) and the cause was the budget, not the
  # capture.
  #
  # A residual difference is GRANULARITY, not fact. The report form carries an "evaluated areas"
  # checklist (NPDES Compliance / Operator Certification / Collection System / … each marked "No
  # corrective action needed" or "Not evaluated"), and some captures enumerate those rows as
  # observations while others summarise the narrative. ComplianceInspection has no field for that
  # checklist, so it surfaces as `finding` rows or not at all. Both readings are correct; the
  # canonical governs, and the genre gap is recorded here rather than papered over.

  - id: oepa:2PE00000-inspection-2016-07-13-reconnaissance-inspection
