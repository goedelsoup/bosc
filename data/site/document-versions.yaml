        version: duplicate
      - rel: commissioners/meetings/M031926-1.pdf
        version: duplicate
        evidence_note: >
          Byte-identical to the canonical (sha256 1df31e1bab81); the county lists the same PDF under a
          second date (2026-03-23-Special) — the connector's `-1` collision-suffixed re-fetch.

  - id: commissioners:M090825-Special-Session
    canonical: commissioners/meetings/M090825-Special-Session.pdf
    source: commissioners meetings download-manifest.yaml — sha256 491886f87475 shared by both listings (2025-09-08 & 2025-09-09)
