- id: PILOT-14-VS-15
  kind: question
  status: review
  tag: open
  title: The PILOT schedule runs 14 years in one instrument and 15 in another — neither was reconciled
  detail: >
    The CRA Agreement's Exhibit E runs FOURTEEN PILOT years (thirteen at $3,333,333 plus a final
    $2,666,671, summing to the $46,000,000 cap set at §7(b)). The distribution schedule attached to
    Resolution 81-25 lays the same $46,000,000 across FIFTEEN, and its own workspace cells read
    "Total $50,000,000 / Per Year $3,333,333.33". `[verified]` both ways. The binding cap is the CRA
    Agreement's; which instrument governs the final year is unresolved on this record. Practical
    guard for any prose: do not quote a term of years for the PILOT without naming the instrument
    it comes from, and do not restate the press figure of "$50 million over 15 years" — the
    $50,000,000 is the $46,000,000 PILOT cap plus a separate one-time $4,000,000 Initial Payment
    under §8, which is a different thing.
