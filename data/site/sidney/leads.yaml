- id: RES-69-25
  kind: question
  status: review
  tag: open
  title: Resolution 69-25 — pulled, and it is not what the recitals said it was
  detail: >
    ANSWERED 2026-08-13. This lead asked for the CRA legislation the corpus knew only through two
    instruments' recitals. It is now committed and read, and so is the resolution it amends —
    and the reading corrected the register twice over. Res. 69-25 does NOT designate the CRA. Its
    own second recital names the designating act: Resolution 84-22, adopted 2022-10-10, which
    "created and established the Sidney City-Wide Community Reinvestment Area" under ODOD
    designation # 149-72424-06. 69-25 EXPANDS that area to be coterminous with the City and
    amends its §4 — and what it adds to §4 is the whole point. Res. 84-22 as adopted capped
    commercial and industrial exemptions at FIFTEEN years. 69-25 restated §4 and added clause (e)
    "Up to thirty (30) years, and up to one hundred percent (100%)" for a megaproject under R.C.
    122.17(A)(12). Seven weeks later Res. 80-25 authorized a CRA Agreement carrying a 30-year
    100% exemption. The SEQUENCE is `[verified]` from both instruments and the minutes of both
    meetings; the motive is not — 69-25 names no project, no company and no parcel, and its stated
    reason is the recent annexations. WHAT STAYS OPEN is the designation itself. The 2025-10-27
    minutes say the project "meets the requirements to be designated a megaproject by the Director
    of the Department of Development" — eligibility asserted by staff, present tense, not a
    designation stated as made. No ODOD certification is in the corpus. That is the next pull.
    Guard, unchanged: this register once named "Resolution 18-25, October 2025" as the CRA
    instrument. No such legislation exists. Do not reintroduce that number.
  source: data/extracted/sidney/council/2025-09-08-res-69-25-cra-expansion-and-megaproject-tier.resolution.yaml · data/extracted/sidney/council/2022-10-10-res-84-22-citywide-cra-established.resolution.yaml
