# Water — what was reserved, what was given up, and what is still only bracketed ---------------
- id: COOLING-MODEL
  kind: question
  status: review
  tag: inference
  title: Cycles of concentration back-solve to ≈4.0 — that brackets the cooling model, it does not close it
  detail: >
    The only description of this campus's cooling design anywhere on the public record is one
    sentence in the City's 2026-04-27 staff presentation: "All wastewater, including cooling tower
    discharges, are required to be discharged to the sanitary sewer." `[verified]`. Back-solving the
    service agreement's own projections — makeup 4,600,000 gal/yr divided by blowdown 1,160,000
    gal/yr = 3.97 — gives cycles of concentration of about 4.0, the signature of a closed-loop
    evaporative tower. `[inference]`. This is the first documentary handle on a cooling model that
    `_SIDNEY.facility` still correctly carries as UNKNOWN, and it must stay UNKNOWN: a projection
    inside a service agreement is not a design disclosure, and a reservation is a ceiling rather
    than a metered use. What would actually close it is the air PTI, the SIU permit, or a mechanical
    permit or equipment schedule naming the towers.
  source: data/extracted/sidney/incentive-instruments.yaml (derived, cycles of concentration) · data/extracted/sidney/data-centers.md "The cooling mechanism finally appears in a record"
  issue: 1380
- id: RATE-CLASS-BAR
  kind: signal
  status: unanswered
  tag: open
  title: The City contracted away its power to create a data-center water rate class for ten years
  detail: >
    Water and Wastewater Service Agreement §2.1: "During the Term of this Agreement, Provider shall
    not take steps to create a separate class of water or sewer rates for data centers or similar
    high level, but highly variable, users." `[verified]`. The term is ten years, auto-renewing
    annually, and AWS may terminate at any time on 90 days' notice while the City may terminate
    only after three years AND twelve consecutive months of ceased operations (§3). What the City
    did reserve instead is a fee on the UNUSED portion of the reservation — water at 14.3% of the
    $7.23/ccf standard rate, sewer at 5.60% of the $4.11/ccf rate, reopened every three years from
    the third anniversary of build-out (§2.2 and Schedule 1). The standing question this raises is
    not answered by any instrument in the corpus: what the reservation costs other ratepayers over
    a decade in which the City cannot price this class of user separately.
  source: data/extracted/sidney/incentive-instruments.yaml (rate_class_covenant, impact_fees) · data/extracted/sidney/data-centers.md "The City contracted away its data-center rate class"
  issue: 1380
- id: AQUIFER-SCOPE
  kind: question
  status: review
  tag: open
  title: Is the Sidney well field inside a designated sole-source aquifer, and is the campus upgradient?
  detail: >
    This lead exists to keep a refuted premise from returning. The 2026-06-22 onboarding
    scaffolding framed Sidney as a buried-valley sole-source-aquifer campus and set
    dominant_hsg="B" from that premise. #1379's SSURGO read inverted it: the campus is HSG D —
    Blount and Glynwood silt loams on the Wisconsinan end moraine, 62 of 64 grid points — sitting
    roughly two miles WEST of the Great Miami buried valley. `[verified]`. The sole-source framing
    was never true of this footprint, and post-development runoff screens materially higher than a
    buried-valley outwash assumption would have given. What is NOT established either way is the
    designation itself: no EPA sole-source-aquifer boundary has been pulled into this corpus, so
    whether the Sidney well fields sit inside a designated area, and what a campus upgradient of
    them on the moraine would mean for one, were both `[open]` when this lead was written.
    ANSWERED 2026-08-11 by #1997, and this text is left standing because the refuted premise is
    what the lead exists to keep out. The EPA designation WAS pulled: the campus sits 2,702 m
    (1.68 mi) OUTSIDE the designated Buried Valley Aquifer System, in no part of it, while the
    City's Washington Township well field is 97.17% inside and its Great Miami bedrock field is
    0% inside. So the answer splits — the well field's sole-source framing is real, the campus's
    never was, and the two must not be merged. Guard, unchanged and now doubly grounded: never
    restore the buried-valley framing for the campus footprint on the strength of the well
    field's.
  source: data/extracted/sidney/groundwater.md (#1997) · data/extracted/sidney/data-centers.md "Dominant hydrologic soil group" · data/concepts/ssa.md
  issue: 1997
# The public side of the record — the minutes are in since #1998; the audio and the speakers are not
- id: COUNCIL-MINUTES
  kind: question
  status: review
  tag: open
  title: The three vote meetings are on the record — and one of the six votes was not unanimous
  detail: >
    ANSWERED IN PART 2026-08-13. The minutes of all three meetings that passed this campus's
    legislation are committed and read — 2025-09-08, 2025-10-27 (image-only, OCR'd at 300 DPI)
    and 2026-04-27 — and every one of the six votes now has its mover, its second and its result
    on the record where the resolution pages journal none of them. FIVE PASSED UNANIMOUSLY. THE
    SIXTH DID NOT. Res. 82-25, the income-tax-sharing agreement with Sidney City Schools and
    Upper Valley Career Center, drew a recorded roll call — "Barhorst yes; Huelskamp yes;
    Milligan yes; Roddy yes; Thurber no; VanMatre yes; Wagner no" — and passed 5-2. It is the only
    item on any of the three nights the clerk journalled by name, which is why the division is
    legible at all. The minutes record no stated reason for either NO vote. Public opposition is
    now `[verified]` and on the City's own record for the first time, on 2026-04-27, on
    pretreatment standards, monitoring, tap-in costs, billing against the capacity reserve, fines,
    noise, vibration, power supply, environmental and health impacts and the city's finances.
    WHAT STAYS OPEN, and why this lead is not closed. The minutes NAME NO MEMBER OF THE PUBLIC
    and give no count — "a number of people present", "those from the public speaking". So the
    original constraint holds unchanged: organized local opposition is reported in secondary and
    advocacy sources, but no named group and no named individual outside City government is
    captured anywhere in this corpus, and nothing on this site may be attributed to a person. The
    MEETING AUDIO is the route that would change that, and it is not on the portal — it remains an
    R.C. 149.43 ask to the Sidney City Clerk. Also unpulled: the minutes of 2022-10-10 (Res.
    84-22) and 2026-02-23 (Res. 14-26, the consolidation plat), both retrievable on the same
    portal. Its coverage is `[verified]` by enumeration, not by the portal's own claim about
    itself - one GET of /meta/docfolder?containerId= on each container returns the full year-folder
    list, and on 2026-08-13 the Minutes container returned 170 folders ending 1859, 1858, 1857 and
    the Resolutions container 51 ending 1978, 1977, 1976.
