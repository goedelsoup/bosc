- id: COMPANY-NOTICE
  kind: signal
  status: unanswered
  tag: open
  title: Both major agreements give the company five business days to try to stop a records release
  detail: >
    CRA Agreement §32 and Development Agreement §8.17 require the City, on receiving a public-records
    request touching the company's "Confidential Information", to notify the company, give it a copy
    of the request, and allow it at least five business days to negotiate a response or to "pursue,
    at its sole cost and expense, legal remedies to stop the City's release". `[verified]`. Neither
    clause enlarges any R.C. 149.43 exemption — they are contractual delay layered on top of the
    statute, not new grounds for withholding — but every municipal request on this board should be
    filed expecting it, and a slow response should not be read as a denial. The 2023-12-19
    Nondisclosure Agreement remains operative and the City is contractually bound to continuing
    compliance with it under the same §8.17.
  source: data/extracted/sidney/incentive-instruments.yaml (public_records_clause, §32) · data/extracted/sidney/data-centers.md "Records posture"
  issue: 1380
