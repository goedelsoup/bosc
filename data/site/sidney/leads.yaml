- id: SIU-PERMIT
  kind: question
  status: unanswered
  tag: open
  title: The City's significant-industrial-user permit — the only instrument that meters this campus
  detail: >
    The campus's actual wastewater will never appear separately in the WWTP's DMRs, because a DMR
    reports outfall 001 and not an individual user. `[verified]`. The instrument that would
    separate it is the City of Sidney's own industrial-pretreatment / significant-industrial-user
    permit (the City reports 16 SIUs today), a municipal record under R.C. 149.43 that is not on
    Ohio EPA's portal. The 2026-08-01 ingest sharpened this rather than closing it: the Water and
    Wastewater Service Agreement fixes the RESERVED sewer ceiling at 390,493 gpd (716 gpm gravity,
    1,160,000 gal/yr projected, 5.60% of the 7 MGD plant), so what the SIU permit would add is
    actual metered load against that ceiling. A reservation is a ceiling and a billing basis; it is
    not a measurement, and the two must not be quoted interchangeably.
