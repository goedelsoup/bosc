    note: >-
      The capture reading, and its limit (ME-D, issue 1663). BLS QCEW 2024 annual averages for
      Allen County (area 39003) put federal-government employment at 321 jobs across 15
      establishments, averaging $83,773 a year against the county-wide $58,790 — a real wage
      premium on a small base. The location quotient is 0.33: the county's federal-employment
      share is a third of the national one. So the enclave does NOT read as a procurement economy
      on the payroll record, and the arsenal's own workforce is not what these numbers count —
      the JSMC is government-owned and contractor-operated, so its General Dynamics staff fall
      under private manufacturing, not the federal ownership row. QCEW also excludes uniformed
      active-duty entirely (the model's standing coverage caveat). What remains open is the
      instrument side: no abatement, PILOT, or public-benefit agreement tied to the JSMC footprint
