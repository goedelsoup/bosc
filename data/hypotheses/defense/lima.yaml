    note: >-
      #1480 documented negative search for a facility-naming federal-authorization instrument:
      USASpending/SAM.gov show no award or recipient for the Bistrozzi owner-of-record shell;
      the FedRAMP Marketplace lists Google Cloud service-wide, naming no Lima facility; and the
