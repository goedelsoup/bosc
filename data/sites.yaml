# Canonical identity registry for all Watermark network sites (tracking → live).
# This file is the single source of truth for site identity — the authoritative record for
# slug, place, basin display label, major basin, receiving water, state, status, map defaults,
# and the frontend badge (codename / mono). See docs/onboarding.md for the field guide.
#
# Usage:
#   - Python: watermark.sites loads this at import time; SiteProfile back-fills identity fields.
#   - TypeScript: `bosc sites sync` writes web/src/lib/sites-registry.json from this file.
#   - CI gate: `bosc sites check` validates both registries stay in sync with this file.
#
# Shared identity fields (authoritative here):
#   slug         kebab-case registry key
#   place        display name for the city / area
#   basin_label  receiving-water / sub-basin display string (TypeScript `basin` field)
#   basin_major  the MAJOR river basin this site groups under (kebab slug: maumee, great-miami,
#                scioto, …) — a different granularity from `basin_label`, and the grouping axis
#                for the basin lens / the water-lens scorecard / the two continental divides.
#                Authoritative here (#1863): it back-stops the Python `SiteProfile.basin` literal
#                (`watermark sites check` fails on disagreement) and reaches the frontend registry
#                so `groupSites("basin")` derives its placement instead of keeping a parallel copy.
#                Its display label / abbr / region / divide live in web/packages/core/src/placement.ts.
#   receiving_water  Python receiving_water_name on the active NPDES (null for tracking-only)
#   state        two-letter abbreviation (OH, IN) — the grouping axis for the state lens, and the
#                source of the per-site dateline ("Lima, Ohio") via `siteState` (#1863)
#   county       economic/administrative county as it reads in a citation ("Allen County, OH");
#                back-fills Python county_name, and reaches the frontend registry so the
#                ask-index can stamp it as a retrieval facet (#1691). null = no profile yet.
#   codename     switcher badge codename (null = use mono)
#   mono         three-letter fallback badge
#   status       live | building | queued | tracking
#   selectable   true only for a site whose full build is deployed
#   issue        GitHub issue number (string, no #; null for lima)
#   map_lat/lon/zoom  default DeckGL viewport (null for tracking-only sites with no profile yet)

