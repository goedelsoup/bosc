serving_utility:
  utility:
    value: City of Bowling Green - (OH)
    source: reference
    citation: 'BOWLING GREEN IS A TWO-GRID SITE AND THIS KNOB CARRIES ONLY ONE OF
      THEM — the SITE''s utility, which is the City of Bowling Green''s municipal
      electric system (EIA-861 2024 Service_Territory, utility #2054, Municipal, BA=PJM,
      an American Municipal Power member; resolved #1434). It is deliberately NOT
      re-pointed at the campus''s utility: the load shares, energy-burden and consumer-energy
      feeds all key on this number for the city''s own 14,850 retail customers, and
      moving it to flatter one facility''s denominator would falsify the backdrop
      for all of them (#1440). THE META CAMPUS IS ON A DIFFERENT GRID. Middleton Twp
      sits in The Toledo Edison Company''s territory (FirstEnergy / PJM ATSI) — and
      that is now tariff-grounded rather than press-sourced: Toledo Edison''s own
      filed P.U.C.O. No. 8, Original Sheet 3, DEFINITION OF TERRITORY, effective 2026-03-01,
      names Wood County among the ten counties of ''Company''s Territory'' (data/documents/grid/bowling-green/TE-2026-Electric-Service.pdf).
      A county is not a parcel, so the parcel-level certified-territory read stays
      [open]. The campus is designed self-powered BEHIND THE METER by the Apollo plant
      (OPSB 25-0973-EL-BLN), whose Condition 15 BARS any interconnection with the
      PJM Transmission System — so its modelled grid draw is ~0 and what Toledo Edison
      actually sells it is [open]. READ THE PER-UTILITY LOAD SHARE BELOW AS A MAGNITUDE
      COMPARISON ONLY (the campus dwarfs the muni''s retail at ~3.6x on energy — the
      point being that the muni could never serve it), NOT as the campus''s serving-utility
      ratio; a per-facility serving-utility denominator is a grid-model follow-up.
      The city''s OTHER data centre — the Oppidan colocation building in the Woodbridge
      Business Park, ~6 MW average / ~8 MW peak — IS on the muni ([inference], high
      confidence: five city-owned overhead electric features cross the parcel in the
      City''s own GIS, the parcel is city-zoned IE under annexation ordinances 8597/8824,
      and the BG utilities director called it ''a steady electric customer for the
      city''; the BPU minutes remain the instrument). Full per-load determination,
      the in-force Toledo Edison sheets (Rate GT, ESR §II.G) and the pending FirstEnergy
      Schedule DCT (PUCO 26-0697-EL-ATA) are at data/extracted/grid/bowling-green/
      (#1440).'
    confidence: high
