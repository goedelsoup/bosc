note: 'Grid foundation layer (#94). The state, City of Bowling Green - (OH), and PJM
  denominators are now all connector-sourced — Ohio retail from EIA (shared with #91),
  per-utility retail from the EIA-861 file, and PJM annual demand from EIA-930. The
  campus is a single load equal to a material fraction of its serving utility''s entire
  retail sales. Denominator vintages differ (utility EIA-861 2024 / BA EIA-930 2024
  / state EIA 2025 (1-year spread)): the EIA state seriesid route publishes ahead
  of the EIA-861 bulk file and the EIA-930 annual sum, so the three shares are not
  struck against one common year.'
