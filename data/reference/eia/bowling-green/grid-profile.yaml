    source: reference
    citation: The City of Bowling Green operates a municipal electric utility (an
      American Municipal Power member) serving the city proper; the Meta campus in
      Middleton Twp interconnects to Toledo Edison (FirstEnergy / PJM ATSI) but is
      designed self-powered BEHIND THE METER by the Apollo plant (OPSB 25-0973-EL-BGN)
