serving_utility:
  utility:
    value: AEP Ohio (Ohio Power Company)
    source: reference
    citation: 'Adams County, OH is predominantly served by Adams Rural Electric Cooperative,
      Inc. — EIA-861 #118 [verified] against the primary EIA-861 2024 Service_Territory
      file (utility ''Adams Rural Electric Coop, Inc'', OH; counties Adams/Brown/Highland/Pike/Scioto;
      ~9,274 meters secondary; HQ West Union; a Buckeye Power / Ohio''s Electric Cooperatives
      member). #118 is a short-form EIA-861 filer, so it reports no Sales_Ult_Cust
      retail line — the co-op cannot back a connector-sourced retail denominator.
      Ohio Power Co (AEP Ohio, EIA-861 #14006, full-filing) serves the Village of
      West Union edge and provides the AEP transmission + PJM-settlement footprint
      (AEP ''West Union Loop'' projects); the profile therefore keeps AEP Ohio / the
      PJM AEP zone as the resolvable grid backdrop rather than the co-op''s (unavailable)
      retail line.'
