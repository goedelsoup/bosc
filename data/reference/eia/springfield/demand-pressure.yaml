method: 'facility draw (PUE-adjusted, #87) -> annual GWh -> share of EIA state retail
  sales + households-equivalent; price pressure = demand share x transmission coefficient
  (STYLIZED screening sensitivity, not a forecast)'
caveats:
- The demand share and households-equivalent are the robust, EIA-cited headline; the
  price-pressure band is a STYLIZED screening sensitivity, not a forecast of retail
  bills.
- The campus buys at wholesale/industrial rates, not the residential price shown —
  residential price is the consumer-impact reference, not the campus bill.
- 'Facility draw is itself an assumption-laden estimate (air-permit IT load x PUE
  band, #87); the load factor and transmission coefficient are assumptions.'
