note: AWS Sustainability GetEstimatedCarbonEmissions (the Customer Carbon Footprint
  Tool's successor; CCFT retired 2026-06-30) over the window, monthly granularity,
  market- + location-based methods. Figures are `reference` (AWS's own estimate),
  not metered. AWS publishes no electricity/kWh figure — the derived electricity number
  is calibrated against lbm_total via grid intensity in footprint.py (#1082/#1083).
  Emissions data lags ~3 months; the monthly series ends at AWS's latest published
  month.
