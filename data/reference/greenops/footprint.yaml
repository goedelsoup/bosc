methodology:
- title: Compute
  body: 'AWS Cost Explorer instance-hours (by service, folded into platform functions)
    converted to vCPU-hours by instance size, plus GitHub Actions minutes converted
    by runner core count. We run no GPU instances: model inference happens on the
    provider''s accelerators and appears on no bill of ours as energy, only as tokens
    — so it is priced separately below rather than counted here.'
- title: Electricity & carbon
  body: 'Infrastructure: vCPU-hours x 7 W per allocated vCPU (range 2.1-12, an average-operational
    assumption folding utilization) x PUE 1.2 (range 1.14-1.56). Inference: output
    tokens x a published per-model-class Wh/1k-output-token coefficient x PUE. Each
    fleet''s electricity is priced at its own eGRID subregion''s CO2e output rate
    — SRVC (6,366 vCPU-hrs); the model provider does not disclose a serving region,
    so inference energy is attributed to the primary subregion. Every headline figure
    carries the band its coefficients imply. Derived ~0.0149 MTCO2e (electricity x
    596.326 lb/MWh, SRVC) vs AWS''s own estimate — 0.045 MTCO2e location-based, 0.018
    MTCO2e market-based. Ours is ~33% of the location-based figure. They differ by
    scope: our model covers billed instance compute plus model inference, whereas
    AWS''s estimate spans every service it bills (storage, transfer, managed-service
    and idle-capacity overhead) and none of our inference. The market-based figure
    is lower because it prices AWS''s contracted renewable procurement, not the physical
    grid — it is reported alongside the location-based one, never instead of it.'
- title: Water
  body: 'We operate no data center. The cooling water below is our cloud provider''s,
    attributed to us by billed IT load using its own published site WUE (liters per
    kWh of IT load — so the figure divides PUE back out rather than applying an IT-load
    benchmark to a facility-load number). Added to it is the upstream increment: the
    water consumed generating each kWh actually delivered to the facility. Site plus
    upstream is the source-basis total by definition; a site-basis and an already-source-basis
    benchmark are never summed, and the derivation refuses a benchmark row whose basis
    would make that happen.'
- title: AI inferences
  body: 'The Anthropic Admin API exposes token aggregates only, so the call count
    is total tokens / 4000 avg tokens/call (a stated assumption), and the by-task
    split is modeled until the per-task workspace keys (#1080) are named so the by-workspace
    usage can be labeled and metered by task. The energy those calls drew is priced
    against OUTPUT tokens, not this count and not the input+output total: decode dominates
    inference energy, prefill is far cheaper per token, and no provider publishes
    a per-token figure — so the coefficients are third-party published estimates,
    banded across roughly an order of magnitude because that is the spread of what
    has been measured.'
sources:
- AWS Cost Explorer + Sustainability (Jul 2025-Jun 2026)
- GitHub Actions/storage billing (Jul 2025-Jun 2026)
- Anthropic Admin usage + cost (Jul 2025-Jun 2026)
- EPA eGRID2023 subregion SRVC factors
- WUE benchmarks (AWS 2025 / EPRI 2024 / Uptime Institute 2023 / Macknick et al. 2012)
- inference-energy coefficients (Epoch AI 2025-02 / Jegham et al. 2025-05 / Google
  2025-08)
basis: illustrative
note: 'Derived footprint (#1083): usage → electricity → CO2e → water from the committed
  connector exports and reference factor tables. Every conversion is `derived`; the
  modeling levers (≈7 W/vCPU, PUE 1.2, eGRID subregions SRVC (cloud) / SRVC (CI),
  4000 tokens/call, the per-token inference coefficients, the water budget) are stated
  `assumption`s. Nothing here is metered. ILLUSTRATIVE: the usage exports behind these
  figures are committed samples, not a live provider pull, so the magnitudes are shaped
  like a real footprint but are not one. Wire the `watermark greenops <source> --write`
  pulls to flip this (#1643/F3).'
