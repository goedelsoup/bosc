methodology:
- title: Compute
  body: AWS Cost Explorer instance-hours (by service, folded into platform functions)
    converted to vCPU-hours by instance size, plus GitHub Actions minutes converted
    by runner core count. Model inference runs on third-party/serverless infra (Anthropic,
    Bedrock) and is reported as AI volume, not our vCPU-hours; we run no GPU instances.
- title: Electricity & carbon
  body: vCPU-hours x 7 W per allocated vCPU (an average-operational assumption folding
    utilization) x PUE 1.2. Derived ~0.0145 MTCO2e (electricity x 596.326 lb/MWh,
    SRVC) vs AWS's location-based estimate 0.045 MTCO2e — ~32% of it. The two agree
    in order of magnitude; they differ because the vCPU model captures only active
    instance compute, whereas AWS's estimate spans every service (storage, transfer,
    managed-service and idle-capacity overhead).
- title: Water
  body: Modeled from electricity using published Water Usage Effectiveness (WUE) benchmarks
    — a site WUE for direct on-site cooling and a source WUE for the water withdrawn
    upstream to generate the power drawn. The two bases are reported separately, never
    summed across bases.
- title: AI inferences
  body: The Anthropic Admin API exposes token aggregates only, so the call count is
    total tokens ÷ 4000 avg tokens/call (a stated assumption), and the by-task split
    is modeled until the per-task workspace keys (#1080) are named so the by-workspace
    usage can be labeled and metered by task.
sources:
- AWS Cost Explorer + Sustainability/CCFT (Jul 2025-Jun 2026)
- GitHub Actions/storage billing (Jul 2025-Jun 2026)
- Anthropic Admin usage + cost (Jul 2025-Jun 2026)
- EPA eGRID2023 subregion SRVC factors
- WUE benchmarks (EPRI 2024 / Uptime Institute 2023 / NREL 2012)
note: 'Derived footprint (#1083): usage → electricity → water from the committed connector
  exports and reference factor tables. Every conversion is `derived`; the modeling
  levers (≈7 W/vCPU, PUE 1.2, eGRID subregion SRVC, 4000 tokens/call, the water budget)
  are stated `assumption`s. Nothing here is metered.'
