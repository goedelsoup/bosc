  - scientific_name: "Esox lucius"
    common_name: "Northern Pike"
    category: fish
    trophic: "T-3 piscivore"
    ris_status: "Commercial and recreational value; important food web link"
    tolerances:
      - {life_stage: Eggs,     chronic: {upper_c: "24.2", refs: [13]}}
      - {life_stage: Larvae,   chronic: {upper_c: "20.6-28.5", refs: [13]}}
      - {life_stage: Juvenile, chronic: {upper_c: "29-33", refs: [13]}}
      - {life_stage: Adult,    chronic: {upper_c: "32-35.6", lower_c: "3-4.9", refs: [13]}, optimal: {upper_c: "20", lower_c: "18.9", refs: [13]}}

