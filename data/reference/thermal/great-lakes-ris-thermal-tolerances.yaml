# Great Lakes Representative Important Species (RIS) thermal tolerances — the BIOLOGICAL limits
# for a CWA Section 316(a)-style read of a thermal discharge into a Lima -> Maumee -> Lake Erie
# (Great Lakes region) receiving water. Transcribed verbatim from EPA-833-F-23-007, "Thermal
# Discharges in NPDES Permits: Overview of Resources and Tools" (June 2023), Tables 3-4, 3-5, 3-6
# (the ingested guidance PDF in this directory, PR #1714). Phase 1 of epic #1715.
#
# These are PUBLISHED FEDERAL GUIDANCE values ("does not have the force and effect of law"),
# tagged `reference` when surfaced, never `verified`. They complement the Ohio numeric temperature
# CRITERIA (data/reference/wqs/ohio-temperature-criteria.yaml): the Ohio tables supply the
# regulatory thresholds; these RIS tolerances supply the species/life-stage biological limits a
# Section 316(a) "balanced indigenous community" (BIC) argument turns on. Screening context, not a
# permit determination or a plume model.
#
# TRANSCRIPTION FIDELITY. Temperature values are kept as the VERBATIM strings the table prints,
# including ranges ("32-35.6", "3-4.9", "22.5-23.5") — the loader parses a (low, high) span from
# each. A blank cell in the table is OMITTED (no key), never guessed. Reference numbers cite
# `references` below (Table 3-6). Metrics: `acute` and `chronic` are the upper/lower thermal limits;
# `optimal` is the optimal thermal range. `upper_c` / `lower_c` are degrees Celsius.

source:
  document: "EPA-833-F-23-007, Thermal Discharges in NPDES Permits: Overview of Resources and Tools"
  publisher: "U.S. EPA, Office of Water, Water Permits Division, Office of Wastewater Management"
  date: "June 2023"
  region: "Great Lakes"
  tables: "Table 3-4 (RIS list), Table 3-5 (thermal tolerances), Table 3-6 (references)"
  relpath: "reference/thermal/epa-833-f-23-007-thermal-discharges-npdes-2023.pdf"
  pdf_pages: "34-44 (printed section 3.3)"
  retrieved: "2026-07-22"
  note: >-
    The Great Lakes region here is the region for Lima -> Maumee -> Lake Erie. Guidance, not law:
    cite as method/biological context, not as a binding numeric standard.

region: great_lakes

# Species from Table 3-4/3-5. `trophic` and `ris_status` are the Table 3-4 context; `tolerances`
# are the Table 3-5 numbers. Life stages: Eggs, Larvae, Juvenile, Adult (fish/invertebrates) or NA
# (single-stage plant/plankton). Only life stages / metrics with a printed value are listed.
species:
