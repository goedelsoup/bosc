meta:
  subject: Ohio DNR Water Withdrawal Facilities Registration Program — Allen County,
    OH
  source: Ohio DNR, Division of Water Resources — Water Withdrawal Facilities Registration
    Program (WWFRP), R.C. 1521.16 (>100,000 gpd registration + annual water-use reports)
  source_url: https://services5.arcgis.com/ajRlmtxbNBjZggOT/arcgis/rest/services/Water_Withdrawal_Facility/FeatureServer/0
  county: Allen
  state: OH
  since_year: 2015
  facility_count: 33
  active_count: 21
  reporting_count: 25
  use_type_counts:
    Agriculture: 4
    Golf Course: 7
    Industry: 6
    Mineral Extraction: 5
    Misc: 4
    Public: 7
  units: annual/monthly withdrawal + return values are million gallons (MG)
  caveats:
  - Withdrawal/return amounts are verbatim from the WWFRP annual-total tables; nothing
    is inferred, normalized, or backfilled — a blank month is null.
  - Capacities (total_capacity_mgd, *_capacity_mgd) are the REGISTERED capacity, not
    the reported withdrawal (which lives on the annual series).
  - Annual series are floored at 2015; the facility registry is kept in full. Older
    years remain live at the source.
  - Registration is self-reported; a use type is the registrant's declared primary
    use. Any IT-load inversion from a withdrawal is [inference], never [verified].
