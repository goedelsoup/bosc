meta:
  subject: Portage-basin NPDES wastewater dischargers
  scope: all active CWA-permitted dischargers
  source: EPA ECHO — cwa_rest_services (CWA v2017-10-13)
  watershed: Portage River — 1 HUC-8 subbasin (04100010 Cedar-Portage), subregion
    0410 (Western Lake Erie, direct to the lake rather than through the Maumee)
  huc8s:
    '04100010': Cedar-Portage
  dedup_key: FRS RegistryID
  count: 296
  caveats:
  - ECHO's CWA facility service has no CWNS column; the POTW flag rests on CWPFacilityTypeIndicator.
  - Facilities link to HUCs via WATERS (FacDerivedHuc); a permit that didn't geocode
    can be missed.
  - design_flow_mgd is null where ECHO returned no value; it is never estimated.
  - 'SCOPE IS WIDER THAN THE NAME. HUC-8 04100010 ''Cedar-Portage'' is a WBD cataloging
    unit covering the Portage River AND the frontal Lake Erie drainage beside it (Cedar
    Creek and the other direct-to-lake tributaries), not one watershed. A discharger
    on frontal drainage is a SIBLING of the Portage rather than a headwater of it:
    it is neither upstream nor downstream of a Portage discharger and must never borrow
    the Portage''s 7Q10. The split is live at the network''s own watershed point —
    Bowling Green''s campus sits in HUC-12 041000100703 (Cedar Creek-Frontal Lake
    Erie) while the city''s Water Pollution Control plant discharges in 041000100301
    (N Br Portage/Poe Ditch), so campus runoff does not reach the plant''s receiving
    water at all.'
  - THE NORTH BRANCH AND THE MAINSTEM ARE DIFFERENT DENOMINATORS. A gage on the Portage
    mainstem integrates a drainage area far larger than the North Branch or Poe Ditch
    above it, so serving a mainstem 7Q10 to a North Branch outfall overstates dilution
    by orders of magnitude. Registered aliases are therefore mainstem surface forms
    only; a North Branch or Poe Ditch receiving water reports no_7q10 — unscreenable,
    never unaffected — and is settled instead by the permit's own drainage-area-adjusted
    low flow where the fact sheet publishes one.
  - Ohio EPA assigns Poe Ditch a Limited Resource Water use designation but applies
    the NORTH BRANCH PORTAGE's criteria to discharges reaching it, 'to be protective
    of this higher quality stream'. A screen keyed on the immediate receptor's own
    designation will therefore read the wrong criteria for this basin; read the permit,
    not the ditch.
  - The basin drains north to Lake Erie through a heavily tile-drained lakebed plain
    (the Great Black Swamp), so summer low flows are small and a large share of the
    receiving water below a POTW outfall is that POTW's own effluent. Treat an assimilative
    ratio here as a statement about an effluent-dominated stream, not a diluted one.
