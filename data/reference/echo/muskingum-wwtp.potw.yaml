meta:
  subject: Muskingum-basin NPDES wastewater dischargers
  scope: POTWs only (CWPFacilityTypeIndicator == POTW)
  source: EPA ECHO — cwa_rest_services (CWA v2017-10-13)
  watershed: Muskingum River — 6 HUC-8 subbasins, subregion 0504 (Ohio River tributary;
    the largest river basin lying wholly within Ohio)
  huc8s:
    '05040001': Tuscarawas
    '05040002': Mohican
    '05040003': Walhonding
    '05040004': Muskingum
    '05040005': Wills
    '05040006': Licking
  dedup_key: FRS RegistryID
  count: 149
  caveats:
  - ECHO's CWA facility service has no CWNS column; the POTW flag rests on CWPFacilityTypeIndicator.
  - Facilities link to HUCs via WATERS (FacDerivedHuc); a permit that didn't geocode
    can be missed.
  - design_flow_mgd is null where ECHO returned no value; it is never estimated.
  - 'THE INVENTORY IS PULLED; THE DENOMINATORS ARE NOT REGISTERED. No Muskingum-basin
    mainstem gage exists in mainstem-gages.yaml, so a discharger here whose receiving
    water this table cannot name reports no_7q10 — UNSCREENABLE, NEVER UNAFFECTED.
    That is the deliberate state, not an oversight: it is better than the alternative
    this basin makes easy, which is borrowing a downstream integrator. Before #1120
    the only Ohio River gage registered anywhere was Greenup Dam, and it is scoped
    `basins: [ohio-brush-creek]` for exactly this reason — the Muskingum meets the
    Ohio hundreds of river miles above Greenup, where the river carries a fraction
    of the drainage area gaged there.'
  - THE BASIN IS RESERVOIR-REGULATED, AND ANY LOW-FLOW STATISTIC REGISTERED HERE LATER
    MUST SAY SO. The Muskingum Watershed Conservancy District operates a flood-control
    reservoir system across these subbasins in partnership with the US Army Corps
    of Engineers, so a gage below one of its structures measures a managed flow rather
    than a natural one. Per this table's meta.cited_annotations rule a `regulation`
    block must quote a published third-party classification, and no such judgment
    for any gage in this basin has been read into the corpus — so an unannotated Muskingum
    gage would mean 'not yet read against the published record', never 'unregulated'.
  - 'SUBREGION 0504 IS ONE RIVER''S DRAINAGE TREE, unlike the Portage''s 04100010
    and Ohio Brush Creek''s 05090201, whose caveats warn that a cataloging unit is
    not a watershed. Every subbasin here drains to the Muskingum mainstem and on to
    the Ohio at Marietta: the Tuscarawas and the Walhonding form the Muskingum at
    Coshocton, and Wills Creek and the Licking enter below. No unit here is a frontal-drainage
    sibling of another, so the upstream/downstream reasoning a screen depends on is
    sound within this file.'
