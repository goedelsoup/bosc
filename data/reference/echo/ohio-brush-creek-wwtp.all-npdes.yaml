meta:
  subject: Ohio Brush Creek-basin NPDES wastewater dischargers
  scope: all active CWA-permitted dischargers
  source: EPA ECHO — cwa_rest_services (CWA v2017-10-13)
  watershed: Ohio Brush Creek — 1 HUC-8 subbasin (05090201 Ohio Brush-Whiteoak), subregion
    0509 (direct to the Ohio River)
  huc8s:
    05090201: Ohio Brush-Whiteoak
  dedup_key: FRS RegistryID
  count: 261
  caveats:
  - ECHO's CWA facility service has no CWNS column; the POTW flag rests on CWPFacilityTypeIndicator.
  - Facilities link to HUCs via WATERS (FacDerivedHuc); a permit that didn't geocode
    can be missed.
  - design_flow_mgd is null where ECHO returned no value; it is never estimated.
  - 'SCOPE IS WIDER THAN THE NAME. HUC-8 05090201 ''Ohio Brush-Whiteoak'' is a WBD
    cataloging unit spanning BOTH banks of the Ohio River, not one watershed — read
    each row''s county: they fall on the Kentucky bank and the Ohio bank alike. Several
    separate creeks reach the Ohio inside it, and each is a SIBLING of Ohio Brush
    Creek rather than a headwater of it: a discharger on one is neither upstream nor
    downstream of one on Ohio Brush Creek, and must never borrow its 7Q10. Only a
    receiving water naming Ohio Brush Creek matches that gage; a bare ''Brush Creek''
    does not (this pull holds a Campbell County KY ''BRUSH CRK'' on the far side of
    the river).'
  - 'Because the unit spans both banks it is majority-Kentucky, and completeness therefore
    needs BOTH agencies: cross-check Ohio EPA for the Ohio side and Kentucky DOW for
    the Kentucky side. Neither agency''s list is reflected here beyond what ECHO federalizes.
    ECHO also returns no county at all for part of the pull, so a county tally taken
    off this file under-counts rather than resolving to zero.'
  - Where receiving_water is null the row is unscreenable — including for every Adams
    County POTW that is not on the Ohio River mainstem (Peebles, Seaman, West Union
    OH0028088, Winchester), so the plants nearest the network's watershed point are
    exactly the ones ECHO cannot place. The assimilative screen keys on that field,
    so an unnamed receiver reports as unmatched, never as unaffected. The gap closes
    only through cited entries in the curated receiving-water overlay, never by inference
    from a facility's name or county.
  - 'A row whose receiving_water names TWO different waters is refused too, not resolved
    to the larger one: ECHO''s field is a permit-level aggregate over every outfall,
    so ''OHIO RIVER, TWELVE MILE CREEK'' does not say which water carries the design
    flow. Those rows report no_7q10 alongside the ungaged ones.'
  - Whiteoak, Eagle, Straight and Beasley Fork are ungaged for a defensible low-flow
    statistic (no NWIS daily-discharge record meeting the 20-climatic-year floor),
    so their dischargers stay unscreened rather than screening against a proxy.
  - The Ohio River denominator these files' screened rows use is USGS 03216600 at
    Greenup Dam, upstream of every facility here and scoped in mainstem-gages.yaml
    to this basin alone — it is not a valid Ohio River 7Q10 for a basin that meets
    the river elsewhere.
