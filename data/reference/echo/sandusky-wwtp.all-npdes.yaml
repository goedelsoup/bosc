meta:
  subject: Sandusky-basin NPDES wastewater dischargers
  scope: all active CWA-permitted dischargers
  source: EPA ECHO — cwa_rest_services (CWA v2017-10-13)
  watershed: Sandusky River — 1 HUC-8 subbasin (04100011 Sandusky), subregion 0410
    (Western Lake Erie, direct to the lake rather than through the Maumee)
  huc8s:
    '04100011': Sandusky
  dedup_key: FRS RegistryID
  count: 124
  caveats:
  - ECHO's CWA facility service has no CWNS column; the POTW flag rests on CWPFacilityTypeIndicator.
  - Facilities link to HUCs via WATERS (FacDerivedHuc); a permit that didn't geocode
    can be missed.
  - design_flow_mgd is null where ECHO returned no value; it is never estimated.
  - THE INVENTORY IS PULLED; NO SANDUSKY GAGE IS REGISTERED. mainstem-gages.yaml holds
    no entry for this basin, so a discharger here reports no_7q10 — UNSCREENABLE,
    NEVER UNAFFECTED — until one is registered with its drainage-area rationale.
  - 'A BAY IS NOT A RIVER REACH, AND A 7Q10 DOES NOT DESCRIBE ONE. The network''s
    own point in this basin discharges to SANDUSKY BAY, an embayment at the river''s
    mouth, not to a flowing reach. A low-flow dilution ratio presumes a stream whose
    discharge sets the denominator; in an estuary the mixing volume is set by lake
    level, seiche and wind forcing instead. Registering the Sandusky River''s eventual
    mainstem gage must therefore NOT extend an alias to the bay: a river 7Q10 served
    to a bay outfall is not a conservative approximation, it is a category error.'
  - This basin is a SIBLING of the Maumee and the Portage, not a part of either. All
    three reach Western Lake Erie independently, so a Sandusky discharger is neither
    upstream nor downstream of a Maumee or Portage one and must never borrow either
    basin's denominator.
