meta:
  subject: 'Data-center blowdown discharge — OHD000001 general-permit coverage + facility-own DMR status
    (closed-loop cooling cycling epic #1676, A2)'
  source: watermark.hydrology.blowdown — the site registry's closed-loop cohort x the OHD000001 permit
    lifecycle
  regenerate: watermark oepa coverage --write
  asof: '2026-07-21'
  discipline: 'OHD000001 coverage is gated on the permit lifecycle: while the general permit is draft
    (not effective), or once it has been withdrawn, no facility can be authorized, so the per-candidate
    status is not_available — a [verified] cited absence. Ohio EPA WITHDREW OHD000001 on 2026-07-21, so
    that absence is now permanent rather than pending, and on the NPDES path an individual permit is the
    only remaining instrument that would disclose a data center''s cooling discharge — though a facility
    blowing down to a POTW sanitary sewer holds no NPDES permit at all and is disclosed instead by the
    City''s industrial-pretreatment / IU permit and sewer-use agreement. Facility-own discharge presence
    is unknown until a search establishes it (the C2 records request); an absence under a closed-loop-dry
    claim is a finding, never read as ''confirmed dry''. No per-site over-cycling conclusion is asserted
    here (that is the B-review).'
general_permit:
  permit_id: OHD000001
  title: Ohio EPA Draft General NPDES Permit for Data Center Facilities
  state: withdrawn
  effective: false
  issued: '2025-10-31'
  effective_date: null
  comment_closed: '2026-01-16'
  citation: 'Ohio EPA Division of Surface Water — draft General NPDES permit OHD000001 (public notice
    No. 215991; public hearing 2025-12-17); covered cooling water, low-volume wastewaters (cooling-tower/boiler
    blowdown, air-compressor condensate) and stormwater (data/catalog/reference/oepa-ohd000001-gp.yaml).
    WITHDRAWN: Ohio EPA Community Notice of 2026-07-21 states that after reviewing the comments it ''has
    decided not to move forward with finalizing the general permit'' and that ''the individual NPDES permit
    issuance process is the most appropriate path forward at this time'' (data/documents/oepa/2026-07-21-ohio-epa-will-not-finalize-data-center-general-permit.npdes-general-permits.html).
    The Director acted -- by declining -- so the coverage gate is now permanent rather than pending, and
    the replacement watch is whether an INDIVIDUAL NPDES application or draft permit appears for a given
    campus.'
  confidence: high
  asof: '2026-07-21'
