    so Bowling Green Data Center (Project Accordion) can never hold blowdown coverage under it. This absence
    is permanent, not pending: on the NPDES path an INDIVIDUAL permit is now the only instrument that
    would disclose this facility''s cooling discharge. That path is not the only one — a facility that
    blows down to a POTW sanitary sewer holds no NPDES permit at all, and its flow is disclosed instead
    by the City''s industrial-pretreatment / IU permit and sewer-use agreement (the C2 ask, #1688). No
    facility-own discharge permit is wired — either genuinely dry, or blowdown goes to sewer under a City
    sewer-use agreement not in ECHO (→ C2 records request).'
  citation: '[reference] company claim (NOT instrument-confirmed): Meta describes closed-loop, liquid-cooled
    with dry coolers — ''no operational water'', with domestic/cleaning/fire use only. In tension with
    the NWWSD wholesaling BG water to Meta (contract ceiling 1.5 MGD, Aug 2024; conflicting ~50k vs ~600k
    GPD figures; a Meta-funded 2 MG tank + 16-in main) — that reconciliation is tracked at the water sub-issue
    #1439, not decided here. B5 (#1685) RAN that tension through the A3 cooling harness and the pin SURVIVES,
    but as a reservation_conflict rather than an untested claim: the district-linked ~600,000 gpd design
    commitment is a demand signal independent of Meta''s own account of its cooling, and is disproportionate
    to ''no operational water''. It cannot re-archetype the pin — a negotiated ceiling is not a withdrawal
    or discharge instrument — and the harness confirmed there is no instrument to be had: the campus buys
    finished water (so the Ohio DNR withdrawal registry, which records withdrawals from waters of the
    state, carries no Meta/Liames/Accordion/NWWSD registration in Wood County at all), and a full ECHO
    sweep of the county finds every campus-linked record under the CONSTRUCTION stormwater general permit
    with no process outfall and no DMR. With OHD000001 withdrawn 2026-07-21, an INDIVIDUAL NPDES permit
    is the only remaining instrument on the DIRECT-DISCHARGE path — but that is not the only path, and
    here it may well be the wrong one: this campus''s discharge route is not established, and a facility
    blowing down to a sanitary sewer files no DMR at all and is disclosed instead by the City/district
    industrial-pretreatment (IU) permit and sewer-use agreement, which is what the records ask actually
    seeks. See data/reference/oepa/cooling-reconciliation.yaml. Replace with a documented cooling design
    when an NPDES/water instrument lands.'
