meta:
  subject: 'Data-center cooling-cycling reconciliation — claimed cooling archetype vs the documented water
    account (closed-loop cooling cycling epic #1676, A3 #1679), plus the A4 (#1680) independent corroborators
    (air-permit PM + Tier II chemistry)'
  source: watermark.hydrology.cooling_reconcile — the A2 closed-loop cohort x the archetype-predicted
    water account (cooling_models) x documented makeup (A1) / blowdown (A2) x the A4 corroborators (cooling_corroborators),
    plus the Troy-Piqua B1 reservation conflict (#1681) and the Intel evaporative positive control
  regenerate: watermark cooling-reconcile --write
  asof: '2026-07-11'
  outcomes:
    discrepancy: 0
    corroborated: 1
    reservation_conflict: 1
    gap: 5
  discipline: 'The harness RECOMMENDS; it never mutates cooling_model — re-archetyping is a reviewed B1-B6
    edit with the instrument cited. A back-solved cycles-of-concentration is an [inference] bracket, never
    a headline scalar. A gap (no documented makeup/blowdown) is an [open] records-request lead for C2
    (#1688), never read as ''confirmed dry''. A reservation_conflict (B1 Troy-Piqua, #1681) is a low-water
    claim contradicted by a disclosed RESERVATION CEILING (a will-serve / water-agreement figure), not
    a metered use — a ceiling is not a discharge/withdrawal instrument, so it keeps the archetype pin
    (Troy-Piqua stays UNKNOWN) and sharpens the site''s water lead (#1486) + the C2 request; the reserved
    figure is never collapsed into a headline consumptive. The A4 corroborators (air-permit cooling-tower
    PM, Tier II / EPCRA-312 chemistry) are SECONDARY — recorded and reconciled against the claim, but
    never the sole basis for a re-archetype and never changing the outcome. The Intel row is a constructed
    positive control (openly evaporative) the harness must classify corroborated, not a false discrepancy
    — it is a calibration vector, not documented Intel data.'
