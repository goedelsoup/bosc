    account (closed-loop cooling cycling epic #1676, A3 #1679), plus the A4 (#1680) independent corroborators
    (air-permit PM + Tier II chemistry)'
  source: watermark.hydrology.cooling_reconcile — the A2 closed-loop cohort x the archetype-predicted
    water account (cooling_models) x documented makeup (A1) / blowdown (A2) x the A4 corroborators (cooling_corroborators),
    plus the Troy-Piqua B1 reservation conflict (#1681) and the Intel evaporative positive control
  regenerate: watermark cooling-reconcile --write
  asof: '2026-07-21'
  outcomes:
    discrepancy: 0
    corroborated: 1
    reservation_conflict: 2
    gap: 4
    route_blind: 1
  discipline: 'The harness RECOMMENDS; it never mutates cooling_model — re-archetyping is a reviewed B1-B6
    edit with the instrument cited. A back-solved cycles-of-concentration is an [inference] bracket, never
    a headline scalar. A gap (no documented makeup/blowdown) is an [open] records-request lead for C2
    (#1688), never read as ''confirmed dry''. A reservation_conflict (B1 Troy-Piqua, #1681) is a low-water
    claim contradicted by a disclosed RESERVATION CEILING (a will-serve / water-agreement figure), not
    a metered use — a ceiling is not a discharge/withdrawal instrument, so it keeps the archetype pin
    (Troy-Piqua stays UNKNOWN, Bowling Green stays closed_loop_dry) and sharpens the site''s water lead
    (#1486, #1439) + the C2 request; the reserved figure is never collapsed into a headline consumptive.
    A reservation conflict SURVIVES A BLIND ROUTE (B5 Bowling Green, #1685): the reach guard below invalidates
    a negative read, and a negotiated ceiling is not something the withdrawal or discharge instruments
    could ever have metered, so blinding them cannot erase it — which is why a municipally-supplied campus
    with an independently-sourced reservation reads reservation_conflict and not route_blind. Where the
    operator''s OWN figure conflicts with that reservation, the two are separated by PROVENANCE and not
    by size: the independently-sourced figure classifies, the self-report does not, and the conflict between
    them is reported rather than resolved. A gap the operator has DISCLOSED into (B2 Van Wert, #1682)
    records the self-reported ongoing draw on `disclosed_makeup` (never `documented_*`) — it stays a gap
    with the [reference] pin KEPT (a single-source self-report is not a metered instrument, so it cannot
    upgrade the source), and its lead names the specific open quantity: the initial closed-loop fill,
    whose fill-vs-annual framing is the #1409 discrepancy. The A4 corroborators (air-permit cooling-tower
    PM, Tier II / EPCRA-312 chemistry) are SECONDARY — recorded and reconciled against the claim, but
    never the sole basis for a re-archetype and never changing the outcome. The Intel control row (is_control)
    is a CONSTRUCTED positive control (openly evaporative) the harness must classify corroborated, not
    a false discrepancy — a calibration vector, not documented Intel data. A route_blind (B6 New Albany
    / Intel, #1686) is a facility whose water is outside the reach of BOTH instruments this harness reads
    — makeup purchased from a municipal system (the withdrawal registry meters withdrawals from waters
    of the state, not purchases) and/or blowdown to a POTW sanitary sewer (no NPDES outfall, so no DMR).
    Their ~0 is an absence of jurisdiction, NOT a documented ~0, so it can never corroborate a dry claim;
    the pin is kept and the records request is re-aimed at the City-held meter + industrial-pretreatment
    record. A documented withdrawal that is on record but is not the cooling account (Intel''s construction-phase
    groundwater) rides on `nonprocess_makeup`, never `documented_*`. Where an archetype''s water account
    cannot be derived at all — a semiconductor fab has no IT load, and every archetype is IT-load-parameterized
    — the prediction is REFUSED with its reason on `prediction_refused` and the three `predicted_*` are
    null; a reader must show the refusal, never substitute a zero.'
  reference_band:
    basis: the evaporative_tower archetype spec's own defaults, run through watermark.hydrology.cooling_models
      and normalized per IT-MW
    makeup_mgd_per_mw: 0.0143
    consumptive_mgd_per_mw: 0.01144
    blowdown_mgd_per_mw: 0.00286
    cycles_of_concentration: 5.0
    wue_l_per_kwh: 1.8
    tag: '[inference]'
    confidence: medium
    citation: '100 MW x 1.8 L/kWh / evap fraction — normalized per IT-MW from a 100 MW run of the archetype''s
      own cited defaults. A screening band: it is what an evaporative tower of a given IT load WOULD draw
      under the archetype, not what any facility has disclosed or any instrument has measured.'
    not_derived_from: 'NOT derived from the Intel positive control (B6, #1686). Intel Ohio One is a semiconductor
      fab, not a data center: its disclosed ~5 MGD is fab process water at a campus that will not operate
      until 2030-31, its ~100+ MW continuous is an electrical load rather than an IT load, and its cooling
      towers are permitted but not running. A makeup-per-MW figure read off it and applied to a hyperscale
      campus would be a category error, so no documented evaporative-hyperscale band exists in the network
      yet — that gap is itself the finding, and the archetype figures recorded here stand in as a screening
      reference until an operating, metered evaporative campus lands.'
