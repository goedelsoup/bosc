    governing_body: Board of County Commissioners
    meeting_schedule: "Regular Meeting: 9:30 am Tuesday & Thursday"
    office: null
    grounded_from: hancock-directory-of-officials-2026
    note: >-
      The roster prints the board's standing cadence and office hours but no address.
      Unlike Lima's registry, the county board IS enumerated here — Hancock's
      commissioners' record is not a separately ingested corpus.
    publishing:
      website: https://co.hancock.oh.us/
      records_url: https://co.hancock.oh.us/AgendaCenter/County-Commissioners-2
      platform: civicplus
      discovered:
        asof: "2026-08-01"
        method: web
        note: >-
          CivicPlus/CivicEngage Agenda Center on the county's own site. Two categories
          are published: "Commissioners Regular Meeting" (agendas AND minutes, keyed
          _MMDDYYYY-<id>) and "Common Pleas Court - Community Corrections Planning
          Board" (agendas only). Same Agenda Center shape as Lima's and LACRPC's, so
          the existing civicplus fetcher reads it unchanged.

