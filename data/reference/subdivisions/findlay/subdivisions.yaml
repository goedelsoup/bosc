# Findlay (findlay) — political-subdivision public-meeting records registry.
#
# Enumerated BY HAND from the committed Hancock County Directory of Officials 2026
# (see meta.grounded_sources) for the epic-1520 cross-site pilot, issue 1839.
# Grounded facts (name/type/governing_body/meeting_schedule/office) are transcribed
# VERBATIM from that roster — including its own phrasing of a cadence ("Third Monday
# of the Month, 7:00 pm"), which is deliberately NOT normalized to Lima's
# "3rd Monday, 7:00 PM" house style: the roster's words are the source.
#
# `publishing:` is a live-web finding folded in by hand from
# `watermark --site findlay subdivisions discover` (read-only; it never rewrites
# this file). See src/watermark/civic/CLAUDE.md.
meta:
  site: findlay
  subject: Hancock County, Ohio political subdivisions — public-meeting records registry
  description: >-
    Meeting-holding bodies for the Findlay watershed point (Hancock County, Blanchard
    River), each with the verbatim governing-body meeting cadence and office carried in
    the committed county roster, plus a `publishing:` block recording where (and on what
    platform) the body posts its minutes/agendas online. The grounded roster facts are
    immutable source; the `publishing:` block is filled by the read-only discovery pass
    (`watermark --site findlay subdivisions discover`) and carries its own `discovered:`
    provenance.
  grounded_sources:
    # Hancock County publishes ONE consolidated roster where Allen County publishes
    # three separate sheets, so a single document grounds the townships, the villages,
    # the two cities, the board of commissioners and the county's own departments.
    - id: hancock-directory-of-officials-2026
      file: data/documents/findlay/reference/2026 Directory of Officials_202604131412522342.pdf
      title: Hancock County, Ohio — Directory of Officials, 2026
      asof: "2026"
      pages:
        county_elected: 1
        county_departments: 2
        city_of_findlay: 3
        fostoria_and_villages: 4
        township_trustees: 5-9
        zoning_officials: 10
  caveats:
    - "Meeting cadence is transcribed verbatim from the roster; it is the standing
      schedule, not a guarantee any given date met (cancellations/special meetings
      are resolved against the actual posted records). Several boards recess in
      January — Allen Township's roster line says so outright ('February-December')."
    - "`publishing.platform: unknown` WITH a `discovered:` block = the body was looked
      at but its CMS wasn't fingerprinted (or its site blocked the fetch). `unknown`
      WITHOUT a `discovered:` block = not yet looked. Neither ever means the body
      withholds records, and a null `records_url` is never evidence of withholding."
    - "`platform: request_only` = no online posting was found (records-request route);
      `platform: facebook` = the only web presence is a Facebook page. Beware the
      same-named-township trap: Ohio has an Allen, an Amanda, a Jackson, a Liberty, a
      Madison, a Marion, an Orange, a Pleasant, a Portage, a Union, a Van Buren and a
      Washington Township in several other counties (Hancock's Jackson Township is not
      Stark County's; its Liberty Township is not Delaware County's). Each entry's
      discovery note records what tied the site to Hancock County."
    - "Three Hancock townships share a name with an ALLEN County township in Lima's own
      registry (Amanda, Jackson, Marion). The two registries are separate files read per
      active site, and their meeting trees nest separately (Lima flat, Findlay under
      `findlay/`), so a shared body slug can never collide — that isolation is exactly
      what the cross-site layout buys (#1520/#1522)."
    - "The City of Findlay's and the City of Fostoria's council cadence is NOT in this
      roster — it prints cadence for the villages, the townships and the county
      commissioners only. Both are left null rather than sourced from outside
      knowledge."
    - "County-line straddles. Bluffton is Allen/Hancock and appears in BOTH this
      registry and Lima's (as an Allen County seat of record) — the same body, grounded
      twice from two different counties' rosters. Fostoria is Seneca/Hancock/Wood and
      is seated in Seneca County; it is listed here because the county roster lists it,
      not because Hancock is its seat. The Village of Van Buren and Van Buren Township
      are distinct bodies with distinct slugs (`van-buren` / `van-buren-township`), as
      are the Village of Arlington and (Allen County's) Arlington-addressed townships."
    - "This registry INCLUDES the Board of County Commissioners, where Lima's excludes
      Allen County's. Lima's commissioners' record is a separately ingested corpus
      under `data/extracted/commissioners/`; Hancock's has no such corpus, so the county
      board is enumerated here as what it is — a meeting-holding political subdivision."
    - "Not enumerated: the county's other appointed boards (Board of Elections, Park
      District, Soil & Water Conservation District, Solid Waste Management District,
      Public Health, Library), the school districts, and the fire/EMS districts. The
      roster names them (pp. 2, 12-14) but grounds no governing body or cadence for
      them. Add one when it holds a record this project needs, with its own grounding."

# platform vocabulary (publishing.platform):
#   civicplus      CivicPlus / CivicEngage "Agenda Center" (structured agendas+minutes)
#   granicus       Granicus / Legistar / GovAccess meeting portal
#   boarddocs      Diligent BoardDocs (go.boarddocs.com)
#   civicclerk     CivicClerk meeting portal (now CivicPlus)
#   revize         Revize municipal CMS
#   wordpress      WordPress site (typically PDF links on a "minutes" page)
#   wix            Wix site builder
#   squarespace    Squarespace site builder
#   govoffice      GovOffice / govoffice.com
#   facebook       Posts to a Facebook page only (no records page found)
#   request_only   No online posting found; obtain via public-records request
#   unknown        Not yet discovered, or CMS not fingerprinted / site blocked the fetch

subdivisions:
  # --- County (1) — grounded in hancock-directory-of-officials-2026 p.1 ---------
