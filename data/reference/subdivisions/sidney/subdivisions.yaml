# Sidney (sidney) — political-subdivision public-meeting records registry. Issue #1999.
#
# The second peer registry after Findlay's (#1839), and it is grounded DIFFERENTLY, because
# Shelby County does not publish what Hancock County does.
#
# ⚠️ THERE IS NO SHELBY COUNTY "DIRECTORY OF OFFICIALS". Findlay's 32 bodies rest on one
# county-published roster that prints every body's cadence and office. Shelby County publishes no
# such document — a dated negative across five routes on 2026-08-11 (county Government index,
# DocumentCenter, targeted search, the SOS statewide roster, the county board of elections). The
# nearest county artifact, `shelby-township-officials-2024`, is a single page of chairmen and
# zoning enforcement officers with NO cadence and NO township-hall address for any of the 14
# townships. So `meta.grounded_sources` is a LIST, and most bodies here carry
# `meeting_schedule: null` and `office: null`. That is the schema behaving correctly under
# Findlay's own rule — a cadence is transcribed from a committed roster or it is not asserted —
# and it is not a gap in the transcription.
#
# What Sidney has instead is stronger for the one body that matters most: the City's RULES OF THE
# CITY COUNCIL, adopted and amended by ordinance, which print Council's cadence, time and place
# verbatim. All six Project Galaxy vote dates fall on that printed cadence.
# ⚠️ They are NOT "codified" — the Rules' own p.2 says their authority derives from City Charter
# §2-13. The Charter is the codified instrument; the Rules are adopted under it.
#
# `publishing:` is a live-web finding folded in BY HAND (`watermark --site sidney subdivisions
# discover` is read-only and never rewrites this file). See src/watermark/civic/CLAUDE.md.
meta:
  site: sidney
  subject: Shelby County, Ohio political subdivisions — public-meeting records registry
  description: >-
    Meeting-holding bodies for the Sidney watershed point (Shelby County, upper Great Miami
    River). Grounded facts come from the committed sources below; every body whose cadence no
    committed source prints carries `meeting_schedule: null` with a note recording what WAS
    observed live and where. The `publishing:` block is the read-only discovery pass folded in by
    hand and carries its own `discovered:` provenance.
  grounded_sources:
    - id: sidney-council-rules-2024
      file: data/documents/sidney/reference/sidney-council-rules-2024.pdf
      title: City of Sidney — Rules of the City Council, February 2024
      asof: "2024-02-12"        # Ordinance A-3171, the most recent amendment on its own cover
      pages:
        regular_meetings: 2     # 0-based p.1 — §1 REGULAR MEETINGS
      note: >-
        A legislative instrument, not a web blurb: 19 pages, adopted and amended by ordinance
        eleven times since 1982 under the authority of City Charter §2-13 (its own p.2 says so).
        ⚠️ Adopted BY ordinance, not codified IN the code — the Charter is the codified
        instrument. This is the only committed document for this site printing a standing cadence.
    - id: shelby-township-officials-2024
      file: data/documents/sidney/reference/shelby-township-officials-2024.pdf
      title: 2024 TOWNSHIP REPRESENTATIVES -- SHELBY COUNTY
      asof: "2024"
      note: >-
        Grounds township NAMES only. Its sole role words are 'TOWNSHIP CHAIRMAN' and 'TOWNSHIP
        ZONING ENFORCEMENT OFFICER' — no cadence, no office address, and no governing body — so it
        can ground `name`/`type` and nothing else. ⚠️ Cite it for the BODY, never for a current
        officeholder: it disagrees with Clinton Township's own 2026 site on who chairs the board.
  # Leads for a future pass, recorded so the next check does not re-derive them:
  #  · https://co.shelby.oh.us/DocumentCenter/View/1509/2026-RPC-Board-Members — a 2026-vintage
  #    county-published roster enumerating 24 bodies by their RPC representation. Newer than the
  #    township sheet and broader; it was found by the refutation pass, not the sweep. Not yet
  #    read, so nothing here is grounded on it.
  #  · The 2023 predecessor of the township sheet adds a fiscal-officer column the 2024 one drops.
  county_enumeration:
    tag: '[verified]'
    statement: >-
      Shelby County comprises 14 townships, 8 incorporated villages (Anna, Botkins, Fort Loramie,
      Kettlersville, Lockington, Port Jefferson, Jackson Center, Russia) and 1 city (Sidney, the
      county seat).
    source: https://co.shelby.oh.us/regional-planning-commission/ (read 2026-08-11)
    note: >-
      The completeness anchor. This registry enumerates the bodies the Project Galaxy record
      actually reaches — the City, the county board, the two planning commissions, the campus's
      own township, and the two school boards that are counterparties to Res. 81-25 / 82-25. The
      remaining townships and villages are reachable from the committed roster by NAME only, and
      are deliberately not listed as rows until a source prints something more than a name: a
      registry of empty rows is not more complete, it is just longer.
  caveats:
    - "Meeting cadence is transcribed verbatim from a committed source; the Council Rules' own
      phrasing is kept rather than normalized to Lima's house style. Where no committed source
      prints a cadence the field is null and the note records the live-web observation instead —
      never promoted into the grounded field."
    - "⚠️ The Council Rules print a HOLIDAY-SHIFT clause and a SECOND meeting series. Regular
      meetings move to 'the following Tuesday or such other day as the Council may determine'
      when the second or fourth Monday is a holiday, and workshop sessions run on the FIRST
      Monday. A missing-meeting audit that reads only 'second and fourth Mondays' will report
      false absences in holiday months and will miss the workshops entirely."
    - "⚠️ The same-name trap here is a same-COUNTY trap, and it is worse than Findlay's. Shelby
      County exists in Ohio, Indiana, Tennessee, Illinois, Iowa, Kentucky, Missouri, Alabama and
      Texas, and a search for 'Shelby County commissioners' returns Tennessee's first. Separately,
      the CITY of Shelby, Ohio is in RICHLAND County and is not in Shelby County at all — the
      same collision the site profile already carries on its EIA utility number. Ohio also has a
      Clinton Township in Franklin, Fulton, Knox, Seneca, Vinton and Wayne counties; this
      registry's is Shelby's, tied by the county's own township link."
    - "⚠️ A grounded field is null unless a COMMITTED source prints it — which here means only
      the two documents above. Five of the seven bodies therefore carry a null cadence AND a null
      office AND (for Clinton Township) a null governing body, even where a live page states them
      plainly. Those live readings are kept in each body's `note` with the date they were read.
      This looks like a thinner registry than Findlay's and is the same discipline: Findlay's
      county roster prints cadences and offices, so its fields are filled; Shelby's does not."
    - "`platform: unknown` WITH a `discovered:` block = looked at, CMS not fingerprintable or
      not in the enum. `unknown` WITHOUT one = not yet looked. Neither ever means the body
      withholds records, and a null `records_url` is never evidence of withholding."

subdivisions:
  # ── The City ────────────────────────────────────────────────────────────────
  - slug: sidney-city-council
    name: Sidney City Council
    type: city
    governing_body: City Council
    # Verbatim from the Council Rules, §1 REGULAR MEETINGS (0-based p.1), read off the document's
    # own text layer. The rule's phrasing — including "5:30 P.M. Eastern Time" — is the source.
    meeting_schedule: >-
      Regular meetings of the City Council are held on the second and fourth Mondays of each month
      at 5:30 P.M. Eastern Time, in the City Council Chambers in the Municipal Building. When the
      second or fourth Monday falls on a holiday, the regular meeting shall be held on the
      following Tuesday or such other day as the Council may determine.
    # The Rules name the place as "the City Council Chambers in the Municipal Building" and print
    # no street address — checked: no "Poplar", no "201 W", no ZIP anywhere in the document. So
    # `office` is null and the address the City publishes live (201 W. Poplar Street, Sidney, OH
    # 45365, read 2026-08-11) stays in this note, unpromoted.
    office: null
    grounded_from: sidney-council-rules-2024
    note: >-
      ⚠️ ALL SIX Project Galaxy vote dates fall on this printed cadence:
      2025-09-08 is the 2nd Monday (Res. 69-25); 2025-10-27 the 4th (Res. 80-25 / 81-25 / 82-25);
      2026-04-27 the 4th (Res. 26-26 / 27-26). The whole legislative chain sits on regular
      meetings the rule reaches. ⚠️ But that last step is an `[inference]`, not a reading: the
      date arithmetic is exact, while "passed AT a regular meeting" is inferred from the date
      matching the cadence — none of the five committed resolution PDFs says which meeting kind
      adopted it. The minutes would settle it. Workshop sessions on the first Monday are a
      SECOND series the rule also prints; they are not enumerated as a separate body here.
    publishing:
      website: https://www.sidneyoh.com/293/City-Council
      records_url: https://sidneycityoh.documents-on-demand.com/
      platform: unknown
      discovered:
        asof: '2026-08-11'
        method: web
        note: >-
          ⚠️ ROUTE CORRECTION — THIS PORTAL IS REACHABLE. It was recorded across this site's
          record (regulatory-watch.yaml, data-centers.md, the drafted R.C. 149.43 requests) as
          "Cloudflare-challenged", i.e. an unsearched route. It IS a Cloudflare challenge — the
          403 carries `cf-mitigated: challenge` and a "Just a moment…" body — but it is triggered
          by the HTTP/2 FINGERPRINT, not by the client's identity, and one retry defeats it.
          Verified here: a default HTTP/2 request returns 403, and the SAME request forced to
          `--http1.1` with a browser UA returns HTTP 200 (28,684 bytes). The portal further exposes an undocumented JSON API
          (`/meta/rootfolder`, `/meta/docfolder?containerId=<guid>`), confirmed 200 with
          `application/json`, whose root tree enumerates City Council → Agendas / Agenda Packets /
          Legislation → Ordinances, Resolutions / Minutes. The COUNCIL-MINUTES lead is therefore
          answerable from a PUBLIC portal, not only by records request.
          `platform: unknown` is literal, not evasive: the vendor is Ameriscan Imaging Services
          "Documents-On-Demand" and the `Platform` enum has no value for it, so no fetcher
          dispatches. Adding one is its own change.
          The City ALSO runs a CivicPlus Agenda Center at https://www.sidneyoh.com/AgendaCenter,
          but it is the newer JS-rendered variant: the repo's own `parse_agenda_center` returns
          ZERO MeetingDocs against it (verified), i.e. an honest empty and a fetcher gap — never
          a body that publishes nothing.

  - slug: sidney-city-planning-commission
    name: Sidney City Planning Commission
    type: city
    governing_body: City Planning Commission
    meeting_schedule: null
    office: null
    grounded_from: null
    note: >-
      No committed source prints this body's cadence, so the field stays null. ⚠️ The City itself
      publishes the time TWO different ways on two of its own pages (observed 2026-08-11), which
      is a second reason not to promote either into a grounded field. It matters to this site
      because site-plan approval is administrative under Zoning Code §1115.09 — a staff action
      with no agenda item — so this commission is where a site-plan matter would surface if one
      ever did.
    publishing:
      website: https://www.sidneyoh.com/267/Boards-Commissions
      records_url: https://sidneycityoh.documents-on-demand.com/
      platform: unknown
      discovered:
        asof: '2026-08-11'
        method: web
        note: >-
          Shares ONE records portal with City Council — the same Documents-On-Demand host, same
          route correction as above. The City's boards-and-commissions index names 24 bodies
          across three alphabetical pages; only the ones this record reaches are enumerated here.

  - slug: sidney-cra-housing-council
    name: City-Wide Community Reinvestment Area Housing Council
    type: city
    governing_body: City-Wide Community Reinvestment Area Housing Council
    meeting_schedule: null
    office: Council Chambers, City Hall, 201 W Poplar St
    grounded_from:
      - data/documents/sidney/council/84-22 - Establishing CRA based on Community Boundaries.pdf
      - data/documents/sidney/cra-housing-council/CRA Housing Council Agenda February 05, 2026.pdf
      - data/documents/sidney/cra-housing-council/CRA Housing Council Agenda May 04, 2026.pdf
    note: >-
      Added 2026-08-13 (#1998 tail). ⚠️ THIS ROW EXISTS BECAUSE ITS ABSENCE HAD BEEN ASSERTED AS
      PRESENCE — the corpus's Res. 84-22 extraction claimed this body was "one of the seven bodies
      in subdivisions.yaml" when it was not one of them. #1998 struck the false claim; this is the
      other half of that correction.
      CREATED BY Res. 84-22 §7, which prints its composition verbatim: "two (2) members appointed
      by the Mayor, two (2) members appointed by the City Council, and one (1) member appointed by
      the Planning Commission", the majority of whom "shall then appoint two (2) additional members
      who shall be residents within the area", three-year terms. SEVEN seats, of which only four
      are ever filled by a Council resolution — which is why the appointment record looks
      incomplete and is not.
      ⚠️ `meeting_schedule` IS NULL AND NOW GROUNDED RATHER THAN MERELY UNSOURCED. This body had no
      regular schedule: its own 2026-05-04 agenda carries "Establishment of a regular monthly
      meeting schedule for the CRA Housing Council" as item 5, its 2026-05-29 agenda still carries
      the schedule as item 4, and the observed meetings move both weekday and hour (Thursday 3:00
      pm, then Monday, then Friday). Whatever was adopted mid-2026 MUST NOT be back-applied to 2025.
      `office` is read from the printed header of the body's own agendas — a City instrument, not a
      live-web read. Equating the Council Rules' "Municipal Building" with "City Hall" would be a
      further inference and is not made here.
      WHY IT MATTERS TO THIS SITE — this is the body that, on 2025-10-23, "unanimously resolved to
      recommend that City Council approve" the Amazon CRA Agreement, which is the single sentence
      Council was given for a thirty-year abatement. ⚠️ It has NO CONTINUING OVERSIGHT of that
      abatement: its own minutes of 2026-03-05 record the Community Development Director stating
      that it reviews only 1- and 2-family housing abatements, and that "Industrial properties that
      have been granted an abatement will be reviewed by the Tax Incentive Review Council". THAT
      body has no container on this portal and no row here.
      ⚠️ Its self-designation is "CITY-WIDE" CRA Housing Council, which disambiguates it from the
      "Greater Downtown CRA Housing Council" of Res. 79-21 / 66-20.
    publishing:
      website: https://www.sidneyoh.com/267/Boards-Commissions
      records_url: https://sidneycityoh.documents-on-demand.com/
      platform: documents-on-demand
      discovered:
        asof: '2026-08-13'
        method: portal
        note: >-
          Its own containers on the shared Documents-On-Demand host — parent
          00ac9418-d831-f111-a491-000c29a59557, Minutes 8ea56988-d831-f111-a491-000c29a59557,
          Agenda 1c6ff647-d831-f111-a491-000c29a59557 — reached over HTTP/1.1 (the identical
          request returns 403 over HTTP/2). ⚠️ BOTH CONTAINERS HOLD ONLY A 2026 FOLDER, verified by
          enumeration. The 2025-10-23 minutes are therefore not published here — an absence of
          PUBLICATION, not of record: the body's own 2026-02-05 agenda and minutes each show those
          minutes were agendized and formally adopted.

