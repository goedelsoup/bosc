# OAC 3745-1-06 (O) — thermal mixing zones. The director may permit a thermal mixing zone in which
# organism response to temperature is time-dependent. Key operative rules for the screen:
thermal_mixing_zone:
  rule: "OAC 3745-1-06 (O) + Table 1"
  # (O)(1)(b)-(c): inside the thermal mixing zone at the point nearest the discharge accessible to
  # resident organisms, the DAILY AVERAGE temperature may not exceed the Table 1 limit at the
  # corresponding ambient temperature. At ambient >= 15 C (59 F) the limit is CASE-BY-CASE (untabulated).
  case_by_case_ambient_c: 15.0
  # (O)(5): a screening OFF-RAMP the Phase-2 screen wires directly — a closed-cycle cooling blowdown
  # discharge whose flow is < 5% of the receiving water's 7Q10 is EXEMPT from the thermal-mixing-zone
  # requirement (O)(1). (Lima's evaporative-tower blowdown is the archetype this bears on.)
  closed_cycle_blowdown_exempt_fraction_of_7q10: 0.05
  # (O)(3): a thermal-mixing-zone request in any of these waters requires a treatment-alternatives +
  # cost-benefit evaluation first (Section 316(a) demonstrations are exempt from this paragraph).
  elevated_review_waters:
    - "any stream designated coldwater habitat"
    - "any stream designated exceptional warmwater habitat"
    - "any lake other than Lake Erie"
  # Table 1 — max daily-average temperature inside a thermal mixing zone vs. ambient (verbatim degF).
  # Stored are only the regulatorily-operative rows for ambient < 15 C (59 F); at/above 15 C the
  # limit is case-by-case. See transcription_notes for the source's anomalous >=62 F trailing rows.
  curves:
    - id: non_lake_erie
      applies_to: "all waters other than Lake Erie"
      source: "OAC 3745-1-06 Table 1 (a)"
      applies_below_ambient_c: 15.0
      # {ambient_f: max daily-average temperature limit degF}
      limits:
        - {ambient_f: 32, limit_f: 50}
        - {ambient_f: 33, limit_f: 50}
        - {ambient_f: 34, limit_f: 50}
        - {ambient_f: 35, limit_f: 51}
        - {ambient_f: 36, limit_f: 52}
        - {ambient_f: 37, limit_f: 54}
        - {ambient_f: 38, limit_f: 55}
        - {ambient_f: 39, limit_f: 57}
        - {ambient_f: 40, limit_f: 58}
        - {ambient_f: 41, limit_f: 60}
        - {ambient_f: 42, limit_f: 62}
        - {ambient_f: 43, limit_f: 63}
        - {ambient_f: 48, limit_f: 71}
        - {ambient_f: 49, limit_f: 73}
        - {ambient_f: 50, limit_f: 75}
        - {ambient_f: 51, limit_f: 76}
        - {ambient_f: 52, limit_f: 78}
        - {ambient_f: 53, limit_f: 79}
        - {ambient_f: 54, limit_f: 81}
        - {ambient_f: 55, limit_f: 83}
        - {ambient_f: 56, limit_f: 85}
        - {ambient_f: 57, limit_f: 86}
        - {ambient_f: 58, limit_f: 88}
    - id: lake_erie
      applies_to: "Lake Erie"
      source: "OAC 3745-1-06 Table 1 (b)"
      applies_below_ambient_c: 15.0
      limits:
        - {ambient_f: 32, limit_f: 52}
        - {ambient_f: 33, limit_f: 52.5}
        - {ambient_f: 34, limit_f: 53.5}
        - {ambient_f: 35, limit_f: 54.4}
        - {ambient_f: 36, limit_f: 55}
        - {ambient_f: 37, limit_f: 56}
        - {ambient_f: 38, limit_f: 57}
        - {ambient_f: 39, limit_f: 58}
        - {ambient_f: 40, limit_f: 59}
        - {ambient_f: 41, limit_f: 59.5}
        - {ambient_f: 42, limit_f: 60}
        - {ambient_f: 43, limit_f: 61}
        - {ambient_f: 48, limit_f: 68}
        - {ambient_f: 49, limit_f: 70}
        - {ambient_f: 50, limit_f: 71}
