# Non-destructive record of source quirks (chain-of-custody discipline — flag, don't silently fix):
transcription_notes:
  - >-
    OAC 3745-1-35 Table 35-11 (J) Maumee bay, average Jun 16-30: the rule prints "83 (29.3)". The
    degF value (83) is stored; 83 F converts to 28.3 C and every sibling 83 F cell reads (28.3), so
    the source's "(29.3)" parenthetical is an apparent typo. degC is derived from the degF, not the
    parenthetical, so the typo does not propagate.
  - >-
    OAC 3745-1-06 Table 1 (a) and (b) each print trailing rows at ambient 62-70 F whose tabulated
    "limits" (44-47 F) fall BELOW the ambient. Those ambient temperatures are >= 15 C, where the rule
    itself makes the limit case-by-case; the anomalous rows are recorded here but excluded from the
    usable curves above. (a): 65->45, 68->47, 66->46, 70->(blank). (b): 62->45, 65->47, 63->46, 66->(blank).
