# Ohio numeric TEMPERATURE water-quality criteria (OAC 3745-1) — the receiving-water thermal
# thresholds the thermal-discharge screen (watermark.hydrology.thermal, Phase 2 of epic #1715)
# compares a cooling discharge's fully-mixed in-stream temperature against. The heat-side peer
# of the per-chemical toxic criteria in ohio-water-quality-criteria.yaml (WS-07 / #1607).
#
# These are PUBLISHED STATE STANDARDS (Ohio Administrative Code chapter 3745-1), not facility
# facts — tagged `reference` when surfaced as ProvenancedValues, never `verified`. Regenerable:
# re-transcribe from the cited OAC rule/table if a standard is revised.
#
# WHERE THE CRITERIA LIVE (important — the issue/epic cite "OAC 3745-1-07"; that is the
# HISTORICAL location). Ohio reorganized chapter 3745-1: the temperature tables were moved OUT
# of 3745-1-07 (now "Beneficial use designations and biological criteria") and now live in:
#   - OAC 3745-1-35 Table 35-11  — inland streams/rivers, keyed by GEOGRAPHIC zone (the core;
#     footer of the rule still reads "Part of: 3745-1-07", recording the origin).
#   - OAC 3745-1-31 Table 31-1   — Lake Erie proper (western basin, central basin, hypolimnion).
#   - OAC 3745-1-06 (O) Table 1  — thermal-mixing-zone daily-average-temperature ceilings, plus
#     the closed-cycle-blowdown exemption and the >=15 C case-by-case rule.
# The Ohio-river MAINSTEM table (OAC 3745-1-32 Table 32-3) is deliberately OMITTED: it uses a
# different (14-period, degF-only) axis, is ORSANCO-governed, and no BOSC network site discharges
# to the Ohio-river mainstem — add it if one ever does. Ohio-river-BASIN tributaries (Springfield,
# Urbana, Troy-Piqua, Sidney, Wilmington) use zone `ohio_river_basin_general` (35-11 A), which IS
# included here.
#
# STRUCTURE (differs from the chemical file). Ohio sets temperature criteria GEOGRAPHICALLY — by
# water body / basin — NOT as a per-aquatic-life-use column (WWH/EWH/CWH/...). Each `zone` below
# gives an `average` and a `daily_max` temperature for each of 18 half-month `periods`. Values are
# stored as the PRIMARY published degF integers (verbatim); degC is derived deterministically in
# the loader as round((degF - 32) * 5/9, 1), which reproduces the rule's own (Celsius) parenthetical
# (e.g. 85 -> 29.4, 47 -> 8.3). Storing degF sidesteps the rule's rounded/typo'd Celsius cells (see
# transcription_notes). A `null` entry means the rule prints no criterion for that period (omit,
# never guess).
#
# A criterion here is a SCREENING threshold. The Phase-2 screen carries a cooling discharge's heat
# load into the receiving reach at a design low flow, fully mixed, no plume credit; T_mixed above a
# zone's daily_max flags the need for a permit-level thermal / CWA Section 316(a) analysis, NOT an
# automatic violation. It is not a CORMIX plume model or a permit determination.

source:
  document: Ohio Administrative Code Chapter 3745-1 — Ohio Water Quality Standards
  inland_temperature_rule: "OAC 3745-1-35 Table 35-11 — temperature criteria, by geographic zone (A)-(L)"
  lake_erie_rule: "OAC 3745-1-31 Table 31-1 — Lake Erie temperature criteria (western/central basin, hypolimnion)"
  thermal_mixing_zone_rule: "OAC 3745-1-06 paragraph (O) + Table 1 — thermal mixing zones"
  historical_origin: >-
    These tables were formerly codified in OAC 3745-1-07; the 3745-1-35 rule footer still records
    "Part of: 3745-1-07". The issue/epic #1715 cite of "OAC 3745-1-07" refers to this origin.
  omitted: "OAC 3745-1-32 Table 32-3 (Ohio-river mainstem temperature) — different axis, no network site on the Ohio-river mainstem."
  urls:
    - https://codes.ohio.gov/ohio-administrative-code/rule-3745-1-35
    - https://codes.ohio.gov/ohio-administrative-code/rule-3745-1-31
    - https://codes.ohio.gov/ohio-administrative-code/rule-3745-1-06
    - https://dam.assets.ohio.gov/image/upload/epa.ohio.gov/Portals/35/rules/01-all.pdf
  retrieved: "2026-07-22"
  effective:
    "3745-1-35": "2017-02-06"
    "3745-1-31": "2024-04-04"
    "3745-1-06": "2024-03-20"
  note: >-
    Screening reference only. Ohio expresses temperature criteria in degF with a rounded (Celsius)
    parenthetical; the degF integers are stored here verbatim and degC is derived in the loader.

# The Ottawa River at Lima drains Ottawa -> Auglaize -> Maumee -> Lake Erie: it is an inland
# tributary in the Lake Erie drainage basin (NOT the Maumee mainstem), so the applicable zone is
# `lake_erie_basin_general` (OAC 3745-1-35 Table 35-11 (G)). Site -> zone selection is a Phase-3
# wiring concern (a SiteProfile knob), NOT baked into this basin-shared reference dataset.
default_zone_hint: lake_erie_basin_general

# The 18 half-month reporting periods shared by every zone table in 35-11 and 31-1, in order. Each
# period is a single calendar month span [day_start, day_end]. Zone `average_f` / `daily_max_f`
# arrays are aligned to this order and MUST have exactly 18 entries (the loader enforces this).
periods:
  - {key: jan,       label: "Jan 1-31",   month: 1,  day_start: 1,  day_end: 31}
  - {key: feb,       label: "Feb 1-29",   month: 2,  day_start: 1,  day_end: 29}
  - {key: mar_1_15,  label: "Mar 1-15",   month: 3,  day_start: 1,  day_end: 15}
  - {key: mar_16_31, label: "Mar 16-31",  month: 3,  day_start: 16, day_end: 31}
  - {key: apr_1_15,  label: "Apr 1-15",   month: 4,  day_start: 1,  day_end: 15}
  - {key: apr_16_30, label: "Apr 16-30",  month: 4,  day_start: 16, day_end: 30}
  - {key: may_1_15,  label: "May 1-15",   month: 5,  day_start: 1,  day_end: 15}
  - {key: may_16_31, label: "May 16-31",  month: 5,  day_start: 16, day_end: 31}
  - {key: jun_1_15,  label: "Jun 1-15",   month: 6,  day_start: 1,  day_end: 15}
  - {key: jun_16_30, label: "Jun 16-30",  month: 6,  day_start: 16, day_end: 30}
  - {key: jul,       label: "Jul 1-31",   month: 7,  day_start: 1,  day_end: 31}
  - {key: aug,       label: "Aug 1-31",   month: 8,  day_start: 1,  day_end: 31}
  - {key: sep_1_15,  label: "Sep 1-15",   month: 9,  day_start: 1,  day_end: 15}
  - {key: sep_16_30, label: "Sep 16-30",  month: 9,  day_start: 16, day_end: 30}
  - {key: oct_1_15,  label: "Oct 1-15",   month: 10, day_start: 1,  day_end: 15}
  - {key: oct_16_31, label: "Oct 16-31",  month: 10, day_start: 16, day_end: 31}
  - {key: nov,       label: "Nov 1-30",   month: 11, day_start: 1,  day_end: 30}
  - {key: dec,       label: "Dec 1-31",   month: 12, day_start: 1,  day_end: 31}

