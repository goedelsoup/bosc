# Findlay↔Ottawa intra-tributary comparison — the BOSC network's ONLY along-one-river control.
#
# Findlay (upstream, Hancock County) and the Village of Ottawa (downstream, Putnam County) both
# discharge to the SAME river — the Blanchard (Blanchard → Auglaize → Maumee → Lake Erie, HUC-8
# 04100008) — 34.32 river-miles apart (RM 56.42 vs RM 22.1, each cited to its own Ohio EPA fact
# sheet; #1422), under the SAME 2023 Maumee Watershed Nutrient TMDL and the SAME AEP Ohio / PJM AEP
# grid zone.
#
# ⚠️ REWRITTEN BY #1458. This artifact used to screen both plants against ONE shared DERIVED
# Blanchard 7Q10 (8.67 cfs, LP3 at USGS 04189000) and concluded that "downstream position confers
# essentially no assimilative advantage." That conclusion did not survive contact with the
# published record and has been REMOVED, not softened. Three findings killed it:
#
#   1. The shared gage sits BELOW the Findlay outfall. Screening the Findlay WPCC against USGS
#      04189000 put the plant's own effluent into its own denominator.
#   2. The shared gage is REGULATED — Straub 2001 records the Findlay Reservoir diversion and
#      low-flow augmentation at that station in its own REMARKS. It measures managed water.
#   3. Where the Blanchard is UNREGULATED, its published 7Q10 is 0.03 cfs (USGS 04188337,
#      WY2008-2020) and its Eagle Creek tributary's is 0. The 8.67 was never the river's own
#      low flow; the "+3.6% over 34 miles" cross-check that appeared to confirm it was two
#      REGULATED gages agreeing with each other.
#
# Both plants are now screened on their OWN issued fact sheets — the instrument that binds each
# permit — carried in `data/reference/hydrology/low-flow-7q10.yaml` under `permits:`.
#
# CURATED + cited, hand-reviewed — NOT regenerated by `watermark basin-network`. Screening-grade,
# NOT a permit determination: the binding wasteload allocation is in each plant's own fact sheet.
meta:
  subject: >-
    Findlay (upstream) vs Ottawa (downstream) on one river, each screened against ITS OWN cited
    at-outfall design low flow — and what the pair can and cannot show once they are.
  issues: >-
    #417 (this comparison); #414 (the derived Blanchard 7Q10, now demoted); #1422 (added both
    plants' regulatory denominators and the cited river-mile separation); #1458 (this rewrite —
    reconciled the derived and cited denominators and retired the shared-denominator finding).
  control_design: >-
    Watershed identity held CONSTANT (same Blanchard River, same TMDL, same grid zone, same
    regulator); discharge-point location + plant size VARIED (upstream Findlay 15 MGD vs downstream
    Ottawa 3 MGD, 34.32 river-miles apart). What is NOT held constant, and was wrongly assumed to
    be, is the DENOMINATOR: Ohio EPA computed each plant's design low flow at its own outfall, from
    different gages, over records that do not overlap.
  discipline: >-
    Each node is screened against the 7Q10 its own Ohio EPA fact sheet states AT ITS OWN OUTFALL.
    Design flows are the fact sheets' own average design flows (not ECHO's rounded design_flow_mgd,
    which is carried beside them for continuity). The dilution bands are a screening taxonomy, not
    an Ohio EPA determination. Effluent-fraction = discharge / 7Q10; dilution-ratio = 7Q10 /
    discharge.

# ─────────────────────────────────────────────────────────────────────────────────────────────
# THE DENOMINATORS. Three numbers have been used for "the Blanchard 7Q10" in this repo. They are
# not three estimates of one quantity — they are measurements of different things in different
# places over different decades. Carry all three. Never average them.
denominators:
  findlay_at_outfall:
    role: BINDING — the denominator this plant's permit limits were computed against
    seven_q10_cfs: 0.21
    location: Blanchard River, River Mile 56.42 (outfall 2PD00008001)
    basis: USGS gages 04188300 and 04189000 (the 30Q10 rows cite 04188300 alone)
    period: not stated in the fact sheet
    tag: verified
    citation: >-
      Ohio EPA, Fact Sheet for NPDES Permit Renewal, Findlay WPCC, 2024 (2PD00008*UD, PN 205259),
      Table 12 "Instream Conditions and Discharger Flow", printed p. 28 —
      data/documents/oepa/findlay/2PD00008.fs.pdf; structured read at
      data/extracted/oepa/findlay/2PD00008.fs.npdes.yaml.
  ottawa_at_outfall:
    role: BINDING — the denominator this plant's permit limits were computed against
    seven_q10_cfs: 7.78
    location: Blanchard River, River Mile 22.1 (outfall 2PD00028001)
    basis: USGS gauge 04189500 (Blanchard River at Glandorf), 1921-1951, drainage-adjusted
    period: 1921-1951
    tag: verified
    citation: >-
      Ohio EPA, Fact Sheet for NPDES Permit Renewal, Ottawa WWTP, 2024 (2PD00028*PD), Table 12
      (p. 28) and the acute dilution calculation (p. 11) — data/documents/oepa/ottawa/2PD00028.fs.pdf;
      structured read at data/extracted/oepa/ottawa/2PD00028.fs.npdes.yaml.
  derived_at_gage:
    role: >-
      RETIRED as a Blanchard screening denominator (#1458). Retained in
      low-flow-7q10.derived.yaml as the basin screen's fallback for any OTHER Blanchard discharger
      with no fact sheet of its own — at confidence `low`, carrying its own regulation caveat —
      because a demoted denominator that says why it is weak is more useful than a blank.
    seven_q10_cfs: 8.67
    location: USGS 04189000, Blanchard River near Findlay (DA 346 mi²)
    basis: LP3 over the NWIS daily record, 44 climatic years 1980-2024
    tag: derived
    disqualifying_defects:
      - >-
        CIRCULAR for Findlay: the gage is DOWNSTREAM of the Findlay WPCC outfall, so the flow it
        records already contains the discharge being screened. [inference] from two cited points —
        the outfall at 41.049722 / -83.667778 (Ohio EPA *VD public notice, discharge-location
        table, p. 1) and the gage at 41.05589 / -83.68799 (USGS NWIS site service; Straub 2001
        prints the same position as lat 41°03'21", long 83°41'17"). The Blanchard flows west here
        toward the Auglaize, so the gage — 2.0 mi west of Findlay per Straub — is below the plant.
      - >-
        REGULATED: "Water is diverted upstream from station into Findlay Reservoir. Storage in
        Findlay Reservoir used for water supply of city of Findlay, and is available for low-flow
        augmentation. All water returns to stream upstream from station." — Straub 2001, station
        04189000 REMARKS, verbatim. The low flow at this gage is a managed release.
      - >-
        NOT the published value at its own gage: USGS publishes 2.7 cfs there (Straub 2001,
        printed p. 358, record Oct 1923-Dec 1935 + Oct 1940-Sep 1997) — 3.2x lower. Much of that
        gap is RECORD PERIOD, not method, so this is not "the derivation was wrong"; it is that
        neither number is the regulator's, and only the regulator's binds.
  published_context:
    role: context only — never a denominator for either plant
    tag: reference
    citation: >-
      USGS SIR 2024-5075 (VonIns and Koltun, 2024, ver. 1.1), appendix 1 table 1.1 + table 1;
      bytes and traps in data/reference/usgs/low-flow/README.md. Straub 2001 as cited above.
    gages:
      - {gage: "04188337", name: Blanchard River below Mt. Blanchard, da_sq_mi: 141, seven_q10_cfs: 0.03,
         period: WY2008-2020, regulation: unregulated}
      - {gage: "04188496", name: Eagle Creek above Findlay, da_sq_mi: 51.0, seven_q10_cfs: 0.0,
         period: WY2008-2020, regulation: unregulated}
      - {gage: "04188300", name: Blanchard River at Mt. Blanchard, da_sq_mi: 109, seven_q10_cfs: 0.0,
         period: WY1970-1977 (partial record), regulation: unclassified}
      - {gage: "04189131", name: Blanchard River at Gilboa, da_sq_mi: 503, seven_q10_cfs: 11.5,
         period: WY2010-2020, regulation: regulated}
      - {gage: "04189260", name: Blanchard River at Ottawa, da_sq_mi: 628, seven_q10_cfs: 10.8,
         period: WY2010-2020, regulation: regulated}
    what_this_set_shows: >-
      Read by regulation status rather than by position, the Blanchard's published record splits
      cleanly: every UNREGULATED reading is 0 to 0.03 cfs, and every reading at or below Findlay
      (8.67 derived, 11.5 Gilboa, 10.8 Ottawa) is REGULATED. Note also that Gilboa (503 mi²) reads
      HIGHER than Ottawa (628 mi²) 20 miles downstream over the same WY2010-2020 window — low flow
      on this river does not track drainage area, which is what a managed system looks like.
      Supersedes the 8.98 cfs LP3 cross-check this artifact used to carry for gage 04189260: the
      published value there is 10.8 cfs, and it is published as regulated.

# ─────────────────────────────────────────────────────────────────────────────────────────────
# THE RULE THIS ARTIFACT EXISTS TO ENFORCE (#1458).
comparison_discipline:
  never_mix_at_gage_and_at_outfall: >-
    A downstream-position comparison must not put an at-GAGE statistic beside an at-OUTFALL one.
    They answer different questions: the gage integrates everything above it (including, here, an
    augmentation release and the discharge under test), while the regulator's value is computed at
    the pipe. The old "2.68x at Findlay vs 0.54x at Ottawa" pair did exactly this and read as a
    5.0x plant-size effect, which was arithmetic on a denominator that cancels rather than a
    measurement.
  and_do_not_treat_two_at_outfall_values_as_a_profile: >-
    The weaker trap, and the one this pair still contains. Findlay's 0.21 cfs and Ottawa's 7.78
    cfs are BOTH at-outfall and both binding — but they were computed from different gages
    (04188300+04189000 vs 04189500) over records that do not overlap (1970-77 / 1923-97 vs
    1921-51). Their 37x ratio is therefore NOT a measurement of how much low flow the Blanchard
    gains over 34.32 river-miles. The direction is physically sensible; the magnitude is not
    attributable, and the published modern gages (above) do not support a clean
    drainage-area progression on this river at all.
  what_to_do_instead: >-
    Compare each plant to ITS OWN cited denominator, report the two screens side by side, and say
    plainly that the reach-to-reach difference is not decomposable into position vs method with
    the instruments on the record. Closing that gap needs one consistently-computed statistic at
    both outfalls — an [open] ask, not something this artifact can derive.

# Screening bands (watermark.hydrology.models._lowflow): dilution-ratio = 7Q10 / discharge.
dilution_bands:
  violation: "< 1.0 — effluent >= the entire 7Q10 low flow (effectively undiluted at design low flow)"
  tight: "1.0 to 10.0"
  ok: ">= 10.0"

comparison:
  - node: findlay
    position: upstream
    discharger: City of Findlay Water Pollution Control Center (WPCC)
    npdes: OH0025135
    permit: 2PD00008*UD
    river_mile: 56.42
    seven_q10_cfs: 0.21              # cited, at this outfall
    design_flow_mgd: 15.0            # fact sheet, average design flow (ECHO agrees: 15.0)
    design_flow_cfs: 23.208          # fact sheet Table 12, "Findlay WPCC flow"
    effluent_fraction_of_7q10: 110.5 # 23.208 / 0.21
    dilution_ratio: 0.009            # 0.21 / 23.208
    acute_dilution_ratio: 1.0        # fact sheet p. 13: (0.17 + 23.2) / 23.2
    flag: violation
    detail: >-
      At design low flow the Blanchard below RM 56.42 IS the effluent. The plant's 23.208 cfs is
      110x the river's cited 7Q10, and Ohio EPA does not merely imply this — it computes the acute
      dilution ratio as 1.0 outright, and sets the acute WLA at "30 percent mortality in 100
      percent effluent." The mercury variance is the same fact viewed from the limits side: the
      modified allowable AMBIENT concentration (3.29 ng/L) and the allowed EFFLUENT concentration
      (3.3 ng/L) converge, because there is no dilution between them.
  - node: ottawa
    position: downstream (34.32 river-miles below Findlay — RM 22.1 vs RM 56.42, both cited)
    discharger: Village of Ottawa Wastewater Treatment Plant (WWTP)
    npdes: OH0026921
    permit: 2PD00028*PD
    river_mile: 22.1
    seven_q10_cfs: 7.78              # cited, at this outfall
    design_flow_mgd: 3.0             # ECHO design_flow_mgd
    design_flow_cfs: 4.6417          # fact sheet Table 12, discharger flow
    effluent_fraction_of_7q10: 0.60  # 4.6417 / 7.78
    dilution_ratio: 1.68             # 7.78 / 4.6417
    acute_dilution_ratio: 2.2        # fact sheet p. 11
    flag: tight
    detail: >-
      Tight but diluted — below the 10:1 ok band, above the 1:1 violation band. Ottawa screened
      TIGHT on the retired derived denominator too (1.87:1), so no finding about this node turns
      on the reconciliation. Recording that is the point of having done it: it shows where the
      choice of denominator mattered (Findlay, by four orders of magnitude in the ratio) and where
      it did not.

screen_status_note: >-
    Only Findlay is screened in the computed basin-network.yaml. Ottawa is reported
    `no_receiving_water` there because EPA ECHO still carries no receiving water for OH0026921 —
    the ECHO curation overlay (data/reference/echo/curation/) has an entry for OH0025135 (#352,
    via #1698) and none yet for OH0026921. The values above are the plant's own fact sheet and are
    committed regardless; wiring them into the computed screen is an [open] item for the Ottawa
    site's own thread (#1420/#1422), deliberately not done here — it needs a live ECHO re-pull.

finding: >
  The control still isolates what it was built to isolate — position and plant size against a
  fixed watershed, regulator and nutrient cap — and the headline lesson survives INTACT and gets
  sharper: the receiving water, not the plant, decides. Findlay's 15 MGD lands in the violation
  band by a factor of 110; Ottawa's 3 MGD, five times smaller and 34 miles down the same river,
  lands in the tight band. What did NOT survive is the quantitative claim built on the shared
  derived denominator — that downstream position confers essentially no assimilative advantage,
  and that the whole difference between the two plants collapses to the 5.0x design-flow ratio.
  Both were artifacts of screening two plants against a single number that was neither of their
  regulators' and, at the upstream node, partly consisted of the upstream plant's own discharge.
  On the instruments, the two reaches differ by 37x in their binding denominator — and because
  those two numbers come from different gages over non-overlapping records, the honest statement
  is that we cannot decompose that 37x into position versus method. The second, harder finding is
  about the river rather than the plants: where the Blanchard is unregulated it publishes a 7Q10
  of 0 to 0.03 cfs, so the dilution both these plants are credited with at their outfalls is not
  the river's own capacity — it is stored water released from Findlay Reservoir plus effluent.
  A low-flow denominator that is itself a discharge is the finding this pair now carries.
