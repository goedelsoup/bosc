meta:
  subject: Industrial toxic water dischargers vs chemical-specific Ohio WQS criteria
  source: EPA RSEI (per-chemical water-media releases) x EPA ECHO (receiving water)
    x Ohio EPA cited design low flows (data/reference/hydrology/low-flow-7q10.yaml)
    x Ohio WQS criteria (data/reference/wqs/ohio-water-quality-criteria.yaml)
  criteria_source: Ohio Administrative Code Chapter 3745-1 — Ohio Water Quality Standards
  county_fips: '39003'
  county_name: Allen County, OH
  water_releaser_count: 13
  critical_count: 5
  exceeding_chemical_count: 24
  design_flows:
    acute_cmc: 1Q10
    chronic_ccc: 7Q10
    human_health: harmonic mean
  hardness_assumption_mg_l: 100
  ammonia_condition: pH 8.0, 25 C, March-November (growing season)
  caveats:
  - Each water chemical's derived concentration is screened against its OWN Ohio criterion
    (acute CMC at 1Q10, chronic CCC at 7Q10, human health at harmonic mean) — not
    a flat aggregate band. A chemical with no committed Ohio criterion is reported
    'no_criterion' (omitted, never guessed).
  - Receiving water is ECHO-cited where available, else inferred from the Ottawa River
    industrial corridor coordinate cluster (tagged assumption).
  - 'Derived concentrations are order-of-magnitude: annual reported water pounds,
    fully mixed at the design flow, no decay or mixing-zone credit — a screen, not
    a permit wasteload allocation. Exceedance flags the need for a WQBEL determination.'
  - Metals criteria are evaluated at a stated reference hardness (100 mg/L CaCO3);
    ammonia at a stated pH/temperature; chromium screened conservatively as Cr(VI).
    See data/reference/wqs/ for the re-derivable assumptions.
  - RSEI Score is EPA's modeled, population-weighted Risk-Screening Score (unitless,
    comparative only); the aggregate screening_concentration is coarse context only.
