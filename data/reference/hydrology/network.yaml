# Routed low-flow stream network for the Lima municipal water loop.
#
# This is the TOPOLOGY only — a directed graph of stream junctions and the node
# each one drains into. It carries NO flow magnitudes: every flow term is read by
# the solver (watermark.hydrology.network) from an already-grounded source, so the graph
# never fabricates a number.
#
#   low_flow:        inject the receiving water's 7Q10 as a gain — cited (low-flow-7q10.yaml)
#                    where Ohio EPA has fact-sheeted it, else the DERIVED basin-screen proxy
#                    (low-flow-7q10.derived.yaml, watermark.hydrology.basin) — cited overrides
#                    derived on a name collision, never the reverse.
#   balance_return:  add that WaterBalance node's document-cited discharge as a gain
#   consumptive:     remove the scenario's cooling consumptive draw as a loss
#
# What the graph DOES assert is structure: which stream each WWTP discharges to
# (from routing.yaml, status:confirmed, OEPA fact-sheet-cited) and that Dug Run and
# Pike Run are Ottawa River (Lima area) tributaries (Ottawa River Watershed (Lima
# Area) TMDL, US EPA-approved 2014-04-15 — see ottawa-lima-tmdl.yaml, which states
# American-Bath / American No.2 "discharge to Pike Run / Dug Run"). The ONLY modeling
# choice is the relative ORDER in which confluences meet the mainstem; because the
# loop's discharges all drain to the Ottawa above the outlet, the order does not
# change the order-invariant SYSTEM totals (natural low flow, effluent, net) the
# headline rests on — it affects only the per-reach screening values.
#
# Datum note: the cited Ottawa 7Q10 (0.2 cfs) is the design low flow measured AT the
# Lima gage (USGS 04187100), already net of the historical upstream abstraction for
# Lima's water supply. It is injected as the receiving-reach low flow. The Ottawa at
# Lima receives two effluent gains here: the City of Lima WWTP's own municipal design
# discharge (18.5 MGD, node lima-wwtp — the major municipal plant, OEPA 2PE00000 /
# OH0026069, outfall 2PE00000001 -> Ottawa River RM 37.6, #1536) and, additively, the
# campus FM-2 industrial discharge (2.5 MGD, node bosc-fm2-return), which is piped to
# the same Lima WWTP via the City's 78" sewer. The 18.5 MGD is the plant's current
# permitted baseline; the FM-2 is the campus's new incremental load — the two are
# modeled as baseline-plus-increment, not a double count.
#
# Separately, the campus STORMWATER (not the FM-2 process discharge above) leaves the
# site via a constructed BOSC Storm Outfall channel that discharges to Pike Run — per the
# roundabout/outfall SWP3 (eDoc 4091286, extracted/plans/4091286.engineering.yaml;
# Igel/WSP, 2026-04-16). No cited storm low-flow magnitude exists, so this pathway is NOT
# added as a routed node — it is recorded as topology context only: the campus's
# stormwater receiving water is Pike Run (7Q10 0.03 cfs), the loop's most flow-starved
# tributary.
#
# The outlet (#1488) — the Auglaize confluence, not a bare label. The Ottawa's receiving
# water below Lima is the Auglaize River (network.yaml historically asserted this in prose
# only: `outlet.downstream: null` with no flow term, so the routed table just repeated the
# Lima-gage totals). The outlet node now carries its OWN low_flow: a DERIVED estimate of the
# Auglaize's own flow AT the confluence (low-flow-7q10.derived.yaml key "auglaize river at
# ottawa confluence"), injected here as the receiving water's own base flow, so
# `natural_total_cfs`/`outlet_cfs` correctly credit its dilution instead of silently omitting
# it. This is a drainage-area-ratio TRANSFER, not the raw USGS 04186500 (Fort Jennings) gage
# value: that gage sits a few miles BELOW the real confluence, so its own 44-yr LP3 7Q10
# (1.91 cfs) already reflects the Ottawa's historical contribution — using it directly here
# would double-count the Ottawa (already separately routed through the loop above). The
# transfer nets out the Ottawa's own drainage area (USGS 04187100 at Lima) from the Fort
# Jennings total before scaling, landing on 1.17 cfs — see the derived-file citation for the
# full method and its residual (over-)estimate caveat. `watermark.hydrology.network.network_findings`
# screens the arriving (Ottawa) flow against this base with the same `dilution_flag` band used
# for the per-plant checks. Only the SUPPLY side (water-supply.yaml / refill.py) treats the
# Auglaize as a first-class input today (two of Lima's five reservoirs are Auglaize-fed); this
# is the mirror on the discharge side — the two models are not in tension, they cover different
# halves of the loop (refill.py: what fills the reservoirs; here: what the effluent-laden Ottawa
# drains into).
#
# IMPORTANT — the cooling draw here is an UNBUFFERED WORST-CASE BOUND, not the operating
# reality. Lima does NOT withdraw at the 7Q10: its supply is five upground (off-stream)
# reservoirs (~15 BG) filled by pumping from the Auglaize + Ottawa at HIGH flow (see
# water-supply.yaml). The data center draws TREATED municipal water from that storage, so
# the realistic low-flow constraint is reservoir DRAWDOWN (the supply water-budget,
# `bosc supply` / watermark.hydrology.supply), not instantaneous Ottawa depletion. The
# `lima-abstraction` consumptive draw below answers only the hypothetical "if the campus
# load were pumped straight from the Ottawa at design low flow" — a bound the supply
# budget supersedes. Run the receiving network at consumptive_cfs=0 for the real picture.

meta:
  subject: Routed low-flow stream network — Lima municipal loop
  source: routing.yaml (WWTP -> stream, OEPA-cited) + ottawa-lima-tmdl.yaml (tributary structure)
  tier: tier0
  caveats:
    - "Topology is cited; only confluence ORDER is a screening assumption."
    - "System totals (Σ natural, Σ effluent, net) are order-invariant; per-reach values are screening."
    - "Lima WWTP's OWN municipal design flow (18.5 MGD; OEPA 2PE00000 / OH0026069, outfall 2PE00000001 -> Ottawa River RM 37.6) is now COUNTED as the lima-wwtp node (#1536), additive to the separately-routed campus FM-2. The effluent share no longer omits the major municipal discharge; it remains conservative only in that WWTP inputs are permitted DESIGN flows, not metered actuals (ECHO DMRs show the Lima plant's actual mean ~13.1 MGD, 70.6% of design)."

nodes:
  # --- Ottawa mainstem: headwater -> abstraction/cooling draw -> Lima reach ---
  - id: ottawa-head
    name: Ottawa River upstream of Lima
    kind: headwater
    receiving_water: Ottawa River
    low_flow: Ottawa River
    downstream: lima-abstraction
    status: confirmed
    citation: "Cited Ottawa River 7Q10 0.2 cfs at USGS 04187100 (low-flow-7q10.yaml)"

  - id: lima-abstraction
    name: Lima supply abstraction reach (cooling draw — unbuffered bound)
    kind: abstraction
    consumptive: true
    downstream: lima-reach
    receiving_water: Ottawa River
    status: confirmed
    citation: "UNBUFFERED worst-case: campus cooling load as if pumped from the Ottawa at 7Q10. Real constraint is reservoir drawdown (water-supply.yaml; `bosc supply`)."

  # --- Dug Run tributary: headwater + American II outfall -> confluence -> Ottawa ---
  - id: dug-run-head
    name: Dug Run (headwater)
    kind: headwater
    receiving_water: Dug Run
    low_flow: Dug Run
    downstream: dug-run-confluence
    status: confirmed
    citation: "Cited Dug Run 7Q10 0.78 cfs (low-flow-7q10.yaml; OEPA 2PH00006)"

  - id: american-ii
    name: American II WWTP outfall
    kind: outfall
    receiving_water: Dug Run
    balance_return: watch-american-ii-wwtp
    downstream: dug-run-confluence
    status: confirmed
    citation: "OEPA NPDES 2PH00006 — American II WWTP discharges to Dug Run (routing.yaml)"

  - id: dug-run-confluence
    name: Dug Run -> Ottawa River
    kind: confluence
    receiving_water: Ottawa River
    downstream: lima-reach
    status: confirmed
    citation: "Dug Run is an Ottawa River (Lima area) tributary (ottawa-lima-tmdl.yaml)"

  # --- Pike Run tributary: headwater + American Bath outfall -> confluence -> Ottawa ---
  - id: pike-run-head
    name: Pike Run (headwater)
    kind: headwater
    receiving_water: Pike Run
    low_flow: Pike Run
    downstream: pike-run-confluence
    status: confirmed
    citation: "Cited Pike Run 7Q10 0.03 cfs (low-flow-7q10.yaml; OEPA 2PH00007)"

  - id: american-bath
    name: American Bath WWTP outfall
    kind: outfall
    receiving_water: Pike Run
    balance_return: watch-american-bath-wwtp
    downstream: pike-run-confluence
    status: confirmed
    citation: "OEPA NPDES 2PH00007 — American Bath WWTP discharges to Pike Run (routing.yaml)"

  - id: pike-run-confluence
    name: Pike Run -> Ottawa River
    kind: confluence
    receiving_water: Ottawa River
    downstream: lima-reach
    status: confirmed
    citation: "Pike Run is an Ottawa River (Lima area) tributary (ottawa-lima-tmdl.yaml)"

  # --- Direct Ottawa-mainstem discharges into the Lima assimilative reach ---
  - id: shawnee-ii
    name: Shawnee II WWTP outfall
    kind: outfall
    receiving_water: Ottawa River
    balance_return: watch-shawnee-ii-wwtp
    downstream: lima-reach
    status: confirmed
    citation: "OEPA NPDES 2PK00002 — Shawnee II WWTP discharges to Ottawa River (routing.yaml)"

  - id: lima-wwtp
    name: City of Lima WWTP outfall (municipal effluent)
    kind: outfall
    receiving_water: Ottawa River
    balance_return: watch-lima-wwtp
    downstream: lima-reach
    status: confirmed
    citation: >-
      OEPA NPDES 2PE00000 (application OH0026069) — City of Lima WWTP, outfall
      2PE00000001 -> Ottawa River at River Mile 37.6; 18.5 MGD average design flow
      (70 MGD peak wet-weather), data/extracted/oepa/2PE00000.npdes.yaml. The
      municipal receiving plant's OWN discharge — previously uncounted (#1536). It
      is ADDITIVE to the separately-routed campus FM-2 (bosc-fm2-return): the 18.5
      MGD is the plant's current permitted municipal design, the FM-2 (2.5 MGD) is
      the campus's new incremental load piped to the same plant — so the two nodes
      are the plant's own baseline plus the campus increment, not a double count.

  - id: bosc-fm2-return
    name: BOSC FM-2 industrial discharge (via Lima sewer + Lima WWTP)
    kind: outfall
    receiving_water: Ottawa River
    balance_return: bosc-campus
    downstream: lima-reach
    status: confirmed
    citation: "bosc-fm2 -> City of Lima 78\" sewer -> Lima WWTP -> Ottawa River (routing.yaml; sanitary-basis.yaml). The campus increment ON TOP of the Lima WWTP municipal design flow (lima-wwtp node)."

  # --- The assimilative reach (gage) and the outlet to the Auglaize/Maumee ---
  - id: lima-reach
    name: Ottawa River at Lima (assimilative reach / USGS 04187100)
    kind: gage
    receiving_water: Ottawa River
    downstream: outlet
    status: confirmed
    citation: "USGS gage 04187100, Ottawa River at Lima — the assimilative reach"

  - id: outlet
    name: Ottawa River -> Auglaize confluence -> Maumee
    kind: outlet
    receiving_water: Auglaize River
    low_flow: Auglaize River at Ottawa confluence
    downstream: null
    status: confirmed
    citation: >-
      Ottawa flows to the Auglaize and on to the Maumee (maumee-tmdl reference; USGS NHD).
      DERIVED Auglaize-at-confluence 7Q10 1.17 cfs injected here as the receiving water's own
      base flow [inference: derived] — a drainage-area-ratio TRANSFER off USGS 04186500 (Fort
      Jennings, 1.91 cfs raw), not the raw gage value itself (see
      low-flow-7q10.derived.yaml's "auglaize river at ottawa confluence" entry for the full
      method: the raw gage sits below the confluence and already carries the Ottawa's own
      historical contribution, so the raw value is netted for that before use here). Not a
      cited Ohio EPA fact-sheet 7Q10 like the loop's own three streams above.
