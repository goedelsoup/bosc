meta:
  subject: Refill adequacy / drought storage requirement — Lima reservoir system
  source: 'USGS NWIS daily discharge: Auglaize 04186500 (Fort Jennings) + Ottawa 04187100 (Lima); storage
    from water-supply.yaml'
  method: sequent-peak (Rippl) storage requirement on aligned daily NWIS discharge, passby-adjusted, net
    of a first-order reservoir-evaporation sink (ET0 x surface area)
  discipline: 'Derived screening: sequent-peak storage requirement vs committed reservoir storage. Refill
    is amply adequate in normal years; the binding case is the worst gauged drought, and the residual
    risk is a drought beyond the record.'
refill:
  tier: tier0
  period_start: '1988-09-30'
  period_end: '2024-12-31'
  aligned_days: 9734
  storage_capacity_mg: 14413.0
  combined_mean_cfs: 451.3
  annual_demand_mg: 6906.0
  annual_supply_multiple: 15.4
  rivers:
  - site_no: 04186500
    site_name: Auglaize River near Fort Jennings OH
    river: Auglaize River
    period_start: '1980-01-01'
    period_end: '2024-12-31'
    record_days: 16437
    mean_cfs: 330.5
    median_cfs: 81.4
    min_cfs: 0.5
    p90_cfs: 11.1
    p95_cfs: 6.7
    p99_cfs: 2.5
    passby_cfs: 2.5
    pct_days_below_demand: 25.8
    note: gauged at Fort Jennings, DOWNSTREAM of Lima's Auglaize intakes with more drainage area — overstates
      the flow at the intake (optimistic refill)
  - site_no: 04187100
    site_name: Ottawa River at Lima OH
    river: Ottawa River
    period_start: '1988-09-30'
    period_end: '2024-12-31'
    record_days: 9734
    mean_cfs: 123.2
    median_cfs: 23.0
    min_cfs: 0.0
    p90_cfs: 3.6
    p95_cfs: 2.2
    p99_cfs: 0.15
    passby_cfs: 0.2
    pct_days_below_demand: 55.3
    note: net of Lima's upstream Ottawa intakes; reaches 0 cfs in drought
  scenarios:
  - label: baseline city
    demand_mgd: 15.0
    required_storage_mg: 3507.5
    pct_of_capacity: 24.3
    worst_spell_start: '1999-07-05'
    worst_spell_days: 251
    survives: true
  - label: +campus (central)
    demand_mgd: 18.92
    required_storage_mg: 4629.6
    pct_of_capacity: 32.1
    worst_spell_start: '1999-07-05'
    worst_spell_days: 310
    survives: true
  - label: +campus (high bound)
    demand_mgd: 27.5
    required_storage_mg: 7696.2
    pct_of_capacity: 53.4
    worst_spell_start: '1999-06-22'
    worst_spell_days: 337
    survives: true
  evaporation:
    source: derived
    surface_area_acres: 1603.0
    et0_method: FAO-56 Penman-Monteith
    et0_annual_mm: 1085.2
    open_water_coefficient: 1.0
    monthly_evap_mgd:
      JAN: 1.5098
      FEB: 2.2141
      MAR: 3.7016
      APR: 5.0966
      MAY: 6.4538
      JUN: 8.3355
      JUL: 8.8479
      AUG: 7.9088
      SEP: 6.8617
      OCT: 5.2508
      NOV: 3.0487
      DEC: 1.7309
    annual_evap_mg: 1859.8
    mean_evap_mgd: 5.095
    peak_month: JUL
    peak_evap_mgd: 8.8479
    citation: ET0 FAO-56 Penman-Monteith (NASA POWER climatology) over 1603 ac of committed reservoir
      surface area (water-supply.yaml)
    note: first-order screening sink; ET0 used directly as the open-water rate and precipitation onto
      the pool not credited (conservative)
  method: sequent-peak (Rippl) storage requirement on aligned daily NWIS discharge, passby-adjusted, net
    of a first-order reservoir-evaporation sink (ET0 x surface area)
  warnings: []
  caveats:
  - Auglaize River gauged at Fort Jennings, DOWNSTREAM of Lima's Auglaize intakes with more drainage area
    — overstates the flow at the intake (optimistic refill); the storage requirement is therefore an UNDER-estimate
    (optimistic).
  - Pure sequent-peak captures all surplus above passby (no pump-rate cap) — also optimistic; a real pump-capacity
    limit would raise the storage requirement.
  - Passby flows are screening assumptions (Ottawa River 0.2 cfs; Auglaize River 2.5 cfs).
  - 'A first-order reservoir-evaporation sink IS subtracted: FAO-56 ET0 over the 1603-acre committed pool
    surface (~5.095 MGD mean, 8.8479 MGD in JUL), folded in monthly `[derived]`. ET0 is used directly
    as the open-water rate and rain onto the pool is not credited, so the sink is a conservative lower
    bound on the true evaporative loss.'
  - The binding drought is the worst in the GAUGED record — a longer/deeper drought than the 1988-2024
    record would call on more storage than shown.
