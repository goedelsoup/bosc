meta:
  subject: >-
    Curated major-network mainstem USGS gages (and synthesized headwaters confluences)
    that anchor the basin-wide assimilative low-flow screen (watermark.hydrology.basin).
  source: >-
    Each gage is verified to return a multi-decade daily-discharge record from USGS NWIS.
    The lower/mouth-ward mainstem gage is chosen (the Maumee-at-Waterville convention):
    one medium-confidence screening proxy per mainstem, applied basin-wide by ECHO
    receiving-water name. This is the input table the derived 7Q10s are computed from
    (watermark derive-low-flows -> low-flow-7q10.derived.yaml), NOT a derived output.
  discipline: >-
    aliases are the exact ECHO receiving_water surface forms (lowercased, comma-split)
    that mean a DIRECT discharge to this mainstem — not a tributary "via"/"to" it. The
    derived table is a single shared file keyed by receiving-water name across basins;
    names don't collide between the Maumee and Great Miami, so one merged lookup is safe.
    A gage with <20 climatic years or a non-positive/NaN 7Q10 is omitted at derivation
    (never a committed unreliable denominator).
  cited_annotations: >-
    A gage entry may carry three OPTIONAL cited blocks (#1458), copied verbatim into the emitted
    low-flow-7q10.derived.yaml entry by `watermark derive-low-flows` so a screening denominator is
    never published without them: `published` (a third party's own low-flow statistic AT THIS GAGE,
    the counterweight to our LP3 fit — carried beside it, never substituted for it, because the
    record periods differ), `regulation` (a CITED third-party judgment that the gage's low flow is
    anthropogenically altered; `status: regulated` demotes the derived entry to confidence `low`,
    which is the one thing a reference-table edit here changes about the screen), and
    `cross_check_gages` (neighbouring published gages, context only — never a denominator, never
    matched by any alias). Author none of them from reasoning: each carries the instrument that
    says it, and `regulation.remark` quotes that instrument verbatim where it has words.
  cited_annotations_gap: >-
    [open] Only the Blanchard entry is annotated so far — that is the gage #1458 was opened about.
    USGS SIR 2024-5075 table 1 publishes a Regulated/Unregulated classification for most of the
    other gages in this table (e.g. it calls Mad River near Urbana 03267000, Greenville Creek
    03264000, Stillwater 03265000, Maumee near Defiance 04192500 and Ottawa River at Lima 04187100
    all "Regulated"), so the network-wide sweep is a mechanical read of one committed CSV — it is
    deliberately NOT done here because demoting those denominators' confidence moves other sites'
    committed artifacts and belongs in its own reviewed change. An UNANNOTATED gage means "not yet
    read against the published record", never "unregulated".

# Curated major network mainstems with a long-record USGS gage, grouped by basin.
mainstems:
  # --- Maumee basin (subregion 0410, Western Lake Erie) -----------------------
  Maumee River:
    gage: "04193500"
    aliases: [maumee river]
  Auglaize River:
    gage: "04186500"
    aliases: [auglaize river, auglaze river]
  Blanchard River:
    gage: "04189000"
    aliases: [blanchard river, blanchard r]
    note: >-
      Blanchard River (Auglaize subtree, HUC-8 04100008) — the network's only along-one-river
      pair, Findlay (upstream) + Ottawa (downstream), both discharge here (#414/#417). The only
      long-record daily-discharge gage on the Blanchard is near Findlay (04189000, DA 346 mi²,
      44 climatic yr). The at-Ottawa gage (04189260) has ~14 yr — below the 20-yr floor, so it is
      omitted here (carried as a cross-check below); the at-Glandorf gage (04189500) has no
      daily-discharge record in the modern window. So this one gage is the only derivable Blanchard
      denominator. ⚠️ READ `regulation` AND `cross_check_gages` BEFORE USING IT (#1458). This gage
      is regulated AND sits BELOW the Findlay WPCC's own outfall, so its low flow is neither natural
      nor independent of the discharge it was being used to screen; the unregulated Blanchard and
      Eagle Creek gages publish 7Q10s of 0-0.03 cfs, and Ohio EPA's own design low flow at the
      Findlay outfall is 0.21 cfs. The old reading of the 14-yr Ottawa gage — "the low flow barely
      grows over the reach, so one shared denominator is basin-representative" — was an artifact of
      comparing two REGULATED gages to each other and does not survive; both plants are now screened
      on their own fact-sheet denominators (low-flow-7q10.yaml, `permits:`).
    published:
      # USGS's own published statistic AT THIS GAGE — the counterweight to the LP3 fit. Note the
      # period: it ends 27 years before the derived window's end, so the 3.2x gap between 2.7 and
      # 8.67 is at least as much RECORD PERIOD as method. Never present one as correcting the other.
      seven_q10_cfs: 2.7
      one_q10_cfs: 2.1
      thirty_q10_cfs: 3.9
      ninety_q10_cfs: 6.1
      harmonic_mean_cfs: 23.1
      drainage_area_sq_mi: 346
      period: October 1923 to December 1935, October 1940 to September 1997
      citation: >-
        Straub, D.E., 2001, Low-Flow Characteristics of Streams in Ohio through Water Year 1997:
        USGS Water-Resources Investigations Report 01-4140, printed p. 358, station "04189000
        Blanchard River near Findlay, Ohio" — annual (Apr.-Mar.) magnitude-and-frequency table,
        10-yr recurrence column (1-day 2.1, 7-day 2.7, 30-day 3.9, 90-day 6.1) and SELECTED
        STREAMFLOW CHARACTERISTICS (harmonic mean 23.1 ft3/s; average 258 ft3/s over 69 years;
        minimum daily 0.4 ft3/s). Bytes: data/reference/usgs/low-flow/wri20014140.pdf.
    regulation:
      status: regulated
      remark: >-
        Water is diverted upstream from station into Findlay Reservoir. Storage in Findlay
        Reservoir used for water supply of city of Findlay, and is available for low-flow
        augmentation. All water returns to stream upstream from station.
      citation: >-
        Straub 2001 (above), station 04189000, REMARKS — quoted verbatim in `remark`. Corroborated
        for the reach as a whole by USGS SIR 2024-5075 table 1, which classifies both downstream
        Blanchard gages (04189131 Gilboa, 04189260 Ottawa) as "Regulated" — its listed causes of
        that classification include "known diversions" and "wastewater treatment plant discharges".
        ⚠️ SIR 2024-5075 does NOT classify 04189000: that gage is absent from its table 1, its
        table 1.1 and its table 2.1 despite a continuous NWIS daily record since 1923, and the
        report states no reason ([open]). The absence is NOT itself evidence of regulation —
        regulated gages ARE listed there with full statistics — so this classification rests on
        Straub's REMARKS, which state it outright.
    cross_check_gages:
      # Context only — never a denominator. Read top to bottom this is the finding: where the
      # Blanchard is UNREGULATED its published 7Q10 is 0 to 0.03 cfs, and every value at or below
      # Findlay (8.67 derived, 11.5, 10.8) is REGULATED flow — augmentation release plus effluent.
      - gage: "04188300"
        gage_name: Blanchard River at Mt. Blanchard, Ohio
        seven_q10_cfs: 0.0
        drainage_area_sq_mi: 109
        period: low-flow measurements, water years 1970-1977 (partial-record station)
        citation: >-
          Straub 2001, printed p. 356 — annual (Apr.-Mar.) 7-day: 2-yr 0.2, 10-yr 0, 20-yr 0;
          minimum observed streamflow 0 ft3/s September 1970.
        note: >-
          One of the TWO gages Ohio EPA's Findlay fact sheet names as the basis for its design low
          flows (Table 12: "USGS Gages 04188300 and 04189000"; the 30Q10 rows cite 04188300 alone).
          It is upstream of Findlay, upstream of the reservoir return, and its own published 7Q10 is
          ZERO — which is why the regulator's at-outfall number is 0.21 cfs and not 8.67.
      - gage: "04188337"
        gage_name: Blanchard River below Mt. Blanchard OH
        seven_q10_cfs: 0.03
        drainage_area_sq_mi: 141
        period: water years 2008-2020
        regulation: unregulated
        citation: >-
          USGS SIR 2024-5075 appendix 1 table 1.1 (sir20245075_app1_table1.1.csv), station
          04188337, April-March 7-day 10-year — 1-day 0.02, 7-day 0.03, 30-day 0.35, 90-day 1.3;
          harmonic mean 2.99 ft3/s. Regulation status from that report's table 1.
        note: >-
          The load-bearing cross-check: a MODERN (WY2008-2020), continuous, published, and
          third-party-classified UNREGULATED Blanchard gage reads 0.03 cfs. So the 8.67 cfs derived
          40 mi downstream over an overlapping window is not the same river measured better — it is
          a different, managed quantity.
      - gage: "04188496"
        gage_name: Eagle Creek above Findlay OH
        seven_q10_cfs: 0.0
        drainage_area_sq_mi: 51.0
        period: water years 2008-2020
        regulation: unregulated
        citation: >-
          USGS SIR 2024-5075 appendix 1 table 1.1, station 04188496, April-March 7-day 10-year = 0
          (2-yr 0.19); harmonic mean 0.44 ft3/s. Regulation status from that report's table 1.
        note: >-
          Eagle Creek joins the Blanchard between the Findlay outfall and gage 04189000 (Straub
          places the gage "3.0 mi downstream from Eagle Creek"). Its 7Q10 is ZERO, so the tributary
          explains none of the 41x gap between the at-outfall and at-gage denominators.
      - gage: "04188500"
        gage_name: Eagle Creek near Findlay, Ohio
        seven_q10_cfs: 0.0
        drainage_area_sq_mi: 55.0
        period: January 1947 to July 1957
        citation: >-
          Straub 2001, printed p. 357 — every annual and seasonal 7-day recurrence 0 ft3/s;
          minimum daily 0 ft3/s (occurred in 8 years); 4.3 mi upstream from mouth.
        note: >-
          The historical record agrees with the modern one — this tributary stops at low flow.
      - gage: "04189131"
        gage_name: Blanchard River at Gilboa OH
        seven_q10_cfs: 11.5
        drainage_area_sq_mi: 503
        period: water years 2010-2020
        regulation: regulated
        citation: >-
          USGS SIR 2024-5075 appendix 1 table 1.1, station 04189131, April-March 7-day 10-year
          (1-day 9.96, 30-day 16.1, 90-day 23.9; harmonic mean 73.0 ft3/s). Regulation status
          "Regulated" from that report's table 1.
      - gage: "04189260"
        gage_name: Blanchard River at Ottawa OH
        seven_q10_cfs: 10.8
        drainage_area_sq_mi: 628
        period: water years 2010-2020
        regulation: regulated
        citation: >-
          USGS SIR 2024-5075 appendix 1 table 1.1, station 04189260, April-March 7-day 10-year
          (1-day 5.27, 30-day 16.6, 90-day 27.8; harmonic mean 84.6 ft3/s). Regulation status
          "Regulated" from that report's table 1.
        note: >-
          Supersedes the 8.98 cfs LP3 cross-check the Findlay↔Ottawa comparison used to carry for
          this gage: 10.8 cfs is the PUBLISHED value, and it is published as regulated flow.
          Downstream of Gilboa yet slightly LOWER than it — another sign these are managed
          releases, not a drainage-area progression.
  Maumee River near Defiance:
    gage: "04192500"
    aliases: [maumee river near defiance, maumee r near defiance]
    note: >-
      Defiance reach (#391). The basin-wide "MAUMEE RIVER" ECHO screen proxy is the mouth-ward
      Waterville gage (04193500, DA 6330 mi²) — but it sits ~50 river-miles DOWNSTREAM of the
      Defiance WWTP outfall (OH0024899), so it is the wrong denominator for the actual discharge
      reach. The honest at-reach mainstem denominator is the Maumee-near-Defiance gage (04192500,
      DA 5545 mi²): it sits just EAST/downstream of the city and — per NWIS drainage areas — ALREADY
      INCLUDES the Auglaize (its 5545 mi² > Waterville's 6330 minus the Tiffin), so it is the
      mainstem BELOW the Auglaize confluence, not above it. No confluence SUM is synthesized here
      (that would double-count the Auglaize, unlike the ungaged Fort Wayne junction). Counter-
      intuitively the near-Defiance 7Q10 comes out HIGHER than Waterville's, so the reach-specific
      dilution is slightly LOOSER, not tighter — the honest number regardless (see ONBOARDING.md).
      Non-colliding aliases only: a bare "maumee river" would capture ECHO's basin-wide receiving
      water (already aliased to the Waterville proxy above).
  Auglaize River near Defiance:
    gage: "04191500"
    aliases: [auglaize river near defiance, auglaize r near defiance]
    note: >-
      The Auglaize-near-Defiance gage (04191500, DA 2318 mi²) is the tributary-arm denominator for a
      discharger on the Auglaize just above the junction. Non-colliding alias so a bare "auglaize
      river" is not captured (that is the Fort Jennings proxy above).
  St. Marys River:
    gage: "04182000"
    aliases: [st marys river, st. marys river, saint marys river]
  St. Joseph River:
    gage: "04178000"
    aliases: [st joseph river, st. joseph river, saint joseph river, st joseph r]

  # --- Great Miami basin (subregion 0508, → Ohio River) -----------------------
  # Mad River uses the lower-reach gage near Springfield (03269500, DA 490 mi²); the upper
  # reach near Urbana (03267000, DA ~160 mi², a smaller 7Q10) is the site abstraction gage,
  # not the basin-screen proxy. Great Miami River uses the mouth-ward gage at Hamilton.
  Mad River:
    gage: "03269500"
    aliases: [mad river]
  Great Miami River:
    gage: "03274000"
    aliases: [great miami river, great miami r, miami river]

  # --- Scioto basin (subregion 0506, → Ohio River) ----------------------------
  # Scioto River uses the mouth-ward gage at Higby (03234500, DA 5131 mi²). Big Walnut Creek
  # (03229500) is the New Albany Scioto-side receiving water; the Olentangy uses the near-
  # Worthington gage (03226800 at Columbus has no discharge record in-window).
  Scioto River:
    gage: "03234500"
    aliases: [scioto river, scioto r]
  Olentangy River:
    gage: "03226800"
    aliases: [olentangy river, olentangy r]
  Big Walnut Creek:
    gage: "03229500"
    aliases: [big walnut creek, big walnut cr, big walnut]
  Big Darby Creek:
    gage: "03230500"
    aliases: [big darby creek, big darby cr, big darby]

  # --- Little Miami basin (subregion 0507, → Ohio River) ----------------------
  Little Miami River:
    gage: "03245500"
    aliases: [little miami river, little miami]
    note: >-
      The mainstem proxy is the long-record Milford gage (03245500, DA 1203 mi² — NWIS published
      drain_area_va, 2026-08-01; an earlier uncited "1664 mi²" here was wrong by +38% and is
      corrected, #1472). Todd Fork (Wilmington's receiving water) has no CURRENTLY REPORTING gage,
      so Todd Fork dischargers stay unscreened (no_7q10) rather than being proxied to a river 15x
      their drainage area (that would badly overstate dilution). Todd Fork is not unmeasured,
      though: the discontinued 03244000 (near Roachester, DA 219 mi²) holds 21 complete climatic
      years of daily discharge 1952-1974, giving an LP3 7Q10 of 0.1654 cfs — DAR-transferred to
      0.0597 cfs just below the Lytle Creek confluence, i.e. the Wilmington WWTP's reach is ~99%
      effluent at design low flow. That statistic is a MANUAL receiving-water characterization in
      data/extracted/wilmington/low-flow-screen.md and is deliberately NOT wired in here: a
      1952-1974 record as a present-day screen denominator collides with the asof vintage
      discipline (#1644).
  Little Miami River near Oldtown:
    gage: "03240000"
    aliases: [little miami river near oldtown, little miami r near oldtown]
    note: >-
      Upstream Xenia reach (DA 129 mi², NWIS published). This gage NO LONGER anchors the Wilmington
      at-site 7Q10: the Milford/Oldtown mainstem bracket was retired as the anchor in #1472 once
      Todd Fork's own historical gage (03244000) was found to carry 21 climatic years of daily
      discharge — a 219 -> 79 mi² transfer down the same stream beats a 1203 -> 79 mi² transfer off
      a different one. Oldtown remains a screening gage in its own right and keeps its non-colliding
      alias so it does not capture ECHO's bare "little miami river" (aliased to Milford above).
  Caesar Creek:
    gage: "03242350"
    aliases: [caesar creek]
    note: >-
      Caesar Creek (03242350, near Wellman, DA 239 mi², below Caesar Creek Lake) reflects a regulated
      low-flow regime. The "possibly stage-only" guess is now confirmed (#1472, NWIS series catalog
      2026-08-01): daily DISCHARGE (00060) exists only for 1965-07-01..1974-06-30, and everything
      current is stage (00065, 2017- ) plus water temperature (00010, 2022- ). The old discharge
      record is moreover PRE-IMPOUNDMENT and does not describe the regulated regime. So it is skipped
      gracefully by the per-gage error guard and Caesar Creek dischargers remain no_7q10 — correctly.
      Note this gage is a WITHDRAWAL-side reference for Wilmington (Caesar Creek Lake has been the
      City's principal raw supply since 1994), never an effluent-side screen: the binding constraint
      there is a contracted storage allocation, not a low-flow statistic.

  # --- Ohio Brush Creek basin -------------------------------------------------
  Ohio Brush Creek:
    gage: "03237500"
    aliases: [ohio brush creek, ohio brush ck]
    note: >-
      Ohio Brush Creek basin (subregion 0509, HUC-8 05090201 "Ohio Brush-Whiteoak", direct to the
      Ohio River — the network's first non-Lake-Erie / non-glaciated Appalachian branch, West Union
      #1117). The only substantive active gage on the creek is Ohio Brush Creek near West Union
      (03237500, DA 387 mi², daily discharge since 1926); the West Fork gages (03237400 Lawshe,
      03237295 Peebles) are trivial/short-record and are omitted rather than proxied. Non-colliding
      aliases only: a bare "brush creek" would capture ECHO's unrelated Maumee-basin "BRUSH CREEK"
      receiving water (a different stream) and misroute it to this southern-Ohio gage.

  # --- Greenville (Darke Co.) receiving waters --------------------------------
  # Greenville Creek is the primary at-site gage (Bradford gage 03264000, DA 193 mi²); Stillwater
  # River at Pleasant Hill (03265000, DA 503 mi²) is the downstream context after Greenville Creek
  # enters the Stillwater mainstem. These are the only actively gaged reaches on the site's
  # Stillwater/Greenville Creek corridor.
  Greenville Creek:
    gage: "03264000"
    aliases: [greenville creek, greenville ck]
  Stillwater River:
    gage: "03265000"
    aliases: [stillwater river, stillwater r]

  # --- Great Miami basin — Sidney reach ---------------------------------------
  # The mouth-ward Hamilton gage (03274000) above is the basin-wide "GREAT MIAMI RIVER" ECHO screen
  # proxy. These two entries serve the Sidney site-level 7Q10 (the at-site upper reach) and the
  # Loramie Creek tributary screen. Great Miami at Sidney (03261500, DA 601 mi²) uses a non-colliding
  # alias so it doesn't capture ECHO's bare "GREAT MIAMI RIVER" (already aliased to Hamilton above).
  Great Miami River at Sidney:
    gage: "03261500"
    aliases: [great miami river at sidney, great miami r at sidney]
  Loramie Creek:
    gage: "03262000"
    aliases: [loramie creek]

  # --- Great Miami basin — Troy/Piqua reach (#829) ----------------------------
  # The at-site 7Q10 for the troy-piqua site (upper Great Miami, HUC-8 05080001): the mainstem
  # reach between Sidney (03261500, upstream) and Dayton (03270500, downstream). Great Miami at
  # Troy (03262700, DA ~926 mi², daily discharge since 1962 — 44 climatic yr in the 1980-2024
  # window) is the county-seat receiving reach and the site's abstraction/supply gage; it serves
  # both the Troy and Piqua municipal WWTP screens. The upstream Great Miami at Piqua gage
  # (03262500) is NOT curated here: its daily-discharge record starts 2012 (~13 yr, below the
  # 20-yr floor), so it would be omitted at derivation — the Troy gage is the reach denominator.
  # Non-colliding alias only: the bare "great miami river" already routes to Hamilton (03274000).
  Great Miami River at Troy:
    gage: "03262700"
    aliases: [great miami river at troy, great miami r at troy]

  # --- Great Miami basin — WPAFB / Dayton reaches (#464) ----------------------
  # The mouth-ward Hamilton gage (03274000) is the basin-wide "GREAT MIAMI RIVER" ECHO proxy; these
  # two serve the WPAFB site-level 7Q10 at the at-base reaches (the Mad River near Dayton is WPAFB's
  # abstraction/supply gage; the Great Miami at Dayton is the well-field mainstem). Both use non-
  # colliding aliases so they don't capture ECHO's bare "MAD RIVER" / "GREAT MIAMI RIVER" (aliased to
  # Springfield/Hamilton above).
  Mad River at Dayton:
    gage: "03270000"  # Mad River near Dayton OH (WPAFB at-base reach; DA ~635 mi²)
    aliases: [mad river at dayton, mad river near dayton, "mad river (dayton reach)"]
  Great Miami River at Dayton:
    gage: "03270500"  # Great Miami River at Dayton OH (well-field mainstem reach)
    aliases: [great miami river at dayton, great miami r at dayton]

# Synthesized headwaters-confluence 7Q10s: a mainstem formed by the junction of two gaged
# tributaries, where no single LONG-record gage sits at the confluence itself (the Maumee mainstem
# gage at Fort Wayne, 04182900, has only ~13 yr — below the 20-yr floor). The confluence 7Q10 is the
# SUM of the component tributaries' 7Q10s — a CONSERVATIVE proxy: the two streams' annual 7-day minima
# need not coincide, so the true confluence 7Q10 is >= the sum (#358). Aliases are point-specific and
# deliberately EXCLUDE the bare "maumee river" (that is the lower-basin Waterville proxy, 114 cfs). They
# are screen-inert by design: the Fort Wayne WWTP (IN0032191) discharges to an ungaged ditch ("Baldwin
# Ditch, Maumee R …"), so it is screened only on that primary receiver (left unscreened, omit-don't-
# guess) — this entry is the documented at-mainstem denominator for the manual receiving-water
# characterization, not an auto-applied screen value.
headwaters_confluences:
  Maumee River (Fort Wayne headwaters):
    components:
      - gage: "04180500"
        label: "St. Joseph River near Fort Wayne, IN"
      - gage: "04182000"
        label: "St. Marys River near Fort Wayne, IN"
    aliases:
      - maumee river at fort wayne
      - maumee river (fort wayne headwaters)
      - maumee river headwaters
