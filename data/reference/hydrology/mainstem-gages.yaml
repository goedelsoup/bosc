meta:
  subject: >-
    Curated major-network mainstem USGS gages (and synthesized headwaters confluences)
    that anchor the basin-wide assimilative low-flow screen (watermark.hydrology.basin).
  source: >-
    Each gage is verified to return a multi-decade daily-discharge record from USGS NWIS.
    The lower/mouth-ward mainstem gage is chosen (the Maumee-at-Waterville convention):
    one medium-confidence screening proxy per mainstem, applied basin-wide by ECHO
    receiving-water name. This is the input table the derived 7Q10s are computed from
    (watermark derive-low-flows -> low-flow-7q10.derived.yaml), NOT a derived output.
  discipline: >-
    aliases are the exact ECHO receiving_water surface forms (lowercased, comma-split)
    that mean a DIRECT discharge to this mainstem — not a tributary "via"/"to" it. Registering
    an alias is the only reviewed way to say two surface forms are one water, which is why the
    screen refuses a compound receiving_water whose forms do not ALL resolve to one entry: an
    unregistered second form is a second water, and a permit that lists two waters does not say
    which one carries its flow (watermark.hydrology.basin._match_low_flow, #1120). The derived
    table is a single shared file keyed by receiving-water name across basins; a name that means
    one river network-wide (Maumee, Great Miami) can be served everywhere, but a name that means
    a different REACH in each basin cannot — such an entry declares `basins:` and is served only
    to those basins' inventories (see the Ohio River entry). A gage with <20 climatic years or a
    non-positive/NaN 7Q10 is omitted at derivation (never a committed unreliable denominator).
  note_propagation: >-
    A gage entry's `note` is copied verbatim into the emitted low-flow-7q10.derived.yaml entry
    alongside the cited blocks below (#1120). The screen reads the derived file, never this one,
    so a reservation stated only here would never reach anyone the number reaches. Write a note
    for the reader of the ratio, not for the maintainer of the table.
  cited_annotations: >-
    A gage entry may carry three OPTIONAL cited blocks (#1458), copied verbatim into the emitted
    low-flow-7q10.derived.yaml entry by `watermark derive-low-flows` so a screening denominator is
    never published without them: `published` (a third party's own low-flow statistic AT THIS GAGE,
    the counterweight to our LP3 fit — carried beside it, never substituted for it, because the
    record periods differ), `regulation` (a CITED third-party judgment that the gage's low flow is
    anthropogenically altered; `status: regulated` demotes the derived entry to confidence `low`,
    which is the one thing a reference-table edit here changes about the screen), and
    `cross_check_gages` (neighbouring published gages, context only — never a denominator, never
    matched by any alias). Author none of them from reasoning: each carries the instrument that
    says it, and `regulation.remark` quotes that instrument verbatim where it has words.
  cited_annotations_gap: >-
    [open] Four entries are annotated: the Blanchard (the gage #1458 was opened about) and the
    three registered with the Muskingum and Sandusky basins, each carrying a `regulation` block
    quoting Straub 2001's REMARKS verbatim. Every other entry is still unannotated.
    USGS SIR 2024-5075 table 1 publishes a Regulated/Unregulated classification for most of the
    other gages in this table (e.g. it calls Mad River near Urbana 03267000, Greenville Creek
    03264000, Stillwater 03265000, Maumee near Defiance 04192500 and Ottawa River at Lima 04187100
    all "Regulated"), so the network-wide sweep is a mechanical read of one committed CSV — it is
    deliberately NOT done here because demoting those denominators' confidence moves other sites'
    committed artifacts and belongs in its own reviewed change. An UNANNOTATED gage means "not yet
    read against the published record", never "unregulated".

# Curated major network mainstems with a long-record USGS gage, grouped by basin.
mainstems:
  # --- Maumee basin (subregion 0410, Western Lake Erie) -----------------------
  Maumee River:
    gage: "04193500"
    aliases: [maumee river]
  Auglaize River:
    gage: "04186500"
    aliases: [auglaize river, auglaze river]
  Blanchard River:
    gage: "04189000"
    aliases: [blanchard river, blanchard r]
    note: >-
      Blanchard River (Auglaize subtree, HUC-8 04100008) — the network's only along-one-river
      pair, Findlay (upstream) + Ottawa (downstream), both discharge here (#414/#417). The only
      long-record daily-discharge gage on the Blanchard is near Findlay (04189000, DA 346 mi²,
      44 climatic yr). The at-Ottawa gage (04189260) has ~14 yr — below the 20-yr floor, so it is
      omitted here (carried as a cross-check below); the at-Glandorf gage (04189500) has no
      daily-discharge record in the modern window. So this one gage is the only derivable Blanchard
      denominator. ⚠️ READ `regulation` AND `cross_check_gages` BEFORE USING IT (#1458). This gage
      is regulated AND sits BELOW the Findlay WPCC's own outfall, so its low flow is neither natural
      nor independent of the discharge it was being used to screen; the unregulated Blanchard and
      Eagle Creek gages publish 7Q10s of 0-0.03 cfs, and Ohio EPA's own design low flow at the
      Findlay outfall is 0.21 cfs. The old reading of the 14-yr Ottawa gage — "the low flow barely
      grows over the reach, so one shared denominator is basin-representative" — was an artifact of
      comparing two REGULATED gages to each other and does not survive; both plants are now screened
      on their own fact-sheet denominators (low-flow-7q10.yaml, `permits:`).
    published:
      # USGS's own published statistic AT THIS GAGE — the counterweight to the LP3 fit. Note the
      # period: it ends 27 years before the derived window's end, so the 3.2x gap between 2.7 and
      # 8.67 is at least as much RECORD PERIOD as method. Never present one as correcting the other.
      seven_q10_cfs: 2.7
      one_q10_cfs: 2.1
      thirty_q10_cfs: 3.9
      ninety_q10_cfs: 6.1
      harmonic_mean_cfs: 23.1
      drainage_area_sq_mi: 346
      period: October 1923 to December 1935, October 1940 to September 1997
      citation: >-
        Straub, D.E., 2001, Low-Flow Characteristics of Streams in Ohio through Water Year 1997:
        USGS Water-Resources Investigations Report 01-4140, printed p. 358, station "04189000
        Blanchard River near Findlay, Ohio" — annual (Apr.-Mar.) magnitude-and-frequency table,
        10-yr recurrence column (1-day 2.1, 7-day 2.7, 30-day 3.9, 90-day 6.1) and SELECTED
        STREAMFLOW CHARACTERISTICS (harmonic mean 23.1 ft3/s; average 258 ft3/s over 69 years;
        minimum daily 0.4 ft3/s). Bytes: data/reference/usgs/low-flow/wri20014140.pdf.
    regulation:
      status: regulated
      remark: >-
        Water is diverted upstream from station into Findlay Reservoir. Storage in Findlay
        Reservoir used for water supply of city of Findlay, and is available for low-flow
        augmentation. All water returns to stream upstream from station.
      citation: >-
        Straub 2001 (above), station 04189000, REMARKS — quoted verbatim in `remark`. Corroborated
        for the reach as a whole by USGS SIR 2024-5075 table 1, which classifies both downstream
        Blanchard gages (04189131 Gilboa, 04189260 Ottawa) as "Regulated" — its listed causes of
        that classification include "known diversions" and "wastewater treatment plant discharges".
        ⚠️ SIR 2024-5075 does NOT classify 04189000: that gage is absent from its table 1, its
        table 1.1 and its table 2.1 despite a continuous NWIS daily record since 1923, and the
        report states no reason ([open]). The absence is NOT itself evidence of regulation —
        regulated gages ARE listed there with full statistics — so this classification rests on
        Straub's REMARKS, which state it outright.
    cross_check_gages:
      # Context only — never a denominator. Read top to bottom this is the finding: where the
      # Blanchard is UNREGULATED its published 7Q10 is 0 to 0.03 cfs, and every value at or below
      # Findlay (8.67 derived, 11.5, 10.8) is REGULATED flow — augmentation release plus effluent.
      - gage: "04188300"
        gage_name: Blanchard River at Mt. Blanchard, Ohio
        seven_q10_cfs: 0.0
        drainage_area_sq_mi: 109
        period: low-flow measurements, water years 1970-1977 (partial-record station)
        citation: >-
          Straub 2001, printed p. 356 — annual (Apr.-Mar.) 7-day: 2-yr 0.2, 10-yr 0, 20-yr 0;
          minimum observed streamflow 0 ft3/s September 1970.
        note: >-
          One of the TWO gages Ohio EPA's Findlay fact sheet names as the basis for its design low
          flows (Table 12: "USGS Gages 04188300 and 04189000"; the 30Q10 rows cite 04188300 alone).
          It is upstream of Findlay, upstream of the reservoir return, and its own published 7Q10 is
          ZERO — which is why the regulator's at-outfall number is 0.21 cfs and not 8.67.
      - gage: "04188337"
        gage_name: Blanchard River below Mt. Blanchard OH
        seven_q10_cfs: 0.03
        drainage_area_sq_mi: 141
        period: water years 2008-2020
        regulation: unregulated
        citation: >-
          USGS SIR 2024-5075 appendix 1 table 1.1 (sir20245075_app1_table1.1.csv), station
          04188337, April-March 7-day 10-year — 1-day 0.02, 7-day 0.03, 30-day 0.35, 90-day 1.3;
          harmonic mean 2.99 ft3/s. Regulation status from that report's table 1.
        note: >-
          The load-bearing cross-check: a MODERN (WY2008-2020), continuous, published, and
          third-party-classified UNREGULATED Blanchard gage reads 0.03 cfs. So the 8.67 cfs derived
          40 mi downstream over an overlapping window is not the same river measured better — it is
          a different, managed quantity.
      - gage: "04188496"
        gage_name: Eagle Creek above Findlay OH
        seven_q10_cfs: 0.0
        drainage_area_sq_mi: 51.0
        period: water years 2008-2020
        regulation: unregulated
        citation: >-
          USGS SIR 2024-5075 appendix 1 table 1.1, station 04188496, April-March 7-day 10-year = 0
          (2-yr 0.19); harmonic mean 0.44 ft3/s. Regulation status from that report's table 1.
        note: >-
          Eagle Creek joins the Blanchard between the Findlay outfall and gage 04189000 (Straub
          places the gage "3.0 mi downstream from Eagle Creek"). Its 7Q10 is ZERO, so the tributary
          explains none of the 41x gap between the at-outfall and at-gage denominators.
      - gage: "04188500"
        gage_name: Eagle Creek near Findlay, Ohio
        seven_q10_cfs: 0.0
        drainage_area_sq_mi: 55.0
        period: January 1947 to July 1957
        citation: >-
          Straub 2001, printed p. 357 — every annual and seasonal 7-day recurrence 0 ft3/s;
          minimum daily 0 ft3/s (occurred in 8 years); 4.3 mi upstream from mouth.
        note: >-
          The historical record agrees with the modern one — this tributary stops at low flow.
      - gage: "04189131"
        gage_name: Blanchard River at Gilboa OH
        seven_q10_cfs: 11.5
        drainage_area_sq_mi: 503
        period: water years 2010-2020
        regulation: regulated
        citation: >-
          USGS SIR 2024-5075 appendix 1 table 1.1, station 04189131, April-March 7-day 10-year
          (1-day 9.96, 30-day 16.1, 90-day 23.9; harmonic mean 73.0 ft3/s). Regulation status
          "Regulated" from that report's table 1.
      - gage: "04189260"
        gage_name: Blanchard River at Ottawa OH
        seven_q10_cfs: 10.8
        drainage_area_sq_mi: 628
        period: water years 2010-2020
        regulation: regulated
        citation: >-
          USGS SIR 2024-5075 appendix 1 table 1.1, station 04189260, April-March 7-day 10-year
          (1-day 5.27, 30-day 16.6, 90-day 27.8; harmonic mean 84.6 ft3/s). Regulation status
          "Regulated" from that report's table 1.
        note: >-
          Supersedes the 8.98 cfs LP3 cross-check the Findlay↔Ottawa comparison used to carry for
          this gage: 10.8 cfs is the PUBLISHED value, and it is published as regulated flow.
          Downstream of Gilboa yet slightly LOWER than it — another sign these are managed
          releases, not a drainage-area progression.
  Maumee River near Defiance:
    gage: "04192500"
    aliases: [maumee river near defiance, maumee r near defiance]
    note: >-
      Defiance reach (#391). The basin-wide "MAUMEE RIVER" ECHO screen proxy is the mouth-ward
      Waterville gage (04193500, DA 6330 mi²) — but it sits ~50 river-miles DOWNSTREAM of the
      Defiance WWTP outfall (OH0024899), so it is the wrong denominator for the actual discharge
      reach. The honest at-reach mainstem denominator is the Maumee-near-Defiance gage (04192500,
      DA 5545 mi²): it sits just EAST/downstream of the city and — per NWIS drainage areas — ALREADY
      INCLUDES the Auglaize (its 5545 mi² > Waterville's 6330 minus the Tiffin), so it is the
      mainstem BELOW the Auglaize confluence, not above it. No confluence SUM is synthesized here
      (that would double-count the Auglaize, unlike the ungaged Fort Wayne junction). Counter-
      intuitively the near-Defiance 7Q10 comes out HIGHER than Waterville's, so the reach-specific
      dilution is slightly LOOSER, not tighter — the honest number regardless (see ONBOARDING.md).
      Non-colliding aliases only: a bare "maumee river" would capture ECHO's basin-wide receiving
      water (already aliased to the Waterville proxy above).
  Auglaize River near Defiance:
    gage: "04191500"
    aliases: [auglaize river near defiance, auglaize r near defiance]
    note: >-
      The Auglaize-near-Defiance gage (04191500, DA 2318 mi²) is the tributary-arm denominator for a
      discharger on the Auglaize just above the junction. Non-colliding alias so a bare "auglaize
      river" is not captured (that is the Fort Jennings proxy above).
  St. Marys River:
    gage: "04182000"
    aliases: [st marys river, st. marys river, saint marys river]
  St. Joseph River:
    gage: "04178000"
    aliases: [st joseph river, st. joseph river, saint joseph river, st joseph r]

  # --- Great Miami basin (subregion 0508, → Ohio River) -----------------------
  # Mad River uses the lower-reach gage near Springfield (03269500, DA 490 mi²); the upper
  # reach near Urbana (03267000, DA ~160 mi², a smaller 7Q10) is the site abstraction gage,
  # not the basin-screen proxy. Great Miami River uses the mouth-ward gage at Hamilton.
  Mad River:
    gage: "03269500"
    aliases: [mad river]
  Great Miami River:
    gage: "03274000"
    aliases: [great miami river, great miami r, miami river]

  # --- Scioto basin (subregion 0506, → Ohio River) ----------------------------
  # Scioto River uses the mouth-ward gage at Higby (03234500, DA 5131 mi²). Big Walnut Creek
  # (03229500) is the New Albany Scioto-side receiving water; the Olentangy uses the near-
  # Worthington gage (03226800 at Columbus has no discharge record in-window).
  Scioto River:
    gage: "03234500"
    aliases: [scioto river, scioto r]
  Olentangy River:
    gage: "03226800"
    aliases: [olentangy river, olentangy r]
  Big Walnut Creek:
    gage: "03229500"
    aliases: [big walnut creek, big walnut cr, big walnut]
  Big Darby Creek:
    gage: "03230500"
    aliases: [big darby creek, big darby cr, big darby]

  # --- Little Miami basin (subregion 0507, → Ohio River) ----------------------
  Little Miami River:
    gage: "03245500"
    aliases: [little miami river, little miami]
    note: >-
      The mainstem proxy is the long-record Milford gage (03245500, DA 1203 mi² — NWIS published
      drain_area_va, 2026-08-01; an earlier uncited "1664 mi²" here was wrong by +38% and is
      corrected, #1472). Todd Fork (Wilmington's receiving water) has no CURRENTLY REPORTING gage,
      so Todd Fork dischargers stay unscreened (no_7q10) rather than being proxied to a river 15x
      their drainage area (that would badly overstate dilution). Todd Fork is not unmeasured,
      though: the discontinued 03244000 (near Roachester, DA 219 mi²) holds 21 complete climatic
      years of daily discharge 1952-1974, giving an LP3 7Q10 of 0.1654 cfs — DAR-transferred to
      0.0597 cfs just below the Lytle Creek confluence and 0.0068 cfs at the outfall itself, i.e.
      the Wilmington WWTP's reach is ~99.9% effluent at design low flow.
      RESOLVED (#886): that statistic is no longer only a manual characterization. The
      OUTFALL-REACH value is committed as the `lytle creek` entry in low-flow-7q10.yaml — a
      `source: derived`, `confidence: low` entry admitted under that file's verified-negative
      exception (Ohio EPA computed no low flow for this reach at all), with the 1952-1974 record
      period stated in its citation so the asof vintage discipline (#1644) is satisfied by
      DISCLOSURE rather than by omission. Nothing changes HERE: this table drives the derived
      at-gage mainstem proxies, and 03244000 is still absent from it — its record predates the
      1980 derivation window, and a 219 mi² at-gage value is not the 9.0 mi² outfall reach. Todd
      Fork itself remains no_7q10 in the basin screen; only Lytle Creek at the outfall is keyed.
      Full method: data/extracted/wilmington/low-flow-screen.md §2.3-2.6.
  Little Miami River near Oldtown:
    gage: "03240000"
    aliases: [little miami river near oldtown, little miami r near oldtown]
    note: >-
      Upstream Xenia reach (DA 129 mi², NWIS published). This gage NO LONGER anchors the Wilmington
      at-site 7Q10: the Milford/Oldtown mainstem bracket was retired as the anchor in #1472 once
      Todd Fork's own historical gage (03244000) was found to carry 21 climatic years of daily
      discharge — a 219 -> 79 mi² transfer down the same stream beats a 1203 -> 79 mi² transfer off
      a different one. Oldtown remains a screening gage in its own right and keeps its non-colliding
      alias so it does not capture ECHO's bare "little miami river" (aliased to Milford above).
  Caesar Creek:
    gage: "03242350"
    aliases: [caesar creek]
    note: >-
      Caesar Creek (03242350, near Wellman, DA 239 mi², below Caesar Creek Lake) reflects a regulated
      low-flow regime. The "possibly stage-only" guess is now confirmed (#1472, NWIS series catalog
      2026-08-01): daily DISCHARGE (00060) exists only for 1965-07-01..1974-06-30, and everything
      current is stage (00065, 2017- ) plus water temperature (00010, 2022- ). The old discharge
      record is moreover PRE-IMPOUNDMENT and does not describe the regulated regime. So it is skipped
      gracefully by the per-gage error guard and Caesar Creek dischargers remain no_7q10 — correctly.
      Note this gage is a WITHDRAWAL-side reference for Wilmington (Caesar Creek Lake has been the
      City's principal raw supply since 1994), never an effluent-side screen: the binding constraint
      there is a contracted storage allocation, not a low-flow statistic.

  # --- Muskingum basin (subregion 0504, → Ohio River) --------------------------
  # Registered with the basin's ECHO inventory (#2069). Two gages, both mouth-ward on their own
  # mainstem, both long-record. Read the reservations before quoting either.
  #
  # ⚠️ NEITHER OF THESE SCREENS MANSFIELD, the network's own Muskingum point. Its WWTP discharges
  # to Rocky Fork of the Mohican, and HUC-8 05040002 has NO usable gage: every long record ended
  # between 1975 and 1993 (Mohican at Greer 03136000 to 1982, Black Fork at Loudonville 03131500
  # to 1991, Clear Fork below Pleasant Hill 03133500 to 1991, Touby Run 03130500 to 1978) and
  # every live gage is far under the 20-climatic-year floor (Black Fork at Shelby 03129197 ~14 yr,
  # Rocky Fork at Lucas 03131122 ~3 yr, Touby Run at W 6th 03130647 ~2 yr). No Mohican or Rocky
  # Fork entry is registered here, so those receivers report `no_7q10` — unscreenable, never
  # unaffected. Mansfield's own denominator has to come from its permit's fact sheet, which this
  # corpus does not yet hold (#1429).
  Muskingum River:
    gage: "03150000"
    aliases: [muskingum river]
    note: >-
      Muskingum River at McConnelsville (DA 7,422 mi², daily record since 1921). The mouth-ward
      gage with a usable record: the two further downstream — Muskingum near Beverly (03150300)
      and at Beverly (03150500) — are BELOW the 20-climatic-year floor (03150500 begins
      2012-10-01, ~14 yr), so the convention's "lowest gage on the mainstem" stops here.
      ⚠️ THIS DENOMINATOR IS RESERVOIR-REGULATED AND ENORMOUS. Straub 2001 states the flow is
      regulated by 17 flood-control reservoirs 36.6-148 mi upstream plus a power plant 19 mi
      upstream (see `regulation`), and at 7,422 mi² it integrates almost the whole basin — so it
      is a magnitude check ("is this discharge one part in a hundred or one in a hundred
      thousand"), never a reach-specific assimilative finding, and any facility upstream of
      McConnelsville is being credited with more river than passes it.
      ⚠️ "LITTLE MUSKINGUM RIVER" IS A DIFFERENT RIVER and is deliberately NOT an alias here. It
      is a direct Ohio River tributary in Washington County (DA 210 mi², gage 03115400) that the
      0504 pull picks up, and one POTW in the committed inventory names it. The alias list holds
      the bare mainstem form only, so that row stays unmatched rather than borrowing a
      35x-larger denominator — the same discipline that withholds a bare "brush creek" alias in
      the Ohio Brush Creek basin.
    published:
      # Straub's period ends in 1992 and the derived LP3 fit runs the modern window; a gap
      # between them is at least as much RECORD PERIOD as method. Never read one as correcting
      # the other.
      seven_q10_cfs: 651
      one_q10_cfs: 551
      thirty_q10_cfs: 750
      ninety_q10_cfs: 959
      harmonic_mean_cfs: 2930
      drainage_area_sq_mi: 7422
      period: October 1937 to October 1992
      citation: >-
        Straub, D.E., 2001, Low-Flow Characteristics of Streams in Ohio through Water Year 1997:
        USGS Water-Resources Investigations Report 01-4140, printed p. 171, station "03150000
        Muskingum River at McConnelsville, Ohio" — annual (Apr.-Mar.) magnitude-and-frequency
        table, 10-yr recurrence column (1-day 551, 7-day 651, 30-day 750, 90-day 959) and
        SELECTED STREAMFLOW CHARACTERISTICS (harmonic mean 2,930 ft3/s; average 7,780 ft3/s over
        55 years; minimum daily 385 ft3/s). Figures read from a 300 DPI RENDER of the page, not
        the text layer, which garbles digits elsewhere in these tables. Bytes:
        data/reference/usgs/low-flow/wri20014140.pdf.
    regulation:
      status: regulated
      remark: >-
        Flow regulated by 17 flood-control reservoirs 36.6 mi to 148 mi upstream from station.
        Some regulation at low flow by power plant 19 mi upstream from station.
      citation: >-
        Straub 2001 (above), station 03150000, REMARKS — quoted verbatim in `remark`. The
        reservoirs are the Muskingum Watershed Conservancy District system, operated with the US
        Army Corps of Engineers. ⚠️ USGS SIR 2024-5075 does NOT classify this gage: it is absent
        from that report's table 1, table 1.1 and table 2.1, and the report states no reason
        ([open]). Per that report's own inclusion rule an absence is NOT evidence of regulation —
        regulated gages ARE listed there with full statistics — so this classification rests on
        Straub's REMARKS, which state it outright.
  Tuscarawas River:
    gage: "03129000"
    aliases: [tuscarawas river, tuscarawas rv]
    note: >-
      Tuscarawas River at Newcomerstown (DA 2,443 mi², daily record since 1921) — the mouth-ward
      Tuscarawas gage, above the Walhonding confluence at Coshocton where the two form the
      Muskingum. This is the most-used receiving water in the committed 0504 inventory (7 rows),
      which is why both observed surface forms are registered: a permit spelling it
      "Tuscarawas River, Tuscarawas RV" names one water twice, and the compound resolves only
      because the second spelling is a registered alias.
      ⚠️ REGULATED AND DIVERTED — see `regulation`: eight flood-control reservoirs 40-64 mi
      upstream, plus an out-of-basin diversion at Portage Lakes. At 2,443 mi² it is a magnitude
      check for the mainstem, not a reach-specific finding.
      ⚠️ A TRIBUTARY OF THE TUSCARAWAS IS NOT THE TUSCARAWAS. The inventory carries "ut of the
      tuscarawas river", "fohl ditch trib of tuscarawas river" and "plum run - tributary of
      tuscarawas river"; none is registered, so each stays unmatched rather than being credited
      with the mainstem's low flow — the same rule the Ohio River entry applies to "ut / ohio
      river".
    published:
      seven_q10_cfs: 263
      one_q10_cfs: 250
      thirty_q10_cfs: 303
      ninety_q10_cfs: 378
      harmonic_mean_cfs: 1060
      drainage_area_sq_mi: 2443
      period: October 1937 to September 1997
      citation: >-
        Straub 2001 (above), printed p. 125, station "03129000 Tuscarawas River at Newcomerstown,
        Ohio" — annual (Apr.-Mar.) magnitude-and-frequency table, 10-yr recurrence column (1-day
        250, 7-day 263, 30-day 303, 90-day 378) and SELECTED STREAMFLOW CHARACTERISTICS (harmonic
        mean 1,060 ft3/s; average 2,580 ft3/s over 60 years; minimum daily 216 ft3/s). Figures
        read from a 300 DPI render of the page, not the text layer.
    regulation:
      status: regulated
      remark: >-
        Diversion from basin at Portage Lakes. Flow regulated by eight flood-control reservoirs
        at points 40 mi to 64 mi upstream.
      citation: >-
        Straub 2001 (above), station 03129000, REMARKS — quoted verbatim in `remark`. Note this
        gage records an OUT-OF-BASIN DIVERSION as well as storage regulation, so its low flow is
        altered in both directions. ⚠️ USGS SIR 2024-5075 does not classify this gage either
        (absent from its table 1) — same [open] as 03150000 above.

  # --- Sandusky basin (subregion 0410, direct to Lake Erie) --------------------
  # ⚠️ NO BAY ALIAS, EVER. The network's own Sandusky point (Sandusky / Perkins Twp) discharges
  # to SANDUSKY BAY — the committed inventory carries the surface form "lake erie/sandusky bay" —
  # and a bay is not a river reach. Its mixing volume is set by lake level, seiche and wind
  # forcing, not by streamflow, so a 7Q10 describes nothing about it. That row must stay
  # unmatched: serving it this gage would not be a conservative approximation, it would be a
  # category error. The alias list below is the bare river form only, and `_match_low_flow`'s
  # exact-surface-form lookup is what keeps it that way.
  Sandusky River:
    gage: "04196000"
    aliases: [sandusky river]
    note: >-
      Sandusky River near Bucyrus (DA 88.8 mi², daily record since 1925) — deliberately NOT the
      mouth-ward gage, and this is the one place in this table where that convention is set aside
      on purpose.
      The committed 0410 0011 inventory contains exactly ONE discharger naming "Sandusky River":
      BUCYRUS WWTP, 3.4 MGD, at the basin's headwaters. The mouth-ward gage near Fremont
      (04198000, DA 1,251 mi²) integrates roughly 14x that facility's drainage area, and
      `watermark.hydrology.basin`'s own rule forbids exactly that — a discharger "is never
      screened against a *downstream* river's larger 7Q10 (that would overstate dilution into a
      false 'ok'); including a tributary needs that tributary's own gage or fact sheet." Bucyrus
      has its own gage 1.5 mi west of the city, so the at-site denominator exists and is used.
      ⚠️ THE DIFFERENCE IS THE WHOLE VERDICT, not a refinement. On the Fremont gage this plant
      screens at ~4:1 and reads `tight`; on its own gage it is a VIOLATION — Straub's published
      7Q10 here is 1.1 ft3/s against a 3.4 MGD (5.26 ft3/s) design flow, so the discharge is
      roughly FIVE TIMES the river it enters at low flow. A mouth-ward denominator would have
      published "tight" over an effluent-dominated stream.
      ⚠️ IF A DOWNSTREAM SANDUSKY RIVER DISCHARGER APPEARS IN A LATER PULL, DO NOT LEAVE IT ON
      THIS GAGE. A headwaters 7Q10 understates dilution for anyone below it — the safe direction
      (it flags for review rather than clearing), but still wrong. That row needs its own gage or
      fact sheet, and the three downstream gages are carried in `cross_check_gages` for it.
    published:
      seven_q10_cfs: 1.1
      one_q10_cfs: 0.8
      thirty_q10_cfs: 1.8
      ninety_q10_cfs: 2.8
      harmonic_mean_cfs: 8.32
      drainage_area_sq_mi: 88.8
      period: >-
        September 1925 to November 1935, August 1938 to December 1951, January 1964 to
        September 1981, October 1995 to September 1997
      citation: >-
        Straub, D.E., 2001, Low-Flow Characteristics of Streams in Ohio through Water Year 1997:
        USGS Water-Resources Investigations Report 01-4140, printed p. 368, station "04196000
        Sandusky River near Bucyrus, Ohio" — annual (Apr.-Mar.) magnitude-and-frequency table,
        10-yr recurrence column (1-day 0.8, 7-day 1.1, 30-day 1.8, 90-day 2.8) and SELECTED
        STREAMFLOW CHARACTERISTICS (harmonic mean 8.32 ft3/s; average 88.7 ft3/s over 42 years;
        minimum daily 0.6 ft3/s). Figures read from a 300 DPI render of the page, not the text
        layer. Note the record is DISCONTINUOUS across four spans; NWIS carries daily discharge
        at this station to the present, which is the window the derived LP3 fit uses. Bytes:
        data/reference/usgs/low-flow/wri20014140.pdf.
    regulation:
      status: regulated
      remark: >-
        Low flow slightly affected by operation of reservoirs, 5.3 mi to 6.0 mi upstream from
        station, for municipal supply of Bucyrus.
      citation: >-
        Straub 2001 (above), station 04196000, REMARKS — quoted verbatim in `remark` — AND USGS
        SIR 2024-5075 table 1, row "04196000 Sandusky River near Bucyrus, OH" (Continuous, DA
        88.9 mi²), "Low-flow regulation status: Regulated". The two agree here, which is worth
        recording because they DISAGREE at the mouth-ward gage: for 04198000 near Fremont, SIR
        2024-5075 table 1 says "Regulated" while Straub's entry for the same station (printed
        p. 376) records "REMARKS: None." Neither is corrected — they cover different periods
        (Straub ends at water year 1997; SIR's window is 1975-2020) and SIR's classification is
        the authors' own judgment. ⚠️ Note what the regulation IS here: the reservoirs 5.3-6.0 mi
        upstream are Bucyrus's own MUNICIPAL SUPPLY. So the city withdraws its drinking water
        above the gage and discharges its treated effluent below it, and both sides of that loop
        are inside the 88.8 mi² this denominator describes.
    cross_check_gages:
      # Context only — never a denominator, never matched by an alias. These are the three
      # downstream positions on the same river, carried so a reader can see how fast the
      # denominator grows and can re-screen a future downstream discharger on the right one.
      - gage: "04196500"
        gage_name: Sandusky River near Upper Sandusky, OH
        drainage_area_sq_mi: 298
        regulation: regulated
        citation: USGS SIR 2024-5075 table 1, row "04196500 Sandusky River near Upper Sandusky, OH" (Continuous).
        note: 3.4x the Bucyrus drainage area.
      - gage: "04197137"
        gage_name: Sandusky River at Tiffin, OH
        drainage_area_sq_mi: 966
        regulation: regulated
        citation: USGS SIR 2024-5075 table 1, row "04197137 Sandusky River at Tiffin, OH" (Continuous).
        note: The Tiffin network point's own reach; 11x the Bucyrus drainage area.
      - gage: "04198000"
        gage_name: Sandusky River near Fremont, OH
        seven_q10_cfs: 13.0
        drainage_area_sq_mi: 1251
        period: October 1923 to September 1935, August 1938 to September 1997
        regulation: regulated
        citation: >-
          Straub 2001 printed p. 376 (7-day 10-yr 13 ft3/s; harmonic mean 106 ft3/s) for the
          statistic; USGS SIR 2024-5075 table 1 for the regulation status, which Straub's own
          "REMARKS: None." contradicts — see `regulation.citation` above.
        note: >-
          The mouth-ward gage, 14x the Bucyrus drainage area. This is the denominator the
          "lowest gage on the mainstem" convention would have selected, and screening BUCYRUS
          WWTP on it returns ~4:1 `tight` instead of the ~0.2:1 violation its own reach shows.
          Carried here as the worked example of why this table's convention yields to the
          conservatism argument.

  # --- Ohio Brush Creek basin -------------------------------------------------
  Ohio Brush Creek:
    gage: "03237500"
    aliases: [ohio brush creek, ohio brush ck]
    note: >-
      Ohio Brush Creek basin (subregion 0509, HUC-8 05090201 "Ohio Brush-Whiteoak", direct to the
      Ohio River — the network's first non-Lake-Erie / non-glaciated Appalachian branch, West Union
      #1117). The only substantive active gage on the creek is Ohio Brush Creek near West Union
      (03237500, DA 387 mi², daily discharge since 1926); the West Fork gages (03237400 Lawshe,
      03237295 Peebles) are trivial/short-record and are omitted rather than proxied. Non-colliding
      aliases only: a bare "brush creek" would capture ECHO's unrelated Maumee-basin "BRUSH CREEK"
      receiving water (a different stream) and misroute it to this southern-Ohio gage. The
      05090201 pull (#1120) proved that guard load-bearing a second time: it returned a Campbell
      County KY "BRUSH CRK" (KYG400099, 38.9486 N 84.3678 W) nearly a degree of longitude west of
      this gage (38.8037 N 83.4210 W, NWIS site record) and on the far side of the Ohio, which a
      bare alias would have screened against it. NB: no facility in the committed 05090201
      inventory names Ohio Brush Creek as its receiving water at all — including the West Union
      WWTP itself, whose ECHO receiving_water is null and whose documented receiver (Beasley
      Fork) is ungaged. This entry is therefore a denominator standing ready, not one in use;
      see data/reference/echo/README.md (#1120).

  # --- The Ohio River mainstem (the direct-to-Ohio branch) ---------------------
  # Added #1120 with the Ohio Brush Creek basin. This is the first entry in this table for the
  # Ohio River itself rather than one of its tributary networks: HUC-8 05090201 is a two-bank
  # Ohio River corridor unit, and 5 of its 23 POTWs name the Ohio River and nothing else —
  # including the largest plant ECHO can place at all (Maysville STP, 3.4 MGD; the basin's two
  # largest POTWs, Eastern Regional 4.0 and Nine Mile Creek 3.0, are among the 13 with no
  # receiving water). With no entry here every one of the five read `no_7q10`, which reports a
  # river gaged at 62,000 mi² as unscreenable in the same breath as an ungaged farm ditch.
  # `basins:` is what keeps that from becoming a licence: see the note.
  Ohio River:
    gage: "03216600"
    aliases: [ohio river, ohio rv]
    basins: [ohio-brush-creek]
    note: >-
      Ohio River at Greenup Dam near Greenup KY (03216600, drainage area 62,000 mi² per the USGS
      site record; daily discharge 1968-10-01 to present — 44 complete climatic years inside the
      1980-2024 derivation window). CHOSEN FOR BEING CONSERVATIVE, not for being close. The gage
      sits at 38.6467 N, 82.8604 W (NWIS site record), which is EAST of — upstream of — every one
      of the 261 facilities in the committed 05090201 inventory: the easternmost of them is at
      83.0368 W. Each therefore lies below this gage on a river that only gains drainage area
      downstream, so the denominator UNDER-states what their own reach carries, giving a smaller
      dilution ratio and a screen that cannot overstate dilution. The downstream alternative
      (03277200 Markland Dam, a record that covers the window just as well) would invert that:
      every facility in the unit is above Markland, so its larger drainage area would overstate
      dilution for all of them. Maysville (03238000), the gage physically inside the reach, has no
      daily discharge after 1980-10-26 and cannot support an LP3 fit in the modern window. Three
      things a reader is owed. (1) This mainstem is NAVIGATION-REGULATED — the gage is at a US
      Army Corps lock and dam, as its own name says, and Meldahl and Markland sit below it.
      `regulation` is left UNSET because this table's rule (see meta.cited_annotations) is that
      the block carries a cited third-party classification quoting its instrument, and no such
      published judgment for this gage has been read into the corpus; per
      meta.cited_annotations_gap an unannotated gage means "not yet read against the published
      record", never "unregulated". Read this denominator as regulated in fact and unannotated on
      the record. (2) One gage stands for the whole of the unit's river frontage, so a dilution
      ratio here is a magnitude check — is this discharge one part in a hundred or one in a
      hundred thousand — and never a reach-specific assimilative finding. (3) The conservatism
      argument above is GEOGRAPHIC, and it holds only for the HUC-8 whose frontage lies below
      this gage. "OHIO RIVER" is a receiving water in every Ohio tributary basin's inventory —
      the Muskingum and Mahoning basins reach the Ohio hundreds of river miles upstream of
      Greenup, where the river carries a fraction of the drainage area gaged here — so serving
      this denominator on the bare name network-wide would commit exactly the overstatement the
      gage was chosen to avoid. `basins: [ohio-brush-creek]` is that restriction, and it is also
      what leaves room for a second, differently positioned Ohio River gage to be registered for
      another basin later without the two colliding on the same alias. Aliases stay tight for the
      same reason: "ut / ohio river" and "ohio river / ut" are UNNAMED TRIBUTARIES of the Ohio,
      not the Ohio, and neither surface form is registered here, so neither matches.

  # --- Greenville (Darke Co.) receiving waters --------------------------------
  # Greenville Creek is the primary at-site gage (Bradford gage 03264000, DA 193 mi²); Stillwater
  # River at Pleasant Hill (03265000, DA 503 mi²) is the downstream context after Greenville Creek
  # enters the Stillwater mainstem. These are the only actively gaged reaches on the site's
  # Stillwater/Greenville Creek corridor.
  Greenville Creek:
    gage: "03264000"
    aliases: [greenville creek, greenville ck]
  Stillwater River:
    gage: "03265000"
    aliases: [stillwater river, stillwater r]

  # --- Great Miami basin — Sidney reach ---------------------------------------
  # The mouth-ward Hamilton gage (03274000) above is the basin-wide "GREAT MIAMI RIVER" ECHO screen
  # proxy. These two entries serve the Sidney site-level 7Q10 (the at-site upper reach) and the
  # Loramie Creek tributary screen. Great Miami at Sidney (03261500, DA 601 mi²) uses a non-colliding
  # alias so it doesn't capture ECHO's bare "GREAT MIAMI RIVER" (already aliased to Hamilton above).
  Great Miami River at Sidney:
    gage: "03261500"
    aliases: [great miami river at sidney, great miami r at sidney]
  Loramie Creek:
    gage: "03262000"
    aliases: [loramie creek]

  # --- Great Miami basin — Troy/Piqua reach (#829) ----------------------------
  # The at-site 7Q10 for the troy-piqua site (upper Great Miami, HUC-8 05080001): the mainstem
  # reach between Sidney (03261500, upstream) and Dayton (03270500, downstream). Great Miami at
  # Troy (03262700, DA ~926 mi², daily discharge since 1962 — 44 climatic yr in the 1980-2024
  # window) is the county-seat receiving reach and the site's abstraction/supply gage; it serves
  # both the Troy and Piqua municipal WWTP screens. The upstream Great Miami at Piqua gage
  # (03262500) is NOT curated here: its daily-discharge record starts 2012 (~13 yr, below the
  # 20-yr floor), so it would be omitted at derivation — the Troy gage is the reach denominator.
  # Non-colliding alias only: the bare "great miami river" already routes to Hamilton (03274000).
  Great Miami River at Troy:
    gage: "03262700"
    aliases: [great miami river at troy, great miami r at troy]

  # --- Great Miami basin — WPAFB / Dayton reaches (#464) ----------------------
  # The mouth-ward Hamilton gage (03274000) is the basin-wide "GREAT MIAMI RIVER" ECHO proxy; these
  # two serve the WPAFB site-level 7Q10 at the at-base reaches (the Mad River near Dayton is WPAFB's
  # abstraction/supply gage; the Great Miami at Dayton is the well-field mainstem). Both use non-
  # colliding aliases so they don't capture ECHO's bare "MAD RIVER" / "GREAT MIAMI RIVER" (aliased to
  # Springfield/Hamilton above).
  Mad River at Dayton:
    gage: "03270000"  # Mad River near Dayton OH (WPAFB at-base reach; DA ~635 mi²)
    aliases: [mad river at dayton, mad river near dayton, "mad river (dayton reach)"]
  Great Miami River at Dayton:
    gage: "03270500"  # Great Miami River at Dayton OH (well-field mainstem reach)
    aliases: [great miami river at dayton, great miami r at dayton]

# Synthesized headwaters-confluence 7Q10s: a mainstem formed by the junction of two gaged
# tributaries, where no single LONG-record gage sits at the confluence itself (the Maumee mainstem
# gage at Fort Wayne, 04182900, has only ~13 yr — below the 20-yr floor). The confluence 7Q10 is the
# SUM of the component tributaries' 7Q10s — a CONSERVATIVE proxy: the two streams' annual 7-day minima
# need not coincide, so the true confluence 7Q10 is >= the sum (#358). Aliases are point-specific and
# deliberately EXCLUDE the bare "maumee river" (that is the lower-basin Waterville proxy, 114 cfs). They
# are screen-inert by design: the Fort Wayne WWTP (IN0032191) discharges to an ungaged ditch ("Baldwin
# Ditch, Maumee R …"), so it is screened only on that primary receiver (left unscreened, omit-don't-
# guess) — this entry is the documented at-mainstem denominator for the manual receiving-water
# characterization, not an auto-applied screen value.
headwaters_confluences:
  Maumee River (Fort Wayne headwaters):
    components:
      - gage: "04180500"
        label: "St. Joseph River near Fort Wayne, IN"
      - gage: "04182000"
        label: "St. Marys River near Fort Wayne, IN"
    aliases:
      - maumee river at fort wayne
      - maumee river (fort wayne headwaters)
      - maumee river headwaters
