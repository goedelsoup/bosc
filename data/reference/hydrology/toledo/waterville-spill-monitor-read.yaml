  plume_travel_hours:
    value: 26.5
    unit: hr
    source: derived
    citation: Manning normal-depth mean velocity at ~2,500-3,700 cfs over a lower-Maumee geometry range
      (W 350-550 ft, S 1e-4..3e-4, n 0.030-0.040); advective, not flood-wave celerity
    low: 21.2
    high: 31.8
  release_start: 2026-07-11T00:00-04:00
  spikes_precede_release: true
  verdict: '[inference] The turbidity spikes (324 FNU @ 2026-07-10T12:00, 363 FNU @ 2026-07-10T17:30)
    pre-date the overnight dam failure (2026-07-11); at the ~21-32 h reach travel time the release plume
    cannot reach Waterville until late Jul 11-Jul 12, so the spikes are storm first-flush / resuspension,
    NOT the release plume.'
caveats:
- Turbidity, fPC and specific conductance are optical/ionic SURROGATES; 04193500 has no ammonia or nitrate
  probe, so the reach's nitrogen signal must come from grab samples.
- '#1498''s brief cited pcode 32316 as fPC in error: 32316 is chlorophyll-a; phycocyanin is 32319/32321.
  fPC was sub-bloom all month and its Jul-10 value is below its Jul-1/2 diel peaks.'
- Reach geometry (width/slope/n) behind the velocity bracket is an assumption; the travel time is a range,
  and the attribution rests on the spike-vs-release ORDERING, not its width.
- The window ends Jul 12; the dam-failure plume's expected arrival lands at the very edge of the record,
  so an in-window absence of an ionic bump is 'not captured', not 'did not occur'.
