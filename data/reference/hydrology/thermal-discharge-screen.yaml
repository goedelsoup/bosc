meta:
  subject: Cooling + industrial heat load vs receiving-water temperature WQS / CWA
    §316(a), validated against the reported (ECHO DMR) effluent-temperature record
  source: watermark.hydrology.cooling_models (condenser heat rejection) x EPA ECHO
    DMR effluent temperature (parameters 00010/00011) + flow (50050) x Ohio EPA cited
    design low flows (data/reference/hydrology/low-flow-7q10.yaml) x Ohio temperature
    criteria (data/reference/wqs/ohio-temperature-criteria.yaml) x Great Lakes RIS
    tolerances (data/reference/thermal/great-lakes-ris-thermal-tolerances.yaml, EPA-833-F-23-007)
  site: lima
  receiving_water: Ottawa River
  zone_id: lake_erie_basin_general
  zone_rule: OAC 3745-1-35 Table 35-11 (G)
  design_period: Jun 16-30
  daily_max_c: 29.4
  ambient_c: 24.0
  ambient_source: connector
  reference_ambient_c: 27.8
  facility_count: 7
  modelled_count: 1
  industrial_count: 6
  critical_count: 3
  dmr_window: 2024-05-01..2024-10-31
  corridor_permits: 6
  corridor_permits_with_thermal_record: 3
  observed_instream_station: OH0026069 outfall 901 (Downstream Monitoring)
  observed_instream_c: 24.0
  observed_effluent_analog: NPDES OH0002623 outfall 001 (LIMA REFINERY)
  observed_effluent_analog_c: 32.22
  monitor_only_permits:
  - OH0002623
  - OH0002615
  - OH0026069
  permits_over_daily_max_criterion:
  - OH0002623
  - OH0002615
  caveats:
  - A MODELLED (data-center) row's heat load is the CONDENSER heat rejection (IT x
    cooling overhead) — an inference about a facility that is not yet discharging.
    An INDUSTRIAL row's is the permittee's own reported effluent temperature x reported
    flow — a measurement. They are screened identically from there on but never conflated;
    read `kind` before quoting a number.
  - 'Fully-mixed, design-low-flow, order-of-magnitude: no CORMIX plume model, no mixing-zone
    credit, no decay. T_mixed above the daily-max criterion flags the need for a permit-level
    thermal / CWA §316(a) analysis, NOT an automatic violation.'
  - The thermal assimilative capacity is rho*cp*Q*(daily_max - ambient). At a 0 cfs
    design flow (the Ottawa 1Q10) or an ambient already at the criterion the capacity
    is 0 — any heat load exceeds by construction (no Inf ΔT, mirroring the toxics
    screen).
  - The design ambient is a live NWIS 00010 reading where the gage carries one, else
    the reach's own reported in-stream (upstream/downstream) DMR monitoring, else
    the zone's seasonal-average temperature criterion as a stated design ambient.
    An in-stream station sits downstream of that plant's own outfall, so it is a measured
    in-stream temperature, not an undisturbed upstream background.
  - 'Cooling scenarios span the heat PARTITION, not uncertainty in the load: `once_through`
    sends the whole rejection to the stream by definition, `evaporative_blowdown`
    sends only the blowdown''s sensible heat (the rest leaves as latent heat to the
    air) at a temperature CALIBRATED to an observed corridor analog — an [inference]
    by analogy, never this facility''s own figure. `conservative_bound` is the Phase-2
    ceiling.'
  - Reported DMR values are verbatim from the permittee's submissions via ECHO and
    reduced to degC by their REPORTED unit (00011 is Fahrenheit, 00010 Celsius); an
    exceedance count is ECHO's own determination, never computed here by comparing
    a value to a limit. A permit with no numeric thermal limit is recorded as monitor-only
    — a cited absence, not a clean bill of health.
  - The OAC 3745-1-06 (O)(5) closed-cycle-blowdown exemption (blowdown < 5% of the
    7Q10) is evaluated and surfaced whether or not it applies. RIS tolerances are
    the Great Lakes biological limits for a §316(a) balanced-indigenous-community
    read, [reference] (federal guidance, not law).
