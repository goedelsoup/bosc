# Reach table — Fort Wayne (the Three Rivers confluence), #1806. GEOMETRY-GRADE.
#
# The peer of Lima's reaches.yaml, deliberately WITHOUT contributing catchments: no cited
# CN/Tc/area screening set has been authored for this basin, so `catchments: {}` and the
# routed-hydrograph feed self-skips (the #1364 present-but-empty rule) rather than routing
# an all-zero storm. What IS here: the per-reach channel lengths the reach-nav cut uses
# (derived from the navigated NHDPlus centerline arc lengths — see each citation) and the
# schema-required slopes, stated as screening assumptions that feed no computation today.

meta:
  subject: Reach lengths for the Fort Wayne reach-network centerline cut (geometry-grade)
  tier: tier0
  method: >-
    Proportional-cut lengths for watermark.hydrology.reach_geometry: each reach's length is
    the arc length of its own navigated NHDPlus centerline (reaches/fort-wayne.geojson), so
    the committed ratio reproduces the navigated cut deterministically. No storm-routing
    parameters are authored (catchments: {}) — this table supports the reach-network map,
    not a hydrograph model.
  caveats:
    - "Geometry-grade: no contributing catchments, no routed storm model — the routed-hydrograph feed self-skips for this site."
    - "Slopes are stated screening assumptions carried for the Reach schema; they feed no computation while catchments is empty."

