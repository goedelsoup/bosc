# Reach table — Sidney (the upper Great Miami headwaters), #1996. GEOMETRY-GRADE.
#
# The peer of Lima's reaches.yaml, deliberately WITHOUT contributing catchments: no cited
# CN/Tc/area screening set has been authored for this basin, so `catchments: {}` and the
# routed-hydrograph feed self-skips (the #1364 present-but-empty rule) rather than routing an
# all-zero storm. What IS here: the per-reach channel lengths the reach-nav cut uses (derived
# from the navigated NHDPlus centerline arc lengths — see each citation) and the schema-required
# slopes, which are placeholders and feed no computation today.

meta:
  subject: Reach lengths for the Sidney reach-network centerline cut (geometry-grade)
  tier: tier0
  method: >-
    Proportional-cut lengths for watermark.hydrology.reach_geometry: each reach's length is the
    arc length of its own navigated NHDPlus centerline (reaches/sidney.geojson), so the committed
    ratio reproduces the navigated cut deterministically. No storm-routing parameters are
    authored (catchments: {}) — this table supports the reach-network map, not a hydrograph model.
  caveats:
    - "Geometry-grade: no contributing catchments, no routed storm model — the routed-hydrograph feed self-skips for this site."
    - "Slopes are SCHEMA PLACEHOLDERS, not gradient claims: the Reach model requires the field, nothing reads it while catchments is empty, and no reach here was surveyed or derived from elevations. A routed model for this site must replace every one of them with a cited value before it computes anything."
    - "Lengths are HALF the story of a cut: because reach_geometry cuts a navigated line by these lengths' RATIOS, editing one length moves a reach BOUNDARY. Re-run `watermark --site sidney reaches --write` and write the reported km back after any edit, or the committed geojson and this table drift apart."

catchments: {}

reaches:
  # --- The Great Miami mainstem, split at the real gage point --------------------------------
  great-miami-head:
    length_ft:
      value: 27894.0
      unit: ft
      source: derived
      citation: "derived — NLDI-navigated NHDPlus centerline arc length: Great Miami River above USGS 03261500 at Sidney (8.50 km arc; the gage point anchors the head/reach split, not a length ratio). Regenerate: watermark --site sidney reaches --write"
      confidence: medium
    slope:
      value: 0.0005
      unit: ft/ft
      source: assumption
      citation: "schema placeholder — not a measured or derived gradient; feeds no computation (catchments: {})"
      confidence: low
