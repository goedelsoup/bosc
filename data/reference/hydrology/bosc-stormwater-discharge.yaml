method: 'Tier-0 SCS-CN screening over the measured parcel footprint; the dominant
  hydrologic soil group B/D is resolved per scenario to HSG B pre-development (drained)
  and HSG D on developed post-development ground (undrained) — an explicit drainage-condition
  switch, see caveats; post-development runoff uses the TR-55 weighted-runoff method
  (each ASWCD-declared cover''s CN run separately over the impervious/developed-pervious/undeveloped
  split, runoff depths area-weighted; the reported post CN is the area-weighted composite
  summary) — compositing a single CN under-predicts runoff once the ~34% impervious
  footprint passes TR-55''s ~30% directly-connected threshold; time of concentration
  shortens with imperviousness (pre 1 hr -> as-permitted 0.779882 hr -> full-buildout
  0.35 hr); peaks are AMC-II (average antecedent moisture) with a wet-antecedent (AMC-III)
  conservative bound on the as-permitted post peak; the design rainfall is the NRCS
  Type-II 24-hr distribution built at its published 6-minute resolution (NEH-630 Ch.
  4 630.0407) and the unit hydrograph runs at the SCS unit duration D <= 0.133*Tc
  on the peak factor 484; outfall capacity = Manning full-flow (n=0.013) across an
  assumed slope band. The EROSION signal is anchored to the receiving channel''s channel-forming
  (bankfull / 2-yr) discharge, not to the 7Q10: `channel_forming` runs this same SCS
  chain over the receiving tributary''s committed contributing subcatchment (reaches.yaml)
  so numerator and denominator share the method, and `reach_conveyance` carries the
  design peak into that reach''s cited section as Manning normal depth (depth / velocity
  / boundary shear vs the bankfull flow). The cited 7Q10 (OEPA NPDES fact sheet 2PH00006)
  is retained for the LOW-FLOW / dilution framing only. The receiving-water peak is
  additionally routed down the cited reach chain to the Ottawa confluence (Tier-0
  Muskingum-Cunge; see routed_discharge) so it reflects reach travel, not only the
  at-outfall peak.'
caveats:
- Screening-grade — the receiving-water peak is a Tier-0 Muskingum-Cunge reach route
  on stated reach assumptions (reaches.yaml), not a calibrated HEC-RAS model or a
  permit determination; the pre/post/full peaks are at-outfall SCS-CN screening.
- Headline peaks are AMC-II; post_peak_wet_cfs is the AMC-III (wet-antecedent) upper
  bound — the storm falling on ground already saturated by prior rain.
- The outfall pipe slope is not in the record; capacity is bracketed across 0.3-1.0%.
- The peak is computed over the whole measured footprint; the tributary area to the
  single 60-inch trunk is not stated, so the capacity comparison is a bracket.
- The post cover split treats the developed-pervious remainder as graded open space
  and the undeveloped remainder as keeping prior cropland cover.
- Post-development runoff uses the TR-55 weighted-runoff method (runoff computed per
  cover, then area-weighted on depths). Because runoff is convex in CN, this yields
  more runoff volume than applying the single composite post CN — the detention-deficit
  understatement compositing hides. The volume gap is largest for small/frequent storms
  (the impervious fraction runs off while the pervious fraction still abstracts) and
  narrows as the design storm grows; the peak, which also depends on how the mixed
  cover redistributes excess in time, shifts only marginally at the design and rarer
  storms.
- The outfall's entry point on the receiving tributary is not in the record, so the
  routed channel length is an upper bound on travel — the routed attenuation/lag are
  upper bounds and the confluence peak a lower bound; reaches between the outfall
  and the confluence see intermediate, larger peaks (the unattenuated at-outfall peak
  is what the channel-forming comparison is read on, and this routing does not soften
  it).
- 'The peak-to-7Q10 multiple is the LOW-FLOW / dilution framing, NOT the erosion one
  (WS-12 / #1612). Channel stability is governed by the channel-forming (bankfull,
  effective) discharge — a moderate flow recurring at ~1-2 yr — while the 7Q10 is
  a 7-day 10-year LOW flow: their ratio runs to the hundreds for any flashy outfall
  on any small stream and maps to no geomorphic threshold. The erosion claim now rests
  on `channel_forming` / `peak_to_channel_forming_ratio` and on the pre-vs-post pair
  at the channel-forming recurrence.'
- 'The erosion denominator — Dug Run''s channel-forming discharge, 1,000 cfs — is
  a SURROGATE, not a survey: the 2-yr SCS peak over the committed ''dug-run-head''
  subcatchment (4,940 ac, source: assumption, confidence: low). It moves with that
  catchment, so a committed delineation (or a regional bankfull regression / a surveyed
  cross-section) would sharpen it. Two knowable directions: the recurrence is pinned
  at the CONSERVATIVE end of the published 1-2 yr bankfull band, which maximizes the
  denominator and so understates every ratio against it; and the catchment is taken
  at the mainstem confluence — the largest channel-forming discharge on this tributary
  — while the outfall enters somewhere above it, on a smaller local drainage area,
  so the reported ratio is a LOWER bound on what the channel sees at the discharge
  point.'
- The 'dug-run-head' reach carries NO committed cross-section, so the conveyance check
  runs on the Tier-0 routing default trapezoid (10 ft bottom, 2:1 sides, n=0.04) —
  the same section the Muskingum-Cunge routing uses. Its absolute depths are a screening
  bracket, not a stage prediction (a 8.19-ft bankfull depth on a small tributary is
  a sign of the section being too small for the committed catchment, not a finding
  about the channel). Because bankfull stage is taken self-consistently in that same
  section, the within-bank verdict is geometry-free; the velocity and shear are not,
  and a surveyed cross-section is the upgrade.
- 'Peaks run on the SCS unit-hydrograph peak factor 484 — the cited standard-hydrograph
  default; no per-site factor is declared on `SiteProfile.uh_peak_factor`. The factor
  is a TERRAIN property, not a universal constant: NEH-630 Ch. 16 spans ~100 (wetland
  storage) through 300 (flat/swampy) to ~600 (steep). The published flat end, 300,
  would put the design-storm post-development peak at 410 cfs instead of 580 (~29%
  lower). Runoff VOLUME — and so the detention deficit — is unchanged by the peak
  factor; only the rate is. This is the published sensitivity BRACKET around the resolved
  factor, not a correction to it: moving a site off its resolved factor needs a calibrated
  or cited terrain basis for that catchment, recorded on the profile.'
- 'SSURGO rates this footprint into the DUAL group B/D over 55% of the sampled points,
  whose two letters are two drainage conditions of the same soil, not a spelling.
  USDA NRCS, National Engineering Handbook Part 630 Ch. 7 ''Hydrologic Soil Groups''
  / TR-55 Ch. 2: a dual group (A/D, B/D, C/D) is assigned only to a soil that is group
  D in its natural condition and that can be drained. The first letter is the group
  where artificial drainage is installed and maintained; the second is the natural,
  undrained condition. This screen runs pre-development on HSG B (drained) and developed
  post-development ground on HSG D (undrained) — a stated modeling switch, not a survey
  finding. It is the single largest soils assumption in the post CN: the same cover
  split gives composite CN 80.6 if every acre stayed drained and 89.9 if every acre
  — including the undeveloped remainder, which this screen keeps farmed and tiled
  — went undrained, against the 85.2 reported. Whether this specific field''s tile
  survives construction is not in the record; a drainage plan that showed it would
  move the number within that bracket.'
