      citation: USGS SIR 2024-5075 appendix 1 table 1.1, station 04188496, April-March 7-day 10-year =
        0 (2-yr 0.19); harmonic mean 0.44 ft3/s. Regulation status from that report's table 1.
      note: Eagle Creek joins the Blanchard between the Findlay outfall and gage 04189000 (Straub places
        the gage "3.0 mi downstream from Eagle Creek"). Its 7Q10 is ZERO, so the tributary explains none
        of the 41x gap between the at-outfall and at-gage denominators.
