      ninety_q10_cfs: 6.1
      harmonic_mean_cfs: 23.1
      drainage_area_sq_mi: 346.0
      period: October 1923 to December 1935, October 1940 to September 1997
      citation: 'Straub, D.E., 2001, Low-Flow Characteristics of Streams in Ohio through Water Year 1997:
        USGS Water-Resources Investigations Report 01-4140, printed p. 358, station "04189000 Blanchard
        River near Findlay, Ohio" — annual (Apr.-Mar.) magnitude-and-frequency table, 10-yr recurrence
        column (1-day 2.1, 7-day 2.7, 30-day 3.9, 90-day 6.1) and SELECTED STREAMFLOW CHARACTERISTICS
        (harmonic mean 23.1 ft3/s; average 258 ft3/s over 69 years; minimum daily 0.4 ft3/s). Bytes: data/reference/usgs/low-flow/wri20014140.pdf.'
    regulation:
      status: regulated
      citation: 'Straub 2001 (above), station 04189000, REMARKS — quoted verbatim in `remark`. Corroborated
        for the reach as a whole by USGS SIR 2024-5075 table 1, which classifies both downstream Blanchard
        gages (04189131 Gilboa, 04189260 Ottawa) as "Regulated" — its listed causes of that classification
        include "known diversions" and "wastewater treatment plant discharges". ⚠️ SIR 2024-5075 does
        NOT classify 04189000: that gage is absent from its table 1, its table 1.1 and its table 2.1 despite
        a continuous NWIS daily record since 1923, and the report states no reason ([open]). The absence
        is NOT itself evidence of regulation — regulated gages ARE listed there with full statistics —
        so this classification rests on Straub''s REMARKS, which state it outright.'
      remark: Water is diverted upstream from station into Findlay Reservoir. Storage in Findlay Reservoir
        used for water supply of city of Findlay, and is available for low-flow augmentation. All water
        returns to stream upstream from station.
    cross_check_gages:
    - gage: 04188300
      gage_name: Blanchard River at Mt. Blanchard, Ohio
      seven_q10_cfs: 0.0
      drainage_area_sq_mi: 109.0
      period: low-flow measurements, water years 1970-1977 (partial-record station)
      citation: 'Straub 2001, printed p. 356 — annual (Apr.-Mar.) 7-day: 2-yr 0.2, 10-yr 0, 20-yr 0; minimum
        observed streamflow 0 ft3/s September 1970.'
      note: 'One of the TWO gages Ohio EPA''s Findlay fact sheet names as the basis for its design low
        flows (Table 12: "USGS Gages 04188300 and 04189000"; the 30Q10 rows cite 04188300 alone). It is
        upstream of Findlay, upstream of the reservoir return, and its own published 7Q10 is ZERO — which
        is why the regulator''s at-outfall number is 0.21 cfs and not 8.67.'
    - gage: 04188337
      gage_name: Blanchard River below Mt. Blanchard OH
      seven_q10_cfs: 0.03
      drainage_area_sq_mi: 141.0
      period: water years 2008-2020
      regulation: unregulated
      citation: USGS SIR 2024-5075 appendix 1 table 1.1 (sir20245075_app1_table1.1.csv), station 04188337,
        April-March 7-day 10-year — 1-day 0.02, 7-day 0.03, 30-day 0.35, 90-day 1.3; harmonic mean 2.99
        ft3/s. Regulation status from that report's table 1.
      note: 'The load-bearing cross-check: a MODERN (WY2008-2020), continuous, published, and third-party-classified
        UNREGULATED Blanchard gage reads 0.03 cfs. So the 8.67 cfs derived 40 mi downstream over an overlapping
        window is not the same river measured better — it is a different, managed quantity.'
    - gage: 04188496
      gage_name: Eagle Creek above Findlay OH
      seven_q10_cfs: 0.0
      drainage_area_sq_mi: 51.0
