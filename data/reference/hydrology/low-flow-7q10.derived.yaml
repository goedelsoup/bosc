meta:
  subject: DERIVED receiving-stream 7Q10s for the major mainstems of the network's river basins
  source: USGS NWIS daily discharge -> log-Pearson III (watermark.hydrology.lowflow_frequency)
  discipline: DERIVED screening denominators (source=derived), NOT cited regulatory 7Q10s — those live
    in low-flow-7q10.yaml. Each value is the 7Q10 AT THE GAGE, a proxy for a direct-discharge reach on
    that mainstem; a discharger on a tributary is screened only against that tributary's own cited/derived
    7Q10, never this one. Regenerate with `watermark derive-low-flows`.
  cited_annotations: 'An entry''s `published` / `regulation` / `cross_check_gages` blocks (and the `confidence_reason`
    a regulated gage carries) are NOT derived — they are copied verbatim from the curated data/reference/hydrology/mainstem-gages.yaml
    so a screening denominator is never read without the published statistic beside it (#1458). Edit them
    THERE, not here; this file is regenerated. `regulation.status: regulated` is what demotes an entry''s
    confidence to `low` — the gage is measuring managed flow (storage releases, diversions, upstream effluent),
    not the stream''s own assimilative capacity, and where the gage sits BELOW the outfall being screened
    it is partly measuring that discharge itself.'
