      low` entry admitted under that file''s verified-negative exception (Ohio EPA computed no low flow
      for this reach at all), with the 1952-1974 record period stated in its citation so the asof vintage
      discipline (#1644) is satisfied by DISCLOSURE rather than by omission. Nothing changes HERE: this
      table drives the derived at-gage mainstem proxies, and 03244000 is still absent from it — its record
      predates the 1980 derivation window, and a 219 mi² at-gage value is not the 9.0 mi² outfall reach.
