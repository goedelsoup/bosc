# Reach geometry + contributing subcatchments for storm-hydrograph routing.
#
# The companion to network.yaml (which is TOPOLOGY only — a magnitude-free directed
# graph). Storm-hydrograph routing (watermark.hydrology.hydrograph_routing) needs two
# magnitudes the topology deliberately omits:
#
#   catchments:  per contributing (headwater) node — the subcatchment that generates a
#                design-storm runoff hydrograph (area, curve number, time of concentration),
#                fed to watermark.hydrology.solver.runoff.simulate_runoff.
#   reaches:     per node's downstream edge — the trapezoidal channel the node's hydrograph
#                is routed through (length, slope, optional geometry), fed to
#                watermark.hydrology.solver.routing.route (constant-parameter Muskingum-Cunge).
#
# Keys are network.yaml node ids. A node absent from `reaches` is a pass-through (its
# inflow leaves unrouted — outfalls that sit AT a confluence, and the terminal outlet). A
# node absent from `catchments` contributes no storm inflow of its own (the WWTP outfalls:
# their flow is continuous EFFLUENT, modeled by the steady-state network, not a storm event).
#
# DISCIPLINE (Tier-0 screening; every value carries its own provenance tag):
#   * area_acres for pike-run-head is DERIVED from the committed WBD HU12 polygon
#     (wbd/041000070404-pike-run.geojson, 34.28 km²); ottawa-head from the WBD HU10
#     (wbd/0410000704-middle-ottawa-river.geojson, 272.53 km²). dug-run-head has no committed
#     delineation, so its area is a stated ASSUMPTION scaled to Pike Run's order.
#   * Reach lengths for the tributaries are DERIVED by Hack's law L(km)=1.4·A(km²)^0.6 on the
#     WBD HU area (a standard main-channel-length estimator, fully reproducible); the mainstem
#     reach splits and every slope/geometry are stated ASSUMPTIONS with a basis (gentle
#     glaciated-till-plain gradients, a wide mainstem vs. narrow tributary ditches).
#   * CN and Tc are stated screening ASSUMPTIONS consistent with the campus storm chain
#     (pre-development mixed row-crop CN≈74; the urbanizing Pike Run campus catchment CN≈80).
#
# CAVEAT (recorded, not hidden): the three catchments are independent screening contributing
# areas, NOT a partitioned delineation — the Ottawa HU10 nominally contains the Pike/Dug
# HU12s, so the NAIVE SUMMED peak double-counts them. That only makes the un-routed sum a MORE
# conservative baseline, which strengthens (never inflates) the routed-vs-summed attenuation
# the model reports. The headline is the attenuation+lag of routing, not an absolute peak.

meta:
  subject: Reach geometry + contributing subcatchments for Tier-0 storm-hydrograph routing (Lima loop)
  tier: tier0
  method: >-
    Muskingum-Cunge channel routing of SCS design-storm hydrographs down the cited network.yaml
    confluence graph. Tributary reach lengths via Hack's law on the committed WBD HU areas; CN/Tc
    and slopes are stated screening assumptions.
  caveats:
    - "Catchments are independent screening contributing areas, not a partitioned delineation; the summed (un-routed) peak conservatively double-counts the nested tributaries."
    - "Only confluence ORDER and reach geometry are modeling choices; the attenuation+lag headline is robust to the absolute areas."
    - "Not a calibrated HEC-HMS/HEC-RAS model — Tier-0 screening only."

