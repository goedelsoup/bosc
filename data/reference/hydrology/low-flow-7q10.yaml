# Cited receiving-stream design low flows (7Q10) from Ohio EPA NPDES fact sheets.
#
# The 7Q10 — the lowest 7-day average streamflow expected once in 10 years — is the
# design low flow Ohio EPA uses to set chronic water-quality-based effluent limits
# (the denominator of assimilative capacity). Every value here is read directly from
# an Ohio EPA NPDES fact sheet in our own corpus (data/documents/oepa/*) and tagged
# `source: document`. Streams we cannot yet cite are OMITTED, not guessed — the
# assimilative check reports them as "no cited 7Q10" rather than invent a number.
#
# Key insight these numbers carry: the plants on tiny tributaries discharge MORE than
# the streams' entire 7Q10 low flow — at design low flow the effluent is effectively
# undiluted. The fact sheets say so themselves (American II's stated acute dilution
# ratio is 1.3 to 1; Van Wert's is 1.02 to 1 — more extreme).
#
# Basin-wide companion: `low-flow-7q10.derived.yaml` holds DERIVED (LP3, source=derived)
# 7Q10s for the major USGS-gaged Maumee mainstems, used by `bosc basin-screen` to extend
# this screen beyond Lima. Those are screening proxies (gage value, not the discharge
# reach), never a substitute for a cited fact-sheet 7Q10 here.
#
# ── `permits:` — a fact-sheet low flow is PERMIT-scoped, not river-scoped (#1458) ────────────
# Ohio EPA computes the design low flow AT THE OUTFALL. So one river can carry several cited
# 7Q10s that are all correct and none interchangeable: on the Blanchard, the regulator states
# 0.21 cfs at Findlay's outfall (RM 56.42) and 7.78 cfs at Ottawa's (RM 22.1) — 37x apart, 34
# river-miles apart, from different gages over different record periods. A lookup keyed only by
# receiving-water NAME cannot hold that (and worse, `_normalize` deliberately strips "at …", so
# "Blanchard River at River Mile 56.42" and the bare river collapse to the same key). An entry may
# therefore declare `permits:` — the permit and application ids the value is binding for — and the
# basin screen prefers a permit match over any name match for that facility.
#
# Rules, because this is the seam where a permit figure could silently become a river figure:
#   * A `permits:` entry is keyed by REACH, not by river, and its key is chosen so it can never
#     collide with the bare river name the derived screening proxy owns.
#   * The value binds ONLY to the listed permits. It is never applied to another discharger on the
#     same river, and never to a routed-network reach (`watermark.hydrology.network` resolves base
#     flows by stream name and does not read the permit index — a reach is not a permit).
#   * Never compare two at-outfall statistics as if they measured the same thing unless they were
#     computed the same way. Findlay's and Ottawa's are not: see
#     `data/reference/network/findlay-ottawa-comparison.yaml`.

