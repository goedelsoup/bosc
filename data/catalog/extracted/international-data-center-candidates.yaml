notes: >-
  Track A of epic #1387 — the seeded, priors-driven half of the imagery-led identification funnel,
  and a DISTINCT ARTIFACT CLASS from the domestic discover-and-pin registers
  (watermark.facility.candidate): it is never merged with them and mints no SiteProfile. Every
  entry is [reference] — it relays what published third-party registers say — and NOTHING here can
  be [verified]: the tag is a computed field derived from DetectionBasis and no basis maps to
  verified. [inference] is reserved for the screening (#1391) and vision-adjudication (#1392)
  stages, which have not run, so no entry carries a cooling type or a satellite scene id. A cluster
  is corroborated when two INDEPENDENT sources place a facility within a stated 250 m; at most one
  row per register joins a cluster, because each register deduplicates itself and distance alone
  merged a Dublin business park into a single "candidate" with five different operators. Operator
  attribution is cited or [open], and where the registers name different operators the entry is
  `contested` and publishes both claims rather than resolving to whichever source ranks higher.
  Negative and thin AOIs are recorded as results with their raw per-source counts — Johor's 75
  mapped buildings against 6 interconnection rows is the PeeringDB blind spot (single-tenant
  campuses with no carrier presence) made visible, not a data error. Regenerate with
  `watermark candidates`; never hand-edit either file, and note that a derived field hand-edited
  into the YAML is dropped and recomputed on load.
