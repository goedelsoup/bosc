notes: >-
  Issue 1460 (under epic 1265); closes issue 352. Three permits-npdes rows plus one permits-epa row.
  The fact sheet is the anchor: outfall 2PD00008001 to the Blanchard River at RIVER MILE 56.42, HUC
  04100008-03-04, Table 12 annual 7Q10 of 0.21 cfs against a 23.208 cfs (15 MGD) design flow, and an
  acute dilution ratio of 1.0 computed by Ohio EPA itself — at design flow the river below the
  outfall IS the effluent. Those values populate _FINDLAY.plant_receiving and, with general permit
  OHP000001 and the January 2026 variance list as corroborators, drive the committed ECHO
  receiving-water correction for OH0025135
  (data/reference/echo/curation/maumee-wwtp.receiving-water.yaml). TWO CAVEATS TO CARRY. (1) The
  cited 0.21 cfs is ~41x smaller than the network's derived Blanchard 7Q10 of 8.67 cfs at gage
  04189000, so the findlay-ottawa-comparison screen of 2.68x is really ~110x; reconciling the two is
  issue 1458 and is deliberately NOT done here. (2) The Ohio DAM's permits/doc slot serves the
  MODIFIED package, not the 2024 *UD renewal it modified, so the *UD permit as issued is not among
  the committed bytes and its term (effective 2024-11-01, expires 2029-10-31) is recorded from the
  variance list instead — lead UD-ISSUANCE-BYTES. The allocation record carries the finding that a
  plant discharging 4.8-5.5 MT of spring phosphorus against a 3.2 MT wasteload allocation in every
  reported year (2017-2021) is nonetheless in compliance, because OHP000001 Part IV.C.3 makes an
  individual exceedance a violation only when the 39-facility cumulative load also breaches its cap
  — and in 2024 the group reported 43,304 kg against 64,170 kg. Open threads in
  data/site/findlay/leads.yaml (CSO-LTCP-2026-11-01, TP-SEASON-REPORTS, UD-ISSUANCE-BYTES,
  MERCURY-VARIANCE-RENEWAL).
