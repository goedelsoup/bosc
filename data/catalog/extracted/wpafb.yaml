notes: >
  WPAFB groundwater screen scaffold (2026-07-02, #463) — the defining WPAFB receiving-water
  dimension. WPAFB's water risk is groundwater, not surface 7Q10: the Great Miami / Mad River
  Buried Valley sole-source aquifer (Dayton + WPAFB well fields) + a documented TCE/PFAS plume on
  the same drinking-water aquifer. Both claims are currently [inference]/[reference] with NO primary
  cited source — this doc pins each to the primary instrument that must verify it (EPA SSA
  designation; AF IRP/CERCLA administrative record; DoD PFAS/AFFF; ATSDR; OEPA) and defines the
  buried-valley + plume overlay as a new analysis dimension the surface Tier-0 tools do not cover.
  Both claims stay to-verify, not findings, until cited.
