notes: >
  WPAFB groundwater primary-record dataset. The defining WPAFB receiving-water dimension is
  groundwater, not surface 7Q10: the Great Miami / Mad River Buried Valley sole-source aquifer
  (Dayton + WPAFB well fields) + a documented TCE/PFAS plume on the same drinking-water aquifer.
  Originally scaffolded as a to-verify screen (2026-07-02, #463); the #1397 ingest RESOLVED the two
  load-bearing claims with primary agency records — ssa-53fr15876.epa.yaml [verified: 53 FR 15876,
  FRL-3369-5, SDWA 1424(e), signed 1988-04-14] designates the sole-source aquifer, and
  cercla-ffa-1991.epa.yaml [verified: CERCLA §120 FFA; NPL 1989-10-04, 54 FR 41021] places the
  VOC/PFAS plume on that same aquifer. These two classified permits-epa records flip the site's
  record domain to LIVE at export. Supporting: the Dayton 2025 CCR finished-water PFAS table (Ottawa
  plant PFOS/PFHxS exceed the 2024 MCLs) + USGS SIR 2023-5017 / 2021-5115 and the ATSDR dated-negative
  (groundwater-corroboration.md). Deferred to the #464/#463 verification/watch tasks: the OEPA NPDES
  fact sheets, WPAFB's own NPDES permits, the 2025 PFAS NPDWR notification, and the 2024-12-16 EI
  revocation letter.
