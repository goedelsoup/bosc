  source: >-
    Five independent routes run 2026-08-05 for issue 1407. (1) THE CITY — the open WordPress REST
    media index at vanwert.org (298 attachments enumerated), which is the archive behind the
    rolling /ordinances/ window; every council minute and ordinance uploaded since the 2026-05-11
    Mega Site vote was downloaded and read, and four were committed to
    data/documents/van-wert/council/ (the approved minutes of 2026-05-27, 2026-06-08 and
    2026-07-13, plus the private-well ordinance 26-06-034). All are image-only scans with a
    zero-character text layer, so every quotation was read via watermark.civic.indexer.ocr_pdf at
    300 DPI and re-read at 450 DPI before being written down; the 2026-07-13 approval page was
    verified VISUALLY (typed "Approved on: July 27, 2026" over wet-ink signatures). (2) THE COUNTY
    — the Board of Commissioners' published 2026 agenda index, one page carrying all 63 meeting
    dates from 2026-01-01 to 2026-08-06, captured to data/documents/van-wert/county/. (3) THE
    SCHOOL DISTRICT — Lincolnview Local's BoardDocs portal (go.boarddocs.com/oh/lls), meeting list
    and full agendas read by POST without auth for all twelve 2026 meetings. (4) THE STATE — the
    Ohio Tax Credit Authority's minutes for 2026-06-01 and 2026-06-29 pulled from the Ohio DAM and
    committed to data/documents/odd/tca/, the committed ODD tax-incentive export
    (data/reference/odd/tax_incentives.csv, pulled 2026-06-28) queried directly, and the
    Governor's 2026-05-27 pause notice captured to data/documents/odd/. (5) THE OPERATOR — a raw
    capture of q.com/data-centers/van-wert to data/documents/van-wert/operator/.
