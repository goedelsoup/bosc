id: bowling-green-grid
title: Bowling Green — Grid Posture (two grids, the Toledo Edison sheets, the pending FirstEnergy DCT, the muni island)
scope: extracted
status: reviewed
producer:
  kind: manual
  source: >-
    Two newly captured documents plus three unblocked machine routes. DOCUMENTS: The Toledo
    Edison Company's whole filed retail tariff, P.U.C.O. No. 8, Schedule of Rates for
    Electric Service (168 pp, Table of Contents effective 2026-07-01, most sheets filed
    pursuant to Orders dated 2025-11-19 and 2026-02-18 in Case No. 24-0468-EL-AIR),
    retrieved 2026-08-05 from FirstEnergy's own Ohio tariff library; and the Edison
    Electric Institute's "Large Load Projects and Tariffs (July 2026)" compilation (16 pp,
    self-dated "Updated July 17, 2026"), held for the one fact it carries that no primary
    route would yield — the docket number of the pending FirstEnergy data-center tariff.
    Both committed under data/documents/grid/bowling-green/ with sha256s in that dir's
    filename-map.yaml. MACHINE ROUTES: EIA Form 860M (Preliminary Monthly Electric
    Generator Inventory, June 2026 edition, sha256 47d28a1e…3072) read programmatically for
    every generator in Wood County across its Operating, Planned, Retired and Canceled
    sheets, and searched whole-workbook for the Apollo project; the City of Bowling Green's
    own ArcGIS server (gis.bgohio.org, PublicData/UtilitiesWithZoning) queried for its
    electric-distribution, substation, municipal-boundary and current-zoning layers; and the
    Wood County Auditor's Vision/CAMA parcel service for the geometry those queries run
    against. Three regulatory forums were probed and recorded as blocked or limited rather
    than empty — PUCO DIS, the Ohio Supreme Court's docket, and the PJM queue.
license: Public record (a filed retail tariff, a federal statistical dataset, two public GIS services) plus one trade-association compilation
