  source: >-
    Two primary instruments plus three federal systems. Ohio EPA NPDES permit 2PD00006*WD /
    application OH0027910 — the modification package as issued (action date 2026-05-18, Public
    Notice 221593, entered the Director's Journal 2026-06-30, effective 2026-07-01, expires
    2030-05-31; a composite of the Director's transmittal letter, the 47-page modified permit and
    the modification's own 8-page Fact Sheet) and its draft public notice from the DAM's DraftPN
    slot — both fetched from the Ohio EPA DAM 2026-08-01
    (data/documents/oepa/van-wert/filename-map.yaml). Ohio EPA re-serves the `permits/doc/` slot
    IN PLACE on modification, so the same URL that delivered the *VD renewal in June 2026
    delivers the *WD package now; both sets of bytes are held and the manifest is keyed on URL
    plus sha256. Both permit: blocks are the pipeline's six-page read with header fields CORRECTED
    on review from the fact sheet bound inside the same PDF; the superseded extractor warnings are
    preserved in each file. The water-watch digest additionally reads EPA ECHO
    (dfr_rest_services.get_dfr for OH0027910, OH8100611 and OH0135569;
    sdw_rest_services.get_systems over Van Wert County OH for the public-water-system index) read
    2026-08-01 against ICIS-NPDES extract 2026-07-24 and SDWIS extract 2026-07-09, and USGS NLDI /
    NHDPlus v2 (linked-data/comid/position plus upstream/downstream navigation) snapped 2026-08-01
    to establish that the intake, the five CSOs and the outfall share one flowline and in what
    order.
