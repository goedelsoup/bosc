notes: >-
  Issue 1406 (under epic 1267). THINGS TO CARRY. (1) VAN WERT DRINKS THE CREEK IT DISCHARGES TO,
  and this is the network's tightest shared-reach case — the inverse of Bowling Green, whose two
  water sides share a city and nothing else. Snapped to NHDPlus v2, the water plant (OHG8P0006 /
  OH0135569), the five CSO outfalls and the WWTP outfall 001 (RM 13.87, 40.8882410 N /
  -84.58437518 W) all fall on ONE 17.05 km flowline, COMID 15653063, running south to north, in
  that order. The intake side is UPSTREAM — nobody drinks this plant's effluent — but PWS
  OH8100611 is the only surface-water public water system in the county and the City's own
  utilities page says the water "comes from Town Creek." Its reservoirs hold 1.01 BG against a
  creek whose recorded annual yield since 1951 runs 180 MG to 1.26 BG, a 7x spread; any new
  municipal demand is a claim on that buffer, not on an average. (2) THE MODIFICATION IS A
  CONSTRUCTION SCHEDULE. Its whole operative act is to put four CSO control projects (Blaine St.
  interceptor, Town Creek siphon, Bonnewitz pump-station weir, raising the CSO 010 weir six
  inches) on dated, event-coded milestones — begin construction 2026-08-01, operational
  2027-01-01, 24-month PCCM 2027-03 to 2029-03, completion evaluation 2029-06-01 — after the 2022
  LTCP Completion Evaluation Report found the 1999 plan's four-events-per-typical-year goal
  unattained. Limits, the mercury variance and the design flow are untouched. (3) THE COMPLIANCE
  COUNT IN THE ISSUE BODY IS WRONG AND THE CORRECTION MATTERS: it is 12 of the THIRTEEN quarters
  ECHO displays, not 12 of 12 — 2023-Q4 reads "No Violation Identified", and ECHO's own QtrsInNC
  of 12 reconciles to the 13-quarter grid, not to the 12-quarter window it is stamped against.
  (4) THE DRIVER IS NOT EFFLUENT. Effluent exceedances are intermittent (E. coli, phosphorus, TSS,
  acute and chronic toxicity, two pH limit violations). What runs UNBROKEN from early 2024 to the
  current quarter is three permit-schedule events — CSO Event Report, O&M Report, Combined Sewer
  Report — each recorded "Schedule Event unachieved and not reported," against zero formal
  enforcement actions and $0 in penalties. The 2026-08-01 construction milestone is the first
  testable date on the same permittee's record. (5) THE PERMIT DOES NOT NAME OHP000001. Part II.AE
  routes the 1,000 kg critical-season (March-July) total-phosphorus wasteload allocation from the
  September 2023 Maumee Watershed Nutrient TMDL to "the Maumee Watershed Total Phosphorus NPDES
  General Permit" by TITLE ONLY; binding that to the corpus's OHP000001 is our identification, not
  the instrument's. Held at its own 15 kg/day monthly-average loading limit across the 153-day
  season the individual permit would allow 2,295 kg, 2.30x the allocation — which is why the
  condition defers to the general permit and carries a reopener. (6) THE INSTRUMENT NAMES THE
  WRONG FACILITY: Part II.AE reads "under which Defiance Van Wert WWTP has been granted coverage."
  Defiance is a different city ~40 river miles downstream with its own WWTP. Boilerplate carried
  over unedited and printed verbatim in an issued permit. (7) THE ISSUED PERMIT ENFORCES A PLAN IT
  DOES NOT RECORD AS APPROVED: Part I.C.1 prints the literal placeholder "[approval pending]"
  where the Compliance Assistance Plan's approval date belongs, and the permit and its own bound
  fact sheet give TWO different submission dates for that plan (2025-07-24 vs 2026-02-02). Both
  preserved as printed; which is operative is [open]. (8) THE CSO PUBLIC-ACCESS-AREA TABLE IS
  EMPTY — "None were identified in the 2018 - CSO Notification Plan" — for five overflows into a
  creek that ATTAINS lists as 303(d)-impaired for pathogens with recreation use Not Supporting.
  Recorded as a cited absence, not as evidence of absence. (9) The mercury variance is RENEWED,
  not resolved: an achievable annual average of 12 ng/L against a 1.3 ng/L water-quality-based
  limit, roughly 9x, answered with a pollutant minimization program dating to a 2007 application.
  (10) Two further NPDES instruments sit on this same reach and are NOT in the corpus — OHG8P0006
  (the water plant's general-permit discharge) and OH0135569 (an individual permit at the water
  plant address carrying a CSO area flag). Seven named instruments to pull are itemized in the
  digest's own `instruments_to_pull` block, led by whether construction actually began on
  2026-08-01 and where the raw-water intake physically is. (11) ISSUE 1860 PULLED THE EFFLUENT
  CHART THAT REFUSED ON 2026-08-01, AND THE MEASURED LOAD INVERTS ITEM (5). The plant's own
  reported March-July phosphorus loading is 692.7 kg (2023), 662.9 kg (2024) and 821.1 kg (2025)
  against the TMDL's 1,000 kg individual allocation — 0.69x, 0.66x and 0.82x, all UNDER it, with
  the worst month in forty-two at 6.63 kg/day against a 15 kg/day limit. The 2.30x figure in item
  (5) describes what the PERMIT would allow across the season, not what the plant discharged; both
  are kept, because the ceiling is why Part II.AE defers to the general permit and the measured
  load is the answer the ceiling cannot reach. The trend is up (0.69 to 0.66 to 0.82) and 2026
  stands at 519.3 kg through June, which cannot reach 1,000 kg without July also breaching the
  permit's own loading limit. Both DFR-reported TP exceedance quarters pin to SEPTEMBER (2023 and
  2025) — outside the March-July critical season, concentration-only, in the two lowest-flow
  months on record. (12) THE CSO PRE-CONSTRUCTION BASELINE NOW EXISTS: 23 reported overflow-months
  across the five outfalls, 2023-01 to 2026-06, with per-outfall counts (16 / 8 / 6 outfall-events
  in 2023 / 2024 / 2025 and ELEVEN in the first six months of 2026) and volumes in Mgal. Only a
  FLOOR on volume is derivable — the DMR reports a monthly average and a daily maximum but no
  monthly total, and the report that carries the total is the same CSO Event Report unfiled since
  2024. No verdict is offered against the LTCP's four-events goal, because a "typical year" is a
  modeled design year and not a calendar one. (13) A UNIT TRAP WORTH CARRYING NETWORK-WIDE: ECHO's
  `DMRValueStdUnits` for parameter 74063 is wrong by 1e12 (it divides by a million where it should
  multiply — 1.656 Mgal published as 0.00000166 "gal"), confirmed on Lima OH0026069 as well as
  here; read `LimitUnitDesc`. 74062 is reported in occur/mo, a monthly count, which ECHO rescales
  to a meaningless occur/d. (14) THE PLANT RUNS PAST ITS PRIMARY TREATMENT IN MOST WET MONTHS.
  Outfall 001's reported daily-maximum flow crossed the 5 MGD primary-clarifier bypass threshold
  the fact sheet describes in 22 of 42 months, and the permit's own 8.0 MGD peak hydraulic capacity
  in five. Not a violation — flow is report-only and the bypass is described as existing practice —
  which is the point: nothing in the *WD modification is addressed to it, the schedule it created
  being aimed at the collection system instead.
