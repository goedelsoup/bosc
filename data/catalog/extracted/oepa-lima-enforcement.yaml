notes: "The enforcement half of the Lima WWTP record, kept separate from the permit extractions in `oepa`\n\
  (NPDES permits, fact sheets, public notices) because these instruments impose obligations rather\nthan\
  \ authorising a discharge, and are read by the enforcement group rather than the permit feed.\n\nThe\
  \ spine now runs 1994 → 2026 and is continuous:\n\n  1994-02-25  DFFO (Ohio EPA)          27 unpermitted\
  \ SSO points documented 1992-05 → 1993-05, of\n                                       36 known; General\
  \ Plan ordered by 1995-02-25\n  2005-02-07  Administrative Order     U.S. EPA Region 5, Docket V-W-05-AO-08,\
  \ CWA §§308/309(a);\n              (U.S. EPA)               36 numbered SSO discharge points; SSO Elimination\
  \ Plan\n  2015-01-13  Consent decree           Case 3:14 CV 2551 (N.D. Ohio); Table A.1 runs to 2038,\
  \ final\n              (U.S. + Ohio)            post-construction compliance report 2043-12-31\n  2016\
  \        NOV / ROV / IPIR burst   the enforcement activity around the headworks construction\n  2026-07-16\
  \  NOV (Ohio EPA DSW)       effluent-limit violations for low level mercury, E. coli,\n            \
  \                           TSS, dissolved oxygen, pH-minimum, CBOD5 and ammonia, with\n           \
  \                            the City in SIGNIFICANT NONCOMPLIANCE (SNC) for ammonia\n\n⚠️ The portal's\
  \ doc_type is a FILING DRAWER, not a genre, and it disagreed with the document in\nfive of these sixteen:\
  \ two rows typed \"NOV\" are the City's replies to one, a row typed\n\"Investigation Report\" is itself\
  \ an NOV, and two typed \"Judicial Order\" are City of Lima letters.\nEvery `instrument` here was read\
  \ from the document.\n\n⚠️ TWO OF THESE SIXTEEN ARE NOT LIMA EVIDENCE. Ohio EPA's portal indexes both\
  \ under permit\n2PE00000, so a permit-scoped sweep returned them, but neither concerns Lima:\n\n  edoc-3063821\
  \  MANSFIELD WWTP, Richland County — its own reference block reads \"Mansfield WWTP /\n            \
  \    Correspondence / NPDES / Richland County / 2PE00000\": Mansfield's plant, Mansfield's\n       \
  \         county, LIMA's permit number.\n  edoc-3296496  RAILTECH, 25 Interstate Drive, NAPOLEAN [sic],\
  \ HENRY County — an Emergency Response\n                Initial Pollution Incident Report for a glycol\
  \ release, spill id 1607-35-1349110,\n                citizen-reported 2016-07-13. The IPIR itself names\
  \ no permit at all.\n\nBoth extractions are shelved here because the extracted tree mirrors its immutable\
  \ source and the\nportal served these docids under Lima's permit. Read the shelf as CUSTODY, not attribution;\
  \ each\nartifact's own warnings say so. `permit_no: 2PE00000` on edoc-3063821 is AS PRINTED and IS the\n\
  error — correcting it would destroy the evidence that the misfiling happened.\n\nThat two of sixteen\
  \ were other facilities' records is itself a finding about this source: a\npermit-scoped portal sweep\
  \ is not a permit-scoped result set, and every document one returns must be\nREAD before it is attributed.\
  \ Mansfield is a registered site in this network; raised as a follow-up\nrather than acted on, because\
  \ moving a source byte is what the chain-of-custody rule forbids.\n\nThe 30 inspections are now read,\
  \ under the `inspection` genre added for them (#2077). They are 30\nCAPTURES OF 18 DISTINCT INSPECTIONS:\
  \ the portal serves most of this plant's inspections twice, once\nas a PDF with a text layer and once\
  \ as a scan of the same letter, at two unrelated docids. None of\nthe pairs is byte-identical, so all\
  \ twelve are declared `v2` clusters in\n`data/site/document-versions.yaml` with the TEXT-LAYER capture\
  \ canonical — a scan is read by the\nvision path alone with nothing to check itself against, and several\
  \ pairs disagreed.\n\nThe agency's own `Sig. Non-Compliance` box, where a report form is attached:\n\
  \n  2016-2019   False on every inspection that carries the box\n  2022-02-22  TRUE  — compliance evaluation\
  \ inspection\n  2026-07-07  TRUE  — compliance evaluation inspection, and the NOV nine days later\n\
  \              (edoc-4192703) names the parameter: SIGNIFICANT NONCOMPLIANCE FOR AMMONIA\n\nStill ingested\
  \ and NOT yet extracted — 46 of the 93:\n  36  permit actions (`Permit - Intermediate`) — heterogeneous:\
  \ issued NPDES permits 2PE00000*MD /\n      *ND / *PD, draft public notices, a fact sheet, modification\
  \ approvals, a mercury variance\n      application, a 2013 City ordinance, the 2022 renewal application\
  \ package APP256207483, and\n      a run of City/agency correspondence. Genre is per-document, not per-drawer.\n\
  \   1  `edoc-2363112.pdf` — NEVER to be extracted. Byte-identical (sha256 b140e19c5e26) to\n      `oepa/2PE00000.pdf`,\
  \ which is already extracted as `oepa/2PE00000.npdes.yaml`. Recorded as a\n      cluster in `data/site/document-versions.yaml`.\n\
  \   9  paragraph-33 semiannual progress reports — NO GENRE FITS. A progress report reports AGAINST\n\
  \      obligations rather than imposing them; extracting one as an `order` would publish a\n      near-duplicate\
  \ of the decree. Needs a model, like `inspection` did.\n"
