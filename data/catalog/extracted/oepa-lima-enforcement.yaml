notes: "The enforcement half of the Lima WWTP record, kept separate from the permit extractions in `oepa`\n\
  (NPDES permits, fact sheets, public notices) because these instruments impose obligations rather\nthan\
  \ authorising a discharge, and are read by the enforcement group rather than the permit feed.\n\nThe\
  \ spine now runs 1994 → 2026 and is continuous:\n\n  1994-02-25  DFFO (Ohio EPA)          27 unpermitted\
  \ SSO points documented 1992-05 → 1993-05, of\n                                       36 known; General\
  \ Plan ordered by 1995-02-25\n  2005-02-07  Administrative Order     U.S. EPA Region 5, Docket V-W-05-AO-08,\
  \ CWA §§308/309(a);\n              (U.S. EPA)               36 numbered SSO discharge points; SSO Elimination\
  \ Plan\n  2015-01-13  Consent decree           Case 3:14 CV 2551 (N.D. Ohio); Table A.1 runs to 2038,\
  \ final\n              (U.S. + Ohio)            post-construction compliance report 2043-12-31\n  2016\
  \        NOV / ROV / IPIR burst   the enforcement activity around the headworks construction\n  2026-07-16\
  \  NOV (Ohio EPA DSW)       effluent-limit violations for low level mercury, E. coli,\n            \
  \                           TSS, dissolved oxygen, pH-minimum, CBOD5 and ammonia, with\n           \
  \                            the City in SIGNIFICANT NONCOMPLIANCE (SNC) for ammonia\n\n⚠️ The portal's\
  \ doc_type is a FILING DRAWER, not a genre, and it disagreed with the document in\nfive of these sixteen:\
  \ two rows typed \"NOV\" are the City's replies to one, a row typed\n\"Investigation Report\" is itself\
  \ an NOV, and two typed \"Judicial Order\" are City of Lima letters.\nEvery `instrument` here was read\
  \ from the document.\n\n⚠️ TWO OF THESE SIXTEEN ARE NOT LIMA EVIDENCE. Ohio EPA's portal indexes both\
  \ under permit\n2PE00000, so a permit-scoped sweep returned them, but neither concerns Lima:\n\n  edoc-3063821\
  \  MANSFIELD WWTP, Richland County — its own reference block reads \"Mansfield WWTP /\n            \
  \    Correspondence / NPDES / Richland County / 2PE00000\": Mansfield's plant, Mansfield's\n       \
  \         county, LIMA's permit number.\n  edoc-3296496  RAILTECH, 25 Interstate Drive, NAPOLEAN [sic],\
  \ HENRY County — an Emergency Response\n                Initial Pollution Incident Report for a glycol\
  \ release, spill id 1607-35-1349110,\n                citizen-reported 2016-07-13. The IPIR itself names\
  \ no permit at all.\n\nBoth extractions are shelved here because the extracted tree mirrors its immutable\
  \ source and the\nportal served these docids under Lima's permit. Read the shelf as CUSTODY, not attribution;\
  \ each\nartifact's own warnings say so. `permit_no: 2PE00000` on edoc-3063821 is AS PRINTED and IS the\n\
  error — correcting it would destroy the evidence that the misfiling happened.\n\nThat two of sixteen\
  \ were other facilities' records is itself a finding about this source: a\npermit-scoped portal sweep\
  \ is not a permit-scoped result set, and every document one returns must be\nREAD before it is attributed.\
  \ The next tranche from this portal will have the same property.\n\nTHE ATTRIBUTION IS NOW DECIDED,\
  \ AT THE READ LAYER, WITHOUT MOVING A BYTE (#2085). Both artifacts\nstay exactly where they are; `data/corpus-attribution.yaml`\
  \ — a reviewed, document-cited overlay —\ndeclares what each one is about, and `watermark.sites.effective_corpus_scope`\
  \ folds it into the\nsite's `CorpusScope` as an exact-relpath grant or subtraction. Every surface that\
  \ funnels through\n`relpath_in_scope` therefore agrees by construction: export, timeline, entities,\
  \ the\nrecords/documents feeds, retrieval, the agent read tools.\n\n  edoc-3063821  → site:mansfield.\
  \  Mansfield is a registered site with its own committed record\n                  under oepa/mansfield/,\
  \ so the letter has a destination. It leaves Lima's\n                  chronology and joins the record\
  \ of the plant it is actually about.\n  edoc-3296496  → no registered site.  Henry County is not a watershed\
  \ point in this network, so\n                  there is nowhere to route it. It leaves Lima's scope\
  \ and is claimed by none.\n\n`attributed_to: null` is an ANSWER, not a gap, and it is not a deletion:\
  \ the artifact stays\ncommitted, catalogued and citable, and the overlay row is where it stays visible\
  \ — every row is\nheld to a real committed artifact by `tests/test_corpus_attribution.py`, so an unattributed\n\
  document can never become the silent drop of #1994. What changed is only the assertion: neither\ndocument\
  \ is presented as Lima's record, because neither is.\n\nThe signal is STRUCTURED and REVIEWED. Nothing\
  \ is inferred from a filename, a permit number, or a\n⚠️ in a warning string — filtering on prose is\
  \ the loose predicate `_classify`'s docstring argues\nagainst, and an attribution is a stronger claim\
  \ than a classification. Correspondingly, nothing was\nrepaired in the sources: no byte moved, no filename\
  \ changed, and `permit_no: 2PE00000` on\nedoc-3063821 still reads AS PRINTED.\n\nThe 30 inspections\
  \ are now read, under the `inspection` genre added for them (#2077). They are 30\nCAPTURES OF 18 DISTINCT\
  \ INSPECTIONS: the portal serves most of this plant's inspections twice, once\nas a PDF with a text\
  \ layer and once as a scan of the same letter, at two unrelated docids. None of\nthe pairs is byte-identical,\
  \ so all twelve are declared `v2` clusters in\n`data/site/document-versions.yaml` with the TEXT-LAYER\
  \ capture canonical — a scan is read by the\nvision path alone with nothing to check itself against,\
  \ and several pairs disagreed.\n\nThe agency's own `Sig. Non-Compliance` box, where a report form is\
  \ attached:\n\n  2016-2019   False on every inspection that carries the box\n  2022-02-22  TRUE  — compliance\
  \ evaluation inspection\n  2026-07-07  TRUE  — compliance evaluation inspection, and the NOV nine days\
  \ later\n              (edoc-4192703) names the parameter: SIGNIFICANT NONCOMPLIANCE FOR AMMONIA\n\n\
  The permit lifecycle is now read (#2078). One permit, four versions, 2013 to 2023:\n\n  2PE00000*MD\
  \  issued 2012-12-12, effective 2013-01-01  (edoc-3187291, 106pp)\n  2PE00000*ND  issued 2018-07-31,\
  \ effective 2018-08-01  (edoc-2710532, 94pp; draft PN edoc-2710555)\n  2PE00000*OD  action  2023-06-02,\
  \ effective 2023-07-01  (fact sheet edoc-2363111; the permit\n               itself is `oepa/2PE00000.npdes.yaml`,\
  \ already extracted from the DAM copy)\n  2PE00000*PD  proposed 2023-07-28                       (edoc-2479810)\n\
  \nplus seven permit ACTIONS (modification approvals, \"no permit required\" determinations, the 2026-08-04\n\
  modification) and the 2022 renewal application behind *OD.\n\n⚠️ THE 2022 APPLICATION CONTRADICTS THE\
  \ CONSENT DECREE ON THE DESIGN STORM. `edoc-1840393` (EPA Form\n3510-1, Application ID 256207483, Section\
  \ II.G.1) tells Ohio EPA that all SEVEN SSO basin projects are\n\"sized to convey 25 year, 6 hour storm\"\
  . The decree's Appendix A Table A.1 sizes only three that way\nand sizes Lost Creek, COLE ST., Findlay\
  \ Road and Fifteenth St. to a 5-YEAR storm. Every DATE matches\nthe decree exactly, so the schedule\
  \ is transcribed faithfully and the storm is uniformly overstated on\nthe four lower-tier basins. Recorded,\
  \ not resolved — lead `SSO-DESIGN-STORM`. That application also\ncarries the plant's full SSO outfall\
  \ inventory with coordinates, which is the geometry the Cole St.\nquestion (#1760) actually needs.\n\
  \nThe nine paragraph-33 progress reports are read (#2079), under the `compliance-report` genre added\n\
  for them. They are the decree's own measuring instrument: paragraph 33 requires one every January 31\n\
  and July 31 \"until termination\", and each follows the decree's lettered structure. Together they\n\
  carry 262 discharge events and 18 permit exceedances, 2016 through 2021.\n\n⚠️ A LOW `discharge_events`\
  \ COUNT IS A SCAN ARTEFACT, NOT A QUIET HALF-YEAR. Five reports enumerate\nclause (f) per outfall (49-54\
  \ events each); four state only an aggregate because their per-outfall\ntable is a scan of an embedded\
  \ spreadsheet whose text layer is garbled (\"Da!e Dr.\", \"SSQ\" for SSO).\nThose four record the prose\
  \ aggregate instead of inventing outfall ids — and the aggregates are the\nheadline: 2018 H1 reports\
  \ 127 SSO and 11 CSO overflows, 2018 H2 reports 114 SSO and 32 CSO. The\nper-outfall rows are recoverable\
  \ from the page images, the same remedy as the decree's rotated\nTable A.1.\n\nTHE TRANCHE IS COMPLETE\
  \ (#2080). All 90 extractable documents of the 93 committed are read:\n\n    32  order             \
  \ enforcement instruments + City/agency correspondence, 1994-2026\n    30  inspection         30 captures\
  \ of 18 distinct inspections, 2016-2026\n     9  progress-report    the paragraph-33 semiannual series,\
  \ 2016-2021\n     8  npdes              the permit lifecycle *MD/*ND/*OD/*PD + applications\n     7\
  \  epa                permit actions: modifications, approvals, determinations\n     3  engineering\
  \        the process flow diagram, a schematic, and the 2021 Annual\n                           Mercury\
  \ Pollutant Minimization Program report\n     1  resolution         City Ordinance 155-13 (hand-authored;\
  \ `resolution` has no extractor)\n\nThe other 3 are BYTE-IDENTICAL DUPLICATES already declared in data/site/document-versions.yaml\
  \ and\nmust never be extracted: edoc-1840395 and edoc-1840398 (twins of edoc-1840394, sha256 7ad0ba7bec6d)\n\
  and edoc-2363112 (the DAM copy's twin, sha256 b140e19c5e26, extracted as oepa/2PE00000.npdes.yaml).\n\
  \nA MERCURY THREAD RUNS THROUGH THREE GENRES and is visible only now that all of them are read:\n2015-07-16\
  \ the City applies for a mercury variance (edoc-3170366) · 2021 the Annual Mercury\nPollutant Minimization\
  \ Program report is filed under 2PE00000*ND with influent, effluent and\nbiosolids monitoring (edoc-1840396,\
  \ which the portal types as part of an application package and\nwhich is in fact a standalone compliance\
  \ report) · 2026-07-16 the NOV cites LOW LEVEL MERCURY among\nthe effluent-limit violations (edoc-4192703).\
  \ Nothing here says the variance failed; the sequence is\nrecorded so the question can be asked of the\
  \ right documents.\n"
