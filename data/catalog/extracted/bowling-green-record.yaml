id: bowling-green-record
title: Bowling Green — the governance record (CRA Resolution 23-01249, the seller-name rezonings, the contested 2026 roll call, the Liames land assembly)
scope: extracted
status: reviewed
producer:
  kind: manual
  source: >-
    Fourteen primary documents from three public bodies, plus one live parcel-layer query and
    two blocked routes recorded as per-source negatives. TOWNSHIP: eleven files from Middleton
    Township's own minutes publication — the 2023-07-19 "Project Accordion" executive session,
    the 2023-09-20 CRA support resolution, the Getz (2023-03-29) and Busch (2023-05-03)
    seller-name rezonings, the 2025-01-15 site-plan review that puts a two-building construction
    schedule on the record, the 2024-11-20 Busch and SDT1 matters, the 2025-09-09 Eckel/Speck
    withdrawals, the 2026-01-07 meeting at which Meta's letter was read, that letter itself, and
    the 2026-07-07 R.C. 519.12 hearing on Application 2026041. All were located by sweeping the
    whole publication — 115 files for 2023-2026 downloaded and grepped, fifteen naming Liames or
    Project Accordion — so the negatives in this set rest on a stated search rather than on
    assumption. COUNTY COMMISSIONERS: the journal of the 2023-09-28 regular session, carrying
    Resolution 23-01249 and the record made in support of it, from the county's legacy static
    minutes tree (which publishes 2023 in full and stops at 2024-05-30). It has NO text layer —
    a Canon copier scan, read at 300 DPI with tesseract, with the resolution number cross-checked
    against the printed listing page. COUNTY PLANNING COMMISSION: the agendas of 2026-06-02 (with
    its attached parcel map) and 2026-07-07, from the CivicEngage Agenda Center, whose
    Content-Disposition headers supplied the served filenames the URLs lack. PARCEL LAYER: the
    Wood County auditor's Vision_Parcels MapServer layer 0, queried live on 2026-08-05 for the
    thirteen rezoned parcels and for the whole Liames holding, and re-probed for its own vintage
    (73,839 rows, max Sale_Date 2025-07-25, zero rows after it — unchanged since #1436). All
    document bytes are committed under data/documents/bowling-green/{middleton-township,
    commissioners,planning-commission}/ with sha256s in each directory's filename-map.yaml.
license: Public record (Ohio township, county commissioners' and county planning commission minutes and agendas; a county auditor GIS service) plus one company letter published by a public body
