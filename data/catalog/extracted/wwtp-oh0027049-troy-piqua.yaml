notes: 'Verbatim ECHO effluent-chart data for Piqua WWTP (OH0027049 / OEPA 1PD00008), outfall
  001 → Great Miami River. Design 8.7 MGD (13.46 cfs), peak hydraulic 22.5 MGD; actual mean
  3.224 MGD (2023, 37.1% utilization); max 5.822 MGD; CSO/bypass outfalls: 0. Four ECHO-flagged
  effluent exceedances in 2023 (all E90, severity-2 Non-Reportable Noncompliance): DO daily-min
  3.8 vs 6.0 mg/l (Jul, +37%), ammonia weekly-max 3.445 vs 1.5 (Jun, +130%), and E. coli geomean
  monthly (>126) + weekly (>284) (Jun) — surfaced by the #1453 connector fix (ECHO returns
  ExceedencePct as a "37%" string the old parser dropped). Regenerable via `watermark dmr
  OH0027049 --design-flow 8.7 --out data/extracted/troy-piqua/wwtp-oh0027049.dmr.yaml`. Cited
  receiving-reach 7Q10 (24.0 cfs, GMR above Sidney, USGS 03261500) is in the fact sheet
  extracted/oepa/troy-piqua/1PD00008.fs.npdes.yaml (#828).'
