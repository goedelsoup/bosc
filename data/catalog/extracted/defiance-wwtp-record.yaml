    Two routes. (1) Ohio EPA's eDocument public portal (edocpub.epa.ohio.gov), scripted, searched
    by Entity Name "DEFIANCE WWTP" — 1,097 documents, 950 of them under Secondary ID 2PD00013 —
    from which six were fetched on 2026-08-05 and committed under data/documents/oepa/defiance/
    (see that directory's filename-map.yaml; the portal sends no Content-Disposition, so the docid
    is the as-served identity and is recorded beside every file). The permit:/ blocks are
    `watermark extract --kind npdes` output (text-primary over the first six pages plus the page-1
    image); everything after them is a reviewed augmentation transcribed page-by-page from each
    PDF's embedded text layer — these are digitally generated Ohio EPA documents, not scans.
    (2) EPA ECHO's CWA services for the enforcement record — dfr_rest_services.get_dfr for FRS
    110000544082 and case_rest_services.get_case_report for case 05-2024-0328 — read 2026-08-05
    against the ICIS-NPDES system extract of 2026-07-31.
