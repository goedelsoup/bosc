notes: >-
  Issue #1408 (under epic #1267) — the standing pre-construction watch, run 2026-08-05 against
  nine threads whose negatives were dated 2026-07-10. Five moved, two decisively, and the value
  is as much in the routed negatives as in the finds.
  What changed. (1) THE OPSB THREAD BROKE OPEN. The corpus had carried 25-0697-EL-BLN as a bare
  case number, its docket bot-blocked and its link to the Mega Site asserted by press. The
  applicant publishes what the docket will not: 25-0697-EL-BLN was APPROVED 2025-11-21 and is
  unbuilt, a second case 26-0729-EL-BLN was filed 2026-07-27 adjusting the approved route, and
  AEP's own Statement of Need names the Van Wert Mega Site and counts "30 requests for
  transmission service" there in the past year — the first quantification of interest in the site
  from anyone but its developers. A committed QTS campus parcel (17-034718.0000) carries a
  transmission easement in the filing's affected-properties table. The instrument also corrects
  the corpus twice: the cost is $45,877,232 (settling the $45M half of a $45M-vs-$72M conflict,
  and showing it recovered through the FERC formula rate and allocated to the AEP Zone, not to a
  developer), and the line is a 69 kV rebuild DESIGNED at 138 kV but INITIALLY OPERATED AT 69 kV
  — so calling it a 138 kV line describes its rating, not its service voltage. What the filing
  refuses is as important: "QTS" and "data center" appear on none of its 612 pages, so it does
  not ground the campus load and the facility domain stays `seeded`.
  (2) THE LOCAL BALLOT THREAD IS DECIDED, by a different mechanism than the issue predicted. Not
  a referendum but an INITIATIVE, filed 2026-07-18 against Ordinance 26-05-029 (the definitional
  amendment, which is the one opponents identified as load-bearing), certified insufficient
  2026-07-27 at 255 valid signatures against 323 required, with no cure available because the
  petitions had already been submitted. [reference] throughout — the certification itself is a
  BOE record and is not in this corpus.
  (3) THE AIR PTI IS A VERIFIED NEGATIVE with a one-day-old positive control: 328 Van Wert County
  air-permit documents, the newest dated 2026-08-04, and not one for the campus — against the
  applicant's own NOI certifying `PTI: YET_TO_APPLY`. (4) THE PJM THREAD WAS WATCHING THE WRONG
  INSTRUMENT. The Expedited Interconnection Track opened 2026-07-31 but is a GENERATION track
  (250 MW UCAP minimum, 10 requests a year, sunsets end-2027); a data center is load and can
  never enter it. The load-side rule is BYONG, and the structural consequence is that this campus
  will never have a public PJM queue entry — the watchable artifact is an AEP filing.
  (5) THE ECHO RECHECK FOUND NOTHING AND THE REASON IS THE FINDING: the ICIS extract advanced to
  2026-07-31 while the compliance window still ends 2026-03-31, so Q2 2026 DMRs have not posted
  and a naive recheck would have read fresher data as newer quarters.
  The most consequential small find is a date disambiguation. Permit 2PD00006*WD put TWO
  milestones on 2026-08-01 — event 90199 "Submit First Annual Report" and event 3099 "Begin
  Construction" on the CSO schedule. The 2026-07-28 filing reports exactly one complete, and it
  is the annual report; its attachment is precisely the twelve-month dataset 90199 requires. So
  the milestone the City met early was the reporting one. Whether CSO construction began stays
  [open] with a dated next check of 2026-08-17, because the permit's 14-day notification window
  had not closed. Route hazards are recorded alongside — chiefly that a naively-posted eDoc
  search returns the UNFILTERED grid and reads like a search that matched everything rather than
  one that never ran.
