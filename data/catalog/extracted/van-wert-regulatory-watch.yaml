  source: >-
    Seven routes, run 2026-08-05 and recorded separately. (1) Ohio EPA's eDocument public portal
    (edocpub.epa.ohio.gov), scripted, by Entity Name ("QTS", 35 documents statewide), by County x
    Program (VAN WERT x AIR PERMIT, 328 documents, newest 2026-08-04; VAN WERT x 401 WETLANDS,
    4 documents; VAN WERT x NPDES) and by Secondary ID (2GC08872, 3 documents). That NPDES sweep
    surfaced two previously unheld documents — the Van Wert WWTP's NPDES Permit Compliance
    Schedule Update of 2026-07-28 and its twelve-month influent/effluent attachment, both now
    carried under data/documents/oepa/van-wert/ as edoc-4208904.pdf and edoc-4208905.pdf.
    (2) EPA ECHO dfr_rest_services.get_dfr for OH0027910, read 2026-08-05 against ICIS-NPDES
    extract 2026-07-31. (3) EPA Envirofacts ICIS_PERMIT, PERMIT_NAME/CONTAINING/QTS (31 rows, of
    which 3 are Ohio — all Licking/Franklin, none the Van Wert coverage, recorded as a
    propagation-lag hazard rather than a negative). (4) AEP Ohio Transmission's own
    project site, which serves the Letter of Notification and public notice for OPSB Case No.
    26-0729-EL-BLN that the docketing system will not; the notice is committed under
    data/documents/grid/van-wert/ and the 88.7 MB LON is sha256-pinned and read rather than
    carried. (5) A direct probe of dis.puc.state.oh.us for 25-0697-EL-BLN, recorded as an access
    failure. (6) PJM's published Expedited Interconnection Track and BYONG rules. (7) Local and
    statewide press for the two ballot threads, which is the only public account of the Van Wert
    County Board of Elections certification of 2026-07-27 and is carried as [reference].
