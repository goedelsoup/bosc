notes: Per-record extractions from the City of Lima production. Includes the corpus's FIRST primary
  lab record — six weeks of Outfall 001 ammonia benchsheets whose duplicate analyses recompute the
  February 2026 reported monthly average and weekly maximum to four significant figures against EPA
  ECHO — plus the 2022 NPDES renewal application (20 CSO outfalls and 34 constructed sanitary-relief
  points with coordinates), the two 2026 noncompliance notifications, ten sanitary-capacity
  acceptance letters, and the City–Allen County biosolids agreement.
