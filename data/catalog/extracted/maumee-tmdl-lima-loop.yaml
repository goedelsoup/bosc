notes: >-
  One permits-epa row. The TMDL assigns the City of Lima WWTP (2PE00000) a spring-season
  total-phosphorus wasteload allocation of 4.0 metric tons — third-largest of the 39 facilities in
  the grouped load — plus a separate 0.083 MT for its combined sewer overflows, which is the
  second-largest CSO allocation in the basin behind only Toledo. OHP000001 restates both as
  enforceable kilogram limits. Seven Ottawa-basin dischargers hold allocations under the same
  permit and two ran over in every reported year: American-Bath WWTP (370 kg; 590/390/620/520/500)
  and Elida WWTP (340 kg; 860/890/910/990/390). American-Bath is the plant the campus's own
  2DP00130 indirect-discharge application names as its receiving system — recorded as an open
  question, not a finding, because a phosphorus allocation is not a hydraulic capacity and no
  committed record gives the campus stream's phosphorus concentration.
  THREE CAVEATS TO CARRY. (1) Tables A4.1 and A4.5 disagree on several allocations and A4.1 is the
  operative one — A4.5 states Shawnee II as 0.51 MT against A4.1's 0.75 and Elida as 0.21 against
  0.34, and OHP000001 Part IV.A.1 settles both in A4.1's favour (750 kg, 340 kg). Reading a limit
  out of A4.5 understates Shawnee II's by a third. (2) Table A4.5's first numeric column is a 2008
  baseline, not a reported year; the seven columns are 2008 / WLA / 2017 / 2018 / 2019 / 2020 /
  2021. (3) The Table A4.3 CSO allocation is ADDITIONAL to the Table A4.1 allocation for the same
  permit, as A4.1's own preamble says. Whether any exceedance is a violation turns on the group,
  not the plant: Part IV.C.3 makes an individual overage a violation only when the 39-facility
  cumulative load also breaches its cap, and in the one published season (2024) the group reported
  43,304 kg against 64,170 kg. No Season Report for any Allen County facility is in the corpus —
  they are the records that would say whether American-Bath and Elida are still over.
