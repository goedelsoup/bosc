notes: >-
  Van Wert Mega Site register. One confirmed project: QTS Data Centers, Blackstone-owned —
  ~$10B, up-to-500-MW (a developer figure, carried as a [reference] bracket; QTS's own FAQ
  declines to state capacity), ~902-acre campus on the Marsh Foundation Mega Site; served by
  AEP Ohio; land assembled by Thor Equities/Form8tion (~221 ac Aug 2025). Receiving water Town
  Creek -> Middle Creek -> Little Auglaize -> Auglaize -> Maumee -> Lake Erie (HUC-8 04100007).

  This note carried six press figures from the 2026-07-02 sweep until the naming instruments
  landed; each is corrected here against the instrument that retired it, because a register that
  keeps the press number is the thing the instruments were pulled to fix.

  ENTITY — the permit applicant of record is QTS Realty Trust **Inc.**, 2470 Satellite Blvd NW,
  Duluth GA, certified under penalty of law on 2026-07-21 (2GC08872 NOI, #1402). NOT "QTS Realty
  Trust, LLC / Overland Park KS", which was press. Three QTS names are live and none is a synonym
  for another: QTS Data Centers (brand), QTS Realty Trust Inc. (permit applicant), QTS VAN WERT
  LLC (deed grantee).

  ACREAGE — the City annexed and zoned **901.698 ± ac**, not ~962. Exhibit A's four component
  acreages sum exactly to the figure printed in both ordinance titles; 962 has no support
  anywhere in the record (#1401).

  THE VOTE — the three emergency ordinances of 2026-05-11 did **not** pass "6-0". The minutes
  record no numeric tally at all, only "all concurred", and Roberts abstained as an employee of
  the Marsh Foundation. "6-0" is a press reconstruction (#1401).

  SCHEDULE — the applicant's own NOI gives project start **2026-08-03** and completion
  **2030-08-03**, against the press "groundbreaking Q4 2026 / buildout ~2032" this note used to
  carry — two years apart at the far end (#1402).

  MIDDLE CREEK IS NOT OPTIONAL in the stream network above, and this note is where it was
  dropped once already. Town Creek reaches Middle Creek by combining with Maddox Creek; the
  chain is the 2PD00006 fact sheet's own "Subsequent Stream Network" line.

  TWO OPENS ARE NOW CLOSED and are removed from the list below. The **Town Creek 7Q10** is
  0.16 cfs annual, source=document (fact sheet 2PD00006 Table 12; summer and winter both 0 —
  the creek is intermittent), giving the 0.03:1 dilution that makes this site the basin's
  effluent-dominance end-member. The **air PTI** is no longer an unsuccessful search: the NOI
  certifies its status as `YET_TO_APPLY` under penalty of law on 2026-07-21, which converts the
  absence into a dated instrument-grade negative (re-swept dry 2026-08-05, #1408).

  Still open: the deed LLC chain (#1404), CRA/TIF/PILOT terms (searched to a dated negative
  2026-08-05, #1407 — a negotiation exists, no instrument does), and a facility-own
  NPDES/outfall. The committed 2GC08872*AG coverage is CONSTRUCTION-phase only and grounds
  none of the campus's operating water use, cooling, process discharge or load.
