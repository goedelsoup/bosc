notes: 'Van Wert Mega Site sweep (2026-07-02). One confirmed project: QTS Data Centers (QTS
  Realty Trust LLC, Blackstone-owned) — ~$10B, up-to-500-MW (developer figure), ~902-acre
  campus on the Marsh Foundation Mega Site; served by AEP Ohio; land assembled by Thor
  Equities/Form8tion (~221 ac Aug 2025); City annexed ~962 ac + I-2 zoning (emergency
  ordinances 6-0, May 11 2026). Groundbreaking Q4 2026, buildout ~2032. Receiving water Town
  Creek -> Little Auglaize -> Auglaize -> Maumee. Open: deed LLC, CRA/TIF/PILOT terms, air
  PTI, facility NPDES/outfall, Town Creek 7Q10.'
