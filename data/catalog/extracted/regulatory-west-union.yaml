notes: >-
  State of Ohio ex rel. Fisher v. The Village of West Union, Adams County Court of Common Pleas
  89-CIV-228, entered and filed 1993-06-29. An R.C. Chapter 6111 consent order on the Village
  WWTP's NPDES permit 0PC00019*CD: Appendix "A" interim effluent limits for outfall 0PC00019001
  (0.6 MGD loading basis), a $5,000 civil penalty, two stipulated-penalty schedules, an order to
  eliminate all sanitary-sewer overflows and bypasses, and a seven-milestone plant-improvement
  schedule running to 1995-05-01. The court retained jurisdiction and the instrument carries no
  termination provision. `cadence: static` because the entered order is a fixed historical
  instrument, NOT because the matter is closed — post-1993 docket activity is an [open] target
  and would land as an additional artifact under this entry, not as a refresh of this one. The
  first record in the West Union corpus (epic 1278); add further west-union enforcement
  extractions here.
