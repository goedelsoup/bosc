notes: >
  Onboarding record and investigative findings for the Urbana watershed point (Mad River corridor,
  Champaign County OH). highland55-findings.md documents the Thor Equities data-center project west
  of US-68 / SR-55 — a build-to-suit development with a dedicated electrical substation; the
  data-center end-use is resolved (#1328) to the "Urbana Technology Hub" ([reference], public
  disclosure + Thor v. Urbana litigation, #1263). datacenter-facility.md is the facility record
  (#1327) — the disclosed 460k-sqft, ~$1B, closed-loop-cooled campus (AES Ohio serving); the MW
  load stays [open] (a floor-area screening bracket only, never a disclosure).
  facility-power-instrument-search.md is the #1353 documented NEGATIVE search for a facility-naming
  power/emissions instrument — PJM interconnection/TEAC (no Champaign/Urbana large-load request) and
  OEPA air/ECHO ICIS-AIR (no campus air permit) both came back empty, so the screening bracket is
  retained and the end-use stays [reference]; it also records the Adams-County / Van-Wert
  conflation guard. land-assembly.yaml is the conveyance register —
  four parcels / three Thor SPEs (Urbana Owner I/II LLC, Highland55 Investments LLC), grantor /
  grantee / consideration / date / deed Official-Record book-page, sourced [verified] to the
  Champaign County auditor CAMA. bosc-site-footprint.yaml commits the ~230-ac recorded ownership
  assemblage (geometry in reference/urbana/parcel-assemblage.geojson) with the SSURGO-validated
  dominant HSG C (#1326). litigation-thor-v-urbana.{yaml,md} is the structured read of the federal
  complaint (S.D. Ohio 3:26-cv-00196-MJN-CHG, filed 2026-06-19; source in
  documents/legal/thor-v-urbana/) — docket, parties, the eight counts, the recited ordinance /
  moratorium record, and the zoning + litigation timeline (#1329).
  incentive-instruments.{yaml,md} is the incentive/development-instrument record (#1354), read from
  the City of Urbana's own legislative documents (documents/urbana/council/ — reachable after all,
  reversing the 2026-06-28 "City documents unavailable" note). Its finding is a NEGATIVE: there is
  NO tax abatement. Ord. 4631-25 designated Community Reinvestment Area #2 (passed 5-2) — an area
  with ceilings only (15 yr / 100%, or 30 yr for a state-designated megaproject) — and no
  R.C. 3735.671 CRA Agreement has ever come before Council, which Ord. 4631-25 Section Five makes a
  precondition to execution; the City's own public notice says the same. The 65/55 dB noise limits
  are an OFFER in a developer handout, not a condition of anything, and the disclosed tax figure was
  double-counted (the source's >$2.8M schools line is drawn FROM the >$3M total, so the aggregate is
  "over $3,000,000", not ~$5.8M). The City's one contract with the developer is the December-2024
  Pre-Annexation Agreement (Ord. 4612-24, passed 5-0) with Urbana0624C, LLC — an entity new to the
  corpus, which the City identifies as "Highland" and whose 720 E. Broad St address matches the
  §401 WQC filings; it carries a clause obliging the City to de-annex on the developer's demand.
  Exhibit B's enacted parcel list EXCLUDES 133.256 of the assembly's 230.346 ac.
  JobsOhio / ODOD / R.C. 122.175 searched negative.
  cooling-water-account.md is the B4 (#1684) reconciliation of the disclosed closed-loop claim —
  "water use comparable to a standard office building", the sentence that took the buried-valley
  abstraction thesis off the table here (#1327) and then propagated to the other sites — against
  the record. Outcome route_blind, NOT "confirmed dry" and NOT a gap: the City's own
  Pre-Annexation Agreement (Ord. 4612-24) obliges it to "provide water and sewer", so the campus
  buys City water (absent from all 31 Champaign County WWFRP registrations) and discharges to the
  City WPCF sewer (no outfall, so no DMR) — both instruments are out of reach by construction and
  the pin is KEPT [reference]. What the registry does reach is the SUPPLIER: the City's own public
  water system reported 644.99 MG in 2024 (1.76 MGD) across two plants on the same aquifer, which
  is the denominator the claim has to be read against — an evaporative read of the same campus at
  its own screening IT-load bracket implies 0.49-1.64 MGD, i.e. 28-93% of everything the City
  withdrew, while the office-building reading sits below the screen's 0.01 MGD noise floor.
  The record that would settle it is City-held (the metered service, the IU permit under the
  City's OEPA-audited pretreatment program, and the supplier's own capacity analysis) → C2 #1688.
