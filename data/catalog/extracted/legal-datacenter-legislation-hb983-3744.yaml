notes: Reviewed reads of H.B. 983 (136th G.A., As Introduced), the "Data Center Accountability
  and Citizen Protection Act," which enacts a new R.C. Chapter 3744 (5-mile citizen vote,
  air/water cooling-discharge standards incl. PFAS, open-/closed-loop permit gate, water-supply
  liability, enforcement ladder, grid-independence, revolving door, local tax-incentive ban) and
  amends R.C. 9.66 to strip the confidentiality of data-center development-and-supply agreements.
  Source bill text lives under documents/legal/datacenter-legislation/. As-introduced only — no
  committee substitute yet; Senate/enacted versions remain open.
