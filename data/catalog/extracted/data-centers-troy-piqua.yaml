notes: 'Piqua sweep (2026-07-02). One confirmed project: "Project Klondike" — developer of
  record J5 LLC dba Shaytura LLC (reported Meta backer, NOT verified); ~$1B+, ~607-ac phase-1
  (~1,200 ac assembled 2020-2025), two ~350k-sqft buildings, ~180 MW (tracker figure).
  Construction power = Piqua Power System (municipal, AMP; EIA #15095); operations = AES Ohio.
  Stacked 15-yr CRA + 30-yr TIF, ~$735k/building/yr PILOT. Approved 4-0 Nov 3 2025 (emergency).
  Water agreement reserves up-to-2.0 MGD (conflicts with City closed-loop FAQ); WWTP NPDES
  1PD00008 -> Great Miami River RM 114.3. Active opposition (Save Piqua). Open: Meta ID
  primary filing, official MW, air PTI, stormwater NPDES, TCA exemption, parcel IDs.'
