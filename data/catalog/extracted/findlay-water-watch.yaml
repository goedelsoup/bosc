  source: >-
    EPA ECHO public web services, pulled 2026-08-02 against an ICIS-NPDES system extract of
    2026-07-31 and an SDWIS extract of 2026-07-09. Three services: dfr_rest_services.get_dfr for
    NPDES OH0025135 (the Detailed Facility Report — permit-schedule violations, compliance
    summary, inspections, assessed waters); eff_rest_services.get_effluent_chart for the same
    permit over 2023-01-01 to 2026-07-31 (the reported effluent record — total phosphorus, flow,
    mercury, overflow counts and volumes), pulled through this repository's own connector
    watermark.hydrology.connectors.echo_dmr.fetch_effluent_chart so every figure is regenerable;
    and sdw_rest_services.get_systems plus the SDWIS Detailed Facility Report for public water
    system OH3200111. The load equation, the Individual Load Limit, the Season Report requirement
    and the annual schedule of events are read from the committed general-permit bytes
    (data/documents/oepa/OHP000001.pdf and OHP000001_FS.pdf); the Schedule of Compliance and the
    station inventory are read from the committed permit bytes
    (data/documents/oepa/findlay/2PD00008.pdf, pages 14, 16 and 18).
