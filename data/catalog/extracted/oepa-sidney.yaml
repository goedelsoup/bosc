notes: 'Three permittees; the Sidney WWTP is NOT among them — its extraction is catalogued by
  sidney-regulatory-watch, and is referenced below only as a cross-reference. (1) The AWS campus, added 2026-08-01 (issue 1380) over bytes
  ingested 2026-07-31 (issue 1383): construction stormwater coverage 1GC10596*AG under
  OHC000006 — the NOI (applicant Amazon Data Services, Inc.; receiving Mill Creek; 230.7 ac
  disturbed), the 2025-12-05 Director''s approval, and the 2026-04-22 co-permittee approval
  for George J. Igel & Co., Inc.; surface-water PTI DSWPTI-260517 for the sanitary sewer
  relocation (2026-06-16); and the 401/isolated-wetland application 251911W under Amazon''s
  own project name CMH-232. (2) The City of Sidney''s OWN isolated-wetland permit 252256W for
  the W. Millcreek/Fair Road work — different permittee, do not merge with 251911W. (3)
  Hidden Valley MHP permit 1PV00037*ED, renewal effective 2025-09-01 through 2030-08-31,
  receiving Tawawa Creek at River Mile 3.3; outfalls 1PV00037001 (final treated effluent
  after UV disinfection) and 1PV00037588 (sludge/biosolids transfer station), design flow
  0.015 MGD. NOTE: extracted/oepa/sidney/1PD00009.npdes.yaml (the Sidney WWTP read) carries
  no extraction envelope and is rejected by the corpus loader — see
  data/extracted/sidney/README.md, "Platform gaps". Add further Sidney OEPA extractions to
  storage as produced.'
