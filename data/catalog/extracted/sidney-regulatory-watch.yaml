    and the Envirofacts ICIS_PERMIT and FRS_PROGRAM_FACILITY tables. Secondary, cited but
    carried as captured bytes: the Ohio EPA NPDES General Permits page bearing the
    2026-07-21 Community Notice abandoning OHD000001, and AES Ohio's 2026-07-21 press
    release on its unopposed PUCO stipulation. The City of Sidney FAQ (sidneyoh.com/526)
    was read live and is cited by URL, not carried.
