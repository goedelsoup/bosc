notes: >-
  Issue 1463 (under epic 1265) — the siting-regime side of Findlay's data-center story, and
  the answer to "which government can actually say no." Seven structured artifacts plus a
  narrative. Only one is a `RecordItem`: the structured read of 2026-Ohio-405 carries a
  `case:` block and publishes into the existing `litigation` group, which adds a genre to
  this site's records feed at no contract cost. The other six are corpus, not records —
  there is no zoning RecordGroup and inventing one to publish a proposal that is not yet law
  would force a contract bump plus a 26-bundle regeneration, the same call issue 1464 made
  for the grid set (the Lima "Lyka" precedent, 1476). So this set does not move the site's
  `record` domain, which is already live.
  What it establishes. (1) THE JURISDICTIONAL MAP. Hancock County's SB 52 restricted area
  prohibits economically significant wind farms, large wind farms and large solar facilities
  — verified off the notice's own title — and reaches no data center, no load and no
  storage. The City of Findlay's Ordinance 2026-42 moratorium binds only inside the
  corporation line, while the disclosed 150 MW facility sits in unincorporated Allen
  Township. The county instrument restricts supply and leaves demand untouched, the same
  asymmetry the grid record found in 2024. (2) THE TOWNSHIP HAD NO RULE AT ALL. Allen
  Township was historically unzoned; its resolution was adopted 2024-09-09 and did not take
  effect until 2026-05-11, a twenty-month gap that covers the period in which the Megawatt
  Hub was contracted and partly energized. The phrase "data center" appears zero times in
  its 77 pages, and four weeks before the referendum the township's own counsel said on the
  record that "a data center would not be permitted" under it. (3) THE PROPOSED CAP. On
  2026-07-28 the zoning commission moved a Section 1521 that would conditionally permit data
  centers in I-1 and I-2 subject to a 10 MW Total Facility Load ceiling, a 100,000 GPD water
  ceiling, dry cooling only, no groundwater, municipal water only, and an anti-circumvention
  rule aggregating phases that share electrical infrastructure or utility interconnections —
  written against exactly the architecture of a shared megawatt hub. It is a PROPOSAL and
  every artifact says so: under R.C. 519.12 it must clear a commission hearing (2026-08-19),
  a trustee hearing, and a possible referendum, and it had cleared none at ingest. Three
  live uncertainties are recorded rather than resolved — whether a bitcoin-mining load falls
  inside a definition keyed to "storing, processing, or distributing electronic data" (AEP's
  Schedule DCT names crypto outright; this borrowed template does not), what Section 1502
  preserves for a use established while the township was unzoned, and whether the amendment
  passes at all. (4) THE CERTIFIED CANVASS corrects the reported one: 503-221 (69.48%), not
  the widely reported 502-221, on 724 votes of 732 ballots from 1,761 registered, certified
  2026-05-11 — the same date the resolution gives as its effective date.
  Corrections and traps carried inline. The published SB 52 PDF is the MEETING-SETTING
  Resolution 167-22 and its PROPOSED map, not the adoption — the 2-1 roll call with Bechtol
  dissenting belongs to the scheduling resolution and the adopted resolution's number stays
  open. 2026-Ohio-405 is Open Meetings Act only and must never stand in for the separate
  2025 ballot-language case that actually revoked the township's zoning status. The BOE
  canvass prints each contest title BELOW its own results, so a naive read misattributes
  every block. The two ALLEN W registration figures (799 and 1,077) measure different
  electorates and must not be reconciled. And the Interstate Capital rezoning is recorded
  with an explicit disclaimer that nothing connects it to a data center.
  Evidentiary asymmetry, and it is the reason an acceptance criterion stays open. The
  township, court and election material is nearly all verified from primary bytes. The city
  material is almost entirely reference — findlayohio.gov and American Legal both return
  HTTP 403 to automated fetches and findlay.legistar.com is an unprovisioned tenant, so
  Ordinance 2026-42's certified text and the council journal are held only as two newspapers
  describe them, one of which hedges its own roll call mid-sentence. Recorded as an ACCESS
  FAILURE, not a denial and not a negative, per the standing PUCO DIS rule from 1464. The
  response is an R.C. 149.43 request drafted and deliberately NOT SENT at
  extracted/findlay/governance/records-requests/2026-07-31-findlay-clerk-of-council.md, with
  a response log and a constructive-denial watch ready to fill in. Ten open threads are
  cross-filed in data/site/findlay/leads.yaml, including the time-sensitive August 2026
  hearing calendar.
