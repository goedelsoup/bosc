producer:
  kind: manual
  source: City of Sidney legislative record — Resolutions 80-25, 81-25 and 82-25 (all adopted
    2025-10-27) and 26-26 and 27-26 (both adopted 2026-04-27), each published with its executed
    agreement; the City staff water/sewer presentation of 2026-04-27; and the City Engineering
    Department grading permit signed 2026-05-15. Retrieved 2026-08-01 from the City of Sidney
    Document Center (sidneyoh.com/DocumentCenter/View/<id>) via the City's Proposed Data Center
    FAQ. Source bytes and provenance - data/documents/sidney/council/filename-map.yaml and
    data/documents/sidney/permits/filename-map.yaml. EXTENDED 2026-08-13 (issue 1998) through a
    SECOND City route - the Documents-On-Demand legislative portal
    (sidneycityoh.documents-on-demand.com), which this record had carried as Cloudflare-blocked
    and which is not. The 403 is an HTTP/2 fingerprint block, and the identical request over
    HTTP/1.1 returns 200. That route supplied Resolution 84-22 (2022-10-10, the act that
    established the City-Wide CRA), Resolution 69-25 (2025-09-08, which expands it and adds the
    thirty-year megaproject tier), Resolution 14-26 (2026-02-23, accepting the consolidation
    plat), and the approved Council minutes of 2025-09-08, 2025-10-27 and 2026-04-27. The
    2025-10-27 minutes are image-only (zero extractable characters) and were read by OCR at 300
    DPI; the other two carry a native text layer. EXTENDED AGAIN 2026-08-13 (the issue 1998 tail)
    with the LAND-USE SPINE off the same portal - Ordinance A-3225 (annexation of the 243.092
    acres, 2025-07-28), Ordinance A-3226 (which zones it IIM the same night and closes this site's
    standing zoning question), and Ordinance A-3210 (the official zoning map whose declared
    coverage window ends 2025-01-13, which is why the City's own GIS could not answer it) -
    together with the Sidney Planning Commission minutes of 2025-06-16 and 2025-07-21 and the
    Council minutes of 2026-02-23. Every agent-reported sha256 was independently reproduced by a
    second pull before shelving.
