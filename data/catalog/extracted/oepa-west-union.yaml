notes: >-
  The GRANT of a Level Two Isolated Wetland Permit for the Buck Canyon site, Sprigg Township —
  Ohio EPA ID 252171W / package DSW401252171W, issued 2026-06-08 under R.C. Ch. 6111
  §§6111.02-6111.028, valid five years. The first state environmental authorization in this
  site's record, and it carries three things the corpus could not previously source.
  (1) IT NAMES 68 YARDS, LLC WITH A PRINCIPAL AND AN ADDRESS — "Carrie Tillman, 68 Yards, LLC,
  16 N. Green Street, Chicago, IL 60607, 68YardsLLC@protonmail.com". The corpus held that entity
  as a bare name from the USACE NWP 39 verification. ⚠️ Its affiliation to Buck Canyon Properties,
  LLC / Derek Harmon is STILL [open]: this permit does not connect them either, it just shows the
  two entity families holding different instruments on one project.
  (2) THE STATE'S OWN PROJECT DESCRIPTION IS "Construct a light industrial park." — not "data
  center", while Adams County's government domain calls the same site an AWS campus. Both are
  primary; the extraction records the discrepancy and resolves neither, and draws no inference of
  concealment from a generic land-use description on an environmental permit.
  (3) THE IMPACT ACCOUNT, and it must never be summed with the federal one: 0.74 ac of SEVEN
  ISOLATED wetlands (B, D, F, H, I, J, K; 1.07 ac total on site) outside federal jurisdiction
  post-Sackett, against the USACE NWP 39's 0.06 ac of TWO JURISDICTIONAL wetlands (E, G) plus
  1,893 lf of four streams. Non-overlapping ids, two authorities, one delineation.
  It also corroborates the site's ROUTE-BLIND finding from the state's own pen: the permit places
  the project in the Cabin Creek-Ohio River watershed (HUC 05090201-06) while the profile screens
  Ohio Brush Creek gage 03237500, and it carries the R.C. 6111 antidegradation determination that
  "a lowering of water quality in the Ohio Brush-Whiteoak watershed (HUC 05090201) ... is
  necessary".
  ⚠️ PARTIAL READ, stated in the extraction's own warnings: pages 3-8 of 9 (mitigation terms,
  Part IV notifications, appeal rights) are untranscribed, and the 31 other documents in the
  collection — including the 554-page jurisdictional delineation report, the 196-page SWP3 and
  the Kimley-Horn site map printing DISTURBED AREA = 535.00 AC — are shelved and unread
  (lead OEPA-BUCK-CANYON-UNREAD). One document, edoc-3940059, is served TRUNCATED by Ohio EPA at
  exactly 2 MiB and is retained as a locator only (lead OEPA-EDOC-3940059-TRUNCATED).

  ---
  ALSO IN STORAGE, and a different instrument entirely: **NPDES permit 0PC00019*KD** (application
  OH0028088), the Village of West Union's own WWTP at 6875 State Route 247 — a renewal issued
  2023-02-07, effective 2023-03-01, expiring 2028-02-29. It predates the Buck Canyon file and says
  NOTHING about the data-center project: "data center", "Amazon", "AWS" and "Buck" return no hits,
  and no such context was imported into the extraction. The permittee is the VILLAGE, not the
  Adams County Regional Water District, which appears nowhere in the instrument. A short, simple
  permit — Class II works, one outfall, 23 parameters on a 0.7 MGD design flow, no WET limits and
  NO Part I.C Schedule of Compliance at all — every figure cross-verified against Attachment II's
  independent second table.
  Its own defects are recorded rather than normalized: the receiving water is named two ways in
  one document, "Beasley Creek" on the authorization sentence, in the Fact Sheet and in Attachment
  I, against "Beasley Fork Creek" in the Part II.B station table for stations 001/801/901; free
  cyanide's units disagree between the two tables (ug/l in Part I.A, mg/l in Attachment II, a
  1000x divergence in a permit whose Item I sets the free-cyanide PQL at 0.025 mg/L); station 801's
  own footnote points at the Item L sampling rule that omits 801; Item Q requires influent mercury
  monitoring the influent table does not carry; and Attachment II's footnotes skip "b" while the
  same design-flow note is marked "*" in Part I.A and "a" in Attachment II.
