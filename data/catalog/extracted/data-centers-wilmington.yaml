notes: >
  Superseding register (2026-07-11, #1471; closes #519) — inverts the 2026-07-03
  flat-no-activity prior, which reflected only an empty corpus. On the public record since
  Nov 2025: [verified] Amazon Data Services Inc. ~471-ac / $4B campus on the former Cosler
  Farm (1488 S US-68; annexed 2025-08-07; 30-yr PILOT at 30%; $25M+ AWS-funded water/sewer/
  road infrastructure; private land sale, no JobsOhio instrument) and [reported] a second
  545.893-acre Ardent/TAC rezoning corridor (O-26-04-O-26-07, Feb 2026; Nov 2026 referendum
  qualified; O-26-33 postponed to 2026-07-16, pending as of the register). Sharp v. City of
  Wilmington (S.D. Ohio
  1:26-cv-00448, Amazon as defendant-intervenor) ordered three enabling ordinances redone
  ~2026-07-09/10 for defective 30-day mailed notice — ruling itself unpulled [open]. Neither
  campus is on Air Park land; the Air Park (ILN, Amazon Air/ATSG) stays the cargo comparator.
  The City municipal system draws on Caesar Creek Lake (principal since 1994) plus the
  Burtonville backup reservoirs (not Todd Fork); AWS reserved MGD undisclosed; Todd Fork
  7Q10 still a DAR method awaiting inputs — abstraction screen not computable [open].
  OHD000001 is dead, not pending: public-noticed as a draft 2025-10-31, comments closed
  2026-01-16, and WITHDRAWN by Ohio EPA Community Notice 2026-07-21 ("not to move forward with
  finalizing the general permit"; individual NPDES is "the most appropriate path forward"). The
  discharge ask is re-aimed at an INDIVIDUAL NPDES permit and, since a campus on the City sewer
  holds no NPDES permit at all, the City's industrial-user/pretreatment permit and sewer-use
  agreement (#1688). Instrument pulls (Sharp ruling,
  ordinance stack, site plans, OPSB 25-0871-EL-BLN, ECHO/SWOAQA/SOS/recorder) tracked in
  #1471. NOT bridged to the Lima/Allen Bistrozzi land-assembly graph.
