id: wilmington-power-instruments
title: Wilmington — the AES Ohio 345 kV build-out, PJM M-3 Need Dayton-2025-002 + OPSB 25-0871-EL-BLN (Extractions)
scope: extracted
status: reviewed
producer:
  kind: manual
  source: >-
    Eleven captured sources across four routes, plus four blocked routes recorded as per-source
    negatives. INTERCONNECTION: PJM's own Transmission Expansion Advisory Committee "Dayton
    Supplemental Projects" decks for all three 2026 meetings (2026-02-03 item 06, 2026-05-08 item
    05, 2026-07-07 item 11), retrieved 2026-08-06 from pjm.com and read from their PDF text
    layers. The 2026-07-07 deck carries M-3 Need Dayton-2025-002 (the Clinton Substation /
    Wilmington load ramp), Need Dayton-2025-001 (the Fayette Substation / Jeffersonville ramp) and
    the joint priced solution; the other two decks are committed because they establish that the
    Wilmington need appears in the July cycle ONLY, which is a read result rather than a lucky
    find. SITING: the statutory service copy of AES Ohio's Letter of Notification for OPSB case
    25-0871-EL-BLN, obtained from the CITY OF WILMINGTON's own website (wilmingtonohio.gov, served
    via storage.googleapis.com/proudcity) rather than from the applicant — the custody chain runs
    through the local government that was served, and is stated in
    data/documents/grid/wilmington/filename-map.yaml. It is a two-page scan with NO text layer;
    its identity, dateline and text were read off a 200-DPI render, never from OCR digits or from
    its filename. APPLICANT MATERIAL: AES Ohio's Fayette-Clinton fact sheet (March 2026),
    project-need board and FAQ, plus its Fayette Customer East and West project pages — the last
    two captured because they are where AES, in its own words, attaches the "1.5 GW" to
    Jeffersonville. ARCHIVED: the AES Clinton 345kV Substation Extension project page, recovered
    from the Internet Archive's single 2023-03-30 capture after the live URL was unpublished
    (HTTP 403 Drupal "Access denied"). SECONDARY: a landowner-side consultancy's public
    information packet on the intervention filings, tagged [reference] throughout and used only as
    a finding aid to a docket the PUCO block keeps out of reach. GEOMETRY: the Clinton Substation
    was located on the Clinton County auditor's CAMA parcel layer — the same layer
    SiteProfile.parcels_url points at — and measured against the committed corridor geometry at
    data/reference/wilmington/parcel-assemblage.geojson; OpenStreetMap way/36923781 corroborates
    the name and voltages as [reference]. No vision extraction pass was run beyond the render read
    of the two-page service letter.
