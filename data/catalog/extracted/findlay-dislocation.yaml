notes: >-
  Issue 1460 (under epic 1265). Two labor rows and one finance row. The `labor` RecordGroup was
  added to the bundle contract for this ingest (1.47.0, block key `layoff_notice:`): a statutorily
  required plant-closing notice filed with a state workforce agency is not a permit, an enforcement
  order, an award, a deed or a pleading, and the already-taken `notice:` key belongs to R.C. 1311.04
  Notices of Commencement, so it was deliberately left unclaimed. THREE THINGS THE INSTRUMENTS DO
  NOT SAY, and which must not be sourced from here. (1) Goodyear's letter names no destination for
  the closed facility's work and no labor organization — a consolidation destination is widely
  reported but is not in this document (lead WARN-GOODYEAR-DESTINATION). (2) Michigan Sugar's
  filing is a COURTESY one; the company states outright it does not believe the closure required
  notice, and four employees is far below the federal threshold, so it is not a statutory WARN
  trigger. Its value is elsewhere — it puts a SEVERED RAIL SPUR at the Findlay site on the record as
  the employer's own stated reason (lead FINDLAY-RAIL-SEVERANCE). (3) The $999,998 Brownfield total
  is Round 11 ONLY; Hancock County's presence in Rounds 4-10 is unresearched (lead
  BROWNFIELD-ROUNDS-4-10), and the packet's job figures are forward-looking projections, not
  outcomes. Note the Bluffton Gas America award goes to the Hancock County Commissioners Office, not
  the City of Findlay.
