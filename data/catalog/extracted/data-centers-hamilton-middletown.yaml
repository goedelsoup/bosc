notes: 'Butler County / Trenton sweep (2026-07-02). One confirmed project: Prologis "Project
  Mila" — ~141 ac in the Trenton Industrial Park, four buildings ~880k-899k sqft, 250 MW,
  ~$1B (advocacy figure). Served by Duke Energy Ohio (#3542, PJM DEOK) via new 345-kV Woodsdale
  circuits (Duke primary filing corrects the advocacy "AEP" error). 15-yr 75% CRA + PILOT.
  Site-plan approved Mar 30 2026 (pre-zoned I-G, no rezoning). Wastewater crosses under the
  Great Miami to Butler County LeSourdsville WRF (1PK00011) -> Great Miami River. Opposition:
  W.A.T.E.R. Open: deed LLC, air PTI, construction jobs, current NPDES number, $1B basis.'
