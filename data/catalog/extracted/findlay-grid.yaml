notes: >-
  Issue #1464 (under epic #1265) — the power side of Findlay's facility story. Four
  structured records, none of which is a `RecordItem` genre: like the Lima "Lyka" record
  (#1476) a siting docket and a tariff posture are carried as corpus extractions rather
  than as a new RecordGroup, so this set does not move the site's `record` domain.
  What it establishes. (1) Both OPSB case numbers the issue asked for are resolved off
  the filings' own cover pages — 24-0707-EL-BLN (station, $8.7M) and 24-0706-EL-BNR
  (lines, $2.214M), both Cass Township, both fully reimbursed by the IPP — and the
  "Central Findlay" case resolves as a jurisdictional NEGATIVE: that work is 69 kV, below
  the 100 kV threshold in R.C. 4906.01(B)(2), so no OPSB case exists to find. (2) Rocky
  Ford is a GENERATION interconnection for Border Basin I's 120 MW/81 MW solar plant
  (PJM AE1-146, network upgrade n8130) — emphatically not the Megawatt Hub load
  instrument, and the record says so rather than letting a fresh 138 kV substation stand
  in for the missing one. (3) Schedule DCT is read verbatim off the filed sheets, not off
  press summaries: its "Mobile Data Center" definition reaches cryptocurrency mining by
  name, an Existing Load that expands by more than 25,000 kW converts to New Load by
  definition, and behind-the-meter netting carries an instantaneous-curtailment
  obligation. (4) The +300 MW "standalone interconnection site" stays [open] with the
  negative recorded per source — and the PUCO route is recorded as ACCESS-BLOCKED (DIS
  returns an application-firewall page to automated retrieval) rather than as empty, so
  no conclusion is drawn from a docket that was never actually searched. Corrections to
  the issue body's own framing are carried inline: the ~$2.2M belongs to the line project
  alone, the ten Wind-for-Industry turbines sit behind three manufacturers' meters and
  not at the hub, Whirlpool's 14.4 MW + 6.0 MW is a Net Zero project rather than
  Wind-for-Industry, and the OnSite/AEP/Basalt fuel-cell release names neither Findlay
  nor One Power. Open threads are cross-filed in data/site/findlay/leads.yaml.
