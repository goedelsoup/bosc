notes: >-
  #1423. The ONLY WARN notice filed from Putnam County, Ohio in the 2024-2026 window. Publishes
  under the `labor` RecordGroup via the `layoff_notice` block (the classifier key added in
  #1460). ⚠️ All three headcount figures in the instrument are HANDWRITTEN into blanks the
  printed document left empty (letter body 80, General Labor 68, TOTAL 80); the printed positions
  sum to 12 and 68 + 12 = 80, and the ODJFS index row agrees, so four readings corroborate — but
  the employer calls it "approximately" and the extraction carries it as ~80, never as a precise
  payroll count. ⚠️ The closure is EXPECTED, not confirmed: the letter conditions the 2024-07-14
  cease date on no intervening "sale, merger, or other strategic transaction", and nothing in the
  corpus establishes what actually happened — the disposition is [open]. This is NOT a
  data-center record; it is the departure the sweep found where it looked for an arrival, and
  Ottawa's profile keeps facilities=(). See data/extracted/ottawa/data-centers.md.
