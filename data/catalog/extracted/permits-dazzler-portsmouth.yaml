notes: >-
  Ten Ohio EPA §401 / USACE wetland-mitigation extractions for Project Dazzler, sited west
  of U.S. Route 52 near Franklin Furnace / Jr. Furnace, Green Township, Scioto County
  (~38.6067, -82.8392; ~792-914 ac). Relocated from the flat data/extracted/permits/ tree
  into data/extracted/permits/dazzler-permits/ (mirroring the source documents/ tree) and
  split out of the lima-legacy permits collection so the Scioto records stop rendering in
  Lima's Allen-County record — the same peer-exclusion fix as troy-piqua (1484) / Lima
  (1505). Homed to the portsmouth site (corpus_relpaths includes permits/dazzler-permits).
  The disclosed Project Dazzler operator/SiteFacility hunt is a follow-on.
