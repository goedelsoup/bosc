notes: The land path for a federal enclave, which is off the county tax rolls and therefore appears
  in no county CAMA parcel layer — the register key (FEATURENAME) is the federal peer of a parcel id.
  Planning-grade, NOT a legal survey or a cadastral parcel. Acreage is measured from this geometry in
  the site's own UTM zone and may disagree materially with the acreage the enclave's grounding record
  states (WPAFB - 5,230 mapped acres against the 1991 CERCLA agreement's ~8,200); the two are
  independent measurements and neither is adjusted toward the other. Issue 1664, epic 1659.
