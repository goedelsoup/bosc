notes: A federal installation's own land, water, wastewater, power and toxics — the dimensions the
  county-scoped instruments cannot see. Documented figures are PROJECTED from the grounding record
  (supply wells, well fields, treatment units, waste-disposal sites, NPL listing) rather than re-keyed,
  so they cannot drift from it; the registers supply the rest verbatim. An undisclosed figure is null
  ([open]), never defaulted — the installation's electrical load and raw-water withdrawal are both open.
  The toxics block carries the scope severance - a straddling enclave reports TRI from a county the site
  profile did not pick as its economic unit, so the county backdrop misses it by construction. Issue
  1664, epic 1659.
