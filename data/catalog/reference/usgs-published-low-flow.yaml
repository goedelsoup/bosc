notes: >-
  The published counterweight to the network's own derived LP3 denominators (issue 1458). Straub 2001
  supplies a published 7Q10 at a named gage over the pre-1998 record; SIR 2024-5075 supplies modern
  (WY1975-2020) statistics plus, in its table 1, a published per-gage `Regulated`/`Unregulated`
  low-flow classification — the third-party judgment `mainstem-gages.yaml` now cites when it demotes a
  regulated screening denominator. Static published documents at permanent URLs, so there is no
  connector and no regen command; re-fetch is `curl -O` plus a sha256 compare against README.md. Two
  traps recorded in that README — (1) the PDF cover and both CSV headnotes print report number
  "2024-5057" while the publication, DOI and suggested citation are "2024-5075", and both name the
  same instrument; (2) a gage's ABSENCE from SIR 2024-5075 is not evidence of regulation, because
  regulated gages ARE listed with statistics — USGS 04189000 (Blanchard River near Findlay) is absent
  from all three tables with no stated reason.
