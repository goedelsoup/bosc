notes: >-
  Per-site watch-items GeoJSON for Bowling Green; consumed by balance._default_watch_items() as the
  site-specific override (takes precedence over the Lima periplus import) and un-gates
  hydrology_balance via balance.has_site_watch_items (#829/#1995). One feature — Bowling Green
  Water Pollution Control (id=bowling-green-wpc, matching the profile's plant_receiving key;
  10 MGD average design flow, outfall 2PD00009001 → Poe Ditch at RM 2.5, NPDES 2PD00009*TD /
  OH0024139).

  WHAT IT FIXED, and why it was committed before the site's scenarios were. Without it the Bowling
  Green balance falls back to Lima's frozen periplus graph and resolves FOUR ALLEN COUNTY PLANTS —
  Lima WWTP (18.5 MGD), Shawnee II, American Bath, American II — plus a bosc-campus node carrying a
  "2.5 MGD industrial discharge to Lima", ~90 km away, and reports them as Bowling Green's. The
  balance block is persisted into data/scenarios/<slug>/*.scenario.yaml AND published in the
  hydrology-scenarios bundle feed, so writing this site's scenarios first would have published
  Lima's water balance as Bowling Green's. Same pre-emption as Van Wert (#1267).

  With it the assimilative screen resolves the site's signature discharge finding: Poe Ditch 7Q10
  0.364 cfs against a 15.47 cfs design discharge — 0.024:1 chronic dilution, flag `violation`, with
  the acute 1Q10 at 0.285 cfs giving 0.018:1. About 42x effluent dominance: the largest POTW in the
  Portage basin discharging to one of its smallest waters, and the second most effluent-dominated
  municipal discharge in the network after Van Wert's Town Creek — on a plant 2.5x the size.

  THE COORDINATES ARE THE PLANT, NOT THE OUTFALL. Unlike Van Wert's, this fact sheet prints no
  outfall coordinates anywhere in its 35 pages; it locates the discharge by river mile (Poe Ditch
  RM 2.5, Ohio EPA river code 16-108). The point is ECHO's facility location for the treatment
  works at 901 N. Dunbridge Rd. Use it for the balance, never as a surveyed outfall location.

  The summary states exactly ONE "N MGD" token on purpose — the 30 MGD peak hydraulic is omitted
  because balance._design_mgd's prose fallback reads a second token as a flow EXPANSION (the Sidney
  precedent). The structured design flow it actually uses is in the companion
  reference/hydrology/bowling-green/routing.yaml, whose reach-scoped receiving_water key
  ("Poe Ditch (Bowling Green WPC outfall, RM 2.5)") is what assimilative.check_assimilative looks
  the cited low flow up by.

  ONE plant deliberately: the permit's CSO outfall 2PD00009002 (Mercer Road Diversion Chamber) is
  on this same reach but has no design flow — its Long Term Control Plan level of control is an
  event count, not a quantity a dilution screen can take as a numerator. No campus node:
  balance._campus_node is gated on a committed bosc-fm2 forcemain feature and the Meta campus
  commits none, and more fundamentally the campus is not on this water at all (campus HUC-12
  041000100703 Cedar Creek-Frontal Lake Erie vs this outfall's 041000100301 N Br Portage/Poe
  Ditch). No abstraction node either, and that absence is structural rather than missing: Bowling
  Green DRINKS THE MAUMEE at Waterville (HUC 04100009, PWS OH8700311) while discharging to the
  Portage (HUC 04100010) — the two sides of this site's water are in two different basins.
