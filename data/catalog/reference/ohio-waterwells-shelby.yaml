notes: >-
  Every ODNR-logged water well in Shelby County, OH (the Sidney watershed point) — 3,776
  wells, one CSV row each: use type, aquifer, total depth, static water level, reported test
  yield, casing, coordinates. Pulled for issue 1997. Use mix: 2,036 DOMESTIC, 1,367
  unclassified, 152 AGRIC/IRRIG, 84 MONITOR, 23 PUBLIC/SEMI-PUB, 22 OBSERVATION, 13
  MUNICIPAL, 13 DRY/NO WATER, 10 HTG/COOLING, 10 INDUSTRIAL. Same discipline as the Allen
  sibling: a driller figure is [verified] for WHAT THE LOG STATES and no more (the logs are
  self-reported), there is NO pumping-water-level column so specific capacity /
  transmissivity / a drawdown cone are [inference], and owner/name/street columns are not
  ingested (private-resident PII). ⚠️ This census is the groundwater chapter's whole basis at
  Sidney — the `dewatering` half has no route, because no dewatering record has been produced
  for this project and the profile commits no dewatering wellfield. It is also NOT evidence
  about the campus's own aquifer setting: the campus sits ~2 mi west of the Great Miami
  buried valley on the Wisconsinan end moraine (HSG D, issue 1379), and the sole-source-aquifer
  framing that once attached to it is REFUTED. See data/reference/ohio-waterwells/README.md.
