notes: >-
  Verbatim WGS84 NHDPlus river centerlines, one per model reach node (network.yaml), stitched +
  cut by watermark.hydrology.reach_geometry per the committed reach-nav.yaml plan. Display geometry
  feeding the bundle's reach-network feed — the deck.gl FlowLayer particle-advection viz (#1237/#1235).
  Slug-scoped end to end as of issue 1806 (epic 1803 P3) — the nav plan + topology + reach table
  resolve through the SiteProfile pins (Lima keeps its legacy un-slugged paths; a peer commits its
  own under reference/hydrology/<slug>/), and the reach-network feed emits on file presence, never
  the reference-site role. Fort Wayne is the first peer set (the Three Rivers confluence, its three
  [verified] profile gages as anchors): GEOMETRY-GRADE — its reaches.yaml carries `catchments: {}`,
  so the routed-hydrograph feed self-skips there (the issue-1364 present-but-empty rule) rather
  than routing an all-zero storm; committing cited CN/Tc/area catchments is what would light it.
  The NLDI responses are recorded under tests/fixtures/hydrology/nldi/, so `watermark --site
  fort-wayne reaches --offline --write` (with hydro_fixtures_dir set) regenerates byte-identically.
  Sidney is the second peer set (issue 1996) and also geometry-grade. It differs from Fort Wayne
  in what its anchors ARE: two of its four navigated lines are snapped not from a gage but from
  points INSIDE the committed campus parcel assemblage, because NLDI resolves those points to two
  different NHDPlus catchments — the campus straddles a drainage divide, and its runoff reaches the
  Great Miami by Mill Branch on one side and by Mill Creek -> Loramie Creek on the other. Neither is
  the reach the WWTP outfall discharges to. So for this site the reach map carries a substantive
  finding, not only display geometry.
