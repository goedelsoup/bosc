notes: The federal criteria-pollutant concentration limits the Tier-1 AERMOD dispersion screen compares modeled ground-level concentrations against (watermark.air.aermod.dispersion, #1182, epic #1172). Screening reference (single source, no background) — a modeled peak over the standard flags a full demonstration, not an automatic violation. Static published standards — re-transcribe from the cited CFR/EPA table on a revision (e.g. the 2024 annual PM2.5 cut to 9.0 µg/m³); not connector-regenerable.
