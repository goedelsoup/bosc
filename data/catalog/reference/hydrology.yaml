notes: A mixed-provenance hydrology working set; each file carries its own per-quantity provenance
  tags — do not assert one source/license for the whole bundle. Includes the storm-hydrograph
  routing pair (reaches.yaml geometry + the derived routed-hydrograph.yaml summary, issue 1184) and
  the derived thermal-discharge screen (thermal-discharge-screen.yaml, epic 1715 — modelled
  cooling heat rejection AND the corridor's own ECHO-DMR-reported effluent temperatures, read
  against the Ohio numeric temperature criteria; regenerate with `watermark thermal --offline
  --write`). The discharge-routing tables are NOT here — `routing.yaml` and its per-site
  siblings are genuinely slug-scoped and cross basins (Sidney's is Great Miami, Wilmington's Little
  Miami), so they were split out to the `hydrology-routing` entry (#2138) — declared here, under a
  basin:maumee scope, the `{site}` member resolved for no site at all.
