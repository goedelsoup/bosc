notes: topology.yaml is curated/cited; basin-network.yaml is the computed, regenerable cross-site join
  carrying each attribute's own provenance — regenerate via `watermark basin-network --write`, do not
  hand-edit. findlay-ottawa-comparison.yaml is curated/cited (issue 417, rewritten by issue 1458) — the network's
  along-one-river control; each plant is now screened against ITS OWN Ohio EPA fact-sheet design low
  flow at its own outfall (Findlay 0.21 cfs at RM 56.42, Ottawa 7.78 cfs at RM 22.1), NOT against one
  shared derived Blanchard 7Q10 — that gage (USGS 04189000) is regulated and sits below the Findlay
  outfall, so it contained the discharge it was screening. Each node's `activity` block
  now carries the primary campus's disclosed lifecycle — `facility_status` / `operator` / `end_use` /
  `facility_count` (#1628) — so the pure frontend basin/directory builders read data-center status off
  this feed instead of a hardcoded per-slug dict; regenerate basin-network.yaml after a facilities change.
  Each node's `grid.avg_price_cents_kwh` is the EIA-861 bundled standard-service-offer COHORT price
  (#1644) — comparable node-to-node because every node reads the same cohort definition, but NOT an
  all-sector average and NOT an industrial/data-center rate. The `activity` block counts DATA-CENTER
  campuses only (issue 1664) — it reads `SiteProfile.campus`, not `.facility`, so a `federal_installation`
  facility (WPAFB's enclave) is excluded rather than reported as "disclosed data-center facility" with an
  open IT load. A node's `facility_count` is therefore its campus count, not its facility count; the
  enclave surfaces through the site bundle's own `enclave` feed instead.
