notes: >-
  The 44 construction-dewatering wells the developer ("LMA") installed along North Cole Street at
  the BOSC/data-center campus (American Township, Allen County, OH) to lower the water table for
  site grading — shallow (23-41 ft) unconfined sand & gravel, 75-100 gpm each (~4.9 MGD combined
  capacity). Installed 2025-12-16 to 2026-02-12; 43 sealed 2026-05-26..28, one active (3027949).
