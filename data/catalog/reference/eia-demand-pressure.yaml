notes: The headline consumer-impact numbers for a site with a documented facility (#1105) — the
  campus's annual electricity demand as a households-equivalent and a share of state retail sales
  (robust, EIA-cited) plus a STYLIZED price-pressure band from a stated short-run transmission
  coefficient (a screening sensitivity, not a forecast). Facility-gated — written only for sites
  whose SiteProfile carries a documented facility; thin sites omit it. Exposed as the
  economics-demand-pressure bundle feed.
