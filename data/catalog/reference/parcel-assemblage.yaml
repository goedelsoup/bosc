id: parcel-assemblage
title: Per-Site Parcel Assemblage Geometry
scope: reference
status: reviewed
producer:
  kind: connector
  command: parcels --owner <assembler> --geojson data/reference/<site>/parcel-assemblage.geojson
  connector_ref: watermark.hydrology.connectors.allen_gis
  source: Per-site county parcel GIS via the gis_parcel field-map, pulled as f=geojson reprojected
    to WGS84 (Fort Wayne = Allen County, IN iMap, parcel layer 10)
  external_url: https://gis1.acimap.us/imapweb/rest/services/QueryLayers/QueryLayers/MapServer/10
license: Public records (local government open data)
access_tier: public
site_scope: slug-scoped
storage:
- relpath: reference/{site}/parcel-assemblage.geojson
  media_type: application/geo+json
  lfs: false
refresh:
  cadence: on-demand
  last_refreshed: '2026-07-13'
provenance: connector
tags:
- parcels
- gis
- land-assembly
- footprint
notes: >-
  The per-site data-center parcel assemblage geometry (WGS84 GeoJSON, friendly schema-decoded
  properties + a bosc-provenance foreign member). Instantiated for three sites so far. Fort Wayne: the
  11 parcels owned by Hatchworks LLC (the Google land-assembly shell behind Project Zodiac; mailing
  Mountain View CA / Wilmington DE) — anchor 6015 Adams Center Rd (transferred 2024-01-10) plus the
  Tillman Rd cluster (Jan-2024 + a second wave 2025-10-31), ~856 ac planar (UTM 16N). Urbana (#1326):
  the 4 parcels held by the three Thor Equities SPEs (Urbana Owner I/II LLC, Highland55 Investments
  LLC) — the Urbana Technology Hub, ~230 ac at SR-55 & S US-68, from the Champaign County CCEO
  parcel_joined CAMA layer via the champaign_cceo connector. Mansfield (#1431): the Airport West
  I-1->I-2 rezone footprint (City Ordinance 25-086, Petition #561, passed 2025-06-03) — 10 of the
  16 ordinance lots that resolve in the current Richland County Auditor CAMA (~309 ac; Parcel_CAMA
  layer 0, the richland_gis field-map), the other 6 consolidated/renumbered since the rezone. This
  one is a REZONE footprint (a legislative schedule), not an ownership shell. Fort Wayne/Urbana are
  the recorded OWNERSHIP assemblage, NOT a surveyed developed footprint (that stays pending the
  deed/rezoning/stormwater-permit extraction, #360/#362 for FW, #1328 for the Urbana deed pull).
  The Richland GIS is ArcGIS 10.3 (no f=geojson), so Mansfield's file is pulled by an
  esri-rings->GeoJSON recipe (reference/mansfield/README.md), not the f=geojson connector path.
  Troy·Piqua (#1483): the 3 parcels deeded to J5 LLC (dba Shaytura LLC) — the "Project Klondike"
  data-center campus, ~607.8 ac north of Farrington Rd in the Piqua I-75 Business Park, from the
  Miami County auditor parcel_joined CAMA layer via the miami_gis field-map. The recorded OWNERSHIP
  campus (a nested scope within the larger ~1,026-ac annexation record / ~1,200-ac business park);
  the adjacent J3 Development LLC parcel is an [inference] lead, excluded.
  Sidney (#1379): the ONE parcel deeded to Amazon Data Services, Inc. — the AWS "Project Galaxy"
  campus at the NW corner of S Vandemark Rd & W Millcreek Rd, 243.092 ac deeded / 235.468 ac
  planar, from the Shelby County auditor CAMA via the new shelby_gis field-map (the SCEO AGOL
  Parcels layer, which REPLACED the OGRIP statewide substitute — for Shelby that view is both
  owner-redacted and a 2023-05-23 extract, predating the whole transfer). A CONSOLIDATION rather
  than a surviving assemblage: Lot 7658 / Plat V37 P50 absorbed five predecessor tracts, one of
  which carried the "2388 W. Millcreek Rd" situs the #511 register searches on — so that address
  is retired, not wrong, and the reconciliation is a geometric containment test against the 2023
  OGRIP layer. The same-day DP&L conveyance next door (26-03-429-009) is an [inference] lead,
  excluded.
  Van Wert (#1403): the FIVE parcels deeded to QTS VAN WERT LLC — the "Van Wert Mega Site"
  campus north of U.S. Route 30 between Stripe and Mendon Roads, 900.59 ac deeded / 901.502 ac
  planar and CONTIGUOUS (their union is one polygon), from the Van Wert County auditor CAMA via
  the van_wert_gis field-map (the county's AGOL parcel_joinedVWOH layer, #421). The recorded
  OWNERSHIP holding, and the only one in the set that reconciles against the operator's own
  published acreage: 900.59 ac against QTS's quoted 902-ac campus is 0.16%, while it is 61.4 ac
  short of the ~962 ac the City annexed on 2026-05-11 (that gap stays [open] — the ordinances'
  legal descriptions are not in the corpus). Two shape notes for re-pulls: the county stores one
  parcel as SEVERAL polygon rows, so the raw f=geojson pull returns 11 rows for these 5 PINs and
  the committed file dissolves them per parcel (gis_row_count records how many, an area-lossless
  merge); and this layer is thinner than Shelby's or Champaign's — no owner mailing address, no
  legal description, no grantor, no deed book/page — so the deed CHAIN (Marsh Foundation -> Thor/
  Form8tion -> QTS) is not closable from it and stays a Recorder pull (#1401). The adjacent Marsh
  Foundation remainder (19-041272.0000 et al.) is an [inference] lead, excluded.
  Ottawa (#1420): the TWO contiguous parcels of the former Sylvania / GTE / Philips Display
  Components (LG.Philips Displays USA) CRT plant campus at 700-804 N Pratt St, 38.234 ac deeded /
  38.293 ac planar, from the Putnam County auditor CAMA via the putnam_gis field-map (the county's
  self-hosted Parcels layer 0, #420). THE ONE ENTRY IN THIS SET THAT IS NOT A DATA-CENTER SITE:
  it is a closed industrial works — the county's largest employer until 2002-12-31 — now a
  $4,571,596 three-round Ohio Brownfield Remediation Program remediation, and Ottawa's SiteProfile
  carries facilities=(). It is committed as the site's anchor PLACE, which is enough to activate
  the places domain, and must not be read as a siting. Also unlike the others it has TWO unrelated
  owners (OTTAWA OH LLC and VERHOFF PROPERTIES LLC, both since 2006), so the `parcels --owner`
  path cannot pull it in one call — the recipe is a PIN-list query, documented in
  reference/ottawa/README.md. Three notes for a re-pull. The layer's `District` and `Class` columns
  read 0 on BOTH campus parcels while a neighbour reads 32/3, so a `District = 32` filter silently
  DROPS the campus — filter on PIN or CLASS_1. The wired layer LAGS its sibling
  Parcels/ParcelsJoined on ownership (which also keys on a different id column, so a PIN-shaped
  query against its `Parcel` field returns zero rows rather than an error); the two agree on both
  campus parcels, so the committed record is corroborated, not affected. And a third county layer,
  Land_Features/LandUseParcels, publishes a DIFFERENT improvement value for 804 N Pratt — the
  levied half-year tax reconciles with layer 0's, not with it, at the same effective millage to
  seven figures. The inlots the #1420 issue text lists as the rest of the campus (1541/1542/1543)
  are 207-1,090 m away and are excluded: Putnam issues inlot numbers in platting order, not
  geographic order. The adjacent industrial IL 1536 (Agner Road Investments LLC, one street width
  off) is an [inference] lead, excluded.
  Distinct from the Periplus frozen import
  (reference/periplus/bosc-parcels.geojson, catalogued under the periplus entry), which covers the
  Lima corridor parcels only.
