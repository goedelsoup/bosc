  plume-vs-first-flush verdict are [inference]. The raw sub-daily record is frozen as a committed
  NWIS IV fixture because the IV service retains only ~120 days. Optical/ionic surrogates are NOT a
  nitrogen measurement — the reach nitrogen signal comes from the OEPA/Napoleon grab samples.'
