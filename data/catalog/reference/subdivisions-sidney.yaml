notes: >-
  The second peer civic registry after Findlay's (#1839), and grounded differently because Shelby
  County publishes no equivalent of Hancock County's "Directory of Officials" — a dated negative
  across five routes on 2026-08-11, so `grounded_sources` is a LIST and most bodies carry
  `meeting_schedule: null`. What this site has instead is stronger for the body that matters: the
  City's Council Rules, adopted BY ordinance under Charter §2-13 (the Charter is the codified
  instrument, not the Rules), print the cadence verbatim, and all six
  Project Galaxy vote dates fall on it with no inference. ⚠️ The registry also carries the route
  correction that came out of the discovery pass: the City's legislative portal
  `sidneycityoh.documents-on-demand.com` is reachable — the Cloudflare 403 is triggered by the
  HTTP/2 fingerprint, not the client, and the host answers HTTP/1.1 with a browsable JSON API. Seven bodies:
  City Council, City Planning Commission, the county board (civicplus, ingestable today with the
  existing fetcher — verified at 26 parsed MeetingDocs), the county RPC, Clinton Township (the
  campus's own), and the two school boards party to Res. 81-25 / 82-25.
