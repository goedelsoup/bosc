notes: >-
  Per-site watch-items GeoJSON for Wilmington; consumed by balance._default_watch_items() as
  the site-specific override (takes precedence over the Lima periplus import). TWO features.
  (1) The Wilmington WWTP (id=wilmington-wwtp, 3.0 MGD design flow, outfall 001 → Lytle Creek
  RM 6.83). ECHO coordinates [verified via FRS Registry ID 110000760686]; address 475 S Nelson
  Ave confirmed from Ohio EPA 1PD00013*QD fact sheet. (2) Clinton Substation
  (id=clinton-substation), added at #1469 — AES Ohio's 345/69 kV station and the delivery
  point named in PJM M-3 Need Dayton-2025-002 for a 35 MW → 500 MW customer request, and the
  eastern terminus of the Fayette–Clinton 345 kV line (OPSB 25-0871-EL-BLN). Its position is
  from the county auditor's parcel polygon, not from the LON's route map, which is a raster at
  county scale with no georeference — no route geometry is derived from that map, since a
  traced line would be fabricated. The line route itself is therefore NOT a feature here and
  stays [open] pending the application's exhibits, which are behind the PUCO DIS block.

