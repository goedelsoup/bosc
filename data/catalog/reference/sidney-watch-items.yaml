notes: Per-site watch-items GeoJSON for Sidney; consumed by balance._default_watch_items()
  as the site-specific override (takes precedence over the Lima periplus import) and
  un-gates hydrology_balance via balance.has_site_watch_items (#829/#1995). One feature —
  the Sidney WWTP (id=sidney-wwtp, matching the profile's plant_receiving key; 7.0 MGD
  average design flow, outfall 001 → Great Miami River at RM 128.68, NPDES 1PD00009*SD /
  OH0027421). The summary states exactly ONE "N MGD" token on purpose — the 13.5 MGD peak
  hydraulic is omitted because balance._design_mgd's prose fallback reads a second token as
  a flow EXPANSION. The structured design flow it actually uses is in the companion
  reference/hydrology/sidney/routing.yaml.
