notes: >-
  Every WWFRP-registered facility in Licking County, OH — the makeup-side record for the B6
  (#1686) positive-control review of epic #1676. It carries the county's three data-center-era
  registrations: Intel Corporation - New Albany (03498, 7 wells / 1.43 MGD registered) and two
  Amazon Data Services sites (03401 CMHO50 New Albany, 03575 Newton Court). Their reported
  amounts are the finding: all three sit at or near zero reported withdrawal because their
  operating water is PURCHASED MUNICIPAL supply, which the WWFRP — a registry of withdrawals
  from waters of the state — does not see. So a WWFRP ~0 for a municipally-supplied facility is
  not evidence of a dry cooling loop; it is the registry's blind spot, and the A3 harness
  classifies such a facility route_blind rather than corroborated. Intel's non-zero series
  (15.91 MG in 2024, ~89% returned, peaking May-June and troughing July-August) is
  construction-phase groundwater, not cooling makeup. The facility registry is kept in full;
  annual series are floored at 2015. See data/reference/ohio-water-withdrawal/README.md.
