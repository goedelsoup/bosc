notes: The per-chemical Ohio water-quality criteria (acute CMC / chronic CCC / human-health, mg/L) the industrial toxic screen reads each pollutant's derived receiving-water concentration against (watermark.hydrology.toxics, WS-07, issue 1607). Screening reference (complete mix, no mixing-zone credit) — an exceedance flags the need for a WQBEL determination, not an automatic violation. Metals are hardness-dependent (evaluated at a stated 100 mg/L reference hardness, equation committed for re-derivation); ammonia at a stated pH/temperature. Static published standards — re-transcribe from the cited OAC rule on a revision; not connector-regenerable.
