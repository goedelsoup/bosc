notes: Per-facility RSEI Score/Hazard/pounds for Allen County, OH (FIPS 39003), reduced from EPA's RSEI
  Public Data Set v2.3.12 by joining five relational tables; slug-scoped (Lima keeps the legacy un-slugged
  path). `enclave.yaml` is a SECOND, one-facility reduction for a site with a federal installation (issue
  1664, `watermark enclave`) - scoped to the enclave's OWN reporting county rather than the site's
  `rsei_fips`, which for a straddling base is a different county. It never replaces `inventory.yaml`; the
  county backdrop stays the readiness floor signal.
