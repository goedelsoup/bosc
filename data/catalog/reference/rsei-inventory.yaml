id: rsei-inventory
title: Allen County, OH RSEI Toxic-Release Inventory (EPA RSEI Public Data Set v2.3.12)
title_template: '{county_state} RSEI Toxic-Release Inventory (EPA RSEI Public Data Set v2.3.12)'
scope: reference
status: reviewed
producer:
  kind: connector
  command: rsei
  connector_ref: watermark.rsei
  source: EPA RSEI Public Data Set v2.3.12 (EPA gaftp Public Release Data), version v2312
  external_url: https://www.epa.gov/rsei/ways-get-rsei-results
license: U.S. Government work (public domain)
access_tier: public
site_scope: slug-scoped
storage:
- relpath: reference/rsei/inventory.yaml
