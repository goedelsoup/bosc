notes: The site-specific tax mechanics and what-if knobs the economic scenario bands run on
  (watermark.economics.scenarios, ME-F issue 1665) — the statutory assessment ratio, the local effective
  commercial millage (a STATED ASSUMPTION, not a cited county rate; the single largest unforced
  uncertainty, and it scales every dollar figure linearly), the county sales-and-use rate, the four
  withheld knobs as screening bands, and the discrete building-share x jobs profiles the ledger is
  priced across. Curated, not connector-regenerable. INSTRUMENT-gated by
  SiteProfile.abatement_parameters_relpath — only a site with an abatement agreement on the record
  declares one, so no peer is priced off another county's mills. Everything computed from it is a
  labeled counterfactual, tagged [open] / confidence low by construction; the GovCloud profile is a
  what-if on two knobs, NOT a defense finding (docs/defense-nexus.md).
