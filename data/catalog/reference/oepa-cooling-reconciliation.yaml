notes: >-
  Per-facility reconciliation of each closed-loop-claiming data-center facility's cooling
  archetype CLAIM against its DOCUMENTED water account — the A3 harness of the closed-loop
  cooling cycling epic (#1676, sub-issue A3 #1679). For each facility it assembles the
  predicted makeup/blowdown (running the pinned `SiteFacility.cooling_model` through
  `watermark.hydrology.cooling_models`) against documented makeup (A1 withdrawal) / blowdown
  (A2 discharge), back-solves cycles-of-concentration where both are on record (an
  `[inference]` bracket, never a scalar), and classifies each into `discrepancy` (a low-water
  claim contradicted by documented flow → re-archetype up), `corroborated` (documented water
  consistent with the claim), `reservation_conflict` (a low-water claim contradicted by a
  disclosed RESERVATION CEILING — a will-serve / water-agreement figure, not a metered use and
  not a discharge/withdrawal instrument → keep the pin, sharpen the site's water lead; B1
  Troy-Piqua #1681), or `gap` (no documented water → a C2 records-request lead payload, #1688).
  The harness RECOMMENDS; it never mutates `cooling_model` (re-archetyping is a reviewed B1–B6
  edit). The **Troy-Piqua B1 reservation conflict** (#1681) is appended explicitly — it pins
  `UNKNOWN` (so it is NOT in A2's registry-derived cohort) but its closed-loop-FAQ-vs-2.0-MGD-
  reservation conflict is reconciled as a first-class live finding, back-solving CoC ≈ 2.0 off
  the reservation ceilings (an `[inference]` bracket, never a headline consumptive). **Van Wert**
  (B2 #1682) IS in A2's cohort but is reconciled explicitly so its operator-DISCLOSED ~660k gal
  ongoing draw is recorded on `disclosed_makeup` (never `documented_*` — a self-report is not a
  metered instrument): the outcome stays a `gap` that KEEPS the `[reference]` pin (never upgraded),
  and its lead names the specific open quantity — the initial closed-loop fill, whose fill-vs-annual
  framing is the #1409 discrepancy. **Springfield** (B3 #1683) is likewise a cohort member reconciled
  explicitly: the 300,000 gal/day figure is a permitted-withdrawal CEILING self-disclosed by the City
  5C FAQ that makes the "not evaporative" claim, recorded on a new `disclosed_ceiling` slot. A permitted
  PEAK ceiling from the claim's OWN source is NOT a `reservation_conflict` (unlike B1's
  independently-negotiated reservation, a dry loop sits far below it) — so, like `disclosed_makeup`, it
  never feeds the classifier and never upgrades the source; the outcome stays a `gap` with the
  `[reference]` pin KEPT, and its lead names the actual-vs-ceiling denominator (pull the metered
  municipal withdrawal, #1415). **Bowling Green** (B5 #1685) is a cohort member reconciled
  explicitly, and lands the second `reservation_conflict`. Meta claims the campus is "closed-loop,
  liquid-cooled with DRY COOLERS — no operational water", an architecture claim specific enough to
  be falsifiable, and the site carries TWO quantified figures that conflict 12-fold: a
  district-linked design commitment of "up to" ~600,000 gpd and Meta's own announced ~50,000 gpd.
  They are split by PROVENANCE, not by size — the district's figure is a demand signal independent
  of the claim's source, so it lands on `reserved_makeup` and classifies; Meta's is a self-report of
  the very claim under test, so it lands on `disclosed_makeup` and never does. The conflict itself
  (recorded at #1439) is reported, not resolved. The row also exercises the reach guard's ordering
  on a real second site: the makeup route IS blind — the campus buys finished water, so the Ohio DNR
  registry carries no Meta/Liames/Accordion/NWWSD registration in Wood County at all — yet the
  outcome is `reservation_conflict` and not `route_blind`, because a negotiated ceiling was never
  something A1 or A2 could have metered. That A1 negative is READABLE rather than merely empty
  because the Apollo plant registered a 0.27 MGD intake in the campus's own HUC-12 on 2026-03-26:
  the register is live at this site, so the absence is a route. A full ECHO CWA sweep of Wood County
  (FIPS 39173, 2026-08-01; 241 records, 50 effective individual NPDES permits) finds every
  campus-linked record under the CONSTRUCTION stormwater general permit with no process outfall and
  no DMR. The pin is KEPT at `closed_loop_dry` `[reference]`, and the lead names BOTH holders — the
  service agreement and campus meter are the water district's, the wholesale contract is the City's.
  **New Albany / Intel** (B6 #1686) is the positive control the
  epic designated, reconciled as a live row and landing on a fifth outcome, `route_blind`. Intel
  discloses 125 permitted cooling towers — the honest evaporative case — and still cannot be
  reconciled: Ohio One is a semiconductor fab (NAICS 334413), it does not operate until 2030-31,
  and its makeup will be PURCHASED City of Columbus water while its process wastewater goes to the
  Columbus sanitary sewer. Both sides therefore sit outside the instruments this harness reads (the
  WWFRP meters withdrawals FROM waters of the state, not purchases; a sewer discharge files no DMR
  — Intel's whole CWA record is three non-major construction general-permit coverages with zero DMR
  loads), so both return ~0 BY CONSTRUCTION and the classifier was reading that ~0 as "documented
  ≈ 0 → corroborated dry". The two operating Amazon Data Services registrations in the same county
  demonstrate the blind spot independently (0.02 MG and 0.00 MG reported for 2024). Hence the cited
  `WaterRoute` (supply/discharge) and `route_blind`, which invalidates a NEGATIVE read only — a
  documented flow, a reservation ceiling, or a wet claim matched by real water all still adjudicate.
  Two slots serve it: `nonprocess_makeup` (a documented, metered withdrawal that IS on record but is
  NOT the cooling account — Intel's 0.0435 MGD of construction-phase groundwater, ~89% returned,
  peaking in May while July-August are the year's lowest, the inverse of an evaporative signature)
  and `prediction_refused`, which leaves `it_load` + all three `predicted_*` null because every
  archetype is IT-load-parameterized and a fab has no IT load. `meta.reference_band` records the
  per-IT-MW evaporative screening band, derived from the archetype spec and explicitly NOT from the
  fab that was supposed to ground it. **Urbana** (B4 #1684) is the second `route_blind` row and the
  origin of the whole pattern — the campus whose disclosed "water use comparable to a standard
  office building" took the buried-valley abstraction thesis off the table (#1327) before the same
  framing appeared at the other sites. Its route rests on the CITY'S OWN instruments rather than
  press: Ord. 4612-24's Pre-Annexation Agreement obliges the City to "provide water and sewer" (and
  makes failing to a de-annexation trigger), so the campus buys City water — absent from all 31
  Champaign County WWFRP registrations, a SEARCHED absence — and discharges to the City WPCF sewer
  (no outfall, so no DMR; a City industrial-user permit under its OEPA-audited pretreatment program
  is what would carry it, and ECHO never holds those). Its claim also carries NO figure at all, so
  unlike Van Wert/Springfield nothing lands on the `disclosed_*` slots. What the registry does reach
  is the SUPPLIER, on a sixth slot `supplier_withdrawal`: the City reported 644.99 MG in 2024
  (1.76 MGD) across two plants on the same buried-valley aquifer. Like every non-`documented_*`
  register it NEVER feeds the classifier — a system total aggregates every customer on it — and a
  model validator refuses it without a cited municipal supply route. It is carried as the
  DENOMINATOR: an evaporative read of the same campus at its own screening IT-load bracket implies
  0.49-1.64 MGD, i.e. 28-93% of everything the City withdrew, while the office-building reading sits
  below the 0.01 MGD noise floor — and no instrument on either side can tell them apart. Every other
  live cohort facility resolves to `gap` today (no documented makeup/blowdown: OHD000001 was
  WITHDRAWN on 2026-07-21 rather than finalized, so no general-permit coverage will ever appear, and
  no facility-own DMR is on record). Each record
  also carries the A4 (#1680) `corroborators` block — two independent tells reconciled against
  the claim (`watermark.hydrology.cooling_corroborators`): the facility's own air permit
  listing cooling towers as PM (drift) sources (read from `SiteFacility.air_permit_relpath`;
  `pm_source_listed` CONTRADICTS a `closed_loop_dry` claim, CORROBORATES an evaporative/hybrid
  one) and its Tier II / EPCRA-312 cooling-water treatment chemistry (a SERC/LEPC-held forward
  seam, `not_on_record` for the live cohort). They are SECONDARY — recorded + reconciled but
  never changing the `outcome` and never the sole basis for a re-archetype. The Intel row is a
  constructed openly-evaporative POSITIVE CONTROL the harness must classify `corroborated`, not
  a false `discrepancy` — a calibration vector, not documented Intel data (its corroborators
  are both constructed-positive). **The C2 lead payloads are re-aimed off the dead general permit**
  (#1883): a `gap`/`route_blind` row's `records_sought` and `holder` used to name "facility-own or
  OHD000001 coverage" and "Ohio EPA (NPDES / OHD000001)" — a records request pointed at a permit
  that will never issue. They now name the two instruments that survive the 2026-07-21 withdrawal:
  an INDIVIDUAL NPDES permit + DMR on a direct-discharge path, and the City's industrial-user (IU)
  / pretreatment permit + sewer-use agreement on a sanitary-sewer route (a sewer-discharging campus
  holds no NPDES permit at all). Depends on `oepa-ohd000001-coverage` (the A2 blowdown-coverage
  resolution it reads). See data/reference/oepa/README.md.
