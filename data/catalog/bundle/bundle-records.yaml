notes: >-
  The per-site content bundle the Astro frontend reads at build time (data/site/bundles/<slug>/,
  regenerable and git-ignored — hence no committed storage; a virtual DAG node, #1024).
  depends_on declares the committed reference datasets the export verifiably reads: the RSEI/
  economics/LEI/watershed feeds plus the basin network synthesis (ECHO dischargers, low-flow
  lookup, per-site grid profiles) and the EIA consumer-energy price/sales series now surfaced
  as the `consumer-energy` feed for charting (#1111). The export also emits the `catalog-index`
  feed — the hydrated catalog of addressable "grabbable" atoms the user-authored Stories write/read
  paths resolve against (#1090/#1093), derived from the feeds above so it adds no new committed
  upstream. The `routed-hydrograph` feed (#1184) routes the loop's design-storm hydrographs down the
  cited confluence graph, reading the `hydrology` bundle's network topology + reach geometry.
  The `energy-burden` feed (#1110) derives the household energy burden — % of median household
  income (economics-baseline B19013) spent on residential electricity + heating (eia-consumer-energy)
  — adding no new committed upstream (both inputs are already declared dependencies).
  The manifest also carries a `readiness` block (#1220, contract 1.17.0) — the standing
  domain-activation readiness (five domains × absent|seeded|live + a derived tier) computed from
  the assembled feed counts + the site profile at every export, so it adds no new committed upstream.
  The air-quality feeds (#1172, contract 1.18.0) — `air-scenarios` (Tier-0 backup-genset emissions
  vs the synthetic-minor NSR caps) and `air-dispersion` (Tier-1 AERMOD concentration screen vs
  NAAQS) — read the committed `air-emission-factors` (AP-42 §3.4) and `air-naaqs` reference datasets
  plus the site air permit + committed air scenarios (facility+permit-gated; absent → section locks).
  The `air-dispersion-field` feed (#1232/#1237, contract 1.19.0) reshapes the same AERMOD screening
  run into the gridded concentration surface the deck.gl field viz renders (reference-site gated,
  `assumption`-provenanced) — reading the same air upstreams, so it adds no new committed dependency.
  The `reach-network` feed (#1235/#1237, contract 1.20.0) carries the real river-centerline geometry
  the deck.gl FlowLayer particle-advection viz advects over — reading the committed `hydrology-reaches`
  NHDPlus centerlines (regenerated from USGS NLDI), reference-site gated.
  The `greenops` feed (#1076/#1084, contract 1.21.0) lifts the committed `greenops-footprint`
  artifact (the platform's own usage → electricity → water compute footprint) into the report the
  sustainability page reads — a global object feed emitted into every bundle identically (like the
  basin `network` synthesis), every figure tagged reference/derived/assumption (never verified).
  The `water-seasonal-field` feed (#1236/#1237, contract 1.22.0) is the Phase-2 water field — the
  seasonal net-atmospheric-withdrawal climograph `evaluate_seasonal` produces (reference ET0 − precip
  from the NASA POWER normals, screened against the cited Ottawa low flows and the buildout scenario
  draw), reference-site gated and `reference`-provenanced; it reads the committed climate + low-flow
  reference datasets + the buildout scenario already declared, so it adds no new committed dependency.
  The `contacts` feed (contract 1.24.0) is the curated per-site contacts directory — the human
  contact points a reader can reach (petitioners, organizers, officials, groups, outlets) — read from
  the committed `data/site/contacts.yaml` (slug-scoped like `leads`/`exhibits`, so a sibling carries
  its own; absent → the feed is skipped and the section locks). It's curated site content, not a
  catalog-tracked reference dataset, so it adds no new committed upstream; it's the spine the
  interactive petition-connect + bulletin surfaces reference.
  The `facts` feed (#1587, contract 1.25.0) is the normalized `(subject, predicate, value, unit,
  status, evidence)` projection over the bundle's already-provenanced numeric values — a
  `catalog-index`-style post-pass (`watermark.site.facts`) that re-keys each `ProvenancedValue`
  in the economics / greenops / hydrology / air feeds plus the derived facility `PowerBasis` into
  one queryable table (powering the `get_facts` MCP tool). It reads only feeds/derivations already
  declared above (and the profile-derived power basis), so it adds no new committed upstream.
  The `passages` + `passage-embeddings` feeds (#1589, contract 1.26.0) are the page-level excerpt
  index the `search_passages` MCP tool reads — one page-cited passage per text-bearing page of each
  *published* source PDF (scoped to the default-deny publish allowlist so no non-published source
  text ships), plus its all-MiniLM-L6-v2 vector companion. The source PDFs are Git-LFS-tracked and
  the frontend build checks out without LFS, so extraction runs out-of-band (`watermark passages`,
  needs `git lfs pull`) into the committed `data/site/passages.ndjson` artifact; the export reads
  that artifact and filters it to the site's published docs, adding no new committed reference
  upstream (the artifact is a curated site input, like `published-documents.yaml`).
  The `open-questions` feed (#1568, contract 1.27.0) aggregates the corpus's still-open threads —
  every `[open]`-tagged lead (the curated `leads` board) + every `[open]`-tagged cell of the
  `(site × hypothesis)` matrix — into one flat, provenanced list, porting yidam's `open-questions`
  model (open ⇔ the `[open]` tag). Like `facts`, it's a `catalog-index`-style post-pass projection
  (`watermark.site.open_questions`) over the just-assembled `leads` + `hypothesis-assessments`
  (+ `hypotheses` for lens labels) feeds, so it reads only feeds already produced above and adds no
  new committed upstream; a lead names its own `source`, and an open matrix cell (which carries no
  citation by rule) traces to its committed `data/hypotheses/<hid>/<site>.yaml` file. Skipped for a
  site with no open threads.
  The `documents` feed gains version / duplicate-cluster metadata (#1590, contract 1.27.1) —
  `duplicate_cluster` / `canonical_document_id` / `version` / `supersedes` — projected onto the
  catalogued source files by `watermark.site.docversions` from the curated custody manifest
  `data/site/document-versions.yaml` (a slug-scoped site input, like `published-documents.yaml`, so
  it adds no new committed reference upstream). It lets retrieval collapse a filing's versions to
  the canonical one while keeping a superseded version's distinct evidence (the `deduplicate` /
  `version_policy` args on `search_corpus` / `search_passages`).
  The `corpus-index` feed (#1573, contract 1.28.0) is the browsable node map behind `/wiki/corpus` —
  one row per node of the yidam corpus mirror (`watermark corpus-mirror`) with its display kind,
  in/out degree, line count, and freshness (the newest commit of the committed source the node
  derives from; null when it has none). Unlike the `catalog-index`-style post-passes above it
  re-builds the mirror itself (`watermark.site.corpus_index` over `build_mirror`), so it reads the
  committed corpus directly and adds no new committed reference upstream; always emitted (a mirror
  is never empty).
  The manifest also carries an `exports` block (#1574, contract 1.29.0) — the yidam corpus mirror
  (the committed corpus projected into `yidam://corpus/*` nodes) serialized into downloadable graph
  interchange files under `exports/` (`corpus.ttl` + `corpus.jsonld` RDF and `corpus.graphml`), each
  recorded as an `ExportRef` with its node/edge counts. `watermark.site.graph_exports` renders them
  from the same in-memory mirror the `.yidam` regen builds (a faithful Python peer of yidam's
  `export_rdf` / `export_graphml`), so it reads only the corpus already assembled above and adds no
  new committed upstream; emitted at canonical export only and git-ignored like the rest of the
  bundle, surfaced for download from `/wiki/graph/exports`.
  The `corpus-nodes` feed (#1575, contract 1.30.0) is the searchable peer of `corpus-index` — the
  substrate behind the wiki "ask this concept" affordance. It projects the *same* yidam mirror
  (`watermark.site.corpus_nodes`, sharing the one `build_mirror` projection with `corpus-index`)
  into one retrieval unit per node, carrying its searchable text (the canonical `node_text`,
  reconciled with the semantic index so lexical + vector surfaces tokenize the same content), its
  evidence tag, its wiki page key, and its undirected 1-hop adjacency — so a concept page runs
  client-side lexical retrieval scoped to its own corpus neighborhood (offline, no server; the D3
  spike's verdict, #1576). Like `corpus-index` it reads the committed corpus directly and adds no
  new committed upstream; always emitted (a mirror is never empty).
  The `facility` feed (#1628, epic #1626 F2, contract 1.31.0) is the disclosed data-center inventory
  — one row per campus of the primary+secondary `SiteProfile.facilities` list with its lifecycle
  status / operator / end-use / IT-load bracket / disclosure / cooling model / committed geometry —
  plus the compact `facility` manifest block (the primary campus's status + campus count, the per-slug
  badge source the frontend reads in place of the retired hardcoded `FACILITY_STATUS` dict). It
  projects the site profile's structured facilities (`watermark.site.facility`), reading only
  profile-declared data + the already-committed per-facility geometry (a slug-scoped site input, like
  `leads`/`contacts`), so it adds no new committed reference upstream; facility-gated — the feed is
  skipped and the manifest block absent for a site with no disclosed facility.
  The `defense-contractors` feed (#1662, ME-C, contract 1.32.0) now joins the committed `usaspending`
  reference dataset — the per-site pinned federal-award watchlist resolved against USASpending.gov —
  onto each seed prime through its matched corpus entities (the same `uei`/`lei` the entity graph is
  enriched by), so a contractor finally carries the federal dollars (`total_obligations`, `nexus`,
  defense-vs-civilian share, annual flow, PSC/NAICS mix) that previously reached only the graph. This
  adds `usaspending` as a declared upstream (slug-scoped like `rsei-inventory`; Lima flat, a peer reads
  its own `<slug>/awards.yaml`); the seed list + parcel scan the feed also reads are curated site
  inputs, not catalog-tracked reference datasets.
  `watermark export` pre-flights this chain and warns when an upstream is downstream-stale;
  regenerate with `watermark catalog run bundle-records --site <slug>`.
