notes: >-
  The per-site content bundle the Astro frontend reads at build time (data/site/bundles/<slug>/,
  regenerable and git-ignored — hence no committed storage; a virtual DAG node, #1024).
  depends_on declares the committed reference datasets the export verifiably reads: the RSEI/
  economics/LEI/watershed feeds plus the basin network synthesis (ECHO dischargers, low-flow
  lookup, per-site grid profiles) and the EIA consumer-energy price/sales series now surfaced
  as the `consumer-energy` feed for charting (#1111). The export also emits the `catalog-index`
  feed — the hydrated catalog of addressable "grabbable" atoms the user-authored Stories write/read
  paths resolve against (#1090/#1093), derived from the feeds above so it adds no new committed
  upstream. The `routed-hydrograph` feed (#1184) routes the loop's design-storm hydrographs down the
  cited confluence graph, reading the `hydrology` bundle's network topology + reach geometry.
  The `energy-burden` feed (#1110) derives the household energy burden — % of median household
  income (economics-baseline B19013) spent on residential electricity + heating (eia-consumer-energy)
  — adding no new committed upstream (both inputs are already declared dependencies).
  The manifest also carries a `readiness` block (#1220, contract 1.17.0) — the standing
  domain-activation readiness (five domains × absent|seeded|live + a derived tier) computed from
  the assembled feed counts + the site profile at every export, so it adds no new committed upstream.
  The air-quality feeds (#1172, contract 1.18.0) — `air-scenarios` (Tier-0 backup-genset emissions
  vs the synthetic-minor NSR caps) and `air-dispersion` (Tier-1 AERMOD concentration screen vs
  NAAQS) — read the committed `air-emission-factors` (AP-42 §3.4) and `air-naaqs` reference datasets
  plus the site air permit + committed air scenarios (facility+permit-gated; absent → section locks).
  The `air-dispersion-field` feed (#1232/#1237, contract 1.19.0) reshapes the same AERMOD screening
  run into the gridded concentration surface the deck.gl field viz renders (reference-site gated,
  `assumption`-provenanced) — reading the same air upstreams, so it adds no new committed dependency.
  The `reach-network` feed (#1235/#1237, contract 1.20.0) carries the real river-centerline geometry
  the deck.gl FlowLayer particle-advection viz advects over — reading the committed `hydrology-reaches`
  NHDPlus centerlines (regenerated from USGS NLDI), reference-site gated.
  The `greenops` feed (#1076/#1084, contract 1.21.0) lifts the committed `greenops-footprint`
  artifact (the platform's own usage → electricity → water compute footprint) into the report the
  sustainability page reads — a global object feed emitted into every bundle identically (like the
  basin `network` synthesis), every figure tagged reference/derived/assumption (never verified).
  The `water-seasonal-field` feed (#1236/#1237, contract 1.22.0) is the Phase-2 water field — the
  seasonal net-atmospheric-withdrawal climograph `evaluate_seasonal` produces (reference ET0 − precip
  from the NASA POWER normals, screened against the cited Ottawa low flows and the buildout scenario
  draw), reference-site gated and `reference`-provenanced; it reads the committed climate + low-flow
  reference datasets + the buildout scenario already declared, so it adds no new committed dependency.
  The `contacts` feed (contract 1.24.0) is the curated per-site contacts directory — the human
  contact points a reader can reach (petitioners, organizers, officials, groups, outlets) — read from
  the committed `data/site/contacts.yaml` (slug-scoped like `leads`/`exhibits`, so a sibling carries
  its own; absent → the feed is skipped and the section locks). It's curated site content, not a
  catalog-tracked reference dataset, so it adds no new committed upstream; it's the spine the
  interactive petition-connect + bulletin surfaces reference.
  The `facts` feed (#1587, contract 1.25.0) is the normalized `(subject, predicate, value, unit,
  status, evidence)` projection over the bundle's already-provenanced numeric values — a
  `catalog-index`-style post-pass (`watermark.site.facts`) that re-keys each `ProvenancedValue`
  in the economics / greenops / hydrology / air feeds plus the derived facility `PowerBasis` into
  one queryable table (powering the `get_facts` MCP tool). It reads only feeds/derivations already
  declared above (and the profile-derived power basis), so it adds no new committed upstream.
  `watermark export` pre-flights this chain and warns when an upstream is downstream-stale;
  regenerate with `watermark catalog run bundle-records --site <slug>`.
