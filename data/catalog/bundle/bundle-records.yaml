id: bundle-records
title: The published content bundle — typed feeds + manifest (watermark export)
scope: bundle
status: reviewed
producer:
  kind: derived
  command: export
  connector_ref: watermark.site.export
  source: watermark export — assembled from the committed corpus + reference datasets
license: Site content — CC BY 4.0 over public-record sources (see web/README.md)
access_tier: public
site_scope: slug-scoped
depends_on:
- air-emission-factors
- air-naaqs
- echo-maumee-npdes
- economics-baseline
- eia-consumer-energy
- eia-demand-pressure
- eia-grid-profile
