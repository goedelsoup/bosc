meta:
  subject: >
    Canonical filename map for urbana/council/ — the City of Urbana legislative record behind the
    Urbana Technology Hub incentive instruments (#1354): the pre-annexation agreement (Ord.
    4612-24), the Community Reinvestment Area #2 designation (Ord. 4631-25), the votes that
    carried them, and the City's own public response/timeline.
  note: >
    Per chain-of-custody rules (CLAUDE.md → Data discipline), source files keep their as-received
    names — including the City's own typo "technolody" (for "technology") in the project-overview
    upload, which is NOT corrected here or on disk. Names are the City's Weebly upload names,
    served from https://www.urbanaohio.com/uploads/1/2/4/6/124631710/. `content_verified` records
    HOW the date below was established from the document's own bytes (OCR of the scanned body, or
    the native text layer) — never from the filename. Where a document carries no date in its own
    body, `date` is null and the filename's apparent date is recorded separately as
    `filename_date_unverified`.
  retrieved: "2026-08-01"
  source_base_url: "https://www.urbanaohio.com/uploads/1/2/4/6/124631710/"

