meta:
  subject: >
    Canonical filename map for west-union/acrwd/finance/ — the Adams County Regional Water
    District's own financial position, FY2024 through FY2026, in three series: audited-basis
    financial statements, annual budget/appropriations, and the monthly "ACRWD Report" cash
    rollups. This is the denominator for any claim about what the Buck Canyon service costs
    or earns the District: a system with roughly $5–6M of annual receipts is being asked to
    build for a customer whose own capital program is measured in billions.
  note: >-
    Per chain-of-custody rules (CLAUDE.md → Data discipline), source files keep their
    as-received names, including the District's three mutually inconsistent budget
    conventions in the same folder — "Budget for 2024.pdf", "Budget 2025.pdf", "2026
    Budget.pdf" — and the "- Capital" suffix that marks the capital schedule as a separate
    document from the operating budget of the same year. `date` is the FISCAL PERIOD the
    document governs, established from its own heading, not from the filename and not from
    the PDF /CreationDate (which for most of these is a 2026-08-06 re-export made for this
    production, months or years after the period).
  retrieved: "2026-08-15"
  source: >-
    Adams County Regional Water District, 9203 SR 136 / P.O. Box 427, West Union, OH 45693.
  gap: >-
    ⚠️ These are the DISTRICT'S OWN statements, not the Auditor of State's. The 2024 and 2025
    financial statements carry the internal title "(In Process)" and were exported from the
    District's accounting package, and the 2026-07-09 minutes record that "the audit was
    currently underway". The AOS audit reports for these years are NOT in this corpus and are
    the authoritative version. Treat every figure here as the District's unaudited
    presentation. No capital budget for 2026 was produced (only the operating budget).

