meta:
  subject: >
    Canonical filename map for west-union/acrwd/minutes/ — the Adams County Regional Water
    District Board of Trustees meeting record, January 2024 through July 2026. This is the
    utility-side record of the Buck Canyon campus: the District carried the project first as
    an unnamed NDA counterparty (2024-01), then under the codename **"Project Galaxy"**
    (2024-10 → 2025-10), then under the name of the pipe that serves it — the **Ginger Ridge
    Water Line** (2025-10 → present). No minute in this set names Amazon, AWS, Buck Canyon
    Properties LLC, or 68 Yards LLC. The customer is "the company", "the client", or "the
    Project Galaxy company" throughout.
  note: >-
    Per chain-of-custody rules (CLAUDE.md → Data discipline), source files keep their
    as-received names — including the District's inconsistent conventions: two-space gaps
    (`Minutes  - April 26.pdf`), a missing space (`Minutes -January 2024.pdf`), a missing
    hyphen (`Minutes-July 26.pdf`), two-digit years for 2026 and four-digit for 2024/2025.
    `date` below is the **meeting date stated in the document body**, never the filename:
    the filenames name the month the meeting covered, and for July 2026 the filename's "26"
    and the body's "July 9, 2026" agree, but the convention is not self-evidently reliable
    and was checked per file. `content_verified` records HOW that date was established.
  retrieved: "2026-08-15"
  source: >-
    Adams County Regional Water District, 9203 SR 136 / P.O. Box 427, West Union, OH 45693.
    Received as a directory of PDFs; the District's own office copies (native Word exports
    signed by the Secretary/Clerk, except the July 2026 set which is a ScanSnap scan of the
    executed original because it carries the signed resolutions).
  gap: >-
    NOT a complete series. The District meets monthly (2nd Thursday, per the Code of By-Laws
    Article I); this set holds 15 of the ~31 meetings between 2024-01 and 2026-07. Absent:
    all of Feb/Mar/May/Jun/Jul/Aug/Sep/Nov/Dec 2024, Jan/Feb/Mar/Jun/Aug/Sep 2025. The two
    2024 minutes present are the two that carry the project's origin (the NDA authorization
    and the first "Project Galaxy" naming) — which is consistent with a responsive
    production rather than a full series pull, but the request scope is not in the corpus.

