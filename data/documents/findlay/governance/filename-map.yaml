# Capture / alias manifest — Findlay + Hancock County governance watch, issue 1463.
#
# Web-captured primary evidence for the data-center siting regime around the
# Findlay watershed point: the Allen Township zoning instruments (the resolution
# that took effect six days after the May-2026 referendum was certified, its
# map, and the two July-2026 amendments that would write "data center" into it
# for the first time), a live Agricultural-to-Light-Industrial rezoning
# application on the same state route, the zoning commission's own minutes, the
# Hancock County Board of Elections certified canvass of the referendum, and the
# county's SB 52 restricted-area notice.
#
# Raw bytes are never edited and files keep the name the server served them
# under — including `Res.ESS_.pdf`, whose trailing underscore is a WordPress
# upload artifact, and `Minutes-7-22-26-special-ATZC.pdf`, whose date is written
# two-digit-year while its siblings are four. Neither is corrected.
#
# The `content_verified` date is read from each file's OWN layer (a signature
# block, a caption, a report timestamp) — never from the URL, the fetch time, or
# outside knowledge. Four of these are image-only scans with no text layer; for
# those the date comes from a 200 dpi render read visually, recorded as
# evidence: rendered_scan.
#
# evidence: native_text   = PDF text layer (pypdf) confirms the identity + date
#           rendered_scan = no text layer; page rendered and read as an image
#           html_capture  = as-served response bytes of a web page
