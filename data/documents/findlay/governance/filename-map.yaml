    note: >-
      The instrument the whole township fight was about, and it answers the
      issue's "which adopted district covers them" question from its own text.
      ARTICLE XXIV prints the entire procedural chain: "Date of Public Hearing
      by Zoning Commission: July 5, 2024 / Date of Public Hearing by Township
      Trustees: September 9. 2024 / Date of Adoption by Township: September 9,
      2024 / Date Certified by Hancock County Board of Elections: May 11, 2026"
      — a twenty-month gap between adoption and effect, because the trustees'
      resolution had to survive a referendum twice. Section 300 establishes nine
      districts (A-1, R-1, RM-1, B-1, B-2, B-3, ES Expressway Service, I-1 Light
      Industrial, I-2 General Industrial) — note ES is EXPRESSWAY SERVICE, not
      an energy district, and the resolution is enumerated-use ("no building or
      land shall be used ... except for one or more of the following specified
      uses"). The phrase "data center" appears ZERO times in all 77 pages;
      Section 1518's prohibited-in-all-districts list is adult entertainment,
      commercial marijuana and private landfills only. Non-accessory solar
      (Sec. 1519) and non-accessory energy storage (Sec. 1520) are conditional
      uses in I-2 ONLY. The Sec. 1201 numbering appears twice in Article XII
      (PERMITTED USES and AREA AND BULK REQUIREMENTS) — the clerical error the
      zoning commission's own 2026-06-02 minutes flag for renumbering,
      corroborated here in the bytes.
