      Middleton Township Trustees, special meeting minutes, 2026-07-07 — R.C. 519.12 hearing on
      Application 2026041 (Liames, LLC), thirteen parcels rezoned to M-1 Light Industrial
    issuer: Board of Trustees, Middleton Township, Wood County, Ohio
    source_url: https://www.middletontownship.com/wp-content/uploads/2026/07/07072026_specialrezoning.pdf
