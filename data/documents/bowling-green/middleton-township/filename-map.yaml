    note: >-
      THE INSTRUMENT THIS COLLECTION EXISTS FOR, and it does not say what the press said it
      says. It names all thirteen parcel numbers (secondary reporting named eight). It names the
      application (2026041), the applicant's engineer (Barge Design Solutions), the applicant's
      counsel (Chris Ingram, Vorys) and the township's (Julie Dannon/Donnan, Brosius, Johnson &
      Griggs — spelled both ways on the same page). And the roll call is on a motion "to approve
      the recommendation of the Middleton Township Zoning Commission," which had voted to DENY:
      Moulton NO, Petrea YES, Vetter NO. Reported as "2-1 in favour," it is on its face 1-2
      against a denial. The outcome is the same and the minutes state it — "It is noted the
      application was approved for rezoning" — but the vote as recorded is the inverse of the
      vote as reported, and Petrea, reported as the dissenter, is the one who voted YES.

  - filename: Meta-Middleton-Township-Letter-010726.pdf
    canonical: meta-platforms-letter-to-middleton-township-trustees-2026-01-07.pdf
    title: >-
      Letter, Meta Global Infrastructure Team to the Middleton Township Trustees — water use,
      energy, air quality, construction activities, jobs and community development at the
      Bowling Green Data Center
    issuer: Meta Platforms, Inc. ("The Meta Global Infrastructure Team")
    source_url: https://www.middletontownship.com/wp-content/uploads/2026/01/Meta-Middleton-Township-Letter-010726.pdf
    served_by: Middleton Township (the township publishes it; it is a company document in a public record)
    sha256: 9955dd80d63488d3c66a70de629a7b6a01c19405ecddb2e181b000b327e6d856
    bytes: 173132
    content_type: application/pdf
    pages: 3
    fetched_at: '2026-08-05'
    content_verified: '2026-01-07'   # see meta.date_on_the_face_warning — the letter prints 2025
    evidence: native_text
    status: downloaded
    note: >-
      A COMPANY DOCUMENT, NOT A GOVERNMENT ONE. Everything in it is Meta's own account of Meta
      and stays [reference] however specific it is; what the township record establishes is that
      it was sent and read. It is nonetheless the primary source for the closed-loop dry-cooler
      claim this repo has carried from press since #1435 — "the data center will use a
      closed-loop, liquid-cooled system with dry coolers. This cooling system requires no
      operational water" — and it adds an operational-water framing found nowhere else
      ("less than what approximately two full-service restaurants use annually"), a flat "No
      ground water will be used," the 2-million-gallon elevated tank and the Middleton Pike
      water/sewer upgrades as Meta-funded, "847 megawatts of new renewable energy" supported in
      Ohio, JE Dunn as general contractor with six named Ohio trade partners, and — the line
      that matters against the profile — that Meta "runs its BACKUP GENERATORS as minimally as
      possible" and is "working to fuel all on site generators with renewable diesel." The
      campus therefore has its own gensets, distinct from the Apollo plant; their count and
      rating remain [open], which is why SiteFacility.genset_count/genset_mw stay None.
      IT CONTAINS NO PHASE-2 ANNOUNCEMENT. Issue #1438, issue #1441 and this repo's own
      register have all called it "Meta's 2026-01-07 Phase-2 letter"; the letter is a
      community-impact letter and the word does not appear in it. See the extraction.
