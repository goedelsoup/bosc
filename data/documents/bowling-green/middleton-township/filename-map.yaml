# Capture / alias manifest — Middleton Township (Wood County, OH) governance record,
# issue #1438 (the record domain), epic #1433 readiness(bowling-green).
#
# Eleven documents: ten sets of trustees' minutes spanning 2023-03-29 → 2026-07-07, and
# one letter from Meta Platforms read into the trustees' record on 2026-01-07.
#
# Raw bytes are never edited and every file keeps the name the township's own server
# served it under — INCLUDING two names that are demonstrably wrong (see
# meta.misnamed_sources). Renaming them here would destroy the very thing a chain of
# custody exists to preserve: what the public body actually published.
#
# The `content_verified` date is read from each file's OWN text layer — the dateline the
# township printed in its heading — never from the filename, the URL or the fetch time.
#
# evidence: native_text = the PDF text layer (pdftotext -layout) confirms the identity
#           and date quoted below. Every file in this collection is digitally generated
#           and carries a text layer; none required OCR.
meta:
  subject: >-
    The Middleton Township trustees' own record of the Meta / "Project Accordion" data-center
    campus — the executive session that first names the codename (2023-07-19), the township's
    support for the Liames CRA application (2023-09-20), the two 2023 seller-name rezonings that
    put campus-area land in M-1 before Liames' name appears anywhere in this record, the
    campus-adjacent 2024-2025 matters (one granted with no known buyer, three withdrawn on the
    eve of their hearings), the January 2025 site-plan review that puts a two-building
    construction schedule on the record, and the contested 2026-07-07 rezoning of thirteen
    parcels whose roll call the press reported backwards.
  collection: bowling-green/middleton-township/
  captured_by: issue #1438 (the record domain), epic #1433, readiness(bowling-green)
  generated_at: '2026-08-05'
  policy: non-destructive — as-served bytes, as-served filename, no exceptions taken.
  served_from: >-
    https://www.middletontownship.com/meeting_minutes/ (the current-year page) and
    https://www.middletontownship.com/minutes-archive-2/ (the archive), both plain
    server-rendered HTML indexes of /wp-content/uploads/<yyyy>/<mm>/ PDFs. No login, no
    challenge, no rate limit encountered. 115 minutes files are published for 2023-2026;
    the eleven below are the subset this issue reads. The full sweep is recorded in the
    extractions so a later reader knows the negatives were searched, not assumed.

  misnamed_sources: >-
    TWO OF THESE FILENAMES ARE WRONG AT THE SOURCE AND ARE KEPT ANYWAY.
    (1) `05032022-special_buschrezone.pdf` is the meeting of **2023**-05-03, not 2022-05-03.
    Its own heading reads "Wednesday, May 3, 2023"; May 3 was a Wednesday in 2023 and a
    Tuesday in 2022; and the minutes recite Wood County Planning Commission approval on
    2023-03-07 and Middleton Township Zoning Commission approval on 2023-04-12, both of
    which postdate the filename's year. The township also filed it in its 2023/08 upload
    directory. A date read from this filename is off by a year in the direction that would
    put a campus-adjacent rezoning BEFORE the assembly began rather than during it.
    (2) `0909025_specialrezone.pdf` is missing a digit: the meeting is 2025-09-**09**
    ("Tuesday, September 9, 2025"), so a naive parse of the stem yields 0909-02-5 or
    2025-09-09 depending on how it guesses. Neither file is renamed; the canonical name is
    recorded beside it here, which is what the alias manifest is for.

  date_on_the_face_warning: >-
    THE META LETTER PRINTS THE WRONG YEAR ON ITS OWN FACE. `Meta-Middleton-Township-Letter-010726.pdf`
    opens "January 7, 2025". It is a 2026 document: it says "On April 9, 2025, Meta was excited
    to announce we were joining the Wood County community" (past tense, and that announcement is
    dated); it footnotes a Meta sustainability index published 2025-10 and a water-benefit report
    revised 2025-08-21; it says the Community Action Grants program launched in Bowling Green
    "late last year" with awards to be announced "in early Spring"; and the trustees' minutes of
    2026-01-07 record the chairman reading a Meta letter into the record that evening. Its PDF
    Title metadata reads "1/7 Middleton Township Letter" and the township filed it under
    /wp-content/uploads/2026/01/. `content_verified` below is 2026-01-07, derived from the
    content, per the repo's rule that a date comes from the text layer and not from a filename,
    a URL or outside knowledge.

