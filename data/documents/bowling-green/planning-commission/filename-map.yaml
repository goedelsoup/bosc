      TWO CORRECTIONS TO THIS REPO'S REGISTER FALL OUT OF THAT SENTENCE. The 31.82-acre figure
      had been carried as press [reference]; it is the county's own, and it reconciles to the
      hundredth against the sum of the thirteen parcels' deeded acreage in the auditor CAMA.
      And the press split — "eight on the east side of SR-25 and five on the west side of
      Mercer Rd" — is not what the county says: it says all thirteen are north of SR-582,
      which is compatible but is the statement the instrument actually makes.
      The agenda is the APPLICATION as docketed, not the vote; the 6-2 recommendation of
      2026-06-02 is recorded in the township's 2026-07-07 minutes, and the Planning
      Commission's own minutes for that meeting were not published at capture time.

