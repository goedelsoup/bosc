  - filename: A-3211 - Annexation of 53.083 Acres - Shelby County Commissioners.pdf
    portal_document_id: "bcf2c74c-76fe-ef11-a43f-000c29a59557"
    canonical: sidney-ord-a-3211-annexation-53-acres-county-2025-03-10.pdf
    type: council-ordinance
    date: "2025-03-10"
    content_verified: text-layer   # "Passed this 10th day of March 2025."
    pages: 6
    sha256: "2477c972ad7e72fc81c3e90627fb188dba00306e49eddd2f8e0538451626149b"
    bytes: 1157769
    carries:
      - "THE CONTRAST CASE that makes A-3225's silences legible. Where the campus annexation cites no R.C. 709 provision at all, this one names 'Ohio Revised Code Section 709.16' in terms, on its attached Petition."
      - "Its petitioner is THE CITY COUNCIL ITSELF — the opposite posture from the campus annexation, where the City merely accepted a petition brought to it."
      - "An EMERGENCY CLAUSE — the only one of the four land ordinances to carry one. ⚠️ Its stated reason is scheduling: 'imperative to meet the necessity of expeditiously meeting the deadline for the next meeting of the Shelby County Board of Commissioners.' An emergency declaration removes the referendum window; the boilerplate recites health and safety, and the actual reason given is a calendar."
      - "Territory identified as Parcel Number 02-2603-476.001. Attached Petition and survey exhibits."
    notes: >-
      ⚠️ NOT THE CAMPUS. Committed so that a future reader cannot mistake it for one — see A-3227.
      The exhibits are image-only.

  - filename: A-3227 - Zoning 53.16 IIM - County Commissioners Annexation.pdf
    portal_document_id: "44658eee-cf0c-4fac-9e52-011041d33a99"
    canonical: sidney-ord-a-3227-zoning-53-acres-iim-2025-07-28.pdf
    type: council-ordinance
    date: "2025-07-28"
    content_verified: text-layer   # passed the same night as A-3225/A-3226
    pages: 3
    sha256: "1949e96ac1f88fc4c8d4ee73d4c9d7a471bfa8a9a755eced76a0400191ac1a1b"
    bytes: 1117247
    carries:
      - "⚠️ AN ACREAGE CONFLICT INSIDE A SINGLE INSTRUMENT. Its title: 'AN ORDINANCE ZONING A 53.16 ACRE TRACT'. Its own legal description closes: 'Containing 53 .083 acres more or less, subject to all easements of record.' Its §2 then says '5 3 .16-acre tract'. Two figures, one document, 0.077 acres apart."
      - "⚠️ IT IS NOT THE CAMPUS, and the description proves it: 'Situate in the southeast quaiter of Section 3, Town 7 Nmth, Range 6 East, Clinton Township' — where the campus (A-3225) is in the NORTH HALF of the same section. Same section number, different land."
      - "A second, independent expansion of the IIM acronym: 'zoned IIM - Industry / Innovation / Manufacturing Zone.'"
    notes: >-
      The 53.083 figure is the only one that ever appears inside a SURVEYED description; 53.16
      appears in titles, in §2, in the Planning Commission caption and in the Council minutes. The
      conflict is recorded, not resolved — the 0.077-acre difference is not explained by the
      roadway dedications shown on A-3211's exhibits. Journal-scan artifacts ("quaiter", "Nmth",
      "5 3 .16") preserved in quotation.

