    notes: >-
      Read from the native text layer for the recitals and the passage clause; the map sheet is a
      raster and NO visual claim is made here about the campus polygon. The superseding map is
      A-3270 (passed 2026-07-27, effective 2026-08-10), whose window does contain A-3226 — not
      pulled in this pass.

# ── The ZONING CODE layer (#1998 tail, slice 2) ────────────────────────────────────────────────
# Slice 1 answered what the campus IS zoned. These answer what that zoning MEANS, and when the
# City decided it.
  - filename: A-3219 - Adopting Amendments to the Zoning Code.pdf
    portal_document_id: "69fbe3f1-95eb-4fb9-b25e-25a0862d3d86"
    canonical: sidney-ord-a-3219-zoning-code-data-center-use-2025-04-28.pdf
    type: council-ordinance
    date: "2025-04-28"
    content_verified: text-layer   # "Passed this 28TH day of April 2025."
    pages: 11
    sha256: "d2d7f3c061aa6a798125eb863baf54d805ee28a4bcccce7860ace0cbd3a89d01"
    bytes: 6833689
    carries:
      - "THE ORDINANCE THAT PUT DATA CENTERS IN SIDNEY'S ZONING CODE. Exhibit A, GLOSSARY - USES, letter w: 'Warehouse - Data Center. A facility used for the remote storage, processing, or distribution of large amounts of data that is greater than 50,000 square feet.'"
      - "⚠️ A 50,000 SQ FT FLOOR. A data facility at or below that size is not a 'Warehouse - Data Center' under this code and has no listed use at all."
      - "The Chapter 1103 use table (p.2): the row 'Warehouse - Data Center' carries a single P — PERMITTED BY RIGHT — in the 'Industry/ Innov./Manuf. Zone (IIM)' column, and NOTHING in the other eight district columns (R-1, R-2, R-3, CC, NC, HC, CSD, TND)."
      - "Both the row label and the P are in RED UNDERLINE, and the exhibit's own legend reads 'Red Underline = NEW / Red Strike Through = REMOVE' — so the ordinance is the ADDING instrument, on its own face."
      - "Sheet foot: 'SIDNEY, OHIO ZONING CODE 22 UPDATED THROUGH NOVEMBER 25, 2024'."
    notes: >-
      ⚠️ THE USE-TABLE CELL IS NOT READABLE FROM THE TEXT LAYER — pypdf renders it as `!:`. It was
      read from a 300-DPI page render, and the column identified against the rendered header band
      and against the P's of Warehouse - Large Format, Storage - Contractor and Storage - Commercial
      Gases in the same column. The definition text, by contrast, extracts cleanly. ⚠️ The text
      layer inserts a stray apostrophe ("A 'facility used"); the render has none, so the apostrophe
      is an extraction artifact and is excluded from the quotation above.

  - filename: A-3236 - Adopting Zoning Code Amendments.pdf
    portal_document_id: "6bb1dc7e-3eb5-41ea-bd14-9f15c7b17608"
    canonical: sidney-ord-a-3236-zoning-code-guard-shacks-2025-09-22.pdf
    type: council-ordinance
    date: "2025-09-22"
    content_verified: text-layer   # "Passed this 22nd day of September 2025"
    pages: 10
    sha256: "77cf48a33b35d8a966a0ce9c09beb9d7d6b067991f2143fb89abdd3bb5a79686"
    bytes: 6696662
    carries:
      - "§1111.05(u) GUARD SHACKS, permitted 'in the IIM Zone only' — max 199 sq ft, max 18 ft tall, min 15 ft from every property line and 10 ft from the principal building, allowed in any yard."
      - "⚠️ A DEFECT IN THE ENACTED TEXT. The matching §1117.02 definition stops mid-sentence: 'A guard shack shall not be ' — and the next line begins 'Historic structure:'. CONFIRMED FROM A 300-DPI RENDER, not just the text layer: the red-underlined NEW text simply ends there. The City adopted an unfinished sentence."
      - "A clean [verified] NEGATIVE: zero mentions of data centers anywhere in the ordinance."
    notes: >-
      This is the ordinance whose public hearing was held 2025-09-08 — the same meeting that passed
      Res. 69-25's thirty-year megaproject tier — and which returned for deliberation 2025-09-22.
      ⚠️ THE TIMING IS A DOCUMENTED COINCIDENCE AND NOTHING MORE: neither instrument names the
      other, and neither names any data center. Do not write a causal claim from a shared calendar.

