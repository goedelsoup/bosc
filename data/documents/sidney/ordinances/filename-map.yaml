    bytes: 11624778
    carries:
      - "THE CURRENT OFFICIAL ZONING MAP, and the first whose declared window CONTAINS the campus zoning: it 'incorporates all the rezoning, annexation, or detachment ordinances from March 10, 2025, to June 8, 2026' — where its predecessor A-3210 stopped at 2025-01-13."
