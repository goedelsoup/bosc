meta:
  subject: >
    Canonical filename map for sidney/cra-housing-council/ — the City-Wide Community Reinvestment
    Area Housing Council, created by Res. 84-22 §7, which recommended the Amazon CRA Agreement on
    2025-10-23 (#1998 tail, slice 3).
  note: >-
    Files keep their as-received portal `fileName`. `content_verified` is read from each document's
    own printed meeting header — every one of these carries its date in the header block.
  retrieved: "2026-08-13"
  source_base_url: "https://sidneycityoh.documents-on-demand.com/document/"
  route: >-
    Documents-On-Demand over HTTP/1.1. Parent container 00ac9418-d831-f111-a491-000c29a59557;
    Minutes 8ea56988-d831-f111-a491-000c29a59557; Agenda 1c6ff647-d831-f111-a491-000c29a59557.
  ⚠️_container_scope: >-
    BOTH containers hold ONLY a 2026 year folder, verified by enumerating each with
    /meta/docfolder?containerId=. There is no 2025 folder. So the 2025-10-23 minutes are not on this
    portal — which is a fact about PUBLICATION, and NOT a fact about whether the record exists. Two
    instruments below prove it does.

