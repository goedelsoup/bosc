    carries:
      - "⚠️ ITEM 2: 'Approval of minutes: October 23, 2025' — the first of two independent instruments establishing that a written record of the Amazon-recommendation meeting was made and put to a vote."
      - "The body's own name for itself: 'City-Wide Community Reinvestment Area Housing Council' — which disambiguates it from the 'Greater Downtown CRA Housing Council' of Res. 79-21 / 66-20."
      - "Its office, printed in the header: 'Council Chambers, City Hall, 201 W Poplar St'."

  - filename: CRA Housing Council Minutes February 05, 2026.pdf
    portal_document_id: "4735dd95-e03f-f111-a494-000c29a59557"
    canonical: sidney-cra-housing-council-minutes-2026-02-05.pdf
    type: cra-housing-council-minutes
    date: "2026-02-05"
    content_verified: text-layer
    pages: 2
    sha256: "5df6cbb0b97473400194ea974ca062ba3baa3df499b7d5f7c4dea5fa2fda388a"
    bytes: 304239
    carries:
      - "⚠️ THE ADOPTION, verbatim: 'A motion was made by R. Reiss to approve the October 23, 2025 meeting minutes; G. Snyder seconded the motion. The motion passed unanimously upon vote.' The minutes of the meeting that recommended the Amazon abatement were drafted, agendized and ADOPTED."
      - "THE FIRST NAMING OF THE MEMBERS anywhere in this corpus — 'Members present: Rick Reiss, Jackie Dunson, Michael Jannides, Matthew Verhotz, and Greg Snyder.' Five of the seven seats Res. 84-22 §7 creates."
      - "Staff attending: Barbara Dulworth (Community Development Director), Petra Sloan (Community Economic Development Manager), Lisa Philipps and Kent Blackford (Permit Technicians), Jon Crusey (City Manager)."
      - "⚠️ OFFICERS WERE ELECTED AT THIS MEETING — Jannides Chair, Snyder Vice-Chair, both on 2026-02-05, i.e. AFTER the October 2025 recommendation. So WHO CHAIRED the 2025-10-23 meeting is named by no document read here."
      - "The meeting ran 3:00 pm to 3:10 pm."

  - filename: CRA Housing Council Minutes March 05, 2026.pdf
    portal_document_id: "3976d49f-e03f-f111-a494-000c29a59557"
    canonical: sidney-cra-housing-council-minutes-2026-03-05.pdf
    type: cra-housing-council-minutes
