    content_verified: text-layer
    pages: 3
    sha256: "e82f981d8d27d6a2ffa33c38c2a5760fc6691dd826e052179e2678e8630f619c"
    bytes: 307129
    carries:
      - "⚠️ THE TIRC. 'B Dulworth clarified that the Housing Council will only review granted 1-family and 2-family housing abatements and recommend whether or not the abatements should continue as part of the annual review. Industrial properties that have been granted an abatement will be reviewed by the Tax Incentive Review Council to determine if they will recommend the continuation of abatements on each individual property.'"
      - "So the body that RECOMMENDED the Amazon abatement has NO continuing oversight of it. The annual continuation decision on an abatement the City itself values at $180-350M sits with a body that has no container on this portal at all."
      - "The Housing Council's own scope, from the same exchange: 1- and 2-family homes; 'three or more units' are treated otherwise."

