meta:
  subject: >
    Canonical filename map for sidney/council/ — the City of Sidney legislative record behind the
    AWS "Sidney Data Center Campus" / Project Rey incentive and service instruments (#1380): the
    Community Reinvestment Area Agreement (Res. 80-25), the two school-district agreements that
    split its proceeds (Res. 81-25 / 82-25), the water-and-wastewater service agreement (Res.
    26-26), the public-infrastructure Development Agreement (Res. 27-26), and the staff
    presentation Council heard before adopting the last two.
  note: >-
    Per chain-of-custody rules (CLAUDE.md → Data discipline), source files keep their as-received
    names — including the CivicPlus upload-timestamp suffixes (`_2026011413421917 93`) the City's
    document center appends to some uploads and not others, and the "(PDF)" the City typed into
    one title. Names come from the `Content-Disposition` header the City's document center sends;
    the URL path slug is NOT the filename. `content_verified` records HOW the date below was
    established from the document's own bytes (the native text layer, or OCR of a scan) — never
    from the filename. Where the two disagree, the body wins and the filename's apparent date is
    recorded separately as `filename_date_unverified` (see sidney/permits/).
  retrieved: "2026-08-01"
  source_base_url: "https://www.sidneyoh.com/DocumentCenter/View/"
  source_page: "https://www.sidneyoh.com/526/Proposed-Data-Center-FAQ"
  naming: >-
    Ohio EPA files this campus as "Sidney Data Center Campus" (surface water) and "CMH-232"
    (401/wetlands). The City's OWN executed Development Agreement with the school boards names
    it "Project Rey" — twice. "Project Galaxy" is the trade-press name and, on Ohio EPA's own
    record, belongs to a DIFFERENT Amazon campus in Fayette County. See
    data/extracted/sidney/data-centers.md, "Disambiguation guardrail".

documents:
  - filename: 80-25 - Authorizing a CRA Agreement - Amazon Data Services Inc_202601141342191793.pdf
    document_center_id: "4356"
    canonical: sidney-council-res-80-25-cra-agreement-amazon-data-services-2025-10-27.pdf
    type: council-resolution-with-executed-agreement
    date: "2025-10-27"
    content_verified: text-layer   # body: "RESOLUTION NO. 80-25 … Passed this 27th day of October 2025."
    pages: 30
    sha256: "d915fe3f13ab01ef3980864cf241ff9d75df19f592ac21335f371f5dbe784983"
    bytes: 2608889
    carries:
      - "Resolution 80-25 (pp. 0-1) — authorizing the City Manager to enter into a Community Reinvestment Area Agreement with Amazon Data Services, Inc."
      - "THE INSTRUMENT: the executed CRA Agreement itself (pp. 2-14), 28 numbered pages, effective 2025-10-27, Docusign envelope BA694CA4-6647-470C-88C2-2A02D605BB64, signed for the Company by Hillary Lambert, Authorized Signatory, 2025-11-06"
      - "§4 — the 30-year / 100% real property tax exemption, with the tax-year 2035 commencement cutoff and the tax-year 2065 outer bound"
      - "§7 + Exhibit E (p. 29) — the PILOT schedule: 14 years, capped in the text at $46,000,000"
      - "§8 — a SEPARATE one-time $4,000,000 Initial Payment (the other half of the '$50 million' figure in the press)"
      - "§32 — the public-records clause: notice to the Company and at least 5 business days before the City may disclose 'Confidential Information'"
      - "§34 — the exemptions are CONDITIONED on prior execution of the Development Agreement (which is Res. 27-26, six months later)"
      - "Exhibit A (pp. 15-16) — Project Site described as '+/- 240 acres'"
      - "Recitals — the CRA designating legislation is Resolution No. 69-25, adopted 2025-09-08; SCSD approval by resolution 2025-10-08; Ohio Tax Credit Authority Sixth Amendment to Tax Credit Agreement, 2025-10-08, R.C. 122.17 megaproject / megaproject operator"
    notes: >-
      Native text layer throughout; the scanned RECORD OF ORDINANCES cover sheets (pp. 0-1) carry
      an OCR layer of poor quality, so the resolution number and passage date were confirmed
      against the agreement's own §14 recital ("approved by Resolution No. 80-25 of the City
      Council on October 27, 2025"), not against the cover-sheet OCR alone.

