      A City staff deck, not an instrument — but it is the City's own arithmetic, presented to
      Council in open session on the night the agreement was authorized, and it is the source of
      the remaining-headroom figures the agreement itself does not state. Every figure in it that
      also appears in the executed agreement agrees with the agreement.
