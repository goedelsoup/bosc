  - filename: Presentation Sewer and Water Agreement 4.27.26 (PDF).pdf
    document_center_id: "4480"
    canonical: sidney-council-presentation-aws-water-sewer-agreement-2026-04-27.pdf
    type: city-staff-presentation
    date: "2026-04-27"
    content_verified: text-layer   # slide footers: "City of Sidney - April 27, 2026"
    pages: 14
    sha256: "02974e0934b369b1243cfd38cb2a13e29643a0a255a4ced68d0a4de5b8ad2ee1"
    bytes: 105057
    carries:
      - "The City's own capacity arithmetic: water 2025 avg daily demand 3.1 MGD against a 7.0 MGD plant, ~3.9 MGD remaining → ~2.9 MGD after the AWS reservation"
      - "Wastewater 2025 avg daily flow 4.6 MGD against a 7.0 MGD plant, ~2.4 MGD remaining → ~2.0 MGD after the AWS reservation"
      - "'All wastewater, including COOLING TOWER discharges, are required to be discharged to the sanitary sewer' — the only disclosure of the cooling mechanism on the public record"
