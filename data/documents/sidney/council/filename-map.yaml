  - filename: 26-26 - Authorize Water and Sewer Service Agreement - Amazon Web Services.pdf
    document_center_id: "4473"
    canonical: sidney-council-res-26-26-water-wastewater-service-agreement-aws-2026-04-27.pdf
    type: council-resolution-with-executed-agreement
    date: "2026-04-27"
    content_verified: text-layer   # body: "RESOLUTION NO. 26-26 … Passed this 27th day of April 2026"
    pages: 12
    sha256: "6da592e4ac075657d64cb788c1d8a9d02f71ce3df9609de02e39c22bb57bb38a"
    bytes: 1086818
    carries:
      - "Resolution 26-26 (pp. 0-1)"
      - "THE INSTRUMENT: Water and Wastewater Service Agreement, 'Execution Version' (pp. 2-9), between Amazon Web Services, Inc. and the City of Sidney"
      - "§1.1 — the four reserved capacities: cooling water 1.0 MGD at ≤694 gpm (4,600,000 gal/yr projected); fire flow ≥1,818 gpm at ≥20 psi; POTABLE water ≤14,000 gpd; SEWER discharge ≤390,493 gpd at ≤716 gpm gravity (1,160,000 gal/yr projected)"
      - "§2.1 — the City covenants NOT to create a separate class of water or sewer rates for data centers during the Term"
      - "§3 — 10-year initial Term, auto-renewing annually; AWS may terminate on 90 days' notice at any time, the City only after 3 years AND 12 consecutive months of ceased operations"
      - "§1.5 — if the City cannot supply, AWS may secure substitute services and the City must provide access to its infrastructure"
      - "Schedule 1 (pp. 10-11) — the reserve-capacity impact fees: water 14.3% of the 7 MGD system at $7.23/ccf → $1.033/ccf on unused reservation; sewer 5.60% at $4.11/ccf → $0.230/ccf"
    notes: >-
      The only one of the five instruments whose counterparty is Amazon WEB Services, Inc. rather
      than Amazon DATA Services, Inc., and the resolution and the agreement agree on that. Contrast
      Res. 27-26, where they do not. Clean native text layer (pp. 2-11).

