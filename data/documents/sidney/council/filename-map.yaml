# ===============================================================================================
# SECOND ROUTE — the City's Documents-On-Demand portal (#1998, added 2026-08-13)
# ===============================================================================================
# ⚠️ THE ROUTE THIS CORPUS RECORDED AS BLOCKED WAS NEVER BLOCKED. `sidneycityoh.documents-on-
# demand.com` was carried across five Sidney artifacts — and both drafted R.C. 149.43 requests —
# as "Cloudflare-challenged, an unsearched route". It is Cloudflare-challenged, but the trigger is
# the HTTP/2 FINGERPRINT, not the client: the identical request returns 403 over h2 and 200 over
# HTTP/1.1. One retry defeats it, and the six files below came through it in minutes.
#
#   curl --http1.1 -A '<a browser UA>' https://sidneycityoh.documents-on-demand.com/…
#
# GENERALIZE THE LESSON: a 403 to a scripted client may be an h2 fingerprint block. Retry over
# HTTP/1.1 before recording a route negative. This corpus recorded that negative three separate
# times before anyone tested it.
#
# The host exposes an unauthenticated JSON API (Ameriscan "Documents On Demand", a fancytree UI):
#   /meta/rootfolder                        → the body tree, two levels (14 City bodies)
#   /meta/docfolder?containerId=<guid>      → THE WHOLE SUBTREE of one container, documents and all
#   /document/<guid>/<fileName>.pdf         → the bytes
# ⚠️ `/meta/childfolders?parentId=…` — which the page's own JS calls on lazy expand — returns the
# app shell, not JSON, to a scripted client. Use `docfolder`, which returns everything anyway.
#
# What it holds, far beyond this collection: City Council Legislation → Ordinances / RESOLUTIONS
# (51 year folders, 2026 back to 1976) and MINUTES (170 year folders, 2026 back to 1857), plus
# Agendas, Agenda Packets, and the same for the Planning Commission, the Zoning Board of Appeals,
# the CRA Housing Council, the Records Commission and nine other bodies.
#
# NAMING: these files keep the portal's own `fileName` value verbatim — which, unlike the
# DocumentCenter route above, carries NO upload-timestamp suffix. Two City routes, two naming
# conventions, both as-received.
