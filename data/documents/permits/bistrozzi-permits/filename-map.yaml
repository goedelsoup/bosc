meta:
  subject: >-
    Canonical filename map for permits/bistrozzi-permits/ — the DSWPTI-260597 (BOSC-1A Rev. 1)
    acquisition of 2026-08-23, and the §401 water-quality-certification backfill of 2026-09-05
  scope: >-
    PARTIAL BY DESIGN, AND NOW COVERING TWO ACQUISITIONS. The first is the four eDocuments of the
    2026-08-14 DSWPTI-260597 permit action, fetched 2026-08-23 under issue #2088. The second is
    the 2026-09-05 §401 backfill: the ALLEN-county DSW401* rows of the *BOSC* portal sweep, which
    that sweep listed and nobody had ever fetched. The other 35 files on this shelf predate both
    and carry their provenance in the shelf README and in their own extractions; their absence
    from this map is not a gap in their custody. Do not read a missing row here as "not acquired."
  policy: >-
    Non-destructive. The eDocument portal serves these by query string with no Content-Disposition,
    so the docid IS the as-served identity (see src/watermark/oepa/fetch.py); files keep the shelf's
    established `<docid>.pdf` naming. Every date below is content-verified from the document itself —
    the text layer where one exists, and a rendered page read where none does. Portal `doc_date`
    rows and filenames were NOT used as date evidence.
  source_sweep: data/research/oepa-portal-bistrozzi-2026-08-22/manifest.yaml
  fetched_at: '2026-08-23'
  issue: 2088

