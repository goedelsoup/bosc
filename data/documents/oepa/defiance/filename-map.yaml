meta:
  subject: >-
    Ohio EPA eDocument portal download manifest — City of Defiance Water Pollution Control
    (Defiance WPC / "DEFIANCE WWTP"), Ohio EPA NPDES permit 2PD00013 / application OH0024899
    (issue 392)
  generated_at: '2026-08-05'
  source_route: >-
    https://edocpub.epa.ohio.gov/publicportal/edochome.aspx — the Ohio EPA eDocument public
    portal, searched by Entity Name "DEFIANCE WWTP" (1,097 documents; 950 carry Secondary ID
    2PD00013). Each file below is fetched from
    https://edocpub.epa.ohio.gov/publicportal/ViewDocument.aspx?docid=<docid>.
  policy: >-
    non-destructive. The portal sends NO Content-Disposition header, so the server supplies no
    filename at all and the docid IS the as-served identity. The local names below are therefore
    assigned by us, and the docid each one came from is recorded beside it — that pairing, not
    the filename, is the chain of custody. Content-verified dates are read from each document's
    own embedded text layer (these are digitally generated Ohio EPA PDFs, not scans), never from
    a filename and never from outside knowledge. No source byte is altered.

