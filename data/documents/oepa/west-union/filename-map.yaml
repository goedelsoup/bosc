meta:
  subject: >
    Canonical filename map for oepa/west-union/ — the complete Ohio EPA eDocument record for the
    Buck Canyon project, Sprigg Township, Adams County, as of 2026-08-17. Thirty-two documents in
    two instrument families: the **Level Two Isolated Wetland Permit** `DSW401252171W` / Ohio EPA
    ID `252171W` (28 docs, application 2025-12-15 → grant 2026-06-08) and the **NPDES construction
    stormwater** general-permit coverage `0GC04922*AG` under `OHC000006` (4 docs, 2026-06-08).
  note: >-
    ⚠️ THE PORTAL SENDS NO `Content-Disposition` — verified None on all 32 responses — so the
    server supplies no filename and the **docid IS the as-served identity**. Files are therefore
    named `edoc-<docid>.pdf` per the network's standing rule for this source, and the canonical
    name each document would carry is recorded below. This is the documented naming convention,
    not a rename.
  retrieved: "2026-08-17"
  source: >-
    Ohio EPA eDocument public portal, https://edocpub.epa.ohio.gov/publicportal/edochome.aspx —
    Entity Name search "BUCK CANYON", ASP.NET WebForms postback with a scraped
    __VIEWSTATE/__EVENTVALIDATION and a cookie jar. Documents fetched at
    ViewDocument.aspx?docid=<n>.
  route_note: >-
    ⚠️ THIS CORRECTS A COMMITTED NEGATIVE. data/extracted/west-union/data-centers.md recorded the
    eDoc route for this site as METHOD-BLOCKED ("positive control, negative control and both
    target queries returned byte-identical default grids"). It is not blocked. Re-run 2026-08-17
    with controls: nonsense entity + ADAMS + AIR PERMIT → 0 rows; "QTS" → 35 rows including the
    known Van Wert NPDES docs; "BUCK CANYON" → 32. The earlier attempt evidently mis-targeted the
    form; the working field id for Entity Name is
    `ctl00$search$KeywordPanel1$txtValue_-1_1_106_1`, and County / Program are PLAIN SELECTS
    (`ddlValue_-1_1_104_1` / `ddlValue_-1_1_109_1`), not postback-only pickers.
  air_permit_negative: >-
    ⚠️ [verified negative] as of 2026-08-17: NO Ohio EPA AIR PERMIT document exists for this
    project. Controls — entity BUCK CANYON / AMAZON / 68 YARDS / HARMON, each × county ADAMS ×
    program AIR PERMIT → 0; the unfiltered ADAMS × AIR PERMIT list returns 220 documents,
    date-descending, whose newest is 2026-06-05 (a routine W C Milling report) and which contains
    no data-center-shaped entity. The positive control on the same filters (BUCK CANYON × ADAMS,
    any program → 32) proves the query works. Record this as a DATED negative, never as a
    permanent absence: OAC 3745-31-33 lets site preparation proceed before a PTI issues, so
    construction activity is not evidence of one either way.
  pii: >-
    ⚠️ The NPDES applicant of record is an INDIVIDUAL, and his address and personal telephone are
    printed on the permit, the NOI and the site map: Derek Harmon, 2505 Old KY-11, Flemingsburg KY
    41041, (606) 845-0638. That is the applicant block of a public environmental permit — public
    record by its nature, and the same class as any permittee's contact block — but it is a named
    private individual's address rather than a corporate office, and it should be treated as such
    if any of these files is ever cleared for publication. NOT CLEARED HERE.
  duplicates: >-
    Two byte-identical pairs are served under DIFFERENT docids and BOTH are kept: 3940076 ==
    3940078 (sha 6b81f1b3…) and 3940081 == 3940082 (sha ba2c9adc…). The corpus's
    byte-identical-duplicate removal rule is not applied, because here the docid is the identity
    the agency published and collapsing the pair would destroy that mapping.

