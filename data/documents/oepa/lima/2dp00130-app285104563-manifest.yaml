# The 23 docids run 4116201-07, 4116218-29 and 4116232-35, with gaps at 4116208-17 and
# 4116230-31. Those gaps are the portal's, not this map's: nothing under 2DP00130 occupies them.
# One of them is reachable at the URL pattern and answers with nothing at all, which is worth
# recording because the fetcher's guard does not catch it.
not_in_package:
  - edoc_id: '4116210'
    status: portal_empty_response
    source_url: https://edocpub.epa.ohio.gov/publicportal/ViewDocument.aspx?docid=4116210
    observed: '2026-08-23'
    notes: >-
      ⚠️ HTTP 200, Content-Type text/html, ZERO bytes — reproduced twice on 2026-08-23 and
      previously on three attempts when the issue was filed. This is the portal's "no document"
      answer; it is not a 404 and not an error. NOTHING WAS WRITTEN for it here, because it was
      never in the fetch list — but `watermark oepa fetch` WOULD have written it: _pdf_is_complete
      (src/watermark/oepa/fetch.py) early-returns True for any body that does not start with
      %PDF-, and an empty body takes that branch, so the response would be recorded `downloaded`
      as a 0-byte .pdf inside data/documents/**. That is issue #2091 and is not fixed here.
      Every one of the 12 committed bodies above was confirmed to start %PDF- and end %%EOF
      before it was written.
