meta:
  subject: >-
    Canonical filename map for the 2DP00130 / APP285104563 indirect-discharge application
    package — the 2026-08-23 acquisition under issue #2089 only
  scope: >-
    PARTIAL BY DESIGN, IN BOTH DIRECTIONS. This map covers ONLY the 23 eDocuments the
    2026-08-22 portal sweep listed under permit 2DP00130. The other ~93 files on this shelf are
    the 2PE00000 (City of Lima WWTP) tranche of #2074 and carry their provenance in this
    directory's filename-map.yaml; their absence from this map is not a gap in their custody.
    Conversely, of the 23 docids below only 12 are COMMITTED — the rest are exact or
    text-identical duplicates, recorded here by sha256 rather than held. Do not read a missing
    row here as "not acquired", and do not read this map as the shelf's whole custody record.
  policy: >-
    Non-destructive. The eDocument portal serves these by query string with no
    Content-Disposition, so the docid IS the as-served identity (see src/watermark/oepa/fetch.py);
    files keep the fetcher's `edoc-<docid>.pdf` naming, matching the rest of this shelf. Every
    date below is content-verified from the document's own text layer. Portal `doc_date` rows and
    portal `description` strings were NOT used as evidence — the sweep manifest describes all 23
    rows identically as "APPLICATION AND SUPPORT - APP285104563", which is true of the package
    and tells you nothing about any individual document.
  source_sweep: data/research/oepa-portal-2dp00130-2026-08-22/manifest.yaml
  fetched_at: '2026-08-23'
  issue: 2089

  coverage: >-
    23 docids listed · 16 distinct byte-streams · 12 committed · 11 deferred (7 exact
    byte-duplicates, 4 text-identical re-submissions). 4,436,727 bytes committed.
  duplication_note: >-
    ⚠️ THE PACKAGE IS THE SAME BUNDLE FILED THREE TIMES. Docids 4116201-07, 4116218-24 and
    4116232-35 are three parallel submissions of one application: seven documents, then the same
    seven, then four of them again. Seven of those rows are byte-identical to a row already held
    (sha256 match). The other four — the application form at 4116218 / 4116232 and the sampling
    report at 4116221 / 4116235 — differ in their PDF bytes but extract CHARACTER-FOR-CHARACTER
    IDENTICAL text (sha256 of the extracted text recorded on each deferred row), so the
    difference is in the PDF container, not the record. A count of the portal's rows therefore
    overstates the package by 7 and its distinct content by 11; the sweep manifest's
    `counts.documents: 23` is a row count and was never a document count.

