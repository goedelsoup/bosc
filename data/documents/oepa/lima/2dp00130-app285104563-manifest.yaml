      the Google CLB-1 (Columbus) laboratory reports at 4116202 and 4116205. The 12-page variant
      at 4116226 has no such page, which is why both variants are committed rather than one.
      NO EXTRACTION GENRE FITS THIS DOCUMENT and none was forced. See the reviewed artifact at
