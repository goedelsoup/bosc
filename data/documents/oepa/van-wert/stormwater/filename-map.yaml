  subject: >-
    Ohio EPA NPDES construction site stormwater general permit OHC000006, coverage
    2GC08872*AG — QTS Data Center, 8002 Mendon Road, Van Wert, OH (issue #1402, epic #1267)
  collection: oepa/van-wert/stormwater/
  captured_by: issue #1402 (epic #1267, readiness(van-wert) — the facility grounding instrument)
  generated_at: '2026-08-03'
  policy: >-
    non-destructive — as-served bytes. Ohio EPA's eDocument portal serves no filename,
    so `edoc-<docid>.pdf` preserves the server's own document identity.

  scope_warning: >-
    THIS SUBDIRECTORY IS A DIFFERENT FACILITY FROM ITS PARENT. `oepa/van-wert/` holds
    the CITY of Van Wert's wastewater instrument (NPDES 2PD00006, Van Wert WWTP — see
    the filename-map one level up). `oepa/van-wert/stormwater/` holds the PRIVATE QTS
    campus's construction-stormwater coverage (2GC08872*AG), which shares nothing with
    the city plant but the county, the agency, and the receiving stream. The shared
    receiving stream is the one real connection and it is a finding, not a filing
    relationship: BOTH discharge to Town Creek, which is also the city's drinking-water
    source (see data/extracted/van-wert/water-watch.yaml). Do not let the shared parent
    directory imply a shared facility, operator, or permit family.

  scope_note: >-
    A CONSTRUCTION-PHASE instrument, not an operating one. It authorizes stormwater
    discharge from land disturbance and expires 2028-04-22; it says nothing about the
    campus's operating water use, cooling, discharge, or electrical load. It does NOT
    ground the facility's IT load and does not lift the facility readiness domain to
    `live` (`watermark.sites.SiteFacility.is_instrument_grounded`, #1630) — see
    data/extracted/oepa/van-wert/2GC08872.npdes.yaml.

