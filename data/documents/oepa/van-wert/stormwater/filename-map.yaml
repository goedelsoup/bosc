# Capture / alias manifest — the QTS Van Wert campus construction-stormwater instrument,
# Ohio EPA Division of Surface Water, issue #1402 (epic #1267).
#
# Three documents covering the whole NOI-to-approval chain for the general NPDES
# construction site stormwater permit OHC000006, coverage 2GC08872*AG: the applicant's
# Notice of Intent, the site map it attaches, and Ohio EPA's approval letter.
#
# Raw bytes are never edited. All three come from Ohio EPA's eDocument public portal,
# which serves documents by numeric document ID with no filename in the response (no
# Content-Disposition header), so the docid IS the as-served identity and the file is
# named for it; the canonical name is recorded beside it.
#
# The `content_verified` date is read from each file's OWN text layer, never from the
# URL, the portal's result row, or the fetch time.
#
# evidence: native_text = PDF text layer (pypdf) confirms the identity + date quoted below.
