meta:
  subject: >-
    OEPA/DAM permit download manifest — Bowling Green Water Pollution Control (WPC),
    NPDES 2PD00009 / application OH0024139 (issue 1439, under epic 1433)
  generated_at: '2026-08-01'
  policy: >-
    non-destructive — originals keep their as-received DAM names. Both files came from the
    canonical `permits/doc/` slot under their own bare permit-number basenames, so no collision
    rule applied and neither file was renamed. Every content-verified date below is read from
    that document's OWN embedded text layer, never from its filename or from outside knowledge.
  conflation_warning: >-
    THE CITY OF BOWLING GREEN OPERATES TWO PLANTS WITH NEARLY IDENTICAL CAPACITY NUMBERS AND
    THEY ARE NOT THE SAME FACILITY. This manifest covers only the WATER POLLUTION CONTROL
    plant (WPC) — the wastewater side, 901 North Dunbridge Road, 10 MGD average design,
    discharging to Poe Ditch in the PORTAGE basin. The city's WATER TREATMENT PLANT (WTP) is a
    different building on a different river — 17549 W. River Rd, ~10 MGD, drawing from the
    MAUMEE at the Waterville intake, PWS OH8700311. A figure lifted from one and filed under
    the other is a silent error that nothing downstream will catch.

documents:
- filename: 2PD00009.pdf
  canonical_name: >-
    Authorization to Discharge Under the NPDES — permit 2PD00009*TD as issued to the City of
    Bowling Green for the Bowling Green Water Pollution Control facility, 901 North Dunbridge
    Road, Wood County, discharging to Poe Ditch. Signed by Director Laurie A. Stevenson.
    Action date 2022-03-28; effective 2022-05-01; expires 2027-04-30. 54 pp.
  content_verified_date: '2022-03-28'   # "Action Date: March 28, 2022", printed on p. 1 of the text layer
  permit_id: 2PD00009
  permit_no: 2PD00009*TD
  application_no: OH0024139
  source_url: https://dam.assets.ohio.gov/image/upload/epa.ohio.gov/Portals/35/permits/doc/2PD00009.pdf
  sha256: 7e68611c0e12391b38c8ad24e863e929acca7b4359a3a57435d55f011216d044
  bytes: 287446
  content_type: application/pdf
  fetched_at: '2026-08-01'
  status: downloaded
  note: >-
    The operative instrument, and the one that dates the site's noncompliance. Part I.A is
    split in two: Item 1 is the INTERIM limit table running from the effective date "through
    the 36th month," and Item 2 is the FINAL table beginning "on 37th month after the effective
    date." The final table is where the new MBAS daily maximum (0.51 mg/L, 19.4 kg/day) and the
    new B2EHP and lower ammonia limits first bite. Part I.C.A.3 gives the permittee until "no
    later than 36 months after the effective date" to attain them. Effective 2022-05-01, so the
    final limits took force on or about 2025-05-01 — and ICIS carries the interim limit set
    ending 30-APR-25, which agrees. See data/extracted/oepa/bowling-green/2PD00009.npdes.yaml
    and the dating discussion in data/extracted/bowling-green/water-watch.yaml.
- filename: 2PD00009.fs.pdf
  canonical_name: >-
    Fact Sheet Regarding an NPDES Permit to Discharge to Waters of the State of Ohio for
    Bowling Green Water Pollution Control (WPC) — permit 2PD00009*TD, application OH0024139,
    Public Notice No. 22-02-025. 35 pp.
  content_verified_date: '2022-02-22'   # "Public Notice Date: February 22, 2022", printed on p. 1 of the text layer
  permit_id: 2PD00009
  permit_no: 2PD00009*TD
  application_no: OH0024139
  source_url: https://dam.assets.ohio.gov/image/upload/epa.ohio.gov/Portals/35/permits/doc/2PD00009.fs.pdf
  sha256: 4a17b0e0e01948d440ca1ffd64780564930b58e65dd392dc0f1d15f7480b553c
  bytes: 1001682
  content_type: application/pdf
  fetched_at: '2026-08-01'
  status: downloaded
  note: >-
    The anchor water record, and the document that settles the receiving-water chain the site
    profile had been carrying as [open]. Page 1 states it outright — "Receiving Water: Poe
    Ditch / Subsequent Stream Network: North Branch Portage River to Portage River to Lake
    Erie" — and p. 6 gives the river miles (Poe Ditch RM 2.5; Poe Ditch enters the North Branch
    Portage at RM 8.56), the Ohio EPA river codes (16-108 and 16-007) and the HUC
    (04100010-03-01). Table 12 (p. 30) carries the REGULATORY low-flow set: annual 7Q10 0.364
    cfs, 1Q10 0.285 cfs, harmonic mean 3.233 cfs, all drainage-area-adjusted from USGS gauge
    04195500 over 1951-97 — against a stated plant flow of 15.47 cfs (10 MGD). Those are the
    values that populate _BOWLING_GREEN.plant_receiving. Table 15 (p. 33) is the final effluent
    limit set. See data/extracted/oepa/bowling-green/2PD00009.fs.npdes.yaml.
