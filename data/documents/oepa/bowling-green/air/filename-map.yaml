  generated_at: '2026-08-01'
  policy: >-
    non-destructive — as-served bytes. Ohio EPA's eDocument portal serves no
    filename, so `edoc-<docid>.pdf` preserves the server's own document identity;
    the DAM-served hearing deck keeps its real as-served name.

  scope_warning: >-
    THIS SUBDIRECTORY IS A DIFFERENT FACILITY FROM ITS PARENT. `oepa/bowling-green/`
    holds the CITY's wastewater instrument (NPDES 2PD00009, Bowling Green Water
    Pollution Control, 901 N. Dunbridge Rd — see the filename-map one level up, and
    its own WPC-vs-WTP conflation warning). `oepa/bowling-green/air/` holds a
    PRIVATE generator's air instrument (Will-Power OH LLC - Apollo, 11902 Middleton
    Pike, Middleton Township) which shares nothing with the city plant but the
    county and the agency. Do not let the shared parent directory imply a shared
    facility, operator, or permit family.

  premise_correction: >-
    ISSUE #1437 CARRIES THE AIR CHAIN AS `[open]` — "Issuance of the final permit is
    pending" — AND IT IS NOT. The final PTI issued 2026-06-02 and is captured here.
    The OPSB Staff Report (2026-01-27) and Ohio EPA's hearing deck (2026-04-08) were
    both accurate when written; the record moved after them. What remains genuinely
    open is the TITLE V operating permit, which the permittee must apply for within
    twelve months of commencing commercial operation (~2027 on the applicant's own
    schedule) — that watch stays live and is registered in
    data/extracted/bowling-green/power-watch.yaml.

