# Capture / alias manifest — the Apollo air-permit chain, Ohio EPA DAPC, issue #1437.
#
# Four documents covering the whole permit-to-install chain for Will-Power OH LLC -
# Apollo, Facility ID 0387022027, permit P0139272: the completeness letter, the
# draft PTI, Ohio EPA's own public-hearing deck, and the final PTI.
#
# Raw bytes are never edited. Three of the four come from Ohio EPA's eDocument
# public portal, which serves documents by numeric document ID with no filename in
# the response (no Content-Disposition header), so the docid IS the as-served
# identity and the file is named for it; the canonical name is recorded beside it.
#
# The `content_verified` date is read from each file's OWN text layer (the issue
# line on the cover letter, the slide header), never from the URL or the fetch time.
#
# evidence: native_text = PDF text layer (pdftotext -layout) confirms the identity
#           + date quoted below.
