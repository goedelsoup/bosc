    note: >-
      A published opinion with a clean text layer, so every figure and date in
      the structured read is quoted, not transcribed from an image. It supplies
      four things nothing else in the corpus holds: the APPELLATE case numbers
      (5-25-02 and 5-25-03, which the issue body did not carry), confirmation of
      the trial-court numbers (2024 CV 00038 and 2024 CV 00161, printed on the
      caption page), the panel (Waldick, J., writing; Zimmerman, P.J., and
      Willamowski, JJ., concurring), and the actual holdings — both sides lost
      every assignment of error and BOTH judgments were affirmed.
      ⚠️ TWO INTERNAL ERRORS IN THE OPINION ITSELF, preserved, not corrected:
      at ¶15 the second case is called "2024-CR-161" (criminal designator) where
      the caption page and every other reference say 2024 CV 00161; and the
      Board's first and third assignments of error as block-quoted say
      "December 5, 2024" where the entire factual narrative says December 5,
      2023. Both are the court's own text.
      ⚠️ SCOPE TRAP: this opinion is about the OPEN MEETINGS ACT only. It has
      nothing to do with the ballot-language challenge that later undid the
      May-2025 referendum — that is a separate, still-[open] Common Pleas
      matter before Judge Starn. Do not let "2026-Ohio-405" stand in for the
      ballot case.
      ⚠️ SUBJECT-MATTER NOTE for the facility axis: the dispute began because
      One Energy "was making plans to construct additional wind turbines in
      Allen Township to, inter alia, provide power to the Whirlpool
      manufacturing facility" (¶2) — WIND, behind an industrial customer's
      meter. It corroborates, from a court's findings, the correction recorded
      in issue 1464 that the Wind-for-Industry turbines serve Whirlpool and are
      not generation at the Megawatt Hub.
