meta:
  subject: >
    Canonical filename map for legal/datacenter-legislation/ — Ohio data-center
    legislation of the 136th General Assembly. H.B. 983 enacts a new R.C. Chapter 3744
    (air/water discharge standards, a local citizen-vote requirement, water-supply
    liability, grid-independence, and a tax-incentive ban for data centers) and amends
    R.C. 9.66 to strip the confidentiality of data-center development-and-supply
    agreements — the sibling of the select-committee-2026 data-center hearing record and
    of the R.C. 9.66(D) confidentiality lever the records-legislation (H.B. 314) digest
    flags.
  note: >
    Per chain-of-custody rules (CLAUDE.md → Data discipline), source files keep their
    as-received names. The Ohio Legislature / LSC serves each bill version under a coded
    filename ("hb983_00_IN" = House Bill 983, document sequence 00, "IN" = As
    Introduced), retained as-received; the canonical name is recorded here.
    content_verified is read from the document's own native text layer (the bill body +
    its running header — "As Introduced" and "H. B. No. 983 Page N"), NOT the filename.

