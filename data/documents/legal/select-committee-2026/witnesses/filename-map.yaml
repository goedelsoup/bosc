meta:
  subject: >
    Custody manifest for the three witness submissions added to this folder on 2026-08-15,
    which arrived inside an Adams County records production rather than from the committee's
    own posting. They are the technical and environmental opposition testimony to **H.B. 646**
    before the Ohio House Technology and Innovation committee / Select Committee on Data
    Centers, May–June 2026.
  scope: >-
    ⚠️ THIS MANIFEST COVERS ONLY THE THREE DOCUMENTS LISTED BELOW. The sixteen files already
    in this folder were shelved under canonical names without a custody manifest and are not
    retro-documented here; their hashes and content-verified dates remain unrecorded. Adding
    them is follow-up work, not something this manifest silently implies.
  note: >-
    Per chain-of-custody rules (CLAUDE.md → Data discipline), these three keep their
    as-received names — including the misspelling "Committe" in the Petty filename, and the
    org-then-person and person-then-org orderings that disagree with each other and with the
    folder's existing `lastname-org-date.pdf` convention. Recorded, not normalized.
  retrieved: "2026-08-15"
  source: >-
    Received within a directory of Adams County records (the ACRWD production). The route by
    which these three reached that directory is NOT established — they may have come from the
    committee's witness portal, from the witnesses, or from a third party. Recorded as
    unestablished; the committee's own posting is the citable source and should be matched
    against these hashes before any of the three is cited as "as-submitted".

