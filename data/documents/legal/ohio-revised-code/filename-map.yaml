meta:
  subject: >
    Authenticated Ohio Revised Code sections this corpus reasons against, pulled from the
    Legislative Service Commission's own authenticated PDF series rather than from a code publisher
    or a party's paraphrase (#1998 tail).
  note: >-
    NOT filed under a site. A statute is no watershed point's record, and several sites reason
