# Capture / alias manifest — the Van Wert–Haviland transmission project, Ohio Power Siting Board,
# issue #1408 (epic #1267). First documents in the `grid/van-wert/` collection.
#
# Raw bytes are never edited. Both documents come from AEP Ohio Transmission's own project site,
# which is the route that finally opened this docket: PUCO/OPSB's Docketing Information System
# refuses automated retrieval (recorded three times in this corpus — #1437, #1464, #1401 — and
# again on 2026-08-05), but the applicant publishes the filings itself under
# https://aeptransmission.com/Ohio/VanWert-Haviland/. Those PDFs sit behind an Akamai check that
# returns 403 to a bare request and 200 with a browser User-Agent AND a Referer of the project
# page. That two-header requirement is the whole trick; note it before concluding a file is gone.
#
# The `content_verified` date is read from each file's OWN text layer, never from the URL, the
# link text, the PDF metadata, or the fetch time.
meta:
  subject: >-
    Ohio Power Siting Board Case No. 26-0729-EL-BLN — the Van Wert–Haviland 138 kV Transmission
    Line ADJUSTMENT Project, AEP Ohio Transmission Company, Inc., filed 2026-07-27 under the
    accelerated Letter-of-Notification track (OAC 4906-6-05); and its statutory public notice
  collection: grid/van-wert/
  captured_by: issue #1408 (epic #1267, readiness(van-wert) — the standing pre-construction watch)
  generated_at: '2026-08-05'
  policy: >-
    non-destructive — as-served bytes. The applicant's site serves these with spaces in the
    filenames; the committed names are hyphenated for a filesystem's sake and the as-served name
    is recorded beside each. Nothing else is altered.

  why_this_collection_exists: >-
    This is the FIRST transmission instrument in the corpus for Van Wert. Until now the only
    grid artifact for this site was a case NUMBER (25-0697-EL-BLN) carried from press coverage,
    with its docket unreachable and its connection to the Mega Site asserted by reporters rather
    than by any filing. The Adjustment LON breaks that: AEP's own Statement of Need names the Van
    Wert Mega Site directly, and the affected-properties table names a committed campus parcel.

  scope_warning: >-
    NAMING THE MEGA SITE IS NOT SIZING THE CAMPUS. This filing names no data center, no QTS
    entity, and no megawatt figure — the strings "QTS" and "data center" appear on none of the
    LON's 612 pages. Its stated engineering driver is a PJM baseline thermal-criteria violation
    (PJM project b3359), and the Mega Site enters as load-growth context, not as an
    interconnection customer. Nothing here grounds the campus's load, and this document must
    never be read as a proxy for it — the same error the Findlay record refused to make when a
    new 138 kV station was available to stand in for a missing load instrument, and the same one
    the Sidney record refused for the AES 6694 reroute.

  identifiers:
    opsb_case_adjustment: 26-0729-EL-BLN
    opsb_case_original: 25-0697-EL-BLN      # filed 2025-08-25, APPROVED by OPSB 2025-11-21, unbuilt
    pjm_baseline_project: b3359
    pjm_supplemental_project: s3142
    applicant: AEP Ohio Transmission Company, Inc.
    project_page: https://aeptransmission.com/Ohio/VanWert-Haviland/

documents:
- filename: VanWert-Haviland-Adjustment-PublicNotice.pdf
