  why: >-
    88.7 MB — a thirty-fold outlier against the largest binary this corpus holds, and 600 of its
    612 pages are map exhibits and blank easement forms. The nine narrative pages that carry every
    finding were read in full and are transcribed, page-cited, into
    data/extracted/grid/van-wert/van-wert-haviland-138kv.project.yaml. The sha256 above pins
    exactly which bytes were read, so the transcription is checkable and the pull is reproducible
    on demand; this is the same treatment the Sidney record gave the 20 MB sanitary-sewer plan set.
  how_to_pull: >-
    curl -L -A '<browser UA>' -e 'https://aeptransmission.com/Ohio/VanWert-Haviland/' '<source_url>'
    — both headers are required; without the Referer the CDN answers 403.
- what: The ORIGINAL project's Letter of Notification, Case No. 25-0697-EL-BLN.
  as_received_name: LON_VanWert-Haviland_20250825_FINAL.pdf
  source_url: https://aeptransmission.com/Ohio/VanWert-Haviland/docs/LON_VanWert-Haviland_20250825_FINAL.pdf
  why: >-
    Not fetched in this pass. The Adjustment LON restates the original's Statement of Need
    verbatim and gives its cost, length, approval date and PJM driver, so the original adds
