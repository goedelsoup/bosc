  canonical_name: >-
    NOTICE OF PROPOSED MAJOR UTILITY FACILITY — Van Wert–Haviland 138 kV Transmission Line
    Adjustment Project, OPSB Case No. 26-0729-EL-BLN. The statutory notice under OAC 4906-6-08.
    1 p., single sheet with an area map.
  issuer: AEP Ohio (AEP Ohio Transmission Company, Inc.)
  source_url: https://aeptransmission.com/Ohio/VanWert-Haviland/docs/Van%20Wert-Haviland%20138%20kV%20Transmission%20Line%20Adjustment%20Project%20-%20Public%20Notice.pdf
  sha256: aaaedc1b1975f8360bab78eb2e6177cbe00f6f8df5a9968ee6276ea5aea2bd47
  bytes: 144481
  content_type: application/pdf
  pages: 1
  fetched_at: '2026-08-05'
  content_verified: null
  evidence: >-
    native_text — the sheet prints NO date of its own anywhere in its text layer. Its PDF
    /CreationDate metadata reads 2026-07-22 and the server's Last-Modified header reads
    2026-07-30, but neither is a text-layer date and NEITHER IS THE PUBLICATION DATE, which is
    what actually matters here: the notice states that OPSB accepts motions to intervene "up to
    10 days following the publication date of this notice", and publication is in a newspaper of
    general circulation, not on this website. The intervention deadline is therefore [open] and
    must not be computed from any of these three timestamps. The LON says the notice would issue
    within 7 days of the 2026-07-27 filing, which brackets publication to on or before
    2026-08-03 — a bracket, not a date.
  status: downloaded
  note: >-
    Small and load-bearing. It states, in the applicant's own words, that 25-0697-EL-BLN was
    "previously approved"; that this filing adjusts the approved route "to reconfigure the
    transmission line's entry into the station"; and that construction is planned for fall 2026
    through early 2028. It also prints the service list — the officials OPSB regulations required
    be served — which is the cleanest roster of Van Wert County and township officeholders in the
    corpus and independently corroborates two names the City legislative record already carries
    (County Commissioner Thad Lichtensteiger, whose written comment is quoted in
    data/extracted/van-wert/mega-site-instruments.yaml, and Mayor Kenneth Markward).

