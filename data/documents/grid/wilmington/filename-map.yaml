# Capture / alias manifest — Wilmington (Clinton County) power instruments, issue #1469.
#
# Web-captured primary evidence for the AES Ohio 345 kV build-out that the
# Wilmington campus corridor sits inside: PJM's own Transmission Expansion
# Advisory Committee (TEAC) Dayton Supplemental Projects decks — the M-3
# filings that state each AES Ohio large-load customer request's MW ramp — plus
# the statutory service copy of AES Ohio's Letter of Notification for OPSB case
# 25-0871-EL-BLN, captured from the CITY OF WILMINGTON's own website rather than
# from the applicant, and AES Ohio's self-published project material.
#
# ROUTE NOTE (the reason the docket itself is not here). PUCO/OPSB's docketing
# system `dis.puc.state.oh.us` refused automated retrieval again on 2026-08-06 —
# the sixth confirmation in this repo: a plain request returns a 245-byte
# "Request Rejected" page and a full-browser-header request returns a 7,554-byte
# F5/BIG-IP `bobcmn` JavaScript bot challenge. `opsb.ohio.gov/cases/<case-no>`
# answers HTTP 200 but is a WebSphere Portal facade that renders
# "No content found for: ohio content english/opsb/cases/25-0871-EL-BLN" — it
# proxies nothing. So the LON APPLICATION ITSELF (route maps, the full need
# statement, the service list, the seven intervenors' petitions, Staff's report,
# the Board's entry) was NOT obtained. That is a BLOCKED ROUTE, not an absence:
# nothing may be inferred from its silence. What is here is the service copy the
# applicant mailed to the City under O.A.C. 4906-6-07 and the City published.
#
# The `content_verified` date is read from each file's OWN content — a cover
# page, a printed slide date, a printed month, or the PDF's embedded
# CreationDate/ModDate — never from the URL, the filename, or the fetch time.
#
# evidence: native_text   = PDF text layer (pypdf) confirms the identity + date
#           vision_read   = no text layer; identity + date read off a 200-DPI render
#           pdf_metadata  = the body prints no date; the embedded PDF date is used
#           as_captured   = HTML served as-is; the page prints no publication date
