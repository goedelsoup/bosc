# Capture / alias manifest — Bowling Green (Wood County) power and grid instruments,
# issues #1437 (the Apollo siting record) and #1440 (serving utility + grid posture).
#
# Three documents. Raw bytes are never edited and a file keeps the name the server
# served it under, where the server gave one.
#
# The `content_verified` date is read from each file's OWN text layer (a docket
# caption, a DIS filing stamp, a tariff sheet's effective date, a compilation's own
# "Updated" line), never from the URL, the fetch time, or outside knowledge.
#
# evidence: native_text = PDF text layer (pdftotext -layout / pypdf) confirms the
#           identity + date quoted below.
meta:
  subject: >-
    The Wood County power and grid instruments — (1) the Apollo Power Generation
    Facility siting record, OPSB Case No. 25-0973-EL-BLN, Will-Power OH, LLC,
    Middleton Township (issue #1437); (2) The Toledo Edison Company's filed retail
    tariff P.U.C.O. No. 8, which is what actually governs a large load in Wood
    County today and which names Wood County in its own definition of territory;
    and (3) the EEI large-load compilation that carries the pending FirstEnergy
    Data Center Tariff docket number (issue #1440). Both under epic #1433.
  collection: grid/bowling-green/
  captured_by: >-
    issues #1437 (the power instrument) and #1440 (serving utility + grid posture),
    epic #1433, readiness(bowling-green)
  generated_at: '2026-08-05'
  policy: non-destructive — as-served bytes, as-served filename where one was served.

  served_filename_exception: >-
    The EEI compilation is served from a CMS path with no filename and no extension
    (…/Issues%20and%20Policy/List%20of%20Large%20Customer%20Projects%20and%20Tariffs),
    so there is no as-served name to keep. It is filed under a descriptive name that
    carries its own edition, and the URL it was served from is recorded below. That
    is the stated exception to the as-served-filename rule, not a silent rename.

  case_number_warning: >-
    THE CASE NUMBER IN ISSUE #1437 IS WRONG AND SO IS OPSB'S OWN PRESS RELEASE.
    The docket is 25-0973-EL-**BLN** (Board Letter of Notification), not
    25-0973-EL-BGN. The caption on page 1 of this document reads "In the Matter of
    the Letter of Notification Application of Will-Power OH, LLC ... Case No.
    25-0973-EL-BLN", every page footer of the Staff Report repeats "25-0973-EL-BLN",
    and the DIS electronic-filing stamp on the last page reads "Case No(s).
    25-0973-EL-BLN". OPSB's own news release of 2026-02-03 says to search
    "25-973-EL-BGN" — wrong suffix AND a dropped leading zero — while OPSB's
    structured gas-fleet case table (Natural_Gas_Map_and_Stats.pdf, produced
    2026-07-22) lists it correctly as 25-0973-EL-BLN alongside sibling rows that
    are genuinely -BGN. The suffix is not cosmetic: BLN is the accelerated
    letter-of-notification track that produced the automatic approval with no
    public hearings, which is the fact the issue is about. Cite BLN.

  retrieval_warning: >-
    THIS IS A NEWS ORGANIZATION'S MIRROR OF A STATE RECORD, NOT AN AGENCY-SERVED
    COPY, AND THAT IS DELIBERATE. The issuing system — the PUCO/OPSB Docketing
    Information System at dis.puc.state.oh.us — serves an F5/BIG-IP JavaScript
    bot-challenge to automated retrieval; every request without a solved challenge
    returns a 245-byte "Request Rejected" page carrying only a support ID. The
    docket is therefore ACCESS-BLOCKED, NOT EMPTY, and no inference may be drawn
    from what could not be fetched there (the same per-source negative recorded for
    Findlay at data/extracted/grid/findlay/megawatt-hub-interconnection.gap.yaml,
    issue #1464). WTOL-11 published the filing verbatim; the bytes below are that
    copy, hashed on capture. It is a complete, internally consistent instrument
    that carries its own DIS filing stamp, so it is treated as the record — but the
    custody chain runs through a third party and that is stated, not hidden.

