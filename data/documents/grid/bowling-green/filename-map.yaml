    note: >-
      WHY A TOLEDO EDISON TARIFF IS A BOWLING GREEN DOCUMENT. Original Sheet 3,
      DEFINITION OF TERRITORY, effective 2026-03-01, states that "Company's Territory"
      "shall be deemed to mean and include the territory served by the Company's
      distribution system in Defiance, Fulton, Henry, Lucas, Ottawa, Putnam, Sandusky,
      Seneca, Williams and Wood Counties." WOOD COUNTY IS NAMED IN THE UTILITY'S OWN
      FILED TARIFF. That is the instrument behind the otherwise press-sourced claim
      that the Meta campus in Middleton Township sits in Toledo Edison / PJM ATSI
      territory rather than on the Bowling Green municipal system.
      THE BOOK ALSO CARRIES A VERIFIED NEGATIVE: there is no Schedule DCT and no
      data-center schedule anywhere in it. A full-text scan of all 168 pages for "DCT"
      or "data center" returns nothing. The FirstEnergy Data Center Tariff is FILED AND
      PENDING (PUCO 26-0697-EL-ATA, June 2026), not effective, and this book is the
      proof of what governs in the meantime — Rate GT plus Electric Service Regulations
      §II.G. Read as pages, 0-based: Table of Contents 1-3, Definition of Territory 4,
      Electric Service Regulations 5-27 (§II.G "Large Capacity Arrangements" on page 7),
      Rate GS 29-31, Rate GP 32-34, Rate GSU 35-36, Rate GT 37-39.
      Sheets carry different effective dates and different revision numbers; cite the
      sheet and its own stamp, never the compilation date, for any single term.

