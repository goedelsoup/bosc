  note: >-
    AES Ohio's own account, dated July 21, 2026, of what it filed in PUCO Case No.
    25-958-EL-AIR: "filed an unopposed Settlement (Stipulation) with the PUCO Staff
    and 16 parties for a Three-Year Rate Plan", including "Customer protections that
    ensure data centers will pay for their costs, under a new Data Center Tariff as
    recommended by the PUCO", and "Predictable costs with planned distribution rates
    through 2029". A SELF-PUBLISHED utility account of a filing, not the filing —
    the stipulation itself is on the PUCO docket, which is WAF-blocked from this
    workstation (see regulatory-watch.yaml, `puco_dis` access failure). It does not
    state the four DCT rate classes, any AWS-specific service agreement, or any
    megawatt figure.
