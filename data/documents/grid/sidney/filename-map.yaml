  note: >-
    The only public instrument found that puts AES itself on the ground next to the
    AWS campus. Notice of Intent for Construction Site Stormwater General Permit
    coverage OHC000006, Ohio EPA facility permit number 1GC11112*AG. Applicant "The
    AES Corporation", 1 Monument Circle, Indianapolis IN; contact Jason Steckel.
    Facility "6694 Transmission Line Reroute", 2522 Mill Creek Road, Sidney, Clinton
    Township, Shelby County; 40.26960894 / -84.19750701 — roughly 500 ft west of the
    campus NOI point. Receiving waters "Mill Creek - Loramie Creek (12HUC:
    050800010604), Brush Creek - Great Miami River (12HUC: 050800010703)". Total
    land disturbance 1.55 acres; construction 2026-09-01 to 2026-12-31; SWPPP
    figures dated 2026-06-25. Coverage approved 2026-07-09. It carries NO voltage,
    NO circuit rating and NO megawatts — it is a stormwater instrument, and it must
    not be read as evidence of the campus load. See
    data/extracted/sidney/regulatory-watch.yaml, instrument `aes-6694-reroute`.
