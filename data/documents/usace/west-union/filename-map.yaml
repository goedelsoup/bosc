    carries:
      - "⚠️ THE PROJECT DESCRIPTION OF RECORD, and the coordinate: 'The proposed Buck Canyon Site Project encompasses approximately 1,016 ACRES located NORTH AND EAST OF GINGER RIDGE ROAD and WEST OF U.S. ROUTE 52 in Manchester, Sprigg Township, Adams County, Ohio at approximately 38.646748 LATITUDE, -83.659828 LONGITUDE'"
      - "⚠️ THE FILL, itemised: 1,893 linear feet (0.364 acre) of FOUR streams — Stream 9 (258 lf / 0.017 ac), Stream 24 (847 lf / 0.098 ac), ELK RUN (303 lf / 0.12 ac), CARTER HOLLOW (485 lf / 0.129 ac) — plus 0.06 acre of TWO wetlands (Wetland E 0.01 ac, Wetland G 0.05 ac), for grading and filling"
      - "⚠️ CARTER HOLLOW IS THE JOIN. The ACRWD minutes of 2025-05-13 put the campus water transmission main's terminus at 'Carter Hollow'; this federal record fills 485 linear feet of it. Same hollow, two agencies, two purposes."
      - "Watershed: 'Crooked Creek-Ohio [River]'; receiving water Elk Run, a tributary of the Ohio River, which is a traditional navigable water"
      - "THREE CEMETERIES in or adjacent to the project area: the Boone Family Cemetery at 1669 [Ginger Ridge Rd] (OGS ID 85, also recorded as Little #1 Cemetery, OGS ID 13191); the ROGERS PARR CEMETERY; and the previously unrecorded DAVIDSON CEMETERY (OHI ADA0063512), documented within the expanded boundaries"
      - "Archaeology: Phase I/II by R. Christopher Goodwin & Associates, August 2025. Limits of disturbance ≈1,009 acres, of which ≈770 acres previously surveyed (Purtill, Norr and Owen 2008) and ≈251 acres newly shovel-tested. Three new OAI sites (33AD0477–33AD0479); four previously documented sites expanded (33AD0393, 33AD0395, 33AD0401, 33AD0402). Site 33AD0399 was largely destroyed but the Rogers Parr Cemetery within it was largely intact."
      - "AVOIDANCE, as permit conditions: high-visibility temporary construction fencing around the Boone and Davidson cemeteries; PERMANENT fencing along a 100-FOOT BUFFER perimeter around the Rogers Parr Cemetery; temporary signage at all three; pedestrian access maintained post-construction"

