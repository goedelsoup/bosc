meta:
  subject: >
    Canonical filename map for usace/west-union/ — the U.S. Army Corps of Engineers Huntington
    District regulatory correspondence file for **LRH-2025-00457-OHR (-Elk Run)**, the Clean
    Water Act §404 record of the Buck Canyon Site Project in Sprigg Township, Adams County,
    Ohio. Fourteen Outlook "Memo Style" print-to-PDF chains covering 2025-05-20 (the request
    for a jurisdictional determination) through 2026-02-18 (the revised NWP 39 verification
    letter) — the AJD/PJD, the ESA/SLOPES coordination with USFWS, the full §106 consultation
    with the Ohio SHPO over three cemeteries, and the permit issuance.
  note: >-
    Per chain-of-custody rules (CLAUDE.md → Data discipline), files keep their as-received
    names. "Email Chain 1..14.pdf" is a production numbering applied by the producing party,
    not by the Corps; it is NOT chronological (Chain 1 is the earliest, Chain 4 falls between
    Chains 3 and 5, but Chains 6 and 7 are near-duplicates of the same thread). The
    `thread_span` field below carries the real date range of each file, read from the message
    headers inside it. `date` is the file's LATEST message — the date the chain was current —
    since these are cumulative threads, not single letters.
  retrieved: "2026-08-15"
  source: >-
    U.S. Army Corps of Engineers, Huntington District, Regulatory Division, 502 8th Street,
    Huntington, WV 25701-2070. Project manager Lee J. Arco (Archaeologist); branch chief
    Teresa D. Spagna (Chief, North Branch). All fourteen carry PDF /Author "Arco, Lee J CIV
    USARMY CELRH (USA)" and /Producer "Microsoft: Print To PDF", printed 2026-03-19 between
    07:00 and 07:11 EDT — i.e. the whole set was printed in a single eleven-minute sitting,
    the signature of a records production rather than a rolling file.
  route: >-
    ⚠️ The production route is not recorded in the corpus. The uniform 2026-03-19 print stamp
    is consistent with a FOIA response from the Huntington District, but no cover letter,
    request number or determination letter accompanied the files. Recorded as unestablished;
    do not cite these as "FOIA-released" until the request record is pulled.
  gap: >-
    THE ATTACHMENTS ARE NOT HERE — only the covering messages. Named but absent: the AJD/PJD
    letter and Enclosure 1 (JD Review Area), the Jurisdictional WOTUS Delineation Report, the
    PCN application, the NWP 39 verification letter and its revision, the Buck Canyon Cemetery
    Avoidance Plan, the Goodwin Phase I/II archaeology reports, the signed SLOPES form, the
    SHPO review letters (2025ADA66354_1112049, 2025ADA6635_1112658and1112718), and the USFWS
    and ODNR tree-clearing letters. Each is a next record to pull. The messages quote enough
    of the operative findings to stand on their own for the facts recorded below.

