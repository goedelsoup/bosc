meta:
  subject: >
    Canonical filename map for van-wert/county/ — the Van Wert County Board of Commissioners'
    published record, captured for #1407.
  note: >
    `.html` under data/documents/** is `-text` in .gitattributes: raw response bytes, never
    reformatted. The county publishes AGENDAS ONLY — no journal entries, resolutions or votes are
    reachable by this route, so nothing here evidences a county ACTION.
  retrieved: "2026-08-05"
  route_note: >
    /commissioners/ returns 403 and /commissioners/minutes returns 404. The working index is
    /government/county_commissioners/<year>_agendas.php — one page per year holding every meeting
    date and its agenda, so a single GET captures the whole year. Sibling pages exist back to 2018.

