meta:
  subject: >
    Canonical filename map for van-wert/operator/ — captured web evidence published by QTS Data
    Centers about the Van Wert campus (#1407). Not a public record: the operator's own page, held
    so that what it asserted, and when, is fixed.
  note: >
    `.html` under data/documents/** is `-text` in .gitattributes: these are the raw response
    bytes, never reformatted. `content_verified` records how the capture DATE was established —
    here it is the capture itself (the page carries no publication or revision date of its own),
    which is why the filename leads with the capture date rather than a document date.
  retrieved: "2026-08-05"
  route_note: >
    q.com is WordPress and server-rendered, so a plain GET preserves the full text. This is the
    opposite of the city-launched vanwertohiodatacenter.com microsite, which was a client-rendered
    Next.js app whose FAQ prose the Internet Archive never captured (#1401) and which now
    301-redirects to this page. Capture a JS-rendered municipal microsite while it is live or lose
    it.

