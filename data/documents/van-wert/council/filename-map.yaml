meta:
  subject: >
    Canonical filename map for van-wert/council/ — the City of Van Wert legislative record behind
    the QTS Van Wert Mega Site (#1401): the three 2026-05-11 emergency ordinances that annexed and
    rezoned the campus, the 2026-05-04 statutory public-hearing record they rest on, and the two
    council meetings (2026-04-27, 2026-05-11) that ordered and passed them.
  note: >
    Per chain-of-custody rules (CLAUDE.md → Data discipline), source files keep their as-received
    names — the City's own WordPress upload names, which are bare US dates for minutes
    (`5.11.26.pdf`) and `YY-MM-NNN` ordinance numbers for legislation. `content_verified` records
    HOW the date below was established from the document's own bytes (the native text layer, or
    OCR of the scanned body at 300 DPI) — never from the filename or the upload path. Every one of
    these files is a scan with no usable text layer except `5.11.26.pdf` and
    `5.4.26-Public-Hearing-1.pdf`, whose text layers cover only their typed attachments; the
    minutes bodies themselves are images in both.
  custody_caveat: >
    NONE of the six ordinance PDFs is a signed or certified as-passed copy. All six were uploaded
    2026-05-07 17:10 UTC — four days BEFORE the 2026-05-11 vote — and every one prints an unfilled
    "Passed this ___ day of ___, 2026" and unsigned signature lines. The as-passed text, the
    titles as read, and the fact of passage are evidenced by `5.11.26.pdf` (the approved minutes),
    not by the ordinance files. A certified copy is a records request to the Clerk of Council.
  retrieved: "2026-08-03"
  source_base_url: "https://vanwert.org/wp-content/uploads/"
  source_index_pages:
    - "https://vanwert.org/meeting-minutes/"
    - "https://vanwert.org/ordinances/"
  source_note: >
    The `https://vanwert.org/ordinances/` page carries only PENDING legislation — on 2026-08-03 it
    listed eight June/July 2026 items and nothing from May. The May 2026 ordinances were located
    through the site's open WordPress REST media index
    (`/wp-json/wp/v2/media?search=26-05&per_page=100`), which enumerates the full upload archive
    with `date`, `title` and `source_url` and required no auth. Record that route: the ordinances
    page is a rolling window, the media index is the archive.

documents:
  - filename: 26-04-026.pdf
    committed: false
    reason: >
      Checked and deliberately NOT ingested. Ordinance 26-04-026, passed 2026-05-11 on second and
      final reading as an emergency, approves a Community Reinvestment Area agreement with TRUE
      NORTH PARTNERS HOLDINGS, LLC — 90% property-tax abatement over ten years for a $14,000,000
      building at 205 Bonnewitz Crossing creating 15 jobs. It is NOT the Mega Site; neither is
      26-04-027 (the same night's CRA with COOL MACHINES HOLDINGS, INC). Recorded here so the
      next pass does not re-chase two same-meeting CRAs as data-center incentives.
    source_url: "https://vanwert.org/wp-content/uploads/2026/04/26-04-026.pdf"

