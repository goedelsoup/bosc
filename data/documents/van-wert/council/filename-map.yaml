  - filename: 5.4.26-Public-Hearing-1.pdf
    canonical: van-wert-council-public-hearing-2026-05-04-record.pdf
    type: council-public-hearing-record
    date: "2026-05-04"
    content_verified: ocr        # body p.0: "Van Wert City Council Public Hearing Minutes of May 4, 2026"
    approved: "2026-05-11"       # p.1: "Approved by Council on May 11, 2026", certified by Clerk Phillips
    pages: 107
    bytes: 28721870
    sha256: "6b3ec8cba8b4bbcb162a1ef780bcea1dfe16b7e7dd845c37523ca82648f285e1"
    source_url: "https://vanwert.org/wp-content/uploads/2026/05/5.4.26-Public-Hearing-1.pdf"
    source_last_modified: "2026-05-26T18:17:31Z"
    text_layer: partial          # 10,777 chars, all in typed attachments; pp.0-1 minutes are images
    structure:
      - "pp. 0-1 — the certified hearing minutes (Niswonger PAC lecture hall; ~200 attending, ~40 speakers; 6:30-8:03 pm)"
      - "pp. 2-10 — handwritten sign-in sheets, sorted City / adjacent landowner / County / outside County. Largely illegible to OCR; recorded as held, not as read"
      - "p. 11-12 — AEP Ohio testimony, Zach Miller, Director of Economic Development and Data Center Integration"
      - "p. 13 — Danfoss A/S letter (Wade R. Adamson, 2026-03-19) to VWAED"
      - "p. 14 — City of Van Wert press release, Safety-Service Director Jay C. Fleming, 2026-04-21, on water"
      - "p. 15 — written comment of Van Wert County Commissioner Thad Lichtensteiger, on Commissioners' letterhead"
      - "p. 16, 23-24 — Van Wert Area Economic Development (Lauren Buchanan; Executive Director Brent Stevens)"
      - "pp. 17-106 — 88 pages of written public comment"
    carries:
      - "THE FOUR PARCELS in the conditional-zoning petition, stated in the hearing notice: 17-034718.0000, 33-047500.0000, 12-034459.0000, 17-034718.0100"
      - "AEP Ohio: early data-center interest exceeded 30,000 MW; 5,342 MW have advanced to signed agreements under the PUCO-approved data-center tariff"
      - "Fleming (2026-04-21): no ongoing municipal water; sealed water+glycol closed loop; ONE-TIME initial fill of ~660,000 gallons SOLD BY THE CITY; reservoir >85% full; ~2 MGD excess treatment/distribution capacity"
      - "Commissioner Lichtensteiger: the same fill at 700,000 gallons against 1.6 MGD city consumption, 'that will last for 6 to 8 years'; Thor's power-upgrade cost '$72 million'"
      - "Brent Stevens (VWAED): sourced the opportunity 'more than two years ago', vetted 'over 25 different data center groups'; urges Council to approve 'the necessary incentives, zoning, and permitting'"
      - "Danfoss: 53 new direct jobs at its Van Wert operation from data-center product growth"
      - "The one substantively cited opposition comment (pp. 104-106) — Lower Town Creek impairment, Ohio EPA draft general permit OHD000001, and the two figures it attributes to the now-lost city FAQ (a 5,500-gallon fill and '500 MWh')"
    notes: >
      The hearing was comment-only by rule — no questions, two minutes each, one turn per person.
      Written comments are "retained in the Clerk's official file" and an audio/video recording is
      "maintained as part of the official record by the Clerk of Council": two records requests
      this file names but does not contain.

