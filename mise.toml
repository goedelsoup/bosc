# mise — dev toolchain for Project BOSC, configured as a monorepo.
#
# Two projects share one toolchain:
#   • backend (this root): the Python `bosc` package + corpus — tasks `mise run <task>`
#   • web (web/): the Astro site — tasks `mise run //web:<task>`
#
# A bare task name runs the project you're standing in: `mise run test` is the backend's
# pytest at the repo root and the web's vitest inside web/. Target a project
# explicitly from anywhere with the `//project:task` path (`mise run //web:test`).
#
#   mise install            # install pinned tools (python, uv, node, git-lfs)
#   mise run setup          # bootstrap BOTH projects (deps, Git LFS, Claude Code CLI)
#   mise run check          # backend gate (lint + format + markdown + types + tests)
#   mise run //web:check    # web gate (lint + types + tests + build + links)
#   mise run ci             # the whole-repo gate — both of the above
#   mise tasks --all        # list every task across both projects
#
# CI (.github/workflows/ci.yml) calls the underlying commands directly, not these tasks,
# so editing a task never changes CI. Not using mise? See Brewfile for the Homebrew fallback.

monorepo_root = true

[settings]
experimental = true   # required for the monorepo task paths (`//project:task`)

[monorepo]
config_roots = ["web"]   # subprojects with their own mise.toml

[tools]
aws = "latest"
python = "3.11"
uv = "latest"
node = "24"        # pinned LTS for the Astro web/ build (CI uses the same major)
# The single Node package manager for the whole repo (Epic #1549). Pinned to match the
# `packageManager` field in package.json — that field is what `pnpm/action-setup` reads in
# CI, so the two must agree. One pnpm store retires the npm version foot-guns (homebrew-vs-
# pinned biome, `npx` pulling a newer markdownlint).
"npm:pnpm" = "10.33.2"
git-lfs = "latest"
pulumi = "latest"  # deploy/ stack — `cd deploy && pulumi up` (see deploy/README.md)

[env]
_.file = ".env"
# Keep uv's managed virtualenv in-project so mise and uv agree on the interpreter.
UV_PROJECT_ENVIRONMENT = ".venv"

# === cross-cutting (both projects) ==========================================
[tasks.setup]
description = "Bootstrap both projects: Python + web deps, Git LFS, Claude Code CLI"
# `//web:install` (pnpm install) installs the ENTIRE workspace — root tooling
# (markdownlint-cli2) and the Astro site both — so there's no separate root Node install.
depends = ["//web:install"]
run = [
  "uv sync --extra dev",
  "git lfs install --local",
  "npm install -g @anthropic-ai/claude-code",   # a global CLI, not a workspace dep
]

[tasks.ci]
description = "The whole-repo gate — backend `check` + web `check` (mirrors the CI jobs)"
depends = ["check", "//web:check"]

[tasks.clean]
description = "Remove regenerable caches/outputs (connector cache, Astro cache, dist)"
run = "rm -rf data/cache web/node_modules/.astro web/dist"

# === backend (the Python `watermark` package) ====================================
[tasks.dev]
description = "Run the watermark CLI — pass args after `--`, e.g. `mise run dev -- export`"
run = "uv run watermark"

[tasks.check]
description = "Backend gate: ruff + format-check + Markdown lint + mypy + catalog gate + pytest"
run = [
  "uv run ruff check .",
  "uv run ruff format --check .",
  "pnpm exec markdownlint-cli2",   # repo-wide Markdown (config: .markdownlint-cli2.yaml)
  "uv run mypy",
  "uv run watermark catalog check",   # data-catalog gate: schema · missing · orphan · drift (#631)
  "uv run watermark sites check",     # sites-registry gate: YAML ↔ Python ↔ JSON in sync (#1027)
  "uv run pytest -n auto",   # pytest-xdist: parallelize across cores (override with `-n0` to debug)
]

[tasks.test]
description = "Backend tests only (pytest)"
run = "uv run pytest -n auto"

[tasks."test:v"]
description = "Backend tests, verbose (test names + full tracebacks)"
run = "uv run pytest -v --tb=long -m 'not network'"

[tasks.lint]
description = "Backend lint only (ruff check)"
run = "uv run ruff check ."

[tasks.types]
description = "Backend type-check only (mypy strict)"
run = "uv run mypy"

[tasks.fmt]
description = "Auto-fix the backend: ruff lint --fix + ruff format + Markdown"
run = [
  "uv run ruff check --fix .",
  "uv run ruff format .",
  "pnpm exec markdownlint-cli2 --fix",
]

[tasks.export]
description = "Regenerate the content bundle the web site reads (watermark export → data/site/bundle/)"
run = "uv run watermark export"

# === yidam corpus mirror (epic #1560 / #1561 / #1562) =======================
# `watermark export` (and `watermark corpus-mirror`) projects the committed corpus into yidam
# node format under the git-ignored .yidam/corpus/ and regenerates the yidam reports
# (corpus-index / open-questions / graph-check / lint) under .yidam/reports/. BOSC replicates
# yidam's report logic in Python (watermark.site.corpus_mirror), so the mirror regenerates
# offline with no Rust toolchain — the pinned upstream is .yidam.toml.
#
# The real `yidam` CLI is OPTIONAL. It is not published to crates.io and is not a `[tools]`
# entry here (building it needs Rust 1.88 + protoc + lancedb — out of scope for BOSC's CI); to
# use it, build it from the pinned ref (`cargo install --path yidam/cli` in a yidam checkout).
# When it is on PATH, the `yidam-*` tasks below run its reports over the SAME mirror to
# cross-check the Python replicas.
[tasks.corpus-mirror]
description = "Regenerate the yidam corpus mirror + reports for the active site (Python engine)."
run = "uv run watermark corpus-mirror"

# The wiki cross-link audit (#1571): flag unresolved [[wiki links]] (the hard gate), orphan
# concepts, and under-linked concepts over the active site's glossary — the content-level pass
# corpus-mirror's node-graph graph-check is blind to. CI runs the same command (the optional
# corpus-hygiene gate); `--suggest` adds link hints, `--no-check` reports without failing.
[tasks.wiki-lint]
description = "Audit the wiki [[link]] cross-reference graph for the active site (#1571)."
run = "uv run watermark wiki-lint"

# The corpus VECTOR index (#1564): embed the mirror nodes into a LanceDB index (.yidam/index/)
# with the same all-MiniLM-L6-v2 backend as the /ask embeddings, so `yidam serve --mcp` can
# search the method-layer graph by meaning. Opt-in (downloads the ~80 MB model on first run);
# the MCP server rebuilds it lazily too, so this task is only for a warm, committed-free artifact.
[tasks.corpus-vector-index]
description = "Build the LanceDB vector index over the yidam corpus mirror (.yidam/index; #1564)."
run = "uv run watermark corpus-mirror --index"

[tasks.yidam-graph-check]
description = "Cross-check the mirror with the real yidam CLI (optional; needs `yidam` on PATH)."
run = "yidam graph-check"

[tasks.yidam-corpus-index]
description = "Regenerate the corpus index with the real yidam CLI (optional)."
run = "yidam corpus-index"

[tasks.yidam-open-questions]
description = "List open questions with the real yidam CLI (optional)."
run = "yidam open-questions"

[tasks.yidam-lint]
description = "Lint the mirror with the real yidam CLI (optional; advisory)."
run = "yidam lint --warn"

[tasks.onboard-site]
description = "Bootstrap a site's connector data — the catalog DAG in dependency order (#1025)"
usage = '''
arg "<site>" help="Target site slug"
'''
# The catalog's `onboard-bundle` aggregate resolves the run order (the executable half of
# docs/onboarding.md). --dry-run previews the plan; drop it (run the printed command by
# hand) for a live run. The agent-driven research pass stays `onboard-research`.
run = '''
uv run watermark catalog run onboard-bundle --site "${usage_site}" --dry-run
'''

[tasks.onboard-research]
description = "Agent-driven site research pass (the old onboard-site recipe)"
usage = '''
arg "<site>" help="Target site slug"
'''
run = '''
uv run watermark --site "${usage_site}" research run --recipe site-onboard
'''

[tasks.oepa-permit]
description = "Fetch, ingest, and extract one OEPA/DAM permit end-to-end"
usage = '''
arg "<permit_id>" help="NPDES permit ID, e.g. 2PD00006"
arg "<site>" help="Site slug, e.g. van-wert"
arg "[kind]" help="Document kind for extract (default: npdes)" default="npdes"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
permit_id="${usage_permit_id}"
site="${usage_site}"
kind="${usage_kind:-npdes}"

uv run watermark --site "${site}" oepa fetch --permit-id "${permit_id}"
uv run watermark ingest

# _doc_id mirrors watermark.pipeline.ingest._doc_id: sha256(str(absolute_path))[:8]
doc_id=$(uv run python -c "
import hashlib
from watermark.config import get_settings
p = get_settings().documents_dir / 'oepa' / '${site}' / '${permit_id}.pdf'
print('${permit_id}-' + hashlib.sha256(str(p).encode()).hexdigest()[:8])
")

uv run watermark --site "${site}" extract "${doc_id}" --kind "${kind}" --write

# Keep _observed.yaml in sync so catalog check passes without a manual reconcile step.
uv run watermark catalog reconcile
uv run watermark catalog audit --apply
'''

# === worktrees (git worktree + GitHub issue integration) ========================
#
#   mise run wt:new 123          # branch from issue #123 → ../123-short-title/
#   mise run wt:new my-feature   # plain branch name
#   mise run wt:list             # all worktrees
#   mise run wt:rm 123           # remove by issue number
#   mise run wt:rm my-feature    # remove by branch name
#   cd "$(mise run wt:path 123)"   # jump into a worktree
#
# Worktrees live as siblings of `main` inside the watermark-directory/ parent.
# Issue branches are named <number>-<slug> so they round-trip by issue number.

[tasks."wt:new"]
description = "Create a sibling worktree — accepts a GitHub issue number or branch name"
usage = '''
arg "<target>" help="Issue number (e.g. 123) or branch name (e.g. my-feature)"
flag "--base <base>" help="Base branch or ref to branch from (default: main)"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

target="${usage_target}"
base="${usage_base:-main}"

if [[ "$target" =~ ^[0-9]+$ ]]; then
  # Reuse any local branch already created for this issue number so a title
  # change doesn't silently spawn a second branch for the same issue.
  branch=$(git branch --format='%(refname:short)' \
    | grep "^${target}-" | head -1 || true)
  if [[ -z "$branch" ]]; then
    title=$(gh issue view "$target" --json title --jq '.title')
    slug=$(printf '%s' "$title" \
      | tr '[:upper:]' '[:lower:]' \
      | sed 's/[^a-z0-9]/-/g; s/-\+/-/g; s/^-//; s/-$//' \
      | cut -c1-50)
    branch="${target}-${slug}"
  fi
else
  branch="$target"
fi

parent=$(dirname "$(git worktree list --porcelain | awk '/^worktree /{sub(/^worktree /, ""); print; exit}')")
dest="${parent}/${branch}"

if [[ -d "$dest" ]]; then
  echo "worktree already exists at $dest" >&2
  exit 1
fi

if git show-ref --quiet "refs/heads/${branch}"; then
  git worktree add "$dest" "$branch"
elif git show-ref --quiet "refs/remotes/origin/${branch}"; then
  git worktree add --track -b "$branch" "$dest" "origin/${branch}"
else
  git worktree add -b "$branch" "$dest" "$base"
fi

echo "$dest"
'''

[tasks."wt:list"]
description = "List all git worktrees"
run = "git worktree list"

[tasks."wt:rm"]
description = "Remove a sibling worktree — accepts a GitHub issue number or branch name"
usage = '''
arg "<target>" help="Issue number (e.g. 123) or branch name (e.g. my-feature)"
flag "--delete-branch" help="Also delete the local branch after removing the worktree"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

target="${usage_target}"

if [[ "$target" =~ ^[0-9]+$ ]]; then
  branch=$(git worktree list --porcelain \
    | awk '/^branch /{sub("refs/heads/", "", $2); print $2}' \
    | grep "^${target}-" | head -1 || true)
  if [[ -z "$branch" ]]; then
    echo "no worktree found for issue #${target}" >&2
    exit 1
  fi
else
  branch="$target"
fi

parent=$(dirname "$(git worktree list --porcelain | awk '/^worktree /{sub(/^worktree /, ""); print; exit}')")
dest="${parent}/${branch}"

git worktree remove "$dest"
echo "removed $dest"

if [[ "${usage_delete_branch:-}" == "true" ]]; then
  git branch -d "$branch" && echo "deleted branch $branch"
fi
'''

[tasks."wt:path"]
description = 'Print the path of a worktree — useful for: cd $(mise run wt:path 123)'
usage = '''
arg "<target>" help="Issue number (e.g. 123) or branch name (e.g. my-feature)"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

target="${usage_target}"

if [[ "$target" =~ ^[0-9]+$ ]]; then
  branch=$(git worktree list --porcelain \
    | awk '/^branch /{sub("refs/heads/", "", $2); print $2}' \
    | grep "^${target}-" | head -1 || true)
  if [[ -z "$branch" ]]; then
    echo "no worktree found for issue #${target}" >&2
    exit 1
  fi
else
  branch="$target"
fi

# Look up the registered worktree path directly — avoids guessing at the sibling
# layout and fails clearly if the branch has no worktree checked out.
path=$(git worktree list --porcelain | awk \
  -v b="refs/heads/${branch}" '
    /^worktree /{ wt=substr($0, 10) }
    $0 == "branch " b { print wt; exit }
  ')

if [[ -z "$path" ]]; then
  echo "no worktree found for branch ${branch}" >&2
  exit 1
fi

echo "$path"
'''
