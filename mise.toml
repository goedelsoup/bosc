# mise — dev toolchain for Project BOSC, configured as a monorepo.
#
# Two projects share one toolchain:
#   • backend (this root): the Python `bosc` package + corpus — tasks `mise run <task>`
#   • web (web/): the Astro site — tasks `mise run //web:<task>`
#
# A bare task name runs the project you're standing in: `mise run test` is the backend's
# pytest at the repo root and the web's vitest inside web/. Target a project
# explicitly from anywhere with the `//project:task` path (`mise run //web:test`).
#
#   mise install            # install pinned tools (python, uv, node, git-lfs)
#   mise run setup          # bootstrap BOTH projects (deps, Git LFS, Claude Code CLI)
#   mise run check          # backend gate (lint + format + markdown + types + tests)
#   mise run //web:check    # web gate (lint + types + tests + build + links)
#   mise run ci             # the whole-repo gate — both of the above
#   mise tasks --all        # list every task across both projects
#
# CI (.github/workflows/ci.yml) calls the underlying commands directly, not these tasks,
# so editing a task never changes CI. Not using mise? See Brewfile for the Homebrew fallback.

monorepo_root = true

[settings]
experimental = true   # required for the monorepo task paths (`//project:task`)

[monorepo]
config_roots = ["web"]   # subprojects with their own mise.toml

[tools]
aws = "latest"
python = "3.11"
uv = "latest"
node = "24"        # pinned LTS for the Astro web/ build (CI uses the same major)
# The single Node package manager for the whole repo (Epic #1549). Pinned to match the
# `packageManager` field in package.json — that field is what `pnpm/action-setup` reads in
# CI, so the two must agree. One pnpm store retires the npm version foot-guns (homebrew-vs-
# pinned biome, `npx` pulling a newer markdownlint).
"npm:pnpm" = "10.33.2"
git-lfs = "latest"
pulumi = "latest"  # deploy/ stack — `cd deploy && pulumi up` (see deploy/README.md)

[env]
_.file = ".env"
# Keep uv's managed virtualenv in-project so mise and uv agree on the interpreter.
UV_PROJECT_ENVIRONMENT = ".venv"

# === cross-cutting (both projects) ==========================================
[tasks.setup]
description = "Bootstrap both projects: Python + web deps, Git LFS, Claude Code CLI"
# `//web:install` (pnpm install) installs the ENTIRE workspace — root tooling
# (markdownlint-cli2) and the Astro site both — so there's no separate root Node install.
depends = ["//web:install"]
run = [
  "uv sync --extra dev",
  "git lfs install --local",
  "npm install -g @anthropic-ai/claude-code",   # a global CLI, not a workspace dep
]

[tasks.ci]
description = "The whole-repo gate — backend `check` + web `check` (mirrors the CI jobs)"
depends = ["check", "//web:check"]

[tasks.clean]
description = "Remove regenerable caches/outputs (connector cache, Astro cache, dist)"
run = "rm -rf data/cache web/node_modules/.astro web/dist"

# === backend (the Python `watermark` package) ====================================
[tasks.dev]
description = "Run the watermark CLI — pass args after `--`, e.g. `mise run dev -- export`"
run = "uv run watermark"

[tasks.check]
description = "Backend gate: ruff + format-check + Markdown lint + mypy + catalog gate + pytest"
run = [
  "uv run ruff check .",
  "uv run ruff format --check .",
  "pnpm exec markdownlint-cli2",   # repo-wide Markdown (config: .markdownlint-cli2.yaml)
  "uv run mypy",
  "uv run watermark catalog check",   # data-catalog gate: schema · missing · orphan · drift (#631)
  "uv run watermark sites check",     # sites-registry gate: YAML ↔ Python ↔ JSON in sync (#1027)
  "uv run pytest -n auto",   # pytest-xdist: parallelize across cores (override with `-n0` to debug)
]

[tasks.test]
description = "Backend tests only (pytest)"
run = "uv run pytest -n auto"

[tasks."test:v"]
description = "Backend tests, verbose (test names + full tracebacks)"
run = "uv run pytest -v --tb=long -m 'not network'"

# Rebuild `.test_durations`, the manifest CI's six-way pytest-split shards are balanced on.
# A whole serial pass, so it is slow by construction: `-n0` is required because durations
# have to be timed one at a time — under xdist every worker's wall clock overlaps.
# `--clean-durations` drops entries for tests that no longer exist. Covering one new module
# is far cheaper and needs no task: `uv run pytest -n0 --store-durations tests/test_new.py`
# merges that module's timings in. `tests/test_split_durations.py` gates the drift (#1772).
[tasks."test:durations"]
description = "Regenerate .test_durations (serial) — what CI's shard balancer reads"
run = "uv run pytest -n0 --store-durations --clean-durations"

[tasks.lint]
description = "Backend lint only (ruff check)"
run = "uv run ruff check ."

[tasks.types]
description = "Backend type-check only (mypy strict)"
run = "uv run mypy"

[tasks.fmt]
description = "Auto-fix the backend: ruff lint --fix + ruff format + Markdown"
run = [
  "uv run ruff check --fix .",
  "uv run ruff format .",
  "pnpm exec markdownlint-cli2 --fix",
]

[tasks.export]
description = "Regenerate the content bundle the web site reads (watermark export → data/site/bundle/)"
run = "uv run watermark export"

# === deploy secrets (#1539) ==================================================
# Thin passthroughs to deploy/rotate.sh so a rotation is discoverable from `mise tasks`
# rather than only from deploy/SECRETS.md. The runbook still governs the ORDERING (issue
# the new value upstream first, revoke the old one only after production verifies) — these
# wrap the mechanical half. `deploy:verify` needs no credentials for the live-endpoint tier,
# so it is the one to reach for when /api/ask or /api/submit is 500ing.
[tasks."deploy:rotate"]
description = "Rotate a Pages Function secret — set + pulumi up + verify (see deploy/SECRETS.md)"
# raw: connect stdin/stdout/stderr straight through instead of mise's line-buffered wrapper.
# rotate.sh branches on `[[ -t 0 ]]` — with stdin mediated it would see "not a terminal" on a
# real terminal and wait for EOF instead of prompting, and `pulumi up`'s own confirmation
# prompt would be unreachable. (Piped input works either way; verified.)
raw = true
usage = '''
arg "<key>" help="Pulumi config key, e.g. anthropicApiKey (`mise run deploy:rotate -- --help`)"
'''
run = './deploy/rotate.sh set "${usage_key}"'

[tasks."deploy:verify"]
description = "Post-deploy secret check: Pages project config + a live /api/ask + /api/submit probe"
run = "./deploy/rotate.sh verify"

[tasks."deploy:secrets"]
description = "List the deploy stack's rotatable secrets and how each one is set"
run = "./deploy/rotate.sh list"

# === yidam corpus mirror + reports (epic #1560) =============================
# TWO LAYERS, and the split between them is the whole design:
#
#   PROJECTION — Python, BOSC-specific. `watermark corpus-mirror` (and the tail of every
#   `watermark export`) projects the committed BOSC corpus into yidam node format under the
#   git-ignored .yidam/corpus/. Nothing upstream can own this: it knows about sites, leads,
#   hypotheses, and the [verified]/[inference]/[open] claim vocabulary. It stays pure Python,
#   so `watermark export` still runs offline with no Rust toolchain — the bundle feeds are
#   post-passes over the in-memory Mirror, never over a rendered report.
#
#   REPORTS — the real `yidam` binary. The four corpus reports (graph-check / lint /
#   corpus-index / open-questions) over that mirror are upstream's, NOT a Python replica's.
#   The wiring here RUNS the two that carry a verdict — graph-check gates, lint ratchets; the
#   other two are inventories, available on demand (`yidam corpus-index`, `yidam
#   open-questions`) and used by the conformance tests. BOSC re-implemented them when
#   obtaining the binary meant building the whole native ML stack; RFC-0003 retired that (the
#   default `reports` build pulls no protoc, no lancedb, no ONNX runtime) and RFC-0016 Phase 0
#   added `--format json`, so there is now a machine-readable verdict to consume rather than
#   prose to scrape. The pin is .yidam.toml; `mise run yidam-build` installs exactly it.
#
# Rust is deliberately NOT a repo-wide [tools] entry. It is scoped to `yidam-build`, so a
# Python/TypeScript checkout never installs a toolchain it does not use.

[tasks.corpus-mirror]
description = "Project the BOSC corpus into the yidam node mirror for the active site (.yidam/corpus)."
run = "uv run watermark corpus-mirror"

# The wiki cross-link audit (#1571): flag unresolved [[wiki links]] (the hard gate), orphan
# concepts, and under-linked concepts over the active site's glossary — the content-level pass
# the node-graph graph-check is blind to. CI runs the same command (the optional
# corpus-hygiene gate); `--suggest` adds link hints, `--no-check` reports without failing.
[tasks.wiki-lint]
description = "Audit the wiki [[link]] cross-reference graph for the active site (#1571)."
run = "uv run watermark wiki-lint"

# The corpus VECTOR index (#1564): embed the mirror nodes into a LanceDB index (.yidam/index/)
# with the same all-MiniLM-L6-v2 backend as the /ask embeddings, so the research agent can
# search the method-layer graph by meaning. Opt-in (downloads the ~80 MB model on first run);
# the MCP server rebuilds it lazily too, so this task is only for a warm, committed-free artifact.
[tasks.corpus-vector-index]
description = "Build the LanceDB vector index over the yidam corpus mirror (.yidam/index; #1564)."
run = "uv run watermark corpus-mirror --index"

# ── the yidam binary ────────────────────────────────────────────────────────
# Installed from the commit pinned in .yidam.toml, never vendored: a vendored copy is a fork
# that never gets rebuilt. Adapted from upstream's own `mise.yidam.toml` task, with the origin
# rewritten to https so it needs no deploy key and behaves identically in CI.
[tasks.yidam-build]
description = "Install the yidam CLI at the commit pinned in .yidam.toml (light `reports` build)."
tools = { rust = "1.88.0" }
run = '''
set -eu
if [ ! -f .yidam.toml ]; then
  echo "ERROR: no .yidam.toml — this repo has no recorded yidam provenance." >&2
  exit 1
fi
origin=$(sed -n 's/^ *origin *= *"\(.*\)"/\1/p' .yidam.toml)
commit=$(sed -n 's/^ *commit *= *"\(.*\)"/\1/p' .yidam.toml)
if [ -z "$commit" ] || [ "$commit" = "unknown" ]; then
  echo "ERROR: .yidam.toml records no resolvable commit (got \"${commit:-empty}\")." >&2
  echo "       Expected keys: origin / commit / template / committed." >&2
  exit 1
fi
if [ -z "$origin" ]; then
  echo "ERROR: .yidam.toml records no origin — nothing to clone from." >&2
  exit 1
fi
# https:// so no deploy key is needed; the origin repo is public.
origin=$(echo "$origin" | sed 's|^git@github.com:|https://github.com/|')
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
echo "cloning $origin at $commit …"
git clone --quiet --filter=blob:none --no-checkout "$origin" "$tmp/yidam"
git -C "$tmp/yidam" checkout --quiet "$commit"
# The light `reports` build (cargo default) PLUS `export-graph`, which is pure Rust
# (oxrdf/oxttl — no protoc, no C, no ML runtime) and is what makes `export --format rdf`
# available. That is not optional here: the RDF/GraphML conformance check compares BOSC's
# renderers against it, and without the feature the RDF half silently does not run.
# A full clean build with both is ~11s. `--features full` additionally pulls fastembed,
# lancedb and protoc — only needed for index-build / serve --mcp / sqlite.
# `--root .yidam/toolchain`, NOT the shared ~/.cargo/bin. Every `cargo install` of yidam on a
# machine writes that one path whatever ref and feature set it was built from, so a yidam
# checkout doing its own `cargo install --path .` (default features) silently replaces this
# repo's build — observed six times in one session, twice downgrading a binary this repo's
# conformance gate then SKIPPED against. A repo-local install cannot be clobbered by another
# repo, and `.yidam/` is already git-ignored.
cargo install --path "$tmp/yidam/yidam/cli" --locked --features export-graph \
  --root "$PWD/.yidam/toolchain"
echo
# `yidam` has no --version flag; graph-check's envelope is where the build identifies itself.
# Probe the binary just installed by its full path, NOT bare `yidam`: the repo-local root is
# deliberately not on PATH, so a bare name resolves to whatever the shared cargo bin holds —
# which is how this line reported a commit the build had nothing to do with.
bin="$PWD/.yidam/toolchain/bin/yidam"
echo "installed $("$bin" graph-check --format json 2>/dev/null \
  | sed -n 's/.*"commit": "\([^"]*\)".*/\1/p' | head -n1) -> $bin"
'''

# How far the pin has drifted. A REPORT, never a gate — this repo is entitled to stay pinned,
# and a build that goes red because upstream moved is a build somebody switches off. Upstream
# ships the same idea in its derived-repo CI; the vendored-prelude and commit-vocabulary
# sections of theirs are omitted here because BOSC vendors no prelude and writes conventional
# commits, not the yidam closed vocabulary.
[tasks.yidam-vendor-status]
description = "Report how far the pinned yidam commit has drifted behind origin (report, never a gate)."
run = '''
set -eu
origin=$(sed -n 's/^ *origin *= *"\(.*\)"/\1/p' .yidam.toml)
commit=$(sed -n 's/^ *commit *= *"\(.*\)"/\1/p' .yidam.toml)
committed=$(sed -n 's/^ *committed *= *"\(.*\)"/\1/p' .yidam.toml)
if [ -z "$origin" ] || [ -z "$commit" ]; then
  echo "ERROR: .yidam.toml records no origin/commit — cannot compare." >&2
  exit 1
fi
origin=$(echo "$origin" | sed 's|^git@github.com:|https://github.com/|')
echo "origin    $origin"
echo "pinned    $commit (committed $committed)"
# `head -n1`: `git ls-remote <url> HEAD` can match more than one ref, and every extra line
# would make the equality test below unsatisfiable.
remote=$(git ls-remote "$origin" HEAD 2>/dev/null | cut -f1 | head -n1)
if [ -z "$remote" ]; then
  echo "remote    unreachable — cannot compare"
  exit 0
fi
echo "origin    $remote (HEAD)"
if [ "$remote" = "$commit" ]; then
  echo
  echo "up to date"
  exit 0
fi
# Only clone on the branch where the answer is not already known: the ls-remote above
# settles the common case for free.
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
if ! git clone --quiet --filter=blob:none --no-checkout "$origin" "$tmp/y" 2>/dev/null; then
  echo "(could not fetch $origin for detail)"
  exit 0
fi
behind=$(git -C "$tmp/y" rev-list --count "$commit..origin/HEAD" 2>/dev/null || echo 0)
pinned_at=$(git -C "$tmp/y" log -1 --format=%at "$commit" 2>/dev/null || echo "")
echo
if [ -n "$pinned_at" ]; then
  days=$(( ( $(date +%s) - pinned_at ) / 86400 ))
  echo "behind    $behind commit(s), pinned $days day(s) ago"
else
  echo "behind    $behind commit(s)"
fi
echo
echo "to adopt: re-pin .yidam.toml [yidam].commit, then \`mise run yidam-build\`"
echo "          and re-run \`mise run yidam-reports\` — check ids and severities move."
'''

# The frozen MCP tool contract (RFC-0005) that `watermark.agent.yidam_tools` implements, and
# the conformance cases the test suite runs. Vendored rather than read from a yidam checkout,
# because BOSC has no yidam tree — only the built binary. Refresh with this task when re-pinning;
# CI proves the copy matches the pin, so a stale one cannot sit unnoticed.
[tasks.yidam-contract-sync]
description = "Re-vendor the MCP tool contract + conformance cases from the pinned yidam."
run = '''
set -eu
origin=$(sed -n 's/^ *origin *= *"\(.*\)"/\1/p' .yidam.toml)
commit=$(sed -n 's/^ *commit *= *"\(.*\)"/\1/p' .yidam.toml)
if [ -z "$origin" ] || [ -z "$commit" ]; then
  echo "ERROR: .yidam.toml records no origin/commit." >&2
  exit 1
fi
origin=$(echo "$origin" | sed 's|^git@github.com:|https://github.com/|')
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
git clone --quiet --filter=blob:none --no-checkout "$origin" "$tmp/y"
git -C "$tmp/y" checkout --quiet "$commit" -- yidam/prelude/sdks/parity/mcp
src="$tmp/y/yidam/prelude/sdks/parity/mcp"
cp "$src/tools.json" src/watermark/agent/mcp_contract.json
cp "$src/VERSION" tests/fixtures/yidam-mcp/VERSION
rm -rf tests/fixtures/yidam-mcp/cases
cp -R "$src/cases" tests/fixtures/yidam-mcp/cases
echo "re-vendored the MCP contract at $commit — review the diff, then run the conformance tests"
'''

# The four corpus reports, from the binary. `graph-check` is the hard gate (nonzero on any
# issue); `lint` gates against the .yidam/lint-baseline.yml ratchet rather than against zero,
# so inherited debt is enumerable and only a REGRESSION fails.
[tasks.yidam-reports]
description = "Run the yidam corpus reports over the mirror (graph-check + lint). Needs `mise run yidam-build`."
depends = ["corpus-mirror"]
run = '''
set -eu
if ! command -v yidam >/dev/null 2>&1; then
  echo "yidam is not on PATH — run \`mise run yidam-build\` first." >&2
  exit 127
fi
yidam graph-check
yidam lint
'''

[tasks.onboard-site]
description = "Bootstrap a site's connector data — the catalog DAG in dependency order (#1025)"
usage = '''
arg "<site>" help="Target site slug"
'''
# The catalog's `onboard-bundle` aggregate resolves the run order (the executable half of
# docs/onboarding.md). --dry-run previews the plan; drop it (run the printed command by
# hand) for a live run. The agent-driven research pass stays `onboard-research`.
run = '''
uv run watermark catalog run onboard-bundle --site "${usage_site}" --dry-run
'''

[tasks.onboard-research]
description = "Agent-driven site research pass (the old onboard-site recipe)"
usage = '''
arg "<site>" help="Target site slug"
'''
run = '''
uv run watermark --site "${usage_site}" research run --recipe site-onboard
'''

[tasks.oepa-permit]
description = "Fetch, ingest, and extract one OEPA/DAM permit end-to-end"
usage = '''
arg "<permit_id>" help="NPDES permit ID, e.g. 2PD00006"
arg "<site>" help="Site slug, e.g. van-wert"
arg "[kind]" help="Document kind for extract (default: npdes)" default="npdes"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
permit_id="${usage_permit_id}"
site="${usage_site}"
kind="${usage_kind:-npdes}"

uv run watermark --site "${site}" oepa fetch --permit-id "${permit_id}"
uv run watermark ingest

# Resolve the file the fetch actually wrote, then hash it. Do NOT assume `<permit_id>.pdf`:
# Ohio EPA re-serves a permit's DAM slot IN PLACE on modification, so a second fetch of the same
# URL collides and lands as `<permit_id>.<sha8>.pdf` (#1406). Assuming the bare name would
# re-extract the SUPERSEDED document and silently report it as the current one. The filename-map
# is the record of what landed; take the newest row for this permit's `permits/doc/` slot.
# _doc_id mirrors watermark.pipeline.ingest._doc_id: sha256(str(absolute_path))[:8]
doc_id=$(uv run python -c "
import hashlib, yaml
from watermark.config import get_settings
d = get_settings().documents_dir / 'oepa' / '${site}'
slot = 'permits/doc/${permit_id}.pdf'
rows = (yaml.safe_load((d / 'filename-map.yaml').read_text()) or {}).get('documents', [])
rows = [r for r in rows if str(r.get('source_url', '')).endswith(slot)]
name = max(rows, key=lambda r: r.get('fetched_at') or '')['filename'] if rows else '${permit_id}.pdf'
p = d / name
print(p.stem + '-' + hashlib.sha256(str(p).encode()).hexdigest()[:8])
")

uv run watermark --site "${site}" extract "${doc_id}" --kind "${kind}" --write

# Keep _observed.yaml in sync so catalog check passes without a manual reconcile step.
uv run watermark catalog reconcile
uv run watermark catalog audit --apply
'''

# === worktrees (git worktree + GitHub issue integration) ========================
#
#   mise run wt:new 123          # branch from issue #123 → ../123-short-title/
#   mise run wt:new my-feature   # plain branch name
#   mise run wt:list             # all worktrees
#   mise run wt:rm 123           # remove by issue number
#   mise run wt:rm my-feature    # remove by branch name
#   cd "$(mise run wt:path 123)"   # jump into a worktree
#
# Worktrees live as siblings of `main` inside the watermark-directory/ parent.
# Issue branches are named <number>-<slug> so they round-trip by issue number.

[tasks."wt:new"]
description = "Create a sibling worktree — accepts a GitHub issue number or branch name"
usage = '''
arg "<target>" help="Issue number (e.g. 123) or branch name (e.g. my-feature)"
flag "--base <base>" help="Base branch or ref to branch from (default: main)"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

target="${usage_target}"
base="${usage_base:-main}"

if [[ "$target" =~ ^[0-9]+$ ]]; then
  # Reuse any local branch already created for this issue number so a title
  # change doesn't silently spawn a second branch for the same issue.
  branch=$(git branch --format='%(refname:short)' \
    | grep "^${target}-" | head -1 || true)
  if [[ -z "$branch" ]]; then
    title=$(gh issue view "$target" --json title --jq '.title')
    slug=$(printf '%s' "$title" \
      | tr '[:upper:]' '[:lower:]' \
      | sed 's/[^a-z0-9]/-/g; s/-\+/-/g; s/^-//; s/-$//' \
      | cut -c1-50)
    branch="${target}-${slug}"
  fi
else
  branch="$target"
fi

parent=$(dirname "$(git worktree list --porcelain | awk '/^worktree /{sub(/^worktree /, ""); print; exit}')")
dest="${parent}/${branch}"

if [[ -d "$dest" ]]; then
  echo "worktree already exists at $dest" >&2
  exit 1
fi

if git show-ref --quiet "refs/heads/${branch}"; then
  git worktree add "$dest" "$branch"
elif git show-ref --quiet "refs/remotes/origin/${branch}"; then
  git worktree add --track -b "$branch" "$dest" "origin/${branch}"
else
  git worktree add -b "$branch" "$dest" "$base"
fi

echo "$dest"
'''

[tasks."wt:list"]
description = "List all git worktrees"
run = "git worktree list"

[tasks."wt:rm"]
description = "Remove a sibling worktree — accepts a GitHub issue number or branch name"
usage = '''
arg "<target>" help="Issue number (e.g. 123) or branch name (e.g. my-feature)"
flag "--delete-branch" help="Also delete the local branch after removing the worktree"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

target="${usage_target}"

if [[ "$target" =~ ^[0-9]+$ ]]; then
  branch=$(git worktree list --porcelain \
    | awk '/^branch /{sub("refs/heads/", "", $2); print $2}' \
    | grep "^${target}-" | head -1 || true)
  if [[ -z "$branch" ]]; then
    echo "no worktree found for issue #${target}" >&2
    exit 1
  fi
else
  branch="$target"
fi

parent=$(dirname "$(git worktree list --porcelain | awk '/^worktree /{sub(/^worktree /, ""); print; exit}')")
dest="${parent}/${branch}"

git worktree remove "$dest"
echo "removed $dest"

if [[ "${usage_delete_branch:-}" == "true" ]]; then
  git branch -d "$branch" && echo "deleted branch $branch"
fi
'''

[tasks."wt:path"]
description = 'Print the path of a worktree — useful for: cd $(mise run wt:path 123)'
usage = '''
arg "<target>" help="Issue number (e.g. 123) or branch name (e.g. my-feature)"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

target="${usage_target}"

if [[ "$target" =~ ^[0-9]+$ ]]; then
  branch=$(git worktree list --porcelain \
    | awk '/^branch /{sub("refs/heads/", "", $2); print $2}' \
    | grep "^${target}-" | head -1 || true)
  if [[ -z "$branch" ]]; then
    echo "no worktree found for issue #${target}" >&2
    exit 1
  fi
else
  branch="$target"
fi

# Look up the registered worktree path directly — avoids guessing at the sibling
# layout and fails clearly if the branch has no worktree checked out.
path=$(git worktree list --porcelain | awk \
  -v b="refs/heads/${branch}" '
    /^worktree /{ wt=substr($0, 10) }
    $0 == "branch " b { print wt; exit }
  ')

if [[ -z "$path" ]]; then
  echo "no worktree found for branch ${branch}" >&2
  exit 1
fi

echo "$path"
'''
