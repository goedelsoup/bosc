# Feature kill switches — committed here; apply with `pulumi up`.
# Flipping a toggle requires a git commit + pulumi up, not a dashboard click.
# That's intentional: changes are git-auditable and apply to exactly one environment.
#
# rum controls both RUM_ENABLED (edge beacon endpoint) and PUBLIC_RUM_ENABLED
# (Astro build-time script injection) — both gates must be on for events to flow.
#
# auth is independent of all other features; it can be provisioned before or after
# the domain is set (authEnabled in Pulumi.prod.yaml gates Cognito provisioning).
#
# stories controls both STORIES_ENABLED (the /api/stories Functions kill switch) and
# PUBLIC_STORIES_ENABLED (the Astro build-time UI gate), mirroring rum. Flipping it true
# also provisions the STORIES_HYPERDRIVE config over Lakebase, which requires the
# bosc-deploy:storiesLakebaseUrl secret (the guard in index.ts enforces this).
#
# contacts controls both CONTACTS_ENABLED (the interactive site-contacts Functions kill switch —
# /api/petition/connect, /api/bulletin, /api/admin/contacts) and PUBLIC_CONTACTS_ENABLED (the Astro
# build-time UI gate), mirroring stories. It REUSES the stories Lakebase/Hyperdrive (one database),
# so flipping it true also needs the bosc-deploy:storiesLakebaseUrl secret; the Hyperdrive config is
# provisioned when EITHER stories OR contacts is on (the guard in index.ts enforces this).

preLaunch: false    # serve pre-launch.astro at / and redirect all other routes to /
submissions: true
ask: true
docs: true
mcp: true
rum: true
auth: true
stories: false
contacts: false
