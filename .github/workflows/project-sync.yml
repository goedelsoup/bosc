name: project-sync

# Keeps the "BOSC Network" org Project (watermark-directory/projects/1) in sync with
# the site:* / area:network issues, and re-mirrors the Readiness field from data/sites.yaml.
#
# Requires an org secret PROJECT_TOKEN — a PAT (classic: `project` + `repo` scopes, or a
# fine-grained token with org Projects: read/write + repo Issues: read). The default
# GITHUB_TOKEN cannot write organization-level Projects.

on:
  issues:
    types: [opened, reopened, labeled, unlabeled, edited]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"  # daily readiness resync from data/sites.yaml

# Read-only against the repo: this job only *reads* issues/labels. Every Project write goes
# through PROJECT_TOKEN (GITHUB_TOKEN cannot write org Projects), so no write scope is granted.
permissions:
  contents: read
  issues: read

concurrency:
  group: project-sync-${{ github.event.issue.number || 'all' }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync BOSC Network project
    runs-on: ubuntu-latest
    steps:
      # Third-party actions pinned to immutable commit SHAs (supply-chain hardening).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.2.2
        with:
          persist-credentials: false  # don't leave GITHUB_TOKEN in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install deps
        run: python -m pip install --quiet pyyaml
      - name: Sync project
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -n "$ISSUE_NUMBER" ]; then
            python scripts/project_sync.py --issue "$ISSUE_NUMBER"
          else
            python scripts/project_sync.py --all
          fi
