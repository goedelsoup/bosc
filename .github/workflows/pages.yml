# Build & deploy the Watermark Directory site to Cloudflare Pages — MANUAL ONLY.
#
# Phase 1 of the host migration (Epic #56): the redesigned Astro site (web/) and
# its Pages Functions (web/functions/ — the submissions endpoint, #74) deploy
# together to Cloudflare Pages, one origin for static assets + serverless. This
# supersedes the never-flipped GitHub Pages deploy. (The legacy Python SSG was retired at
# the parity cutover; this Astro frontend is now the only site.)
#
# Still MANUAL and build-only by default: `workflow_dispatch` with a `deploy` toggle
# that defaults to false, so a run only *builds* unless you tick the box. Recommended
# first run: build-only, then a browser visual pass on the deck.gl maps (WebGL isn't
# covered by `astro check`) before deploying.
#
# Cloudflare's own Git build is NOT used — the content bundle is produced by the
# watermarkBundle Vite plugin (shells out to `uv run watermark --site <slug> export`)
# inside `pnpm run build`, so the build runs here and Wrangler does a direct upload.
# Pages config lives in `web/wrangler.toml`.
#
# One-time setup before the first deploy (see docs/submissions-api.md):
#   - Create the Cloudflare Pages project `the-watermark-directory` (production branch: main).
#   - Repo secrets: CLOUDFLARE_API_TOKEN (token with "Cloudflare Pages: Edit") and
#     CLOUDFLARE_ACCOUNT_ID.
#   - Repo var PUBLIC_TURNSTILE_SITE_KEY (public; from `pulumi stack output
#     turnstileSiteKey`) — flips the /submit form from disabled-placeholder to live.
#   - Optional repo vars PUBLIC_STRIPE_LINK_{FOLLOWER,CONTRIBUTOR,SUSTAINER,ONETIME}
#     (public Stripe Payment Link URLs, #969) — setting the three monthly-tier vars flips
#     the Donate section of /about/contributing live; ONETIME gates the one-time strip.
#   - Optional repo vars PAGES_SITE_URL / PAGES_BASE_PATH for the custom subdomain (the
#     Pulumi-managed Route53 CNAME → the-watermark-directory.pages.dev); defaults target
#     the-watermark-directory.pages.dev at the root (no base path).

name: Pages (manual)

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Cloudflare Pages after building (else build-only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # *.pages.dev serves at the domain root, so no base path (handled via withBase()).
    # For a custom domain, set the PAGES_SITE_URL / PAGES_BASE_PATH repo variables — no
    # code change needed.
    env:
      SITE_URL: ${{ vars.PAGES_SITE_URL || 'https://the-watermark-directory.pages.dev' }}
      BASE_PATH: ${{ vars.PAGES_BASE_PATH || '' }}
      # The Turnstile site key is read at *build* time (import.meta.env in submit.astro),
      # so it must be present here, not just as a Function secret. It's public (a repo
      # variable, from `pulumi stack output turnstileSiteKey`); until it's set the form
      # renders its disabled placeholder. Setting it flips the form live.
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      # Stripe Payment Link URLs for the Donate section of /about/contributing (#969). Read
      # at *build* time (import.meta.env in @watermark/core's donate.ts), so they must be present here.
      # Public (a payment link is not a secret) — repo variables. Until the three monthly-tier
      # links are set the Donate section stays hidden; setting them flips it live (the
      # one-time strip gates separately on PUBLIC_STRIPE_LINK_ONETIME).
      PUBLIC_STRIPE_LINK_FOLLOWER: ${{ vars.PUBLIC_STRIPE_LINK_FOLLOWER }}
      PUBLIC_STRIPE_LINK_CONTRIBUTOR: ${{ vars.PUBLIC_STRIPE_LINK_CONTRIBUTOR }}
      PUBLIC_STRIPE_LINK_SUSTAINER: ${{ vars.PUBLIC_STRIPE_LINK_SUSTAINER }}
      PUBLIC_STRIPE_LINK_ONETIME: ${{ vars.PUBLIC_STRIPE_LINK_ONETIME }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
        # No LFS (intentional — don't add `lfs: true`): the site builds from the JSON
        # bundle emitted by the watermarkBundle Vite plugin (`uv run watermark --site
        # <slug> export`) and never serves source bytes, so the ~5.4 GB corpus isn't
        # pulled. Document `available`/`size_bytes` are read from the Git-LFS *pointer*
        # text (bytes are served from R2, not the build tree) — see
        # watermark.site.documents._document_stat (#1347). Pulling LFS here would cost
        # ~1.5 GB of bandwidth per deploy for no benefit.

      # 1. Python toolchain: the watermarkBundle Vite plugin shells out to
      #    `uv run watermark --site <slug> export` inside `pnpm run build`.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync

      # 2. Build the Astro site (plugin runs export for each site first).
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Install the whole workspace from the root (single lockfile); the build step still
      # runs in web/ so the watermarkBundle plugin's export + astro build resolve there.
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the site (-> web/dist)
        working-directory: web
        run: pnpm run build

      # Hand the built assets to the deploy job (Functions come from source at checkout).
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: web/dist
          retention-days: 1

  deploy:
    # Only deploys when you tick the "deploy" input; otherwise the run is build-only.
    if: ${{ inputs.deploy }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      # Source restores web/functions/ + web/wrangler.toml; the artifact
      # restores the built web/dist/. Wrangler then uploads dist + compiles
      # functions/ (per wrangler.toml `pages_build_output_dir`).
      - uses: actions/checkout@v4
      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: web/dist
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy --branch=main
