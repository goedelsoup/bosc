name: CI

on:
  push:
    # `epic/*` integration branches run CI on push too, so the accumulated state is
    # checked as sub-PRs merge in — not just at the final epic -> main PR. PRs into any
    # base already run via the unfiltered `pull_request` trigger below.
    branches: [main, 'epic/*']
  pull_request:

# Path filtering is done at the JOB level (the `changes` gate below), NOT with a
# trigger-level `paths:` filter — deliberately. The `check` job is a REQUIRED
# status check on `main` (see .github/config/index.ts `requiredChecks`). A
# trigger-level `paths:` filter would skip the whole workflow on, say, a
# frontend-only PR, leaving that required check stuck "pending" and blocking the
# PR forever. A job skipped by an `if:` condition instead reports as success, so
# the gate is satisfied. Net effect: the backend / `frontend` / `markdown` work is
# skipped when its tree is untouched, and required-check semantics still hold.
# `check` and `markdown` are the required checks (see .github/config/index.ts
# `requiredChecks`).
#
# The backend `check` is split into three PARALLEL legs — `lint`, `types`, `test` —
# rolled up by a thin `check` aggregator (#682). Wall-clock is the slowest leg, not the
# sum, and a fast formatting nit no longer waits behind pytest. `check` keeps its name
# and required-status semantics: it `needs:` the three legs, runs with `if: always()` so
# it always reports a status (never stuck pending), and passes only when each leg
# succeeded or was skipped (backend untouched ⇒ all three skip ⇒ `check` is green).
#
# Data-only commits (#861): `data/**` is split from `src/**` so permit ingest /
# catalog-entry PRs skip lint + types + test (irrelevant gates) and run only
# `catalog`.  `code` = Python source; `data` = corpus / catalog; both together
# constitute the old `backend` union.

jobs:
  # Detect which part of the repo a push/PR touched. Uses tj-actions/changed-files
  # (#861) to distinguish pure-data from code changes so lint/types/test are skipped
  # on permit-ingest and catalog PRs.
  # NOTE: in tj-actions/changed-files v40+, files_yaml groups output booleans as
  # `<group>_any_changed`, NOT `<group>` (which returns the file list). The job
  # outputs must use `_any_changed` so the downstream `== 'true'` checks work.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code_any_changed }}
      data: ${{ steps.filter.outputs.data_any_changed }}
      frontend: ${{ steps.filter.outputs.frontend_any_changed }}
      markdown: ${{ steps.filter.outputs.markdown_any_changed }}
      corpus: ${{ steps.filter.outputs.corpus_any_changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: tj-actions/changed-files@v47.0.6
        id: filter
        with:
          files_yaml: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.test_durations'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
            data:
              - 'data/**'
            frontend:
              - 'web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
            # The yidam corpus gate. `data/**` and the projection feed the mirror;
            # `docs/**` + `**/*.md` matter because `broken-prose-link` walks repo prose, not
            # just the corpus; `.yidam.toml` changes which binary runs; the baseline is the
            # ratchet the gate compares against.
            corpus:
              - 'data/**'
              - 'docs/**'
              - '**/*.md'
              # The whole backend, not the two obvious modules: the projection reads the
              # corpus loaders, entity graph, leads, concepts, people and hypotheses, so a
              # change to any of them moves the mirror. Naming a short list is how a gate
              # comes to be skipped by exactly the change that needed it. ~55s cached.
              - 'src/watermark/**'
              - '.yidam.toml'
              - '.yidam/lint-baseline.yml'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
            markdown:
              - '**/*.md'
              - '.markdownlint-cli2.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.github/workflows/ci.yml'

  # --- Backend legs (#682) -------------------------------------------------------------
  # Three parallel legs, each gated on the backend filter, rolled up by `check` below.
  # Lint/types need no git history, so they take the default shallow checkout; only the
  # `test` leg fetches history (for the producer-drift merge-base). Each leg carries only
  # the incremental tool cache it uses (ruff / mypy / pytest), keyed per-leg so they don't
  # clobber each other. github.sha in the key saves a fresh cache each run; restore-keys
  # fall back to the most recent prior one. Cache dirs are set in pyproject.toml.
  lint:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - name: Cache ruff
        uses: actions/cache@v4
        with:
          path: .cache/ruff
          key: ruffcache-${{ runner.os }}-py311-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            ruffcache-${{ runner.os }}-py311-${{ hashFiles('uv.lock') }}-
            ruffcache-${{ runner.os }}-py311-
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .

  types:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      # mypy is the big cache win — on a warm cache it only re-checks changed files.
      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: .cache/mypy
          key: mypycache-${{ runner.os }}-py311-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            mypycache-${{ runner.os }}-py311-${{ hashFiles('uv.lock') }}-
            mypycache-${{ runner.os }}-py311-
      - name: Type check
        run: uv run mypy

  # The two data-catalog gates (#631) run ONCE, in their own job — not duplicated per
  # test shard. The producer-drift gate is the only leg that needs the full commit graph
  # (to merge-base against origin/main), so this is the one job paying for fetch-depth: 0.
  catalog:
    needs: changes
    if: ${{ needs.changes.outputs.data == 'true' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives the full commit graph the producer-drift gate needs to
      # merge-base against origin/main; filter: blob:none makes it a blobless partial
      # clone, so the LFS-history repo doesn't pull historical file blobs — `.git/lfs` holds
      # 4,638 MiB against 3,586 MiB at HEAD, the difference being objects only history names — the
      # missing blobs are fetched lazily only if a diff actually needs them (#682).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-python-env
      # Data-catalog gate (#631): schema · missing · orphan · checksum drift. Hermetic and
      # LFS-aware — the runner checks out without LFS bytes, so unmaterialized pointers are
      # an informational note, never a failure.
      - name: Catalog check
        run: uv run watermark catalog check
      # Sites-registry gate (#1027): YAML identity ↔ Python SITES ↔ sites-registry.json in sync.
      # Vault-manifest gate (#2148): the check that REPLACES Git-LFS's implicit guarantee that a
      # tracked file is a real, hashed object. It reads two witnesses — `git lfs ls-files` and the
      # filesystem — because the first goes silent at #2147 and an LFS-only inventory would not
      # degrade there, it would INVERT: `tracked - recorded` becomes empty and the gate reports a
      # clean corpus for the same reason it reports one when everything is fine. Needs no LFS
      # bytes: an unresolved pointer carries the oid, which IS the content's sha256.
      - name: Vault manifest check
        run: uv run watermark documents manifest --check

      - name: Sites registry check
        run: uv run watermark sites check
      # Wiki cross-link gate (#1571, area:corpus-hygiene): fail on any unresolved [[wiki link]]
      # in the reference glossary — a broken link ships as a visible dead span. Advisory orphan /
      # under-linked findings never fail. Peer-site cleanliness is enforced by the pytest suite.
      - name: Wiki cross-link lint
        run: uv run watermark wiki-lint
      # Producer→entry drift gate (#629): a changed connector without its catalog entry fails.
      # Resolves origin/main from the full-history checkout; skips cleanly if it can't, so it
      # never false-fails. Bypass with a `[catalog-waiver: <reason>]` commit token.
      - name: Catalog producer-drift gate
        run: |
          git fetch --no-tags --quiet origin main || true
          uv run watermark catalog producer-check --base origin/main

  # Pytest, sharded across runners. pytest-split partitions the suite into `total-splits`
  # duration-balanced groups (from the committed .test_durations); each shard ALSO runs
  # -n auto for intra-runner core parallelism. A shallow checkout is enough — the suite is
  # hermetic over committed fixtures + data/extracted (no LFS bytes, no full history).
  # Regenerate .test_durations with `mise run test:durations` when it drifts. A test with no
  # recorded duration is priced at the average of the recorded ones, so a stale manifest does
  # not degrade gracefully — it inverts (#1772: the *cheapest*-looking shard ran 5.3x the
  # fastest, and `check` waits on the slowest). tests/test_split_durations.py gates that.
  test:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - name: Cache pytest
        uses: actions/cache@v4
        with:
          path: .cache/pytest
          key: pytestcache-${{ runner.os }}-py311-${{ hashFiles('uv.lock') }}-g${{ matrix.group }}-${{ github.sha }}
          restore-keys: |
            pytestcache-${{ runner.os }}-py311-${{ hashFiles('uv.lock') }}-g${{ matrix.group }}-
            pytestcache-${{ runner.os }}-py311-${{ hashFiles('uv.lock') }}-
      - name: Test (shard ${{ matrix.group }}/6)
        run: uv run pytest -n auto --splits 6 --group ${{ matrix.group }}

  # --- the yidam corpus gate ------------------------------------------------------------
  #
  # The four corpus reports come from the REAL `yidam` binary, not from a Python replica
  # (retired — see watermark/site/yidam_cli.py). This is the job that makes that true: locally
  # the binary is optional and `watermark corpus-mirror` degrades to projecting only, so
  # without this the reports would run nowhere.
  #
  # Cheap on purpose. The default build pulls no protoc, no lancedb and no ML runtime, so it
  # compiles in about a minute; keyed on the pin AND the feature set, the cache makes it
  # near-free after the first run on a given pin.
  corpus:
    needs: changes
    if: ${{ needs.changes.outputs.corpus == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env

      - name: Read the pinned yidam commit
        id: pin
        run: |
          commit=$(sed -n 's/^ *commit *= *"\(.*\)"/\1/p' .yidam.toml)
          origin=$(sed -n 's/^ *origin *= *"\(.*\)"/\1/p' .yidam.toml)
          if [ -z "$commit" ] || [ "$commit" = "unknown" ]; then
            echo "::error::.yidam.toml records no resolvable commit (got '${commit:-empty}')."
            echo "::error::Expected keys: origin / commit / template / committed."
            exit 1
          fi
          # https:// so CI needs no deploy key; the origin repo is public.
          origin=$(echo "$origin" | sed 's|^git@github.com:|https://github.com/|')
          # `[build] features` — read here rather than written into the install step below, so
          # the pin file is the one place the feature set is stated. Same `sed` upstream and
          # `mise run yidam-build` use, so all three agree about what the pin says.
          feat=$(sed -n 's/^ *features *= *\[\(.*\)\]/\1/p' .yidam.toml \
                 | tr -d '"' | tr -d ' ' | tr '\n' ',' | sed 's/,$//')
          # `.yidam.toml` is repository content, and `pull_request` runs this job with the
          # SUBMITTED revision of it. Whatever comes out of that `sed` reaches a `cargo`
          # command line, so its SHAPE is checked here rather than trusted: cargo feature
          # names are `[a-z0-9-]`, and anything else — `$(…)`, a backtick, a semicolon — is a
          # value nobody meant to pin and the job refuses rather than passes on. The step
          # below also takes it through `env` instead of interpolating it into the shell, so
          # even a value that passed here is never expanded as source.
          # `[ -n "$feat" ] &&` first: a repo that declares no `[build] features` is legal and
          # yields an empty string, which `grep` refuses for having no lines to match rather
          # than for failing the pattern.
          if [ -n "$feat" ] && ! printf '%s\n' "$feat" \
             | grep -Eq '^[a-z0-9][a-z0-9-]*(,[a-z0-9][a-z0-9-]*)*$'; then
            echo "::error::.yidam.toml [build] features is not a plain feature list: '$feat'"
            exit 1
          fi
          {
            echo "source=$origin"
            echo "commit=$commit"
            echo "features=$feat"
          } >> "$GITHUB_OUTPUT"

      # Keyed on the pin, so re-pinning is the only thing that pays for a rebuild.
      - name: Cache the yidam binary
        id: yidam-cache
        uses: actions/cache@v4
        with:
          path: .yidam/bin/yidam
          # The feature set is part of the identity, and it is INTERPOLATED rather than
          # spelled: a cached binary without `export-graph` cannot answer
          # `export --format rdf`, and the conformance step would skip rather than fail —
          # which is the failure a conformance check must not have. A hand-written label
          # would go stale against `.yidam.toml [build] features` and still look right.
          key: yidam-${{ runner.os }}-${{ steps.pin.outputs.features }}-${{ steps.pin.outputs.commit }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.yidam-cache.outputs.cache-hit != 'true'

      # Always, cache hit or miss: the contract check and the staleness report both read this
      # tree, and on a cache hit the install step below does not run. Cheap — blobless clone.
      - name: Fetch the pinned yidam source
        run: |
          git clone --filter=blob:none --no-checkout "${{ steps.pin.outputs.source }}" /tmp/yidam
          git -C /tmp/yidam checkout --quiet "${{ steps.pin.outputs.commit }}"

      - name: Install the yidam CLI (the default set + [build] features)
        if: steps.yidam-cache.outputs.cache-hit != 'true'
        env:
          # Through `env`, never interpolated into the `run:` body. A `${{ }}` expression is
          # substituted into the shell SOURCE before bash parses it, so a crafted value would
          # execute; a variable is only ever data. GitHub's own guidance, and the reason the
          # shape check above is a second line of defence rather than the only one.
          YIDAM_FEATURES: ${{ steps.pin.outputs.features }}
        run: |
          cargo install --path /tmp/yidam/yidam/cli --locked \
            --features "$YIDAM_FEATURES" \
            --root "$PWD/.yidam"
          .yidam/bin/yidam --version

      # Project the corpus, then let the binary report on it. `--no-check` here because the
      # reports are run explicitly below, where their output is annotated.
      - name: Project the corpus mirror
        run: uv run watermark corpus-mirror --no-check

      # The MCP contract is vendored (BOSC has no yidam tree, only the binary), so it can go
      # stale silently. This is the only place both copies exist at once — the pin is already
      # cloned here for the build, so proving they match costs one diff.
      - name: The vendored MCP contract matches the pin
        run: |
          set -eu
          src=/tmp/yidam/yidam/prelude/sdks/parity/mcp
          if ! diff -u "$src/tools.json" src/watermark/agent/mcp_contract.json; then
            echo "::error::src/watermark/agent/mcp_contract.json is not the contract at the pin."
            echo "::error::Run 'mise run yidam-contract-sync' and review the diff."
            exit 1
          fi
          if ! diff -ru "$src/cases" tests/fixtures/yidam-mcp/cases; then
            echo "::error::the vendored conformance cases are not the ones at the pin."
            echo "::error::Run 'mise run yidam-contract-sync'."
            exit 1
          fi
          # The closed commit vocabulary `check_subject` serves. Vendored for the same reason
          # and checked the same way — it is derived from the pinned tree's certified lists, so
          # a verb added upstream must not sit unnoticed in a tool that claims to carry the
          # closed list. Compared by CONTENT, not by file: the vendored form is JSON and the
          # source is a Python module, so a byte diff would be comparing two shapes.
          python3 - <<'PYEOF'
          import ast, json, sys

          src = "/tmp/yidam/yidam/prelude/sdks/python/yidam_core/git.py"
          tree = ast.parse(open(src, encoding="utf-8").read())
          lists = {}
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign):
                  for t in node.targets:
                      if isinstance(t, ast.Name) and t.id in {
                          "EPISTEMIC_VERBS",
                          "OPERATIONAL_VERBS",
                      }:
                          lists[t.id] = {ast.literal_eval(e) for e in node.value.args[0].elts}
          vendored = json.load(open("src/watermark/agent/commit_vocabulary.json"))["verbs"]
          have = {"epistemic": set(), "operational": set()}
          for entry in vendored:
              have[entry["kind"]].add(entry["verb"])
          want = {
              "epistemic": lists["EPISTEMIC_VERBS"],
              "operational": lists["OPERATIONAL_VERBS"],
          }
          if have != want:
              for kind in ("epistemic", "operational"):
                  missing, extra = want[kind] - have[kind], have[kind] - want[kind]
                  if missing:
                      print(f"::error::{kind}: vendored copy is missing {sorted(missing)}")
                  if extra:
                      print(f"::error::{kind}: vendored copy has stale {sorted(extra)}")
              print("::error::Run 'mise run yidam-contract-sync'.")
              sys.exit(1)
          print(f"vendored commit vocabulary matches the pin ({len(vendored)} verbs)")
          PYEOF
          echo "vendored MCP contract matches ${{ steps.pin.outputs.commit }}"

      # The hard gate: every node carries a class and a label, and every edge resolves.
      - name: graph-check
        run: .yidam/bin/yidam graph-check

      # Gates against .yidam/lint-baseline.yml, not against zero. Inherited debt is
      # enumerable and only a REGRESSION fails — which is what keeps this gate switched on.
      # Re-bless deliberately with `yidam lint --bless` and review the diff.
      # Re-hashes whatever the shared cache holds and exits non-zero on anything that is not
      # what it claims. Cheap here and nearly always a no-op: a CI runner's cache is empty, so
      # this passes trivially. Kept anyway — it is the one step that would catch a poisoned cache
      # on a self-hosted or cache-restoring runner, and it costs nothing when there is nothing
      # to check. `hydrate` verifies the entry it is about to materialize for the same reason.
      - name: yidam vault verify (the cache is what it claims)
        run: .yidam/bin/yidam vault verify

      - name: lint (baseline ratchet)
        run: .yidam/bin/yidam lint

      # --- graph-export conformance (#2053) -----------------------------------------------
      #
      # These tests live in tests/ but SKIP without a yidam binary, and the `test` job has none —
      # so they would pass by skipping everywhere if they were not also run here, which is the
      # failure mode a conformance check must not have. The capability is asserted first: if the
      # binary cannot answer both formats the build fails loudly rather than skipping quietly.
      - name: Graph-export conformance vs the pinned binary
        run: |
          set -eu
          for fmt in graphml rdf; do
            if ! .yidam/bin/yidam export --list | grep -qE "^${fmt}[[:space:]]+✓"; then
              echo "::error::the installed yidam cannot export ${fmt} — the conformance tests"
              echo "::error::would SKIP rather than run. Build it with --features export-graph."
              .yidam/bin/yidam export --list
              exit 1
            fi
          done
          uv run pytest tests/test_graph_exports.py -q

      # --- how stale is the pin? ----------------------------------------------------------
      #
      # A REPORT, never a gate. This repo is entitled to stay pinned, and a build that goes red
      # because upstream moved is a build somebody switches off. It exists because staleness is
      # invisible from inside a derived repo: this integration was itself 59 commits and 49 days
      # behind before anyone measured it.
      - name: Report how far the pin has drifted
        continue-on-error: true
        run: |
          set -eu
          cd /tmp/yidam
          git fetch --quiet origin
          # No `|| echo 0`: a rev-list that fails knows nothing, and reporting that as 0 would
          # print "pin is current" — the opposite of what the step just found out.
          if ! behind=$(git rev-list --count "${{ steps.pin.outputs.commit }}..origin/HEAD" 2>/dev/null); then
            echo "::notice::could not compute drift against origin/HEAD; pin staleness unknown."
            exit 0
          fi
          if [ "$behind" -eq 0 ]; then
            echo "::notice::yidam pin is current with upstream."
            exit 0
          fi
          pinned_at=$(git log -1 --format=%at "${{ steps.pin.outputs.commit }}" 2>/dev/null || echo "")
          days=""
          [ -n "$pinned_at" ] && days=", pinned $(( ( $(date +%s) - pinned_at ) / 86400 )) day(s) ago"
          echo "::notice::yidam pin is $behind commit(s) behind upstream$days — re-pin .yidam.toml to adopt."

  # The required backend status check (#682): a thin aggregator over the three legs above.
  # It keeps the job name `check` (the gate keys on it — see .github/config/index.ts
  # `requiredChecks`) and `if: always()` so it ALWAYS reports a status, never stuck
  # pending. It passes only when each leg succeeded or was skipped — so a backend-untouched
  # PR (all legs skipped) is green, and any leg failing fails `check`. `test` is a matrix
  # (6 shards), so its rolled-up result is success only when every shard passed.
  check:
    needs: [changes, lint, types, catalog, test, corpus]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Roll up backend legs
        run: |
          echo "changes=${{ needs.changes.result }} lint=${{ needs.lint.result }} types=${{ needs.types.result }} catalog=${{ needs.catalog.result }} test=${{ needs.test.result }} corpus=${{ needs.corpus.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::the changes filter job did not succeed (result: ${{ needs.changes.result }})"
            exit 1
          fi
          for r in "${{ needs.lint.result }}" "${{ needs.types.result }}" "${{ needs.catalog.result }}" "${{ needs.test.result }}" "${{ needs.corpus.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a backend check leg did not pass (result: $r)"; exit 1 ;;
            esac
          done
          echo "All backend legs passed or were skipped."

  # Build the Astro/MDX site (Epic #54). Decoupled from the Python job: it
  # builds against the committed web/sites/ fixtures via WATERMARK_BUNDLE_DIR,
  # so no uv/LFS and no Python export are needed here. WATERMARK_SKIP_EXPORT tells the
  # watermarkBundle Vite plugin to skip its buildStart shell-out; WATERMARK_BUNDLE_DIR
  # points bundle.ts at the committed fixtures (an explicit opt-in — no longer a silent
  # fallback). The parity-gated Pages build (which runs the real export) is pages.yml.
  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    env:
      WATERMARK_SKIP_EXPORT: "1"
      WATERMARK_BUNDLE_DIR: sites
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup reads the version from the root package.json `packageManager`
      # field and must run BEFORE setup-node so `cache: pnpm` can find the store.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Run from the workspace root (not web/) so the single root lockfile drives the
      # whole install; the job's working-directory: web still governs the build steps.
      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Lint + format (Biome)
        run: pnpm run lint

      - name: Type check
        run: pnpm run check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Check internal links
        run: pnpm run check:links

      - name: Check route budgets
        run: pnpm run check:routes

      # The #2005 cross-site scope guard: no site may publish another site's record under its own
      # URL. It was wired into `mise run //web:check` but never added here, so between #2005 and
      # #2026 it ran in no CI job at all — while locally a vitest failure aborted the gate before
      # it. Promotion is exactly when a leak is most likely, and this is the only check that can
      # see one: it reads the emitted `dist/`, because three source-level heuristics were tried
      # first and each both missed real leaks and flagged correct pages.
      - name: Check site scope
        run: pnpm run check:site-scope

      # The #2149 publish-gate guard: `/published-documents.json` is the only thing between a
      # reader and a source byte, it is network-global, and the feed it is built from is per-site —
      # so it shipped carrying one site's set while the build offered every site's. Reads `dist/`
      # for the same reason as the check above: a site whose export omits its documents feed drops
      # out of the union in silence, and only the emitted asset knows.
      - name: Check the publish gate reaches every site
        run: pnpm run check:doc-gate

  # Repo-wide Markdown lint (markdownlint-cli2). Node, but separate from the Astro
  # frontend job — it lints hand-authored docs across the repo (data/, docs/, root, …),
  # not the site. Config + ignores (generated docs, frontend, notebooks) live in
  # .markdownlint-cli2.yaml, which also sets gitignore:true.
  markdown:
    needs: changes
    if: ${{ needs.changes.outputs.markdown == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Only the root tooling package is needed here — `--filter` skips the heavy web
      # tree (astro/deck.gl) so a Markdown lint doesn't install the whole site.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter bosc-repo-tools

      # `pnpm exec` runs the workspace-pinned markdownlint-cli2 (retires the old `npx`
      # foot-gun that could pull a newer version than the lockfile).
      - name: Markdown lint
        run: pnpm exec markdownlint-cli2

      # The root config ignores `web/**` — the Astro site owns its own toolchain — so web/'s
      # hand-authored .md (the package READMEs, sites/README.md) was linted by nothing. Its
      # own config carries the same rules; `pnpm exec` from a member dir still resolves the
      # workspace-root bin, so the `--filter bosc-repo-tools` install above is enough.
      - name: Markdown lint (web/)
        run: pnpm exec markdownlint-cli2
        working-directory: web
