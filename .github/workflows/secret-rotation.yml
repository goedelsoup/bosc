# Secret-rotation cadence tracker (#1539).
#
# The cadence defined in deploy/SECRETS.md has to live somewhere that isn't a "last rotated"
# column in a Markdown table — a hand-maintained date column goes stale in one quarter and
# then lies. So the cadence is a scheduled job that opens a dated checklist issue, and the
# ISSUE is the record: closing it attests that the quarter's rotation happened, and the
# issue history is the audit trail.
#
# Quarterly (Jan/Apr/Jul/Oct): ANTHROPIC_API_KEY + TURNSTILE_SECRET_KEY.
# The January issue also carries the annual items (TIPS_APP_PRIVATE_KEY, HONEYCOMB_API_KEY,
# CLOUDFLARE_API_TOKEN).
#
# It opens an issue; it never rotates anything. Rotation is an operator running
# `deploy/rotate.sh` with the provider consoles open — the ordering in SECRETS.md needs a
# human on both ends (issue the new value upstream, revoke the old one after verifying),
# and a job that could rotate TURNSTILE_SECRET_KEY unattended could take both public forms
# down on a cron.

name: Secret rotation (cadence)

on:
  schedule:
    # 09:00 UTC on the 1st of Jan / Apr / Jul / Oct.
    - cron: "0 9 1 */3 *"
  workflow_dispatch:
    inputs:
      include_annual:
        description: "Include the annual-cadence secrets (default: only in January)"
        type: boolean
        default: false

permissions:
  issues: write

jobs:
  open-checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Open (or find) this period's rotation issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE_ANNUAL: ${{ inputs.include_annual }}
        run: |
          set -euo pipefail

          year=$(date -u +%Y)
          month=$(date -u +%-m)
          quarter=$(( (month - 1) / 3 + 1 ))
          title="Secret rotation — ${year} Q${quarter}"

          # Idempotent: a re-run (or a manual dispatch in the same quarter) must not open a
          # second issue. Enumerate the open chore issues and match the title exactly rather
          # than using `--search`, whose index lags behind issue creation by minutes.
          existing=$(gh issue list --state open --label "type:chore" --limit 200 \
            --json number,title \
            --jq "[.[] | select(.title == \"${title}\")][0].number // empty")
          if [ -n "$existing" ]; then
            echo "Already open: #${existing}"
            exit 0
          fi

          {
            echo "Quarterly secret rotation for the \`watermark-deploy\` Pulumi stack."
            echo "Procedure, per-secret ordering, and the verification tiers:"
            echo "[\`deploy/SECRETS.md\`](../blob/main/deploy/SECRETS.md)."
            echo
            echo "**Do not revoke an old value before \`./deploy/rotate.sh verify\` passes on the new one.**"
            echo
            echo "## Quarterly"
            echo
            echo "- [ ] \`ANTHROPIC_API_KEY\` — new key in the Anthropic Console → \`./deploy/rotate.sh set anthropicApiKey\` → \`verify --deep\` → delete the old key"
            echo "- [ ] \`TURNSTILE_SECRET_KEY\` — \`./deploy/rotate.sh turnstile\`; **finish inside the 2-hour grace window** (it gates /api/submit *and* /api/ask, and cannot be re-rotated until the window closes)"
            if [ "$month" = "1" ] || [ "${FORCE_ANNUAL}" = "true" ]; then
              echo
              echo "## Annual"
              echo
              echo "- [ ] \`TIPS_APP_PRIVATE_KEY\` — generate a second App key, convert to PKCS#8, \`./deploy/rotate.sh set tipsAppPrivateKey < key.pk8.pem\`, then delete the old one"
              echo "- [ ] \`HONEYCOMB_API_KEY\` — **three** copies: the Pages secret, the \`HONEYCOMB_API_KEY\` Actions secret, and local \`.env\` files"
              echo "- [ ] \`CLOUDFLARE_API_TOKEN\` — the Actions secret; re-check its scopes (KV / Turnstile / Pages / R2 Edit + Turnstile Sites Write)"
            fi
            echo
            echo "## Off-cadence — rotate only if triggered"
            echo
            echo "- \`EARLY_ACCESS_SECRET\` — rotation *is* the revocation mechanism; no hygiene schedule"
            echo "- \`storiesLakebaseUrl\` — driven by Databricks token expiry (#1138), not by this cadence"
            echo "- \`githubWebhookSecret\`, \`unsubSecret\` — on compromise only (both have a user-visible cost and no overlap window)"
            echo
            echo "## Close-out"
            echo
            echo "- [ ] \`./deploy/rotate.sh verify\` green, and every old value revoked"
            echo
            echo "Opened automatically by [\`secret-rotation.yml\`](../blob/main/.github/workflows/secret-rotation.yml)."
          } > /tmp/rotation-issue.md

          url=$(gh issue create --title "$title" --body-file /tmp/rotation-issue.md \
            --label "area:core" --label "type:chore")
          echo "Opened $url"
