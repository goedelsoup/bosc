# Cloudflare Pages config for the Watermark Directory (Epic #56, Phase 1 — host migration).
#
# The static Astro build (web/dist) and the Pages Functions (web/functions/,
# the submissions endpoint #74) deploy together to one origin. The deploy runs from the
# Actions workflow (.github/workflows/pages.yml) via Wrangler direct-upload — Cloudflare's
# own Git build is NOT used, because the content bundle is produced by `watermark export`
# (Python) before `npm run build`, which that build can't run.
#
# Env vars: this Wrangler file is the SOURCE OF TRUTH. Cloudflare Pages makes wrangler.toml
# authoritative on `wrangler pages deploy` — the `[vars]` here REPLACE (do not merge with)
# anything set on the project via the dashboard or Pulumi, and any var NOT listed here is
# STRIPPED from the deployment. So the plaintext feature toggles must live here to take
# effect; a value set only by `pulumi up` never reaches the deployed Functions. The flags
# below mirror deploy/features.yaml — keep the two in sync (Pulumi still owns provisioning).
# https://developers.cloudflare.com/pages/functions/wrangler-configuration/#source-of-truth
#
# SECRETS (TIPS_APP_PRIVATE_KEY, TURNSTILE_SECRET_KEY, ANTHROPIC_API_KEY, HONEYCOMB_API_KEY,
# the Cognito client secret, …) and DYNAMIC resource outputs (COGNITO_* IDs/domains,
# PUBLIC_TURNSTILE_SITE_KEY) can't be committed here — set them with `wrangler pages secret
# put <NAME>` / as Pages env vars out-of-band; Pages secrets persist across deploys.
#
# KV bindings and R2 bindings are also set here: they are wrangler-level bindings whose
# namespace IDs come from `pulumi stack output` (wire them in after each first `pulumi up`).
# See the comments below for each binding.

name = "the-watermark-directory"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"
# postgres.js (functions/api/_lib/pg.ts, the Stories/AUTH Lakebase driver) statically imports
# node:events / node:buffer / node:stream, so the Functions bundle needs the Node built-in
# aliases at publish time — even though Stories/AUTH ship dark. Requires compatibility_date
# >= 2024-09-23 (satisfied above). Without this, `wrangler pages deploy` fails at publish with
# 'No such module "node:events"'.
compatibility_flags = ["nodejs_compat"]

[vars]

# --- Repo target (submissions endpoint) -------------------------------------------
# The GitHub owner/repo /api/submit files issues into (also defaulted in submit.ts).
GITHUB_OWNER = "watermark-directory"
GITHUB_REPO = "the-watermark-directory"

# --- Feature toggles — MIRROR deploy/features.yaml --------------------------------
# Each *_ENABLED gates a Pages Function server-side; each PUBLIC_* peer is read by the Astro
# build for build-time UI injection. wrangler.toml is authoritative on deploy, so a flag set
# only by `pulumi up` never reaches the Functions — keep this list in sync with
# deploy/features.yaml (see the file header on precedence).
PRE_LAUNCH_ENABLED = "false"
SUBMISSIONS_ENABLED = "true"
ASK_ENABLED = "true"
DOCS_ENABLED = "true"
MCP_ENABLED = "true"
RUM_ENABLED = "true"
PUBLIC_RUM_ENABLED = "true"
AUTH_ENABLED = "true"               # Cognito gate — requires the identifiers in the next block
STORIES_ENABLED = "false"
PUBLIC_STORIES_ENABLED = "false"
CONTACTS_ENABLED = "false"
PUBLIC_CONTACTS_ENABLED = "false"

# --- Cognito auth identifiers (#919) ----------------------------------------------
# Non-secret plaintext ids AUTH_ENABLED depends on. `wrangler pages deploy` STRIPS any
# plaintext var not listed here, so values set only by `pulumi up` get dropped — that omission
# made /api/submit 500 "endpoint is misconfigured" (submit.ts:89) and broke the OAuth
# token/refresh flow. Not secrets (COGNITO_CLIENT_ID also ships to the browser as
# PUBLIC_COGNITO_CLIENT_ID). Pulumi still writes the same values to the project (deploy/index.ts)
# — wrangler's copy wins on deploy; keep the two ids in sync with `pulumi stack output` if the
# pool is recreated. The client SECRET stays a Wrangler secret; PUBLIC_COGNITO_* are build-time
# CI vars (pages.yml), not runtime.
# NOTE: APP_BASE_URL is the live origin AND the OAuth redirect_uri base — it must match a
# callbackUrl on the Cognito app client, which Pulumi derives from `siteDomain` (deploy/index.ts).
# Setting APP_BASE_URL here without `siteDomain` set in Pulumi ⇒ redirect_uri mismatch at login.
COGNITO_REGION = "us-east-2"
COGNITO_USER_POOL_ID = "us-east-2_2d6JQGMLo"                        # pulumi stack output cognitoUserPoolId
COGNITO_CLIENT_ID = "45rgjn6tneevilq2de14ctk9il"                   # pulumi stack output cognitoClientId
COGNITO_DOMAIN = "watermark-auth.auth.us-east-2.amazoncognito.com"  # Cognito Hosted UI domain
APP_BASE_URL = "https://the.watermark.directory"                    # live site origin

# --- Optional overrides (code has defaults; uncomment to change) ------------------
# Per-IP submission rate limit — defaults 5 / 3600s:
# RATE_LIMIT_MAX = "5"
# RATE_LIMIT_WINDOW_SEC = "3600"

# Per-IP rate limiting (Phase 5) is opt-in: the Function degrades gracefully until a KV
# namespace is bound here as RATE_LIMIT. Create one and fill in the printed id:
#   npx wrangler kv namespace create RATE_LIMIT
# then uncomment:
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "3149546b7a874aa99c3e94d31412815d"

# --- Submissions: file attachments (#243) -----------------------------------------
# R2 bucket for pre-uploaded submission attachments (/api/attach → /api/submit).
# Missing → /api/attach returns 503; /api/submit silently drops any attachment_keys.
# SUBMISSION_ATTACHMENTS is separate from DOCS to keep evidence-chain isolation intact.
#   npx wrangler r2 bucket create watermark-submission-attachments
#   npx wrangler r2 bucket create watermark-submission-attachments-dev
[[r2_buckets]]
binding = "SUBMISSION_ATTACHMENTS"
bucket_name = "watermark-submission-attachments"
preview_bucket_name = "watermark-submission-attachments-dev"
#
# Optional size cap (default 10 MB):
# ATTACH_MAX_BYTES = "10485760"

# --- Submissions: notify-on-submit (#244) -----------------------------------------
# Comma-separated GitHub logins to assign on every new submission issue (not dedupe
# hits). Assignees receive GitHub's standard notification email. Written by `pulumi up`
# from bosc-deploy:notifyGithubUsers (plain text):
#   pulumi config set bosc-deploy:notifyGithubUsers "goedelsoup"
# (Comma-separate for multiple: "goedelsoup,other-maintainer")

# --- Ask the corpus (/api/ask, Epic #207) -----------------------------------------
# Non-secret knobs for the ask endpoint. The model + caps also default in code, so this
# is documentation + override. ASK_ENABLED (kill switch) and secrets are written by
# `pulumi up` — not set here or in the dashboard. See docs/ask-api.md.
# ASK_MODEL = "claude-opus-4-8"
# ASK_MAX_TOKENS = "1024"          # hard answer-length cap (cost guard)
# ASK_TOP_K = "6"                  # retrieval depth over the ask-index
# ASK_RATE_LIMIT_MAX = "10"        # per-IP questions per window ("0" = block all)
# ASK_RATE_LIMIT_WINDOW_SEC = "3600"
# ASK_DAILY_TOKEN_BUDGET = "200000"  # account-wide daily total-token cap, input+output ("0" = hard stop)
# ASK_PLUGIN_TOKEN — SECRET (not set here). The shared Bearer service token that lets a ChatGPT
#   plugin / GPT Action bypass Turnstile on /api/ask (#1578; see /.well-known/ai-plugin.json +
#   /openapi.yaml). Absent ⇒ no bypass, so Turnstile stays required. The per-IP rate limit and
#   daily budget above still gate plugin traffic. Set out-of-band like the other secrets:
#     wrangler pages secret put ASK_PLUGIN_TOKEN

# --- Hybrid semantic retrieval (Workers AI, #329, #1586) --------------------------
# Binding the Workers AI service enables embedding-based hybrid (BM25 + vector) retrieval for
# BOTH the /api/ask endpoint and the /api/mcp search_corpus tool (#1586) — the binding is shared
# across all Pages Functions. Without it each degrades gracefully to BM25-only keyword retrieval.
# The query is encoded at runtime with @cf/sentence-transformers/all-minilm-l6-v2 (384 dims),
# the same model `bosc export` uses to precompute document vectors (skip with --no-embeddings).
# Uncomment once `bosc export` has been run and the bundle (with ask-embeddings.json) is deployed:
# [ai]
# binding = "AI"

# The ask endpoint is FAIL-CLOSED (#587): with ASK_ENABLED="true" but no budget KV bound it
# returns 503 rather than allow unbounded paid model spend behind Turnstile alone. Bind a KV
# (below) before go-live, OR set ASK_ALLOW_UNCAPPED = "true" to deliberately run uncapped.
# The per-IP rate limit reads ASK_RATE_LIMIT; the daily budget reads ASK_BUDGET and falls back
# to ASK_RATE_LIMIT, so binding the one namespace below enforces both.
#   npx wrangler kv namespace create ASK_RATE_LIMIT
# [[kv_namespaces]]
# binding = "ASK_RATE_LIMIT"
# id = "<namespace-id>"
# Optional: a distinct budget counter (enables the daily cap without per-IP limiting):
# [[kv_namespaces]]
# binding = "ASK_BUDGET"
# id = "<namespace-id>"

# --- MCP Streamable HTTP transport (/api/mcp, Epic #910) --------------------------
# Session storage for the MCP endpoint (#911). Ships dark (MCP_ENABLED kill switch in
# deploy/features.yaml defaults false). Create the KV namespace and fill in the id;
# flip mcp: true in features.yaml + pulumi up to go live:
#   npx wrangler kv namespace create MCP_SESSIONS
# then uncomment:
# [[kv_namespaces]]
# binding = "MCP_SESSIONS"
# id = "<namespace-id>"
# Optional per-IP rate-limit for the MCP endpoint:
# [[kv_namespaces]]
# binding = "MCP_RATE_LIMIT"
# id = "<namespace-id>"
#
# Bearer-key registry (#916): hashed API keys → {owner, tier, created_at, revoked}.
# Missing → all Bearer tokens fall through as public (no KV = no key management yet).
#   npx wrangler kv namespace create MCP_KEYS
# [[kv_namespaces]]
# binding = "MCP_KEYS"
# id = "<namespace-id>"
#
# Daily output-token budget (#912). MCP_BUDGET_ENABLED="true" activates enforcement;
# with it set but no KV bound the endpoint fails closed. MCP_ALLOW_UNCAPPED="true" bypasses
# for local dev. Public cap defaults to 100k tokens/day; keyed cap defaults to 500k/day.
# Set in the dashboard (not here — kill switch must be operator-flippable without redeploy):
#   MCP_BUDGET_ENABLED = "true"
#   MCP_BUDGET_PUBLIC_DAILY = "100000"
#   MCP_BUDGET_KEY_DAILY = "500000"
#   MCP_ALLOW_UNCAPPED = "true"   # local dev only
#   npx wrangler kv namespace create MCP_BUDGET
# [[kv_namespaces]]
# binding = "MCP_BUDGET"
# id = "<namespace-id>"

# --- Cognito auth (Epic #919) -----------------------------------------------------
# The non-secret Function-runtime Cognito vars (AUTH_ENABLED, COGNITO_REGION,
# COGNITO_USER_POOL_ID, COGNITO_CLIENT_ID, COGNITO_DOMAIN, APP_BASE_URL) MUST live in the
# `[vars]` block above: `wrangler pages deploy` is authoritative and strips any plaintext var
# not listed in this file, so a value set only by `pulumi up` never reaches the deployed
# Functions (this is what made /api/submit 500 "endpoint is misconfigured"). Pulumi still
# writes the same values to the project (deploy/index.ts) — harmless, wrangler's copy wins on
# deploy. Keep the two ids in `[vars]` in sync with `pulumi stack output` if the pool is
# recreated. The PUBLIC_COGNITO_* peers are BUILD-TIME (Astro import.meta.env) — set them as CI
# repo vars in .github/workflows/pages.yml, not here (wrangler [vars] land at runtime, after the
# build). COGNITO_CLIENT_SECRET is a real secret: `wrangler pages secret put` (persists).
# To activate auth: set authEnabled=true in Pulumi config + flip auth: true in features.yaml.
# See deploy/Pulumi.prod.yaml for the full runbook and docs/auth.md for the auth layer.
#
# JWKS_CACHE KV: caches Cognito's public-key document (1-hour TTL). Binding ID comes
# from `pulumi stack output jwksCacheKvNamespaceId`. Create once if not already created:
#   npx wrangler kv namespace create JWKS_CACHE
# [[kv_namespaces]]
# binding = "JWKS_CACHE"
# id = "<from pulumi stack output jwksCacheKvNamespaceId>"
#
# AUTH prefs + role audit: per-user profile + notification prefs + the role-change audit trail
# (Epic #921 / #1171). Moved OFF KV onto Databricks Lakebase (Postgres) — durable identity data, not
# edge-ephemeral state, and the audit trail is append-only history meant to be queried across records
# (see the Stories store block below for the Hyperdrive→Lakebase mechanics). Reuses the SAME Lakebase
# instance + Hyperdrive config as Stories: bind `AUTH_HYPERDRIVE` to the same Hyperdrive `id` as
# STORIES_HYPERDRIVE (one provisioned config over one database — see web/migrations/0004). Absent →
# the account/audit endpoints return 503 (fail-closed, same as the old KV-absent path). Uncomment
# alongside STORIES_HYPERDRIVE when the Lakebase milestone lands:
# [[hyperdrive]]
# binding = "AUTH_HYPERDRIVE"
# id = "<same as storiesHyperdriveId>"

# --- Browser RUM (#961) ----------------------------------------------------------
# Two kill switches must both be on for events to reach Honeycomb:
#   RUM_ENABLED        — controls the /api/rum beacon server-side
#   PUBLIC_RUM_ENABLED — controls Astro build-time script injection
# Both are set from the single `rum` flag in deploy/features.yaml via `pulumi up`.
#
# /api/rum always returns 204; upstream errors and rate-limit blocks are absorbed —
# the browser must not retry on a non-2xx.
#
# Rate limiting (per-IP, 60 events / 60 s). Create the KV once, then uncomment:
#   npx wrangler kv namespace create RUM_RATE_LIMIT
# [[kv_namespaces]]
# binding = "RUM_RATE_LIMIT"
# id = "<namespace-id>"
#
# HONEYCOMB_API_KEY is written by `pulumi up` (shared with backend OTel setup, #959).
# Dataset defaults to "watermark-browser"; override by setting RUM_HONEYCOMB_DATASET
# as an additional plain-text env var on the Pages project (dashboard or Pulumi).

# --- Source documents object store (/api/doc, Epic #274) --------------------------
# R2 bucket holding the corpus bytes that the /api/doc Pages Function (#278) streams.
# Populated by `watermark objectstore sync` (#279). The DOCS_ENABLED kill switch lives in
# deploy/features.yaml (flip docs: true + pulumi up). Create the buckets once:
#   npx wrangler r2 bucket create watermark-documents
#   npx wrangler r2 bucket create watermark-documents-dev
# See docs/object-store.md for the full runbook (S3 credentials, the sync tool, dev loop).
[[r2_buckets]]
binding = "DOCS"
bucket_name = "watermark-documents"
preview_bucket_name = "watermark-documents-dev"

# --- User-authored Stories store (/api/stories, Epic #1090 / #1095) ---------------
# Databricks Lakebase (managed Postgres) is the FIRST relational store — the repo was KV/R2 only.
# The Workers runtime can't open a raw Postgres socket to Lakebase directly, so the /api/stories
# Functions reach it through a Cloudflare **Hyperdrive** binding (pooling + `cloudflare:sockets`),
# via postgres.js (functions/api/_lib/pg.ts). Ships dark: the STORIES_ENABLED kill switch lives in
# deploy/features.yaml (flip stories: true + pulumi up), and with STORIES_ENABLED="true" but no
# Hyperdrive bound the endpoints return 503 (fail-closed).
#
# Provision once: create the Lakebase database instance in Databricks, apply web/migrations/*.sql to
# it (psql / the Databricks SQL editor), then create a Hyperdrive config over its Postgres connection
# string (Databricks issues a short-lived OAuth token as the password — store it as a Wrangler secret,
# don't commit it). The `id` comes from `pulumi stack output storiesHyperdriveId` after wiring the
# Hyperdrive config into deploy/index.ts, mirroring the KV namespaces above. Then uncomment:
#   npx wrangler hyperdrive create watermark-stories --connection-string="postgres://..."
# [[hyperdrive]]
# binding = "STORIES_HYPERDRIVE"
# id = "<from pulumi stack output storiesHyperdriveId>"
#
# Optional per-IP write rate-limit (defaults 20 / 3600s in code); reuses the RATE_LIMIT KV:
# STORIES_RATE_LIMIT_MAX = "20"
# STORIES_RATE_LIMIT_WINDOW_SEC = "3600"
