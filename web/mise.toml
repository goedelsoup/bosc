# mise tasks for the `web` project (the Astro site, @watermark/site) — part of the BOSC
# monorepo (root mise.toml declares `[monorepo] config_roots = ["web"]`). It's pure Node:
# no uv/LFS, builds against the committed sites/ offline. The site is one member of a
# pnpm workspace rooted at web/ — see web/README.md for the package map (Epic #1549).
#
# Run from inside web/ with a bare name (`mise run dev`), or from anywhere with the
# project path (`mise run //web:dev`). The node version is inherited from the root
# [tools]. These wrap the package.json scripts so backend and web share one verb set.

# web-only tools (node still comes from the root). wrangler is mise-managed here — NOT an
# npm devDependency — so it's pinned + isolated without bloating `pnpm install` or the frontend
# CI job (which uses setup-node, not mise). Used only by `dev:stack` (the local Functions stack).
[tools]
"npm:wrangler" = "4"

[tasks.install]
description = "Install frontend deps (clean, lockfile-exact) — installs the whole pnpm workspace"
# pnpm run from a member dir resolves the repo-root workspace and installs every member
# (root tooling + web), so this doubles as the whole-repo Node install. --frozen-lockfile
# is the `npm ci` equivalent: it fails rather than mutating the committed pnpm-lock.yaml.
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Run the Astro dev server (hot reload) — static pages only, no Pages Functions"
run = "pnpm run dev"

[tasks."dev:stack"]
description = "Full local stack: astro build + wrangler pages dev (runs /api/submit·ask·doc) with mocked externals"
run = "pnpm run dev:stack"

[tasks.check]
description = "Frontend gate (CI parity): Biome lint + Markdown lint + astro/tsc types + vitest + build + link check"
# Skip the Python export and point bundle.ts at the committed sites/ fixtures.
# sites is an explicit opt-in here — not a silent fallback from bundle.ts.
env = { WATERMARK_SKIP_EXPORT = "1", WATERMARK_BUNDLE_DIR = "sites" }
run = [
  "pnpm run lint",        # Biome (format + lint) — the gate CI runs that `pnpm run check` omits
  "pnpm exec markdownlint-cli2",   # web/'s Markdown (config: web/.markdownlint-cli2.yaml)
  "pnpm run check",       # astro check + tsc (functions)
  "pnpm test",            # vitest
  "pnpm run build",       # astro build against sites/ (offline, no Python)
  "pnpm run check:links", # internal-link check over the build
]

[tasks.test]
description = "Frontend tests only (vitest)"
run = "pnpm test"

[tasks.lint]
description = "Frontend lint only (Biome ci — format + lint gate)"
run = "pnpm run lint"

# The repo-root `.markdownlint-cli2.yaml` ignores `web/**` (this project owns its own
# toolchain), which left web/'s hand-authored .md linted by nothing. Same rule set,
# scoped here — see web/.markdownlint-cli2.yaml. Biome doesn't lint Markdown.
[tasks.markdown]
description = "Frontend Markdown lint only (markdownlint-cli2 over web/**/*.md)"
run = "pnpm exec markdownlint-cli2"

[tasks.types]
description = "Frontend type-check only (astro check + tsc)"
run = "pnpm run check"

[tasks.build]
description = "Build the static site (astro build → dist/)"
run = "pnpm run build"

[tasks.links]
description = "Check internal links over the build"
run = "pnpm run check:links"

[tasks.fmt]
description = "Auto-fix the frontend: Biome (format + safe lint fixes) + Markdown"
run = [
  "pnpm run format",
  "pnpm exec markdownlint-cli2 --fix",
]

[tasks.preview]
description = "Serve the built site locally (astro preview)"
run = "pnpm run preview"
